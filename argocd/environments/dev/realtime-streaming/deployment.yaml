apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-streaming-collector
  namespace: ats-dev
  labels:
    app: realtime-streaming-collector
    component: data-collection
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: realtime-streaming-collector
  template:
    metadata:
      labels:
        app: realtime-streaming-collector
        component: data-collection
    spec:
      serviceAccountName: ats-data-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: streaming-collector
        image: ats-realtime-collector:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: ats-dev-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ats-dev-config
              key: LOG_LEVEL
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: ats-dev-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: ats-dev-config
              key: DATABASE_PORT
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: ats-dev-config
              key: DATABASE_NAME
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DATABASE_PASSWORD
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: vendor-api-keys
              key: POLYGON_API_KEY
        - name: TIINGO_API_KEY
          valueFrom:
            secretKeyRef:
              name: vendor-api-keys
              key: TIINGO_API_KEY
        - name: FMP_API_KEY
          valueFrom:
            secretKeyRef:
              name: vendor-api-keys
              key: FMP_API_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /app/logs
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: logs-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-streaming-collector
  namespace: ats-dev
  labels:
    app: realtime-streaming-collector
spec:
  selector:
    app: realtime-streaming-collector
  ports:
  - name: http
    port: 8080
    targetPort: http
  - name: metrics
    port: 9090
    targetPort: metrics
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ats-data-collector
  namespace: ats-dev
  labels:
    app: ats-data-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ats-data-collector
  namespace: ats-dev
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ats-data-collector
  namespace: ats-dev
subjects:
- kind: ServiceAccount
  name: ats-data-collector
  namespace: ats-dev
roleRef:
  kind: Role
  name: ats-data-collector
  apiGroup: rbac.authorization.k8s.io