apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-realtime-validation
  labels:
    app: daily-realtime-validation
    component: validation
spec:
  schedule: "0 20 * * *"  # 8:00 PM EST daily
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400  # 24 hours
      template:
        metadata:
          labels:
            app: daily-realtime-validation
            component: validation
          annotations:
            prometheus.io/scrape: "false"
        spec:
          restartPolicy: Never
          serviceAccountName: validation-job-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
          - name: validation-job
            image: ats-realtime-collector:latest
            command: ["python", "-m", "market_data.realtime.daily_validation"]
            env:
            - name: ENVIRONMENT
              value: "dev"
            - name: VALIDATION_DATE
              value: "yesterday"
            - name: MAX_VALIDATION_SYMBOLS
              value: "50"
            - name: PRICE_TOLERANCE_PERCENT
              value: "0.01"
            - name: ENABLE_SLACK_ALERTS
              value: "true"
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: ats-dev-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: ats-dev-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: ats-dev-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_PASSWORD
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vendor-api-keys
                  key: POLYGON_API_KEY
            - name: TIINGO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vendor-api-keys
                  key: TIINGO_API_KEY
            - name: FMP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vendor-api-keys
                  key: FMP_API_KEY
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"
            volumeMounts:
            - name: validation-config
              mountPath: /app/config
              readOnly: true
          volumes:
          - name: validation-config
            configMap:
              name: validation-config

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gap-detection-backfill
  labels:
    app: gap-detection-backfill
    component: backfill
spec:
  schedule: "*/30 9-17 * * 1-5"  # Every 30 minutes during market hours
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600  # 1 hour
      template:
        metadata:
          labels:
            app: gap-detection-backfill
            component: backfill
        spec:
          restartPolicy: Never
          serviceAccountName: backfill-job-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
          - name: gap-detection-job
            image: ats-realtime-collector:latest
            command: ["python", "-m", "market_data.realtime.gap_detector"]
            env:
            - name: ENVIRONMENT
              value: "dev"
            - name: GAP_THRESHOLD_MINUTES
              value: "5"
            - name: CRITICAL_GAP_MINUTES
              value: "15"
            - name: MAX_BACKFILL_SYMBOLS
              value: "100"
            - name: ENABLE_AUTO_BACKFILL
              value: "true"
            - name: MARKET_HOURS_ONLY
              value: "true"
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: ats-dev-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: ats-dev-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: ats-dev-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_PASSWORD
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vendor-api-keys
                  key: POLYGON_API_KEY
            - name: TIINGO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vendor-api-keys
                  key: TIINGO_API_KEY
            - name: FMP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vendor-api-keys
                  key: FMP_API_KEY
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "250m"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-comprehensive-backfill
  labels:
    app: weekly-comprehensive-backfill
    component: backfill
spec:
  schedule: "0 2 * * 6"  # Saturday at 2:00 AM EST
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800  # 7 days
      template:
        metadata:
          labels:
            app: weekly-comprehensive-backfill
            component: backfill
        spec:
          restartPolicy: Never
          serviceAccountName: backfill-job-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
          - name: weekly-backfill-job
            image: ats-realtime-collector:latest
            command: ["python", "-m", "market_data.realtime.weekly_backfill"]
            env:
            - name: ENVIRONMENT
              value: "dev"
            - name: BACKFILL_START_DATE
              value: "auto"  # Automatically determine start date
            - name: BACKFILL_END_DATE
              value: "yesterday"
            - name: MAX_CONCURRENT_JOBS
              value: "5"
            - name: CHUNK_SIZE_DAYS
              value: "1"
            - name: MAX_RETRY_ATTEMPTS
              value: "3"
            - name: ENABLE_PROGRESS_TRACKING
              value: "true"
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: ats-dev-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: ats-dev-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: ats-dev-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_PASSWORD
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vendor-api-keys
                  key: POLYGON_API_KEY
            - name: TIINGO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vendor-api-keys
                  key: TIINGO_API_KEY
            - name: FMP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vendor-api-keys
                  key: FMP_API_KEY
            resources:
              requests:
                memory: "1Gi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "1000m"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validation-job-sa
  labels:
    component: validation
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backfill-job-sa
  labels:
    component: backfill
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: validation-config
  labels:
    component: validation
data:
  validation.yaml: |
    validation:
      price_tolerance_percent: 0.01
      max_symbols: 50
      enable_alerts: true
      alert_channels:
        - slack
        - email
      
    comparison:
      vendors:
        - polygon
        - tiingo
        - fmp
      metrics:
        - price_accuracy
        - data_completeness
        - latency_analysis
        
    reporting:
      generate_summary: true
      store_results: true
      retention_days: 90