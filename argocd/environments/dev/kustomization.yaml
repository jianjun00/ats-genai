apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: ats-dev
  annotations:
    config.kubernetes.io/local-config: "true"

namespace: ats-dev

commonLabels:
  app.kubernetes.io/part-of: ats-platform
  environment: dev
  managed-by: argocd

resources:
  # Core application components
  - realtime-streaming/
  - analytics-api/
  - monitoring/
  - database/
  
  # Shared infrastructure
  - ../../base/rbac/
  - ../../base/network-policies/

configMapGenerator:
  - name: ats-dev-config
    literals:
      - ENVIRONMENT=dev
      - LOG_LEVEL=DEBUG
      - PROMETHEUS_ENDPOINT=http://prometheus-service:9090
      - GRAFANA_ENDPOINT=http://grafana-service:3000
      - DATABASE_HOST=postgres-simple
      - DATABASE_PORT=5432
      - DATABASE_NAME=dev_db
      - REDIS_HOST=redis-service
      - REDIS_PORT=6379
      - MAX_CONCURRENT_JOBS=10
      - UNIVERSE_SIZE=100
      - MARKET_HOURS_ONLY=false
      - ENABLE_DEBUG_LOGGING=true

secretGenerator:
  - name: vendor-api-keys
    type: Opaque
    literals:
      - POLYGON_API_KEY=REPLACE_WITH_ACTUAL_POLYGON_KEY
      - TIINGO_API_KEY=REPLACE_WITH_ACTUAL_TIINGO_KEY  
      - FMP_API_KEY=REPLACE_WITH_ACTUAL_FMP_KEY
    options:
      disableNameSuffixHash: true
      
  - name: database-credentials
    type: Opaque
    literals:
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=REPLACE_WITH_ACTUAL_DB_PASSWORD
    options:
      disableNameSuffixHash: true

patches:
  # Development-specific patches
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: realtime-streaming-collector
      
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
    target:
      kind: Deployment
      name: realtime-streaming-collector
      
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DEBUG_MODE
          value: "true"
    target:
      kind: Deployment
      name: realtime-streaming-collector

images:
  - name: ats-realtime-collector
    newName: ghcr.io/your-org/ats-platform
    newTag: latest
  - name: ats-analytics-api
    newName: ghcr.io/your-org/ats-platform/analytics-api
    newTag: latest

replicas:
  - name: realtime-streaming-collector
    count: 1
  - name: prometheus
    count: 1
  - name: grafana
    count: 1