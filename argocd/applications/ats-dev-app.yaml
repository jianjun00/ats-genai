apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ats-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: ats-platform
    app.kubernetes.io/component: application
    environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ats-platform
  
  source:
    repoURL: https://github.com/your-org/ats-gitops
    targetRevision: main
    path: environments/dev
    
  destination:
    server: https://kubernetes.default.svc
    namespace: ats-dev
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
        
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: realtime-streaming-collector
      jsonPointers:
        - /spec/replicas
    - group: batch
      kind: CronJob
      jsonPointers:
        - /spec/schedule
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
        
  info:
    - name: 'Description'
      value: 'ATS Platform Development Environment'
    - name: 'Repository'
      value: 'https://github.com/your-org/ats-platform'
    - name: 'Environment'
      value: 'Development'
      
  revisionHistoryLimit: 10

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ats-platform
  namespace: argocd
  labels:
    app.kubernetes.io/name: ats-platform
spec:
  description: ATS Platform Project for all environments
  
  sourceRepos:
    - 'https://github.com/your-org/ats-gitops'
    - 'https://github.com/your-org/ats-platform'
    
  destinations:
    - namespace: ats-dev
      server: https://kubernetes.default.svc
    - namespace: ats-staging  
      server: https://kubernetes.default.svc
    - namespace: ats-prod
      server: https://kubernetes.default.svc
      
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
    - group: 'monitoring.coreos.com'
      kind: ServiceMonitor
    - group: 'networking.k8s.io'
      kind: NetworkPolicy
      
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: PersistentVolumeClaim
    - group: 'apps'
      kind: Deployment
    - group: 'apps'
      kind: StatefulSet
    - group: 'apps'
      kind: DaemonSet
    - group: 'batch'
      kind: Job
    - group: 'batch'
      kind: CronJob
    - group: 'autoscaling'
      kind: HorizontalPodAutoscaler
    - group: 'policy'
      kind: PodDisruptionBudget
    - group: 'networking.k8s.io'
      kind: Ingress
    - group: 'monitoring.coreos.com'
      kind: ServiceMonitor
    - group: 'monitoring.coreos.com'
      kind: PrometheusRule
      
  roles:
    - name: developer
      description: Developers can sync applications and view resources
      policies:
        - p, proj:ats-platform:developer, applications, sync, ats-platform/*, allow
        - p, proj:ats-platform:developer, applications, get, ats-platform/*, allow
        - p, proj:ats-platform:developer, applications, action/*, ats-platform/*, allow
        - p, proj:ats-platform:developer, repositories, get, *, allow
        - p, proj:ats-platform:developer, logs, get, ats-platform/*, allow
      groups:
        - ats-developers
        
    - name: admin
      description: Full access to ATS platform applications
      policies:
        - p, proj:ats-platform:admin, applications, *, ats-platform/*, allow
        - p, proj:ats-platform:admin, repositories, *, *, allow
        - p, proj:ats-platform:admin, clusters, *, *, allow
      groups:
        - ats-admins