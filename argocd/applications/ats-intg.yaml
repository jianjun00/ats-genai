apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ats-intg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack: ats-deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: ats-alerts
    # Weekly deployment schedule - typically updated on Mondays
    deployment.schedule: "weekly"
    deployment.day: "monday"
spec:
  project: default
  source:
    repoURL: https://github.com/AkoloTechnologies/ats-genai.git
    targetRevision: develop
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ats-intg
  syncPolicy:
    # Semi-automated sync for integration testing
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
  
  # Integration environment safeguards
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
    # Allow replica scaling for load testing
  
  # Health check configuration
  health:
    - group: argoproj.io
      kind: Rollout
      check: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.phase == "Healthy" then
            hs.status = "Healthy"
            hs.message = obj.status.message
            return hs
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for rollout to complete"
        return hs