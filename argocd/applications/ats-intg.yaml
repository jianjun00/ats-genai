apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ats-intg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack: ats-deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: ats-alerts
    # Weekly deployment schedule - typically updated on Mondays
    deployment.schedule: "weekly"
    deployment.day: "monday"
spec:
  project: default
  source:
    repoURL: https://github.com/AkoloTechnologies/ats-genai.git
    targetRevision: develop
    path: k8s
    directory:
      exclude: |
        **/.venv/**
        **/flyte-venv/**
        **/__pycache__/**
        **/*.pyc
        **/node_modules/**
        **/templates/**
  destination:
    server: https://kubernetes.default.svc
    namespace: ats-intg
  syncPolicy:
    # Semi-automated sync for integration testing
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
  
  # Integration environment safeguards
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
    # Allow replica scaling for load testing