apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: ats-dev
  labels:
    app: ats-analytics
    component: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats-analytics
      component: api-server
  template:
    metadata:
      labels:
        app: ats-analytics
        component: api-server
    spec:
      containers:
      - name: analytics-api
        image: dragonflyer762/ats-genai:dev-latest
        command: ["python", "-m", "uvicorn"]
        args: ["main:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
        - name: PYTHONPATH
          value: src
        - name: ENVIRONMENT
          value: dev
        - name: DB_CONNECTION_PARAMS
          value: sslmode=disable
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        ports:
        - containerPort: 8000
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api-service
  namespace: ats-dev
  labels:
    app: ats-analytics
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30800
    protocol: TCP
    name: http
  selector:
    app: ats-analytics
    component: api-server