// training_feature_schema.proto
// Protocol Buffer definitions for ATS training dataset feature schemas
// Provides type-safe, cross-language schema definitions for financial ML datasets

syntax = "proto3";

package ats.training.schema;

// Core data types supported in training datasets
enum DataType {
  DATA_TYPE_UNSPECIFIED = 0;
  FLOAT32 = 1;
  FLOAT64 = 2;
  INT32 = 3;
  INT64 = 4;
  BOOL = 5;
  STRING = 6;
  UINT32 = 7;
  UINT64 = 8;
}

// Financial-specific feature types for ATS training data
enum FeatureType {
  FEATURE_TYPE_UNSPECIFIED = 0;
  
  // Basic price data
  OHLC_INTERVALS = 1;              // [time_steps, 4] OHLC price matrices
  PRICE_SERIES = 2;                // [time_steps, 1] single price series
  VOLUME_SERIES = 3;               // [time_steps, 1] volume series
  
  // Technical indicators
  TECHNICAL_INDICATOR = 4;         // Single technical indicator values
  PRICE_INDICATOR_INTERVALS = 5;   // Price-based indicator time series
  VOLUME_INDICATOR_INTERVALS = 6;  // Volume-based indicator time series
  CROSS_TIMEFRAME_INDICATORS = 7;  // Multi-timeframe indicator combinations
  
  // Derived features
  RETURN_SERIES = 8;               // Price return calculations
  VOLATILITY_SERIES = 9;           // Volatility measurements
  MOMENTUM_SERIES = 10;            // Momentum indicators
  
  // Market context
  MARKET_REGIME_INDICATORS = 11;   // Bull/bear market indicators
  RELATIVE_STRENGTH_INDICATORS = 12; // RSI, relative performance
  SEASONAL_INDICATORS = 13;        // Day/month/quarter seasonality
  
  // Label types
  CLASSIFICATION_LABEL = 14;       // Categorical labels (up/down/sideways)
  REGRESSION_LABEL = 15;           // Continuous target values
  MULTI_HORIZON_LABEL = 16;        // Multiple prediction horizons
}

// Visualization recommendations for EDA dashboard
enum VisualizationType {
  VISUALIZATION_TYPE_UNSPECIFIED = 0;
  TIME_SERIES_LINE = 1;            // Line chart over time
  HISTOGRAM = 2;                   // Distribution histogram
  CANDLESTICK = 3;                 // OHLC candlestick chart
  HEATMAP = 4;                     // Matrix/correlation heatmap
  SCATTER_PLOT = 5;                // Scatter plot for relationships
  BOX_PLOT = 6;                    // Box plot for distributions
  DUAL_AXIS = 7;                   // Dual-axis chart (price + indicator)
  MULTI_TIMEFRAME = 8;             // Multiple timeframe comparison
}

// Statistical constraints and validation rules
message FeatureConstraints {
  optional double min_value = 1;          // Minimum allowed value
  optional double max_value = 2;          // Maximum allowed value
  optional double min_fraction = 3;       // Minimum fraction of non-null values
  repeated string allowed_values = 4;     // Allowed categorical values
  bool required = 5;                      // Whether feature is required
  optional double expected_mean = 6;      // Expected statistical mean
  optional double expected_std = 7;       // Expected standard deviation
  optional int32 max_categories = 8;      // Maximum unique categories
  bool monotonic_increasing = 9;          // Values should be monotonic increasing
  bool monotonic_decreasing = 10;         // Values should be monotonic decreasing
}

// Timeframe specification for multi-timeframe features
message TimeframeSpec {
  string base_timeframe = 1;              // Base timeframe (1min, 5min, 1hour, 1day)
  repeated string additional_timeframes = 2; // Additional timeframes for cross-timeframe features
  int32 lookback_periods = 3;             // Number of periods to look back
  int32 forecast_periods = 4;             // Number of periods to forecast
}

// Individual feature definition
message FeatureSchema {
  string name = 1;                        // Feature name (e.g., "close_price", "rsi_14")
  FeatureType type = 2;                   // Feature type classification
  DataType data_type = 3;                 // Underlying data type
  repeated int32 shape = 4;               // Shape dimensions [time_steps, features]
  string description = 5;                 // Human-readable description
  FeatureConstraints constraints = 6;     // Validation constraints
  map<string, string> metadata = 7;      // Additional metadata (parameters, sources)
  VisualizationType visualization_type = 8; // Recommended visualization
  TimeframeSpec timeframe = 9;            // Timeframe information
  string source_column = 10;              // Original data source column
  repeated string dependencies = 11;       // Dependent features for calculation
}

// Label (target) schema definition
message LabelSchema {
  string name = 1;                        // Label name (e.g., "future_return_5d")
  FeatureType type = 2;                   // Label type (CLASSIFICATION_LABEL, REGRESSION_LABEL)
  DataType data_type = 3;                 // Data type
  repeated int32 shape = 4;               // Shape dimensions
  string description = 5;                 // Description
  FeatureConstraints constraints = 6;     // Validation constraints
  map<string, string> metadata = 7;      // Additional metadata
  int32 forecast_horizon = 8;             // Prediction horizon in time steps
  string target_metric = 9;               // Target metric (return, volatility, direction)
}

// TensorFlow Data Validation integration
message TFDVStatistics {
  bytes serialized_stats = 1;             // Serialized TFDV statistics
  string stats_version = 2;               // TFDV version used
  string generation_timestamp = 3;        // When stats were generated
  map<string, string> feature_stats_paths = 4; // Paths to individual feature stats
}

// Complete dataset schema definition
message TrainingDatasetSchema {
  string schema_version = 1;              // Schema version (e.g., "1.0.0")
  string dataset_name = 2;                // Dataset identifier
  string dataset_description = 3;         // Dataset description
  repeated FeatureSchema features = 4;    // All feature definitions
  repeated LabelSchema labels = 5;        // All label definitions
  DatasetMetadata metadata = 6;           // Dataset-level metadata
  TFDVStatistics tfdv_stats = 7;         // TensorFlow Data Validation statistics
  string created_at = 8;                  // Creation timestamp
  string created_by = 9;                  // Creator information
  SchemaCompatibility compatibility = 10;  // Compatibility information
}

// Dataset-level metadata
message DatasetMetadata {
  string symbol = 1;                      // Primary symbol (e.g., "AAPL")
  repeated string additional_symbols = 2; // Additional symbols in dataset
  string start_date = 3;                  // Data start date (YYYY-MM-DD)
  string end_date = 4;                    // Data end date (YYYY-MM-DD)
  string base_timeframe = 5;              // Base data timeframe
  int64 total_samples = 6;                // Total number of samples
  int64 total_features = 7;               // Total number of features
  int64 sequence_length = 8;              // Time sequence length
  double data_quality_score = 9;          // Overall data quality score (0-1)
  map<string, string> generation_params = 10; // Generation parameters
  repeated string data_sources = 11;      // Data source identifiers
}

// Schema compatibility tracking
message SchemaCompatibility {
  repeated string compatible_versions = 1; // List of compatible schema versions
  repeated string breaking_changes = 2;   // Description of breaking changes
  string migration_guide = 3;             // Migration instructions
  bool backward_compatible = 4;           // Whether backward compatible
  bool forward_compatible = 5;            // Whether forward compatible
}

// Schema validation result
message ValidationResult {
  bool is_valid = 1;                      // Overall validation result
  repeated ValidationError errors = 2;    // List of validation errors
  repeated ValidationWarning warnings = 3; // List of validation warnings
  double confidence_score = 4;            // Confidence in validation (0-1)
  string validation_timestamp = 5;        // When validation was performed
}

// Individual validation error
message ValidationError {
  string feature_name = 1;                // Feature that failed validation
  string error_type = 2;                  // Type of error (constraint, type, shape)
  string error_message = 3;               // Detailed error message
  string expected_value = 4;              // Expected value/constraint
  string actual_value = 5;                // Actual value found
  int32 sample_index = 6;                 // Sample index where error occurred
}

// Individual validation warning
message ValidationWarning {
  string feature_name = 1;                // Feature with warning
  string warning_type = 2;                // Type of warning
  string warning_message = 3;             // Detailed warning message
  string recommendation = 4;              // Recommended action
}

// Schema registry entry
message SchemaRegistryEntry {
  string schema_name = 1;                 // Schema name
  string schema_version = 2;              // Schema version
  TrainingDatasetSchema schema = 3;       // The actual schema
  string created_at = 4;                  // Creation timestamp
  string created_by = 5;                  // Creator
  repeated string tags = 6;               // Searchable tags
  string status = 7;                      // Status (draft, active, deprecated)
}