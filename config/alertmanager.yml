global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@ats-platform.local'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'ats-alerts'

receivers:
- name: 'ats-alerts'
  webhook_configs:
  - url: 'http://127.0.0.1:5001/'
    send_resolved: true
    title: 'ATS Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    text: |
      {{ range .Alerts }}
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Severity: {{ .Labels.severity }}
      Instance: {{ .Labels.instance }}
      {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']