global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ats-node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'ats-analytics'
    static_configs:
      - targets: ['analytics-dev:3000', 'analytics-intg:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'ats-postgres'
    static_configs:
      - targets: ['postgres-dev:5432', 'postgres-intg:5432']
    metrics_path: '/metrics'
    scrape_interval: 30s