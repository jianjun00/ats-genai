global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ats-node-exporter'
    static_configs:
      - targets: ['ats-node-exporter:9100']

  - job_name: 'ats-services-health'
    static_configs:
      - targets: ['ats-intg-analytics:3000', 'ats-intg-news-collection:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s