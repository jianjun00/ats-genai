syntax = "proto3";
package state;

import "factor_interval.proto";
import "instrument_interval.proto";
import "indicator_interval.proto";
import "time_duration.proto";

message UniverseStateInterval {
    state.TimeDuration duration = 1;
    string start_date_time = 2;
    string end_date_time = 3;
    repeated state.FactorInterval factor_intervals = 4;
    map<int32, state.InstrumentInterval> instrument_intervals = 5;
    map<string, state.IndicatorIntervalMap> instrument_indicator_intervals = 6;
}

// Helper message for nested indicator intervals
message IndicatorIntervalMap {
    map<int32, state.IndicatorInterval> value = 1;
}
