apiVersion: v1
kind: ConfigMap
metadata:
  name: instrument-agent-config
  namespace: ats-dev
data:
  # Update these values to match your dev database configuration
  DB_HOST: "postgres.ats-dev.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "ats_dev"
  TABLE_PREFIX: "dev_"
  ENVIRONMENT: "dev"
  LOG_LEVEL: "INFO"
  # Set to true for initial deployment to prevent actual database changes
  DRY_RUN: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: instrument-agent-secrets
  namespace: ats-dev
type: Opaque
data:
  # These values need to be base64 encoded before deployment
  # Example: echo -n "your-password" | base64
  DB_USER: cG9zdGdyZXM=  # postgres
  DB_PASSWORD: cGFzc3dvcmQ=  # password
  POLYGON_API_KEY: eW91cl9wb2x5Z29uX2FwaV9rZXk=  # your_polygon_api_key
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: instrument-data-daily-update
  namespace: ats-dev
spec:
  schedule: "30 16 * * 1-5"  # 4:30 PM ET on weekdays
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: instrument-agent
            image: ats-registry.dev/ats-genai:latest
            command: ["python", "-m", "src.market_data.agent.instrument_data_agent", "daily_update", "--environment", "dev"]
            envFrom:
            - configMapRef:
                name: instrument-agent-config
            - secretRef:
                name: instrument-agent-secrets
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"
            volumeMounts:
            - name: logs-volume
              mountPath: /var/log
          volumes:
          - name: logs-volume
            emptyDir: {}
          restartPolicy: OnFailure
---
apiVersion: batch/v1
kind: Job
metadata:
  name: instrument-data-backfill
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: instrument-agent-backfill
        image: ats-registry.dev/ats-genai:latest
        command: ["python", "-m", "src.market_data.agent.instrument_data_agent", "backfill", "--environment", "dev"]
        envFrom:
        - configMapRef:
            name: instrument-agent-config
        - secretRef:
            name: instrument-agent-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: logs-volume
          mountPath: /var/log
      volumes:
      - name: logs-volume
        emptyDir: {}
      restartPolicy: OnFailure
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: instrument-agent-reports
  namespace: ats-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
