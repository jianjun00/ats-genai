version: '3.8'

services:
  # PostgreSQL for Dev Environment
  postgres-dev:
    image: postgres:13
    container_name: ats-dev-postgres
    environment:
      POSTGRES_DB: dev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
    ports:
      - "3432:5432"
    volumes:
      - postgres-data-new:/var/lib/postgresql/data
      - /mnt/d/ats-backup/dev:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ats-network

  # ATS Analytics Service - Dev  
  analytics-dev:
    image: dragonflyer762/ats-genai:latest
    container_name: ats-dev-analytics
    environment:
      - ENVIRONMENT=dev
      - DB_HOST=postgres-dev
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=dev_password
      - DB_NAME=dev_db
      - ATS_DATA_PATH=/data
      - ATS_BACKUP_PATH=/backup
      - ATS_LOGS_PATH=/logs
      - PYTHONPATH=/workspace/src
      # Market Data API Keys
      - POLYGON_API_KEY=${POLYGON_API_KEY:-wfrcZNX3ZJJt55Or_CmBXda8G8e8tABD}
      - TIINGO_API_KEY=${TIINGO_API_KEY:-5f40b4f36e171405746304ec0e5a6f3aa9ca77e5}
      - EODHD_API_KEY=${EODHD_API_KEY:-68aa0c7d2fe831.67386369}
      - FMP_API_KEY=${FMP_API_KEY:-Qf5MGG5HrOnEaWTumhVJzx3Onb3kw7Rr}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-9GI0NZ3V4VNFX271}
      - FIRSTRATE_USER_ID=${FIRSTRATE_USER_ID:-ats-genai-user}
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - /mnt/d/ats-data:/data
      - /mnt/d/ats-backup:/backup
      - /mnt/d/ats-logs:/logs
    working_dir: /workspace
    command: python3 src/services/analytics_service.py
    depends_on:
      postgres-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ats-network

networks:
  ats-network:
    driver: bridge
    name: ats-network

volumes:
  postgres-data-new:
    external: true