name: 🔧 Technical Debt
description: Technical debt or code quality improvement
title: "[TECH DEBT]: "
labels: ["type:tech-debt"]
projects: ["jianjun00/1"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Report technical debt that needs to be addressed for code quality, maintainability, or performance.

  - type: dropdown
    id: debt-type
    attributes:
      label: Debt Type
      description: What type of technical debt is this?
      options:
        - debt:code-quality (Refactoring, cleanup)
        - debt:performance (Optimization needed)
        - debt:security (Security improvements)
        - debt:documentation (Missing/outdated docs)
        - debt:testing (Test coverage, test quality)
        - debt:architecture (Design improvements)
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact Level
      description: How much does this debt impact development?
      options:
        - impact:high (Significantly slowing development)
        - impact:medium (Moderate impact on velocity)
        - impact:low (Minor impact, good to fix)
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: Current State
      description: Describe the current problematic state
      placeholder: |
        - What code/component has technical debt?
        - What specific issues exist?
        - How is it currently affecting development?
    validations:
      required: true

  - type: textarea
    id: desired-state
    attributes:
      label: Desired State
      description: Describe what the improved state should look like
      placeholder: |
        - What should the code/component look like after improvement?
        - What benefits will this provide?
        - How will it improve development velocity?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How should this technical debt be addressed?
      placeholder: |
        - Specific refactoring steps
        - New patterns to implement
        - Tools or libraries to introduce
        - Migration strategy if needed

  - type: dropdown
    id: effort-estimate
    attributes:
      label: Effort Estimate
      description: How much effort is required?
      options:
        - effort:small (< 1 day)
        - effort:medium (1-3 days)
        - effort:large (1 week)
        - effort:epic (> 1 week, needs breakdown)
    validations:
      required: true

  - type: textarea
    id: files-affected
    attributes:
      label: Files/Components Affected
      description: List the files or components that need changes
      placeholder: |
        - src/api/endpoints.py
        - src/models/forecast.py
        - tests/test_api.py

  - type: textarea
    id: risks
    attributes:
      label: Risks & Considerations
      description: What could go wrong during this improvement?
      placeholder: |
        - Breaking changes to consider
        - Testing requirements
        - Deployment considerations
        - Performance impact during migration

  - type: textarea
    id: success-criteria
    attributes:
      label: Success Criteria
      description: How will we know this debt has been successfully addressed?
      placeholder: |
        - [ ] Code quality metrics improved
        - [ ] Performance benchmarks met
        - [ ] Test coverage increased
        - [ ] Documentation updated