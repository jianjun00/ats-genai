name: 📝 User Story
description: Create a new user story for feature development
title: "[USER STORY]: "
labels: ["type:feature"]
projects: ["jianjun00/1"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to Portfolio GPT MVP! Please fill out this user story template.

  - type: dropdown
    id: epic
    attributes:
      label: Epic
      description: Which epic does this user story belong to?
      options:
        - epic:recommendation-engine
        - epic:subscription-system  
        - epic:dashboard
        - epic:model-pipeline
        - epic:infrastructure
    validations:
      required: true

  - type: dropdown
    id: team
    attributes:
      label: Team Assignment
      description: Which team should work on this story?
      options:
        - team:backend
        - team:frontend
        - team:data
        - team:ml
        - team:devops
        - team:full-stack
    validations:
      required: true

  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Describe the user story in the standard format
      placeholder: |
        As a [type of user]
        I want [goal]
        So that [benefit]
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List specific, testable acceptance criteria
      placeholder: |
        - [ ] Criterion 1 with specific measurable outcome
        - [ ] Criterion 2 with specific measurable outcome
        - [ ] Criterion 3 with specific measurable outcome
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How critical is this story for MVP launch?
      options:
        - priority:critical
        - priority:high
        - priority:medium
        - priority:low
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Story Size
      description: Estimate the complexity/effort required
      options:
        - size:XS (< 1 day)
        - size:S (1-2 days)
        - size:M (3-5 days)
        - size:L (1 week)
        - size:XL (> 1 week, needs breakdown)
    validations:
      required: true

  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes
      description: Implementation approach, architecture considerations, or technical constraints
      placeholder: |
        - API endpoints needed
        - Database changes required
        - Third-party integrations
        - Performance considerations

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List any dependencies or blocking issues
      placeholder: |
        - Depends on #[issue-number]: Brief description
        - Blocks #[issue-number]: Brief description
        - External dependency: Description

  - type: textarea
    id: test-scenarios
    attributes:
      label: Test Scenarios
      description: Key scenarios that need to be tested
      placeholder: |
        - Happy path scenario
        - Error/edge case scenarios
        - Performance scenarios
        - Security scenarios