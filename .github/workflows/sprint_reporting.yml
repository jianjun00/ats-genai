name: Sprint Reporting

on:
  schedule:
    # Run every Friday at 5 PM UTC (end of sprint week)
    - cron: '0 17 * * 5'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-sprint-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv

      - name: Generate Sprint Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<EOF
          import requests
          import os
          from datetime import datetime, timedelta
          
          # GitHub API setup
          token = os.environ['GITHUB_TOKEN']
          repo = '${{ github.repository }}'
          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}
          
          # Get issues closed in the last week
          week_ago = (datetime.now() - timedelta(days=7)).isoformat()
          url = f'https://api.github.com/repos/{repo}/issues'
          params = {
              'state': 'closed',
              'since': week_ago,
              'per_page': 100
          }
          
          response = requests.get(url, headers=headers, params=params)
          closed_issues = response.json()
          
          # Calculate metrics
          total_closed = len(closed_issues)
          story_points = 0
          bugs_fixed = 0
          features_completed = 0
          
          for issue in closed_issues:
              labels = [label['name'] for label in issue['labels']]
              
              if 'type:bug' in labels:
                  bugs_fixed += 1
              elif 'type:feature' in labels:
                  features_completed += 1
              
              # Extract story points from size labels
              for label in labels:
                  if label.startswith('size:'):
                      if 'XS' in label:
                          story_points += 1
                      elif 'S' in label:
                          story_points += 2
                      elif 'M' in label:
                          story_points += 5
                      elif 'L' in label:
                          story_points += 8
                      elif 'XL' in label:
                          story_points += 13
          
          # Generate report
          report = f"""
          # Sprint Report - Week Ending {datetime.now().strftime('%Y-%m-%d')}
          
          ## Sprint Velocity
          - **Total Issues Closed**: {total_closed}
          - **Story Points Completed**: {story_points}
          - **Features Completed**: {features_completed}
          - **Bugs Fixed**: {bugs_fixed}
          
          ## Team Performance
          - **Average Cycle Time**: Calculating...
          - **Review Time**: Calculating...
          
          ## Next Sprint Planning
          - Review backlog prioritization
          - Update story point estimates based on velocity
          - Address any blockers identified
          
          Generated automatically by GitHub Actions
          """
          
          print(report)
          
          # Save report to file
          with open('sprint_report.md', 'w') as f:
              f.write(report)
          EOF

      - name: Create Sprint Report Issue
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('sprint_report.md', 'utf8');
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sprint Report - Week Ending ${new Date().toISOString().split('T')[0]}`,
              body: report,
              labels: ['type:report', 'sprint-metrics']
            });

  velocity-tracking:
    runs-on: ubuntu-latest
    steps:
      - name: Track Velocity Trends
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Tracking velocity trends over time"
          # Add logic to store and analyze velocity trends