name: CI Pipeline for ATS Platform

on:
  push:
    branches: [ main, develop, chore/dev-db-migration-job ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Fast Unit Tests (Required for all branches)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        pip install pytest pytest-asyncio pytest-cov
        
    - name: Run fast unit tests
      run: |
        PYTHONPATH=src pytest tests/core/ tests/config/ tests/signals/test_indicator.py -v --tb=short --maxfail=10
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: |
          pytest-report.xml
          .coverage
        retention-days: 30

  # Integration Tests (Required for deployment branches)
  integration-tests:
    name: Integration Tests  
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/chore/dev-db-migration-job'
    timeout-minutes: 20
    
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        pip install pytest pytest-asyncio pytest-cov asyncpg
        
    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/test_db
      run: |
        PYTHONPATH=src python src/db/migration_manager.py migrate --db-url $DATABASE_URL
        
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/test_db
        ENVIRONMENT: test
      run: |
        PYTHONPATH=src pytest tests/market_data/realtime/ -v --tb=short -m "not benchmark" --maxfail=5

  # Security and Code Quality Checks
  security-checks:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install security tools
      run: |
        pip install bandit safety ruff
        
    - name: Run security scan with Bandit
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ --severity-level medium
        
    - name: Check dependencies for vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check
        
    - name: Run code quality checks with Ruff
      run: |
        ruff check src/ --output-format=json --output-file=ruff-report.json || true
        ruff check src/

  # Build and Push Docker Images
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-checks]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/chore/dev-db-migration-job'
    timeout-minutes: 20
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push realtime collector image
      id: build
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/Dockerfile.realtime-collector
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        push: true
        
    - name: Build and push analytics API image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/Dockerfile.analytics-api
        platforms: linux/amd64,linux/arm64
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/analytics-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        push: true

  # Update Argo CD manifests for GitOps deployment
  update-gitops-manifests:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/chore/dev-db-migration-job'
    
    steps:
    - name: Checkout GitOps repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/ats-gitops
        token: ${{ secrets.GITOPS_TOKEN }}
        path: gitops
        
    - name: Update image tags in dev environment
      run: |
        cd gitops
        
        # Update realtime collector image tag
        sed -i "s|image: ghcr.io/${{ github.repository }}:.*|image: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}|g" \
          environments/dev/realtime-streaming/deployment.yaml
          
        # Update analytics API image tag  
        sed -i "s|image: ghcr.io/${{ github.repository }}/analytics-api:.*|image: ghcr.io/${{ github.repository }}/analytics-api:${{ github.sha }}|g" \
          environments/dev/analytics-api/deployment.yaml
          
        # Update version in application manifest
        sed -i "s|targetRevision: .*|targetRevision: ${{ github.sha }}|g" \
          applications/ats-dev-app.yaml
        
    - name: Commit and push changes
      run: |
        cd gitops
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        git add .
        git commit -m "Update ATS dev environment to ${{ github.sha }}
        
        - Updated realtime collector image
        - Updated analytics API image
        - Source commit: ${{ github.sha }}
        - Branch: ${{ github.ref_name }}
        
        Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
        
        git push

  # Trigger Argo CD sync (optional - Argo CD can auto-sync)
  trigger-argocd-sync:
    name: Trigger Argo CD Sync
    runs-on: ubuntu-latest
    needs: update-gitops-manifests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/chore/dev-db-migration-job'
    
    steps:
    - name: Sync Argo CD Application
      run: |
        # Install Argo CD CLI
        curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
        sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
        
        # Login to Argo CD
        argocd login ${{ secrets.ARGOCD_SERVER }} \
          --username ${{ secrets.ARGOCD_USERNAME }} \
          --password ${{ secrets.ARGOCD_PASSWORD }} \
          --grpc-web
        
        # Sync the application
        argocd app sync ats-dev \
          --timeout 600 \
          --retry-limit 3
        
        # Wait for sync to complete
        argocd app wait ats-dev \
          --timeout 600 \
          --health

  # Notification
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [trigger-argocd-sync]
    if: always()
    
    steps:
    - name: Send Slack notification on success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#ats-dev-deployments'
        text: |
          ✅ ATS CI/CD pipeline completed successfully!
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Images built and GitOps manifests updated
          Argo CD will deploy to dev environment
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        
    - name: Send Slack notification on failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#ats-dev-deployments'
        text: |
          ❌ ATS CI/CD pipeline failed!
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}