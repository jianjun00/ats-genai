# Schema Validation CI/CD Pipeline
# 
# This pipeline MUST pass before any code reaches dev environment.
# It validates that our code matches the actual database schema.

name: Database Schema Validation

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install asyncpg pytest pytest-asyncio
        pip install -r requirements.txt
    
    - name: Set up test database schema
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: test_db
      run: |
        # Set up basic database schema
        psql postgresql://postgres:postgres@localhost:5432/test_db -c "
          CREATE TABLE IF NOT EXISTS dev_training_dataset (
            dataset_name VARCHAR(255) PRIMARY KEY,
            symbols TEXT[],
            total_sequences INTEGER,
            feature_count INTEGER,
            technical_indicators TEXT[],
            creation_timestamp TIMESTAMPTZ DEFAULT NOW(),
            file_size_mb FLOAT
          );
          CREATE TABLE IF NOT EXISTS dev_minute_prices_unified (
            id SERIAL PRIMARY KEY,
            symbol VARCHAR(20),
            timestamp TIMESTAMPTZ,
            price DECIMAL(10,4)
          );
          CREATE TABLE IF NOT EXISTS dev_price_data_coverage (
            symbol VARCHAR(20),
            vendor VARCHAR(50),
            date DATE,
            coverage_pct DECIMAL(5,2)
          );
        "
    
    - name: Run schema validation tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: test_db
        CI: true
      run: |
        # These tests MUST pass for deployment
        PYTHONPATH=src pytest tests/unit/test_database_schema_validation.py -v
        
        # Additional schema validation
        PYTHONPATH=src python -c "
        import asyncio
        from enhanced_dataset_visualization_platform_real_data import EnhancedDatasetVisualizationEngine, Environment
        
        async def validate_schema():
            env = Environment()
            engine = EnhancedDatasetVisualizationEngine(env)
            try:
                await engine.initialize()
                print('✅ Schema validation passed')
            except Exception as e:
                print(f'❌ Schema validation failed: {e}')
                raise
            finally:
                await engine.close()
        
        asyncio.run(validate_schema())
        "
    
    - name: Validate SQL queries
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: test_db
      run: |
        # Validate all SQL queries can be prepared (syntax check)
        PYTHONPATH=src python -c "
        import asyncio
        import asyncpg
        import os
        
        async def validate_queries():
            conn = await asyncpg.connect(
                host=os.getenv('DB_HOST'),
                port=int(os.getenv('DB_PORT')),
                user=os.getenv('DB_USER'),
                password=os.getenv('DB_PASSWORD'),
                database=os.getenv('DB_NAME')
            )
            
            # Test all queries from our code
            queries = [
                '''SELECT dataset_name, symbols, total_sequences, feature_count, 
                          technical_indicators, creation_timestamp, file_size_mb
                   FROM dev_training_dataset 
                   WHERE dataset_name = \$1''',
            ]
            
            for query in queries:
                try:
                    await conn.prepare(query)
                    print(f'✅ Query validation passed: {query[:50]}...')
                except Exception as e:
                    print(f'❌ Query validation failed: {e}')
                    raise
            
            await conn.close()
        
        asyncio.run(validate_queries())
        "
        
    - name: Check for schema anti-patterns
      run: |
        # Check for hardcoded incorrect table/column names
        echo "Checking for schema anti-patterns..."
        
        if grep -r "dev_training_datasets" src/ --include="*.py"; then
          echo "❌ Found incorrect table name 'dev_training_datasets' (should be 'dev_training_dataset')"
          exit 1
        fi
        
        if grep -r "created_at" src/ --include="*.py"; then
          echo "❌ Found incorrect column name 'created_at' (should be 'creation_timestamp')"
          exit 1
        fi
        
        if grep -r "file_size_bytes" src/ --include="*.py"; then
          echo "❌ Found incorrect column name 'file_size_bytes' (should be 'file_size_mb')"
          exit 1
        fi
        
        echo "✅ No schema anti-patterns found"
    
    - name: Generate schema documentation
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: test_db
      run: |
        # Generate current schema documentation
        PYTHONPATH=src python -c "
        import asyncio
        import asyncpg
        import os
        
        async def document_schema():
            conn = await asyncpg.connect(
                host=os.getenv('DB_HOST'),
                port=int(os.getenv('DB_PORT')),
                user=os.getenv('DB_USER'),
                password=os.getenv('DB_PASSWORD'),
                database=os.getenv('DB_NAME')
            )
            
            # Get table schema
            rows = await conn.fetch('''
                SELECT table_name, column_name, data_type, is_nullable
                FROM information_schema.columns 
                WHERE table_schema = 'public' 
                AND table_name LIKE 'dev_%'
                ORDER BY table_name, ordinal_position
            ''')
            
            print('📋 Current Database Schema:')
            current_table = None
            for row in rows:
                if row['table_name'] != current_table:
                    current_table = row['table_name']
                    print(f'\\n## Table: {current_table}')
                
                nullable = 'NULL' if row['is_nullable'] == 'YES' else 'NOT NULL'
                print(f'  - {row[\"column_name\"]}: {row[\"data_type\"]} ({nullable})')
            
            await conn.close()
        
        asyncio.run(document_schema())
        "

  deployment-gate:
    needs: schema-validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Schema validation passed - ready for deployment
      run: |
        echo "✅ All schema validation tests passed"
        echo "✅ Code is ready for deployment to dev environment"
        echo "✅ No schema mismatches detected"