name: CI/CD Pipeline - Service Architecture

on:
  push:
    branches: [ main, develop, 'feature/service-*' ]
    paths:
      - 'src/**'
      - 'deployment/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/ci-cd-services.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'deployment/**' 
      - 'tests/**'
      - 'requirements.txt'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/ats-platform

jobs:
  # === Testing Phase ===
  
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        test-suite: 
          - infrastructure
          - domains/instruments
          - domains/analytics
          - domains/trading
          - domains/news
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
        
    - name: Run unit tests
      run: |
        export PYTHONPATH=${{ github.workspace }}/src
        pytest tests/${{ matrix.test-suite }}/ -v --cov=src/${{ matrix.test-suite }} --cov-report=xml --cov-report=term-missing
        
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests,${{ matrix.test-suite }}
        name: codecov-${{ matrix.test-suite }}

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
        
    - name: Run integration tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_NAME: test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        PYTHONPATH: ${{ github.workspace }}/src
      run: |
        pytest tests/integration/ -v --tb=short
        
    - name: Run service discovery tests
      env:
        PYTHONPATH: ${{ github.workspace }}/src
      run: |
        pytest tests/infrastructure/test_service_discovery.py -v

  lint-and-security:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy bandit safety
        
    - name: Run Black formatting check
      run: black --check --diff src/ tests/
      
    - name: Run isort import sorting check
      run: isort --check-only --diff src/ tests/
      
    - name: Run flake8 linting
      run: flake8 src/ tests/ --max-line-length=120 --exclude=__pycache__
      
    - name: Run mypy type checking
      run: mypy src/ --ignore-missing-imports --no-strict-optional
      
    - name: Run bandit security scan
      run: bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true
      
    - name: Run safety dependency check
      run: safety check --json --output safety-report.json
      continue-on-error: true
      
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # === Build Phase ===
  
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, lint-and-security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    strategy:
      matrix:
        service:
          - service-registry
          - instrument-service
          - analytics-service
          - trading-service
          - news-service
          - api-gateway
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: deployment/dockerfiles/Dockerfile.${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  # === Deployment Phase ===
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
        
    - name: Configure kubectl for staging
      run: |
        echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        
    - name: Deploy to staging namespace
      run: |
        # Apply namespace and configuration
        kubectl apply -f deployment/kubernetes/namespace.yaml
        
        # Update image tags for staging
        sed -i 's|image: ats-platform/|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-|g' deployment/kubernetes/*.yaml
        sed -i 's|:1.0.0|:develop-${{ github.sha }}|g' deployment/kubernetes/*.yaml
        
        # Deploy infrastructure
        kubectl apply -f deployment/kubernetes/postgres.yaml
        kubectl apply -f deployment/kubernetes/redis.yaml
        
        # Wait for infrastructure
        kubectl wait --for=condition=ready pod -l app=postgres -n ats-services --timeout=300s
        kubectl wait --for=condition=ready pod -l app=redis -n ats-services --timeout=300s
        
        # Deploy services
        kubectl apply -f deployment/kubernetes/service-registry.yaml
        kubectl apply -f deployment/kubernetes/instrument-service.yaml
        kubectl apply -f deployment/kubernetes/api-gateway.yaml
        
        # Wait for services
        kubectl wait --for=condition=ready pod -l app=service-registry -n ats-services --timeout=300s
        kubectl wait --for=condition=ready pod -l app=instrument-service -n ats-services --timeout=300s
        kubectl wait --for=condition=ready pod -l app=api-gateway -n ats-services --timeout=300s
        
    - name: Run smoke tests
      run: |
        # Get API Gateway service URL
        GATEWAY_URL=$(kubectl get svc api-gateway -n ats-services -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        
        # Wait for service to be ready
        sleep 30
        
        # Test API Gateway health
        curl -f http://$GATEWAY_URL:8000/health
        
        # Test instrument service through gateway
        curl -f http://$GATEWAY_URL:8000/api/v1/instruments/health
        
    - name: Notify deployment success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: "✅ Staging deployment successful for commit ${{ github.sha }}"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
        
    - name: Configure kubectl for production
      run: |
        echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        
    - name: Blue/Green deployment
      run: |
        # Apply namespace and configuration  
        kubectl apply -f deployment/kubernetes/namespace.yaml
        
        # Update image tags for production
        sed -i 's|image: ats-platform/|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-|g' deployment/kubernetes/*.yaml
        sed -i 's|:1.0.0|:main-${{ github.sha }}|g' deployment/kubernetes/*.yaml
        
        # Deploy green environment
        sed -i 's|name: ats-services|name: ats-services-green|g' deployment/kubernetes/*.yaml
        sed -i 's|namespace: ats-services|namespace: ats-services-green|g' deployment/kubernetes/*.yaml
        
        # Create green namespace
        kubectl create namespace ats-services-green || true
        
        # Deploy to green environment
        kubectl apply -f deployment/kubernetes/
        
        # Wait for green deployment
        kubectl wait --for=condition=ready pod -l app=instrument-service -n ats-services-green --timeout=600s
        
        # Run production smoke tests
        ./deployment/scripts/production-smoke-tests.sh ats-services-green
        
        # Switch traffic to green (blue/green switch)
        kubectl patch service api-gateway -n ats-services -p '{"spec":{"selector":{"version":"green"}}}'
        
        # Clean up old blue environment after successful switch
        sleep 60
        kubectl delete namespace ats-services-blue || true
        
        # Rename green to blue for next deployment
        kubectl patch namespace ats-services-green -p '{"metadata":{"name":"ats-services-blue"}}'
        
    - name: Notify deployment success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: "🚀 Production deployment successful for commit ${{ github.sha }}"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # === Rollback Capability ===
  
  rollback-production:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      
    - name: Configure kubectl
      run: |
        echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
        
    - name: Rollback deployment
      run: |
        # Rollback to previous version
        kubectl rollout undo deployment/instrument-service -n ats-services
        kubectl rollout undo deployment/api-gateway -n ats-services
        
        # Wait for rollback
        kubectl rollout status deployment/instrument-service -n ats-services --timeout=300s
        kubectl rollout status deployment/api-gateway -n ats-services --timeout=300s
        
    - name: Verify rollback
      run: |
        # Run smoke tests after rollback
        ./deployment/scripts/production-smoke-tests.sh ats-services
        
    - name: Notify rollback success
      uses: 8398a7/action-slack@v3
      with:
        status: success  
        text: "⏪ Production rollback completed successfully"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}