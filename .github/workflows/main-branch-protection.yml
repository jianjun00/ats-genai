name: Main Branch Protection

# This workflow enforces quality gates for main branch
# It should be complemented by GitHub branch protection rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Mandatory unit tests - must pass for any main branch changes
  unit-tests:
    name: "🧪 Unit Tests (Required)"
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov pytest-asyncio
    
    - name: Run unit tests
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        ENVIRONMENT: test
      run: |
        echo "🧪 Running unit tests - MANDATORY for main branch"
        pytest tests/core/ tests/config/ tests/signals/ \
          -v \
          --cov=src \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-fail-under=70
    
    - name: Unit test results
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ Unit tests PASSED - main branch protection satisfied"
        else
          echo "❌ Unit tests FAILED - main branch changes BLOCKED"
          exit 1
        fi

  # Integration tests - should pass but don't block if infrastructure issues
  integration-tests:
    name: "🔗 Integration Tests (Recommended)" 
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block merge for infrastructure issues
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-asyncio asyncpg
    
    - name: Run integration tests
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        ENVIRONMENT: test
        DB_PASSWORD: test_password
      run: |
        echo "🔗 Running integration tests"
        pytest tests/integration/ tests/coverage/ \
          -v \
          --tb=short \
          -x || echo "⚠️ Integration tests had issues - check logs"

  # Code quality checks - must pass for main branch
  code-quality:
    name: "🔍 Code Quality (Required)"
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install quality tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy bandit safety
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Code formatting check
      run: |
        echo "🔍 Checking code formatting"
        black --check --diff src/ tests/ services/ || {
          echo "❌ Code formatting check failed"
          echo "Run 'black src/ tests/ services/' to fix formatting"
          exit 1
        }
    
    - name: Linting
      run: |
        echo "🔍 Running linter"
        flake8 src/ tests/ services/ \
          --max-line-length=88 \
          --extend-ignore=E203,W503,E501 \
          --exclude=__pycache__,*.pyc,build,dist,.git \
          || {
            echo "❌ Linting failed"
            exit 1
          }
    
    - name: Security scan
      run: |
        echo "🔍 Running security scan"
        bandit -r src/ services/ -f json || {
          echo "⚠️ Security issues detected - review required"
          # Don't fail build for security warnings, but flag for review
        }

  # Main branch protection summary
  protection-summary:
    name: "🛡️ Main Branch Protection Summary"
    needs: [unit-tests, integration-tests, code-quality]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Protection summary
      run: |
        echo "🛡️ Main Branch Protection Results:"
        echo "=================================="
        
        # Check unit tests (required)
        if [ "${{ needs.unit-tests.result }}" == "success" ]; then
          echo "✅ Unit Tests: PASSED (Required)"
        else
          echo "❌ Unit Tests: FAILED (Blocking)"
          PROTECTION_FAILED=true
        fi
        
        # Check code quality (required)  
        if [ "${{ needs.code-quality.result }}" == "success" ]; then
          echo "✅ Code Quality: PASSED (Required)"
        else
          echo "❌ Code Quality: FAILED (Blocking)"
          PROTECTION_FAILED=true
        fi
        
        # Check integration tests (recommended)
        if [ "${{ needs.integration-tests.result }}" == "success" ]; then
          echo "✅ Integration Tests: PASSED (Recommended)"
        else
          echo "⚠️ Integration Tests: Issues detected (Non-blocking)"
        fi
        
        echo "=================================="
        
        if [ "$PROTECTION_FAILED" == "true" ]; then
          echo "🚨 MAIN BRANCH PROTECTION VIOLATION"
          echo "   Changes to main branch are blocked due to quality gate failures"
          echo "   Please fix the issues above before merging"
          exit 1
        else
          echo "✅ MAIN BRANCH PROTECTION SATISFIED"
          echo "   All required quality gates passed"
        fi
    
    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const { needs } = context.payload.workflow_run || { needs: {} };
          const unitTestsResult = "${{ needs.unit-tests.result }}";
          const codeQualityResult = "${{ needs.code-quality.result }}";
          const integrationResult = "${{ needs.integration-tests.result }}";
          
          let emoji = "✅";
          let status = "PASSED";
          if (unitTestsResult !== "success" || codeQualityResult !== "success") {
            emoji = "❌";
            status = "FAILED";
          }
          
          const comment = `
          ## ${emoji} Main Branch Protection Check ${status}
          
          | Check | Status | Required |
          |-------|--------|----------|
          | Unit Tests | ${unitTestsResult === 'success' ? '✅ PASSED' : '❌ FAILED'} | ✅ Yes |
          | Code Quality | ${codeQualityResult === 'success' ? '✅ PASSED' : '❌ FAILED'} | ✅ Yes |
          | Integration Tests | ${integrationResult === 'success' ? '✅ PASSED' : '⚠️ Issues'} | ⚠️ Recommended |
          
          ${status === 'FAILED' ? 
            '🚨 **This PR is blocked** - Please fix the failing required checks above.' : 
            '✅ **This PR meets all protection requirements** - Safe to merge!'
          }
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

# Additional workflow to remind about branch protection setup
  branch-protection-reminder:
    name: "📋 Branch Protection Setup Reminder"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Branch protection reminder
      run: |
        echo "📋 IMPORTANT: GitHub Branch Protection Setup"
        echo "==========================================="
        echo ""
        echo "This repository should have the following branch protection rules:"
        echo ""
        echo "1. 🛡️ Protect main branch:"
        echo "   - Require status checks before merging"
        echo "   - Require up-to-date branches before merging"
        echo "   - Require 'Unit Tests (Required)' check to pass"
        echo "   - Require 'Code Quality (Required)' check to pass"
        echo ""
        echo "2. 🔒 Additional protection:"
        echo "   - Require pull request reviews before merging"
        echo "   - Dismiss stale reviews when new commits are pushed"
        echo "   - Require review from code owners"
        echo "   - Restrict pushes that create files over 100 MB"
        echo ""
        echo "3. 📝 Setup instructions:"
        echo "   Go to: Repository Settings → Branches → Add Rule"
        echo "   Branch name pattern: main"
        echo "   Enable the protection rules listed above"
        echo ""
        echo "⚠️ Currently allowing direct pushes to main - this should be changed!"