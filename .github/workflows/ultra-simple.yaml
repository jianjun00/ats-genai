name: Ultra Simple Test

on:
  push:
    branches: [ main ]

jobs:
  simple:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Test basic functionality
      run: |
        echo "🧪 Ultra simple test starting..."
        python3 --version
        echo "✅ Python is working"
        pip install asyncpg
        echo "✅ Can install packages"
        python3 -c "print('✅ Python execution works')"
        echo "🎉 ULTRA SIMPLE TEST PASSED! 🎉"