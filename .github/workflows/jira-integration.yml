name: Jira Integration

on:
  pull_request:
    types: [opened, closed, synchronize]
  issues:
    types: [opened, closed]
  push:
    branches: [main, develop, 'PGPT-*']

jobs:
  update-jira:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Jira Issue Key
        id: jira
        run: |
          # Extract PGPT-XXX from branch name, PR title, or commit message
          ISSUE_KEY=""
          
          echo "Debug: Checking for JIRA issue key..."
          echo "Branch ref: ${{ github.head_ref }}"
          echo "PR title: ${{ github.event.pull_request.title }}"
          echo "Commit message: ${{ github.event.head_commit.message }}"
          
          # Check branch name first (for PRs)
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ -n "$BRANCH_NAME" ]]; then
            echo "Checking branch name: $BRANCH_NAME"
            ISSUE_KEY=$(echo "$BRANCH_NAME" | grep -o 'PGPT-[0-9]\+' || echo "")
          fi
          
          # Check current branch for direct pushes
          if [[ -z "$ISSUE_KEY" ]]; then
            REF_NAME="${{ github.ref_name }}"
            echo "Checking ref name: $REF_NAME"
            ISSUE_KEY=$(echo "$REF_NAME" | grep -o 'PGPT-[0-9]\+' || echo "")
          fi
          
          # Check PR title if no key found yet
          if [[ -z "$ISSUE_KEY" ]]; then
            PR_TITLE="${{ github.event.pull_request.title }}"
            if [[ -n "$PR_TITLE" ]]; then
              echo "Checking PR title: $PR_TITLE"
              ISSUE_KEY=$(echo "$PR_TITLE" | grep -o 'PGPT-[0-9]\+' || echo "")
            fi
          fi
          
          # Check commit message if no key found yet
          if [[ -z "$ISSUE_KEY" ]]; then
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if [[ -n "$COMMIT_MSG" ]]; then
              echo "Checking commit message: $COMMIT_MSG"
              ISSUE_KEY=$(echo "$COMMIT_MSG" | grep -o 'PGPT-[0-9]\+' || echo "")
            fi
          fi
          
          echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT
          echo "Found Jira issue key: $ISSUE_KEY"
      
      - name: Add Comment to Jira Issue (PR opened)
        if: steps.jira.outputs.issue_key && github.event.action == 'opened' && github.event.pull_request
        uses: atlassian/gajira-comment@master
        with:
          issue: ${{ steps.jira.outputs.issue_key }}
          comment: |
            Pull Request opened: ${{ github.event.pull_request.html_url }}
            Title: ${{ github.event.pull_request.title }}
            Author: ${{ github.event.pull_request.user.login }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      
      - name: Transition Jira Issue (PR opened)
        if: steps.jira.outputs.issue_key && github.event.action == 'opened' && github.event.pull_request
        uses: atlassian/gajira-transition@master
        with:
          issue: ${{ steps.jira.outputs.issue_key }}
          transition: "In Review"
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      
      - name: Add Comment to Jira Issue (PR merged)
        if: steps.jira.outputs.issue_key && github.event.action == 'closed' && github.event.pull_request.merged
        uses: atlassian/gajira-comment@master
        with:
          issue: ${{ steps.jira.outputs.issue_key }}
          comment: |
            Pull Request merged: ${{ github.event.pull_request.html_url }}
            Merged by: ${{ github.event.pull_request.merged_by.login }}
            Commits: ${{ github.event.pull_request.commits }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      
      - name: Transition Jira Issue (PR merged)
        if: steps.jira.outputs.issue_key && github.event.action == 'closed' && github.event.pull_request.merged
        uses: atlassian/gajira-transition@master
        with:
          issue: ${{ steps.jira.outputs.issue_key }}
          transition: "Done"
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      
      - name: Add Comment to Jira Issue (Push to main)
        if: steps.jira.outputs.issue_key && github.ref == 'refs/heads/main'
        uses: atlassian/gajira-comment@master
        with:
          issue: ${{ steps.jira.outputs.issue_key }}
          comment: |
            Code pushed to main branch: ${{ github.event.head_commit.url }}
            Commit: ${{ github.event.head_commit.message }}
            Author: ${{ github.event.head_commit.author.name }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}