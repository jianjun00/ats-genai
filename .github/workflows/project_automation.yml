    runs-on: ubuntu-latest
    if: github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'priority:critical')
    steps:
      - name: Notify team of critical issue
        run: |
          echo "Critical issue created: ${{ github.event.issue.title }}"
