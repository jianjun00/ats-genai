name: Test CI Pipeline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-ci-trigger.yaml']

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Test pipeline trigger
      run: |
        echo "✅ CI Pipeline is working!"
        echo "Timestamp: $(date)"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"