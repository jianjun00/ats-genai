name: Unit Tests Only

on:
  push:
    branches: [ main, develop, 'feature/*', 'fix/*', 'chore/*' ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: dragonflyer762/ats-genai:latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run unit tests
      run: |
        PYTHONPATH=src pytest tests/core/ tests/config/ tests/signals/test_indicator.py \
          -v \
          --tb=short \
          --maxfail=10
    
    - name: Unit test status
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ Unit tests passed"
        else
          echo "❌ Unit tests failed"
          exit 1
        fi