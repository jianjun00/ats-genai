name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'chore/*', 'feature/*', 'fix/*' ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'
  POSTGRES_VERSION: 13

jobs:
  # Fast unit tests - run first for quick feedback
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: dragonflyer762/ats-genai:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run unit tests
      run: |
        PYTHONPATH=src pytest -m "unit" \
          --tb=short \
          --cov=src \
          --cov-report=xml \
          --cov-report=term-missing \
          --maxfail=5 \
          -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      with:
        file: ./coverage.xml
        flags: unit-tests
        name: unit-tests

  # Integration tests - require database
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests
    container:
      image: dragonflyer762/ats-genai:latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h postgres -p 5432 -U postgres; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
    
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/test_db
        ENVIRONMENT: test
      run: |
        PYTHONPATH=src pytest -m "integration and not skip_in_batch" \
          --tb=short \
          --maxfail=3 \
          -v
    
    - name: Run database tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/test_db
        ENVIRONMENT: test
      run: |
        PYTHONPATH=src pytest -m "database" \
          --tb=short \
          --maxfail=3 \
          -v

  # Gin configuration tests - run individually
  gin-config-tests:
    name: Gin Configuration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests
    container:
      image: dragonflyer762/ats-genai:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run gin configuration tests (forked)
      run: |
        PYTHONPATH=src pytest -m "gin_heavy" \
          --tb=short \
          --forked \
          --maxfail=3 \
          -v

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: dragonflyer762/ats-genai:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run ruff (linting)
      run: |
        ruff check src/ tests/ --output-format=github
      continue-on-error: true  # Don't fail on linting issues initially
    
    - name: Run black (formatting)
      run: |
        black --check --diff src/ tests/
      continue-on-error: true  # Don't fail on formatting issues initially
    
    - name: Run mypy (type checking)
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true  # Don't fail on type issues initially

  # Performance and slow tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    container:
      image: dragonflyer762/ats-genai:latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run performance tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/test_db
        ENVIRONMENT: test
      run: |
        PYTHONPATH=src pytest -m "slow or performance" \
          --tb=short \
          --benchmark-only \
          --benchmark-sort=mean \
          -v
      continue-on-error: true  # Don't fail on performance test issues initially

  # Final status check
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, gin-config-tests, code-quality]
    if: always()
    
    steps:
    - name: Check critical jobs status
      run: |
        if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
          echo "❌ Unit tests failed"
          exit 1
        fi
        
        echo "✅ Unit tests passed"
        
        # Report other job statuses but don't fail
        if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
          echo "⚠️ Integration tests failed (non-blocking)"
        else
          echo "✅ Integration tests passed"
        fi
        
        if [[ "${{ needs.gin-config-tests.result }}" != "success" ]]; then
          echo "⚠️ Gin configuration tests failed (non-blocking)"
        else
          echo "✅ Gin configuration tests passed"
        fi
        
        if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
          echo "⚠️ Code quality checks failed (non-blocking)"
        else
          echo "✅ Code quality checks passed"
        fi
        
        echo "🎉 CI pipeline completed - critical tests passed!"