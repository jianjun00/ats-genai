apiVersion: apps/v1
kind: Deployment
metadata:
  name: instrument-service
  namespace: ats-services
  labels:
    app: instrument-service
    component: business-service
    domain: instruments
spec:
  replicas: 3
  selector:
    matchLabels:
      app: instrument-service
  template:
    metadata:
      labels:
        app: instrument-service
        component: business-service
        domain: instruments
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ats-services-sa
      containers:
      - name: instrument-service
        image: ats-platform/instrument-service:1.0.0
        ports:
        - containerPort: 8001
          name: http
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "instrument-service"
        - name: SERVICE_VERSION
          value: "1.0.0"
        - name: SERVICE_HOST
          value: "0.0.0.0"
        - name: SERVICE_PORT
          value: "8001"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: ats-services-config
              key: POSTGRES_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: ats-services-config
              key: POSTGRES_PORT
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: ats-services-config
              key: POSTGRES_USER
        - name: DB_NAME
          value: "instruments_db"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ats-services-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: ats-services-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: ats-services-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ats-services-secrets
              key: REDIS_PASSWORD
        - name: SERVICE_REGISTRY_URL
          valueFrom:
            configMapKeyRef:
              name: ats-services-config
              key: SERVICE_REGISTRY_URL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ats-services-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: ats-services-config
              key: ENVIRONMENT
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 10
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
      volumes:
      - name: logs
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: instrument-service
  namespace: ats-services
  labels:
    app: instrument-service
    component: business-service
    domain: instruments
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: instrument-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: instrument-service-hpa
  namespace: ats-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: instrument-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: instrument-service-pdb
  namespace: ats-services
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: instrument-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: instrument-service-netpol
  namespace: ats-services
spec:
  podSelector:
    matchLabels:
      app: instrument-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ats-services
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 8001
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: service-registry
    ports:
    - protocol: TCP
      port: 8500
  # Allow external traffic for API calls
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to: []
    ports:
    - protocol: UDP
      port: 53