version: '3.8'

# Service-Based Architecture Deployment Configuration
# This docker-compose file orchestrates all services with proper networking,
# health checks, and service discovery integration.

networks:
  ats-services-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-services-data:
    driver: local
  redis-services-data:
    driver: local
  prometheus-services-data:
    driver: local
  grafana-services-data:
    driver: local

services:
  # === Core Infrastructure Services ===
  
  postgres-services:
    image: timescale/timescaledb:latest-pg13
    container_name: ats-services-postgres
    environment:
      POSTGRES_DB: ats_services
      POSTGRES_USER: services_user
      POSTGRES_PASSWORD: services_password
      POSTGRES_MULTIPLE_DATABASES: instruments_db,analytics_db,trading_db,news_db
    volumes:
      - postgres-services-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    ports:
      - "5433:5432"
    networks:
      ats-services-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U services_user -d ats_services"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-services:
    image: redis:7-alpine
    container_name: ats-services-redis
    command: redis-server --appendonly yes --requirepass services_redis_password
    volumes:
      - redis-services-data:/data
    ports:
      - "6380:6379"
    networks:
      ats-services-network:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # === Service Registry ===
  
  service-registry:
    build:
      context: ..
      dockerfile: deployment/dockerfiles/Dockerfile.service-registry
    container_name: ats-service-registry
    environment:
      - REGISTRY_PORT=8500
      - REGISTRY_HOST=0.0.0.0
      - HEALTH_CHECK_INTERVAL=30
      - LOG_LEVEL=INFO
    ports:
      - "8500:8500"
    networks:
      ats-services-network:
        ipv4_address: 172.20.0.20
    volumes:
      - ../src:/app/src
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # === Business Domain Services ===

  instrument-service:
    build:
      context: ..
      dockerfile: deployment/dockerfiles/Dockerfile.instrument-service
    container_name: ats-instrument-service
    environment:
      - SERVICE_NAME=instrument-service
      - SERVICE_PORT=8001
      - SERVICE_HOST=0.0.0.0
      - SERVICE_VERSION=1.0.0
      - DB_HOST=ats-services-postgres
      - DB_PORT=5432
      - DB_USER=services_user
      - DB_PASSWORD=services_password
      - DB_NAME=instruments_db
      - REDIS_HOST=ats-services-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=services_redis_password
      - SERVICE_REGISTRY_URL=http://service-registry:8500
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    ports:
      - "8001:8001"
    networks:
      ats-services-network:
        ipv4_address: 172.20.0.30
    volumes:
      - ../src:/app/src
      - ../logs:/app/logs
    depends_on:
      postgres-services:
        condition: service_healthy
      redis-services:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/instruments/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  analytics-service:
    build:
      context: ..
      dockerfile: deployment/dockerfiles/Dockerfile.analytics-service
    container_name: ats-analytics-service
    environment:
      - SERVICE_NAME=analytics-service
      - SERVICE_PORT=8002
      - SERVICE_HOST=0.0.0.0
      - SERVICE_VERSION=1.0.0
      - DB_HOST=ats-services-postgres
      - DB_PORT=5432
      - DB_USER=services_user
      - DB_PASSWORD=services_password
      - DB_NAME=analytics_db
      - REDIS_HOST=ats-services-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=services_redis_password
      - SERVICE_REGISTRY_URL=http://service-registry:8500
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    ports:
      - "8002:8002"
    networks:
      ats-services-network:
        ipv4_address: 172.20.0.31
    volumes:
      - ../src:/app/src
      - ../logs:/app/logs
      - /mnt/d/ats-data:/data
    depends_on:
      postgres-services:
        condition: service_healthy
      redis-services:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      instrument-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/analytics/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

  trading-service:
    build:
      context: ..
      dockerfile: deployment/dockerfiles/Dockerfile.trading-service
    container_name: ats-trading-service
    environment:
      - SERVICE_NAME=trading-service
      - SERVICE_PORT=8003
      - SERVICE_HOST=0.0.0.0
      - SERVICE_VERSION=1.0.0
      - DB_HOST=ats-services-postgres
      - DB_PORT=5432
      - DB_USER=services_user
      - DB_PASSWORD=services_password
      - DB_NAME=trading_db
      - REDIS_HOST=ats-services-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=services_redis_password
      - SERVICE_REGISTRY_URL=http://service-registry:8500
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    ports:
      - "8003:8003"
    networks:
      ats-services-network:
        ipv4_address: 172.20.0.32
    volumes:
      - ../src:/app/src
      - ../logs:/app/logs
    depends_on:
      postgres-services:
        condition: service_healthy
      redis-services:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      instrument-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/trading/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  news-service:
    build:
      context: ..
      dockerfile: deployment/dockerfiles/Dockerfile.news-service
    container_name: ats-news-service
    environment:
      - SERVICE_NAME=news-service
      - SERVICE_PORT=8004
      - SERVICE_HOST=0.0.0.0
      - SERVICE_VERSION=1.0.0
      - DB_HOST=ats-services-postgres
      - DB_PORT=5432
      - DB_USER=services_user
      - DB_PASSWORD=services_password
      - DB_NAME=news_db
      - REDIS_HOST=ats-services-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=services_redis_password
      - SERVICE_REGISTRY_URL=http://service-registry:8500
      - POLYGON_API_KEY=wfrcZNX3ZJJt55Or_CmBXda8G8e8tABD
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    ports:
      - "8004:8004"
    networks:
      ats-services-network:
        ipv4_address: 172.20.0.33
    volumes:
      - ../src:/app/src
      - ../logs:/app/logs
    depends_on:
      postgres-services:
        condition: service_healthy
      redis-services:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/v1/news/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # === API Gateway ===

  api-gateway:
    build:
      context: ..
      dockerfile: deployment/dockerfiles/Dockerfile.api-gateway
    container_name: ats-api-gateway
    environment:
      - GATEWAY_PORT=8000
      - GATEWAY_HOST=0.0.0.0
      - SERVICE_REGISTRY_URL=http://service-registry:8500
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    networks:
      ats-services-network:
        ipv4_address: 172.20.0.40
    volumes:
      - ../src:/app/src
      - ../logs:/app/logs
    depends_on:
      service-registry:
        condition: service_healthy
      instrument-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      trading-service:
        condition: service_healthy
      news-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # === Monitoring Services ===

  prometheus:
    image: prom/prometheus:latest
    container_name: ats-services-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-services-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
    networks:
      ats-services-network:
        ipv4_address: 172.20.0.50
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ats-services-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SMTP_ENABLED=false
    ports:
      - "3001:3000"
    volumes:
      - grafana-services-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources
    networks:
      ats-services-network:
        ipv4_address: 172.20.0.51
    depends_on:
      - prometheus
    restart: unless-stopped

  # === Load Balancer (Optional for Production) ===

  nginx-lb:
    image: nginx:alpine
    container_name: ats-services-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      ats-services-network:
        ipv4_address: 172.20.0.60
    depends_on:
      - api-gateway
    restart: unless-stopped
    profiles:
      - production

# === Service Management Commands ===
# Start core services: docker-compose -f docker-compose.services.yml up -d postgres-services redis-services service-registry
# Start business services: docker-compose -f docker-compose.services.yml up -d instrument-service analytics-service trading-service news-service
# Start full stack: docker-compose -f docker-compose.services.yml up -d
# Scale services: docker-compose -f docker-compose.services.yml up -d --scale analytics-service=3
# View logs: docker-compose -f docker-compose.services.yml logs -f instrument-service
# Health check: docker-compose -f docker-compose.services.yml ps