# Pre-commit configuration for ATS repository cleanup and quality
# Install: pip install pre-commit && pre-commit install

repos:
  # Code formatting and style
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        exclude: ^(migrations/|archived/)

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        exclude: ^(migrations/|archived/)

  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^k8s/
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: mixed-line-ending

  # Python-specific checks
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=88', '--ignore=E203,W503']
        exclude: ^(migrations/|archived/)

  # Repository cleanup
  - repo: local
    hooks:
      - id: cleanup-python-artifacts
        name: cleanup-python-artifacts
        entry: bash -c 'find . -name "*.pyc" -delete; find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: schema-anti-patterns
        name: Check for database schema anti-patterns
        entry: bash -c '
          echo "🔍 Checking for schema anti-patterns..."
          if grep -r "dev_training_datasets" src/ --include="*.py" 2>/dev/null; then
            echo "❌ Found incorrect table name '\''dev_training_datasets'\'' (should be '\''dev_training_dataset'\'')"
            exit 1
          fi
          if grep -r "created_at" src/ --include="*.py" 2>/dev/null; then
            echo "❌ Found incorrect column name '\''created_at'\'' (should be '\''creation_timestamp'\'')"
            exit 1
          fi
          echo "✅ No schema anti-patterns found"
        '
        language: system
        files: '^src/.*\.py$'
        pass_filenames: false

      - id: detect-k8s-conflicts
        name: detect-k8s-conflicts
        entry: python scripts/detect_k8s_conflicts.py k8s/
        language: python
        files: ^k8s/.*\.yaml$
        pass_filenames: false

      - id: check-doc-consistency
        name: check-doc-consistency  
        entry: bash -c 'if [ $(find docs/ -name "*.md" | wc -l) -gt 25 ]; then echo "Too many docs files ($(find docs/ -name "*.md" | wc -l) > 25). Consolidate documentation."; exit 1; fi'
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false

# Configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_schedule: weekly
  skip: [detect-k8s-conflicts]