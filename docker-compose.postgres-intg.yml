version: '3.8'

# Standalone PostgreSQL for ATS-INTG Environment
# Use this if you want to run only the database independently

services:
  postgres-intg:
    image: timescale/timescaledb:latest-pg13
    container_name: postgres-intg-standalone
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: intg_password
      POSTGRES_DB: intg_db
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=trust"
    
    ports:
      - "4434:5432"  # Updated to 400x range for integration PostgreSQL
    
    volumes:
      # Host-mounted data directory for persistence (CRITICAL for data safety)
      - /mnt/d/ats-data/intg/postgresql:/var/lib/postgresql/data
      - /mnt/d/ats-backup/intg:/backup
      - ./sql/init-intg-tables.sql:/docker-entrypoint-initdb.d/01-init-tables.sql
      # Mount timezone for proper timestamping
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    
    # Optimize PostgreSQL for time-series workloads
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.7
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c timezone='UTC'
      -c log_timezone='UTC'
      -c datestyle='iso, mdy'
      -c lc_messages='en_US.utf8'
      -c lc_monetary='en_US.utf8'
      -c lc_numeric='en_US.utf8'
      -c lc_time='en_US.utf8'
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intg_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    networks:
      - ats-intg-network

networks:
  ats-intg-network:
    driver: bridge
    name: ats-intg-network