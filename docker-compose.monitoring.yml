version: '3.8'

# ATS Platform Monitoring Stack
# Prometheus, Grafana, and log aggregation

name: ats-monitoring

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ats-prometheus
    restart: unless-stopped
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      
    ports:
      - "9090:9090"
      
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      
    networks:
      - ats-monitoring
      
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  grafana:
    image: grafana/grafana:latest
    container_name: ats-grafana
    restart: unless-stopped
    
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
      
    ports:
      - "3001:3000"
      
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      
    networks:
      - ats-monitoring
      
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ats-node-exporter
    restart: unless-stopped
    
    command:
      - '--path.rootfs=/host'
      
    volumes:
      - '/:/host:ro,rslave'
      
    networks:
      - ats-monitoring
      
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

  loki:
    image: grafana/loki:latest
    container_name: ats-loki
    restart: unless-stopped
    
    ports:
      - "3100:3100"
      
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      
    networks:
      - ats-monitoring
      
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    container_name: ats-promtail
    restart: unless-stopped
    
    volumes:
      - /var/log:/var/log:ro
      - /mnt/d/ats-logs:/ats-logs:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      
    networks:
      - ats-monitoring
      
    depends_on:
      - loki
      
    command: -config.file=/etc/promtail/config.yml

networks:
  ats-monitoring:
    driver: bridge

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
