version: '3.8'

networks:
  ats-monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ats-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped
    expose:
      - 9090
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./grafana/ats_coverage_alerts.yml:/etc/prometheus/ats_coverage_alerts.yml
      - ./grafana/ats_data_quality_agent_alerts.yml:/etc/prometheus/ats_data_quality_agent_alerts.yml
      - prometheus_data:/prometheus
    networks:
      - ats-monitoring

  grafana:
    image: grafana/grafana-oss:latest
    container_name: ats-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=ats_admin_2024
      - GF_USERS_ALLOW_SIGN_UP=false
    expose:
      - 3000
    ports:
      - "3030:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/ats-coverage-dashboard.json:/etc/grafana/provisioning/dashboards/ats-coverage-dashboard.json
      - ./grafana/ats-data-quality-agent-dashboard.json:/etc/grafana/provisioning/dashboards/ats-data-quality-agent-dashboard.json
    networks:
      - ats-monitoring
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ats-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - 9100
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - ats-monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: ats-alertmanager
    restart: unless-stopped
    expose:
      - 9093
    ports:
      - "9093:9093"
    volumes:
      - ./grafana/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - ats-monitoring
