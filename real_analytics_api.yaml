apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: ats-dev
  labels:
    app: ats-analytics
    component: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats-analytics
      component: api-server
  template:
    metadata:
      labels:
        app: ats-analytics
        component: api-server
    spec:
      containers:
      - name: analytics-api
        image: dragonflyer762/ats-genai:dev-latest
        command: ["python", "-m", "uvicorn"]
        args: ["main:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
        # Standard environment configuration
        - name: PYTHONPATH
          value: src
        - name: ENVIRONMENT
          value: dev
        - name: DB_CONNECTION_PARAMS
          value: sslmode=disable
        
        # Database credentials from centralized secret (standardized)
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        
        # API keys from centralized secret (optional)
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys-dev
              key: POLYGON_API_KEY
              optional: true
        ports:
        - containerPort: 8000
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"