version: '3.8'

services:
  # PostgreSQL for Dev Environment
  postgres-dev:
    image: postgres:13
    container_name: ats-dev-postgres
    environment:
      POSTGRES_DB: dev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-new:/var/lib/postgresql/data
      - /mnt/d/ats-backup/dev:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ats-network

  # PostgreSQL for Integration Environment
  postgres-intg:
    image: postgres:13
    container_name: ats-intg-postgres
    environment:
      POSTGRES_DB: intg_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: intg_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-intg-data:/var/lib/postgresql/data
      - /mnt/d/ats-backup/intg:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intg_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ats-network

  # ATS Analytics Service - Dev
  analytics-dev:
    image: dragonflyer762/ats-genai:latest
    container_name: ats-dev-analytics
    environment:
      - ENVIRONMENT=dev
      - DB_HOST=postgres-dev
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=dev_password
      - DB_NAME=dev_db
      - ATS_DATA_PATH=/data
      - ATS_BACKUP_PATH=/backup
      - ATS_LOGS_PATH=/logs
      - PYTHONPATH=/workspace/src
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - /mnt/d/ats-data:/data
      - /mnt/d/ats-backup:/backup
      - /mnt/d/ats-logs:/logs
    working_dir: /workspace
    command: python3 src/services/analytics_service.py
    depends_on:
      postgres-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ats-network

  # ATS Analytics Service - Integration
  analytics-intg:
    image: dragonflyer762/ats-genai:latest
    container_name: ats-intg-analytics
    environment:
      - ENVIRONMENT=intg
      - DB_HOST=postgres-intg
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=intg_password
      - DB_NAME=intg_db
      - ATS_DATA_PATH=/data
      - ATS_BACKUP_PATH=/backup
      - ATS_LOGS_PATH=/logs
      - PYTHONPATH=/workspace/src
    ports:
      - "3002:3000"
    volumes:
      - .:/workspace
      - /mnt/d/ats-data:/data
      - /mnt/d/ats-backup:/backup
      - /mnt/d/ats-logs:/logs
    working_dir: /workspace
    command: python3 src/services/analytics_service.py
    depends_on:
      postgres-intg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ats-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: ats-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/d/ats-data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - ats-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: ats-grafana
    ports:
      - "3001:3000"
    volumes:
      - /mnt/d/ats-data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    networks:
      - ats-network

  # AlertManager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: ats-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /mnt/d/ats-data/alertmanager:/alertmanager
    restart: unless-stopped
    networks:
      - ats-network

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ats-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - ats-network

  # Daily Price Collector - Dev
  price-collector-dev:
    image: dragonflyer762/ats-genai:latest
    container_name: ats-dev-price-collector
    environment:
      - ENVIRONMENT=dev
      - DB_HOST=postgres-dev
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=dev_password
      - DB_NAME=dev_db
      - ATS_DATA_PATH=/data
      - ATS_LOGS_PATH=/logs
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - TIINGO_API_KEY=${TIINGO_API_KEY}
      - EODHD_API_KEY=${EODHD_API_KEY}
    volumes:
      - .:/workspace
      - /mnt/d/ats-data:/data
      - /mnt/d/ats-logs:/logs
    working_dir: /workspace
    command: python3 scripts/daily_price_collector.py
    depends_on:
      postgres-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ats-network

  # Daily Price Collector - Integration
  price-collector-intg:
    image: dragonflyer762/ats-genai:latest
    container_name: ats-intg-price-collector
    environment:
      - ENVIRONMENT=intg
      - DB_HOST=postgres-intg
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=intg_password
      - DB_NAME=intg_db
      - ATS_DATA_PATH=/data
      - ATS_LOGS_PATH=/logs
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - TIINGO_API_KEY=${TIINGO_API_KEY}
      - EODHD_API_KEY=${EODHD_API_KEY}
    volumes:
      - .:/workspace
      - /mnt/d/ats-data:/data
      - /mnt/d/ats-logs:/logs
    working_dir: /workspace
    command: python3 scripts/daily_price_collector.py
    depends_on:
      postgres-intg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ats-network

networks:
  ats-network:
    driver: bridge
    name: ats-network

volumes:
  postgres-data-new:
    external: true
  postgres-intg-data:
    driver: local