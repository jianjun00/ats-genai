# Prometheus configuration for ATS Data Coverage Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "ats_coverage_alerts.yml"

# A scrape configuration containing exactly one endpoint to scrape:
scrape_configs:
  # ATS Coverage Monitoring metrics
  - job_name: 'ats-coverage-monitoring'
    static_configs:
      - targets: ['localhost:9090']  # Prometheus itself
    scrape_interval: 30s
    metrics_path: '/metrics'

  # File-based metrics export (for coverage metrics)
  - job_name: 'ats-coverage-file'
    file_sd_configs:
      - files:
        - '/tmp/ats_coverage_metrics.prom'
    scrape_interval: 60s
    
  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s

  # PostgreSQL exporter (if available)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 30s