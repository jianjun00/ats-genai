# Prometheus configuration for ATS Data Coverage Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "ats_coverage_alerts.yml"
  - "ats_data_quality_agent_alerts.yml"

# A scrape configuration containing exactly one endpoint to scrape:
scrape_configs:
  # ATS Coverage Monitoring metrics
  - job_name: 'ats-coverage-monitoring'
    static_configs:
      - targets: ['localhost:9090']  # Prometheus itself
    scrape_interval: 30s
    metrics_path: '/metrics'

  # ATS Analytics Service health endpoint
  - job_name: 'ats-analytics-health'
    static_configs:
      - targets: ['host.docker.internal:4000']
    metrics_path: '/health'
    scrape_interval: 30s
    
  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['ats-node-exporter:9100']
    scrape_interval: 15s

  # PostgreSQL exporter (if available)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['host.docker.internal:9187']
    scrape_interval: 30s

  # ATS Data Quality Agent metrics (when implemented)
  - job_name: 'ats-data-quality-agent'
    static_configs:
      - targets: ['host.docker.internal:4000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    
  # ATS Analytics Service status monitoring  
  - job_name: 'ats-analytics-monitoring'
    static_configs:
      - targets: ['host.docker.internal:4000']
    metrics_path: '/data-quality/api/issues'
    scrape_interval: 15s