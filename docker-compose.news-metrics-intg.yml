version: '3.8'

services:
  ats-intg-news-metrics:
    image: dragonflyer762/ats-genai:latest
    container_name: ats-intg-news-metrics
    networks:
      - ats-intg-network
      - ats-network
    ports:
      - "8082:8082"
    environment:
      # Service Configuration
      - ENVIRONMENT=intg
      - SERVICE_PORT=8082
      - PYTHONPATH=/workspace/src
      
      # Database Configuration
      - DB_HOST=ats-intg-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=intg_password
      - DB_NAME=intg_db
      
      # API Keys
      - POLYGON_API_KEY=wfrcZNX3ZJJt55Or_CmBXda8G8e8tABD
      
      # OpenTelemetry Configuration for SigNoz
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4318
      - OTEL_SERVICE_NAME=ats-intg-news-collection
      - OTEL_RESOURCE_ATTRIBUTES=environment=intg,ats.component=news-ingestion
      
      # Python OpenTelemetry Configuration  
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      - OTEL_PYTHON_LOG_CORRELATION=true
    
    volumes:
      - /home/jianjun/ats-genai-data:/workspace
      - /mnt/d/ats-data:/data
      - /mnt/d/ats-logs:/logs
    
    working_dir: /workspace
    
    command: >
      bash -c "
        echo '📦 Installing OpenTelemetry packages...' &&
        pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http opentelemetry-instrumentation-asyncpg opentelemetry-instrumentation-aiohttp-client opentelemetry-instrumentation-logging &&
        echo '🚀 Starting news collection service with metrics...' &&
        python3 scripts/news_collection_with_metrics.py
      "
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    

networks:
  ats-intg-network:
    external: true
  ats-network:
    external: true
