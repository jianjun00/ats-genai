[project]
name = "ats-genai"
version = "0.0.0"
description = "ATS GenAI project"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "ATS Team" }
]

# Core runtime dependencies migrated from requirements.txt
dependencies = [
  "fastapi",
  "uvicorn",
  "alpaca-py",
  "pandas",
  "pandas_ta",
  "pandas-market-calendars>=4.4.1",
  "h5py>=3.14.0",
  "scikit-learn>=1.5.2",
  "torch",
  "typing-extensions",
  "httpx[http2]",
  "websockets",
  "python-dotenv",
  "asyncpg",
  "async-timeout",
  "pandas_market_calendars",
  "aiohttp",
  "psycopg2-binary",
  "sqlparse",
  "hydra-core>=1.3.2",
  "gin-config>=0.5.0",
  "ray",
  "ib-async>=2.0.1",
  "ib-insync>=0.9.86",
  "pyarrow>=21.0.0",
  "protobuf>=5.29.2",
  "response>=0.5.0",
  "responses>=0.25.8",
  "yfinance",
  "transformers",
  "textblob",
  "nltk",
  "scikit-learn",
  "pydantic>=2.0.0",
  "redis>=4.0.0",
  "sqlalchemy>=2.0.0",
  "aioresponses",
  "seaborn",
  "matplotlib",
  "plotly",
  "streamlit",
  "ipython",
  "jupyter",
  "feedparser",
  "torchvision",
  "beautifulsoup4",
  "requests-html",
]

[tool.uv]
# Ensure test tooling is available in the dev environment
dev-dependencies = [
  "pytest",
  "pytest-asyncio",
]
