apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-api
  namespace: ats-dev
  labels:
    app: ats-api
    component: api
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats-api
  template:
    metadata:
      labels:
        app: ats-api
        component: api
        environment: dev
    spec:
      containers:
      - name: ats-api
        image: dragonflyer762/ats-genai:dev-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PYTHONPATH
          value: "/app/src"
        - name: ENVIRONMENT
          value: "dev"
        - name: LOG_LEVEL
          value: "DEBUG"
        - name: SKIP_DB_SETUP
          value: "true"
        resources:
          limits:
            cpu: "250m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
