apiVersion: v1
kind: ConfigMap
metadata:
  name: unified-webapp-config
  namespace: ats-dev
# Script extracted to /scripts/webapp.py
# Original ConfigMap data removed for cleanup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-webapp
  namespace: ats-dev
  labels:
    app: unified-webapp
    component: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unified-webapp
  template:
    metadata:
      labels:
        app: unified-webapp
        component: analytics
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        ports:
        - containerPort: 3000
          name: http
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Installing dependencies for unified webapp..."
          pip install --no-cache-dir fastapi==0.104.1 uvicorn[standard]==0.24.0 asyncpg==0.29.0 pydantic==2.5.0 numpy pandas
          
          echo "📝 Starting unified analytics application..."
          cp /config/webapp.py /app.py
          python /app.py
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        volumeMounts:
        - name: webapp-config
          mountPath: /config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: webapp-config
        configMap:
          name: unified-webapp-config

---
apiVersion: v1
kind: Service
metadata:
  name: unified-webapp-service
  namespace: ats-dev
  labels:
    app: unified-webapp
spec:
  type: NodePort
  selector:
    app: unified-webapp
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30011