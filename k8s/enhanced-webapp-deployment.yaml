apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-analytics-webapp
  namespace: ats-dev
  labels:
    app: enhanced-analytics-webapp
    component: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhanced-analytics-webapp
  template:
    metadata:
      labels:
        app: enhanced-analytics-webapp
        component: webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        ports:
        - containerPort: 3000
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/enhanced_webapp_deployment_1.py"
---
apiVersion: v1
kind: Service
metadata:
  name: enhanced-analytics-webapp-service
  namespace: ats-dev
spec:
  selector:
    app: enhanced-analytics-webapp
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30002
  type: NodePort