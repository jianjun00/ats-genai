apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-analytics-webapp
  namespace: ats-dev
  labels:
    app: enhanced-analytics-webapp
    component: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhanced-analytics-webapp
  template:
    metadata:
      labels:
        app: enhanced-analytics-webapp
        component: webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        ports:
        - containerPort: 3000
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "🚀 Starting Enhanced Analytics Webapp..."
          pip install --no-cache-dir fastapi uvicorn asyncpg pydantic
          
          cat > /app/webapp.py << 'EOF'
          from fastapi import FastAPI
          import uvicorn
          
          app = FastAPI(title="Enhanced Analytics Webapp", version="1.0")
          
          @app.get("/")
          async def root():
              return {"message": "Enhanced Analytics Webapp", "status": "running"}
              
          @app.get("/health")
          async def health():
              return {"status": "healthy"}
          
          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=3000)
          EOF
          
          cd /app && python webapp.py
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
              optional: true
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
              optional: true
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: enhanced-analytics-webapp-service
  namespace: ats-dev
spec:
  selector:
    app: enhanced-analytics-webapp
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30002
  type: NodePort