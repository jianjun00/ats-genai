apiVersion: batch/v1
kind: Job
metadata:
  name: complete-market-cap-schema-fix
  namespace: ats-dev
  labels:
    app: ats-genai
    component: final-schema-fix
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: final-schema-fixer
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🔧 Completing market cap table schema fix..."
          pip install --no-cache-dir asyncpg
          
          mkdir -p /app
          cd /app
          
          # Create final schema fix script
          cat > /app/complete_schema_fix.py << 'EOF'
          import asyncio
          import asyncpg
          import os
          
          class SimpleEnvironment:
              def get_table_name(self, base_name):
                  return f"dev_{base_name}"
              
              def get_database_url(self):
                  host = os.environ.get('DB_HOST', 'postgres-simple')
                  port = os.environ.get('DB_PORT', '5432')
                  user = os.environ.get('DB_USER', 'postgres')
                  password = os.environ.get('DB_PASSWORD', 'dev_password')
                  database = os.environ.get('DB_NAME', 'dev_db')
                  return f"postgresql://{user}:{password}@{host}:{port}/{database}"
          
          async def complete_schema_fix():
              """Complete market cap table schema fix"""
              
              env = SimpleEnvironment()
              db_url = env.get_database_url()
              
              pool = await asyncpg.create_pool(db_url, min_size=1, max_size=2)
              
              try:
                  async with pool.acquire() as conn:
                      print("🔧 Adding final missing column...")
                      
                      # Add updated_at column
                      try:
                          await conn.execute("""
                              ALTER TABLE dev_daily_market_cap 
                              ADD COLUMN IF NOT EXISTS updated_at TIMESTAMP WITHOUT TIME ZONE DEFAULT NOW()
                          """)
                          print("✅ Added updated_at column")
                      except Exception as e:
                          print(f"⚠️  Error adding updated_at: {e}")
                      
                      # Test complete insert
                      print(f"\n🧪 Testing complete insert operation...")
                      try:
                          await conn.execute("""
                              INSERT INTO dev_daily_market_cap 
                              (instrument_id, date, market_cap, shares_outstanding, price_used, source, created_at, updated_at)
                              VALUES (1, '2025-08-19', 1000000000, 100000000, 10.0, 'test', NOW(), NOW())
                              ON CONFLICT (instrument_id, date) DO UPDATE SET
                                  market_cap = EXCLUDED.market_cap,
                                  shares_outstanding = EXCLUDED.shares_outstanding,
                                  price_used = EXCLUDED.price_used,
                                  source = EXCLUDED.source,
                                  updated_at = NOW()
                          """)
                          print("✅ Complete insert/update successful")
                          
                          # Clean up test record
                          await conn.execute("""
                              DELETE FROM dev_daily_market_cap 
                              WHERE instrument_id = 1 AND date = '2025-08-19' AND source = 'test'
                          """)
                          print("✅ Test cleanup successful")
                          
                      except Exception as e:
                          print(f"❌ Complete insert failed: {e}")
                          return False
                      
                      # Show final schema
                      print(f"\n📊 FINAL SCHEMA:")
                      final_columns = await conn.fetch("""
                          SELECT column_name, data_type, is_nullable, column_default
                          FROM information_schema.columns 
                          WHERE table_name = 'dev_daily_market_cap' 
                            AND table_schema = 'public'
                          ORDER BY ordinal_position
                      """)
                      
                      for col in final_columns:
                          default = f" DEFAULT {col['column_default']}" if col['column_default'] else ""
                          nullable = "NULL" if col['is_nullable'] == 'YES' else "NOT NULL"
                          print(f"  ✓ {col['column_name']}: {col['data_type']} {nullable}{default}")
                      
                      print(f"\n🎉 Market cap table schema is now complete!")
                      return True
              
              finally:
                  await pool.close()
          
          if __name__ == "__main__":
              success = asyncio.run(complete_schema_fix())
              if not success:
                  exit(1)
          EOF
          
          echo "🔄 Running final schema fix..."
          python /app/complete_schema_fix.py
        env:
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"