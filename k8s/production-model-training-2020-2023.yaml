apiVersion: batch/v1
kind: Job
metadata:
  name: production-model-training-2020-2023
  namespace: ats-dev
  labels:
    app: ml-training
    job-type: production-model
    dataset: all-instruments-2020-2023
spec:
  # Allow job to run for up to 8 hours
  activeDeadlineSeconds: 28800
  # Retry once if failed
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: ml-training
        job-type: production-model
    spec:
      restartPolicy: Never
      containers:
      - name: model-trainer
        image: python:3.12-slim
        resources:
          requests:
            memory: "8Gi"
            cpu: "4"
          limits:
            memory: "16Gi"
            cpu: "8"
        env:
        - name: PYTHONPATH
          value: "src"
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: DB_CONNECTION_PARAMS
          value: "sslmode=disable"
        # Ray configuration for distributed processing
        - name: RAY_DISABLE_DASHBOARD
          value: "1"
        - name: RAY_USAGE_STATS_ENABLED
          value: "0"
        - name: RAY_ADDRESS
          value: ""
        - name: RAY_DISABLE_AUTOMATIC_AUTOSCALING
          value: "1"
        # Memory optimizations
        - name: PYTHONHASHSEED
          value: "0"
        - name: OMP_NUM_THREADS
          value: "4"
        - name: NUMBA_NUM_THREADS
          value: "4"
        workingDir: /app
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/production_model_training_2020_2023_1.py"---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ats-training-code
  namespace: ats-dev
# Script extracted to /scripts/train_production_model_2020_2023.py
# Original ConfigMap data removed for cleanup---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage-pvc
  namespace: ats-dev
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: model-training-monitor
  namespace: ats-dev
  labels:
    app: ml-training
spec:
  selector:
    app: ml-training
  ports:
  - port: 8080
    targetPort: 8080
    name: metrics
  type: ClusterIP