apiVersion: v1
kind: ConfigMap
metadata:
  name: database-migration-script
  namespace: ats-dev
# Script extracted to /scripts/run_migrations.py
# Original ConfigMap data removed for cleanup---
apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration-job
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: migrate-db
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/run_database_migrations_1.py"