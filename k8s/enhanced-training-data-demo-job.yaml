apiVersion: batch/v1
kind: Job
metadata:
  name: enhanced-training-data-demo
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: enhanced-training-data-demo
        image: dragonflyer762/ats-genai:dev-latest
        command:
          - python
          - scripts/demo_enhanced_training_data.py
        env:
        - name: DB_HOST
          value: postgres-simple
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          value: dev_password
        - name: DB_NAME
          value: dev_db
        - name: PYTHONPATH
          value: /app/src
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        volumeMounts:
        - name: output-storage
          mountPath: /app/enhanced_training_data_demo
      volumes:
      - name: output-storage
        emptyDir: {}
      restartPolicy: Never
  backoffLimit: 3