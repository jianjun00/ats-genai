apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixed-analytics-webapp
  namespace: ats-dev
  labels:
    app: fixed-analytics-webapp
    component: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixed-analytics-webapp
  template:
    metadata:
      labels:
        app: fixed-analytics-webapp
        component: webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        ports:
        - containerPort: 3000
          name: http
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Installing dependencies..."
          pip install --no-cache-dir \
            fastapi==0.104.1 \
            uvicorn[standard]==0.24.0 \
            asyncpg==0.29.0 \
            pydantic==2.5.0 \
            pandas==2.0.3 \
            numpy==1.24.3 \
            redis==5.0.1 \
            gin-config==0.5.0
          
          echo "📝 Setting up source code structure..."
          mkdir -p /app/src/config
          mkdir -p /app/src/analytics
          mkdir -p /app/src/dao
          mkdir -p /app/training_data
          
          # Create minimal environment config
          cat > /app/src/config/__init__.py << 'EOF'
          EOF
          
          cat > /app/src/config/environment.py << 'EOF'
import os
import gin

@gin.configurable
class Environment:
    def __init__(self, db_url=None):
        self.db_host = os.getenv('DB_HOST', 'postgres-simple')
        self.db_user = os.getenv('DB_USER', 'postgres')
        self.db_password = os.getenv('DB_PASSWORD', 'dev_password')
        self.db_name = os.getenv('DB_NAME', 'dev_db')
        self.db_port = os.getenv('DB_PORT', '5432')
        
    def get_database_url(self):
        return f"postgresql://{self.db_user}:{self.db_password}@{self.db_host}:{self.db_port}/{self.db_name}"
        
    def get_table_name(self, base_name):
        return f"dev_{base_name}"
EOF

          # Create minimal analytics stub
          cat > /app/src/analytics/__init__.py << 'EOF'
          EOF
          
          cat > /app/src/analytics/portfolio_analytics.py << 'EOF'
class PortfolioAnalyticsEngine:
    def __init__(self, env):
        self.env = env
        
    async def initialize(self):
        print("Portfolio analytics engine initialized (stub)")
        
