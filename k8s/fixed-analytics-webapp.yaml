        pass
EOF
          
          echo "📝 Starting application..."
          export PYTHONPATH=/app/src
          cp /config/webapp.py /app.py
          python /app.py
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        volumeMounts:
        - name: webapp-config
          mountPath: /config
        - name: training-data
          mountPath: /app/training_data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: webapp-config
        configMap:
          name: fixed-analytics-webapp-config
      - name: training-data
        emptyDir: {}  # This would be a real volume mount in production

