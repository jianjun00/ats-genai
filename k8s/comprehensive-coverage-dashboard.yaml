apiVersion: v1
kind: ConfigMap
metadata:
  name: comprehensive-coverage-config
  namespace: ats-dev
# Script extracted to /scripts/app.py
# Original ConfigMap data removed for cleanup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comprehensive-coverage-dashboard
  namespace: ats-dev
  labels:
    app: comprehensive-coverage
    component: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comprehensive-coverage
  template:
    metadata:
      labels:
        app: comprehensive-coverage
        component: analytics
    spec:
      containers:
      - name: analytics
        image: python:3.12-slim
        ports:
        - containerPort: 5000
          name: http
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Installing comprehensive analytics dependencies..."
          pip install --no-cache-dir fastapi==0.104.1 uvicorn[standard]==0.24.0 asyncpg==0.29.0 pydantic==2.5.0
          
          echo "📊 Setting up 30-year coverage analytics..."
          cp /config/app.py /app.py
          
          echo "🎯 Starting Comprehensive Coverage Analytics Dashboard..."
          python /app.py
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        volumeMounts:
        - name: dashboard-config
          mountPath: /config
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: dashboard-config
        configMap:
          name: comprehensive-coverage-config

---
apiVersion: v1
kind: Service
metadata:
  name: comprehensive-coverage-service
  namespace: ats-dev
  labels:
    app: comprehensive-coverage
spec:
  type: NodePort
  selector:
    app: comprehensive-coverage
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30300