apiVersion: batch/v1
kind: Job
metadata:
  name: monitor-30year-price-progress
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 86400  # Keep for 24 hours
  template:
    spec:
      containers:
      - name: progress-monitor
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "🚀 Installing dependencies..."
          pip install asyncpg tabulate
          
          echo "📊 Creating 30-year price collection progress monitor..."
          mkdir -p /app
          cat > /app/monitor_progress.py << 'EOF'
          import asyncio
          import asyncpg
          import logging
          from datetime import datetime, timedelta
          from typing import Dict, List
          import time
          from tabulate import tabulate
          
          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
          logger = logging.getLogger("progress_monitor")
          
          class ProgressMonitor:
              def __init__(self, db_connection: asyncpg.Connection):
                  self.conn = db_connection
                  
              async def get_vendor_progress(self, vendor: str) -> Dict:
                  """Get progress statistics for a specific vendor"""
                  stats = await self.conn.fetchrow("""
                      SELECT 
                          COUNT(*) as total_symbols,
                          COUNT(CASE WHEN status = 'completed' THEN 1 END) as completed,
                          COUNT(CASE WHEN status = 'failed' THEN 1 END) as failed,
                          COUNT(CASE WHEN status = 'processing' THEN 1 END) as processing,
                          COUNT(CASE WHEN status = 'pending' THEN 1 END) as pending,
                          COALESCE(SUM(records_collected), 0) as total_records,
                          MIN(created_at) as started_at,
                          MAX(completed_at) as last_activity
                      FROM vendor_job_progress 
                      WHERE vendor = $1
                      AND job_id LIKE '%30year%'
                  """, vendor)
                  
                  if not stats:
                      return {
                          'vendor': vendor,
                          'status': 'Not Started',
                          'total_symbols': 0,
                          'completed': 0,
                          'failed': 0,
                          'processing': 0,
                          'pending': 0,
                          'total_records': 0,
                          'progress_pct': 0.0,
                          'success_rate': 0.0,
                          'started_at': None,
                          'last_activity': None
                      }
                  
                  # Calculate metrics
                  total = stats['total_symbols']
                  completed = stats['completed']
                  failed = stats['failed']
                  processing = stats['processing']
                  pending = stats['pending']
                  
                  progress_pct = (completed / total * 100) if total > 0 else 0
                  success_rate = (completed / (completed + failed) * 100) if (completed + failed) > 0 else 0
                  
                  # Determine status
                  if processing > 0:
                      status = "🔄 Running"
                  elif pending == 0:
                      status = "✅ Completed" if failed == 0 else "⚠️ Completed with Errors"
                  else:
                      status = "⏸️ Paused"
                  
                  return {
                      'vendor': vendor,
                      'status': status,
                      'total_symbols': total,
                      'completed': completed,
                      'failed': failed,
                      'processing': processing,
                      'pending': pending,
                      'total_records': stats['total_records'],
                      'progress_pct': progress_pct,
                      'success_rate': success_rate,
                      'started_at': stats['started_at'],
                      'last_activity': stats['last_activity']
                  }
                  
              async def get_recent_activity(self, vendor: str, limit: int = 5) -> List[Dict]:
                  """Get recent activity for a vendor"""
                  recent = await self.conn.fetch("""
                      SELECT symbol, status, records_collected, completed_at, error_message
                      FROM vendor_job_progress 
                      WHERE vendor = $1
                      AND job_id LIKE '%30year%'
                      AND (completed_at IS NOT NULL OR error_message IS NOT NULL)
                      ORDER BY COALESCE(completed_at, created_at) DESC
                      LIMIT $2
                  """, vendor, limit)
                  
                  return [dict(row) for row in recent]
                  
              async def get_database_size_stats(self) -> Dict:
                  """Get database storage statistics"""
                  stats = {}
                  
                  # Get table sizes for each vendor
                  for vendor in ['tiingo', 'fmp', 'alphavantage']:
                      table_name = f'dev_{vendor}_prices'
                      try:
                          count = await self.conn.fetchval(f"""
                              SELECT COUNT(*) FROM {table_name}
                          """)
                          
                          size_info = await self.conn.fetchrow(f"""
                              SELECT 
                                  pg_size_pretty(pg_total_relation_size($1)) as table_size,
                                  pg_size_pretty(pg_relation_size($1)) as data_size
                          """, table_name)
                          
                          stats[vendor] = {
                              'records': count,
                              'table_size': size_info['table_size'] if size_info else 'N/A',
                              'data_size': size_info['data_size'] if size_info else 'N/A'
                          }
                      except Exception as e:
                          stats[vendor] = {
                              'records': 0,
                              'table_size': 'N/A',
                              'data_size': 'N/A',
                              'error': str(e)
                          }
                  
                  return stats
                  
              async def display_progress_dashboard(self):
                  """Display comprehensive progress dashboard"""
                  logger.info("=" * 100)
                  logger.info("🎯 30-YEAR DAILY PRICE COLLECTION PROGRESS DASHBOARD")
                  logger.info("=" * 100)
                  
                  # Get progress for all vendors
                  vendors = ['tiingo', 'fmp', 'alphavantage']
                  vendor_stats = []
                  
                  for vendor in vendors:
                      stats = await self.get_vendor_progress(vendor)
                      vendor_stats.append(stats)
                  
                  # Create summary table
                  summary_data = []
                  total_symbols_all = 0
                  total_completed_all = 0
                  total_records_all = 0
                  
                  for stats in vendor_stats:
                      summary_data.append([
                          stats['vendor'].upper(),
                          stats['status'],
                          f"{stats['completed']:,}/{stats['total_symbols']:,}",
                          f"{stats['progress_pct']:.1f}%",
                          f"{stats['success_rate']:.1f}%",
                          f"{stats['total_records']:,}",
                          f"{stats['failed']:,}",
                          f"{stats['processing']:,}",
                          f"{stats['pending']:,}"
                      ])
                      
                      total_symbols_all += stats['total_symbols']
                      total_completed_all += stats['completed']
                      total_records_all += stats['total_records']
                  
                  # Add totals row
                  overall_progress = (total_completed_all / total_symbols_all * 100) if total_symbols_all > 0 else 0
                  summary_data.append([
                      "TOTAL",
                      "📊 Combined",
                      f"{total_completed_all:,}/{total_symbols_all:,}",
                      f"{overall_progress:.1f}%",
                      "N/A",
                      f"{total_records_all:,}",
                      "N/A",
                      "N/A",
                      "N/A"
                  ])
                  
                  headers = ["Vendor", "Status", "Progress", "% Done", "Success %", "Records", "Failed", "Processing", "Pending"]
                  print("\n📊 VENDOR PROGRESS SUMMARY")
                  print(tabulate(summary_data, headers=headers, tablefmt="grid"))
                  
                  # Database storage statistics
                  db_stats = await self.get_database_size_stats()
                  storage_data = []
                  
                  for vendor, stats in db_stats.items():
                      storage_data.append([
                          vendor.upper(),
                          f"{stats['records']:,}",
                          stats['table_size'],
                          stats['data_size']
                      ])
                  
                  print("\n💾 DATABASE STORAGE STATISTICS")
                  storage_headers = ["Vendor", "Records Stored", "Total Size", "Data Size"]
                  print(tabulate(storage_data, headers=storage_headers, tablefmt="grid"))
                  
                  # Recent activity for each vendor
                  for vendor in vendors:
                      recent_activity = await self.get_recent_activity(vendor, 3)
                      if recent_activity:
                          print(f"\n🔄 RECENT ACTIVITY - {vendor.upper()}")
                          activity_data = []
                          for activity in recent_activity:
                              status_icon = "✅" if activity['status'] == 'completed' else "❌"
                              activity_data.append([
                                  activity['symbol'],
                                  f"{status_icon} {activity['status']}",
                                  f"{activity['records_collected']:,}" if activity['records_collected'] else "0",
                                  activity['completed_at'].strftime("%H:%M:%S") if activity['completed_at'] else "N/A",
                                  activity['error_message'][:50] + "..." if activity['error_message'] and len(activity['error_message']) > 50 else (activity['error_message'] or "")
                              ])
                          
                          activity_headers = ["Symbol", "Status", "Records", "Time", "Error"]
                          print(tabulate(activity_data, headers=activity_headers, tablefmt="simple"))
                  
                  # Performance metrics
                  print(f"\n⏱️ PERFORMANCE METRICS")
                  print(f"📅 Dashboard updated: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}")
                  
                  # Calculate processing rates
                  for stats in vendor_stats:
                      if stats['started_at'] and stats['completed'] > 0:
                          duration = datetime.now() - stats['started_at']
                          rate = stats['completed'] / (duration.total_seconds() / 3600)  # symbols per hour
                          
                          # Estimate completion time
                          if stats['pending'] > 0 and rate > 0:
                              eta_hours = stats['pending'] / rate
                              eta = datetime.now() + timedelta(hours=eta_hours)
                              print(f"🚀 {stats['vendor'].upper()}: {rate:.1f} symbols/hour, ETA: {eta.strftime('%Y-%m-%d %H:%M')}")
                          else:
                              print(f"🚀 {stats['vendor'].upper()}: {rate:.1f} symbols/hour")
                  
                  logger.info("=" * 100)
          
          async def main():
              """Main monitoring function"""
              try:
                  # Database connection
                  conn = await asyncpg.connect(
                      host='postgres',
                      port=5432,
                      user='postgres',
                      password='dev_password',
                      database='dev_db'
                  )
                  logger.info("✅ Connected to database")
                  
                  # Create progress monitor
                  monitor = ProgressMonitor(conn)
                  
                  # Display dashboard every 30 seconds, 20 times (10 minutes total)
                  for i in range(20):
                      await monitor.display_progress_dashboard()
                      
                      if i < 19:  # Don't sleep after the last iteration
                          logger.info(f"\n⏳ Next update in 30 seconds... ({i+1}/20)")
                          await asyncio.sleep(30)
                  
                  await conn.close()
                  logger.info("🎉 Progress monitoring completed!")
                  
              except Exception as e:
                  logger.error(f"💥 Monitor failed: {e}")
                  raise
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          cd /app && python monitor_progress.py
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
      restartPolicy: OnFailure