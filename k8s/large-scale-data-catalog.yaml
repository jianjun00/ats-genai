apiVersion: v1
kind: ConfigMap
metadata:
  name: large-scale-data-catalog-config
  namespace: ats-dev
# Script extracted to /scripts/app.py
# Original ConfigMap data removed for cleanup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: large-scale-data-catalog
  namespace: ats-dev
  labels:
    app: large-scale-data-catalog
    component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: large-scale-data-catalog
  template:
    metadata:
      labels:
        app: large-scale-data-catalog
        component: dashboard
    spec:
      containers:
      - name: dashboard
        image: python:3.12-slim
        ports:
        - containerPort: 5000
          name: http
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Installing high-performance dependencies..."
          pip install --no-cache-dir fastapi==0.104.1 uvicorn[standard]==0.24.0 asyncpg==0.29.0 pydantic==2.5.0
          
          echo "📂 Setting up large-scale analytics application..."
          cp /config/app.py /app.py
          
          echo "📊 Starting Large Scale Data Catalog Dashboard..."
          python /app.py
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        volumeMounts:
        - name: dashboard-config
          mountPath: /config
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: dashboard-config
        configMap:
          name: large-scale-data-catalog-config

---
apiVersion: v1
kind: Service
metadata:
  name: large-scale-data-catalog-service
  namespace: ats-dev
  labels:
    app: large-scale-data-catalog
spec:
  type: NodePort
  selector:
    app: large-scale-data-catalog
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30200