apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-import-script
  namespace: monitoring
data:
  import_dashboards.sh: |
    #!/bin/bash
    set -e
    
    echo "🔍 Importing dashboards manually via Grafana API..."
    
    # Wait for Grafana to be ready
    echo "Waiting for Grafana to be ready..."
    until curl -s http://grafana:3000/api/health | grep -q "ok"; do
      echo "Waiting for Grafana..."
      sleep 5
    done
    
    echo "✅ Grafana is ready"
    
    # Create data source first
    echo "Creating Prometheus data source..."
    curl -X POST \
      -H "Content-Type: application/json" \
      -d '{
        "name": "Prometheus",
        "type": "prometheus",
        "url": "http://prometheus:9090",
        "access": "proxy",
        "isDefault": true
      }' \
      http://admin:admin123@grafana:3000/api/datasources || echo "Data source might already exist"
    
    # Import Kubernetes dashboard
    echo "Importing Kubernetes dashboard..."
    curl -X POST \
      -H "Content-Type: application/json" \
      -d @/dashboards/kubernetes-cluster-monitoring.json \
      http://admin:admin123@grafana:3000/api/dashboards/db || echo "Failed to import Kubernetes dashboard"
    
    # Import PostgreSQL dashboard  
    echo "Importing PostgreSQL dashboard..."
    curl -X POST \
      -H "Content-Type: application/json" \
      -d @/dashboards/postgresql-database-monitoring.json \
      http://admin:admin123@grafana:3000/api/dashboards/db || echo "Failed to import PostgreSQL dashboard"
    
    echo "✅ Dashboard import completed"
    
    # List available dashboards
    echo "📊 Available dashboards:"
    curl -s http://admin:admin123@grafana:3000/api/search?type=dash-db | jq '.[] | {title: .title, uid: .uid}'
    
  kubernetes-dashboard-import.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Kubernetes Cluster Monitoring",
        "tags": ["kubernetes", "monitoring"],
        "timezone": "",
        "panels": [
          {
            "id": 1,
            "title": "Total Nodes",
            "type": "stat",
            "targets": [
              {
                "expr": "count(kube_node_info)",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "red", "value": 0}
                  ]
                }
              }
            },
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Running Pods",
            "type": "stat",
            "targets": [
              {
                "expr": "count(kube_pod_info{phase=\"Running\"})",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 50},
                    {"color": "red", "value": 100}
                  ]
                }
              }
            },
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0}
          },
          {
            "id": 3,
            "title": "CPU Usage by Node",
            "type": "timeseries",
            "targets": [
              {
                "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
                "refId": "A",
                "legendFormat": "{{instance}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "color": {"mode": "palette-classic"}
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4}
          },
          {
            "id": 4,
            "title": "Memory Usage by Node",
            "type": "timeseries",
            "targets": [
              {
                "expr": "100 * (1 - ((node_memory_MemAvailable_bytes or node_memory_MemFree_bytes) / node_memory_MemTotal_bytes))",
                "refId": "A",
                "legendFormat": "{{instance}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "color": {"mode": "palette-classic"}
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      },
      "overwrite": true
    }
    
  postgresql-dashboard-import.json: |
    {
      "dashboard": {
        "id": null,
        "title": "PostgreSQL Database Monitoring",
        "tags": ["postgresql", "database"],
        "timezone": "",
        "panels": [
          {
            "id": 1,
            "title": "Database Status",
            "type": "stat",
            "targets": [
              {
                "expr": "pg_up",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "mappings": [
                  {"options": {"0": {"text": "DOWN", "color": "red"}}, "type": "value"},
                  {"options": {"1": {"text": "UP", "color": "green"}}, "type": "value"}
                ],
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": null},
                    {"color": "green", "value": 1}
                  ]
                }
              }
            },
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Active Connections",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(pg_stat_database_numbackends{datname=\"dev_db\"})",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 50},
                    {"color": "red", "value": 80}
                  ]
                }
              }
            },
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0}
          },
          {
            "id": 3,
            "title": "Database Connections",
            "type": "timeseries",
            "targets": [
              {
                "expr": "pg_stat_database_numbackends",
                "refId": "A",
                "legendFormat": "{{datname}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "color": {"mode": "palette-classic"}
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4}
          },
          {
            "id": 4,
            "title": "Transaction Rate",
            "type": "timeseries",
            "targets": [
              {
                "expr": "rate(pg_stat_database_xact_commit{datname=\"dev_db\"}[5m])",
                "refId": "A",
                "legendFormat": "Commits/sec"
              },
              {
                "expr": "rate(pg_stat_database_xact_rollback{datname=\"dev_db\"}[5m])",
                "refId": "B",
                "legendFormat": "Rollbacks/sec"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "color": {"mode": "palette-classic"}
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "10s"
      },
      "overwrite": true
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: import-dashboards-job
  namespace: monitoring
spec:
  template:
    spec:
      containers:
      - name: dashboard-importer
        image: curlimages/curl:latest
        command: ["/bin/sh"]
        args:
          - -c
          - |
            apk add --no-cache jq
            chmod +x /scripts/import_dashboards.sh
            /scripts/import_dashboards.sh
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
        - name: dashboard-volume
          mountPath: /dashboards
      volumes:
      - name: script-volume
        configMap:
          name: dashboard-import-script
          defaultMode: 0755
      - name: dashboard-volume
        configMap:
          name: dashboard-import-script
      restartPolicy: Never
  backoffLimit: 3