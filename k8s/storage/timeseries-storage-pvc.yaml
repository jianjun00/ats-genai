apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timeseries-storage-100tb-pvc
  namespace: ats-dev
  labels:
    app: timeseries-storage
    component: file-storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Ti  # 100TB production capacity for massive scale
  storageClassName: standard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: timeseries-storage-config
  namespace: ats-dev
data:
  storage_base_path: "/data/monthly/interval"
  compression_level: "6"
  shard_count: "100"
  max_concurrent_writes: "20"
  enable_metrics: "true"
  log_level: "INFO"