apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-pod
spec:
  restartPolicy: Never
  hostNetwork: true
  hostPID: true
  containers:
  - name: gpu-test
    image: ubuntu:20.04
    command: ["/bin/bash", "-c", "echo 'Testing GPU access...' && ls -la /dev/ | grep nvidia && nvidia-smi || echo 'nvidia-smi not found, but devices may be available'"]
    securityContext:
      privileged: true
    volumeMounts:
    - name: dev
      mountPath: /dev
    - name: nvidia-libs
      mountPath: /usr/lib/x86_64-linux-gnu/
    env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: "all"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: "all"
  volumes:
  - name: dev
    hostPath:
      path: /dev
  - name: nvidia-libs
    hostPath:
      path: /usr/lib/x86_64-linux-gnu/