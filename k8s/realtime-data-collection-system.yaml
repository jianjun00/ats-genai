apiVersion: v1
kind: ConfigMap
metadata:
  name: realtime-collector-config
  namespace: ats-dev
# Script extracted to /scripts/streaming_collector.py
# Original ConfigMap data removed for cleanup# Real-Time Streaming Service (Always Running)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-minute-collector
  namespace: ats-dev
  labels:
    app: realtime-collector
    component: streaming-service
spec:
  replicas: 2  # High availability
  selector:
    matchLabels:
      app: realtime-collector
  template:
    metadata:
      labels:
        app: realtime-collector
    spec:
      containers:
      - name: streaming-collector
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/realtime_data_collection_system_1.py"# Service for metrics and health checks
apiVersion: v1
kind: Service
metadata:
  name: realtime-collector-service
  namespace: ats-dev
spec:
  selector:
    app: realtime-collector
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
  - name: health
    port: 8081
    targetPort: 8081
    
---
# Daily Validation CronJob (Runs after market close)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-realtime-validation
  namespace: ats-dev
spec:
  schedule: "0 20 * * 1-5"  # 8:00 PM EST, Monday-Friday
  timeZone: "America/New_York"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: validation-service
            image: python:3.12-slim
            command: ["/bin/bash"]
            args:
        - "-c"
        - "/scripts/realtime_data_collection_system_2.py"# Gap Detection and Backfill CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gap-detection-backfill
  namespace: ats-dev
spec:
  schedule: "*/30 * * * 1-5"  # Every 30 minutes during weekdays
  timeZone: "America/New_York"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: gap-detector
            image: python:3.12-slim
            command: ["/bin/bash"]
            args:
        - "-c"
        - "/scripts/realtime_data_collection_system_3.py"# Weekly Comprehensive Backfill Job
apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-comprehensive-backfill
  namespace: ats-dev
spec:
  schedule: "0 2 * * 6"  # Saturday 2:00 AM
  timeZone: "America/New_York"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: comprehensive-backfill
            image: python:3.12-slim
            command: ["/bin/bash"]
            args:
        - "-c"
        - "/scripts/realtime_data_collection_system_4.py"# Data Quality Monitoring Dashboard (Optional - lightweight always-on service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-quality-monitor
  namespace: ats-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-quality-monitor
  template:
    metadata:
      labels:
        app: data-quality-monitor
    spec:
      containers:
      - name: monitor
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/realtime_data_collection_system_5.py"# Service for data quality monitor
apiVersion: v1
kind: Service
metadata:
  name: data-quality-monitor-service
  namespace: ats-dev
spec:
  selector:
    app: data-quality-monitor
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    
---
# ConfigMap for validation scripts
