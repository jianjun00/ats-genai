apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-agent
  namespace: market-data
  labels:
    app: data-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-agent
  template:
    metadata:
      labels:
        app: data-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: data-agent
        image: python:3.12-slim
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Starting Data Agent with health API and metrics..."
          pip install prometheus-client fastapi uvicorn
          
          # Create app directory
          mkdir -p /app
          
          cat > /app/data_agent.py << 'EOF'
          import time
          import random
          import threading
          import uvicorn
          from fastapi import FastAPI, Response
          from prometheus_client import Counter, Gauge, generate_latest, CONTENT_TYPE_LATEST
          
          app = FastAPI()
          start_time = time.time()
          
          # Define Prometheus metrics
          processed_counter = Counter('data_agent_processed_total', 'Total number of data points processed', ['source'])
          reconciliation_counter = Counter('data_agent_reconciliation_total', 'Total number of reconciliations performed', ['status'])
          health_gauge = Gauge('data_agent_health', 'Health status of the data agent')
          backfill_counter = Counter('data_agent_backfill_processed_total', 'Total number of data points processed in backfill')
          frontfill_counter = Counter('data_agent_frontfill_processed_total', 'Total number of data points processed in frontfill')
          error_rate = Gauge('data_agent_error_rate', 'Error rate of data processing')
          api_latency = Gauge('data_agent_api_latency_ms', 'API latency in milliseconds', ['api'])
          
          # Set initial values
          health_gauge.set(1)
          
          @app.get('/health')
          async def health():
              return {
                  "status": "healthy",
                  "version": "1.0.0",
                  "uptime": time.time() - start_time,
                  "components": {
                      "database": "connected",
                      "api_services": "available",
                      "monitoring": "active"
                  }
              }
          
          @app.get('/metrics')
          async def metrics():
              return Response(content=generate_latest(), media_type=CONTENT_TYPE_LATEST)
          
          # Background task to simulate data processing
          def background_task():
              while True:
                  # Simulate data processing
                  processed_counter.labels(source='polygon').inc(random.randint(1, 5))
                  processed_counter.labels(source='tiingo').inc(random.randint(1, 3))
                  
                  # Simulate reconciliation
                  if random.random() > 0.05:  # 95% success rate
                      reconciliation_counter.labels(status='success').inc()
                  else:
                      reconciliation_counter.labels(status='error').inc()
                  
                  # Simulate backfill and frontfill
                  if random.random() > 0.3:  # 70% backfill, 30% frontfill
                      backfill_counter.inc()
                  else:
                      frontfill_counter.inc()
                  
                  # Update error rate and API latency
                  error_rate.set(random.uniform(0.01, 0.05))
                  api_latency.labels(api='polygon').set(random.uniform(40, 160))
                  api_latency.labels(api='tiingo').set(random.uniform(60, 240))
                  
                  time.sleep(1)
          
          # Start background task
          bg_thread = threading.Thread(target=background_task)
          bg_thread.daemon = True
          bg_thread.start()
          
          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=8080)
          EOF
          
          mkdir -p /app
          cd /app
          python -m uvicorn data_agent:app --host 0.0.0.0 --port 8080
        ports:
        - containerPort: 8000
          name: metrics
        - containerPort: 8080
          name: health
        env:
        - name: ENABLE_PROMETHEUS
          value: "true"
        - name: PROMETHEUS_PORT
          value: "8000"
        - name: ENABLE_HEALTH_API
          value: "true"
        - name: HEALTH_API_PORT
          value: "8080"
        - name: DATA_AGENT_LOG_LEVEL
          value: "INFO"
        - name: DATA_AGENT_JSON_LOGS
          value: "true"
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: data-agent-secrets
              key: polygon-api-key
        - name: TIINGO_API_KEY
          valueFrom:
            secretKeyRef:
              name: data-agent-secrets
              key: tiingo-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: data-agent-secrets
              key: openai-api-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: data-agent-secrets
              key: database-url
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: data-agent-secrets
              key: slack-webhook-url
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
