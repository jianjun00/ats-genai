apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jianjun00/ats-genai.git
    targetRevision: dev
    path: k8s/data-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: market-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
