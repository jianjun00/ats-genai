# ATS Centralized Credentials Configuration
# This file defines all credential secrets for consistent access across environments

# ==============================================================================
# DEVELOPMENT ENVIRONMENT (ats-dev)
# ==============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials-dev
  namespace: ats-dev
  labels:
    app: ats-genai
    environment: dev
    component: database
type: Opaque
data:
  # postgres:dev_password@dev_db
  DB_USER: cG9zdGdyZXM=          # postgres
  DB_PASSWORD: ZGV2X3Bhc3N3b3Jk  # dev_password  
  DB_NAME: ZGV2X2Ri              # dev_db
  DB_HOST: cG9zdGdyZXM=          # postgres (service name)
  DB_PORT: NTQzMg==              # 5432

---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys-dev
  namespace: ats-dev
  labels:
    app: ats-genai
    environment: dev
    component: api-keys
type: Opaque
data:
  # External API keys for development
  POLYGON_API_KEY: ""            # Set via kubectl if needed
  TIINGO_API_KEY: ""             # Set via kubectl if needed
  FINNHUB_API_KEY: ""            # Set via kubectl if needed

---
apiVersion: v1
kind: Secret
metadata:
  name: github-credentials
  namespace: ats-dev
  labels:
    app: ats-genai
    environment: dev
    component: github-access
type: Opaque
data:
  # GitHub token for private repository access
  # Created via: kubectl create secret generic github-credentials --from-literal=token=<token> -n ats-dev
  # Used by deployments that need to clone private repositories
  # token: <base64-encoded-github-token>  # Set via kubectl command

# ==============================================================================
# INTEGRATION ENVIRONMENT (ats-intg) 
# ==============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials-intg
  namespace: ats-intg
  labels:
    app: ats-genai
    environment: intg
    component: database
type: Opaque
data:
  # postgres:intg_password@intg_db
  DB_USER: cG9zdGdyZXM=          # postgres
  DB_PASSWORD: aW50Z19wYXNzd29yZA==  # intg_password
  DB_NAME: aW50Z19kYg==          # intg_db
  DB_HOST: cG9zdGdyZXMtaW50Zw==  # postgres-intg
  DB_PORT: NTQzMg==              # 5432

---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys-intg
  namespace: ats-intg
  labels:
    app: ats-genai
    environment: intg
