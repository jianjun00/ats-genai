  FINNHUB_API_KEY: ""            # Set via kubectl if needed

# ==============================================================================
# PRODUCTION ENVIRONMENT (ats-prod)
# ==============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials-prod
  namespace: ats-prod
  labels:
    app: ats-genai
    environment: prod
    component: database
type: Opaque
data:
  # postgres:prod_secure_password@prod_db (placeholder - use secure password)
  DB_USER: cG9zdGdyZXM=          # postgres
  DB_PASSWORD: cHJvZF9zZWN1cmVfcGFzc3dvcmQ=  # prod_secure_password (CHANGE IN PRODUCTION)
  DB_NAME: cHJvZF9kYg==          # prod_db
  DB_HOST: cG9zdGdyZXMtcHJvZA==  # postgres-prod
  DB_PORT: NTQzMg==              # 5432

---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys-prod
  namespace: ats-prod
  labels:
    app: ats-genai
    environment: prod
    component: api-keys
type: Opaque
data:
  # External API keys for production (MUST be set securely)
  POLYGON_API_KEY: ""            # Set via secure key management
  TIINGO_API_KEY: ""             # Set via secure key management
  FINNHUB_API_KEY: ""            # Set via secure key management

# ==============================================================================
# CREDENTIAL REFERENCE GUIDE
# ==============================================================================
# 
# Usage in deployments:
# 
# env:
# - name: DB_USER
#   valueFrom:
#     secretKeyRef:
#       name: db-credentials-{env}  # dev/intg/prod
#       key: DB_USER
# - name: DB_PASSWORD
#   valueFrom:
#     secretKeyRef:
#       name: db-credentials-{env}
#       key: DB_PASSWORD
# - name: DB_NAME
#   valueFrom:
#     secretKeyRef:
#       name: db-credentials-{env}
#       key: DB_NAME
# - name: DB_HOST
#   valueFrom:
#     secretKeyRef:
#       name: db-credentials-{env}
#       key: DB_HOST
# - name: DB_PORT
#   valueFrom:
#     secretKeyRef:
#       name: db-credentials-{env}
#       key: DB_PORT
#
# ==============================================================================
# CREDENTIAL VALUES SUMMARY
# ==============================================================================
#
# DEV:
# - User: postgres
# - Password: dev_password
# - Database: dev_db  
# - Host: postgres
#
# INTG:
# - User: postgres
# - Password: intg_password
# - Database: intg_db
# - Host: postgres-intg
#
# PROD:
# - User: postgres
# - Password: prod_secure_password (CHANGE THIS!)
# - Database: prod_db
# - Host: postgres-prod