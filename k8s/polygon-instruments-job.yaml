apiVersion: batch/v1
kind: Job
metadata:
  name: polygon-instruments
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: polygon-worker
        image: dragonflyer762/ats-genai:latest
        workingDir: /workspace
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: PYTHONPATH
          value: "/workspace/src"
        - name: POLYGON_API_KEY
          value: "4nJ0t6maqEKrCHKJXJKc1BEjdUMCh1YO"
        command: ["sh"]
        args: ["-c", "
          echo '🔄 Cloning repository...';
          git clone https://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@github.com/AkoloTechnologies/ats-genai.git repo || { echo '❌ Git clone failed'; exit 1; };
          echo '✅ Repository cloned';
          cd repo;
          echo '🔧 Running Polygon instrument population...';
          python src/secmaster/populate_instrument_polygon.py --environment dev --gin_config config/app_dev.gin --db_host postgres --db_port 5432 --db_user postgres --db_password dev_password --db_name dev_db
        "]
      restartPolicy: Never
  backoffLimit: 2