    \           \n            records = await conn.fetch(query, *params)\n            \n
    \           jobs = []\n            for r in records:\n                duration
    = None\n                if r['start_time'] and r['end_time']:\n                    duration
    = int((r['end_time'] - r['start_time']).total_seconds())\n                \n                #
    Generate Flyte console URL based on job_type and parameters\n                flyte_url
    = None\n                if r['run_type'] and ('flyte' in r['run_type'].lower()
    or 'workflow' in r['run_type'].lower()):\n                    # Create a generic
    Flyte URL based on job ID\n                    flyte_url = f\"https://flyte.example.com/console/projects/flytesnacks/domains/development/executions/{r['id']}\"\n
    \               \n                jobs.append({\n                    \"job_id\":
    str(r['id']),\n                    \"job_type\": r['run_type'],\n                    \"status\":
    r['status'],\n                    \"user_id\": r['created_by'] or 'system',\n
    \                   \"start_time\": r['start_time'].isoformat() if r['start_time']
    else None,\n                    \"end_time\": r['end_time'].isoformat() if r['end_time']
    else None,\n                    \"duration_seconds\": duration,\n                    \"created_at\":
