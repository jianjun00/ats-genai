    {\n                    title: {\n                        display: true,\n                        text:
    'Technical Indicators',\n                        font: { size: 16, weight: 'bold'
    }\n                    },\n                    legend: {\n                        display:
    true,\n                        position: 'top'\n                    }\n                },\n
    \               scales: {\n                    x: {\n                        type:
    'time',\n                        time: {\n                            unit: 'day',\n
    \                           displayFormats: {\n                                day:
