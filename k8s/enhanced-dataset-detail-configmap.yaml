    \                           const prevClose = ohlcData[index - 1]?.c || ohlcData[index]?.o;\n
    \                           const currentClose = ohlcData[index]?.c;\n                            return
    currentClose >= prevClose ? \n                                'rgba(26, 152, 129,
    0.3)' : 'rgba(239, 57, 74, 0.3)';\n                        }),\n                        borderColor:
    'rgba(54, 162, 235, 0.8)',\n                        borderWidth: 1\n                    }\n
    \               ]\n            },\n            options: {\n                responsive:
    true,\n                maintainAspectRatio: false,\n                interaction:
    {\n                    intersect: false,\n                    mode: 'index'\n
    \               },\n                plugins: {\n                    title: {\n
    \                       display: true,\n                        text: `${this.data.symbols.join(',
    ')} - Price & Volume`,\n                        font: { size: 16, weight: 'bold'
    }\n                    },\n                    legend: {\n                        display:
    true,\n                        position: 'top'\n                    }\n                },\n
    \               scales: {\n                    x: {\n                        type:
    'time',\n                        time: {\n                            unit: 'day',\n
    \                           displayFormats: {\n                                day:
    'MMM DD'\n                            }\n                        },\n                        title:
    {\n                            display: false  // Hide x-axis title on top panel\n
