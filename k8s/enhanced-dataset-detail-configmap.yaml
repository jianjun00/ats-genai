    || this.data.ohlc_data.length === 0) {\n            return [];\n        }\n        \n
    \       return this.data.ohlc_data\n            .filter(point => point.open !==
    undefined && point.close !== undefined)\n            .map(point => ({\n                x:
    new Date(point.date),\n                o: point.open,\n                h: point.high
