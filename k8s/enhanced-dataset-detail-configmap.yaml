    \   # ===== JOB MANAGEMENT (using existing dev_runs table) =====\n    \n    async
    def list_jobs(self, limit: int = 50, offset: int = 0, status: str = None, sort_by:
    str = \"created_at\", sort_dir: str = \"desc\") -> Dict[str, Any]:\n        \"\"\"List
    jobs from existing dev_runs table with enhanced metadata.\"\"\"\n        where_clause
