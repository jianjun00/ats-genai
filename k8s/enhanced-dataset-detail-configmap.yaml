    r['error_message'],\n                    \"flyte_url\": flyte_url,\n                    \"parameters\":
    r.get('parameters')\n                })\n            \n            return {\"jobs\":
    jobs, \"total\": total}\n    \n    async def get_job_stats(self) -> Dict[str,
