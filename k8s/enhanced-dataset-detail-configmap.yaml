    => ({\n            x: new Date(point.date),\n            y: point.volume\n        }));\n
    \   }\n    \n    processIndicatorData() {\n        if (!this.data.technical_indicators)
    {\n            return [];\n        }\n        \n        const datasets = [];\n
    \       let colorIndex = 0;\n        const defaultColors = [\n            'rgb(255,
    99, 132)',\n            'rgb(54, 162, 235)', \n            'rgb(255, 205, 86)',\n
    \           'rgb(75, 192, 192)',\n            'rgb(153, 102, 255)',\n            'rgb(255,
    159, 64)'\n        ];\n        \n        for (const [indicatorName, indicatorData]
