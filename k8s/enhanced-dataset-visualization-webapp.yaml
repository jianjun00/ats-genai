        uvicorn.run(app, host="0.0.0.0", port=5000)

---
apiVersion: v1
kind: Service
metadata:
  name: enhanced-dataset-visualization-service
  namespace: ats-dev
spec:
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 32096
  selector:
    app: enhanced-dataset-visualization
    
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-dataset-visualization
  namespace: ats-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhanced-dataset-visualization
  template:
    metadata:
      labels:
        app: enhanced-dataset-visualization
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        command: ["/bin/bash"]
        args: [
          "-c",
          "pip install fastapi uvicorn asyncpg numpy pandas pydantic && python /app/webapp.py"
        ]
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: app-code
          mountPath: /app
      volumes:
      - name: app-code
        configMap:
          name: enhanced-dataset-visualization-config