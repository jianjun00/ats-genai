apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-dataset-detail-webapp
  namespace: ats-dev
  labels:
    app: enhanced-dataset-detail-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhanced-dataset-detail-webapp
  template:
    metadata:
      labels:
        app: enhanced-dataset-detail-webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        workingDir: /app
        command: ["/bin/sh"]
        args:
        - "-c"
        - "/scripts/enhanced_dataset_detail_deployment_1.py"---
apiVersion: v1
kind: Service
metadata:
  name: enhanced-dataset-detail-webapp-service
  namespace: ats-dev
spec:
  selector:
    app: enhanced-dataset-detail-webapp
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 32095
  type: NodePort