apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-dashboards-script
  namespace: ats-dev
# Script extracted to /scripts/environment.py
# Original ConfigMap data removed for cleanup---
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-monitoring-dashboards
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: monitoring-setup
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/monitoring_dashboards_1.py"---
# Scheduled monitoring report generation
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-monitoring-report
  namespace: ats-dev
spec:
  schedule: "0 8 * * 1-5"  # 8 AM EST, Monday-Friday
  timeZone: "America/New_York"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: monitoring-report
            image: python:3.12-slim
            command: ["/bin/bash"]
            args:
        - "-c"
        - "/scripts/monitoring_dashboards_2.py"