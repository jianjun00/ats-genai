apiVersion: batch/v1
kind: Job
metadata:
  name: test-webapp-volume-access
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: test-volume
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "🔍 Testing webapp volume access..."
          echo "Contents of /data:"
          ls -la /data/
          echo "Contents of /data/training:"
          ls -la /data/training/
          echo "Training data files:"
          find /data/training -type f
          echo "✅ Volume access test completed"
        volumeMounts:
        - name: training-data
          mountPath: /data
      volumes:
      - name: training-data
        persistentVolumeClaim:
          claimName: data-pvc
      restartPolicy: Never
  backoffLimit: 1