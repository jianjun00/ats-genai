# Prometheus Alerting Rules for Database and Kubernetes Health
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerting-rules
  namespace: monitoring
data:
  database_alerts.yml: |
    groups:
    - name: postgresql_alerts
      rules:
      # Database Down Alert
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL database instance {{ $labels.instance }} has been down for more than 1 minute."
          runbook_url: "https://github.com/your-org/runbooks/postgresql-down"

      # High Connection Usage
      - alert: PostgreSQLHighConnections
        expr: (pg_stat_database_numbackends{datname="dev_db"} / pg_settings_max_connections) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL connection usage is high"
          description: "Database {{ $labels.datname }} is using {{ $value }}% of available connections."

      # Low Cache Hit Ratio
      - alert: PostgreSQLLowCacheHitRatio
        expr: (pg_stat_database_blks_hit{datname="dev_db"} / (pg_stat_database_blks_hit{datname="dev_db"} + pg_stat_database_blks_read{datname="dev_db"})) < 0.95
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL cache hit ratio is low"
          description: "Database {{ $labels.datname }} cache hit ratio is {{ $value | humanizePercentage }}. Consider increasing shared_buffers."

      # High Transaction Rollback Rate
      - alert: PostgreSQLHighRollbackRate
        expr: rate(pg_stat_database_xact_rollback{datname="dev_db"}[5m]) / rate(pg_stat_database_xact_commit{datname="dev_db"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL high transaction rollback rate"
          description: "Database {{ $labels.datname }} has a rollback rate of {{ $value | humanizePercentage }}."

      # Long Running Queries
      - alert: PostgreSQLLongRunningQueries
        expr: pg_stat_activity_count{datname="dev_db",state="active"} > 10
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL has long running queries"
          description: "Database {{ $labels.datname }} has {{ $value }} long running queries."

      # Database Size Growth
      - alert: PostgreSQLDatabaseSizeGrowth
        expr: increase(pg_database_size_bytes{datname="dev_db"}[1h]) > 1e9  # 1GB growth per hour
        for: 0m
        labels:
          severity: info
          component: database
        annotations:
          summary: "PostgreSQL database size growing rapidly"
          description: "Database {{ $labels.datname }} has grown by {{ $value | humanizeBytes }} in the last hour."

  kubernetes_alerts.yml: |
    groups:
    - name: kubernetes_alerts
      rules:
      # Node Down Alert
      - alert: KubernetesNodeDown
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
          component: kubernetes
        annotations:
          summary: "Kubernetes node is down"
          description: "Node {{ $labels.node }} has been down for more than 5 minutes."

      # High Node CPU Usage
      - alert: KubernetesNodeHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Kubernetes node high CPU usage"
          description: "Node {{ $labels.instance }} CPU usage is above 80%: {{ $value }}%"

      # High Node Memory Usage
      - alert: KubernetesNodeHighMemory
        expr: 100 * (1 - ((node_memory_MemAvailable_bytes or node_memory_MemFree_bytes) / node_memory_MemTotal_bytes)) > 90
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Kubernetes node high memory usage"
          description: "Node {{ $labels.instance }} memory usage is above 90%: {{ $value }}%"

      # Pod Crash Looping
      - alert: KubernetesPodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Kubernetes pod is crash looping"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping."

      # Pod Not Ready
      - alert: KubernetesPodNotReady
        expr: kube_pod_status_ready{condition="false"} == 1
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Kubernetes pod not ready"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for more than 5 minutes."

      # Job Failed
      - alert: KubernetesJobFailed
        expr: kube_job_status_failed > 0
        for: 0m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Kubernetes job failed"
          description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} has failed."

      # Deployment Replica Mismatch
      - alert: KubernetesDeploymentReplicaMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 10m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Kubernetes deployment replica mismatch"
          description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ $labels.spec_replicas }} desired but {{ $labels.available_replicas }} available replicas."

      # High Pod CPU Usage
      - alert: KubernetesPodHighCPU
        expr: sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{image!=""}[5m])) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Kubernetes pod high CPU usage"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} CPU usage is above 80%: {{ $value }}%"

      # High Pod Memory Usage
      - alert: KubernetesPodHighMemory
        expr: sum by (namespace, pod) (container_memory_working_set_bytes{image!=""}) / sum by (namespace, pod) (container_spec_memory_limit_bytes{image!=""} > 0) * 100 > 90
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Kubernetes pod high memory usage"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} memory usage is above 90%: {{ $value }}%"

  data_pipeline_alerts.yml: |
    groups:
    - name: data_pipeline_alerts
      rules:
      # Market Data Processing Rate Drop
      - alert: MarketDataProcessingRateDropped
        expr: rate(data_agent_data_points_processed_total[5m]) < 100
        for: 10m
        labels:
          severity: warning
          component: market_data
        annotations:
          summary: "Market data processing rate has dropped"
          description: "Data processing rate has dropped to {{ $value }} points per second, below normal levels."

      # High Error Rate in Data Agent
      - alert: DataAgentHighErrorRate
        expr: rate(data_agent_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: critical
          component: market_data
        annotations:
          summary: "Data agent experiencing high error rate"
          description: "Data agent error rate is {{ $value }} errors per second."

      # Reconciliation Process Stopped
      - alert: DataReconciliationStopped
        expr: rate(data_agent_reconciliation_count_total[5m]) == 0
        for: 15m
        labels:
          severity: warning
          component: market_data
        annotations:
          summary: "Data reconciliation process has stopped"
          description: "No data reconciliation activity detected for 15 minutes."

      # Minute Data Population Job Failed
      - alert: MinuteDataPopulationJobFailed
        expr: kube_job_status_failed{job_name=~".*minute.*"} > 0
        for: 0m
        labels:
          severity: critical
          component: data_pipeline
        annotations:
          summary: "Minute data population job failed"
          description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} has failed. This may impact minute-level data availability."

      # Daily Data Population Job Failed
      - alert: DailyDataPopulationJobFailed
        expr: kube_job_status_failed{job_name=~".*daily.*"} > 0
        for: 0m
        labels:
          severity: critical
          component: data_pipeline
        annotations:
          summary: "Daily data population job failed"
          description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} has failed. This may impact daily data availability."

      # Data Volume Anomaly
      - alert: DataVolumeAnomaly
        expr: abs(rate(pg_stat_user_tables_n_tup_ins{relname=~".*minute_prices.*"}[1h]) - rate(pg_stat_user_tables_n_tup_ins{relname=~".*minute_prices.*"}[1h] offset 24h)) / rate(pg_stat_user_tables_n_tup_ins{relname=~".*minute_prices.*"}[1h] offset 24h) > 0.5
        for: 30m
        labels:
          severity: warning
          component: data_pipeline
        annotations:
          summary: "Data volume anomaly detected"
          description: "Data insertion rate for {{ $labels.relname }} has changed by more than 50% compared to 24 hours ago."
---
# Update Prometheus Configuration to Include Alerting Rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config-with-alerts
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
    - "/etc/prometheus/rules/*.yml"

    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093

    scrape_configs:
    # Existing data agent metrics
    - job_name: 'data-agent'
      static_configs:
      - targets: ['data-agent.market-data:8000']
      scrape_interval: 5s

    # PostgreSQL database metrics
    - job_name: 'postgres-exporter'
      static_configs:
      - targets: ['postgres-exporter:9187']
      scrape_interval: 15s

    # Kubernetes cluster metrics
    - job_name: 'kube-state-metrics'
      static_configs:
      - targets: ['kube-state-metrics:8080']
      scrape_interval: 30s

    # Node-level metrics
    - job_name: 'node-exporter'
      static_configs:
      - targets: ['node-exporter:9100']
      scrape_interval: 15s

    # Kubernetes API server metrics
    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
      - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

    # Kubernetes kubelet metrics
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

    # Pod metrics
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
---
# Simple Alertmanager for notifications
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.26.0
        ports:
        - containerPort: 9093
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        - --web.external-url=http://localhost:9093
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager
        - name: alertmanager-storage
          mountPath: /alertmanager
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-config
      - name: alertmanager-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  ports:
  - port: 9093
    targetPort: 9093
    name: http
  selector:
    app: alertmanager
  type: NodePort
---
# Alertmanager Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alerts@ats-platform.com'

    route:
      group_by: ['alertname', 'component']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default-receiver'
      routes:
      - match:
          severity: critical
        receiver: 'critical-alerts'
      - match:
          component: database
        receiver: 'database-alerts'
      - match:
          component: kubernetes
        receiver: 'infrastructure-alerts'
      - match:
          component: market_data
        receiver: 'data-pipeline-alerts'

    receivers:
    - name: 'default-receiver'
      webhook_configs:
      - url: 'http://webhook-service:8080/alerts'
        send_resolved: true

    - name: 'critical-alerts'
      webhook_configs:
      - url: 'http://webhook-service:8080/critical'
        send_resolved: true
      # Add email configuration for critical alerts
      # email_configs:
      # - to: 'oncall@ats-platform.com'
      #   subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
      #   body: |
      #     {{ range .Alerts }}
      #     Alert: {{ .Annotations.summary }}
      #     Description: {{ .Annotations.description }}
      #     {{ end }}

    - name: 'database-alerts'
      webhook_configs:
      - url: 'http://webhook-service:8080/database'
        send_resolved: true

    - name: 'infrastructure-alerts'
      webhook_configs:
      - url: 'http://webhook-service:8080/infrastructure'
        send_resolved: true

    - name: 'data-pipeline-alerts'
      webhook_configs:
      - url: 'http://webhook-service:8080/data-pipeline'
        send_resolved: true

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'component']
---
# Update Prometheus Deployment to Include Alerting Rules
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-with-alerts
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        ports:
        - containerPort: 9090
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus/
        - --web.console.libraries=/usr/share/prometheus/console_libraries
        - --web.console.templates=/usr/share/prometheus/consoles
        - --web.enable-lifecycle
        - --storage.tsdb.retention.time=7d
        - --storage.tsdb.retention.size=10GB
        - --alertmanager.timeout=10s
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-rules
          mountPath: /etc/prometheus/rules
        - name: prometheus-storage
          mountPath: /prometheus
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config-with-alerts
      - name: prometheus-rules
        configMap:
          name: prometheus-alerting-rules
      - name: prometheus-storage
        emptyDir: {}