apiVersion: batch/v1
kind: Job
metadata:
  name: tiingo-10year-backfill
  namespace: ats-dev
  labels:
    app: ats-genai
    component: tiingo-historical-backfill
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: tiingo-backfill
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Starting Tiingo 10-year historical backfill..."
          pip install --no-cache-dir asyncpg aiohttp pandas gin-config
          
          mkdir -p /app/src/market_data/eod
          cd /app
          
          # Create enhanced Tiingo backfill script
          cat > /app/src/market_data/eod/tiingo_10year_backfill.py << 'EOF'
          #!/usr/bin/env python3
          """
          Tiingo 10-Year Historical Backfill
          Comprehensive backfill for major stocks from 2015-2025
          """
          
          import os
          import asyncio
          import aiohttp
          import asyncpg
          import datetime as dt
          import logging
          from typing import List, Dict, Any, Optional
          from dataclasses import dataclass
          
          @dataclass
          class BackfillProgress:
              total_symbols: int = 0
              completed_symbols: int = 0
              total_records: int = 0
              failed_symbols: List[str] = None
              
              def __post_init__(self):
                  if self.failed_symbols is None:
                      self.failed_symbols = []
          
          class SimpleEnvironment:
              def get_table_name(self, base_name):
                  return f"dev_{base_name}"
              
              def get_database_url(self):
                  host = os.environ.get('DB_HOST', 'postgres-simple')
                  port = os.environ.get('DB_PORT', '5432')
                  user = os.environ.get('DB_USER', 'postgres')
                  password = os.environ.get('DB_PASSWORD', 'dev_password')
                  database = os.environ.get('DB_NAME', 'dev_db')
                  return f"postgresql://{user}:{password}@{host}:{port}/{database}"
          
          class TiingoDAO:
              def __init__(self, env):
                  self.env = env
                  self.table_name = env.get_table_name('daily_prices_tiingo')
                  self.db_url = env.get_database_url()
              
              async def batch_insert_prices(self, prices):
                  if not prices:
                      return 0
                  pool = await asyncpg.create_pool(self.db_url, min_size=2, max_size=5)
                  try:
                      async with pool.acquire() as conn:
                          await conn.executemany(f"""
                              INSERT INTO {self.table_name} 
                              (date, instrument_id, open_price, high_price, low_price, close, adj_close, volume)
                              VALUES ($1, $2, $3, $4, $5, $6, $7, $8)
                              ON CONFLICT (date, instrument_id) DO UPDATE SET
                                  open_price=EXCLUDED.open_price,
                                  high_price=EXCLUDED.high_price,
                                  low_price=EXCLUDED.low_price,
                                  close=EXCLUDED.close,
                                  adj_close=EXCLUDED.adj_close,
                                  volume=EXCLUDED.volume,
                                  updated_at=NOW()
                          """,
                          [
                              (
                                  p['date'],
                                  p['instrument_id'],
                                  p.get('open_price'),
                                  p.get('high_price'),
                                  p.get('low_price'),
                                  p.get('close'),
                                  p.get('adj_close'),
                                  p.get('volume'),
                              ) for p in prices
                          ])
                          return len(prices)
                  finally:
                      await pool.close()
          
          class SimpleXrefsDAO:
              def __init__(self, env):
                  self.env = env
                  self.db_url = env.get_database_url()
              
              async def get_major_symbols_with_ids(self):
                  """Get major symbols with their instrument IDs"""
                  pool = await asyncpg.create_pool(self.db_url, min_size=1, max_size=3)
                  try:
                      async with pool.acquire() as conn:
                          rows = await conn.fetch("""
                              SELECT DISTINCT 
                                  i.id as instrument_id,
                                  i.symbol,
                                  COALESCE(ix.vendor_symbol, i.symbol) as vendor_symbol
                              FROM dev_instruments i
                              LEFT JOIN dev_instrument_xrefs ix ON i.id = ix.instrument_id
                              LEFT JOIN dev_vendors v ON ix.vendor_id = v.id AND v.name = 'tiingo'
                              WHERE i.symbol IN (
                                  'AAPL', 'MSFT', 'GOOGL', 'AMZN', 'TSLA', 'META', 'NVDA', 'BRK.A', 'BRK.B',
                                  'JPM', 'JNJ', 'V', 'PG', 'HD', 'MA', 'UNH', 'DIS', 'BAC', 'ADBE', 'CRM',
                                  'NFLX', 'XOM', 'CVX', 'PFE', 'KO', 'PEP', 'ABBV', 'MRK', 'WMT', 'COST',
                                  'TMO', 'ACN', 'MDT', 'DHR', 'NEE', 'VZ', 'T', 'CMCSA', 'NKE', 'HON'
                              )
                              ORDER BY i.symbol
                              LIMIT 50
                          """)
                          return [(row['instrument_id'], row['symbol'], row['vendor_symbol']) for row in rows]
                  finally:
                      await pool.close()
          
          # Tiingo API configuration
          TIINGO_API_KEY = os.getenv("TIINGO_API_KEY")
          TIINGO_BASE_URL = "https://api.tiingo.com"
          
          logger = logging.getLogger(__name__)
          
          async def fetch_tiingo_historical_data(session: aiohttp.ClientSession, symbol: str, 
                                               start_date: dt.date, end_date: dt.date) -> List[Dict[str, Any]]:
              """Fetch historical data from Tiingo API"""
              if not TIINGO_API_KEY:
                  logger.error("TIINGO_API_KEY not available")
                  return []
              
              url = f"{TIINGO_BASE_URL}/tiingo/daily/{symbol}/prices"
              headers = {
                  'Content-Type': 'application/json',
                  'Authorization': f'Token {TIINGO_API_KEY}'
              }
              params = {
                  'startDate': start_date.strftime('%Y-%m-%d'),
                  'endDate': end_date.strftime('%Y-%m-%d'),
                  'format': 'json'
              }
              
              try:
                  async with session.get(url, headers=headers, params=params) as response:
                      if response.status == 429:
                          logger.warning(f"Rate limit exceeded for {symbol}")
                          await asyncio.sleep(60)
                          return []
                      
                      if response.status == 404:
                          logger.warning(f"Symbol {symbol} not found in Tiingo")
                          return []
                      
                      if response.status != 200:
                          error_text = await response.text()
                          logger.error(f"Tiingo API error for {symbol}: {response.status} - {error_text}")
                          return []
                      
                      data = await response.json()
                      
                      if not data:
                          logger.warning(f"No data returned for {symbol}")
                          return []
                      
                      prices = []
                      for price_data in data:
                          try:
                              date_obj = dt.datetime.strptime(price_data['date'][:10], "%Y-%m-%d").date()
                              
                              open_price = float(price_data.get('open', 0))
                              high_price = float(price_data.get('high', 0))
                              low_price = float(price_data.get('low', 0))
                              close_price = float(price_data.get('close', 0))
                              adj_close = float(price_data.get('adjClose', close_price))
                              volume = int(price_data.get('volume', 0))
                              
                              price_record = {
                                  'date': date_obj,
                                  'open_price': open_price,
                                  'high_price': high_price,
                                  'low_price': low_price,
                                  'close': close_price,
                                  'adj_close': adj_close,
                                  'volume': volume
                              }
                              
                              prices.append(price_record)
                              
                          except (ValueError, KeyError) as e:
                              logger.warning(f"Error parsing data for {symbol}: {e}")
                              continue
                      
                      logger.info(f"Fetched {len(prices)} records for {symbol} ({start_date} to {end_date})")
                      return prices
                      
              except aiohttp.ClientError as e:
                  logger.error(f"Connection error fetching {symbol}: {e}")
                  return []
          
          async def backfill_symbol_in_chunks(session: aiohttp.ClientSession, dao: TiingoDAO,
                                            symbol: str, vendor_symbol: str, instrument_id: int,
                                            start_date: dt.date, end_date: dt.date,
                                            progress: BackfillProgress) -> bool:
              """Backfill a symbol in yearly chunks"""
              
              logger.info(f"🔄 Starting backfill for {symbol} ({vendor_symbol}) from {start_date} to {end_date}")
              
              current_date = start_date
              symbol_total_records = 0
              
              while current_date < end_date:
                  # Process in 2-year chunks for Tiingo (they allow larger ranges)
                  chunk_end = min(current_date.replace(year=current_date.year + 2), end_date)
                  
                  logger.info(f"  📅 Processing {symbol}: {current_date} to {chunk_end}")
                  
                  prices = await fetch_tiingo_historical_data(session, vendor_symbol, current_date, chunk_end)
                  
                  if prices:
                      # Add instrument_id to all records
                      for price in prices:
                          price['instrument_id'] = instrument_id
                      
                      records_inserted = await dao.batch_insert_prices(prices)
                      symbol_total_records += records_inserted
                      progress.total_records += records_inserted
                      
                      logger.info(f"  ✅ Inserted {records_inserted} records for {symbol} ({current_date} to {chunk_end})")
                  else:
                      logger.warning(f"  ⚠️  No data for {symbol} ({current_date} to {chunk_end})")
                  
                  current_date = chunk_end
                  
                  # Rate limiting: Tiingo allows higher rates but be conservative
                  await asyncio.sleep(2)  # 2 seconds between calls
              
              logger.info(f"✅ Completed {symbol}: {symbol_total_records} total records")
              return symbol_total_records > 0
          
          async def main():
              logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
              
              if not TIINGO_API_KEY:
                  print("❌ TIINGO_API_KEY environment variable not set")
                  return
              
              print("🚀 Starting Tiingo 10-year historical backfill...")
              print(f"📅 Date range: 2015-01-01 to 2025-08-19")
              
              env = SimpleEnvironment()
              dao = TiingoDAO(env)
              xrefs_dao = SimpleXrefsDAO(env)
              
              # Get symbols to backfill
              symbols_data = await xrefs_dao.get_major_symbols_with_ids()
              
              if not symbols_data:
                  print("❌ No symbols found for backfill")
                  return
              
              progress = BackfillProgress(total_symbols=len(symbols_data))
              
              print(f"📊 Found {len(symbols_data)} symbols to backfill")
              
              start_date = dt.date(2015, 1, 1)
              end_date = dt.date(2025, 8, 19)
              
              timeout = aiohttp.ClientTimeout(total=60)
              async with aiohttp.ClientSession(timeout=timeout) as session:
                  for instrument_id, symbol, vendor_symbol in symbols_data:
                      try:
                          success = await backfill_symbol_in_chunks(
                              session, dao, symbol, vendor_symbol, instrument_id,
                              start_date, end_date, progress
                          )
                          
                          if success:
                              progress.completed_symbols += 1
                          else:
                              progress.failed_symbols.append(symbol)
                          
                          # Progress update
                          completion_pct = (progress.completed_symbols / progress.total_symbols) * 100
                          print(f"📈 Progress: {progress.completed_symbols}/{progress.total_symbols} ({completion_pct:.1f}%) - Total records: {progress.total_records}")
                          
                      except Exception as e:
                          logger.error(f"❌ Failed to backfill {symbol}: {e}")
                          progress.failed_symbols.append(symbol)
              
              # Final summary
              print(f"\n🎉 Tiingo backfill completed!")
              print(f"✅ Successfully processed: {progress.completed_symbols}/{progress.total_symbols} symbols")
              print(f"📊 Total records inserted: {progress.total_records:,}")
              
              if progress.failed_symbols:
                  print(f"❌ Failed symbols: {', '.join(progress.failed_symbols)}")
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          echo "🔄 Running Tiingo 10-year backfill..."
          cd /app && python src/market_data/eod/tiingo_10year_backfill.py
        env:
        - name: TIINGO_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: TIINGO_API_KEY
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: PYTHONPATH
          value: "/app/src"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"