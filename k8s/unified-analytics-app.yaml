apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-analytics-webapp
  namespace: ats-dev
  labels:
    app: unified-analytics-webapp
    component: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unified-analytics-webapp
  template:
    metadata:
      labels:
        app: unified-analytics-webapp
        component: webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "🚀 Installing dependencies..."
            pip install --no-cache-dir fastapi==0.104.1 uvicorn[standard]==0.24.0 asyncpg==0.29.0 pydantic==2.5.0
            pip install --no-cache-dir numpy
            
            echo "📂 Setting up application..."
            cp /config/app.py /app.py
            
            echo "🌟 Starting Unified Analytics Application..."
            python /app.py
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        volumeMounts:
        - name: webapp-config
          mountPath: /config
        - name: training-data
          mountPath: /data
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
      volumes:
      - name: webapp-config
        configMap:
          name: unified-analytics-config
      - name: training-data
        persistentVolumeClaim:
          claimName: data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: unified-analytics-service
  namespace: ats-dev
  labels:
    app: unified-analytics-webapp
spec:
  selector:
    app: unified-analytics-webapp
  ports:
  - name: http
    port: 3000
    targetPort: http
    nodePort: 30003
  type: NodePort