                    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
                    .header { background: white; border-radius: 12px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 30px; }
                    .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
                    .nav-card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: transform 0.3s; }
                    .nav-card:hover { transform: translateY(-5px); }
                    .nav-card h3 { color: #667eea; margin-bottom: 15px; }
                    .btn { background: #667eea; color: white; border: none; padding: 12px 24px; border-radius: 6px; text-decoration: none; display: inline-block; margin: 5px; transition: all 0.3s; }
                    .btn:hover { background: #5a6fd8; transform: translateY(-1px); }
                    .unified-badge { background: #28a745; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-left: 10px; }
                    .enhanced-badge { background: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-left: 10px; }
                </style>
            </head>
            <body>
                <div class="container">
                    <div class="header">
                        <h1>🚀 Unified Analytics Platform</h1>
                        <p>Complete Analytics: Jobs + Datasets + Enhanced Detail Pages + Training Data</p>
                        <p><span class="unified-badge">UNIFIED APP</span> <span class="enhanced-badge">ENHANCED FEATURES</span></p>
                    </div>
                    <div class="nav-grid">
                        <div class="nav-card">
                            <h3>📊 Job Management</h3>
                            <p>Monitor running jobs, view logs, and track progress</p>
                            <a href="/jobs" class="btn">View Jobs</a>
                        </div>
                        <div class="nav-card">
                            <h3>🗄️ Enhanced Dataset Analysis</h3>
                            <p>Advanced dataset detail pages with filterable data tables and OHLC charts</p>
                            <a href="/datasets" class="btn">Browse Datasets</a>
                        </div>
                        <div class="nav-card">
                            <h3>🧠 Training Files</h3>
                            <p>Access real training files from Kubernetes volume</p>
                            <a href="/training-data" class="btn">View Training Files</a>
                        </div>
                        <div class="nav-card">
                            <h3>📊 Data Coverage Catalog</h3>
                            <p>Real-time market data coverage monitoring and analytics across all vendors</p>
                            <a href="/coverage" class="btn">Launch Coverage Catalog</a>
                        </div>
                        <div class="nav-card">
                            <h3>🔧 System Health</h3>
                            <p>Check database connectivity and training data access</p>
                            <a href="/health" class="btn">Health Check</a>
