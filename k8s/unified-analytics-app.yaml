                        font-weight: 600;
                    }
                    .trend-up { background: #d4edda; color: #155724; }
                    .trend-down { background: #f8d7da; color: #721c24; }
                    .trend-stable { background: #e2e3e5; color: #383d41; }
                    
                    /* Tables */
                    .coverage-table { 
                        width: 100%; 
                        border-collapse: collapse; 
                        margin-top: 20px;
                        background: white;
                        border-radius: 8px;
                        overflow: hidden;
                        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                    }
                    .coverage-table th { 
                        background: linear-gradient(135deg, #667eea, #764ba2); 
                        color: white; 
                        padding: 15px; 
                        text-align: left; 
                        font-weight: 600;
                        font-size: 0.9rem;
                        text-transform: uppercase;
                        letter-spacing: 0.5px;
                    }
                    .coverage-table td { 
                        padding: 15px; 
                        border-bottom: 1px solid #e9ecef;
                        font-size: 0.95rem;
                    }
                    .coverage-table tr:hover { 
                        background: rgba(102, 126, 234, 0.05);
                    }
                    .coverage-table tr:last-child td { border-bottom: none; }
                    
                    /* Vendor badges */
                    .vendor-badge { 
                        padding: 4px 10px; 
                        border-radius: 20px; 
                        font-size: 0.8rem; 
                        font-weight: 600;
                        text-transform: uppercase;
                        letter-spacing: 0.5px;
                    }
                    .vendor-fmp { background: #e3f2fd; color: #1976d2; }
                    .vendor-polygon { background: #f3e5f5; color: #7b1fa2; }
                    .vendor-tiingo { background: #e8f5e8; color: #388e3c; }
                    
                    /* Status indicators */
                    .status-indicator { 
                        display: inline-flex; 
                        align-items: center; 
                        gap: 8px; 
                        padding: 6px 12px; 
                        border-radius: 20px; 
                        font-size: 0.85rem; 
                        font-weight: 600;
                    }
                    .status-active { background: #d4edda; color: #155724; }
                    .status-stale { background: #fff3cd; color: #856404; }
                    .status-missing { background: #f8d7da; color: #721c24; }
                    
                    /* Loading states */
                    .loading { 
                        text-align: center; 
                        padding: 40px; 
                        color: #6c757d;
                        font-size: 1.1rem;
                    }
                    .loading::after {
                        content: '';
                        display: inline-block;
                        width: 20px;
                        height: 20px;
                        border: 2px solid #e9ecef;
                        border-top: 2px solid #667eea;
                        border-radius: 50%;
                        animation: spin 1s linear infinite;
                        margin-left: 10px;
                    }
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                    
                    /* Error states */
                    .error-message { 
                        background: #f8d7da; 
                        color: #721c24; 
                        padding: 15px; 
                        border-radius: 8px; 
                        border-left: 4px solid #dc3545;
                        font-weight: 500;
                    }
                    
                    /* Action buttons */
                    .action-buttons { 
                        display: flex; 
                        gap: 10px; 
                        margin-bottom: 20px; 
                        flex-wrap: wrap;
                    }
                    .btn { 
                        padding: 10px 20px; 
                        border: none; 
                        border-radius: 8px; 
                        cursor: pointer; 
                        font-weight: 600;
                        font-size: 0.9rem;
                        transition: all 0.2s ease;
                        text-decoration: none;
                        display: inline-flex;
                        align-items: center;
                        gap: 8px;
                    }
                    .btn-primary { 
                        background: linear-gradient(135deg, #667eea, #764ba2); 
                        color: white; 
                    }
                    .btn-primary:hover { 
                        transform: translateY(-1px);
                        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
                    }
                    .btn-secondary { 
                        background: #6c757d; 
                        color: white; 
                    }
                    .btn-secondary:hover { background: #5a6268; }
                    
                    /* Responsive design */
                    @media (max-width: 768px) {
                        .main-container { padding: 15px; }
                        .coverage-title { font-size: 2rem; }
                        .metrics-grid { grid-template-columns: 1fr; }
                        .tab-navigation { flex-direction: column; }
                        .coverage-table { font-size: 0.85rem; }
                        .coverage-table th, .coverage-table td { padding: 10px; }
                    }
                    
                    /* Performance indicator */
                    .performance-indicator {
                        position: fixed;
                        bottom: 20px;
                        right: 20px;
                        background: rgba(40, 167, 69, 0.9);
                        color: white;
                        padding: 8px 16px;
                        border-radius: 20px;
                        font-size: 0.8rem;
                        font-weight: 600;
                        backdrop-filter: blur(10px);
                        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
                        z-index: 1000;
                    }
                </style>
            </head>
            <body>
                <div class="main-container">
                    <!-- Enhanced Header -->
                    <div class="coverage-header">
                        <div class="breadcrumb">
                            <a href="/">🏠 ATS Analytics</a> > 📊 Data Coverage Catalog
                        </div>
                        <h1 class="coverage-title">📊 Data Coverage Catalog</h1>
                        <div class="coverage-subtitle">
                            Real-time market data coverage monitoring and analytics
                            <span class="status-badge">OPERATIONAL</span>
                            <span class="status-badge" id="vendor-count">3 VENDORS</span>
                        </div>
                    </div>

                    <!-- Tab Navigation -->
                    <div class="tab-navigation">
                        <button class="tab-btn active" onclick="switchTab('overview')">
                            📈 Coverage Overview
                        </button>
                        <button class="tab-btn" onclick="switchTab('summary')">
                            📋 Coverage Summary  
                        </button>
                        <button class="tab-btn" onclick="switchTab('comparison')">
                            ⚖️ Vendor Comparison
                        </button>
                        <button class="tab-btn" onclick="switchTab('gaps')">
                            🔍 Gap Analysis
                        </button>
                    </div>

                    <!-- Overview Tab -->
                    <div id="overview-tab" class="tab-content active">
                        <!-- Key Metrics -->
                        <div class="coverage-card">
                            <h2>🎯 Real-Time Coverage Metrics</h2>
                            <div class="metrics-grid" id="overview-metrics">
                                <div class="metric-card">
                                    <div class="metric-value" id="total-symbols">Loading...</div>
                                    <div class="metric-label">Active Symbols</div>
                                    <div class="metric-trend trend-up" id="symbol-trend">+5% this week</div>
                                </div>
                                <div class="metric-card">
                                    <div class="metric-value" id="avg-coverage">Loading...</div>
                                    <div class="metric-label">Average Coverage</div>
                                    <div class="metric-trend trend-stable" id="coverage-trend">Stable</div>
                                </div>
                                <div class="metric-card">
                                    <div class="metric-value" id="data-quality">Loading...</div>
                                    <div class="metric-label">Data Quality Score</div>
                                    <div class="metric-trend trend-up" id="quality-trend">+2.1% today</div>
                                </div>
                                <div class="metric-card">
                                    <div class="metric-value" id="total-records">Loading...</div>
                                    <div class="metric-label">Total Records</div>
                                    <div class="metric-trend trend-up" id="records-trend">+1.2M today</div>
                                </div>
                                <div class="metric-card">
                                    <div class="metric-value" id="active-vendors">Loading...</div>
                                    <div class="metric-label">Active Vendors</div>
                                    <div class="metric-trend trend-stable">All operational</div>
                                </div>
                                <div class="metric-card">
                                    <div class="metric-value" id="query-performance">Loading...</div>
                                    <div class="metric-label">Query Performance</div>
                                    <div class="metric-trend trend-up">Sub-millisecond</div>
                                </div>
                            </div>
                        </div>

                        <!-- Vendor Status Overview -->
                        <div class="coverage-card">
                            <h2>🏢 Vendor Status Overview</h2>
                            <div class="action-buttons">
                                <button class="btn btn-primary" onclick="refreshData()">🔄 Refresh Data</button>
                                <button class="btn btn-secondary" onclick="exportCoverage()">📊 Export Report</button>
                            </div>
                            <div id="vendor-overview-content" class="loading">Loading vendor overview...</div>
                        </div>
                    </div>

                    <!-- Summary Tab -->
                    <div id="summary-tab" class="tab-content">
                        <div class="coverage-card">
                            <h2>📋 Coverage Summary Details</h2>
                            <div class="action-buttons">
                                <input type="text" id="symbol-filter" placeholder="Filter by symbol..." 
                                       style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; margin-right: 10px;">
                                <select id="vendor-filter" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px;">
                                    <option value="">All Vendors</option>
                                    <option value="FMP">FMP</option>
                                    <option value="Polygon">Polygon</option>
                                    <option value="Tiingo">Tiingo</option>
                                </select>
                            </div>
                            <div id="coverage-summary-table" class="loading">Loading coverage summary...</div>
                        </div>
                    </div>

                    <!-- Vendor Comparison Tab -->
                    <div id="comparison-tab" class="tab-content">
                        <div class="coverage-card">
                            <h2>⚖️ Vendor Performance Comparison</h2>
                            <div class="action-buttons">
                                <input type="text" id="comparison-symbol" placeholder="Enter symbol (e.g., AAPL)..." 
                                       style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; margin-right: 10px;">
                                <button class="btn btn-primary" onclick="compareVendors()">🔍 Compare</button>
                            </div>
                            <div id="vendor-comparison-content" class="loading">Enter a symbol to compare vendor coverage...</div>
                        </div>
                    </div>

                    <!-- Gap Analysis Tab -->
                    <div id="gaps-tab" class="tab-content">
                        <div class="coverage-card">
                            <h2>🔍 Coverage Gap Analysis</h2>
                            <div id="gap-analysis-content" class="loading">Loading gap analysis...</div>
                        </div>
                    </div>
                </div>

                <!-- Performance Indicator -->
                <div class="performance-indicator" id="performance-indicator">
                    ⚡ Query: <span id="query-time">--</span>ms
                </div>

                <script>
                    // Enhanced JavaScript based on PRD/DRD specifications
                    let currentTab = 'overview';
                    let lastUpdateTime = Date.now();

                    // Tab switching functionality
                    function switchTab(tabName) {
                        // Hide all tabs
                        document.querySelectorAll('.tab-content').forEach(tab => {
                            tab.classList.remove('active');
                        });
                        document.querySelectorAll('.tab-btn').forEach(btn => {
                            btn.classList.remove('active');
                        });
                        
                        // Show selected tab
                        document.getElementById(tabName + '-tab').classList.add('active');
                        document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
                        
                        currentTab = tabName;
                        loadTabData(tabName);
                    }

                    // Load data for specific tab
                    async function loadTabData(tabName) {
                        const startTime = performance.now();
                        
                        try {
                            switch(tabName) {
                                case 'overview':
                                    await loadOverviewData();
                                    break;
                                case 'summary':
                                    await loadSummaryData();
                                    break;
                                case 'comparison':
                                    await loadComparisonData();
                                    break;
                                case 'gaps':
                                    await loadGapAnalysis();
                                    break;
                            }
                        } catch (error) {
                            console.error(`Error loading ${tabName} data:`, error);
                            showError(`Failed to load ${tabName} data: ${error.message}`);
                        }
                        
                        // Update performance indicator
                        const queryTime = Math.round(performance.now() - startTime);
                        document.getElementById('query-time').textContent = queryTime;
                    }

                    // Load overview data
                    async function loadOverviewData() {
                        // Load coverage overview
                        const overviewResponse = await fetch('/api/v1/coverage/overview');
                        const overviewData = await overviewResponse.json();
                        
                        // Update metrics
                        document.getElementById('total-symbols').textContent = overviewData.total_symbols || '0';
                        document.getElementById('avg-coverage').textContent = (overviewData.avg_coverage || 0).toFixed(1) + '%';
                        document.getElementById('data-quality').textContent = (overviewData.data_quality || 0).toFixed(1) + '/100';
                        document.getElementById('total-records').textContent = (overviewData.total_records || 0).toLocaleString();
                        document.getElementById('active-vendors').textContent = overviewData.active_vendors || '0';
                        document.getElementById('query-performance').textContent = (overviewData.query_performance || 0).toFixed(2) + 'ms';
                        
                        // Load vendor overview
                        const vendorResponse = await fetch('/api/v1/coverage/vendors');
                        const vendorData = await vendorResponse.json();
                        
                        const vendorContent = vendorData.vendors.map(vendor => `
                            <div class="metric-card">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 5px;">
                                            <span class="vendor-badge vendor-${vendor.name.toLowerCase()}">${vendor.name}</span>
                                        </div>
                                        <div style="color: #6c757d; font-size: 0.9rem;">
                                            ${vendor.data_types.join(', ')} data
                                        </div>
                                    </div>
                                    <div style="text-align: right;">
                                        <div class="metric-value" style="font-size: 1.5rem;">${vendor.coverage_percentage}%</div>
                                        <div class="status-indicator status-${vendor.status}">${vendor.status.toUpperCase()}</div>
                                    </div>
                                </div>
                                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #e9ecef;">
                                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; font-size: 0.85rem;">
                                        <div>
                                            <div style="color: #6c757d;">Records</div>
                                            <div style="font-weight: 600;">${vendor.record_count.toLocaleString()}</div>
                                        </div>
                                        <div>
                                            <div style="color: #6c757d;">Quality</div>
                                            <div style="font-weight: 600;">${vendor.quality_score}/100</div>
                                        </div>
                                        <div>
                                            <div style="color: #6c757d;">Last Update</div>
                                            <div style="font-weight: 600;">${vendor.last_update}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('');
                        
                        document.getElementById('vendor-overview-content').innerHTML = vendorContent;
                    }

                    // Load summary data
                    async function loadSummaryData() {
                        const response = await fetch('/api/v1/coverage/summary');
                        const data = await response.json();
                        
                        const table = `
                            <table class="coverage-table">
                                <thead>
                                    <tr>
                                        <th>Symbol</th>
                                        <th>Vendor</th>
                                        <th>Data Type</th>
                                        <th>Coverage</th>
                                        <th>Quality</th>
                                        <th>Status</th>
                                        <th>Last Update</th>
                                        <th>Gaps (24h)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.summary.map(item => `
                                        <tr>
                                            <td style="font-weight: 600;">${item.symbol}</td>
                                            <td><span class="vendor-badge vendor-${item.vendor.toLowerCase()}">${item.vendor}</span></td>
                                            <td>${item.data_type}</td>
                                            <td>
                                                <div style="display: flex; align-items: center; gap: 8px;">
                                                    <span style="font-weight: 600;">${item.coverage_percentage}%</span>
                                                    <div style="width: 60px; height: 6px; background: #e9ecef; border-radius: 3px;">
                                                        <div style="width: ${item.coverage_percentage}%; height: 100%; background: ${item.coverage_percentage >= 95 ? '#28a745' : item.coverage_percentage >= 80 ? '#ffc107' : '#dc3545'}; border-radius: 3px;"></div>
                                                    </div>
                                                </div>
                                            </td>
                                            <td>${item.quality_score}/100</td>
                                            <td><span class="status-indicator status-${item.status}">${item.status.toUpperCase()}</span></td>
                                            <td>${item.last_update}</td>
                                            <td>${item.gaps_24h || 0}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `;
                        
                        document.getElementById('coverage-summary-table').innerHTML = table;
                    }

                    // Load vendor comparison data
                    async function loadComparisonData() {
                        document.getElementById('vendor-comparison-content').innerHTML = `
                            <div style="text-align: center; padding: 40px; color: #6c757d;">
                                <div style="font-size: 3rem; margin-bottom: 20px;">⚖️</div>
                                <h3>Vendor Performance Comparison</h3>
                                <p>Enter a symbol above to compare coverage across all vendors.</p>
                                <p style="font-size: 0.9rem; margin-top: 15px; color: #adb5bd;">
                                    Compare data availability, quality scores, and performance metrics side-by-side.
                                </p>
                            </div>
                        `;
                    }

                    // Compare vendors for specific symbol
                    async function compareVendors() {
                        const symbol = document.getElementById('comparison-symbol').value.trim().toUpperCase();
                        if (!symbol) {
                            alert('Please enter a symbol to compare');
                            return;
                        }
                        
                        document.getElementById('vendor-comparison-content').innerHTML = '<div class="loading">Loading comparison data...</div>';
                        
                        try {
                            const response = await fetch(`/api/v1/coverage/compare/${symbol}`);
                            const data = await response.json();
                            
                            if (data.vendors && data.vendors.length > 0) {
                                const comparisonContent = `
                                    <h3 style="margin-bottom: 20px;">📊 Coverage Comparison for ${symbol}</h3>
                                    <div class="metrics-grid">
                                        ${data.vendors.map(vendor => `
                                            <div class="metric-card">
                                                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
                                                    <span class="vendor-badge vendor-${vendor.vendor.toLowerCase()}">${vendor.vendor}</span>
                                                    <div class="status-indicator status-${vendor.status}">${vendor.status.toUpperCase()}</div>
                                                </div>
                                                <div class="metric-value">${vendor.coverage_percentage}%</div>
                                                <div class="metric-label">Coverage</div>
                                                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #e9ecef;">
                                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85rem;">
                                                        <div>
                                                            <div style="color: #6c757d;">Quality Score</div>
                                                            <div style="font-weight: 600;">${vendor.quality_score}/100</div>
                                                        </div>
                                                        <div>
                                                            <div style="color: #6c757d;">Records</div>
                                                            <div style="font-weight: 600;">${(vendor.record_count || 0).toLocaleString()}</div>
                                                        </div>
                                                        <div>
                                                            <div style="color: #6c757d;">Last Update</div>
                                                            <div style="font-weight: 600;">${vendor.last_update}</div>
                                                        </div>
                                                        <div>
                                                            <div style="color: #6c757d;">Gaps (24h)</div>
                                                            <div style="font-weight: 600;">${vendor.gaps_24h || 0}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                `;
                                document.getElementById('vendor-comparison-content').innerHTML = comparisonContent;
                            } else {
                                document.getElementById('vendor-comparison-content').innerHTML = `
                                    <div class="error-message">
                                        No coverage data found for symbol "${symbol}". Please try a different symbol.
                                    </div>
                                `;
                            }
                        } catch (error) {
                            document.getElementById('vendor-comparison-content').innerHTML = `
                                <div class="error-message">
                                    Error loading comparison data: ${error.message}
                                </div>
                            `;
                        }
                    }

                    // Load gap analysis
                    async function loadGapAnalysis() {
                        const response = await fetch('/api/v1/coverage/gaps');
                        const data = await response.json();
                        
                        const gapContent = `
                            <div class="metrics-grid" style="margin-bottom: 25px;">
                                <div class="metric-card">
                                    <div class="metric-value">${data.summary.total_gaps || 0}</div>
                                    <div class="metric-label">Total Gaps (24h)</div>
                                </div>
                                <div class="metric-card">
                                    <div class="metric-value">${data.summary.critical_gaps || 0}</div>
                                    <div class="metric-label">Critical Gaps</div>
                                </div>
                                <div class="metric-card">
                                    <div class="metric-value">${data.summary.avg_gap_duration || 0}</div>
                                    <div class="metric-label">Avg Gap Duration (min)</div>
                                </div>
                                <div class="metric-card">
                                    <div class="metric-value">${data.summary.resolution_rate || 0}%</div>
                                    <div class="metric-label">Resolution Rate</div>
                                </div>
                            </div>
                            
                            ${data.gaps && data.gaps.length > 0 ? `
                                <table class="coverage-table">
                                    <thead>
                                        <tr>
                                            <th>Symbol</th>
                                            <th>Vendor</th>
                                            <th>Gap Start</th>
                                            <th>Duration</th>
                                            <th>Severity</th>
                                            <th>Status</th>
                                            <th>Detection Method</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${data.gaps.map(gap => `
                                            <tr>
                                                <td style="font-weight: 600;">${gap.symbol}</td>
                                                <td><span class="vendor-badge vendor-${gap.vendor.toLowerCase()}">${gap.vendor}</span></td>
                                                <td>${gap.gap_start}</td>
                                                <td>${gap.duration_minutes} min</td>
                                                <td><span class="status-indicator status-${gap.severity}">${gap.severity.toUpperCase()}</span></td>
                                                <td>${gap.is_resolved ? '✅ Resolved' : '🔍 Open'}</td>
                                                <td>${gap.detection_method || 'auto'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            ` : `
                                <div style="text-align: center; padding: 40px; color: #6c757d;">
                                    <div style="font-size: 3rem; margin-bottom: 20px;">✅</div>
                                    <h3>No Coverage Gaps Detected</h3>
                                    <p>All vendors are providing consistent data coverage.</p>
                                </div>
                            `}
                        `;
                        
                        document.getElementById('gap-analysis-content').innerHTML = gapContent;
                    }

                    // Utility functions
                    async function refreshData() {
                        await loadTabData(currentTab);
                        lastUpdateTime = Date.now();
                        
                        // Show refresh feedback
                        const btn = event.target;
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '✅ Refreshed';
                        setTimeout(() => {
                            btn.innerHTML = originalText;
                        }, 2000);
                    }

                    function exportCoverage() {
                        // Implement export functionality
                        alert('Export functionality coming soon!');
                    }

                    function showError(message) {
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'error-message';
                        errorDiv.textContent = message;
                        document.querySelector('.tab-content.active .coverage-card').prepend(errorDiv);
                        
                        setTimeout(() => errorDiv.remove(), 5000);
                    }

                    // Initialize dashboard
                    document.addEventListener('DOMContentLoaded', function() {
                        loadTabData('overview');
                        
                        // Set up auto-refresh every 5 minutes
                        setInterval(() => {
                            if (document.visibilityState === 'visible') {
                                loadTabData(currentTab);
                                lastUpdateTime = Date.now();
                            }
                        }, 300000);
                        
                        // Add filter event listeners
                        document.getElementById('symbol-filter')?.addEventListener('input', debounce(filterSummary, 300));
                        document.getElementById('vendor-filter')?.addEventListener('change', filterSummary);
                        document.getElementById('comparison-symbol')?.addEventListener('keypress', function(e) {
                            if (e.key === 'Enter') {
                                compareVendors();
                            }
                        });
                    });

                    // Filter summary table
                    function filterSummary() {
                        const symbolFilter = document.getElementById('symbol-filter').value.toLowerCase();
                        const vendorFilter = document.getElementById('vendor-filter').value.toLowerCase();
                        
                        const rows = document.querySelectorAll('#coverage-summary-table table tbody tr');
                        rows.forEach(row => {
                            const symbol = row.children[0].textContent.toLowerCase();
                            const vendor = row.children[1].textContent.toLowerCase();
                            
                            const showRow = (
                                (symbolFilter === '' || symbol.includes(symbolFilter)) &&
                                (vendorFilter === '' || vendor.includes(vendorFilter))
                            );
                            
                            row.style.display = showRow ? '' : 'none';
                        });
                    }

                    // Debounce utility
                    function debounce(func, wait) {
                        let timeout;
                        return function executedFunction(...args) {
                            const later = () => {
                                clearTimeout(timeout);
                                func(...args);
                            };
                            clearTimeout(timeout);
                            timeout = setTimeout(later, wait);
                        };
                    }
                </script>
