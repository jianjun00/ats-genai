            """
        
        # Job Management
        @app.get("/jobs", response_class=HTMLResponse)
        async def jobs_page():
            return """
            <!DOCTYPE html>
            <html>
            <head>
                <title>Jobs - Unified Analytics</title>
                <style>
                    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f8f9fa; }
                    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
                    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
                    .breadcrumb { margin: 10px 0; font-size: 14px; opacity: 0.9; }
                    .breadcrumb a { color: white; text-decoration: none; }
                    .table-container { background: white; border-radius: 12px; padding: 20px; overflow-x: auto; }
                    table { width: 100%; border-collapse: collapse; min-width: 800px; }
                    th { background: #f8f9fa; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #dee2e6; }
                    td { padding: 12px; border-bottom: 1px solid #dee2e6; }
                    tr:hover { background: #f8f9fa; }
                    .status-completed { background: #d4edda; color: #155724; padding: 4px 8px; border-radius: 4px; }
                    .status-running { background: #d1ecf1; color: #0c5460; padding: 4px 8px; border-radius: 4px; }
                    .status-failed { background: #f8d7da; color: #721c24; padding: 4px 8px; border-radius: 4px; }
                </style>
            </head>
            <body>
                <div class="container">
                    <div class="header">
                        <div class="breadcrumb">
                            <a href="/">Home</a> > Jobs
                        </div>
                        <h1>📊 Job Management</h1>
                        <p>Monitor running jobs and view execution history</p>
                    </div>
                    <div class="table-container">
                        <h2>Recent Jobs</h2>
                        <div id="jobs-table">Loading jobs...</div>
                    </div>
                </div>
                <script>
                    fetch('/api/v1/jobs').then(r => r.json()).then(data => {
                        const table = '<table><tr><th>Job ID</th><th>Type</th><th>Status</th><th>Duration</th><th>Started</th></tr>' +
                            data.jobs.map(job => 
                                `<tr>
                                    <td>#${job.id}</td>
                                    <td>${job.run_type}</td>
                                    <td><span class="status-${job.status.toLowerCase()}">${job.status}</span></td>
                                    <td>${job.duration_seconds ? Math.floor(job.duration_seconds / 60) + 'm' : 'N/A'}</td>
                                    <td>${new Date(job.start_time).toLocaleString()}</td>
                                </tr>`
                            ).join('') + '</table>';
                        document.getElementById('jobs-table').innerHTML = table;
                    }).catch(err => {
                        document.getElementById('jobs-table').innerHTML = '<p style="color: red;">Error loading jobs: ' + err.message + '</p>';
                    });
                </script>
            </body>
            </html>
            """
        
        @app.get("/api/v1/jobs")
        async def get_jobs():
            try:
                async with db_pool.acquire() as conn:
                    jobs = await conn.fetch("""
                        SELECT id, run_type, status, start_time, end_time, 
                               EXTRACT(EPOCH FROM (COALESCE(end_time, NOW()) - start_time))::INTEGER as duration_seconds
                        FROM dev_runs 
                        ORDER BY start_time DESC 
                        LIMIT 50
                    """)
                    
                    return {
                        "jobs": [dict(job) for job in jobs],
                        "total": len(jobs)
                    }
            except Exception as e:
                raise HTTPException(status_code=500, detail=str(e))
        
        # Training Data Files
