apiVersion: v1
kind: ConfigMap
metadata:
  name: enhanced-fmp-minute-backfill-script
  namespace: ats-dev
# Script extracted to /scripts/enhanced_fmp_minute_backfill.py
# Original ConfigMap data removed for cleanup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enhanced-fmp-minute-backfill
  namespace: ats-dev
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 172800  # Keep for 48 hours due to massive volume
  template:
    metadata:
      labels:
        app: enhanced-fmp-minute-backfill
        type: massive-volume-job
    spec:
      restartPolicy: Never
      containers:
      - name: fmp-minute-backfill
        image: python:3.12-slim
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_HOST
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: FMP_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: FMP_API_KEY
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/enhanced_fmp_minute_backfill_job_1.py"