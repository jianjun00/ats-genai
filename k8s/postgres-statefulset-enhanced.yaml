apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ats-dev
data:
  postgresql.conf: |
    # PostgreSQL Enhanced Configuration for Fault Tolerance
    
    # Connection Settings
    max_connections = 200
    shared_preload_libraries = 'pg_stat_statements'
    
    # Memory Settings
    shared_buffers = 256MB
    effective_cache_size = 1GB
    work_mem = 4MB
    maintenance_work_mem = 64MB
    
    # WAL Settings for Fault Tolerance
    wal_level = replica
    archive_mode = on
    archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'
    max_wal_senders = 3
    wal_keep_size = 1GB
    
    # Checkpoint Settings
    checkpoint_timeout = 5min
    checkpoint_completion_target = 0.9
    checkpoint_flush_after = 256kB
    
    # Logging for Monitoring
    log_destination = 'stderr'
    log_checkpoints = on
    log_connections = on
    log_disconnections = on
    log_lock_waits = on
    log_min_duration_statement = 1000
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_statement = 'ddl'
    
    # Performance Settings
    random_page_cost = 1.1
    effective_io_concurrency = 200
    
    # Background Writer
    bgwriter_delay = 200ms
    bgwriter_lru_maxpages = 100
    bgwriter_lru_multiplier = 2.0
    
    # Auto Vacuum Settings
    autovacuum = on
    autovacuum_max_workers = 3
    autovacuum_naptime = 1min
    autovacuum_vacuum_threshold = 50
    autovacuum_analyze_threshold = 50
    
  pg_hba.conf: |
    # PostgreSQL Client Authentication Configuration
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all             postgres                                trust
    local   all             all                                     scram-sha-256
    host    all             all             127.0.0.1/32            scram-sha-256
    host    all             all             ::1/128                 scram-sha-256
    host    all             all             10.0.0.0/8              scram-sha-256
    host    all             all             172.16.0.0/12           scram-sha-256
    host    all             all             192.168.0.0/16          scram-sha-256

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ats-dev
  labels:
    app: postgres
spec:
  type: NodePort
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30433
  selector:
    app: postgres

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: ats-dev
  labels:
    app: postgres
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ats-dev
  labels:
    app: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
      - name: init-postgres
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          # Create necessary directories
          mkdir -p /var/lib/postgresql/data/pgdata
          mkdir -p /var/lib/postgresql/wal-archive
          mkdir -p /var/lib/postgresql/backups
          chown -R 999:999 /var/lib/postgresql/
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-wal-archive
          mountPath: /var/lib/postgresql/wal-archive
        - name: postgres-backups
          mountPath: /var/lib/postgresql/backups
        securityContext:
          runAsUser: 0
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_DB
          value: dev_db
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: dev_password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_INITDB_ARGS
          value: --auth-host=scram-sha-256
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - |
              pg_isready -U postgres -d dev_db -h localhost -p 5432 &&
              psql -U postgres -d dev_db -c "SELECT 1" > /dev/null
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/bash  
            - -c
            - |
              pg_isready -U postgres -d dev_db -h localhost -p 5432 &&
              psql -U postgres -d dev_db -c "SELECT count(*) FROM pg_stat_activity" > /dev/null
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-wal-archive
          mountPath: /var/lib/postgresql/wal-archive
        - name: postgres-backups
          mountPath: /var/lib/postgresql/backups
        - name: postgres-config
          mountPath: /etc/postgresql/postgresql.conf
          subPath: postgresql.conf
        - name: postgres-config
          mountPath: /etc/postgresql/pg_hba.conf
          subPath: pg_hba.conf
        command:
        - /bin/bash
        - -c
        - |
          # Copy config files to data directory
          cp /etc/postgresql/postgresql.conf /var/lib/postgresql/data/pgdata/
          cp /etc/postgresql/pg_hba.conf /var/lib/postgresql/data/pgdata/
          
          # Start PostgreSQL
          docker-entrypoint.sh postgres -c config_file=/var/lib/postgresql/data/pgdata/postgresql.conf
      volumes:
      - name: postgres-config
        configMap:
          name: postgres-config
      - name: postgres-storage
        hostPath:
          path: /mnt/host/data/postgres
          type: DirectoryOrCreate
      - name: postgres-wal-archive
        hostPath:
          path: /mnt/host/data/postgres-wal-archive
          type: DirectoryOrCreate
      - name: postgres-backups
        hostPath:
          path: /mnt/host/data/postgres-backups
          type: DirectoryOrCreate
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-scripts
  namespace: ats-dev
data:
  backup.sh: |
    #!/bin/bash
    # Automated backup script
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    pg_dump -U postgres -d dev_db --format=custom --compress=9 \
      --file="/var/lib/postgresql/backups/backup_$TIMESTAMP.dump"
    echo "Backup completed: backup_$TIMESTAMP.dump"
    
  health-check.sh: |
    #!/bin/bash
    # Enhanced health check
    
    # Basic connectivity
    if ! pg_isready -U postgres; then
        echo "PostgreSQL not ready"
        exit 1
    fi
    
    # Check for long transactions
    LONG_TRANSACTIONS=$(psql -U postgres -d dev_db -t -c \
      "SELECT count(*) FROM pg_stat_activity WHERE state = 'active' AND now() - xact_start > interval '10 minutes';")
    
    if [ "$LONG_TRANSACTIONS" -gt 0 ]; then
        echo "Warning: $LONG_TRANSACTIONS long-running transactions"
    fi
    
    # Check connections
    CONNECTIONS=$(psql -U postgres -d dev_db -t -c "SELECT count(*) FROM pg_stat_activity;")
    if [ "$CONNECTIONS" -gt 150 ]; then
        echo "Warning: High connection count: $CONNECTIONS"
    fi
    
    echo "Health check passed"