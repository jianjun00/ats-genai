apiVersion: v1
kind: Service
metadata:
  name: realtime-external-access
  namespace: ats-dev
  labels:
    app: realtime-streaming-collector
    access: external
spec:
  selector:
    app: realtime-streaming-collector
  ports:
  - name: http
    port: 8080
    targetPort: http
    nodePort: 30080
  - name: metrics  
    port: 9090
    targetPort: metrics
    nodePort: 30090
  type: NodePort
---
# Alternative: LoadBalancer service (if supported)
apiVersion: v1
kind: Service
metadata:
  name: realtime-loadbalancer
  namespace: ats-dev
  labels:
    app: realtime-streaming-collector
    access: loadbalancer
spec:
  selector:
    app: realtime-streaming-collector
  ports:
  - name: http
    port: 8080
    targetPort: http
  - name: metrics
    port: 9090  
    targetPort: metrics
  type: LoadBalancer