apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-api
  namespace: ats-dev
  labels:
    app: ats-api
    component: api
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats-api
  template:
    metadata:
      labels:
        app: ats-api
        component: api
        environment: dev
    spec:
      containers:
      - name: ats-api
        image: ats-genai:dev-latest
        imagePullPolicy: Never  # Use local image
        command: ["/bin/sh", "-c", "while true; do echo 'Debugging container is running...'; sleep 30; done"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PYTHONPATH
          value: "src"
        - name: ENVIRONMENT
          value: "dev"
        - name: LOG_LEVEL
          value: "DEBUG"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: ats-api
  namespace: ats-dev
  labels:
    app: ats-api
    component: api
    environment: dev
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    name: http
  selector:
    app: ats-api
