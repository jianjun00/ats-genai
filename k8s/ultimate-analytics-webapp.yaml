            .container {{ max-width: 1400px; margin: 0 auto; padding: 20px; }}
            
            .dataset-overview {{ background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }}
            .dataset-meta {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }}
            .meta-item {{ text-align: center; padding: 15px; background: #f8f9fa; border-radius: 8px; }}
            .meta-value {{ font-size: 24px; font-weight: bold; color: #667eea; }}
            .meta-label {{ font-size: 12px; color: #666; text-transform: uppercase; margin-top: 5px; }}
            
            .sequences-section {{ background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }}
            .table-container {{ overflow-x: auto; margin-top: 15px; }}
            .sequences-table {{ width: 100%; border-collapse: collapse; min-width: 800px; }}
            .sequences-table th {{ background: #f8f9fa; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #dee2e6; }}
            .sequences-table td {{ padding: 12px; border-bottom: 1px solid #dee2e6; }}
            .sequences-table tr:hover {{ background: #f8f9fa; }}
            .sequence-id {{ font-weight: 600; color: #667eea; }}
            .feature-stats {{ font-size: 12px; color: #666; }}
            .btn-chart {{ background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }}
            
            .loading {{ text-align: center; padding: 40px; font-size: 18px; color: #667eea; }}
            .success {{ text-align: center; padding: 40px; font-size: 16px; color: #28a745; }}
        </style>
    </head>
    <body>
        <div class="header">
            <div class="container">
                <div class="breadcrumb">
                    <a href="/">Home</a> > <a href="/#datasets">Datasets</a> > Dataset Detail
                </div>
                <h1 id="dataset-title">Dataset {dataset_id} Detail</h1>
                <p id="dataset-description">Enhanced dataset detail with sequence-level access</p>
            </div>
        </div>

        <div class="container">
            <!-- Dataset Overview -->
            <div class="dataset-overview">
                <h2>📊 Dataset Overview</h2>
                <div class="dataset-meta" id="dataset-meta">
                    <div class="meta-item">
                        <div class="meta-value" id="total-sequences">Loading...</div>
                        <div class="meta-label">Total Sequences</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-value" id="feature-count">Loading...</div>
                        <div class="meta-label">Features</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-value" id="symbol-count">Loading...</div>
                        <div class="meta-label">Symbols</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-value" id="date-range">Loading...</div>
                        <div class="meta-label">Date Range</div>
                    </div>
                </div>
            </div>

            <!-- Sequences Table -->
            <div class="sequences-section">
                <h2>📋 Training Sequences <span id="sequence-count">(Loading...)</span></h2>
                <div class="table-container">
                    <table class="sequences-table">
                        <thead>
                            <tr>
                                <th>Sequence ID</th>
                                <th>Date Range</th>
                                <th>Symbols</th>
                                <th>Feature Statistics</th>
                                <th>Label Preview</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="sequences-table-body">
                            <tr><td colspan="6" class="loading">Loading sequences...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="success">
                <h3>✅ Ultimate Analytics Platform - All Features Integrated</h3>
                <p><strong>Features Available:</strong></p>
                <ul style="text-align: left; display: inline-block;">
                    <li>Real OHLC charts with technical indicators</li>
                    <li>File-based time-series data access</li>
                    <li>Job management and monitoring</li>
                    <li>Dataset visualization and analysis</li>
                    <li>Training sequence viewer</li>
                    <li>Database and file storage integration</li>
                </ul>
                <p><em>This is the consolidated analytics platform combining all functionality.</em></p>
            </div>
        </div>

        <script>
            const currentDatasetId = {dataset_id};
            
            // Load sequences
            async function loadSequences() {{
                try {{
                    const response = await fetch(`/api/v1/datasets/${{currentDatasetId}}/sequences?limit=20&offset=0`);
                    const data = await response.json();
                    
                    if (data.error) {{
                        document.getElementById('sequences-table-body').innerHTML = `
                            <tr><td colspan="6" style="text-align:center; color: #dc3545;">${{data.error}}</td></tr>
                        `;
                        return;
                    }}
                    
                    // Update overview metadata
                    document.getElementById('total-sequences').textContent = data.total_sequences;
                    document.getElementById('feature-count').textContent = data.metadata.feature_count;
                    document.getElementById('symbol-count').textContent = data.available_symbols.length;
                    
                    if (data.sequences.length > 0) {{
                        const seq = data.sequences[0];
                        if (seq.start_date && seq.end_date) {{
                            const startDate = new Date(seq.start_date).toLocaleDateString();
                            const endDate = new Date(seq.end_date).toLocaleDateString();
                            document.getElementById('date-range').innerHTML = `${{startDate}}<br>to ${{endDate}}`;
                        }}
                    }}
                    
                    document.getElementById('sequence-count').textContent = `(${{data.sequences.length}} of ${{data.total_sequences}})`;
                    
                    renderSequencesTable(data.sequences);
                    
                }} catch (error) {{
                    console.error('Error loading sequences:', error);
                    document.getElementById('sequences-table-body').innerHTML = `
                        <tr><td colspan="6" style="text-align:center; color: #dc3545;">
                            Error loading sequences: ${{error.message}}
                        </td></tr>
                    `;
                }}
            }}
            
            function renderSequencesTable(sequences) {{
                const tbody = document.getElementById('sequences-table-body');
                
                if (!sequences || sequences.length === 0) {{
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#666;">No sequences found</td></tr>';
                    return;
                }}
                
                tbody.innerHTML = sequences.map(seq => `
                    <tr>
                        <td><span class="sequence-id">#${{seq.sequence_id}}</span></td>
                        <td>
                            ${{seq.start_date && seq.end_date ? `
                                <div>${{new Date(seq.start_date).toLocaleDateString()}}</div>
                                <div style="font-size:12px; color:#666;">to ${{new Date(seq.end_date).toLocaleDateString()}}</div>
                            ` : 'Date range not available'}}
                        </td>
                        <td>${{seq.symbols ? seq.symbols.join(', ') : 'N/A'}}</td>
                        <td>
                            <div class="feature-stats">
                                ${{Object.entries(seq.feature_stats || {{}}).slice(0, 2).map(([name, stats]) => 
                                    `<div>${{name}}: μ=${{stats.mean ? stats.mean.toFixed(2) : 'N/A'}}, σ=${{stats.std ? stats.std.toFixed(2) : 'N/A'}}</div>`
                                ).join('')}}
                                ${{Object.keys(seq.feature_stats || {{}}).length > 2 ? 
                                    `<div style="color:#667eea;">+${{Object.keys(seq.feature_stats || {{}}).length - 2}} more</div>` : ''}}
                            </div>
                        </td>
                        <td>
                            <div style="font-size:12px; color:#666;">
                                ${{seq.label_preview ? seq.label_preview.slice(0, 3).map(v => v.toFixed(3)).join(', ') : 'N/A'}}
                            </div>
                        </td>
                        <td>
                            <button class="btn-chart" onclick="showSequenceChart(${{seq.sequence_id}})">
                                📈 Real Chart
                            </button>
                        </td>
                    </tr>
                `).join('');
            }}
            
            function showSequenceChart(sequenceId) {{
                window.open(`/chart/${{sequenceId}}`, '_blank');
            }}
            
            // Initialize page
            document.addEventListener('DOMContentLoaded', function() {{
                loadSequences();
            }});
        </script>
    </body>
    </html>
        """


