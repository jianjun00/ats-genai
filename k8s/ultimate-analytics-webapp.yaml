---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultimate-analytics-webapp
  namespace: ats-dev
  labels:
    app: ultimate-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ultimate-analytics
  template:
    metadata:
      labels:
        app: ultimate-analytics
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - -c
        - |
          pip install fastapi uvicorn asyncpg numpy &&
          cd /app &&
          python app.py
        ports:
        - containerPort: 3000
        env:
        - name: PYTHONPATH
          value: "/app"
        volumeMounts:
        - name: app-code
          mountPath: /app
        - name: timeseries-data
          mountPath: /data
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi" 
            cpu: "2000m"
      volumes:
      - name: app-code
        configMap:
          name: ultimate-analytics-config
      - name: timeseries-data
        persistentVolumeClaim:
          claimName: timeseries-storage-100tb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ultimate-analytics-service
  namespace: ats-dev
  labels:
    app: ultimate-analytics
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30001
    name: http
  selector:
    app: ultimate-analytics