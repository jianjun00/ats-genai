                            <div class="stat-number">${stats.completed_jobs}</div>
                            <div>Completed</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.failed_jobs}</div>
                            <div>Failed</div>
                        </div>
                    `;
                    
                    // Update job list
                    const jobsList = document.getElementById('jobs-list');
                    jobsList.innerHTML = jobs.jobs.map(j => `
                        <div class="job">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <strong>Job ${j.job_id}</strong> - ${j.job_type}
                                    <div style="font-size: 0.9em; color: #666;">
                                        Created: ${j.created_at ? new Date(j.created_at).toLocaleString() : 'N/A'}
                                        ${j.user_id ? ` by ${j.user_id}` : ''}
                                    </div>
                                </div>
                                <span class="status ${j.status}">${j.status}</span>
                            </div>
                            ${j.error_message ? `<div style="color: #dc3545; font-size: 0.9em; margin-top: 10px;">${j.error_message}</div>` : ''}
                        </div>
                    `).join('');
                    
                } catch (error) {
                    document.getElementById('jobs-list').innerHTML = `<div style="color: red;">Error loading jobs: ${error.message}</div>`;
                }
            }
            
            async function loadDatasets() {
                try {
                    const datasets = await fetch('/api/v1/datasets').then(r => r.json());
                    
                    // Update stats
                    document.getElementById('dataset-stats').innerHTML = `
                        <div class="stat-card">
                            <div class="stat-number">${datasets.total}</div>
                            <div>Total Datasets</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${datasets.datasets.length}</div>
                            <div>Loaded Datasets</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">100TB</div>
                            <div>Storage Capacity</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">OHLC</div>
                            <div>Chart Type</div>
                        </div>
                    `;
                    
                    // Update dataset list
                    const datasetsList = document.getElementById('datasets-list');
                    datasetsList.innerHTML = datasets.datasets.map(d => `
                        <div class="dataset">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <strong>${d.dataset_name}</strong>
                                    <div style="font-size: 0.9em; color: #666;">
                                        ${d.symbols.join(', ')} | ${d.total_sequences} sequences | ${d.feature_count} features
                                    </div>
                                    <div style="font-size: 0.8em; color: #888;">
                                        Created: ${d.created_at ? new Date(d.created_at).toLocaleString() : 'N/A'}
                                    </div>
                                </div>
                                <div>
                                    <a href="/dataset/${d.dataset_id}" style="background: #28a745; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; margin: 2px;">🔍 Enhanced Detail</a>
                                    <a href="/chart/${d.dataset_id}" target="_blank" style="background: #007bff; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; margin: 2px;">📈 OHLC Chart</a>
                                </div>
                            </div>
                        </div>
                    `).join('');
                    
                } catch (error) {
                    document.getElementById('datasets-list').innerHTML = `<div style="color: red;">Error loading datasets: ${error.message}</div>`;
                }
            }
            
            // Load initial data
            loadJobs();
        </script>
    </body>
    </html>
        """


