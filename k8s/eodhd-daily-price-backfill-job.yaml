apiVersion: batch/v1
kind: Job
metadata:
  name: eodhd-daily-price-backfill
  namespace: ats-dev
  labels:
    app: eodhd-daily-price-backfill
    component: data-collection
    vendor: eodhd
spec:
  template:
    metadata:
      labels:
        app: eodhd-daily-price-backfill
        component: data-collection
        vendor: eodhd
    spec:
      restartPolicy: Never
      containers:
      - name: eodhd-backfill
        image: dragonflyer762/ats-genai:latest
        imagePullPolicy: Always
        command:
          - python3
          - scripts/eodhd_daily_price_backfill.py
        args:
          - --environment=dev
          - --years=30
          - --skip_existing
          - --limit=100
        env:
          - name: EODHD_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-keys
                key: eodhd-api-key
                optional: true
          - name: DB_HOST
            value: "postgres"
          - name: DB_PORT
            value: "5432"
          - name: DB_USER
            value: "postgres"
          - name: DB_PASSWORD
            value: "dev_password"
          - name: DB_NAME
            value: "dev_db"
          - name: DB_DISABLE_CONNECT_TIMEOUT
            value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - name: workspace
          hostPath:
            path: /home/jianjun/ats-genai-admin
            type: Directory
  backoffLimit: 3
  activeDeadlineSeconds: 3600  # 1 hour timeout