apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: ats-dev
data:
  pgbouncer.ini: |
    [databases]
    dev_db = host=postgres port=5432 dbname=dev_db
    
    [pgbouncer]
    listen_addr = *
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    
    # Connection pooling settings
    pool_mode = transaction
    max_client_conn = 200
    default_pool_size = 25
    min_pool_size = 5
    reserve_pool_size = 5
    
    # Timeouts
    server_connect_timeout = 10
    server_login_retry = 15
    query_timeout = 30
    query_wait_timeout = 120
    client_idle_timeout = 0
    server_idle_timeout = 600
    server_lifetime = 3600
    
    # Logging
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    
    # Admin settings
    admin_users = postgres
    stats_users = postgres
    
    # Safety settings  
    ignore_startup_parameters = extra_float_digits
    
  userlist.txt: |
    "postgres" "SCRAM-SHA-256$4096:salt$hash:serverkey"

---
apiVersion: v1
kind: Secret
metadata:
  name: pgbouncer-secret
  namespace: ats-dev
type: Opaque
data:
  # This should be properly encoded in production
  userlist.txt: InBvc3RncmVzIiAiU0NSQU0tU0hBLTI1NiQ0MDk2OnNhbHQkaGFzaDpzZXJ2ZXJrZXki

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: ats-dev
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        tier: database
    spec:
      containers:
      - name: pgbouncer
        image: pgbouncer/pgbouncer:1.21.0
        ports:
        - containerPort: 6432
          name: pgbouncer
        env:
        - name: DATABASES_HOST
          value: postgres
        - name: DATABASES_PORT
          value: "5432"
        - name: DATABASES_USER
          value: postgres
        - name: DATABASES_PASSWORD
          value: dev_password
        - name: DATABASES_DBNAME
          value: dev_db
        - name: POOL_MODE
          value: transaction
        - name: MAX_CLIENT_CONN
          value: "200"
        - name: DEFAULT_POOL_SIZE
          value: "25"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          tcpSocket:
            port: 6432
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6432
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: pgbouncer-config
          mountPath: /etc/pgbouncer/pgbouncer.ini
          subPath: pgbouncer.ini
        - name: pgbouncer-secret
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
      volumes:
      - name: pgbouncer-config
        configMap:
          name: pgbouncer-config
      - name: pgbouncer-secret
        secret:
          secretName: pgbouncer-secret

---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: ats-dev
  labels:
    app: pgbouncer
spec:
  type: NodePort
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: 6432
      nodePort: 30632
  selector:
    app: pgbouncer

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-simple
  namespace: ats-dev
  labels:
    app: pgbouncer
spec:
  type: NodePort
  ports:
    - name: postgres
      port: 5432
      targetPort: 6432
      nodePort: 30433
  selector:
    app: pgbouncer