apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-runner-script
  namespace: ats-dev
data:
  run_migrations.py: |
    #!/usr/bin/env python3
    """
    Database Migration Runner for all ATS environments
    Uses the existing migration_manager.py infrastructure
    """
    import os
    import sys
    import asyncio
    import logging
    from pathlib import Path
    
    # Add src to Python path
    sys.path.insert(0, '/app/src')
    
    from db.migration_manager import MigrationManager
    
    logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
    logger = logging.getLogger(__name__)
    
    async def run_migration_for_environment(env_name: str, db_config: dict):
        """Run migrations for a specific environment"""
        logger.info(f"🚀 Starting migration for {env_name.upper()} environment")
        
        # Construct database URL
        db_url = f"postgresql://{db_config['user']}:{db_config['password']}@{db_config['host']}:{db_config['port']}/{db_config['database']}"
        logger.info(f"Database URL: postgresql://{db_config['user']}:***@{db_config['host']}:{db_config['port']}/{db_config['database']}")
        
        try:
            # Initialize migration manager
            migration_manager = MigrationManager(db_url)
            
            # Get current version
            current_version = await migration_manager.get_current_version()
            logger.info(f"📊 {env_name.upper()} current database version: {current_version}")
            
            # Run migrations
            success = await migration_manager.migrate()
            
            if success:
                # Get new version after migration
                new_version = await migration_manager.get_current_version()
                logger.info(f"✅ {env_name.upper()} migration completed successfully!")
                logger.info(f"📊 {env_name.upper()} database version: {current_version} → {new_version}")
                return True
            else:
                logger.error(f"❌ {env_name.upper()} migration failed!")
                return False
                
        except Exception as e:
            logger.error(f"💥 {env_name.upper()} migration error: {e}")
            return False
    
    async def main():
        """Main migration function for all environments"""
        logger.info("🔄 Starting database migrations for all ATS environments")
        
        # Environment configurations
        environments = {
            'dev': {
                'host': 'postgres.ats-dev.svc.cluster.local',
                'port': 5432,
                'user': 'postgres',
                'password': 'dev_password',
                'database': 'dev_db'
            },
            'intg': {
                'host': 'postgres.ats-intg.svc.cluster.local',
                'port': 5432,
                'user': 'postgres',
                'password': 'intg_password',
                'database': 'intg_db'
            },
            'prod': {
                'host': 'postgres.ats-prod.svc.cluster.local',
                'port': 5432,
                'user': 'postgres',
                'password': 'prod_password',
                'database': 'prod_db'
            }
        }
        
        results = {}
        
        # Run migrations for each environment
        for env_name, db_config in environments.items():
            logger.info(f"\n{'='*60}")
            logger.info(f"MIGRATING {env_name.upper()} ENVIRONMENT")
            logger.info(f"{'='*60}")
            
            try:
                success = await run_migration_for_environment(env_name, db_config)
                results[env_name] = success
            except Exception as e:
                logger.error(f"Failed to migrate {env_name}: {e}")
                results[env_name] = False
        
        # Summary report
        logger.info(f"\n{'='*60}")
        logger.info("MIGRATION SUMMARY REPORT")
        logger.info(f"{'='*60}")
        
        success_count = 0
        for env_name, success in results.items():
            status = "✅ SUCCESS" if success else "❌ FAILED"
            logger.info(f"  {env_name.upper()}: {status}")
            if success:
                success_count += 1
        
        logger.info(f"\n📊 Overall Result: {success_count}/{len(environments)} environments migrated successfully")
        
        if success_count == len(environments):
            logger.info("🎉 All database migrations completed successfully!")
            return True
        else:
            logger.error(f"⚠️ {len(environments) - success_count} environment(s) failed migration")
            return False
    
    if __name__ == "__main__":
        success = asyncio.run(main())
        sys.exit(0 if success else 1)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-all-environments
  namespace: ats-dev
spec:
  backoffLimit: 2
  template:
    spec:
      containers:
      - name: migration-runner
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "🚀 Installing dependencies..."
          pip install --no-cache-dir asyncpg
          
          echo "📂 Setting up migration environment..."
          mkdir -p /app/src
          
          # Copy migration manager and migrations
          echo "📋 Copying migration infrastructure..."
          cp -r /migration-src/* /app/src/
          
          # Set PYTHONPATH and run migrations
          export PYTHONPATH=/app/src:/app
          cd /app && python /scripts/run_migrations.py
        volumeMounts:
        - name: migration-script
          mountPath: /scripts
        - name: migration-source
          mountPath: /migration-src
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: migration-script
        configMap:
          name: migration-runner-script
          defaultMode: 0755
      - name: migration-source
        configMap:
          name: migration-source-code
      restartPolicy: Never
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-source-code
  namespace: ats-dev
data:
  # This will be populated by a separate command to copy the migration files
  placeholder: "Migration source files will be added here"