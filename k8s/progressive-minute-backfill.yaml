apiVersion: v1
kind: ConfigMap
metadata:
  name: progressive-minute-backfill-script
  namespace: ats-dev
# Script extracted to /scripts/backfill_script.py
# Original ConfigMap data removed for cleanup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: progressive-minute-backfill-job
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 14400  # 4 hours
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: progressive-container
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            
            STAGE=${STAGE:-1}
            CHUNK_ID=${CHUNK_ID:-0}
            
            echo "=== PROGRESSIVE MINUTE DATA BACKFILL ==="
            echo "Stage: $STAGE"
            echo "Chunk ID: $CHUNK_ID"
            echo "Strategy: Resource-aware progressive scaling"
            
            # Install minimal dependencies
            apt-get update && apt-get install -y git curl
            
            # Install uv
            curl -LsSf https://astral.sh/uv/install.sh | sh
            source $HOME/.cargo/env
            
            # Clone repository
            git clone https://github.com/jianjungit/ats-genai.git /app
            cd /app
            
            # Install dependencies
            uv pip install --system psutil asyncpg
            
            # Set environment variables
            export PYTHONPATH=/app/src
            export ENVIRONMENT=dev
            export DB_CONNECTION_PARAMS=sslmode=disable
            export STAGE=$STAGE
            export CHUNK_ID=$CHUNK_ID
            
            # Memory optimization
            export MALLOC_ARENA_MAX=2
            
            # Run progressive backfill
            python3 /scripts/backfill_script.py
        env:
        - name: STAGE
          value: "1"  # Override this for different stages
        - name: CHUNK_ID
          value: "0"  # Override for different chunks
        - name: DB_HOST
          value: "postgres-simple.ats-dev.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"      # Moderate limit
            cpu: "500m"        # 0.5 cores max
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: progressive-minute-backfill-script
          defaultMode: 0755