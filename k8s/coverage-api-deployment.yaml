apiVersion: apps/v1
kind: Deployment
metadata:
  name: coverage-api
  namespace: ats-dev
  labels:
    app: coverage-api
    component: api
    environment: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coverage-api
  template:
    metadata:
      labels:
        app: coverage-api
        component: api
    spec:
      containers:
      - name: coverage-api
        image: python:3.10-slim
        command: ["sh", "-c"]
        args:
          - |
            set -e
            echo "🚀 Installing dependencies..."
            pip install --no-cache-dir fastapi uvicorn asyncpg pydantic requests
            
            echo "📁 Creating app directory..."
            mkdir -p /app
            cd /app
            
            echo "📋 Copying application files..."
            cat > coverage_api.py << 'EOF'
            $(cat /home/jianjun/ats-genai/src/api/coverage_api.py)
            EOF
            
            echo "🔗 Starting Coverage API server..."
            python coverage_api.py
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: ENVIRONMENT
          value: "dev"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: coverage-api-service
  namespace: ats-dev
  labels:
    app: coverage-api
spec:
  type: NodePort
  ports:
  - port: 8001
    targetPort: 8001
    nodePort: 30801
    name: http
  selector:
    app: coverage-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coverage-api-config
  namespace: ats-dev
data:
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/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"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "http://localhost:3000,http://localhost:8080"