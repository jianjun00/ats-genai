apiVersion: v1
kind: ConfigMap
metadata:
  name: universal-job-monitor-script
  namespace: ats-dev
data:
  monitor_all_jobs.py: |
    #!/usr/bin/env python3
    """Universal Kubernetes Job Monitor - monitors ALL jobs across all namespaces with Flyte integration."""
    
    import asyncio
    import aiohttp
    import json
    import os
    import time
    import logging
    import subprocess
    from datetime import datetime, timedelta
    from typing import Dict, List, Optional
    from dataclasses import dataclass
    
    # Import Flyte client for workflow execution
    try:
        import flytekit
        from flytekit.remote import FlyteRemote
        from flytekit.configuration import Config
        FLYTE_AVAILABLE = True
    except ImportError:
        FLYTE_AVAILABLE = False
    
    logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
    logger = logging.getLogger(__name__)
    
    @dataclass
    class JobStatus:
        name: str
        namespace: str
        status: str
        start_time: Optional[datetime]
        completion_time: Optional[datetime]
        duration: Optional[str]
        active_pods: int = 0
        succeeded_pods: int = 0
        failed_pods: int = 0
    
    class UniversalJobMonitor:
        def __init__(self):
            self.slack_webhook_url = os.getenv('SLACK_WEBHOOK_URL')
            self.slack_channel = os.getenv('SLACK_CHANNEL', '#ats-dev-alerts')
            self.notification_interval = int(os.getenv('NOTIFICATION_INTERVAL_HOURS', '4'))
            self.namespaces = self._get_monitored_namespaces()
            self.tracked_jobs = {}
            self.previous_jobs = {}
            
            # Flyte configuration
            self.use_flyte = os.getenv('USE_FLYTE', 'false').lower() == 'true'
            self.flyte_endpoint = os.getenv('FLYTE_ENDPOINT', 'localhost:30081')
            self.flyte_project = os.getenv('FLYTE_PROJECT', 'flytesnacks')
            self.flyte_domain = os.getenv('FLYTE_DOMAIN', 'development')
            self.notification_types = os.getenv('NOTIFICATION_TYPES', 'slack').split(',')
            self.email_recipients = os.getenv('EMAIL_RECIPIENTS', '').split(',') if os.getenv('EMAIL_RECIPIENTS') else []
            self.webhook_url = os.getenv('WEBHOOK_URL')
            
            # Initialize Flyte client if available and enabled
            self.flyte_remote = None
            if self.use_flyte and FLYTE_AVAILABLE:
                try:
                    config = Config.auto()
                    self.flyte_remote = FlyteRemote(
                        config=config,
                        default_project=self.flyte_project,
                        default_domain=self.flyte_domain
                    )
                    logger.info(f"✅ Flyte integration enabled - connected to {self.flyte_endpoint}")
                except Exception as e:
                    logger.error(f"❌ Failed to initialize Flyte client: {e}")
                    self.use_flyte = False
            elif self.use_flyte:
                logger.warning("⚠️ Flyte integration enabled but flytekit not installed")
                self.use_flyte = False
            
            if not self.slack_webhook_url and not self.use_flyte:
                logger.warning("⚠️ No notification methods configured - notifications disabled")
            else:
                if self.slack_webhook_url:
                    logger.info(f"✅ Direct Slack notifications enabled for channel: {self.slack_channel}")
                if self.use_flyte:
                    logger.info(f"✅ Flyte notifications enabled for types: {', '.join(self.notification_types)}")
            
            logger.info(f"🔍 Monitoring ALL jobs in namespaces: {', '.join(self.namespaces)}")
        
        def _get_monitored_namespaces(self) -> List[str]:
            default_namespaces = ['ats-dev', 'ats-intg', 'ats-prod', 'default']
            
            env_namespaces = os.getenv('MONITOR_NAMESPACES', '').strip()
            if env_namespaces:
                return [ns.strip() for ns in env_namespaces.split(',') if ns.strip()]
            
            monitor_all_ns = os.getenv('MONITOR_ALL_NAMESPACES', 'false').lower() == 'true'
            if monitor_all_ns:
                try:
                    result = subprocess.run(['kubectl', 'get', 'namespaces', '-o', 'name'], 
                                          capture_output=True, text=True, check=True)
                    return [ns.replace('namespace/', '') for ns in result.stdout.strip().split('\n') if ns]
                except Exception as e:
                    logger.error(f"Failed to get all namespaces: {e}")
            
            return default_namespaces
        
        async def send_slack_message(self, message: str, color: str = "good", 
                                    title: str = "Kubernetes Job Status", 
                                    fields: List[Dict] = None) -> bool:
            if not self.slack_webhook_url:
                logger.debug(f"Slack disabled - would send: {title}: {message}")
                return True
            
            if not fields:
                fields = []
            
            payload = {
                "channel": self.slack_channel,
                "username": "Universal Job Monitor",
                "icon_emoji": ":kubernetes:",
                "attachments": [{
                    "color": color,
                    "title": title,
                    "text": message,
                    "fields": fields,
                    "footer": "Kubernetes Universal Job Monitor",
                    "ts": int(time.time())
                }]
            }
            
            try:
                async with aiohttp.ClientSession() as session:
                    async with session.post(self.slack_webhook_url, json=payload, timeout=10) as response:
                        if response.status == 200:
                            logger.info(f"✅ Slack notification sent: {title}")
                            return True
                        else:
                            logger.error(f"❌ Slack notification failed: {response.status}")
                            return False
            except Exception as e:
                logger.error(f"❌ Error sending Slack notification: {e}")
                return False
        
        def execute_flyte_notification(self, job: JobStatus) -> bool:
            """Execute Flyte notification workflow for job status."""
            if not self.use_flyte or not self.flyte_remote:
                return False
            
            try:
                # Import the workflow
                from scripts.flyte.flyte_job_notification_workflow import job_notification_workflow
                
                # Convert datetime objects to ISO strings
                start_time = job.start_time.isoformat() if job.start_time else None
                completion_time = job.completion_time.isoformat() if job.completion_time else None
                
                # Execute the workflow
                execution = self.flyte_remote.execute(
                    job_notification_workflow,
                    inputs={
                        "job_name": job.name,
                        "namespace": job.namespace,
                        "status": job.status,
                        "notification_types": self.notification_types,
                        "start_time": start_time,
                        "completion_time": completion_time,
                        "duration": job.duration,
                        "active_pods": job.active_pods,
                        "succeeded_pods": job.succeeded_pods,
                        "failed_pods": job.failed_pods,
                        "slack_webhook_url": self.slack_webhook_url,
                        "slack_channel": self.slack_channel,
                        "email_recipients": self.email_recipients if self.email_recipients else None,
                        "webhook_url": self.webhook_url
                    },
                    wait=False  # Don't wait for completion - non-blocking
                )
                
                logger.info(f"✅ Flyte notification workflow launched: {execution.id}")
                return True
            except Exception as e:
                logger.error(f"❌ Failed to execute Flyte notification workflow: {e}")
                return False
        
        def get_jobs_in_namespace(self, namespace: str) -> List[JobStatus]:
            try:
                result = subprocess.run([
                    'kubectl', 'get', 'jobs', '-n', namespace, '-o', 'json'
                ], capture_output=True, text=True, check=True)
                
                jobs_data = json.loads(result.stdout)
                job_statuses = []
                
                for job in jobs_data.get('items', []):
                    metadata = job.get('metadata', {})
                    status = job.get('status', {})
                    
                    job_name = metadata.get('name', 'unknown')
                    start_time = None
                    completion_time = None
                    duration = None
                    
                    if status.get('startTime'):
                        start_time = datetime.fromisoformat(
                            status['startTime'].replace('Z', '+00:00')
                        )
                    
                    if status.get('completionTime'):
                        completion_time = datetime.fromisoformat(
                            status['completionTime'].replace('Z', '+00:00')
                        )
                        
                        if start_time:
                            duration = str(completion_time - start_time)
                    
                    # Determine job status
                    active = status.get('active', 0)
                    succeeded = status.get('succeeded', 0)
                    failed = status.get('failed', 0)
                    
                    if succeeded > 0:
                        job_status = "Complete"
                    elif failed > 0:
                        job_status = "Failed"
                    elif active > 0:
                        job_status = "Running"
                    else:
                        job_status = "Pending"
                    
                    job_statuses.append(JobStatus(
                        name=job_name,
                        namespace=namespace,
                        status=job_status,
                        start_time=start_time,
                        completion_time=completion_time,
                        duration=duration,
                        active_pods=active,
                        succeeded_pods=succeeded,
                        failed_pods=failed
                    ))
                
                return job_statuses
                
            except subprocess.CalledProcessError as e:
                if "NotFound" in e.stderr:
                    logger.debug(f"No jobs found in namespace {namespace}")
                else:
                    logger.error(f"Error getting jobs in namespace {namespace}: {e}")
                return []
            except Exception as e:
                logger.error(f"Error parsing job data for namespace {namespace}: {e}")
                return []
        
        def get_all_jobs(self) -> List[JobStatus]:
            all_jobs = []
            for namespace in self.namespaces:
                jobs = self.get_jobs_in_namespace(namespace)
                all_jobs.extend(jobs)
            return all_jobs
        
        def should_notify_about_job(self, job: JobStatus) -> bool:
            # Always notify on completion or failure
            if job.status in ['Complete', 'Failed']:
                return True
            
            # For running jobs, check if enough time has passed since last notification
            if job.status == 'Running':
                job_key = f"{job.namespace}/{job.name}"
                last_notification = self.tracked_jobs.get(job_key)
                if not last_notification:
                    return True  # First time seeing this job
                
                time_since_last = datetime.now() - last_notification
                return time_since_last >= timedelta(hours=self.notification_interval)
            
            return False
        
        async def send_job_notification(self, job: JobStatus, is_status_change: bool = True):
            # First try to use Flyte for notifications if enabled
            if self.use_flyte:
                flyte_success = self.execute_flyte_notification(job)
                if flyte_success:
                    # Update tracking even if using Flyte
                    job_key = f"{job.namespace}/{job.name}"
                    self.tracked_jobs[job_key] = datetime.now()
                    return
            
            # Fall back to direct Slack notification if Flyte is not available or failed
            # Determine message color and emoji
            if job.status == 'Complete':
                color = "good"
                emoji = "✅"
                status_text = "completed successfully"
            elif job.status == 'Failed':
                color = "danger"
                emoji = "❌"
                status_text = "failed"
            elif job.status == 'Running':
                color = "warning"
                emoji = "🔄"
                status_text = "is running"
            else:  # Pending
                color = "#808080"
                emoji = "⏳"
                status_text = "is pending"
            
            # Build title and message
            action = "status changed" if is_status_change else "started"
            title = f"{emoji} Job {action.title()}: {job.namespace}/{job.name}"
            message = f"Job `{job.name}` in namespace `{job.namespace}` {status_text}."
            
            # Build fields with job details
            fields = [
                {"title": "Namespace", "value": job.namespace, "short": True},
                {"title": "Status", "value": job.status, "short": True}
            ]
            
            if job.active_pods > 0:
                fields.append({"title": "Active Pods", "value": str(job.active_pods), "short": True})
            
            if job.succeeded_pods > 0:
                fields.append({"title": "Succeeded", "value": str(job.succeeded_pods), "short": True})
                
            if job.failed_pods > 0:
                fields.append({"title": "Failed", "value": str(job.failed_pods), "short": True})
            
            if job.start_time:
                fields.append({
                    "title": "Started",
                    "value": job.start_time.strftime("%Y-%m-%d %H:%M:%S UTC"),
                    "short": True
                })
            
            if job.completion_time:
                fields.append({
                    "title": "Completed",
                    "value": job.completion_time.strftime("%Y-%m-%d %H:%M:%S UTC"),
                    "short": True
                })
            
            if job.duration:
                fields.append({
                    "title": "Duration",
                    "value": job.duration.split('.')[0],
                    "short": True
                })
            
            # Add running time for active jobs
            if job.status == 'Running' and job.start_time:
                running_time = datetime.now() - job.start_time.replace(tzinfo=None)
                fields.append({
                    "title": "Running Time",
                    "value": str(running_time).split('.')[0],
                    "short": True
                })
            
            await self.send_slack_message(
                message=message,
                color=color,
                title=title,
                fields=fields
            )
            
            job_key = f"{job.namespace}/{job.name}"
            self.tracked_jobs[job_key] = datetime.now()
        
        async def monitor_jobs(self):
            logger.info("🚀 Starting universal Kubernetes job monitoring...")
            
            # Send startup notification
            startup_message = f"🚀 Universal Kubernetes Job Monitor started!\n\n"
            startup_message += f"Monitoring ALL jobs in namespaces: {', '.join(self.namespaces)}\n\n"
            startup_message += f"📊 Will notify on all job status changes (start, complete, fail)."
            
            if self.use_flyte:
                startup_message += f"\n\n🚀 Using Flyte for scalable notifications: {', '.join(self.notification_types)}"
            
            await self.send_slack_message(
                message=startup_message,
                color="good",
                title="🚀 Universal Job Monitor Started"
            )
            
            while True:
                try:
                    current_jobs = self.get_all_jobs()
                    current_job_map = {f"{job.namespace}/{job.name}": job for job in current_jobs}
                    
                    for job_key, job in current_job_map.items():
                        previous_job = self.previous_jobs.get(job_key)
                        
                        if not previous_job:
                            # New job detected
                            if self.should_notify_about_job(job):
                                await self.send_job_notification(job, is_status_change=False)
                        
                        elif previous_job.status != job.status:
                            # Status changed
                            await self.send_job_notification(job, is_status_change=True)
                        
                        elif job.status == 'Running' and self.should_notify_about_job(job):
                            # Running job progress update
                            await self.send_job_notification(job, is_status_change=False)
                    
                    self.previous_jobs = current_job_map
                    
                    # Log summary every 5 minutes
                    if int(time.time()) % 300 < 60:  # Every ~5 minutes
                        running = sum(1 for job in current_jobs if job.status == 'Running')
                        completed = sum(1 for job in current_jobs if job.status == 'Complete')
                        failed = sum(1 for job in current_jobs if job.status == 'Failed')
                        logger.info(f"📊 Jobs: {len(current_jobs)} total ({running} running, {completed} completed, {failed} failed)")
                    
                    await asyncio.sleep(60)  # Check every minute
                    
                except Exception as e:
                    logger.error(f"Error in monitoring loop: {e}")
                    await asyncio.sleep(30)
    
    async def main():
        try:
            monitor = UniversalJobMonitor()
            await monitor.monitor_jobs()
        except KeyboardInterrupt:
            logger.info("⏹️ Monitoring stopped by user")
        except Exception as e:
            logger.error(f"❌ Error: {e}")
            raise
    
    if __name__ == "__main__":
        asyncio.run(main())

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: universal-job-monitor
  namespace: ats-dev
  labels:
    app: universal-job-monitor
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: universal-job-monitor
  template:
    metadata:
      labels:
        app: universal-job-monitor
        component: monitoring
    spec:
      serviceAccountName: universal-job-monitor
      containers:
      - name: monitor
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
          - -c
          - |
            echo "📦 Installing dependencies..."
            pip install --no-cache-dir aiohttp flytekit
            
            echo "🔧 Installing kubectl..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            mv kubectl /usr/local/bin/
            
            echo "🚀 Starting Universal Kubernetes Job Monitor..."
            echo "🔍 Monitoring ALL jobs across ALL configured namespaces"
            python /scripts/monitor_all_jobs.py
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: slack-credentials
              key: webhook_url
              optional: true
        - name: SLACK_CHANNEL
          value: "#ats-dev-alerts"
        - name: NOTIFICATION_INTERVAL_HOURS
          value: "4"
        - name: MONITOR_ALL_NAMESPACES
          value: "false"
        - name: MONITOR_NAMESPACES
          value: "ats-dev,ats-intg,ats-prod,default"
        - name: USE_FLYTE
          value: "true"
        - name: FLYTE_ENDPOINT
          value: "flyte.ats-dev.svc.cluster.local:30081"
        - name: FLYTE_PROJECT
          value: "ats-monitoring"
        - name: FLYTE_DOMAIN
          value: "development"
        - name: NOTIFICATION_TYPES
          value: "slack,email,webhook"
        - name: EMAIL_RECIPIENTS
          value: ""
        - name: WEBHOOK_URL
          value: ""
        - name: PYTHONPATH
          value: "/home/jianjun/ats-genai"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
        - name: flyte-scripts
          mountPath: /home/jianjun/ats-genai/scripts/flyte
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
      volumes:
      - name: script-volume
        configMap:
          name: universal-job-monitor-script
      - name: flyte-scripts
        configMap:
          name: flyte-notification-scripts
      restartPolicy: Always

---
# Service Account for accessing Kubernetes API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: universal-job-monitor
  namespace: ats-dev

---
# ClusterRole for reading jobs across all namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: universal-job-monitor
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "list"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: universal-job-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: universal-job-monitor
subjects:
- kind: ServiceAccount
  name: universal-job-monitor
  namespace: ats-dev

---
# ConfigMap for Flyte notification scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: flyte-notification-scripts
  namespace: ats-dev
data:
  flyte_job_notification_workflow.py: |
    #!/usr/bin/env python
    """
    Flyte Workflow for Kubernetes Job Notifications
    
    This script defines a Flyte workflow for sending notifications about Kubernetes job status changes.
    It provides a scalable way to handle notifications for job events across multiple namespaces.
    """
    
    import os
    import json
    import logging
    from typing import Dict, List, Optional, Any, Tuple
    from datetime import datetime
    
    import flytekit
    from flytekit import task, workflow, dynamic
    
    # Configure logging
    logging.basicConfig(
        level=logging.INFO,
        format='%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    )
    logger = logging.getLogger('job_notification')
    
    @task
    def send_slack_notification(
        job_name: str,
        namespace: str,
        status: str,
        start_time: Optional[str] = None,
        completion_time: Optional[str] = None,
        duration: Optional[str] = None,
        active_pods: int = 0,
        succeeded_pods: int = 0,
        failed_pods: int = 0,
        webhook_url: Optional[str] = None,
        channel: str = "#ats-dev-alerts"
    ) -> Dict[str, Any]:
        """
        Send a Slack notification about a job status change.
        
        Args:
            job_name: Name of the job
            namespace: Kubernetes namespace
            status: Job status (Running, Complete, Failed, Pending)
            start_time: Job start time (ISO format)
            completion_time: Job completion time (ISO format)
            duration: Job duration
            active_pods: Number of active pods
            succeeded_pods: Number of succeeded pods
            failed_pods: Number of failed pods
            webhook_url: Slack webhook URL (if not provided, will use env var)
            channel: Slack channel to send notification to
            
        Returns:
            Dictionary with notification result
        """
        import aiohttp
        import asyncio
        import time
        
        async def send_to_slack(payload):
            slack_url = webhook_url or os.environ.get('SLACK_WEBHOOK_URL')
            if not slack_url:
                logger.warning("No Slack webhook URL provided - notification not sent")
                return {"success": False, "error": "No webhook URL provided"}
            
            try:
                async with aiohttp.ClientSession() as session:
                    async with session.post(slack_url, json=payload, timeout=10) as response:
                        if response.status == 200:
                            logger.info(f"✅ Slack notification sent for job {job_name}")
                            return {"success": True}
                        else:
                            error_msg = f"Failed to send Slack notification: {response.status}"
                            logger.error(error_msg)
                            return {"success": False, "error": error_msg}
            except Exception as e:
                error_msg = f"Error sending Slack notification: {str(e)}"
                logger.error(error_msg)
                return {"success": False, "error": error_msg}
        
        # Determine message color and emoji based on status
        if status == 'Complete':
            color = "good"
            emoji = "✅"
            status_text = "completed successfully"
        elif status == 'Failed':
            color = "danger"
            emoji = "❌"
            status_text = "failed"
        elif status == 'Running':
            color = "warning"
            emoji = "🔄"
            status_text = "is running"
        else:  # Pending
            color = "#808080"
            emoji = "⏳"
            status_text = "is pending"
        
        # Build title and message
        title = f"{emoji} Job Status: {namespace}/{job_name}"
        message = f"Job `{job_name}` in namespace `{namespace}` {status_text}."
        
        # Build fields with job details
        fields = [
            {"title": "Namespace", "value": namespace, "short": True},
            {"title": "Status", "value": status, "short": True}
        ]
        
        if active_pods > 0:
            fields.append({"title": "Active Pods", "value": str(active_pods), "short": True})
        
        if succeeded_pods > 0:
            fields.append({"title": "Succeeded", "value": str(succeeded_pods), "short": True})
            
        if failed_pods > 0:
            fields.append({"title": "Failed", "value": str(failed_pods), "short": True})
        
        if start_time:
            start_dt = datetime.fromisoformat(start_time.replace('Z', '+00:00'))
            fields.append({
                "title": "Started",
                "value": start_dt.strftime("%Y-%m-%d %H:%M:%S UTC"),
                "short": True
            })
        
        if completion_time:
            completion_dt = datetime.fromisoformat(completion_time.replace('Z', '+00:00'))
            fields.append({
                "title": "Completed",
                "value": completion_dt.strftime("%Y-%m-%d %H:%M:%S UTC"),
                "short": True
            })
        
        if duration:
            fields.append({
                "title": "Duration",
                "value": duration.split('.')[0],
                "short": True
            })
        
        # Create payload
        payload = {
            "channel": channel,
            "username": "Universal Job Monitor",
            "icon_emoji": ":kubernetes:",
            "attachments": [{
                "color": color,
                "title": title,
                "text": message,
                "fields": fields,
                "footer": "Kubernetes Universal Job Monitor via Flyte",
                "ts": int(time.time())
            }]
        }
        
        # Send notification
        result = asyncio.run(send_to_slack(payload))
        
        # Add metadata to result
        result.update({
            "job_name": job_name,
            "namespace": namespace,
            "status": status,
            "timestamp": datetime.now().isoformat()
        })
        
        return result
    
    
    @task
    def send_email_notification(
        job_name: str,
        namespace: str,
        status: str,
        recipients: List[str],
        start_time: Optional[str] = None,
        completion_time: Optional[str] = None,
        duration: Optional[str] = None,
        active_pods: int = 0,
        succeeded_pods: int = 0,
        failed_pods: int = 0,
        smtp_server: str = "smtp.gmail.com",
        smtp_port: int = 587,
        smtp_username: Optional[str] = None,
        smtp_password: Optional[str] = None
    ) -> Dict[str, Any]:
        """
        Send an email notification about a job status change.
        
        Args:
            job_name: Name of the job
            namespace: Kubernetes namespace
            status: Job status (Running, Complete, Failed, Pending)
            recipients: List of email recipients
            start_time: Job start time (ISO format)
            completion_time: Job completion time (ISO format)
            duration: Job duration
            active_pods: Number of active pods
            succeeded_pods: Number of succeeded pods
            failed_pods: Number of failed pods
            smtp_server: SMTP server
            smtp_port: SMTP port
            smtp_username: SMTP username (if not provided, will use env var)
            smtp_password: SMTP password (if not provided, will use env var)
            
        Returns:
            Dictionary with notification result
        """
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        
        # Get SMTP credentials from environment if not provided
        username = smtp_username or os.environ.get('SMTP_USERNAME')
        password = smtp_password or os.environ.get('SMTP_PASSWORD')
        
        if not username or not password:
            logger.warning("No SMTP credentials provided - email notification not sent")
            return {
                "success": False, 
                "error": "No SMTP credentials provided",
                "job_name": job_name,
                "namespace": namespace,
                "status": status
            }
        
        # Determine status text and subject prefix
        if status == 'Complete':
            status_text = "completed successfully"
            subject_prefix = "✅"
        elif status == 'Failed':
            status_text = "failed"
            subject_prefix = "❌"
        elif status == 'Running':
            status_text = "is running"
            subject_prefix = "🔄"
        else:  # Pending
            status_text = "is pending"
            subject_prefix = "⏳"
        
        # Create email subject and body
        subject = f"{subject_prefix} Kubernetes Job {namespace}/{job_name} {status_text}"
        
        # Build email body
        body = f"""
        <html>
        <body>
        <h2>Kubernetes Job Status Update</h2>
        <p>Job <strong>{job_name}</strong> in namespace <strong>{namespace}</strong> {status_text}.</p>
        
        <h3>Job Details:</h3>
        <ul>
            <li><strong>Status:</strong> {status}</li>
        """
        
        if start_time:
            start_dt = datetime.fromisoformat(start_time.replace('Z', '+00:00'))
            body += f"<li><strong>Started:</strong> {start_dt.strftime('%Y-%m-%d %H:%M:%S UTC')}</li>"
        
        if completion_time:
            completion_dt = datetime.fromisoformat(completion_time.replace('Z', '+00:00'))
            body += f"<li><strong>Completed:</strong> {completion_dt.strftime('%Y-%m-%d %H:%M:%S UTC')}</li>"
        
        if duration:
            body += f"<li><strong>Duration:</strong> {duration.split('.')[0]}</li>"
        
        if active_pods > 0:
            body += f"<li><strong>Active Pods:</strong> {active_pods}</li>"
        
        if succeeded_pods > 0:
            body += f"<li><strong>Succeeded Pods:</strong> {succeeded_pods}</li>"
        
        if failed_pods > 0:
            body += f"<li><strong>Failed Pods:</strong> {failed_pods}</li>"
        
        body += """
        </ul>
        <p>This notification was sent by the Universal Job Monitor via Flyte.</p>
        </body>
        </html>
        """
        
        # Create message
        msg = MIMEMultipart()
        msg['From'] = username
        msg['To'] = ', '.join(recipients)
        msg['Subject'] = subject
        
        # Attach HTML body
        msg.attach(MIMEText(body, 'html'))
        
        try:
            # Connect to SMTP server
            server = smtplib.SMTP(smtp_server, smtp_port)
            server.starttls()
            server.login(username, password)
            
            # Send email
            server.send_message(msg)
            server.quit()
            
            logger.info(f"✅ Email notification sent for job {job_name} to {len(recipients)} recipients")
            return {
                "success": True,
                "job_name": job_name,
                "namespace": namespace,
                "status": status,
                "recipients": recipients,
                "timestamp": datetime.now().isoformat()
            }
        except Exception as e:
            error_msg = f"Error sending email notification: {str(e)}"
            logger.error(error_msg)
            return {
                "success": False,
                "error": error_msg,
                "job_name": job_name,
                "namespace": namespace,
                "status": status
            }
    
    
    @task
    def send_webhook_notification(
        job_name: str,
        namespace: str,
        status: str,
        webhook_url: str,
        start_time: Optional[str] = None,
        completion_time: Optional[str] = None,
        duration: Optional[str] = None,
        active_pods: int = 0,
        succeeded_pods: int = 0,
        failed_pods: int = 0,
        custom_headers: Optional[Dict[str, str]] = None
    ) -> Dict[str, Any]:
        """
        Send a webhook notification about a job status change.
        
        Args:
            job_name: Name of the job
            namespace: Kubernetes namespace
            status: Job status (Running, Complete, Failed, Pending)
            webhook_url: Webhook URL
            start_time: Job start time (ISO format)
            completion_time: Job completion time (ISO format)
            duration: Job duration
            active_pods: Number of active pods
            succeeded_pods: Number of succeeded pods
            failed_pods: Number of failed pods
            custom_headers: Custom headers to include in the request
            
        Returns:
            Dictionary with notification result
        """
        import aiohttp
        import asyncio
        
        async def send_to_webhook(url, payload, headers):
            try:
                async with aiohttp.ClientSession() as session:
                    async with session.post(url, json=payload, headers=headers, timeout=10) as response:
                        if response.status in (200, 201, 202):
                            logger.info(f"✅ Webhook notification sent for job {job_name}")
                            return {"success": True, "status_code": response.status}
                        else:
                            error_msg = f"Failed to send webhook notification: {response.status}"
                            logger.error(error_msg)
                            return {"success": False, "error": error_msg, "status_code": response.status}
            except Exception as e:
                error_msg = f"Error sending webhook notification: {str(e)}"
                logger.error(error_msg)
                return {"success": False, "error": error_msg}
        
        # Create payload
        payload = {
            "job_name": job_name,
            "namespace": namespace,
            "status": status,
            "timestamp": datetime.now().isoformat()
        }
        
        if start_time:
            payload["start_time"] = start_time
        
        if completion_time:
            payload["completion_time"] = completion_time
        
        if duration:
            payload["duration"] = duration
        
        if active_pods > 0:
            payload["active_pods"] = active_pods
        
        if succeeded_pods > 0:
            payload["succeeded_pods"] = succeeded_pods
        
        if failed_pods > 0:
            payload["failed_pods"] = failed_pods
        
        # Set headers
        headers = {
            "Content-Type": "application/json"
        }
        
        if custom_headers:
            headers.update(custom_headers)
        
        # Send notification
        result = asyncio.run(send_to_webhook(webhook_url, payload, headers))
        
        # Add metadata to result
        result.update({
            "job_name": job_name,
            "namespace": namespace,
            "status": status,
            "timestamp": datetime.now().isoformat()
        })
        
        return result
    
    
    @workflow
    def job_notification_workflow(
        job_name: str,
        namespace: str,
        status: str,
        notification_types: List[str] = ["slack"],
        start_time: Optional[str] = None,
        completion_time: Optional[str] = None,
        duration: Optional[str] = None,
        active_pods: int = 0,
        succeeded_pods: int = 0,
        failed_pods: int = 0,
        slack_webhook_url: Optional[str] = None,
        slack_channel: str = "#ats-dev-alerts",
        email_recipients: Optional[List[str]] = None,
        webhook_url: Optional[str] = None,
        webhook_headers: Optional[Dict[str, str]] = None
    ) -> Dict[str, Any]:
        """
        Workflow for sending notifications about job status changes.
        
        Args:
            job_name: Name of the job
            namespace: Kubernetes namespace
            status: Job status (Running, Complete, Failed, Pending)
            notification_types: List of notification types to send (slack, email, webhook)
            start_time: Job start time (ISO format)
            completion_time: Job completion time (ISO format)
            duration: Job duration
            active_pods: Number of active pods
            succeeded_pods: Number of succeeded pods
            failed_pods: Number of failed pods
            slack_webhook_url: Slack webhook URL
            slack_channel: Slack channel to send notification to
            email_recipients: List of email recipients
            webhook_url: Webhook URL
            webhook_headers: Custom headers for webhook
            
        Returns:
            Dictionary with notification results
        """
        results = {}
        
        # Send Slack notification if requested
        if "slack" in notification_types:
            slack_result = send_slack_notification(
                job_name=job_name,
                namespace=namespace,
                status=status,
                start_time=start_time,
                completion_time=completion_time,
                duration=duration,
                active_pods=active_pods,
                succeeded_pods=succeeded_pods,
                failed_pods=failed_pods,
                webhook_url=slack_webhook_url,
                channel=slack_channel
            )
            results["slack"] = slack_result
        
        # Send email notification if requested
        if "email" in notification_types and email_recipients:
            email_result = send_email_notification(
                job_name=job_name,
                namespace=namespace,
                status=status,
                recipients=email_recipients,
                start_time=start_time,
                completion_time=completion_time,
                duration=duration,
                active_pods=active_pods,
                succeeded_pods=succeeded_pods,
                failed_pods=failed_pods
            )
            results["email"] = email_result
        
        # Send webhook notification if requested
        if "webhook" in notification_types and webhook_url:
            webhook_result = send_webhook_notification(
                job_name=job_name,
                namespace=namespace,
                status=status,
                webhook_url=webhook_url,
                start_time=start_time,
                completion_time=completion_time,
                duration=duration,
                active_pods=active_pods,
                succeeded_pods=succeeded_pods,
                failed_pods=failed_pods,
                custom_headers=webhook_headers
            )
            results["webhook"] = webhook_result
        
        return results
