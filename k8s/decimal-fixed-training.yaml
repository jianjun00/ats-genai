apiVersion: batch/v1
kind: Job
metadata:
  name: decimal-fixed-training
  namespace: ats-dev
  labels:
    app: ml-training
    job-type: decimal-fixed-model
    version: decimal-conversion-fixed
spec:
  activeDeadlineSeconds: 14400  # 4 hours
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: ml-training
        job-type: decimal-fixed-model
    spec:
      restartPolicy: Never
      containers:
      - name: decimal-fixed-trainer
        image: python:3.12-slim
        resources:
          requests:
            memory: "8Gi"
            cpu: "4"
          limits:
            memory: "12Gi"
            cpu: "6"
        env:
        - name: PYTHONPATH
          value: "src"
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        workingDir: /app
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/decimal_fixed_training_1.py"---
apiVersion: v1
kind: ConfigMap
metadata:
  name: decimal-fixed-training-script
  namespace: ats-dev
# Script extracted to /scripts/train_decimal_fixed.py
