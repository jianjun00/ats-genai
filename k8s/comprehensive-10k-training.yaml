apiVersion: batch/v1
kind: Job
metadata:
  name: comprehensive-10k-training
  namespace: ats-dev
  labels:
    app: ml-training
    job-type: comprehensive-all-instruments
    scale: full-10k-processing
spec:
  activeDeadlineSeconds: 18000  # 5 hours for comprehensive processing
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: ml-training
        job-type: comprehensive-all-instruments
    spec:
      restartPolicy: Never
      containers:
      - name: comprehensive-trainer
        image: python:3.12-slim
        resources:
          requests:
            memory: "16Gi"
            cpu: "8"
          limits:
            memory: "24Gi"
            cpu: "12"
        env:
        - name: PYTHONPATH
          value: "src"
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        workingDir: /app
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/comprehensive_10k_training_1.py"---
apiVersion: v1
kind: ConfigMap
metadata:
  name: comprehensive-10k-training-script
  namespace: ats-dev
# Script extracted to /scripts/train_comprehensive_10k.py
