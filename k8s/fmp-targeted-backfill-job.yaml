apiVersion: batch/v1
kind: Job
metadata:
  name: fmp-targeted-backfill
  namespace: ats-dev
  labels:
    app: ats-genai
    component: fmp-tiebreaker-backfill
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: fmp-backfill
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Starting FMP targeted backfill for tie-breaking..."
          pip install --no-cache-dir asyncpg aiohttp pandas gin-config
          
          mkdir -p /app/src/market_data/eod
          cd /app
          
          # Create targeted FMP backfill script for tie-breaking
          cat > /app/src/market_data/eod/fmp_tiebreaker_backfill.py << 'EOF'
          #!/usr/bin/env python3
          """
          FMP Targeted Backfill for Tie-Breaking
          Only backfills recent data for major stocks to serve as tie-breaker
          when Polygon and Tiingo disagree on prices
          """
          
          import os
          import asyncio
          import aiohttp
          import asyncpg
          import datetime as dt
          import logging
          from typing import List, Dict, Any, Optional
          
          class SimpleEnvironment:
              def get_table_name(self, base_name):
                  return f"dev_{base_name}"
              
              def get_database_url(self):
                  host = os.environ.get('DB_HOST', 'postgres-simple')
                  port = os.environ.get('DB_PORT', '5432')
                  user = os.environ.get('DB_USER', 'postgres')
                  password = os.environ.get('DB_PASSWORD', 'dev_password')
                  database = os.environ.get('DB_NAME', 'dev_db')
                  return f"postgresql://{user}:{password}@{host}:{port}/{database}"
          
          class FmpDAO:
              def __init__(self, env):
                  self.env = env
                  self.table_name = env.get_table_name('daily_prices_fmp')
                  self.db_url = env.get_database_url()
              
              async def batch_insert_prices(self, prices):
                  if not prices:
                      return 0
                  pool = await asyncpg.create_pool(self.db_url, min_size=2, max_size=5)
                  try:
                      async with pool.acquire() as conn:
                          await conn.executemany(f"""
                              INSERT INTO {self.table_name} 
                              (date, instrument_id, open_price, high_price, low_price, close, adj_close, volume)
                              VALUES ($1, $2, $3, $4, $5, $6, $7, $8)
                              ON CONFLICT (date, instrument_id) DO UPDATE SET
                                  open_price=EXCLUDED.open_price,
                                  high_price=EXCLUDED.high_price,
                                  low_price=EXCLUDED.low_price,
                                  close=EXCLUDED.close,
                                  adj_close=EXCLUDED.adj_close,
                                  volume=EXCLUDED.volume,
                                  updated_at=NOW()
                          """,
                          [
                              (
                                  p['date'],
                                  p['instrument_id'],
                                  p.get('open_price'),
                                  p.get('high_price'),
                                  p.get('low_price'),
                                  p.get('close'),
                                  p.get('adj_close'),
                                  p.get('volume'),
                              ) for p in prices
                          ])
                          return len(prices)
                  finally:
                      await pool.close()
          
          class SimpleXrefsDAO:
              def __init__(self, env):
                  self.env = env
                  self.db_url = env.get_database_url()
              
              async def get_tiebreaker_symbols_with_ids(self):
                  """Get high-priority symbols that need tie-breaking coverage"""
                  pool = await asyncpg.create_pool(self.db_url, min_size=1, max_size=3)
                  try:
                      async with pool.acquire() as conn:
                          rows = await conn.fetch("""
                              SELECT DISTINCT 
                                  i.id as instrument_id,
                                  i.symbol,
                                  COALESCE(ix.vendor_symbol, i.symbol) as vendor_symbol
                              FROM dev_instruments i
                              LEFT JOIN dev_instrument_xrefs ix ON i.id = ix.instrument_id
                              LEFT JOIN dev_vendors v ON ix.vendor_id = v.id AND v.name = 'fmp'
                              WHERE i.symbol IN (
                                  -- Top 20 most liquid stocks that need tie-breaking
                                  'AAPL', 'MSFT', 'GOOGL', 'AMZN', 'TSLA', 'META', 'NVDA', 
                                  'JPM', 'V', 'MA', 'UNH', 'HD', 'PG', 'JNJ', 'BAC',
                                  'DIS', 'ADBE', 'CRM', 'NFLX', 'XOM'
                              )
                              ORDER BY i.symbol
                          """)
                          return [(row['instrument_id'], row['symbol'], row['vendor_symbol']) for row in rows]
                  finally:
                      await pool.close()
          
          # FMP API configuration
          FMP_API_KEY = os.getenv("FMP_API_KEY")
          FMP_BASE_URL = "https://financialmodelingprep.com/api/v3"
          
          logger = logging.getLogger(__name__)
          
          async def fetch_fmp_historical_data(session: aiohttp.ClientSession, symbol: str, 
                                            start_date: dt.date, end_date: dt.date) -> List[Dict[str, Any]]:
              """Fetch historical data from FMP API for tie-breaking"""
              if not FMP_API_KEY:
                  logger.error("FMP_API_KEY not available")
                  return []
              
              url = f"{FMP_BASE_URL}/historical-price-full/{symbol}"
              params = {
                  'from': start_date.strftime('%Y-%m-%d'),
                  'to': end_date.strftime('%Y-%m-%d'),
                  'apikey': FMP_API_KEY
              }
              
              try:
                  async with session.get(url, params=params) as response:
                      if response.status == 429:
                          logger.warning(f"Rate limit exceeded for {symbol}")
                          await asyncio.sleep(60)
                          return []
                      
                      if response.status != 200:
                          error_text = await response.text()
                          logger.error(f"FMP API error for {symbol}: {response.status} - {error_text}")
                          return []
                      
                      data = await response.json()
                      
                      if "Error Message" in data:
                          logger.error(f"FMP error for {symbol}: {data['Error Message']}")
                          return []
                      
                      if 'historical' not in data:
                          logger.error(f"No historical data found for {symbol}")
                          return []
                      
                      historical_data = data['historical']
                      prices = []
                      
                      for price_data in historical_data:
                          try:
                              date_obj = dt.datetime.strptime(price_data['date'], "%Y-%m-%d").date()
                              
                              open_price = float(price_data.get('open', 0))
                              high_price = float(price_data.get('high', 0))
                              low_price = float(price_data.get('low', 0))
                              close_price = float(price_data.get('close', 0))
                              adj_close = float(price_data.get('adjClose', close_price))
                              volume = int(price_data.get('volume', 0))
                              
                              price_record = {
                                  'date': date_obj,
                                  'open_price': open_price,
                                  'high_price': high_price,
                                  'low_price': low_price,
                                  'close': close_price,
                                  'adj_close': adj_close,
                                  'volume': volume
                              }
                              
                              prices.append(price_record)
                              
                          except (ValueError, KeyError) as e:
                              logger.warning(f"Error parsing price data for {symbol}: {e}")
                              continue
                      
                      logger.info(f"Fetched {len(prices)} price records for {symbol}")
                      return prices
                      
              except aiohttp.ClientError as e:
                  logger.error(f"Connection error fetching {symbol} from FMP: {e}")
                  return []
          
          async def main():
              logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
              
              if not FMP_API_KEY:
                  print("❌ FMP_API_KEY environment variable not set")
                  return
              
              print("🚀 Starting FMP targeted backfill for tie-breaking...")
              print(f"📅 Focus: Recent 2 years for high-priority symbols")
              
              env = SimpleEnvironment()
              dao = FmpDAO(env)
              xrefs_dao = SimpleXrefsDAO(env)
              
              # Get symbols to backfill
              symbols_data = await xrefs_dao.get_tiebreaker_symbols_with_ids()
              
              if not symbols_data:
                  print("❌ No symbols found for backfill")
                  return
              
              print(f"📊 Found {len(symbols_data)} symbols for tie-breaking coverage")
              
              # Focus on recent 2 years for tie-breaking
              start_date = dt.date(2023, 1, 1)
              end_date = dt.date(2025, 8, 19)
              
              timeout = aiohttp.ClientTimeout(total=30)
              total_records = 0
              completed_symbols = 0
              
              async with aiohttp.ClientSession(timeout=timeout) as session:
                  for instrument_id, symbol, vendor_symbol in symbols_data:
                      print(f"\n🔄 Processing {symbol} for tie-breaking...")
                      
                      try:
                          prices = await fetch_fmp_historical_data(session, vendor_symbol, start_date, end_date)
                          
                          if not prices:
                              print(f"❌ No price data received for {symbol}")
                              continue
                          
                          # Add instrument_id to all price records
                          for price in prices:
                              price['instrument_id'] = instrument_id
                          
                          records_inserted = await dao.batch_insert_prices(prices)
                          total_records += records_inserted
                          completed_symbols += 1
                          
                          print(f"✅ Stored {records_inserted} price records for {symbol}")
                          
                          # Rate limiting: 250 calls per minute = ~0.25 seconds between calls
                          await asyncio.sleep(0.3)
                          
                      except Exception as e:
                          logger.error(f"❌ Failed to backfill {symbol}: {e}")
              
              print(f"\n🎉 FMP tie-breaker backfill completed!")
              print(f"✅ Successfully processed: {completed_symbols}/{len(symbols_data)} symbols")
              print(f"📊 Total records inserted: {total_records:,}")
              print(f"🎯 Ready for tie-breaking when Polygon/Tiingo disagree!")
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          echo "🔄 Running FMP targeted backfill for tie-breaking..."
          cd /app && python src/market_data/eod/fmp_tiebreaker_backfill.py
        env:
        - name: FMP_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: FMP_API_KEY
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: PYTHONPATH
          value: "/app/src"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"