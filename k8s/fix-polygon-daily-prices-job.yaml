apiVersion: batch/v1
kind: Job
metadata:
  name: fix-polygon-daily-prices
  namespace: ats-dev
  labels:
    app: ats-genai
    component: polygon-price-fix
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: polygon-price-fix
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Installing dependencies..."
          pip install --no-cache-dir asyncpg aiohttp requests gin-config
          
          echo "Running corrected Polygon daily price ingestion..."
          cat > /tmp/fix_polygon_prices.py << 'EOF'
          import os
          import asyncio
          import asyncpg
          import aiohttp
          import requests
          from datetime import datetime, date, timedelta
          
          async def fix_polygon_daily_prices():
              """Fix Polygon daily prices by re-ingesting with correct API calls"""
              
              # Database connection
              pool = await asyncpg.create_pool(
                  host="postgres-simple",
                  port=5432,
                  user="postgres",
                  password="dev_password",
                  database="dev_db",
                  min_size=1,
                  max_size=5
              )
              
              polygon_api_key = os.environ.get("POLYGON_API_KEY")
              if not polygon_api_key:
                  print("❌ POLYGON_API_KEY not available")
                  return False
              
              try:
                  async with pool.acquire() as conn:
                      print("\n=== FIXING POLYGON DAILY PRICES ===")
                      
                      # Get a sample of instruments to fix (start with major stocks)
                      test_symbols = ['AAPL', 'MSFT', 'GOOGL', 'AMZN', 'TSLA', 'META', 'NVDA', 'AVGO', 'JPM', 'UNH']
                      
                      for symbol in test_symbols:
                          print(f"\nProcessing {symbol}...")
                          
                          # Get instrument ID
                          instrument_record = await conn.fetchrow("""
                              SELECT i.id, i.symbol
                              FROM dev_instruments i
                              WHERE i.symbol = $1
                              LIMIT 1
                          """, symbol)
                          
                          if not instrument_record:
                              print(f"  ❌ No instrument found for {symbol}")
                              continue
                              
                          instrument_id = instrument_record['id']
                          
                          # Get recent date range to fix
                          end_date = date.today()
                          start_date = end_date - timedelta(days=30)  # Last 30 days
                          
                          print(f"  Fetching prices from {start_date} to {end_date}")
                          
                          # Make correct Polygon API call
                          url = f"https://api.polygon.io/v2/aggs/ticker/{symbol}/range/1/day/{start_date}/{end_date}"
                          params = {
                              "apikey": polygon_api_key,
                              "adjusted": "true",  # CRITICAL: Ensure split-adjusted prices
                              "sort": "asc",
                              "limit": 50000
                          }
                          
                          async with aiohttp.ClientSession() as session:
                              async with session.get(url, params=params) as response:
                                  if response.status != 200:
                                      error_text = await response.text()
                                      print(f"  ❌ API error: {response.status} - {error_text}")
                                      continue
                                  
                                  data = await response.json()
                                  results = data.get('results', [])
                                  
                                  if not results:
                                      print(f"  ⚠️  No data returned for {symbol}")
                                      continue
                                  
                                  print(f"  📊 Got {len(results)} price bars")
                                  
                                  # Show first few prices for verification
                                  for i, bar in enumerate(results[:3]):
                                      bar_date = datetime.fromtimestamp(bar['t']/1000).date()
                                      close_price = bar['c']
                                      volume = bar['v']
                                      print(f"    {bar_date}: ${close_price:.2f} (vol: {volume:,})")
                                  
                                  # Update prices in database (upsert)
                                  updated_count = 0
                                  for bar in results:
                                      bar_date = datetime.fromtimestamp(bar['t']/1000).date()
                                      
                                      # Upsert the corrected price data
                                      await conn.execute("""
                                          INSERT INTO dev_daily_prices_polygon 
                                          (date, instrument_id, open_price, high_price, low_price, close, volume, vwap, transactions)
                                          VALUES ($1, $2, $3, $4, $5, $6, $7, $8, $9)
                                          ON CONFLICT (instrument_id, date) 
                                          DO UPDATE SET
                                              open_price = EXCLUDED.open_price,
                                              high_price = EXCLUDED.high_price, 
                                              low_price = EXCLUDED.low_price,
                                              close = EXCLUDED.close,
                                              volume = EXCLUDED.volume,
                                              vwap = EXCLUDED.vwap,
                                              transactions = EXCLUDED.transactions
                                      """, 
                                      bar_date,
                                      instrument_id,
                                      bar['o'],  # open
                                      bar['h'],  # high  
                                      bar['l'],  # low
                                      bar['c'],  # close (adjusted)
                                      bar['v'],  # volume
                                      bar.get('vw'),  # vwap
                                      bar.get('n')   # number of transactions
                                      )
                                      updated_count += 1
                                  
                                  print(f"  ✅ Updated {updated_count} records for {symbol}")
                          
                          # Small delay to respect API rate limits
                          await asyncio.sleep(0.5)
                      
                      print(f"\n=== VERIFICATION ===")
                      
                      # Verify AAPL price is now correct
                      verification = await conn.fetchrow("""
                          SELECT 
                              p.date,
                              p.close,
                              i.symbol
                          FROM dev_daily_prices_polygon p
                          JOIN dev_instruments i ON p.instrument_id = i.id
                          WHERE i.symbol = 'AAPL'
                          ORDER BY p.date DESC
                          LIMIT 1
                      """)
                      
                      if verification:
                          latest_price = float(verification['close'])
                          latest_date = verification['date']
                          print(f"Latest AAPL price: ${latest_price:.2f} on {latest_date}")
                          
                          if latest_price > 200:
                              print(f"✅ SUCCESS: Polygon prices appear corrected!")
                              print(f"   Price ${latest_price:.2f} is in expected range (~$230-250)")
                          else:
                              print(f"❌ ISSUE: Price ${latest_price:.2f} still looks too low")
                      
                      print(f"\n✅ Polygon price fix completed")
                      return True
                      
              finally:
                  await pool.close()
          
          if __name__ == "__main__":
              success = asyncio.run(fix_polygon_daily_prices())
              exit(0 if success else 1)
          EOF
          
          python /tmp/fix_polygon_prices.py
        env:
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: POLYGON_API_KEY
        - name: PYTHONPATH
          value: "/tmp"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"