apiVersion: batch/v1
kind: Job
metadata:
  name: test-30year-backfill-dry-run
  namespace: ats-dev
  labels:
    app: ats-genai
    component: test-backfill
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: backfill-test
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🧪 Testing 30-year backfill script with dry-run..."
          pip install --no-cache-dir asyncpg aiohttp numpy
          
          mkdir -p /app/scripts/backfill
          mkdir -p /app/src
          cd /app
          
          # Create simplified test script
          cat > /app/scripts/backfill/test_30year_backfill.py << 'EOF'
          import asyncio
          import asyncpg
          import os
          from datetime import date
          from typing import List
          
          class SimpleEnvironment:
              def get_table_name(self, base_name):
                  return f"dev_{base_name}"
              
              def get_database_url(self):
                  host = os.environ.get('DB_HOST', 'postgres-simple')
                  port = os.environ.get('DB_PORT', '5432')
                  user = os.environ.get('DB_USER', 'postgres')
                  password = os.environ.get('DB_PASSWORD', 'dev_password')
                  database = os.environ.get('DB_NAME', 'dev_db')
                  return f"postgresql://{user}:{password}@{host}:{port}/{database}"
          
          async def test_database_connection():
              """Test database connection"""
              env = SimpleEnvironment()
              db_url = env.get_database_url()
              
              print(f"Testing database connection: {db_url}")
              
              try:
                  pool = await asyncpg.create_pool(db_url, min_size=1, max_size=2)
                  async with pool.acquire() as conn:
                      result = await conn.fetchval("SELECT COUNT(*) FROM dev_instruments")
                      print(f"✅ Database connection successful: {result} instruments found")
                  await pool.close()
                  return True
              except Exception as e:
                  print(f"❌ Database connection failed: {e}")
                  return False
          
          async def test_target_symbols():
              """Test getting target symbols"""
              env = SimpleEnvironment()
              db_url = env.get_database_url()
              
              pool = await asyncpg.create_pool(db_url, min_size=1, max_size=2)
              try:
                  async with pool.acquire() as conn:
                      rows = await conn.fetch("""
                          SELECT DISTINCT i.symbol
                          FROM dev_instruments i
                          LEFT JOIN dev_daily_market_cap mc ON i.id = mc.instrument_id
                          LEFT JOIN dev_daily_prices_polygon p ON i.id = p.instrument_id
                          WHERE (
                              mc.market_cap > 1000000000 OR  -- > $1B market cap
                              p.dollar_volume > 50000000     -- > $50M daily volume
                          )
                          ORDER BY i.symbol
                          LIMIT 10
                      """)
                      
                      symbols = [row['symbol'] for row in rows]
                      print(f"✅ Found {len(symbols)} target symbols: {symbols}")
                      return symbols
              finally:
                  await pool.close()
          
          def test_date_chunks():
              """Test date chunk generation"""
              start_date = date(1995, 1, 1)
              end_date = date(2025, 8, 19)
              chunk_years = 2
              
              chunks = []
              current_start = start_date
              
              while current_start < end_date:
                  chunk_end = min(
                      current_start.replace(year=current_start.year + chunk_years),
                      end_date
                  )
                  chunks.append((current_start, chunk_end))
                  current_start = chunk_end.replace(day=1).replace(month=1).replace(year=chunk_end.year + 1)
                  if current_start <= chunk_end:
                      current_start = chunk_end.replace(day=1).replace(month=1).replace(year=chunk_end.year + 1)
              
              print(f"✅ Generated {len(chunks)} date chunks:")
              for i, (start, end) in enumerate(chunks[:5]):  # Show first 5
                  print(f"  Chunk {i+1}: {start} to {end}")
              if len(chunks) > 5:
                  print(f"  ... and {len(chunks) - 5} more chunks")
              
              return chunks
          
          def test_vendor_configs():
              """Test vendor configurations"""
              vendors = {
                  'polygon': {
                      'api_key': os.getenv('POLYGON_API_KEY'),
                      'name': 'Polygon'
                  },
                  'tiingo': {
                      'api_key': os.getenv('TIINGO_API_KEY'),
                      'name': 'Tiingo'
                  },
                  'fmp': {
                      'api_key': os.getenv('FMP_API_KEY'),
                      'name': 'Financial Modeling Prep'
                  }
              }
              
              configured_vendors = []
              for vendor, config in vendors.items():
                  if config['api_key']:
                      configured_vendors.append(vendor)
                      print(f"✅ {config['name']}: API key configured")
                  else:
                      print(f"⚠️  {config['name']}: No API key found")
              
              return configured_vendors
          
          async def main():
              print("🚀 30-YEAR BACKFILL DRY RUN TEST")
              print("=" * 60)
              
              # Test 1: Database connection
              print("\n📊 Test 1: Database Connection")
              db_ok = await test_database_connection()
              
              if not db_ok:
                  print("❌ Cannot proceed without database connection")
                  return
              
              # Test 2: Target symbols
              print("\n🎯 Test 2: Target Symbols")
              symbols = await test_target_symbols()
              
              # Test 3: Date chunks
              print("\n📅 Test 3: Date Chunks")
              chunks = test_date_chunks()
              
              # Test 4: Vendor configurations
              print("\n🏢 Test 4: Vendor Configurations")
              vendors = test_vendor_configs()
              
              # Summary
              print("\n📋 DRY RUN SUMMARY")
              print("=" * 60)
              print(f"✅ Database connection: OK")
              print(f"✅ Target symbols: {len(symbols)} found")
              print(f"✅ Date chunks: {len(chunks)} chunks (30 years)")
              print(f"✅ Configured vendors: {len(vendors)} ({', '.join(vendors)})")
              
              total_requests = len(symbols) * len(chunks) * len(vendors)
              print(f"📊 Estimated total API requests: ~{total_requests:,}")
              
              if len(vendors) >= 2:
                  print("✅ Ready for 30-year backfill execution!")
              else:
                  print("⚠️  Need at least 2 vendors configured for backfill")
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          echo "🔄 Running 30-year backfill dry-run test..."
          cd /app && python scripts/backfill/test_30year_backfill.py
        env:
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: PYTHONPATH
          value: "/app/src"
        # Note: API keys would be from secrets in real job
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"