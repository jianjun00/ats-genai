# LoadBalancer Services for Cloud Deployments
# Provides external IP addresses automatically assigned by cloud provider
apiVersion: v1
kind: Service
metadata:
  name: ats-services-lb
  namespace: ats-dev
  labels:
    app: ats-services
    access-type: loadbalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  selector:
    app: ats-analytics-service  # Primary service for external access
  ports:
  - port: 80
    targetPort: 8080
    name: analytics
  - port: 8081
    targetPort: 8081
    name: minute-data
  - port: 8082
    targetPort: 8082
    name: eod-data
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-lb
  namespace: monitoring
  labels:
    app: monitoring-stack
    access-type: loadbalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: grafana  # Primary monitoring interface
  ports:
  - port: 3000
    targetPort: 3000
    name: grafana
  - port: 9090
    targetPort: 9090  
    name: prometheus
---
# Alternative: ClusterIP with External Load Balancer
apiVersion: v1
kind: Service
metadata:
  name: ats-unified-access
  namespace: ats-dev
  labels:
    app: ats-unified
    access-type: external-lb
spec:
  type: ClusterIP
  selector:
    app: ats-analytics-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ats-external-endpoint
  namespace: ats-dev
spec:
  subsets:
  - addresses:
    - ip: 127.0.0.1  # Replace with your external load balancer IP
    ports:
    - port: 8080
      name: http