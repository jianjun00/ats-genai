apiVersion: v1
kind: ConfigMap
metadata:
  name: create-dashboards-script
  namespace: monitoring
data:
  create_dashboards.py: |
    #!/usr/bin/env python3
    import requests
    import json
    import time
    import sys
    
    # Wait for Grafana to be ready
    grafana_url = "http://grafana:3000"
    auth = ("admin", "admin123")
    
    print("🔍 Waiting for Grafana to be ready...")
    for i in range(30):
        try:
            response = requests.get(f"{grafana_url}/api/health", timeout=5)
            if response.status_code == 200:
                print("✅ Grafana is ready")
                break
        except:
            pass
        print(f"Waiting... {i+1}/30")
        time.sleep(5)
    else:
        print("❌ Grafana not ready")
        sys.exit(1)
    
    # Create data source
    print("📊 Creating Prometheus data source...")
    datasource = {
        "name": "Prometheus",
        "type": "prometheus", 
        "url": "http://prometheus:9090",
        "access": "proxy",
        "isDefault": True
    }
    
    try:
        response = requests.post(f"{grafana_url}/api/datasources", 
                                auth=auth, json=datasource)
        if response.status_code in [200, 409]:
            print("✅ Data source created/exists")
        else:
            print(f"⚠️ Data source response: {response.status_code}")
    except Exception as e:
        print(f"⚠️ Data source error: {e}")
    
    # Create Kubernetes dashboard
    print("🚀 Creating Kubernetes dashboard...")
    k8s_dashboard = {
        "dashboard": {
            "id": None,
            "title": "Kubernetes Cluster Monitoring",
            "tags": ["kubernetes", "monitoring"],
            "timezone": "",
            "panels": [
                {
                    "id": 1,
                    "title": "Total Nodes",
                    "type": "stat",
                    "targets": [{"expr": "count(kube_node_info)", "refId": "A"}],
                    "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "short",
                            "color": {"mode": "value"},
                            "mappings": [],
                            "thresholds": {
                                "steps": [
                                    {"color": "green", "value": None},
                                    {"color": "red", "value": 0}
                                ]
                            }
                        }
                    },
                    "options": {
                        "reduceOptions": {"values": False, "calcs": ["lastNotNull"]},
                        "colorMode": "background"
                    }
                },
                {
                    "id": 2,
                    "title": "Running Pods",
                    "type": "stat", 
                    "targets": [{"expr": "count(kube_pod_info{phase=\"Running\"})", "refId": "A"}],
                    "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "short",
                            "color": {"mode": "value"},
                            "mappings": [],
                            "thresholds": {
                                "steps": [
                                    {"color": "green", "value": None},
                                    {"color": "yellow", "value": 50},
                                    {"color": "red", "value": 100}
                                ]
                            }
                        }
                    },
                    "options": {
                        "reduceOptions": {"values": False, "calcs": ["lastNotNull"]},
                        "colorMode": "background"
                    }
                },
                {
                    "id": 3,
                    "title": "Node CPU Usage",
                    "type": "timeseries",
                    "targets": [{
                        "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
                        "refId": "A",
                        "legendFormat": "{{instance}}"
                    }],
                    "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "percent",
                            "color": {"mode": "palette-classic"}
                        }
                    }
                },
                {
                    "id": 4,
                    "title": "Pod Status", 
                    "type": "timeseries",
                    "targets": [{
                        "expr": "count by (phase) (kube_pod_info)",
                        "refId": "A",
                        "legendFormat": "{{phase}}"
                    }],
                    "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "short",
                            "color": {"mode": "palette-classic"}
                        }
                    }
                }
            ],
            "time": {"from": "now-1h", "to": "now"},
            "refresh": "30s"
        },
        "overwrite": True
    }
    
    try:
        response = requests.post(f"{grafana_url}/api/dashboards/db",
                                auth=auth, json=k8s_dashboard)
        if response.status_code == 200:
            print("✅ Kubernetes dashboard created")
        else:
            print(f"⚠️ Kubernetes dashboard response: {response.status_code}")
            print(response.text)
    except Exception as e:
        print(f"⚠️ Kubernetes dashboard error: {e}")
    
    # Create PostgreSQL dashboard
    print("🐘 Creating PostgreSQL dashboard...")
    pg_dashboard = {
        "dashboard": {
            "id": None,
            "title": "PostgreSQL Database Monitoring", 
            "tags": ["postgresql", "database"],
            "timezone": "",
            "panels": [
                {
                    "id": 1,
                    "title": "Database Status",
                    "type": "stat",
                    "targets": [{"expr": "pg_up", "refId": "A"}],
                    "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "short",
                            "color": {"mode": "value"},
                            "mappings": [
                                {"options": {"0": {"text": "DOWN", "color": "red"}}, "type": "value"},
                                {"options": {"1": {"text": "UP", "color": "green"}}, "type": "value"}
                            ],
                            "thresholds": {
                                "steps": [
                                    {"color": "red", "value": None},
                                    {"color": "green", "value": 1}
                                ]
                            }
                        }
                    },
                    "options": {
                        "reduceOptions": {"values": False, "calcs": ["lastNotNull"]},
                        "colorMode": "background"
                    }
                },
                {
                    "id": 2,
                    "title": "Active Connections",
                    "type": "stat",
                    "targets": [{"expr": "sum(pg_stat_database_numbackends{datname=\"dev_db\"})", "refId": "A"}],
                    "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "short",
                            "color": {"mode": "value"},
                            "mappings": [],
                            "thresholds": {
                                "steps": [
                                    {"color": "green", "value": None},
                                    {"color": "yellow", "value": 50},
                                    {"color": "red", "value": 80}
                                ]
                            }
                        }
                    },
                    "options": {
                        "reduceOptions": {"values": False, "calcs": ["lastNotNull"]},
                        "colorMode": "background"
                    }
                },
                {
                    "id": 3,
                    "title": "Database Connections by Database",
                    "type": "timeseries",
                    "targets": [{
                        "expr": "pg_stat_database_numbackends",
                        "refId": "A", 
                        "legendFormat": "{{datname}}"
                    }],
                    "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "short",
                            "color": {"mode": "palette-classic"}
                        }
                    }
                },
                {
                    "id": 4,
                    "title": "Transaction Rate",
                    "type": "timeseries",
                    "targets": [
                        {"expr": "rate(pg_stat_database_xact_commit{datname=\"dev_db\"}[5m])", "refId": "A", "legendFormat": "Commits/sec"},
                        {"expr": "rate(pg_stat_database_xact_rollback{datname=\"dev_db\"}[5m])", "refId": "B", "legendFormat": "Rollbacks/sec"}
                    ],
                    "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "reqps",
                            "color": {"mode": "palette-classic"}
                        }
                    }
                }
            ],
            "time": {"from": "now-1h", "to": "now"},
            "refresh": "10s"
        },
        "overwrite": True
    }
    
    try:
        response = requests.post(f"{grafana_url}/api/dashboards/db",
                                auth=auth, json=pg_dashboard)
        if response.status_code == 200:
            print("✅ PostgreSQL dashboard created")
        else:
            print(f"⚠️ PostgreSQL dashboard response: {response.status_code}")
            print(response.text)
    except Exception as e:
        print(f"⚠️ PostgreSQL dashboard error: {e}")
    
    # List dashboards
    print("📋 Listing available dashboards...")
    try:
        response = requests.get(f"{grafana_url}/api/search?type=dash-db", auth=auth)
        if response.status_code == 200:
            dashboards = response.json()
            for dash in dashboards:
                print(f"  📊 {dash['title']} (uid: {dash['uid']})")
        else:
            print(f"Could not list dashboards: {response.status_code}")
    except Exception as e:
        print(f"Error listing dashboards: {e}")
    
    print("🎉 Dashboard creation completed!")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-dashboards-job
  namespace: monitoring
spec:
  template:
    spec:
      containers:
      - name: dashboard-creator
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
          - -c
          - |
            pip install requests
            python3 /scripts/create_dashboards.py
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: create-dashboards-script
      restartPolicy: Never
  backoffLimit: 3