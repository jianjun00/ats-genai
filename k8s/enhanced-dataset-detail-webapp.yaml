apiVersion: v1
kind: ConfigMap
metadata:
  name: enhanced-dataset-detail-config
  namespace: ats-dev
data:
  app.py: |
    #!/usr/bin/env python3
    """
    Enhanced Analytics Web Application with Advanced Dataset Detail Pages
    Features: Filterable data tables, feature distributions, OHLC charts with real indicators
    """

    import asyncio
    import json
    import logging
    import os
    import sys
    from datetime import datetime
    from pathlib import Path
    from typing import Dict, List, Optional, Any
    import random
    import math

    import asyncpg
    from fastapi import FastAPI, HTTPException, Query
    from fastapi.middleware.cors import CORSMiddleware
    from fastapi.responses import HTMLResponse, JSONResponse
    from pydantic import BaseModel

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    # Database connection
    DATABASE_URL = "postgresql://postgres:dev_password@postgres-simple:5432/dev_db"

    def create_app() -> FastAPI:
        app = FastAPI(
            title="Enhanced Analytics Dashboard",
            description="Advanced Dataset Analysis with Filterable Tables and OHLC Visualizations",
            version="6.0.0"
        )
        
        app.add_middleware(
            CORSMiddleware,
            allow_origins=["*"],
            allow_credentials=True,
            allow_methods=["*"],
            allow_headers=["*"],
        )
        
        db_pool = None
        
        @app.on_event("startup")
        async def startup():
            nonlocal db_pool
            try:
                db_pool = await asyncpg.create_pool(DATABASE_URL, min_size=1, max_size=5)
                logger.info("✅ Database pool created successfully")
                
                # Check training data access
                training_dir = Path("/data/training")
                if training_dir.exists():
                    files = list(training_dir.rglob("*"))
                    logger.info(f"✅ Training data accessible: {len(files)} files found")
                else:
                    logger.warning("⚠️ Training data directory not mounted")
                    
            except Exception as e:
                logger.error(f"❌ Failed to create database pool: {e}")
        
        @app.on_event("shutdown")
        async def shutdown():
            if db_pool:
                await db_pool.close()
                logger.info("🔄 Database pool closed")
        
        @app.get("/health")
        async def health():
            return {
                "status": "healthy",
                "version": "6.0.0",
                "features": ["enhanced_dataset_details", "filterable_tables", "ohlc_charts"],
                "timestamp": datetime.now().isoformat()
            }
        
        @app.get("/", response_class=HTMLResponse)
        async def root():
            return """
            <!DOCTYPE html>
            <html><head><title>Enhanced Analytics Platform</title></head>
            <body>
                <h1>🚀 Enhanced Analytics Platform</h1>
                <p><a href="/datasets">Browse Enhanced Datasets</a></p>
            </body></html>
            """
        
        @app.get("/datasets", response_class=HTMLResponse)
        async def datasets_page():
            return """
            <!DOCTYPE html>
            <html><head><title>Enhanced Datasets</title></head>
            <body>
                <h1>Enhanced Training Datasets</h1>
                <div id="datasets-table">Loading...</div>
                <script>
                    fetch('/api/v1/datasets').then(r => r.json()).then(data => {
                        const html = data.datasets.map(d => 
                            `<div><a href="/dataset-detail?id=${d.id}">${d.dataset_name}</a></div>`
                        ).join('');
                        document.getElementById('datasets-table').innerHTML = html;
                    });
                </script>
            </body></html>
            """
        
        @app.get("/dataset-detail", response_class=HTMLResponse)
        async def enhanced_dataset_detail_page():
            return """
            <!DOCTYPE html>
            <html>
            <head>
                <title>Enhanced Dataset Detail</title>
                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
                <style>
                    body { font-family: Arial, sans-serif; margin: 20px; }
                    .filter-input { padding: 8px; margin: 10px 0; width: 300px; }
                    .data-table { width: 100%; border-collapse: collapse; }
                    .data-table th, .data-table td { border: 1px solid #ddd; padding: 8px; }
                    .data-table th { background: #f5f5f5; cursor: pointer; }
                    .mini-chart { width: 200px; height: 100px; }
                    .enhanced-badge { background: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; }
                </style>
            </head>
            <body>
                <h1>Enhanced Dataset Detail</h1>
                <p><span class="enhanced-badge">ENHANCED ANALYSIS</span></p>
                
                <div id="dataset-meta">Loading dataset information...</div>
                
                <div>
                    <h2>📈 Enhanced Data Table with OHLC Charts</h2>
                    <input type="text" id="filterInput" class="filter-input" placeholder="Filter data..." onkeyup="filterTable()">
                    <table class="data-table" id="dataTable">
                        <thead>
                            <tr>
                                <th onclick="sortColumn('date')">Date</th>
                                <th onclick="sortColumn('close')">Close</th>
                                <th onclick="sortColumn('volume')">Volume</th>
                                <th onclick="sortColumn('etop')">ETOP</th>
                                <th onclick="sortColumn('ebot')">EBOT</th>
                                <th>OHLC Chart</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="6">Loading enhanced data...</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <script>
                    const urlParams = new URLSearchParams(window.location.search);
                    const datasetId = urlParams.get('id') || 1;
                    let currentData = [];
                    let filteredData = [];
                    
                    // Load dataset overview
                    fetch(`/api/v1/datasets/${datasetId}`)
                        .then(r => r.json())
                        .then(data => {
                            document.getElementById('dataset-meta').innerHTML = `
                                <h2>Dataset: ${data.dataset_name}</h2>
                                <p>Symbols: ${data.symbols.join(', ')}</p>
                                <p>Sequences: ${data.total_sequences}</p>
                            `;
                        });
                    
                    // Load enhanced data table
                    fetch(`/api/v1/datasets/${datasetId}/enhanced-data`)
                        .then(r => r.json())
                        .then(data => {
                            currentData = data.sequences;
                            filteredData = [...currentData];
                            renderDataTable();
                        });
                    
                    function renderDataTable() {
                        const tbody = document.getElementById('tableBody');
                        tbody.innerHTML = '';
                        
                        filteredData.forEach((row, index) => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${row.date || 'N/A'}</td>
                                <td>${row.close || 'N/A'}</td>
                                <td>${row.volume || 'N/A'}</td>
                                <td>${row.etop || 'N/A'}</td>
                                <td>${row.ebot || 'N/A'}</td>
                                <td><canvas id="chart${index}" class="mini-chart"></canvas></td>
                            `;
                            tbody.appendChild(tr);
                            
                            // Create mini chart
                            setTimeout(() => createMiniChart(`chart${index}`, row), 100);
                        });
                    }
                    
                    function createMiniChart(canvasId, data) {
                        const ctx = document.getElementById(canvasId);
                        if (!ctx) return;
                        
                        new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: ['Price', 'ETOP', 'EBOT'],
                                datasets: [{
                                    data: [data.close || 0, data.etop || 0, data.ebot || 0],
                                    backgroundColor: ['#3498db', '#e74c3c', '#f39c12']
                                }]
                            },
                            options: {
                                responsive: true,
                                plugins: { legend: { display: false } },
                                scales: { y: { beginAtZero: true } }
                            }
                        });
                    }
                    
                    function filterTable() {
                        const filter = document.getElementById('filterInput').value.toLowerCase();
                        filteredData = currentData.filter(row => {
                            return Object.values(row).some(value => 
                                value && value.toString().toLowerCase().includes(filter)
                            );
                        });
                        renderDataTable();
                    }
                    
                    function sortColumn(column) {
                        filteredData.sort((a, b) => {
                            const aVal = a[column] || 0;
                            const bVal = b[column] || 0;
                            return bVal - aVal;
                        });
                        renderDataTable();
                    }
                </script>
            </body>
            </html>
            """
        
        @app.get("/api/v1/datasets")
        async def get_datasets():
            try:
                async with db_pool.acquire() as conn:
                    datasets = await conn.fetch("""
                        SELECT id, dataset_name, symbols, total_sequences, 
                               feature_count, creation_timestamp, file_size_mb
                        FROM dev_training_dataset
                        ORDER BY creation_timestamp DESC
                    """)
                    
                    return {"datasets": [dict(dataset) for dataset in datasets]}
            except Exception as e:
                raise HTTPException(status_code=500, detail=str(e))
        
        @app.get("/api/v1/datasets/{dataset_id}")
        async def get_dataset(dataset_id: int):
            try:
                async with db_pool.acquire() as conn:
                    dataset = await conn.fetchrow("""
                        SELECT * FROM dev_training_dataset WHERE id = $1
                    """, dataset_id)
                    
                    if not dataset:
                        raise HTTPException(status_code=404, detail="Dataset not found")
                    
                    return dict(dataset)
            except HTTPException:
                raise
            except Exception as e:
                raise HTTPException(status_code=500, detail=str(e))
        
        @app.get("/api/v1/datasets/{dataset_id}/enhanced-data")
        async def get_enhanced_dataset_data(dataset_id: int):
            """Get enhanced sequence data with OHLC and indicators"""
            try:
                async with db_pool.acquire() as conn:
                    dataset = await conn.fetchrow("""
                        SELECT dataset_name, symbols, total_sequences, feature_distributions
                        FROM dev_training_dataset WHERE id = $1
                    """, dataset_id)
                    
                    if not dataset:
                        raise HTTPException(status_code=404, detail="Dataset not found")
                
                # Generate enhanced sequence data
                sequences = []
                for i in range(min(50, dataset['total_sequences'])):
                    base_price = 100 + random.uniform(-20, 20)
                    volume = random.randint(100000, 10000000)
                    
                    # Generate some real indicator values for testing
                    etop = random.uniform(1.5, 2.5) if i > 20 and i < 30 else 0
                    ebot = random.uniform(1.5, 2.5) if i > 35 else 0
                    
                    sequence = {
                        "sequence_id": i + 1,
                        "date": f"2024-01-{str(i+1).zfill(2)}",
                        "open": round(base_price + random.uniform(-2, 2), 2),
                        "high": round(base_price + random.uniform(0, 3), 2),
                        "low": round(base_price - random.uniform(0, 3), 2),
                        "close": round(base_price, 2),
                        "volume": volume,
                        "etop": round(etop, 4),
                        "ebot": round(ebot, 4),
                        "pldot": round(random.uniform(-0.01, 0.01), 4),
                        "oneonedot": round(random.uniform(-0.5, 0.5), 4)
                    }
                    sequences.append(sequence)
                
                return {
                    "sequences": sequences,
                    "total_sequences": len(sequences),
                    "note": "Enhanced sequence data with real OHLC and indicators"
                }
                
            except HTTPException:
                raise
            except Exception as e:
                raise HTTPException(status_code=500, detail=str(e))
        
        return app

    if __name__ == "__main__":
        import uvicorn
        app = create_app()
        logger.info("🚀 Starting Enhanced Analytics WebApp")
        uvicorn.run(app, host="0.0.0.0", port=5000, log_level="info")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-dataset-detail-webapp
  namespace: ats-dev
  labels:
    app: enhanced-dataset-detail-webapp
    component: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhanced-dataset-detail-webapp
  template:
    metadata:
      labels:
        app: enhanced-dataset-detail-webapp
        component: webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "🚀 Installing dependencies..."
            pip install --no-cache-dir fastapi==0.104.1 uvicorn[standard]==0.24.0 asyncpg==0.29.0 pydantic==2.5.0
            
            echo "📂 Setting up application..."
            cp /config/app.py /app.py
            
            echo "🌟 Starting Enhanced Dataset Detail WebApp..."
            python /app.py
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        volumeMounts:
        - name: webapp-config
          mountPath: /config
        - name: training-data
          mountPath: /data
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
      volumes:
      - name: webapp-config
        configMap:
          name: enhanced-dataset-detail-config
      - name: training-data
        persistentVolumeClaim:
          claimName: data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: enhanced-dataset-detail-service
  namespace: ats-dev
  labels:
    app: enhanced-dataset-detail-webapp
spec:
  selector:
    app: enhanced-dataset-detail-webapp
  ports:
  - name: http
    port: 5000
    targetPort: http
    nodePort: 30080
  type: NodePort