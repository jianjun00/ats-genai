apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-dev-to-prod-v2
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: migrator
        image: python:3.11-slim
        command: ["/bin/bash"]
        args:
        - -c
        - |
          # Install required packages
          pip install asyncpg
          
          # Create migration script
          cat > /tmp/migrate_dev_to_prod.py << 'PYTHON_SCRIPT_EOF'
          #!/usr/bin/env python3
          """
          Migration script to copy dev_ tables to prod_ tables
          Based on the successful dev-to-intg migration pattern
          """
          import asyncio
          import asyncpg
          import sys
          import logging
          from typing import List, Tuple, Optional
          
          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
          logger = logging.getLogger(__name__)
          
          # Database configs
          DEV_CONFIG = {
              'host': 'postgres.ats-dev.svc.cluster.local',
              'port': 5432,
              'user': 'postgres', 
              'password': 'dev_password',
              'database': 'dev_db'
          }
          
          PROD_CONFIG = {
              'host': 'postgres.ats-prod.svc.cluster.local',
              'port': 5432,
              'user': 'postgres',
              'password': 'prod_password',
              'database': 'prod_db'
          }
          
          class DatabaseMigrator:
              def __init__(self, dev_config: dict, prod_config: dict):
                  self.dev_config = dev_config
                  self.prod_config = prod_config
                  self.dev_conn = None
                  self.prod_conn = None
          
              async def connect(self):
                  """Connect to both databases"""
                  logger.info("Connecting to dev database...")
                  self.dev_conn = await asyncpg.connect(**self.dev_config)
                  logger.info("✅ Connected to dev database")
                  
                  logger.info("Connecting to prod database...")
                  self.prod_conn = await asyncpg.connect(**self.prod_config)
                  logger.info("✅ Connected to prod database")
          
              async def disconnect(self):
                  """Close database connections"""
                  if self.dev_conn:
                      await self.dev_conn.close()
                  if self.prod_conn:
                      await self.prod_conn.close()
          
              async def get_table_structure(self, table_name: str) -> str:
                  """Get CREATE TABLE statement for the table"""
                  # Get table definition
                  columns_query = """
                  SELECT column_name, data_type, character_maximum_length, 
                         numeric_precision, numeric_scale, is_nullable, column_default
                  FROM information_schema.columns 
                  WHERE table_name = $1 AND table_schema = 'public'
                  ORDER BY ordinal_position
                  """
                  columns = await self.dev_conn.fetch(columns_query, table_name)
                  
                  if not columns:
                      raise ValueError(f"Table {table_name} not found")
          
                  # Build column definitions
                  col_defs = []
                  for col in columns:
                      col_def = f"{col['column_name']} {col['data_type']}"
                      
                      if col['character_maximum_length']:
                          col_def += f"({col['character_maximum_length']})"
                      elif col['numeric_precision'] and col['data_type'] in ('numeric', 'decimal'):
                          if col['numeric_scale']:
                              col_def += f"({col['numeric_precision']},{col['numeric_scale']})"
                          else:
                              col_def += f"({col['numeric_precision']})"
                      
                      if col['is_nullable'] == 'NO':
                          col_def += " NOT NULL"
                      
                      if col['column_default']:
                          default_val = col['column_default']
                          # Replace dev_ sequence references with prod_
                          if 'dev_' in default_val:
                              default_val = default_val.replace('dev_', 'prod_')
                          col_def += f" DEFAULT {default_val}"
                      
                      col_defs.append(col_def)
          
                  prod_table = table_name.replace('dev_', 'prod_', 1)
                  create_sql = f"CREATE TABLE {prod_table} (\n  " + ",\n  ".join(col_defs) + "\n)"
                  return create_sql
          
              async def get_sequences_for_table(self, table_name: str) -> List[Tuple[str, str]]:
                  """Get sequences associated with a table"""
                  seq_query = """
                  SELECT s.sequence_name, c.column_name
                  FROM information_schema.sequences s
                  JOIN pg_class seq_class ON seq_class.relname = s.sequence_name
                  JOIN pg_depend d ON d.objid = seq_class.oid AND d.deptype = 'a'
                  JOIN pg_class table_class ON d.refobjid = table_class.oid
                  JOIN pg_attribute a ON a.attrelid = table_class.oid AND a.attnum = d.refobjsubid
                  JOIN information_schema.columns c ON c.table_name = table_class.relname AND c.column_name = a.attname
                  WHERE table_class.relname = $1
                  """
                  sequences = await self.dev_conn.fetch(seq_query, table_name)
                  return [(row['sequence_name'], row['column_name']) for row in sequences]
          
              async def copy_table_data(self, dev_table: str, prod_table: str) -> int:
                  """Copy data from dev table to prod table"""
                  count = await self.dev_conn.fetchval(f"SELECT COUNT(*) FROM {dev_table}")
                  if count == 0:
                      logger.info(f"📊 No data to copy from {dev_table}")
                      return 0
          
                  # Get all rows
                  rows = await self.dev_conn.fetch(f"SELECT * FROM {dev_table}")
                  if not rows:
                      return 0
          
                  # Insert into prod table
                  column_names = list(rows[0].keys())
                  placeholders = ", ".join(f"${i+1}" for i in range(len(column_names)))
                  insert_sql = f"INSERT INTO {prod_table} ({', '.join(column_names)}) VALUES ({placeholders})"
                  
                  batch_values = [list(row.values()) for row in rows]
                  await self.prod_conn.executemany(insert_sql, batch_values)
                  
                  logger.info(f"📊 Copied {count} rows")
                  return count
          
              async def sync_sequences(self, dev_table: str, sequences: List[Tuple[str, str]]):
                  """Sync sequence values"""
                  prod_table = dev_table.replace('dev_', 'prod_', 1)
                  
                  for dev_seq, column_name in sequences:
                      prod_seq = dev_seq.replace('dev_', 'prod_', 1)
                      
                      try:
                          # Get current sequence value
                          current_val = await self.dev_conn.fetchval(f"SELECT last_value FROM {dev_seq}")
                          
                          # Get max value from copied data
                          max_val = await self.prod_conn.fetchval(f"SELECT COALESCE(MAX({column_name}), 0) FROM {prod_table}")
                          
                          # Set sequence to max value
                          if max_val > 0:
                              await self.prod_conn.execute(f"SELECT setval('{prod_seq}', {max_val})")
                              logger.info(f"🔢 Set {prod_seq} to {max_val}")
                          else:
                              await self.prod_conn.execute(f"SELECT setval('{prod_seq}', {current_val})")
                              logger.info(f"🔢 Set {prod_seq} to {current_val}")
                              
                      except Exception as e:
                          logger.warning(f"⚠️  Could not sync sequence {dev_seq}: {e}")
          
              async def migrate_table(self, dev_table: str):
                  """Migrate a single table from dev to prod"""
                  prod_table = dev_table.replace('dev_', 'prod_', 1)
                  logger.info(f"🔄 Migrating {dev_table} → {prod_table}")
                  
                  # Get sequences before creating table
                  sequences = await self.get_sequences_for_table(dev_table)
                  
                  # Create table structure
                  create_sql = await self.get_table_structure(dev_table)
                  await self.prod_conn.execute(f"DROP TABLE IF EXISTS {prod_table} CASCADE")
                  await self.prod_conn.execute(create_sql)
                  logger.info(f"✅ Created table {prod_table}")
                  
                  # Copy data
                  copied_count = await self.copy_table_data(dev_table, prod_table)
                  
                  # Sync sequences
                  if sequences:
                      await self.sync_sequences(dev_table, sequences)
                  
                  return copied_count
          
              async def run_migration(self) -> bool:
                  """Run the complete migration"""
                  try:
                      await self.connect()
                      
                      # Get dev_ tables
                      tables_query = """
                      SELECT tablename FROM pg_tables 
                      WHERE schemaname = 'public' AND tablename LIKE 'dev_%'
                      ORDER BY tablename
                      """
                      dev_tables = await self.dev_conn.fetch(tables_query)
                      table_names = [row['tablename'] for row in dev_tables]
                      
                      logger.info(f"Found {len(table_names)} dev_ tables: {', '.join(table_names)}")
                      
                      if not table_names:
                          logger.error("❌ No dev_ tables found")
                          return False
                      
                      # Migrate tables in dependency order
                      priority_tables = ['dev_users', 'dev_products', 'dev_daily_prices', 'dev_training_dataset']
                      ordered_tables = []
                      
                      # Add priority tables first
                      for table in priority_tables:
                          if table in table_names:
                              ordered_tables.append(table)
                      
                      # Add remaining tables
                      for table in table_names:
                          if table not in ordered_tables:
                              ordered_tables.append(table)
                      
                      # Migrate each table
                      success_count = 0
                      for table_name in ordered_tables:
                          try:
                              await self.migrate_table(table_name)
                              success_count += 1
                          except Exception as e:
                              logger.error(f"❌ Failed to migrate {table_name}: {e}")
                              import traceback
                              traceback.print_exc()
                      
                      # Verify results
                      logger.info("🔍 Verifying migration...")
                      for table_name in table_names:
                          prod_table = table_name.replace('dev_', 'prod_', 1)
                          try:
                              dev_count = await self.dev_conn.fetchval(f"SELECT COUNT(*) FROM {table_name}")
                              prod_count = await self.prod_conn.fetchval(f"SELECT COUNT(*) FROM {prod_table}")
                              
                              if dev_count == prod_count:
                                  logger.info(f"✅ {table_name} → {prod_table}: {dev_count} rows")
                              else:
                                  logger.error(f"❌ {table_name} → {prod_table}: {dev_count} vs {prod_count} rows")
                          except Exception as e:
                              logger.error(f"❌ Verification failed for {table_name}: {e}")
                      
                      logger.info(f"🎉 Migration completed! {success_count}/{len(table_names)} tables successful")
                      return success_count == len(table_names)
                      
                  except Exception as e:
                      logger.error(f"💥 Migration failed: {e}")
                      import traceback
                      traceback.print_exc()
                      return False
                  finally:
                      await self.disconnect()
          
          async def main():
              """Main migration function"""
              logger.info("🚀 Starting dev_db → prod_db migration...")
              
              migrator = DatabaseMigrator(DEV_CONFIG, PROD_CONFIG)
              success = await migrator.run_migration()
              
              if success:
                  logger.info("✅ Migration completed successfully!")
                  return 0
              else:
                  logger.error("❌ Migration failed!")
                  return 1
          
          if __name__ == "__main__":
              exit_code = asyncio.run(main())
              sys.exit(exit_code)
          PYTHON_SCRIPT_EOF
          
          # Run the migration script
          python3 /tmp/migrate_dev_to_prod.py
        workingDir: /tmp
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Never
  backoffLimit: 2