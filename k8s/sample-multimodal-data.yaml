apiVersion: batch/v1
kind: Job
metadata:
  name: sample-multimodal-data
  namespace: ats-dev
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: sample
        image: postgres:13
        env:
        - name: PGPASSWORD
          value: "dev_password"
        command: ["psql"]
        args: ["-h", "postgres", "-p", "5432", "-U", "postgres", "-d", "dev_db", "-c", "SELECT symbol, sample_date, prediction_horizon, news_sentiment_7d, news_volume_7d, economic_event_impact_7d, target_return_1d, target_direction_1d, sample_quality_score FROM dev_multimodal_training_samples WHERE symbol = 'AAPL' ORDER BY sample_date DESC LIMIT 5;"]