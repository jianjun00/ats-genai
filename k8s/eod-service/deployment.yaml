apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-eod-service
  namespace: ats-dev
  labels:
    app: ats-eod-service
    component: data-collection
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Ensure zero-downtime deployment
  selector:
    matchLabels:
      app: ats-eod-service
  template:
    metadata:
      labels:
        app: ats-eod-service
        component: data-collection
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ats-service-account
      containers:
      - name: eod-service
        image: ats/eod-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: ats-db-secret
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: ats-db-secret
              key: port
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: ats-db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ats-db-secret
              key: password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: ats-db-secret
              key: database
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: ats-api-keys
              key: polygon-api-key
        - name: TIINGO_API_KEY
          valueFrom:
            secretKeyRef:
              name: ats-api-keys
              key: tiingo-api-key
        - name: FMP_API_KEY
          valueFrom:
            secretKeyRef:
              name: ats-api-keys
              key: fmp-api-key
        - name: PYTHONPATH
          value: "/app/src"
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: gin-config
          mountPath: /app/config/app_dev.gin
          subPath: app_dev.gin
          readOnly: true
        resources:
          requests:
            memory: "768Mi"
            cpu: "300m"
          limits:
            memory: "1.5Gi"
            cpu: "750m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: config-volume
        configMap:
          name: ats-config
      - name: gin-config
        configMap:
          name: ats-gin-config
          items:
          - key: app_dev.gin
            path: app_dev.gin
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst

---
apiVersion: v1
kind: Service
metadata:
  name: ats-eod-service
  namespace: ats-dev
  labels:
    app: ats-eod-service
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: http
  selector:
    app: ats-eod-service

---
# CronJob for scheduled EOD collection
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ats-eod-daily-collection
  namespace: ats-dev
  labels:
    app: ats-eod-service
    component: scheduler
spec:
  schedule: "0 18 * * 1-5"  # 6 PM on weekdays (after market close)
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: ats-eod-collection-job
        spec:
          serviceAccountName: ats-service-account
          containers:
          - name: eod-collection
            image: curlimages/curl:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "Triggering daily EOD collection..."
              curl -X POST "http://ats-eod-service:8082/collect?days_back=1" \
                   -H "Content-Type: application/json" \
                   -d '{"triggered_by": "cron_job", "collection_type": "daily_scheduled"}'
              echo "Collection triggered successfully"
          restartPolicy: OnFailure
          backoffLimit: 3