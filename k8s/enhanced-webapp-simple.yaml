apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-analytics-webapp
  namespace: ats-dev
  labels:
    app: enhanced-analytics-webapp
    component: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhanced-analytics-webapp
  template:
    metadata:
      labels:
        app: enhanced-analytics-webapp
        component: webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        ports:
        - containerPort: 3000
        command: ["/bin/bash"]
        args:
        - -c
        - |
          set -e
          echo "🚀 Installing dependencies..."
          pip install --no-cache-dir fastapi==0.104.1 uvicorn[standard]==0.24.0 asyncpg==0.29.0 pydantic==2.5.0 numpy pandas pathlib2
          
          echo "📂 Setting up application structure..."
          mkdir -p /app/src/config /app/src/dao
          cp /config/webapp.py /app.py
          
          echo "📄 Creating minimal DAO files..."
          # Create Environment config (simplified)
          cat > /app/src/config/environment.py << 'EOF'
          import os
          
          class Environment:
              def __init__(self):
                  self.env_type = os.getenv('ENVIRONMENT', 'dev')
                  
              def get_table_name(self, base_name):
                  return f"{self.env_type}_{base_name}"
                  
              def get_database_url(self):
                  host = os.getenv('DB_HOST', 'postgres-simple')
                  port = os.getenv('DB_PORT', '5432')
                  user = os.getenv('DB_USER', 'postgres')
                  password = os.getenv('DB_PASSWORD', 'dev_password')
                  db_name = os.getenv('DB_NAME', 'dev_db')
                  return f"postgresql://{user}:{password}@{host}:{port}/{db_name}"
          EOF
          
          echo "📝 Starting application..."
          python /app.py
          
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        env:
        - name: ENVIRONMENT
          value: dev
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
              optional: true
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
              optional: true
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
              optional: true
        volumeMounts:
        - name: config-volume
          mountPath: /config
      volumes:
      - name: config-volume
        configMap:
          name: enhanced-webapp-config

---
apiVersion: v1
kind: Service
metadata:
  name: enhanced-analytics-webapp-service
  namespace: ats-dev
spec:
  selector:
    app: enhanced-analytics-webapp
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000
  type: NodePort