apiVersion: batch/v1
kind: Job
metadata:
  name: sr-training-persistent
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: sr-training
        image: python:3.12-slim
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: PYTHONPATH
          value: "/src"
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/sr_training_persistent_1.py"