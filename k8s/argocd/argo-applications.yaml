---
# Application Set for coordinated deployment
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ats-service-stack
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - service: minute-service
        port: 8081
        path: k8s/minute-service
      - service: eod-service
        port: 8082
        path: k8s/eod-service
      - service: analytics-service
        port: 8080
        path: k8s/analytics-service
  template:
    metadata:
      name: 'ats-{{service}}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{service == 'analytics-service' && '2' || '1'}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/your-org/ats-genai
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: ats-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - Validate=true
          - CreateNamespace=true