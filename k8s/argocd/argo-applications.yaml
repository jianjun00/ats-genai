# Argo CD Applications for ATS 3-Service System
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ats-minute-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/ats-genai
    targetRevision: HEAD
    path: k8s/minute-service
  destination:
    server: https://kubernetes.default.svc
    namespace: ats-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10

