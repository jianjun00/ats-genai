apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ats-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jianjun00/ats-genai.git
    targetRevision: HEAD
    path: k8s/environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ats-prod
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # Manual sync for production - no automated deployment
