apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ats-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jianjun00/ats-genai.git
    targetRevision: HEAD
    path: k8s/environments/dev
    directory:
      exclude: ".atsenv/**,.atsenv,.venv/**,.venv"
  destination:
    server: https://kubernetes.default.svc
    namespace: ats-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: "*"
    kind: "*"
    jsonPointers:
    - /spec/template/spec/containers/*/command
    - /spec/template/spec/containers/*/args
