apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-dev
  namespace: ats-dev
spec:
  backoffLimit: 2
  template:
    spec:
      containers:
      - name: migration-dev
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "🚀 Installing dependencies..."
          pip install --no-cache-dir asyncpg
          
          echo "🔄 Starting ATS-DEV database migration..."
          cat > /app/migrate_dev.py << 'EOF'
          import asyncio
          import asyncpg
          import logging
          from datetime import datetime
          
          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
          logger = logging.getLogger(__name__)
          
          async def run_dev_migration():
              """Run database migration for ATS-DEV environment"""
              try:
                  # Connect to ats-dev database
                  conn = await asyncpg.connect(
                      host='postgres',
                      port=5432,
                      user='postgres',
                      password='dev_password',
                      database='dev_db'
                  )
                  logger.info("✅ Connected to ATS-DEV database")
                  
                  # Run migration SQL commands
                  migration_commands = [
                      # Ensure all required tables exist
                      """
                      CREATE TABLE IF NOT EXISTS dev_migration_log (
                          id SERIAL PRIMARY KEY,
                          migration_name VARCHAR(255) NOT NULL,
                          executed_at TIMESTAMP DEFAULT NOW(),
                          status VARCHAR(50) DEFAULT 'completed',
                          details TEXT
                      );
                      """,
                      
                      # Update existing tables structure if needed
                      """
                      -- Ensure dev_instruments has all required columns
                      ALTER TABLE dev_instruments 
                      ADD COLUMN IF NOT EXISTS last_validated_at TIMESTAMP,
                      ADD COLUMN IF NOT EXISTS reconciliation_notes TEXT[],
                      ADD COLUMN IF NOT EXISTS eodhd_raw JSONB,
                      ADD COLUMN IF NOT EXISTS polygon_raw JSONB,
                      ADD COLUMN IF NOT EXISTS tiingo_raw JSONB;
                      """,
                      
                      # Ensure vendor tables exist
                      """
                      CREATE TABLE IF NOT EXISTS vendors (
                          vendor_id SERIAL PRIMARY KEY,
                          vendor_name VARCHAR(50) UNIQUE NOT NULL,
                          vendor_description TEXT,
                          is_active BOOLEAN DEFAULT true,
                          created_at TIMESTAMP DEFAULT now(),
                          updated_at TIMESTAMP DEFAULT now()
                      );
                      """,
                      
                      # Ensure instrument_xrefs table exists
                      """
                      CREATE TABLE IF NOT EXISTS instrument_xrefs (
                          id SERIAL PRIMARY KEY,
                          instrument_id INTEGER NOT NULL,
                          vendor_id INTEGER NOT NULL REFERENCES vendors(vendor_id),
                          external_symbol VARCHAR(100) NOT NULL,
                          start_date DATE,
                          end_date DATE,
                          created_at TIMESTAMP DEFAULT now(),
                          updated_at TIMESTAMP DEFAULT now(),
                          UNIQUE(instrument_id, vendor_id, external_symbol)
                      );
                      """,
                      
                      # Create indexes if they don't exist
                      """
                      CREATE INDEX IF NOT EXISTS idx_dev_instruments_symbol ON dev_instruments(symbol);
                      CREATE INDEX IF NOT EXISTS idx_dev_instruments_exchange ON dev_instruments(exchange);
                      CREATE INDEX IF NOT EXISTS idx_dev_instruments_active ON dev_instruments(is_active);
                      CREATE INDEX IF NOT EXISTS idx_dev_instruments_quality ON dev_instruments(quality_score);
                      CREATE INDEX IF NOT EXISTS idx_instrument_xrefs_instrument ON instrument_xrefs(instrument_id);
                      CREATE INDEX IF NOT EXISTS idx_instrument_xrefs_vendor ON instrument_xrefs(vendor_id);
                      """
                  ]
                  
                  # Execute migration commands
                  for i, command in enumerate(migration_commands, 1):
                      try:
                          await conn.execute(command)
                          logger.info(f"✅ Migration step {i} completed")
                      except Exception as e:
                          logger.warning(f"⚠️ Migration step {i} failed (might be expected): {e}")
                  
                  # Log migration completion
                  await conn.execute(
                      "INSERT INTO dev_migration_log (migration_name, details) VALUES ($1, $2)",
                      'dev_database_migration_2025', 
                      f'Migration completed at {datetime.now()}'
                  )
                  
                  # Get database statistics
                  tables = await conn.fetch("""
                      SELECT schemaname, tablename, 
                             (SELECT COUNT(*) FROM information_schema.columns 
                              WHERE table_name = tablename AND table_schema = schemaname) as columns
                      FROM pg_tables 
                      WHERE schemaname = 'public' 
                      AND tablename LIKE 'dev_%'
                      ORDER BY tablename
                  """)
                  
                  logger.info("📊 ATS-DEV Database Status:")
                  for table in tables:
                      count = await conn.fetchval(f"SELECT COUNT(*) FROM {table['tablename']}")
                      logger.info(f"  📋 {table['tablename']}: {count:,} rows, {table['columns']} columns")
                  
                  await conn.close()
                  logger.info("🎉 ATS-DEV migration completed successfully!")
                  return True
                  
              except Exception as e:
                  logger.error(f"❌ ATS-DEV migration failed: {e}")
                  return False
          
          if __name__ == "__main__":
              import sys
              success = asyncio.run(run_dev_migration())
              sys.exit(0 if success else 1)
          EOF
          
          mkdir -p /app && cd /app && python migrate_dev.py
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Never