apiVersion: v1
kind: ConfigMap
metadata:
  name: populate-instrument-script
  namespace: ats-dev
# Script extracted to /scripts/populate_instrument.py
# Original ConfigMap data removed for cleanup---
apiVersion: batch/v1
kind: Job
metadata:
  name: populate-instrument-job
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: populate-instrument
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/populate_instrument_job_1.py"