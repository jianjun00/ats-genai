apiVersion: v1
kind: ConfigMap
metadata:
  name: populate-instrument-script
  namespace: ats-dev
data:
  populate_instrument.py: |
    """
    Step 2: Populate instrument data (comprehensive)
    """
    import asyncio
    import asyncpg
    import logging

    async def main():
        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)
        
        db_url = "postgresql://postgres:dev_password@postgres-simple:5432/dev_db"
        
        # Wait for database
        max_retries = 10
        for attempt in range(max_retries):
            try:
                conn = await asyncpg.connect(db_url)
                break
            except Exception as e:
                if attempt < max_retries - 1:
                    await asyncio.sleep(2)
                else:
                    raise
        
        try:
            logger.info("🚀 Step 2: Starting instrument data population...")
            
            # First check current state
            current_state = await conn.fetchrow("""
                SELECT 
                    (SELECT COUNT(*) FROM dev_instruments) as instruments,
                    (SELECT COUNT(*) FROM dev_instrument_xrefs WHERE vendor_id = 3) as ticker_xrefs,
                    (SELECT COUNT(*) FROM dev_daily_prices_polygon) as polygon_prices
            """)
            
            logger.info(f"📊 Current state:")
            logger.info(f"  Instruments: {current_state['instruments']}")
            logger.info(f"  Ticker cross-refs: {current_state['ticker_xrefs']}")
            logger.info(f"  Polygon price records: {current_state['polygon_prices']}")
            
            # Enhanced instrument metadata
            enhanced_instruments = [
                # Mega-cap tech
                (1, 'AAPL', 'Apple Inc.', 'NASDAQ', 'USD', 'Technology'),
                (2, 'MSFT', 'Microsoft Corporation', 'NASDAQ', 'USD', 'Technology'),
                (3, 'SPY', 'SPDR S&P 500 ETF', 'NYSE_ARCA', 'USD', 'ETF'),
                (4, 'QQQ', 'Invesco QQQ Trust', 'NASDAQ', 'USD', 'ETF'),
                (5, 'TSLA', 'Tesla Inc.', 'NASDAQ', 'USD', 'Automotive'),
                
                # Large-cap tech
                (6, 'NVDA', 'NVIDIA Corporation', 'NASDAQ', 'USD', 'Semiconductors'),
                (7, 'META', 'Meta Platforms Inc.', 'NASDAQ', 'USD', 'Technology'),
                (8, 'GOOGL', 'Alphabet Inc. Class A', 'NASDAQ', 'USD', 'Technology'),
                (9, 'AMZN', 'Amazon.com Inc.', 'NASDAQ', 'USD', 'Consumer Discretionary'),
                (10, 'ADBE', 'Adobe Inc.', 'NASDAQ', 'USD', 'Technology'),
                (11, 'CRM', 'Salesforce Inc.', 'NYSE', 'USD', 'Technology'),
                (12, 'AMD', 'Advanced Micro Devices', 'NASDAQ', 'USD', 'Semiconductors'),
                (13, 'INTC', 'Intel Corporation', 'NASDAQ', 'USD', 'Semiconductors'),
                (14, 'CSCO', 'Cisco Systems Inc.', 'NASDAQ', 'USD', 'Technology'),
                (15, 'ORCL', 'Oracle Corporation', 'NYSE', 'USD', 'Technology'),
                
                # Growth/Mid-cap
                (16, 'NFLX', 'Netflix Inc.', 'NASDAQ', 'USD', 'Communication Services'),
                (17, 'UBER', 'Uber Technologies Inc.', 'NYSE', 'USD', 'Technology'),
                (18, 'SNAP', 'Snap Inc.', 'NYSE', 'USD', 'Technology'),
                (19, 'COIN', 'Coinbase Global Inc.', 'NASDAQ', 'USD', 'Financial Services'),
                (20, 'ROKU', 'Roku Inc.', 'NASDAQ', 'USD', 'Technology'),
                (21, 'ZM', 'Zoom Video Communications', 'NASDAQ', 'USD', 'Technology'),
                (22, 'DOCU', 'DocuSign Inc.', 'NASDAQ', 'USD', 'Technology'),
                (23, 'SQ', 'Block Inc.', 'NYSE', 'USD', 'Financial Services'),
                (24, 'SHOP', 'Shopify Inc.', 'NYSE', 'USD', 'Technology'),
                (25, 'TWLO', 'Twilio Inc.', 'NYSE', 'USD', 'Technology'),
                (26, 'OKTA', 'Okta Inc.', 'NASDAQ', 'USD', 'Technology'),
                (27, 'PLTR', 'Palantir Technologies', 'NYSE', 'USD', 'Technology'),
                (28, 'RBLX', 'Roblox Corporation', 'NYSE', 'USD', 'Technology'),
                (29, 'NET', 'Cloudflare Inc.', 'NYSE', 'USD', 'Technology'),
                (30, 'SNOW', 'Snowflake Inc.', 'NYSE', 'USD', 'Technology'),
                (31, 'CRWD', 'CrowdStrike Holdings', 'NASDAQ', 'USD', 'Technology'),
                (32, 'MDB', 'MongoDB Inc.', 'NASDAQ', 'USD', 'Technology'),
                (33, 'DDOG', 'Datadog Inc.', 'NASDAQ', 'USD', 'Technology'),
                (34, 'ZS', 'Zscaler Inc.', 'NASDAQ', 'USD', 'Technology'),
                (35, 'TEAM', 'Atlassian Corporation', 'NASDAQ', 'USD', 'Technology'),
                (36, 'PINS', 'Pinterest Inc.', 'NYSE', 'USD', 'Technology'),
                (37, 'DASH', 'DoorDash Inc.', 'NYSE', 'USD', 'Technology'),
                (38, 'SPOT', 'Spotify Technology S.A.', 'NYSE', 'USD', 'Communication Services'),
                
                # Traditional large-cap
                (39, 'JPM', 'JPMorgan Chase & Co.', 'NYSE', 'USD', 'Financial Services'),
                (40, 'BAC', 'Bank of America Corp.', 'NYSE', 'USD', 'Financial Services'),
                (41, 'WFC', 'Wells Fargo & Company', 'NYSE', 'USD', 'Financial Services'),
                (42, 'XOM', 'Exxon Mobil Corporation', 'NYSE', 'USD', 'Energy'),
                (43, 'CVX', 'Chevron Corporation', 'NYSE', 'USD', 'Energy'),
                (44, 'JNJ', 'Johnson & Johnson', 'NYSE', 'USD', 'Healthcare'),
                (45, 'PFE', 'Pfizer Inc.', 'NYSE', 'USD', 'Healthcare'),
                (46, 'KO', 'The Coca-Cola Company', 'NYSE', 'USD', 'Consumer Staples'),
                (47, 'PEP', 'PepsiCo Inc.', 'NASDAQ', 'USD', 'Consumer Staples'),
                (48, 'WMT', 'Walmart Inc.', 'NYSE', 'USD', 'Consumer Staples'),
                (49, 'HD', 'The Home Depot Inc.', 'NYSE', 'USD', 'Consumer Discretionary'),
                (50, 'MCD', 'McDonald\'s Corporation', 'NYSE', 'USD', 'Consumer Discretionary'),
            ]
            
            logger.info(f"📦 Updating {len(enhanced_instruments)} instruments with comprehensive metadata...")
            
            # Update instruments with enhanced data
            updated_count = 0
            for inst_id, symbol, name, exchange, currency, sector in enhanced_instruments:
                result = await conn.execute("""
                    UPDATE dev_instruments 
                    SET name = $2, exchange = $3, currency = $4, updated_at = NOW()
                    WHERE id = $1;
                """, inst_id, name, exchange, currency)
                
                # Insert if doesn't exist
                if result == 'UPDATE 0':
                    await conn.execute("""
                        INSERT INTO dev_instruments (id, symbol, name, exchange, currency) 
                        VALUES ($1, $2, $3, $4, $5)
                        ON CONFLICT (symbol) DO UPDATE SET
                        name = EXCLUDED.name,
                        exchange = EXCLUDED.exchange,
                        currency = EXCLUDED.currency,
                        updated_at = NOW();
                    """, inst_id, symbol, name, exchange, currency)
                
                updated_count += 1
            
            logger.info(f"✅ Updated {updated_count} instruments with enhanced metadata")
            
            # Ensure all vendor cross-references exist
            logger.info("🔗 Verifying vendor cross-references...")
            
            # Ensure ticker vendor exists
            await conn.execute("""
                INSERT INTO dev_vendors (id, name, description) VALUES 
                (3, 'ticker', 'Standard ticker symbols')
                ON CONFLICT (name) DO NOTHING;
            """)
            
            # Verify cross-references for all instruments
            xref_count = 0
            for inst_id, symbol, _, _, _, _ in enhanced_instruments:
                await conn.execute("""
                    INSERT INTO dev_instrument_xrefs (instrument_id, vendor_id, vendor_symbol) 
                    VALUES ($1, 3, $2)
                    ON CONFLICT (instrument_id, vendor_id) DO NOTHING;
                """, inst_id, symbol)
                xref_count += 1
            
            logger.info(f"✅ Verified {xref_count} ticker cross-references")
            
            # Add additional vendor mappings (e.g., for polygon)
            logger.info("📊 Adding additional vendor mappings...")
            
            # Ensure polygon vendor exists  
            await conn.execute("""
                INSERT INTO dev_vendors (id, name, description) VALUES 
                (1, 'polygon', 'Polygon.io market data')
                ON CONFLICT (name) DO NOTHING;
            """)
            
            # Add polygon vendor mappings (same as ticker for these symbols)
            polygon_xref_count = 0
            for inst_id, symbol, _, _, _, _ in enhanced_instruments:
                await conn.execute("""
                    INSERT INTO dev_instrument_xrefs (instrument_id, vendor_id, vendor_symbol) 
                    VALUES ($1, 1, $2)
                    ON CONFLICT (instrument_id, vendor_id) DO NOTHING;
                """, inst_id, symbol)
                polygon_xref_count += 1
            
            logger.info(f"✅ Added {polygon_xref_count} polygon vendor mappings")
            
            # Final verification
            final_state = await conn.fetchrow("""
                SELECT 
                    (SELECT COUNT(*) FROM dev_instruments WHERE name IS NOT NULL) as instruments_with_names,
                    (SELECT COUNT(*) FROM dev_instrument_xrefs WHERE vendor_id = 3) as ticker_xrefs,
                    (SELECT COUNT(*) FROM dev_instrument_xrefs WHERE vendor_id = 1) as polygon_xrefs,
                    (SELECT COUNT(DISTINCT exchange) FROM dev_instruments WHERE exchange IS NOT NULL) as exchanges,
                    (SELECT COUNT(DISTINCT currency) FROM dev_instruments) as currencies
            """)
            
            logger.info(f"📊 FINAL INSTRUMENT STATE:")
            logger.info(f"  Instruments with names: {final_state['instruments_with_names']}")
            logger.info(f"  Ticker cross-refs: {final_state['ticker_xrefs']}")
            logger.info(f"  Polygon cross-refs: {final_state['polygon_xrefs']}")
            logger.info(f"  Exchanges: {final_state['exchanges']}")
            logger.info(f"  Currencies: {final_state['currencies']}")
            
            # Show sample data
            sample_instruments = await conn.fetch("""
                SELECT i.id, i.symbol, i.name, i.exchange, i.currency,
                       COUNT(xr.id) as xref_count
                FROM dev_instruments i
                LEFT JOIN dev_instrument_xrefs xr ON i.id = xr.instrument_id
                WHERE i.name IS NOT NULL
                GROUP BY i.id, i.symbol, i.name, i.exchange, i.currency
                ORDER BY i.id
                LIMIT 10;
            """)
            
            logger.info(f"\\n📋 SAMPLE INSTRUMENTS:")
            logger.info(f"{'ID':<3} {'Symbol':<6} {'Name':<25} {'Exchange':<10} {'XRefs':<6}")
            logger.info("-" * 55)
            for inst in sample_instruments:
                logger.info(f"{inst['id']:<3} {inst['symbol']:<6} {inst['name'][:24]:<25} {inst['exchange'] or 'N/A':<10} {inst['xref_count']:<6}")
            
            print(f"\\n🎉 STEP 2 COMPLETE: INSTRUMENT DATA POPULATED!")
            print(f"✅ {final_state['instruments_with_names']} instruments with full metadata")
            print(f"✅ {final_state['ticker_xrefs']} ticker cross-references")
            print(f"✅ {final_state['polygon_xrefs']} polygon cross-references")
            print(f"✅ {final_state['exchanges']} exchanges configured")
            print(f"✅ Ready for step 3: populate_daily_prices_polygon")
            
        finally:
            await conn.close()

    if __name__ == "__main__":
        asyncio.run(main())
---
apiVersion: batch/v1
kind: Job
metadata:
  name: populate-instrument-job
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: populate-instrument
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
          - -c
          - |
            echo "📦 Installing dependencies..."
            pip install asyncpg
            
            echo "🚀 Step 2: Populating instrument data..."
            python /scripts/populate_instrument.py
            
            echo "✅ Instrument population completed!"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: populate-instrument-script
      restartPolicy: Never
  backoffLimit: 3