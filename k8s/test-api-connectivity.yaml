apiVersion: batch/v1
kind: Job
metadata:
  name: test-tiingo-fmp-api-connectivity
  namespace: ats-dev
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
      - name: api-test
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "🚀 Installing dependencies..."
          pip install --no-cache-dir aiohttp asyncio requests
          
          echo "🔍 Testing Tiingo and FMP API connectivity..."
          cat > /app/test_apis.py << 'EOF'
          import asyncio
          import aiohttp
          import requests
          import logging
          from datetime import datetime, date, timedelta
          
          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
          logger = logging.getLogger(__name__)
          
          # API Configuration - UPDATED WITH WORKING KEYS
          TIINGO_API_KEY = "5f40b4f36e171405746304ec0e5a6f3aa9ca77e5"
          FMP_API_KEY = "Qf5MGG5HrOnEaWTumhVJzx3Onb3kw7Rr"
          
          async def test_tiingo_api():
              """Test Tiingo API connectivity"""
              logger.info("🔍 Testing Tiingo API...")
              
              url = "https://api.tiingo.com/tiingo/daily/AAPL/prices"
              headers = {
                  'Content-Type': 'application/json',
                  'Authorization': f'Token {TIINGO_API_KEY}'
              }
              params = {
                  'startDate': '2024-01-01',
                  'endDate': '2024-01-05',
                  'format': 'json'
              }
              
              try:
                  async with aiohttp.ClientSession() as session:
                      async with session.get(url, headers=headers, params=params) as response:
                          if response.status == 200:
                              data = await response.json()
                              logger.info(f"✅ Tiingo API SUCCESS - Retrieved {len(data)} records")
                              logger.info(f"📊 Sample data: {data[0] if data else 'No data'}")
                              return True
                          else:
                              error_text = await response.text()
                              logger.error(f"❌ Tiingo API FAILED - Status: {response.status}")
                              logger.error(f"❌ Error: {error_text}")
                              return False
              except Exception as e:
                  logger.error(f"❌ Tiingo API ERROR: {e}")
                  return False
          
          async def test_fmp_api():
              """Test FMP API connectivity"""
              logger.info("🔍 Testing FMP API...")
              
              url = f"https://financialmodelingprep.com/api/v3/historical-price-full/AAPL"
              params = {
                  'apikey': FMP_API_KEY,
                  'from': '2024-01-01',
                  'to': '2024-01-05'
              }
              
              try:
                  async with aiohttp.ClientSession() as session:
                      async with session.get(url, params=params) as response:
                          if response.status == 200:
                              data = await response.json()
                              historical = data.get('historical', [])
                              logger.info(f"✅ FMP API SUCCESS - Retrieved {len(historical)} records")
                              logger.info(f"📊 Sample data: {historical[0] if historical else 'No data'}")
                              return True
                          else:
                              error_text = await response.text()
                              logger.error(f"❌ FMP API FAILED - Status: {response.status}")
                              logger.error(f"❌ Error: {error_text}")
                              return False
              except Exception as e:
                  logger.error(f"❌ FMP API ERROR: {e}")
                  return False
          
          async def main():
              """Test both APIs"""
              logger.info("🚀 TESTING TIINGO AND FMP API CONNECTIVITY")
              logger.info("="*60)
              
              # Test both APIs
              tiingo_result = await test_tiingo_api()
              fmp_result = await test_fmp_api()
              
              logger.info("="*60)
              logger.info("📊 API CONNECTIVITY TEST RESULTS:")
              logger.info(f"  Tiingo: {'✅ WORKING' if tiingo_result else '❌ FAILED'}")
              logger.info(f"  FMP: {'✅ WORKING' if fmp_result else '❌ FAILED'}")
              
              if tiingo_result and fmp_result:
                  logger.info("🎉 Both APIs are working! Ready to add to price population job.")
                  return True
              elif tiingo_result or fmp_result:
                  working = "Tiingo" if tiingo_result else "FMP"
                  logger.info(f"⚠️ Only {working} API is working.")
                  return True
              else:
                  logger.error("❌ Both APIs failed. Check API keys and configurations.")
                  return False
          
          if __name__ == "__main__":
              import sys
              success = asyncio.run(main())
              sys.exit(0 if success else 1)
          EOF
          
          mkdir -p /app
          cd /app
          python test_apis.py
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Never