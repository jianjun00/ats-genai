apiVersion: batch/v1
kind: Job
metadata:
  name: comprehensive-news-backfill
  namespace: ats-dev
  labels:
    app: comprehensive-news-backfill
    component: news-data
    tier: backfill
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: comprehensive-news-backfill
        component: news-data
        tier: backfill
    spec:
      restartPolicy: Never
      containers:
      - name: news-backfill
        image: dragonflyer762/ats-genai:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          pwd
          ls -la
          echo "Searching for Python files..."
          find . -name "*.py" | head -10
          echo "Looking for our backfill script..."
          find . -name "*news*backfill*" -type f
          
          echo "🚀 Starting Comprehensive Multi-Vendor News Backfill"
          echo "📊 Target vendors: Polygon, Tiingo, EODHD"
          echo "⏰ Start time: $(date)"
          
          # Set up environment
          export PYTHONPATH=$(pwd)/src
          export ENVIRONMENT=dev
          export DB_HOST=postgres
          export DB_PORT=5432
          export DB_USER=postgres
          export DB_PASSWORD=dev_password
          export DB_NAME=dev_db
          
          # Start with limited symbols for initial test
          echo "🧪 Running with 10 symbols for initial validation..."
          python3 src/market_data/news/comprehensive_news_backfill.py --limit 10
          
          echo "✅ Comprehensive News Backfill completed at $(date)"
          echo "📈 Check database for results:"
          echo "   SELECT 'polygon' as source, COUNT(*) FROM news_polygon;"
          echo "   SELECT 'tiingo' as source, COUNT(*) FROM news_tiingo;"
          echo "   SELECT 'eodhd' as source, COUNT(*) FROM news_eodhd;"
          
        env:
        # API Keys from secrets
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: POLYGON_API_KEY
        - name: TIINGO_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: TIINGO_API_KEY
        - name: EODHD_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: EODHD_API_KEY
              optional: true
        
        # Database connection
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: ENVIRONMENT
          value: "dev"
        
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        
        # Health check - the job will complete when done
        # No liveness/readiness probes needed for batch jobs
      
      # Node selector for compute-optimized nodes if available
      nodeSelector:
        kubernetes.io/arch: amd64
      
      # Tolerations for dedicated nodes
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "data-processing"
        effect: "NoSchedule"