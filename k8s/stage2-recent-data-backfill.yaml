            pip install psutil asyncpg aiohttp
            
            cp /scripts/slack_alerter.py .
            cp /scripts/recent_backfill_script.py .
            
            python3 recent_backfill_script.py
        env:
        - name: SLACK_WEBHOOK_URL
          value: "https://hooks.slack.com/services/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"
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: POLYGON_API_KEY
        - name: DB_HOST
          value: "postgres-simple.ats-dev.svc.cluster.local"
