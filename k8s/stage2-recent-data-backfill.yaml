    import asyncio
    import json
    import aiohttp
    import os
    import logging
    from datetime import datetime
    from enum import Enum

    class AlertLevel(Enum):
        INFO = "info"
        SUCCESS = "success"
        WARNING = "warning"
        ERROR = "error"
        CRITICAL = "critical"

    class SlackAlerter:
        def __init__(self, webhook_url=None):
            self.webhook_url = webhook_url or os.getenv('SLACK_WEBHOOK_URL')
            self.logger = logging.getLogger(__name__)
            
            if not self.webhook_url:
                self.logger.warning("No Slack webhook URL provided - alerts will be logged only")
        
        def _get_color_for_level(self, level: AlertLevel):
            colors = {
                AlertLevel.INFO: "#36a64f",
                AlertLevel.SUCCESS: "#2eb886",
                AlertLevel.WARNING: "#ff9500",
                AlertLevel.ERROR: "#ff4444",
                AlertLevel.CRITICAL: "#8b0000"
            }
            return colors.get(level, "#36a64f")
        
        def _get_emoji_for_level(self, level: AlertLevel):
            emojis = {
                AlertLevel.INFO: "ℹ️",
                AlertLevel.SUCCESS: "✅",
                AlertLevel.WARNING: "⚠️",
                AlertLevel.ERROR: "❌",
                AlertLevel.CRITICAL: "🚨"
            }
            return emojis.get(level, "ℹ️")
        
        async def send_alert(self, title, message, level=AlertLevel.INFO, fields=None):
            if not self.webhook_url:
                self.logger.info(f"[{level.value.upper()}] {title}: {message}")
                return
            
            emoji = self._get_emoji_for_level(level)
            color = self._get_color_for_level(level)
            
            payload = {
                "username": "Recent Data Backfill Monitor",
                "icon_emoji": ":calendar:",
                "attachments": [
                    {
                        "color": color,
                        "title": f"{emoji} {title}",
                        "text": message,
                        "ts": int(datetime.now().timestamp()),
                        "footer": "ATS Recent Data Backfill (2025 → 2024 → 2023)"
                    }
                ]
            }
            
            if fields:
                payload["attachments"][0]["fields"] = [
                    {"title": k, "value": v, "short": True} for k, v in fields.items()
                ]
            
            try:
                async with aiohttp.ClientSession() as session:
                    async with session.post(self.webhook_url, json=payload) as response:
                        if response.status == 200:
                            self.logger.info(f"Slack alert sent: {title}")
                        else:
                            self.logger.error(f"Failed to send Slack alert: {response.status}")
            except Exception as e:
                self.logger.error(f"Error sending Slack alert: {e}")
        
        async def alert_job_started(self, job_name, stage, instruments_count, year, expected_records):
            await self.send_alert(
                title=f"Recent Data Backfill Started - {year}",
                message=f"🗓️ Starting with {year} data for {instruments_count:,} instruments - most recent and relevant!",
                level=AlertLevel.INFO,
                fields={
                    "Strategy": "Recent First (2025 → 2024 → 2023)",
                    "Current Year": str(year),
                    "Instruments": f"{instruments_count:,}",
                    "Expected Records": f"{expected_records:,}",
                    "Relevance": "Maximum (recent data most valuable)",
                    "Status": "Running"
                }
            )
        
        async def alert_job_completed(self, job_name, stage, duration, records_inserted, year, success_rate):
            await self.send_alert(
                title=f"Recent Data Backfill COMPLETED - {year}",
                message=f"🎉 {year} data collection successful! Recent market data secured for trading algorithms",
                level=AlertLevel.SUCCESS,
                fields={
                    "Year Completed": str(year),
                    "Duration": duration,
                    "Real Records Inserted": f"{records_inserted:,}",
                    "Success Rate": f"{success_rate:.1f}%",
                    "Next": f"Ready for {year-1} data" if year > 2023 else "Recent data collection complete!",
                    "Status": "Success"
                }
            )
        
        async def alert_resource_pressure(self, memory_percent, cpu_percent, action_taken):
            level = AlertLevel.CRITICAL if action_taken == "Emergency stop" else AlertLevel.WARNING
            
            await self.send_alert(
                title="Recent Data Backfill Resource Pressure",
                message=f"System resources under pressure during recent data collection",
                level=level,
                fields={
                    "Memory Usage": f"{memory_percent:.1f}%",
                    "CPU Usage": f"{cpu_percent:.1f}%",
                    "Action Taken": action_taken,
                    "Priority": "Recent data (high value)"
                }
            )
        
        async def alert_batch_progress(self, batch_num, total_batches, year, records_inserted, throughput):
            if batch_num % 3 == 0 or batch_num == total_batches:
                progress_percent = (batch_num / total_batches) * 100
                
                await self.send_alert(
                    title=f"Recent Data Progress - {year}",
                    message=f"Processing {year} data: batch {batch_num}/{total_batches} ({progress_percent:.1f}% complete)",
                    level=AlertLevel.INFO,
                    fields={
                        "Year": str(year),
                        "Batch": f"{batch_num}/{total_batches}",
                        "Progress": f"{progress_percent:.1f}%",
                        "Records": f"{records_inserted:,}",
                        "Throughput": f"{throughput:.1f} records/min"
                    }
                )

  recent_backfill_script.py: |
    #!/usr/bin/env python3
    import time
    import psutil
    import asyncio
    import asyncpg
    import aiohttp
    import os
    from datetime import datetime, date, timedelta
    from slack_alerter import SlackAlerter, AlertLevel

    class Stage2RecentDataBackfill:
        def __init__(self):
            self.memory_threshold = 70
            self.cpu_threshold = 60
            self.alerter = SlackAlerter()
            self.start_time = datetime.now()
            self.polygon_api_key = os.getenv('POLYGON_API_KEY')
            
        def check_resources(self):
            memory = psutil.virtual_memory()
            cpu_percent = psutil.cpu_percent(interval=1)
            
            print(f"Resources - Memory: {memory.percent:.1f}%, CPU: {cpu_percent:.1f}%")
            
            if memory.percent > self.memory_threshold:
                print(f"⚠️  Memory pressure: {memory.percent:.1f}% > {self.memory_threshold}%")
                return False, memory.percent, cpu_percent
                
            if cpu_percent > self.cpu_threshold:
                print(f"⚠️  CPU pressure: {cpu_percent:.1f}% > {self.cpu_threshold}%")
                return False, memory.percent, cpu_percent
            
            return True, memory.percent, cpu_percent
        
        async def get_database_connection(self):
            db_host = "postgres-simple.ats-dev.svc.cluster.local"
            db_port = "5432"
            db_name = "dev_db"
            db_user = "postgres"
            db_password = "dev_password"
            
            connection_string = f"postgresql://{db_user}:{db_password}@{db_host}:{db_port}/{db_name}"
            
            try:
                conn = await asyncpg.connect(connection_string)
                print("✅ Database connection successful")
                return conn
            except Exception as e:
                print(f"❌ Database connection failed: {e}")
                raise
        
        async def get_top_instruments_for_year(self, conn, year, limit=200):
            # Get most actively traded instruments for the specific year
            instruments = await conn.fetch("""
                SELECT i.id, i.symbol 
                FROM dev_instruments i
                JOIN (
                    SELECT instrument_id, SUM(volume) as total_volume
                    FROM dev_daily_prices_polygon 
                    WHERE EXTRACT(year FROM date) = $1
                    GROUP BY instrument_id
                    HAVING SUM(volume) > 10000000  -- 10M+ total volume for the year
                ) p ON i.id = p.instrument_id
                WHERE i.symbol ~ '^[A-Z]{1,5}$'
                ORDER BY p.total_volume DESC
                LIMIT $2
            """, year, limit)
            
            print(f"Selected {len(instruments)} top-volume instruments for {year}")
            return instruments
        
        async def fetch_polygon_minute_data(self, symbol, start_date, end_date):
            if not self.polygon_api_key:
                print(f"❌ No Polygon API key found for {symbol}")
                return []
            
            url = f"https://api.polygon.io/v2/aggs/ticker/{symbol}/range/1/minute/{start_date}/{end_date}"
            params = {
                'adjusted': 'true',
                'sort': 'asc',
                'limit': 50000,
                'apikey': self.polygon_api_key
            }
            
            try:
                async with aiohttp.ClientSession() as session:
                    async with session.get(url, params=params) as response:
                        if response.status == 200:
                            data = await response.json()
                            if data.get('status') == 'OK' and 'results' in data:
                                results = data['results']
                                if results:
                                    print(f"✅ Fetched {len(results)} minute bars for {symbol}")
                                    return results
                                else:
                                    print(f"⚠️  No minute data for {symbol}")
                                    return []
                            else:
                                print(f"⚠️  No data for {symbol}: {data.get('status', 'Unknown')}")
                                return []
                        else:
                            print(f"❌ API error for {symbol}: {response.status}")
                            return []
            except Exception as e:
                print(f"❌ Error fetching {symbol}: {e}")
                return []
        
        async def insert_minute_data(self, conn, instrument_id, symbol, minute_data):
            if not minute_data:
                return 0
            
            records_to_insert = []
            for bar in minute_data:
                dt = datetime.fromtimestamp(bar['t'] / 1000)
                
                record = (
                    instrument_id,
                    dt,
                    float(bar['o']),
                    float(bar['h']),
                    float(bar['l']),
                    float(bar['c']),
                    int(bar['v']),
                    float(bar.get('vw', bar['c'])),
                    int(bar.get('n', 0))
                )
                records_to_insert.append(record)
            
            insert_query = """
                INSERT INTO dev_minute_prices_polygon 
                (instrument_id, timestamp, open_price, high_price, low_price, close_price, volume, vwap, transactions)
                VALUES ($1, $2, $3, $4, $5, $6, $7, $8, $9)
                ON CONFLICT (instrument_id, timestamp) DO NOTHING
            """
            
            try:
                result = await conn.executemany(insert_query, records_to_insert)
                inserted_count = len(records_to_insert)
                print(f"✅ Inserted {inserted_count} minute records for {symbol}")
                return inserted_count
            except Exception as e:
                print(f"❌ Error inserting data for {symbol}: {e}")
                return 0
        
        async def process_year_data(self, conn, year, instruments):
            """Process recent data for a specific year, working month by month"""
            print(f"\n🗓️ Processing {year} data - starting with most recent months")
            
            total_records = 0
            batch_size = 25  # Conservative batch size
            total_batches = (len(instruments) + batch_size - 1) // batch_size
            
            # Start with recent months first (Dec → Nov → Oct, etc.)
            months_to_process = [12, 11, 10, 9, 8]  # Just last 5 months for demo
            
            for month in months_to_process:
                print(f"\n📅 Processing {year}-{month:02d} data...")
                
                # Define date range for this month
                if month == 12:
                    start_date = date(year, month, 1)
                    end_date = date(year, month, 31)
                else:
                    start_date = date(year, month, 1)
                    # Get last day of month
                    if month in [1, 3, 5, 7, 8, 10, 12]:
                        end_date = date(year, month, 31)
                    elif month in [4, 6, 9, 11]:
                        end_date = date(year, month, 30)
                    else:  # February
                        end_date = date(year, month, 29) if year % 4 == 0 else date(year, month, 28)
                
                # Only process if date is not in the future
                if start_date > date.today():
                    print(f"⏭️  Skipping future month {year}-{month:02d}")
                    continue
                
                # Adjust end_date if it's in the future
                if end_date > date.today():
                    end_date = date.today()
                
                print(f"📊 Processing {len(instruments)} instruments for {start_date} to {end_date}")
                
                month_records = 0
                for i in range(0, len(instruments), batch_size):
                    batch_num = i // batch_size + 1
                    batch = instruments[i:i + batch_size]
                    batch_start_time = time.time()
                    
                    print(f"\n=== {year}-{month:02d} Batch {batch_num}/{total_batches} ===")
                    
                    # Resource check
                    resources_ok, memory_pct, cpu_pct = self.check_resources()
                    if not resources_ok:
                        await self.alerter.alert_resource_pressure(
                            memory_pct, cpu_pct, "Backfill paused"
                        )
                        print("❌ Resource pressure - stopping backfill")
                        return total_records
                    
                    batch_records = 0
                    for instrument in batch:
                        instrument_id, symbol = instrument
                        
                        minute_data = await self.fetch_polygon_minute_data(
                            symbol, start_date, end_date
                        )
                        
                        if minute_data:
                            inserted = await self.insert_minute_data(
                                conn, instrument_id, symbol, minute_data
                            )
                            batch_records += inserted
                        
                        await asyncio.sleep(0.3)  # API throttling
                    
                    month_records += batch_records
                    batch_duration = time.time() - batch_start_time
                    throughput = batch_records / (batch_duration / 60) if batch_duration > 0 else 0
                    
                    print(f"✅ {year}-{month:02d} Batch {batch_num} completed - {batch_records} records")
                    
                    # Progress alert every few batches
                    await self.alerter.alert_batch_progress(
                        batch_num=batch_num,
                        total_batches=total_batches,
                        year=year,
                        records_inserted=batch_records,
                        throughput=throughput
                    )
                    
                    await asyncio.sleep(5)  # Cool down between batches
                
                total_records += month_records
                print(f"✅ {year}-{month:02d} completed: {month_records:,} records added")
                
                # Don't overwhelm - just do 2 months for demo
                if month <= 11:
                    break
            
            return total_records
        
        async def run_recent_data_backfill(self):
            job_name = "stage2-recent-data-backfill"
            stage = "Stage 2 Recent Data"
            
            print("=== STAGE 2: RECENT DATA BACKFILL (2025 → 2024 → 2023) ===")
            print("🗓️ Starting with most recent and relevant data!")
            
            try:
                conn = await self.get_database_connection()
                
                # Process years in reverse chronological order (most recent first)
                years_to_process = [2025, 2024]  # Start with just 2 years for demo
                total_all_records = 0
                
                for year in years_to_process:
                    print(f"\n🎯 === PROCESSING YEAR {year} ===")
                    
                    instruments = await self.get_top_instruments_for_year(conn, year, limit=100)
                    
                    if not instruments:
                        print(f"⚠️  No instruments found for {year}")
                        continue
                    
                    expected_records = len(instruments) * 2 * 20 * 390  # 2 months * 20 days * 390 minutes
                    
                    await self.alerter.alert_job_started(
                        job_name=job_name,
                        stage=stage,
                        instruments_count=len(instruments),
                        year=year,
                        expected_records=expected_records
                    )
                    
                    year_records = await self.process_year_data(conn, year, instruments)
                    total_all_records += year_records
                    
                    duration = str(datetime.now() - self.start_time).split('.')[0]
                    success_rate = 100.0 if year_records > 0 else 0.0
                    
                    await self.alerter.alert_job_completed(
                        job_name=job_name,
                        stage=stage,
                        duration=duration,
                        records_inserted=year_records,
                        year=year,
                        success_rate=success_rate
                    )
                    
                    print(f"✅ {year} data collection complete: {year_records:,} records")
                
                await conn.close()
                
                print("\n=== RECENT DATA BACKFILL COMPLETED ===")
                print(f"🎉 Total records across all years: {total_all_records:,}")
                print("🗓️ Recent data prioritized - most relevant for trading!")
                
                return True
                
            except Exception as e:
                error_msg = str(e)
                print(f"❌ Recent data backfill failed: {error_msg}")
                
                await self.alerter.send_alert(
                    title="Recent Data Backfill Failed",
                    message=f"Job failed with error: {error_msg}",
                    level=AlertLevel.ERROR
                )
                
                return False
    
    async def main():
        print("Installing required packages...")
        import subprocess
        subprocess.run(["pip", "install", "aiohttp"], check=True)
        
        backfiller = Stage2RecentDataBackfill()
        success = await backfiller.run_recent_data_backfill()
        
        if success:
            print("\n🎉 RECENT DATA BACKFILL SUCCESS!")
            print("Recent market data secured for algorithmic trading!")
        else:
            print("\n❌ RECENT DATA BACKFILL FAILED")
    
    if __name__ == "__main__":
        asyncio.run(main())

