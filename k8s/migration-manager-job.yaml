apiVersion: batch/v1
kind: Job
metadata:
  name: migration-manager-dev
  namespace: ats-dev
spec:
  backoffLimit: 2
  template:
    spec:
      containers:
      - name: migration-manager
        image: dragonflyer762/ats-genai:latest
        command: ["/bin/bash"]
        args:
        - -c
        - |
          export DB_DISABLE_CONNECT_TIMEOUT=true
          export PYTHONPATH=/workspace/src
          
          echo "🚀 Running migration manager for dev_db..."
          echo "📂 Current working directory: $(pwd)"
          echo "📂 Contents: $(ls -la)"
          echo "📂 Finding Python files..."
          find / -name "migration_manager.py" 2>/dev/null | head -5
          echo "📂 Looking for installed packages..."
          pip list | grep -i db
          echo "📂 Python path..."
          python3 -c "import sys; print('\\n'.join(sys.path))"
          
          echo "🔧 Installing package from workspace..."
          pip install -e . || echo "No setup.py found"
          
          echo "🔍 Trying to import db module..."
          python3 -c "
          import asyncio
          import sys
          try:
              from db.migration_manager import MigrationManager
              print('✅ Successfully imported MigrationManager')
          except ImportError as e:
              print(f'❌ Import failed: {e}')
              sys.exit(1)

          async def run_migration():
              db_url = 'postgresql://postgres:dev_password@postgres:5432/dev_db'
              manager = MigrationManager(db_url=db_url)
              
              print('📋 Getting current database version...')
              current_version = await manager.get_current_version()
              print(f'Current database version: {current_version}')
              
              print('🔄 Applying pending migrations...')
              success = await manager.migrate_to_latest()
              
              if success:
                  print('✅ Migration completed successfully!')
                  final_version = await manager.get_current_version()
                  print(f'Final database version: {final_version}')
              else:
                  print('❌ Migration failed!')
              return success

          if __name__ == '__main__':
              result = asyncio.run(run_migration())
              sys.exit(0 if result else 1)
          "
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        env:
        - name: DB_DISABLE_CONNECT_TIMEOUT
          value: "true"
      restartPolicy: Never