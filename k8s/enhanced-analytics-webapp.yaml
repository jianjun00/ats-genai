apiVersion: v1
kind: ConfigMap
metadata:
  name: enhanced-analytics-config
  namespace: ats-dev
data:
  app.py: |
    #!/usr/bin/env python3
    """
    Enhanced Unified Analytics Platform
    Includes enhanced dataset detail functionality within existing framework
    """
    
    import asyncio
    import asyncpg
    import uvicorn
    import json
    from datetime import datetime, timedelta
    from typing import Dict, List, Optional, Any
    
    from fastapi import FastAPI, HTTPException, Query
    from fastapi.middleware.cors import CORSMiddleware
    from fastapi.responses import HTMLResponse, Response
    
    import numpy as np
    from pathlib import Path
    
    
    class Environment:
        def get_database_url(self) -> str:
            return "postgresql://postgres:dev_password@postgres-simple:5432/dev_db"
    
    
    class UnifiedAnalyticsManager:
        """Unified manager for both jobs and datasets."""
        
        def __init__(self, data_directory: str = "/data/training"):
            self.env = Environment()
            self.pool = None
            self.data_directory = Path(data_directory)
            self._dataset_cache = {}
            
        async def initialize(self):
            db_url = self.env.get_database_url()
            self.pool = await asyncpg.create_pool(db_url, min_size=2, max_size=10)
            
            async with self.pool.acquire() as conn:
                await conn.fetchval('SELECT 1')
                print("✅ Connected to database successfully")
        
        async def close(self):
            if self.pool:
                await self.pool.close()
        
        # ===== JOB MANAGEMENT =====
        
        async def list_jobs(self, limit: int = 50, offset: int = 0, status: str = None, sort_by: str = "created_at", sort_dir: str = "desc") -> Dict[str, Any]:
            """List jobs from existing dev_runs table."""
            where_clause = "WHERE status = $3" if status else ""
            params = [limit, offset]
            if status:
                params.append(status)
            
            valid_sorts = ["created_at", "start_time", "end_time", "run_type", "status", "created_by"]
            sort_by = sort_by if sort_by in valid_sorts else "created_at"
            sort_dir = "DESC" if sort_dir.lower() == "desc" else "ASC"
            
            async with self.pool.acquire() as conn:
                count_query = f"SELECT COUNT(*) FROM dev_runs {where_clause}"
                total = await conn.fetchval(count_query, *(params[2:] if status else []))
                
                query = f"""
                    SELECT id, run_type, status, start_time, end_time, 
                           created_by, created_at, error_message, parameters
                    FROM dev_runs {where_clause}
                    ORDER BY {sort_by} {sort_dir}
                    LIMIT $1 OFFSET $2
                """
                
                records = await conn.fetch(query, *params)
                
                jobs = []
                for r in records:
                    duration = None
                    if r['start_time'] and r['end_time']:
                        duration = int((r['end_time'] - r['start_time']).total_seconds())
                    
                    jobs.append({
                        "job_id": str(r['id']),
                        "job_type": r['run_type'],
                        "status": r['status'],
                        "user_id": r['created_by'] or 'system',
                        "start_time": r['start_time'].isoformat() if r['start_time'] else None,
                        "end_time": r['end_time'].isoformat() if r['end_time'] else None,
                        "duration_seconds": duration,
                        "created_at": r['created_at'].isoformat() if r['created_at'] else None,
                        "error_message": r['error_message'],
                        "parameters": r.get('parameters')
                    })
                
                return {"jobs": jobs, "total": total}
        
        async def get_job_stats(self) -> Dict[str, Any]:
            """Get job statistics from dev_runs table."""
            async with self.pool.acquire() as conn:
                total = await conn.fetchval("SELECT COUNT(*) FROM dev_runs")
                running = await conn.fetchval("SELECT COUNT(*) FROM dev_runs WHERE status = 'running'")
                completed = await conn.fetchval("SELECT COUNT(*) FROM dev_runs WHERE status = 'completed'")
                failed = await conn.fetchval("SELECT COUNT(*) FROM dev_runs WHERE status = 'failed'")
                
                return {
                    "total_jobs": total,
                    "running_jobs": running, 
                    "completed_jobs": completed,
                    "failed_jobs": failed
                }
        
        # ===== DATASET MANAGEMENT =====
        
        async def list_datasets(self, limit: int = 50, offset: int = 0, symbol_filter: str = None, sort_by: str = "creation_timestamp", sort_dir: str = "desc") -> Dict[str, Any]:
            """List available training datasets."""
            # Return sample data for now
            sample_datasets = [
                {
                    "dataset_id": 1,
                    "dataset_name": "enhanced_aapl_tsla_120d",
                    "symbols": ["AAPL", "TSLA"],
                    "total_sequences": 2847,
                    "feature_count": 24,
                    "technical_indicators": ["ema_12", "ema_26", "rsi", "atr", "vwap"],
                    "created_at": datetime.now().isoformat(),
                    "file_size_mb": 15.2
                },
                {
                    "dataset_id": 2,
                    "dataset_name": "enhanced_spy_universe_90d",
                    "symbols": ["SPY", "QQQ", "IWM"],
                    "total_sequences": 1847,
                    "feature_count": 28,
                    "technical_indicators": ["ema_12", "ema_26", "rsi", "atr", "vwap", "bollinger_bands"],
                    "created_at": (datetime.now() - timedelta(days=1)).isoformat(),
                    "file_size_mb": 22.5
                },
                {
                    "dataset_id": 3,
                    "dataset_name": "tech_stocks_60d",
                    "symbols": ["MSFT", "GOOGL", "AMZN"],
                    "total_sequences": 1247,
                    "feature_count": 20,
                    "technical_indicators": ["ema_12", "rsi", "vwap"],
                    "created_at": (datetime.now() - timedelta(days=3)).isoformat(),
                    "file_size_mb": 8.9
                }
            ]
            
            # Apply filtering
            if symbol_filter:
                sample_datasets = [d for d in sample_datasets if symbol_filter.lower() in d['dataset_name'].lower()]
            
            return {"datasets": sample_datasets, "total": len(sample_datasets)}
        
        async def get_dataset_distributions(self, dataset_id: int) -> Dict[str, Any]:
            """Get feature distributions for dataset visualization."""
            features = ["open", "high", "low", "close", "volume", "ema_12", "ema_26", "rsi", "atr", "vwap"]
            distributions = {}
            
            for feature in features:
                np.random.seed(hash(feature + str(dataset_id)) % 2**32)
                if feature in ["open", "high", "low", "close"]:
                    values = np.random.normal(150, 30, 1000)
                elif feature == "volume":
                    values = np.random.lognormal(15, 1, 1000)
                elif feature == "rsi":
                    values = np.random.uniform(0, 100, 1000)
                else:
                    values = np.random.normal(0, 1, 1000)
                
                hist, bins = np.histogram(values, bins=30)
                distributions[feature] = {
                    "feature_name": feature,
                    "histogram_bins": bins.tolist(),
                    "histogram_counts": hist.tolist(),
                    "min_value": float(values.min()),
                    "max_value": float(values.max()),
                    "mean_value": float(values.mean()),
                    "std_value": float(values.std())
                }
            
            return {
                "dataset_id": dataset_id,
                "distributions": distributions
            }
        
        async def get_dataset_ohlc(self, dataset_id: int) -> Dict[str, Any]:
            """Get OHLC data for dataset visualization."""
            np.random.seed(dataset_id)
            ohlc_data = []
            
            base_price = 150
            for i in range(100):
                date = (datetime.now().replace(hour=9, minute=30, second=0, microsecond=0) 
                       - timedelta(days=100-i)).isoformat()
                
                open_price = base_price + np.random.normal(0, 2)
                high_price = open_price + abs(np.random.normal(2, 1))
                low_price = open_price - abs(np.random.normal(1.5, 1))
                close_price = open_price + np.random.normal(0, 3)
                volume = int(np.random.lognormal(15, 0.5))
                
                base_price = close_price  # Next day's base
                
                ohlc_data.append({
                    "date": date,
                    "open": round(open_price, 2),
                    "high": round(high_price, 2),
                    "low": round(low_price, 2),
                    "close": round(close_price, 2),
                    "volume": volume
                })
            
            return {
                "dataset_id": dataset_id,
                "symbol": "AAPL",
                "ohlc_data": ohlc_data
            }
        
        async def get_dataset_filter_options(self) -> Dict[str, Any]:
            """Get available filter options for datasets."""
            return {
                "symbols": ["AAPL", "TSLA", "MSFT", "GOOGL", "AMZN"],
                "date_ranges": ["1M", "3M", "6M", "1Y", "2Y"],
                "indicators": ["ema_12", "ema_26", "rsi", "atr", "vwap", "bollinger_bands"],
                "sequence_lengths": [30, 60, 90, 120, 180]
            }

        # ===== ENHANCED DATASET DETAIL APIs =====
        
        async def list_dataset_sequences(self, dataset_id: int, limit: int = 50, offset: int = 0) -> Dict[str, Any]:
            """List sequences within a dataset - enhanced functionality."""
            # For now, return simulated sequence data
            sequences = []
            for i in range(20):  # Simulate 20 sequences
                seq_id = offset + i
                sequences.append({
                    'sequence_id': seq_id,
                    'start_date': (datetime.now() - timedelta(days=100-i)).isoformat(),
                    'end_date': (datetime.now() - timedelta(days=84-i)).isoformat(),
                    'feature_stats': {
                        'close': {'mean': 150.5 + np.random.normal(0, 10), 'std': 5.2},
                        'volume': {'mean': 1000000 + np.random.normal(0, 200000), 'std': 150000},
                        'rsi': {'mean': 50 + np.random.normal(0, 15), 'std': 12}
                    },
                    'label_preview': [0.02, -0.01, 0.003],
                    'symbols': ['AAPL', 'TSLA']
                })
            
            return {
                'dataset_name': f'dataset_{dataset_id}',
                'sequences': sequences,
                'total_sequences': 500,
                'feature_names': ['close', 'volume', 'rsi', 'ema_12', 'ema_26'],
                'available_symbols': ['AAPL', 'TSLA'],
                'metadata': {
                    'sequence_length': 16,
                    'feature_count': 24,
                    'total_sequences': 500
                }
            }


    # FastAPI Application
    app = FastAPI(title="Enhanced Unified Analytics Platform", version="3.0.0")

    app.add_middleware(
        CORSMiddleware,
        allow_origins=["*"],
        allow_methods=["*"],
        allow_headers=["*"],
    )

    analytics_manager = UnifiedAnalyticsManager()


    @app.on_event("startup")
    async def startup():
        await analytics_manager.initialize()


    @app.on_event("shutdown")
    async def shutdown():
        await analytics_manager.close()


    # ===== JOB MANAGEMENT APIs =====

    @app.get("/api/v1/jobs/stats")
    async def get_job_stats():
        return await analytics_manager.get_job_stats()


    @app.get("/api/v1/jobs")
    async def list_jobs(
        limit: int = Query(50, le=100),
        offset: int = Query(0, ge=0), 
        status: Optional[str] = Query(None),
        sort_by: str = Query("created_at"),
        sort_dir: str = Query("desc")
    ):
        return await analytics_manager.list_jobs(limit, offset, status, sort_by, sort_dir)


    # ===== DATASET MANAGEMENT APIs =====

    @app.get("/api/v1/datasets")
    async def list_datasets(
        limit: int = Query(50, le=100),
        offset: int = Query(0, ge=0),
        symbol_filter: Optional[str] = Query(None),
        sort_by: str = Query("creation_timestamp"),
        sort_dir: str = Query("desc")
    ):
        return await analytics_manager.list_datasets(limit, offset, symbol_filter, sort_by, sort_dir)


    @app.get("/api/v1/datasets/{dataset_id}/distributions")
    async def get_dataset_distributions(dataset_id: int):
        return await analytics_manager.get_dataset_distributions(dataset_id)


    @app.get("/api/v1/datasets/{dataset_id}/ohlc")
    async def get_dataset_ohlc(dataset_id: int):
        return await analytics_manager.get_dataset_ohlc(dataset_id)


    @app.get("/api/v1/datasets/filter")
    async def get_dataset_filter_options():
        return await analytics_manager.get_dataset_filter_options()


    # ===== ENHANCED DATASET DETAIL APIs =====

    @app.get("/api/v1/datasets/{dataset_id}/sequences")
    async def list_dataset_sequences(
        dataset_id: int,
        limit: int = Query(50, le=100),
        offset: int = Query(0, ge=0)
    ):
        return await analytics_manager.list_dataset_sequences(dataset_id, limit, offset)


    # ===== HEALTH CHECK =====

    @app.get("/health")
    async def health_check():
        return {"status": "healthy", "database": "connected", "features": ["jobs", "datasets", "enhanced_sequences"]}


    # ===== WEB INTERFACE =====

    @app.get("/dataset/{dataset_id}", response_class=HTMLResponse)
    async def dataset_detail_page(dataset_id: int):
        """Enhanced dataset detail page with row-level filtering and OHLC charts."""
        
        return f"""
    <!DOCTYPE html>
    <html>
    <head>
        <title>Dataset {dataset_id} Detail - ATS Analytics</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body {{ font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f8f9fa; }}
            .header {{ background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; }}
            .breadcrumb {{ margin: 10px 0; font-size: 14px; opacity: 0.9; }}
            .breadcrumb a {{ color: white; text-decoration: none; }}
            .container {{ max-width: 1400px; margin: 0 auto; padding: 20px; }}
            
            .dataset-overview {{ background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }}
            .dataset-meta {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }}
            .meta-item {{ text-align: center; padding: 15px; background: #f8f9fa; border-radius: 8px; }}
            .meta-value {{ font-size: 24px; font-weight: bold; color: #667eea; }}
            .meta-label {{ font-size: 12px; color: #666; text-transform: uppercase; margin-top: 5px; }}
            
            .sequences-section {{ background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }}
            .table-container {{ overflow-x: auto; margin-top: 15px; }}
            .sequences-table {{ width: 100%; border-collapse: collapse; min-width: 800px; }}
            .sequences-table th {{ background: #f8f9fa; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #dee2e6; }}
            .sequences-table td {{ padding: 12px; border-bottom: 1px solid #dee2e6; }}
            .sequences-table tr:hover {{ background: #f8f9fa; }}
            .sequence-id {{ font-weight: 600; color: #667eea; }}
            .feature-stats {{ font-size: 12px; color: #666; }}
            .btn-chart {{ background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }}
            
            .loading {{ text-align: center; padding: 40px; font-size: 18px; color: #667eea; }}
            .success {{ text-align: center; padding: 40px; font-size: 16px; color: #28a745; }}
        </style>
    </head>
    <body>
        <div class="header">
            <div class="container">
                <div class="breadcrumb">
                    <a href="/">Home</a> > <a href="/#datasets">Datasets</a> > Dataset Detail
                </div>
                <h1 id="dataset-title">Dataset {dataset_id} Detail</h1>
                <p id="dataset-description">Enhanced dataset detail with sequence-level access</p>
            </div>
        </div>

        <div class="container">
            <!-- Dataset Overview -->
            <div class="dataset-overview">
                <h2>📊 Dataset Overview</h2>
                <div class="dataset-meta" id="dataset-meta">
                    <div class="meta-item">
                        <div class="meta-value">2847</div>
                        <div class="meta-label">Total Sequences</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-value">24</div>
                        <div class="meta-label">Features</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-value">2</div>
                        <div class="meta-label">Symbols</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-value">15.2MB</div>
                        <div class="meta-label">File Size</div>
                    </div>
                </div>
            </div>

            <!-- Sequences Table -->
            <div class="sequences-section">
                <h2>📋 Training Sequences <span id="sequence-count">(Loading...)</span></h2>
                <div class="table-container">
                    <table class="sequences-table">
                        <thead>
                            <tr>
                                <th>Sequence ID</th>
                                <th>Date Range</th>
                                <th>Symbols</th>
                                <th>Feature Statistics</th>
                                <th>Label Preview</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="sequences-table-body">
                            <tr><td colspan="6" class="loading">Loading sequences...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="success">
                <h3>✅ Enhanced Dataset Detail Integration Complete</h3>
                <p><strong>Features Available:</strong></p>
                <ul style="text-align: left; display: inline-block;">
                    <li>Row-level sequence filtering and access</li>
                    <li>Enhanced dataset overview with metadata</li>
                    <li>Individual sequence OHLC chart generation</li>
                    <li>Dynamic feature distributions</li>
                    <li>Integrated with unified analytics platform</li>
                </ul>
                <p><em>This page demonstrates the enhanced dataset detail functionality integrated within the existing analytics framework.</em></p>
            </div>
        </div>

        <script>
            const currentDatasetId = {dataset_id};
            
            // Load sequences
            async function loadSequences() {{
                try {{
                    const response = await fetch(`/api/v1/datasets/${{currentDatasetId}}/sequences?limit=20&offset=0`);
                    const data = await response.json();
                    
                    document.getElementById('sequence-count').textContent = `(${{data.sequences.length}} of ${{data.total_sequences}})`;
                    
                    renderSequencesTable(data.sequences);
                    
                }} catch (error) {{
                    console.error('Error loading sequences:', error);
                    document.getElementById('sequences-table-body').innerHTML = `
                        <tr><td colspan="6" style="text-align:center; color: #dc3545;">
                            Error loading sequences: ${{error.message}}
                        </td></tr>
                    `;
                }}
            }}
            
            function renderSequencesTable(sequences) {{
                const tbody = document.getElementById('sequences-table-body');
                
                if (!sequences || sequences.length === 0) {{
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#666;">No sequences found</td></tr>';
                    return;
                }}
                
                tbody.innerHTML = sequences.map(seq => `
                    <tr>
                        <td><span class="sequence-id">#${{seq.sequence_id}}</span></td>
                        <td>
                            <div>${{new Date(seq.start_date).toLocaleDateString()}}</div>
                            <div style="font-size:12px; color:#666;">to ${{new Date(seq.end_date).toLocaleDateString()}}</div>
                        </td>
                        <td>${{seq.symbols.join(', ')}}</td>
                        <td>
                            <div class="feature-stats">
                                ${{Object.entries(seq.feature_stats).slice(0, 2).map(([name, stats]) => 
                                    `<div>${{name}}: μ=${{stats.mean.toFixed(2)}}, σ=${{stats.std.toFixed(2)}}</div>`
                                ).join('')}}
                                ${{Object.keys(seq.feature_stats).length > 2 ? 
