apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-webapp-script
  namespace: ats-dev
data:
  run_webapp.py: |
    #!/usr/bin/env python3
    """Enhanced Analytics Webapp for Kubernetes"""
    import os
    import sys
    sys.path.insert(0, '/workspace/src')
    
    # Import and run the webapp
    from unified_backtest_analytics_webapp import main
    
    if __name__ == "__main__":
        main()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-webapp
  namespace: ats-dev
  labels:
    app: analytics-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-webapp
  template:
    metadata:
      labels:
        app: analytics-webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        ports:
        - containerPort: 3000
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "🚀 Starting Enhanced Analytics Webapp..."
          echo "📁 Setting up workspace..."
          cp -r /workspace/* /app/ 2>/dev/null || true
          cp /config/run_webapp.py /app/
          cd /app
          echo "🌐 Starting webapp server..."
          python run_webapp.py
        volumeMounts:
        - name: config-volume
          mountPath: /config
        - name: workspace-volume
          mountPath: /workspace
        - name: training-data-volume
          mountPath: /app/training_data_output
        env:
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config-volume
        configMap:
          name: analytics-webapp-config
          defaultMode: 0755
      - name: training-data-volume
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: analytics-webapp-service
  namespace: ats-dev
spec:
  selector:
    app: analytics-webapp
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
  type: NodePort