        </div>

        <script>
            let currentTab = 'jobs';
            
            function showTab(tabName) {
                // Hide all tabs
                document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
                document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
                
                // Show selected tab
                document.getElementById(tabName + '-tab').classList.add('active');
                document.getElementById(tabName + '-tab-btn').classList.add('active');
                
                currentTab = tabName;
                
                // Load data for the selected tab
                if (tabName === 'jobs') {
                    loadJobs();
                } else if (tabName === 'datasets') {
                    loadDatasets();
                }
            }
            
            async function loadJobs() {
                try {
                    const stats = await fetch('/api/v1/jobs/stats').then(r => r.json());
                    const jobs = await fetch('/api/v1/jobs?limit=10').then(r => r.json());
                    
                    // Update stats
                    document.getElementById('job-stats').innerHTML = `
                        <div class="stat-card">
                            <div class="stat-number">${stats.total_jobs}</div>
                            <div>Total Jobs</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.running_jobs}</div>
                            <div>Running</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.completed_jobs}</div>
                            <div>Completed</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.failed_jobs}</div>
                            <div>Failed</div>
                        </div>
                    `;
                    
                    // Update job list
                    const jobsList = document.getElementById('jobs-list');
                    jobsList.innerHTML = jobs.jobs.map(j => `
                        <div class="job">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <strong>Job ${j.job_id}</strong> - ${j.job_type}
                                    <div style="font-size: 0.9em; color: #666;">
                                        Created: ${j.created_at ? new Date(j.created_at).toLocaleString() : 'N/A'}
                                        ${j.user_id ? ` by ${j.user_id}` : ''}
                                    </div>
                                </div>
                                <span class="status ${j.status}">${j.status}</span>
                            </div>
                            ${j.error_message ? `<div style="color: #dc3545; font-size: 0.9em; margin-top: 10px;">${j.error_message}</div>` : ''}
                        </div>
                    `).join('');
                    
                } catch (error) {
                    document.getElementById('jobs-list').innerHTML = `<div style="color: red;">Error loading jobs: ${error.message}</div>`;
                }
            }
            
            async function loadDatasets() {
                try {
                    const filters = await fetch('/api/v1/datasets/filter').then(r => r.json());
                    const datasets = await fetch('/api/v1/datasets').then(r => r.json());
                    
                    // Update stats
                    document.getElementById('dataset-stats').innerHTML = `
                        <div class="stat-card">
                            <div class="stat-number">${datasets.total}</div>
                            <div>Total Datasets</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${filters.symbols.length}</div>
                            <div>Available Symbols</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${filters.indicators.length}</div>
                            <div>Technical Indicators</div>
                        </div>
                    `;
                    
                    // Update dataset list
                    const datasetsList = document.getElementById('datasets-list');
                    datasetsList.innerHTML = datasets.datasets.map(d => `
                        <div class="dataset">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <strong>${d.dataset_name}</strong>
                                    <div style="font-size: 0.9em; color: #666;">
                                        ${d.symbols.join(', ')} | ${d.total_sequences} sequences | ${d.feature_count} features
                                    </div>
                                    <div style="font-size: 0.8em; color: #888;">
                                        ${d.technical_indicators.join(', ')}
                                    </div>
                                </div>
                                <div>
                                    <a href="/dataset/${d.dataset_id}" style="background: #28a745; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; margin: 2px;">🔍 Enhanced Detail</a>
                                </div>
                            </div>
                        </div>
                    `).join('');
                    
                } catch (error) {
                    document.getElementById('datasets-list').innerHTML = `<div style="color: red;">Error loading datasets: ${error.message}</div>`;
                }
            }
            
            // Load initial data
            loadJobs();
        </script>
    </body>
    </html>
        """


    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=3000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-analytics-webapp
  namespace: ats-dev
  labels:
    app: enhanced-analytics-webapp
    component: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhanced-analytics-webapp
  template:
    metadata:
      labels:
        app: enhanced-analytics-webapp
        component: webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        ports:
        - containerPort: 3000
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Installing dependencies..."
          pip install --no-cache-dir fastapi==0.104.1 uvicorn[standard]==0.24.0 asyncpg==0.29.0 pydantic==2.5.0 numpy
          
          echo "📂 Setting up application..."
          cp /config/app.py /app.py
          
          echo "🌟 Starting Enhanced Analytics Application..."
          python /app.py
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        volumeMounts:
        - name: webapp-config
          mountPath: /config
        - name: training-data
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: webapp-config
        configMap:
          name: enhanced-analytics-config
      - name: training-data
        persistentVolumeClaim:
          claimName: data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: enhanced-analytics-service
  namespace: ats-dev
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30004
  selector:
    app: enhanced-analytics-webapp