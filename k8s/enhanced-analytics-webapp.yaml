        </style>
    </head>
    <body>
        <div class="header">
            <h1>🚀 Enhanced Unified Analytics Platform</h1>
            <p>Job Management + Enhanced Dataset Visualization - Fully Integrated</p>
        </div>
        
        <div class="success-notice">
            <strong>✅ ENHANCED FEATURES DEPLOYED:</strong>
            <br>• Job Management: Full functionality with dev_runs integration
            <br>• Dataset Visualization: Enhanced with sequence-level access and OHLC charts
            <br>• Dataset Detail Pages: Row-level filtering, individual sequence analysis
            <br>• All features integrated within single unified platform
        </div>
        
        <div class="nav">
            <button id="jobs-tab-btn" class="active" onclick="showTab('jobs')">📊 Job Management</button>
            <button id="datasets-tab-btn" onclick="showTab('datasets')">📈 Dataset Visualization</button>
