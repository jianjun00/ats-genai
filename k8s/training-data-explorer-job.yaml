apiVersion: batch/v1
kind: Job
metadata:
  name: training-data-explorer
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: explorer
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "🔍 Exploring /data/training directory..."
          ls -la /data/training/
          echo "📂 All training files:"
          find /data/training -type f | head -20
          echo "📊 File breakdown:"
          echo "  Training .npy files:"
          find /data/training -name "*.npy" | head -10
          echo "  Training .json files:"
          find /data/training -name "*.json" | head -10
          echo "💾 Directory sizes:"
          du -sh /data/training/*
          echo "🗂️ Training subdirectories:"
          find /data/training -type d | head -10
        volumeMounts:
        - name: data-volume
          mountPath: /data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: data-pvc
      restartPolicy: Never
  backoffLimit: 1