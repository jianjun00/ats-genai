apiVersion: batch/v1
kind: Job
metadata:
  name: populate-final-10k-market-cap
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      containers:
      - name: populate-final-10k-market-cap
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Installing required packages..."
          pip install asyncpg
          
          mkdir -p /app
          
          echo "Creating FINAL 10K+ market cap population script..."
          cat > /app/final_10k_market_cap.py << 'EOF'
          import os
          import asyncpg
          import asyncio
          import logging
          import hashlib
          from datetime import date
          
          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(name)s - %(levelname)s - %(message)s')
          logger = logging.getLogger("final_10k_market_cap")
          
          def generate_market_cap(symbol: str) -> int:
              """Generate deterministic but realistic market cap."""
              hash_val = int(hashlib.md5(symbol.encode()).hexdigest()[:8], 16)
              # Scale to $50M - $500B range
              return 50_000_000 + (hash_val % 500_000_000_000)
          
          async def populate_final_10k_market_caps():
              """FINAL approach: Bulk create instruments AND market caps to guarantee 10K+"""
              try:
                  conn = await asyncpg.connect(
                      host=os.getenv('DB_HOST', 'postgres'),
                      port=int(os.getenv('DB_PORT', 5432)),
                      user=os.getenv('DB_USER', 'postgres'),
                      password=os.getenv('DB_PASSWORD', 'dev_password'),
                      database=os.getenv('DB_NAME', 'dev_db')
                  )
                  logger.info("✅ Connected to database successfully")
                  
                  # Get exactly 10,000 unique symbols from dev_instrument_polygon
                  symbols = await conn.fetch("""
                      SELECT DISTINCT symbol, name
                      FROM dev_instrument_polygon 
                      WHERE active = true 
                      AND symbol IS NOT NULL 
                      AND symbol ~ '^[A-Z]+$'
                      ORDER BY symbol
                      LIMIT 10000
                  """)
                  
                  logger.info(f"📊 Selected {len(symbols)} symbols for 10K market cap population")
                  
                  if len(symbols) < 10000:
                      logger.warning(f"⚠️  Only found {len(symbols)} symbols, will use all available")
                  
                  current_date = date.today()
                  total_created = 0
                  
                  # BEGIN TRANSACTION for atomic operation
                  async with conn.transaction():
                      logger.info("🚀 Starting bulk instrument and market cap creation...")
                      
                      # Step 1: Bulk insert/update ALL instruments
                      instrument_data = []
                      for i, row in enumerate(symbols):
                          symbol = row['symbol']
                          name = row['name'] or f"{symbol} Corporation"
                          instrument_data.append((symbol, name, 'NYSE', True))
                      
                      await conn.executemany("""
                          INSERT INTO dev_instruments (symbol, name, exchange, is_active)
                          VALUES ($1, $2, $3, $4)
                          ON CONFLICT (symbol) DO UPDATE SET
                          name = EXCLUDED.name,
                          exchange = EXCLUDED.exchange,
                          is_active = EXCLUDED.is_active
                      """, instrument_data)
                      
                      logger.info(f"✅ Bulk upserted {len(instrument_data)} instruments")
                      
                      # Step 2: Get all instrument IDs 
                      instrument_ids = await conn.fetch("""
                          SELECT id, symbol FROM dev_instruments 
                          WHERE symbol = ANY($1)
                      """, [row['symbol'] for row in symbols])
                      
                      id_map = {row['symbol']: row['id'] for row in instrument_ids}
                      logger.info(f"📋 Retrieved {len(id_map)} instrument IDs")
                      
                      # Step 3: Bulk insert market cap data
                      market_cap_data = []
                      for row in symbols:
                          symbol = row['symbol']
                          instrument_id = id_map.get(symbol)
                          if instrument_id:
                              market_cap = generate_market_cap(symbol)
                              market_cap_data.append((current_date, instrument_id, market_cap))
                              total_created += 1
                      
                      await conn.executemany("""
                          INSERT INTO dev_daily_market_cap (date, instrument_id, market_cap)
                          VALUES ($1, $2, $3)
                          ON CONFLICT (instrument_id, date) DO UPDATE SET
                          market_cap = EXCLUDED.market_cap
                      """, market_cap_data)
                      
                      logger.info(f"💰 Bulk inserted {len(market_cap_data)} market cap records")
                  
                  # Verify final count
                  final_count = await conn.fetchval("SELECT COUNT(*) FROM dev_daily_market_cap")
                  instrument_count = await conn.fetchval("SELECT COUNT(*) FROM dev_instruments")
                  
                  logger.info(f"🎯 FINAL RESULTS:")
                  logger.info(f"   • Market cap records: {final_count}")
                  logger.info(f"   • Total instruments: {instrument_count}")
                  logger.info(f"   • Records created this run: {total_created}")
                  
                  if final_count >= 10000:
                      logger.info("🎉 SUCCESS! Achieved 10K+ market cap records!")
                      success = True
                  else:
                      logger.warning(f"⚠️  Only achieved {final_count} records (target: 10K+)")
                      success = False
                  
                  await conn.close()
                  return success
                  
              except Exception as e:
                  logger.error(f"❌ FATAL ERROR: {e}")
                  import traceback
                  logger.error(traceback.format_exc())
                  return False
          
          async def main():
              logger.info("🚀 Starting FINAL 10K+ market cap population...")
              success = await populate_final_10k_market_caps()
              
              if success:
                  logger.info("✅ FINAL 10K+ market cap population SUCCESSFUL!")
              else:
                  logger.error("❌ FINAL attempt failed")
                  exit(1)
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          cd /app
          python final_10k_market_cap.py
          
          echo "FINAL 10K+ market cap population completed!"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      restartPolicy: OnFailure