apiVersion: batch/v1
kind: Job
metadata:
  name: populate-10k-daily-prices-polygon
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      containers:
      - name: populate-10k-daily-prices-polygon
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Installing required packages..."
          pip install asyncpg requests pandas aiohttp python-dotenv
          
          mkdir -p /app
          
          echo "Creating 10K daily prices Polygon population script..."
          cat > /app/populate_10k_daily_prices_polygon.py << 'EOF'
          import os
          import asyncpg
          import asyncio
          import logging
          import requests
          import time
          from datetime import datetime, date, timedelta
          from typing import List, Dict, Any
          
          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(name)s - %(levelname)s - %(message)s')
          logger = logging.getLogger("populate_10k_daily_prices_polygon")
          
          # Polygon API configuration
          POLYGON_API_KEY = "wfrcZNX3ZJJt55Or_CmBXda8G8e8tABD"
          BASE_URL = "https://api.polygon.io/v2/aggs/ticker/{ticker}/range/1/day/{start}/{end}?adjusted=true&sort=asc&limit=50000&apiKey={api_key}"
          
          async def populate_10k_daily_prices_polygon():
              """Populate daily prices from Polygon for 10K instruments."""
              try:
                  conn = await asyncpg.connect(
                      host=os.getenv('DB_HOST', 'postgres'),
                      port=int(os.getenv('DB_PORT', 5432)),
                      user=os.getenv('DB_USER', 'postgres'),
                      password=os.getenv('DB_PASSWORD', 'dev_password'),
                      database=os.getenv('DB_NAME', 'dev_db')
                  )
                  logger.info("✅ Connected to database successfully")
                  
                  # Get all instruments with symbols
                  instruments = await conn.fetch("""
                      SELECT i.id, i.symbol, i.name
                      FROM dev_instruments i
                      WHERE i.is_active = true 
                      AND i.symbol IS NOT NULL
                      AND i.symbol ~ '^[A-Z]+$'
                      ORDER BY i.symbol
                      LIMIT 10000
                  """)
                  
                  logger.info(f"📊 Found {len(instruments)} instruments to process")
                  
                  # Set date range (last 90 days for reasonable scope)
                  end_date = date.today()
                  start_date = end_date - timedelta(days=90)
                  
                  logger.info(f"📅 Date range: {start_date} to {end_date}")
                  
                  # Process in batches
                  batch_size = 50
                  total_success = 0
                  total_failed = 0
                  total_no_data = 0
                  
                  for batch_start in range(0, len(instruments), batch_size):
                      batch_end = min(batch_start + batch_size, len(instruments))
                      batch = instruments[batch_start:batch_end]
                      
                      logger.info(f"🔄 Processing batch {batch_start//batch_size + 1}: instruments {batch_start+1}-{batch_end}")
                      
                      for inst in batch:
                          instrument_id = inst['id']
                          symbol = inst['symbol']
                          
                          try:
                              # Check if we already have recent data
                              existing_count = await conn.fetchval("""
                                  SELECT COUNT(*) FROM dev_daily_prices_polygon 
                                  WHERE instrument_id = $1 AND date >= $2
                              """, instrument_id, start_date)
                              
                              if existing_count > 60:  # Already have most data
                                  logger.debug(f"⏭️  Skipping {symbol} - already has {existing_count} recent records")
                                  continue
                              
                              # Fetch data from Polygon API
                              url = BASE_URL.format(
                                  ticker=symbol,
                                  start=start_date.strftime("%Y-%m-%d"),
                                  end=end_date.strftime("%Y-%m-%d"),
                                  api_key=POLYGON_API_KEY
                              )
                              
                              response = requests.get(url)
                              
                              # Handle rate limiting
                              if response.status_code == 429:
                                  logger.warning(f"⏱️  Rate limit hit for {symbol}, waiting 12 seconds...")
                                  time.sleep(12)
                                  response = requests.get(url)
                              
                              if response.status_code != 200:
                                  logger.warning(f"❌ Failed to fetch {symbol}: {response.status_code}")
                                  total_failed += 1
                                  continue
                              
                              data = response.json()
                              
                              if 'results' not in data or not data['results']:
                                  logger.debug(f"📭 No data for {symbol}")
                                  total_no_data += 1
                                  continue
                              
                              # Insert price data
                              price_records = []
                              for row in data['results']:
                                  price_date = datetime.utcfromtimestamp(row['t']/1000).date()
                                  price_records.append((
                                      price_date,
                                      instrument_id,
                                      row['o'],  # open
                                      row['h'],  # high
                                      row['l'],  # low
                                      row['c'],  # close
                                      row['v']   # volume
                                  ))
                              
                              if price_records:
                                  await conn.executemany("""
                                      INSERT INTO dev_daily_prices_polygon 
                                      (date, instrument_id, open, high, low, close, volume)
                                      VALUES ($1, $2, $3, $4, $5, $6, $7)
                                      ON CONFLICT (instrument_id, date) DO UPDATE SET
                                      open = EXCLUDED.open,
                                      high = EXCLUDED.high,
                                      low = EXCLUDED.low,
                                      close = EXCLUDED.close,
                                      volume = EXCLUDED.volume
                                  """, price_records)
                                  
                                  total_success += 1
                                  logger.debug(f"✅ Inserted {len(price_records)} prices for {symbol}")
                              
                              # Rate limiting between requests
                              await asyncio.sleep(0.1)
                              
                          except Exception as e:
                              logger.error(f"💥 Error processing {symbol}: {e}")
                              total_failed += 1
                      
                      # Progress report
                      if (batch_start // batch_size + 1) % 10 == 0:
                          logger.info(f"📈 PROGRESS: Processed {batch_end}/{len(instruments)} instruments")
                          logger.info(f"   Success: {total_success}, Failed: {total_failed}, No Data: {total_no_data}")
                      
                      # Delay between batches
                      await asyncio.sleep(2)
                  
                  # Final count verification
                  final_count = await conn.fetchval("SELECT COUNT(*) FROM dev_daily_prices_polygon")
                  unique_instruments = await conn.fetchval("""
                      SELECT COUNT(DISTINCT instrument_id) FROM dev_daily_prices_polygon
                  """)
                  
                  logger.info(f"🎯 FINAL RESULTS:")
                  logger.info(f"   • Total price records: {final_count}")
                  logger.info(f"   • Unique instruments with data: {unique_instruments}")
                  logger.info(f"   • Success: {total_success}, Failed: {total_failed}, No Data: {total_no_data}")
                  
                  await conn.close()
                  return total_success > 0
                  
              except Exception as e:
                  logger.error(f"❌ FATAL ERROR: {e}")
                  import traceback
                  logger.error(traceback.format_exc())
                  return False
          
          async def main():
              logger.info("🚀 Starting 10K daily prices Polygon population...")
              success = await populate_10k_daily_prices_polygon()
              
              if success:
                  logger.info("✅ 10K daily prices Polygon population SUCCESSFUL!")
              else:
                  logger.error("❌ Daily prices population failed")
                  exit(1)
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          cd /app
          python populate_10k_daily_prices_polygon.py
          
          echo "10K daily prices Polygon population completed!"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      restartPolicy: OnFailure