apiVersion: batch/v1
kind: Job
metadata:
  name: populate-10k-daily-prices-tiingo
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      containers:
      - name: populate-10k-daily-prices-tiingo
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Installing required packages..."
          pip install asyncpg requests pandas aiohttp python-dotenv
          
          mkdir -p /app
          
          echo "Creating 10K daily prices Tiingo population script..."
          cat > /app/populate_10k_daily_prices_tiingo.py << 'EOF'
          import os
          import asyncpg
          import asyncio
          import logging
          import aiohttp
          import pandas as pd
          from datetime import datetime, date, timedelta
          from typing import List, Dict, Any
          
          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(name)s - %(levelname)s - %(message)s')
          logger = logging.getLogger("populate_10k_daily_prices_tiingo")
          
          # Tiingo API configuration
          TIINGO_API_KEY = "5f40b4f36e171405746304ec0e5a6f3aa9ca77e5"
          TIINGO_BASE_URL = "https://api.tiingo.com/tiingo/daily/{symbol}/prices"
          
          def tiingo_url(symbol, start_date, end_date):
              return (
                  f"https://api.tiingo.com/tiingo/daily/{symbol}/prices"
                  f"?startDate={start_date}&endDate={end_date}&format=json&token={TIINGO_API_KEY}"
              )
          
          async def populate_10k_daily_prices_tiingo():
              """Populate daily prices from Tiingo for 10K instruments."""
              try:
                  conn = await asyncpg.connect(
                      host=os.getenv('DB_HOST', 'postgres'),
                      port=int(os.getenv('DB_PORT', 5432)),
                      user=os.getenv('DB_USER', 'postgres'),
                      password=os.getenv('DB_PASSWORD', 'dev_password'),
                      database=os.getenv('DB_NAME', 'dev_db')
                  )
                  logger.info("✅ Connected to database successfully")
                  
                  # Get all instruments with symbols
                  instruments = await conn.fetch("""
                      SELECT i.id, i.symbol, i.name
                      FROM dev_instruments i
                      WHERE i.is_active = true 
                      AND i.symbol IS NOT NULL
                      AND i.symbol ~ '^[A-Z]+$'
                      ORDER BY i.symbol
                      LIMIT 10000
                  """)
                  
                  logger.info(f"📊 Found {len(instruments)} instruments to process")
                  
                  # Set date range (last 90 days for reasonable scope)
                  end_date = date.today()
                  start_date = end_date - timedelta(days=90)
                  
                  logger.info(f"📅 Date range: {start_date} to {end_date}")
                  
                  # Process in smaller batches for Tiingo (more restrictive API)
                  batch_size = 20
                  total_success = 0
                  total_failed = 0
                  total_no_data = 0
                  
                  # Create aiohttp session
                  timeout = aiohttp.ClientTimeout(total=30)
                  
                  async with aiohttp.ClientSession(timeout=timeout) as session:
                      for batch_start in range(0, len(instruments), batch_size):
                          batch_end = min(batch_start + batch_size, len(instruments))
                          batch = instruments[batch_start:batch_end]
                          
                          logger.info(f"🔄 Processing batch {batch_start//batch_size + 1}: instruments {batch_start+1}-{batch_end}")
                          
                          for inst in batch:
                              instrument_id = inst['id']
                              symbol = inst['symbol']
                              
                              try:
                                  # Check if we already have recent data
                                  existing_count = await conn.fetchval("""
                                      SELECT COUNT(*) FROM dev_daily_prices_tiingo 
                                      WHERE instrument_id = $1 AND date >= $2
                                  """, instrument_id, start_date)
                                  
                                  if existing_count > 60:  # Already have most data
                                      logger.debug(f"⏭️  Skipping {symbol} - already has {existing_count} recent records")
                                      continue
                                  
                                  # Fetch data from Tiingo API
                                  url = tiingo_url(symbol, start_date, end_date)
                                  
                                  max_retries = 3
                                  retry_delay = 2
                                  data = None
                                  
                                  for attempt in range(max_retries):
                                      try:
                                          async with session.get(url) as response:
                                              if response.status == 429:
                                                  logger.warning(f"⏱️  Rate limit hit for {symbol}, waiting {retry_delay} seconds...")
                                                  await asyncio.sleep(retry_delay)
                                                  retry_delay *= 2
                                                  continue
                                              elif response.status == 200:
                                                  data = await response.json()
                                                  break
                                              else:
                                                  logger.warning(f"❌ HTTP {response.status} for {symbol}")
                                                  break
                                      except aiohttp.ClientError as e:
                                          logger.warning(f"🔌 Connection error for {symbol}: {e}")
                                          if attempt < max_retries - 1:
                                              await asyncio.sleep(retry_delay)
                                              retry_delay *= 2
                                          else:
                                              total_failed += 1
                                              break
                                  
                                  if not data:
                                      logger.debug(f"📭 No data for {symbol}")
                                      total_no_data += 1
                                      continue
                                  
                                  # Insert price data
                                  price_records = []
                                  for row in data:
                                      # Parse Tiingo date format
                                      price_date = pd.to_datetime(row['date']).date()
                                      price_records.append((
                                          price_date,
                                          instrument_id,
                                          row.get('open'),
                                          row.get('high'),
                                          row.get('low'),
                                          row.get('close'),
                                          row.get('adjClose'),
                                          row.get('volume')
                                      ))
                                  
                                  if price_records:
                                      await conn.executemany("""
                                          INSERT INTO dev_daily_prices_tiingo 
                                          (date, instrument_id, open, high, low, close, adjclose, volume)
                                          VALUES ($1, $2, $3, $4, $5, $6, $7, $8)
                                          ON CONFLICT (instrument_id, date) DO UPDATE SET
                                          open = EXCLUDED.open,
                                          high = EXCLUDED.high,
                                          low = EXCLUDED.low,
                                          close = EXCLUDED.close,
                                          adjclose = EXCLUDED.adjclose,
                                          volume = EXCLUDED.volume
                                      """, price_records)
                                      
                                      total_success += 1
                                      logger.debug(f"✅ Inserted {len(price_records)} prices for {symbol}")
                                  
                                  # Rate limiting between requests
                                  await asyncio.sleep(0.5)
                                  
                              except Exception as e:
                                  logger.error(f"💥 Error processing {symbol}: {e}")
                                  total_failed += 1
                          
                          # Progress report
                          if (batch_start // batch_size + 1) % 25 == 0:
                              logger.info(f"📈 PROGRESS: Processed {batch_end}/{len(instruments)} instruments")
                              logger.info(f"   Success: {total_success}, Failed: {total_failed}, No Data: {total_no_data}")
                          
                          # Delay between batches (longer for Tiingo)
                          await asyncio.sleep(5)
                  
                  # Final count verification
                  final_count = await conn.fetchval("SELECT COUNT(*) FROM dev_daily_prices_tiingo")
                  unique_instruments = await conn.fetchval("""
                      SELECT COUNT(DISTINCT instrument_id) FROM dev_daily_prices_tiingo
                  """)
                  
                  logger.info(f"🎯 FINAL RESULTS:")
                  logger.info(f"   • Total price records: {final_count}")
                  logger.info(f"   • Unique instruments with data: {unique_instruments}")
                  logger.info(f"   • Success: {total_success}, Failed: {total_failed}, No Data: {total_no_data}")
                  
                  await conn.close()
                  return total_success > 0
                  
              except Exception as e:
                  logger.error(f"❌ FATAL ERROR: {e}")
                  import traceback
                  logger.error(traceback.format_exc())
                  return False
          
          async def main():
              logger.info("🚀 Starting 10K daily prices Tiingo population...")
              success = await populate_10k_daily_prices_tiingo()
              
              if success:
                  logger.info("✅ 10K daily prices Tiingo population SUCCESSFUL!")
              else:
                  logger.error("❌ Daily prices population failed")
                  exit(1)
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          cd /app
          python populate_10k_daily_prices_tiingo.py
          
          echo "10K daily prices Tiingo population completed!"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      restartPolicy: OnFailure