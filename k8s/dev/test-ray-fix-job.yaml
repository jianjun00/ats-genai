apiVersion: batch/v1
kind: Job
metadata:
  name: test-ray-fix
  namespace: ats-dev
spec:
  backoffLimit: 2
  template:
    spec:
      containers:
      - args:
        - --ticker
        - AAPL,MSFT
        - --environment
        - dev
        - --gin_config
        - config/app_docker.gin
        command:
        - python
        - -m
        - src.secmaster.populate_instrument_polygon
        env:
        - name: PYTHONPATH
          value: src
        - name: DB_HOST
          value: timescaledb.ats-dev.svc.cluster.local
        - name: DB_PORT
          value: '5432'
        - name: DB_USER
          value: postgres
        - name: DB_NAME
          value: dev_db
        - name: DB_CONNECTION_PARAMS
          value: sslmode=disable
        - name: RAY_TMPDIR
          value: /tmp/ray
        - name: RAY_DISABLE_DASHBOARD
          value: '1'
        - name: RAY_USAGE_STATS_ENABLED
          value: '0'
        - name: RAY_WORKER_REGISTER_TIMEOUT_SECONDS
          value: '60'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: RAY_ADDRESS
          value: local
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: db-credentials
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              key: polygon-api-key
              name: api-keys
        image: dragonflyer762/ats-genai:dev-latest
        name: test-ray-fix
        resources:
          limits:
            cpu: 250m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 86400
