apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: ats-dev
spec:
  schedule: "0 1 * * *"  # Run daily at 1:00 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: db-backup
            image: postgres:14
            command: ["/bin/bash", "-c"]
            args:
            - |
              # Set timestamp for backup filename
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="/backups/ats_dev_${TIMESTAMP}.sql"
              
              echo "Starting database backup to ${BACKUP_FILE}..."
              
              # Create backups directory if it doesn't exist
              mkdir -p /backups
              
              # Run the backup
              pg_dump -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f $BACKUP_FILE
              
              # Check if backup was successful
              if [ $? -eq 0 ]; then
                echo "Backup completed successfully: ${BACKUP_FILE}"
                
                # Keep only the 5 most recent backups
                ls -t /backups/*.sql | tail -n +6 | xargs -r rm
                echo "Cleaned up old backups, keeping the 5 most recent"
                
                # List remaining backups
                echo "Current backups:"
                ls -lh /backups/
              else
                echo "Backup failed!"
                exit 1
              fi
            env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_NAME
            - name: PGPASSWORD  # Required for pg_dump to work without password prompt
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            volumeMounts:
            - name: backup-volume
              mountPath: /backups
          volumes:
          - name: backup-volume
            persistentVolumeClaim:
              claimName: db-backup-pvc
          restartPolicy: OnFailure
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backup-pvc
  namespace: ats-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
