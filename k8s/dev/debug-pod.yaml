apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
  namespace: ats-dev
  labels:
    app: debug
spec:
  containers:
  - name: debug-container
    image: dragonflyer762/ats-genai:dev-latest
    command: ["sleep", "3600"]
    env:
    - name: PYTHONPATH
      value: "/app/src"
    - name: LOG_LEVEL
      value: "INFO"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"
