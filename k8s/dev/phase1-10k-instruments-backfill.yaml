apiVersion: batch/v1
kind: Job
metadata:
  name: phase1-10k-instruments-backfill
  namespace: ats-dev
  labels:
    app: ats-backfill
    phase: "1"
    scope: "10k-instruments"
    timeframe: "2020-2025"
spec:
  ttlSecondsAfterFinished: 604800  # Keep for 7 days due to scale
  template:
    spec:
      containers:
      - name: phase1-10k-instruments-backfill
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "🚀 PHASE 1: Complete Recent Coverage (2020-2025) for All 10k Instruments"
          echo "This is the largest minute data backfill job - targeting ~5 billion records"
          echo ""
          
          echo "Installing required packages..."
          pip install asyncpg requests pandas aiohttp python-dotenv pyarrow numpy
          
          # Verify installation
          python -c "import asyncpg, requests, pandas, aiohttp, pyarrow, numpy; print('✅ All packages installed successfully')"
          
          mkdir -p /app/src/storage
          mkdir -p /app/checkpoints
          mkdir -p /data/STK/1min/cold  # Phase 1 data structure
          
          echo "Creating Phase 1 massive-scale backfill system..."
          
          # Create enhanced models for 10k-instrument processing
          cat > /app/src/models.py << 'EOF'
          from dataclasses import dataclass
          from datetime import datetime
          from typing import Optional
          
          @dataclass
          class MinuteBar:
              symbol: str
              timestamp: datetime
              open: float
              high: float
              low: float
              close: float
              volume: int
              vendor: str
              quality_score: float = 0.8
              vwap: Optional[float] = None
              trade_count: Optional[int] = None
              data_source_flags: Optional[dict] = None
          EOF
          
          # Create enterprise-grade polygon adapter for 10k symbols
          cat > /app/src/polygon_adapter.py << 'EOF'
          import asyncio
          import aiohttp
          from datetime import datetime, timedelta
          from typing import List
          from models import MinuteBar
          import logging
          
          logger = logging.getLogger(__name__)
          
          class EnterprisePolygonAdapter:
              def __init__(self, api_key: str):
                  self.api_key = api_key
                  self.session = None
                  self.request_count = 0
                  self.total_bars_fetched = 0
                  self.rate_limit_delay = 0.12  # 5 requests per second max
                  self.max_retries = 3
              
              async def __aenter__(self):
                  # Optimized for massive scale
                  connector = aiohttp.TCPConnector(
                      limit=500,           # Total connections
                      limit_per_host=50,   # Per host connections
                      keepalive_timeout=30,
                      enable_cleanup_closed=True
                  )
                  timeout = aiohttp.ClientTimeout(total=60, connect=30)
                  self.session = aiohttp.ClientSession(
                      connector=connector,
                      timeout=timeout
                  )
                  return self
              
              async def __aexit__(self, exc_type, exc_val, exc_tb):
                  if self.session:
                      await self.session.close()
              
              async def fetch_minute_bars_batch(self, symbols: List[str], start_date: datetime, end_date: datetime) -> dict:
                  """Fetch minute bars for multiple symbols in batch."""
                  logger.info(f"🔄 Polygon: Fetching {len(symbols)} symbols from {start_date.date()} to {end_date.date()}")
                  
                  # Split into chunks to avoid overwhelming the API
                  chunk_size = 10  # Process 10 symbols at once
                  results = {}
                  
                  for i in range(0, len(symbols), chunk_size):
                      chunk = symbols[i:i + chunk_size]
                      chunk_results = await self._fetch_chunk(chunk, start_date, end_date)
                      results.update(chunk_results)
                      
                      # Progress logging
                      if (i + chunk_size) % 100 == 0:
                          logger.info(f"   Polygon: Processed {min(i + chunk_size, len(symbols))}/{len(symbols)} symbols")
                      
                      # Rate limiting between chunks
                      await asyncio.sleep(1.0)
                  
                  return results
              
              async def _fetch_chunk(self, symbols: List[str], start_date: datetime, end_date: datetime) -> dict:
                  """Fetch chunk of symbols concurrently."""
                  tasks = []
                  for symbol in symbols:
                      task = self._fetch_symbol_with_retry(symbol, start_date, end_date)
                      tasks.append(task)
                  
                  results = await asyncio.gather(*tasks, return_exceptions=True)
                  
                  chunk_results = {}
                  for symbol, result in zip(symbols, results):
                      if isinstance(result, Exception):
                          logger.warning(f"Polygon: Failed to fetch {symbol}: {result}")
                          chunk_results[symbol] = []
                      else:
                          chunk_results[symbol] = result
                  
                  return chunk_results
              
              async def _fetch_symbol_with_retry(self, symbol: str, start_date: datetime, end_date: datetime) -> List[MinuteBar]:
                  """Fetch single symbol with retry logic."""
                  for attempt in range(self.max_retries):
                      try:
                          return await self._fetch_single_symbol(symbol, start_date, end_date)
                      except Exception as e:
                          if attempt == self.max_retries - 1:
                              logger.error(f"Polygon: Failed {symbol} after {self.max_retries} attempts: {e}")
                              return []
                          else:
                              wait_time = 2 ** attempt  # Exponential backoff
                              await asyncio.sleep(wait_time)
                  
                  return []
              
              async def _fetch_single_symbol(self, symbol: str, start_date: datetime, end_date: datetime) -> List[MinuteBar]:
                  """Fetch minute bars for single symbol."""
                  if not self.session:
                      raise RuntimeError("Must use async context manager")
                  
                  self.request_count += 1
                  
                  # Split large date ranges into smaller chunks (1 month max)
                  all_bars = []
                  current_start = start_date
                  
                  while current_start <= end_date:
                      current_end = min(
                          current_start + timedelta(days=30),
                          end_date
                      )
                      
                      start_str = current_start.strftime("%Y-%m-%d")
                      end_str = current_end.strftime("%Y-%m-%d")
                      
                      url = f"https://api.polygon.io/v2/aggs/ticker/{symbol}/range/1/minute/{start_str}/{end_str}"
                      params = {
                          'adjusted': 'true',
                          'sort': 'asc',
                          'limit': 50000,
                          'apikey': self.api_key
                      }
                      
                      # Progressive rate limiting
                      await asyncio.sleep(self.rate_limit_delay)
                      
                      async with self.session.get(url, params=params) as response:
                          if response.status == 200:
                              data = await response.json()
                              if 'results' in data and data['results']:
                                  for result in data['results']:
                                      timestamp = datetime.utcfromtimestamp(result['t']/1000)
                                      bar = MinuteBar(
                                          symbol=symbol,
                                          timestamp=timestamp,
                                          open=float(result['o']),
                                          high=float(result['h']),
                                          low=float(result['l']),
                                          close=float(result['c']),
                                          volume=int(result['v']),
                                          vwap=float(result.get('vw', 0)),
                                          trade_count=int(result.get('n', 0)),
                                          vendor="polygon",
                                          quality_score=0.8,
                                          data_source_flags={
                                              'source_vendor': 'polygon',
                                              'api_version': 'v2',
                                              'chunk_start': start_str,
                                              'chunk_end': end_str
                                          }
                                      )
                                      all_bars.append(bar)
                          elif response.status == 429:
                              logger.warning(f"Polygon rate limited for {symbol}, adjusting delay...")
                              self.rate_limit_delay = min(self.rate_limit_delay * 1.5, 2.0)
                              await asyncio.sleep(10)
                          else:
                              logger.warning(f"Polygon API error for {symbol}: HTTP {response.status}")
                      
                      current_start = current_end + timedelta(days=1)
                  
                  self.total_bars_fetched += len(all_bars)
                  return all_bars
          EOF
          
          # Create enterprise-grade tiingo adapter for 10k symbols
          cat > /app/src/tiingo_adapter.py << 'EOF'
          import asyncio
          import aiohttp
          from datetime import datetime, timedelta
          from typing import List
          from models import MinuteBar
          import logging
          
          logger = logging.getLogger(__name__)
          
          class EnterpriseTiingoAdapter:
              def __init__(self, api_key: str):
                  self.api_key = api_key
                  self.session = None
                  self.request_count = 0
                  self.total_bars_fetched = 0
                  self.rate_limit_delay = 0.6  # Conservative for Tiingo
                  self.max_retries = 3
              
              async def __aenter__(self):
                  connector = aiohttp.TCPConnector(
                      limit=200,
                      limit_per_host=20,
                      keepalive_timeout=60,
                      enable_cleanup_closed=True
                  )
                  timeout = aiohttp.ClientTimeout(total=120, connect=30)
                  self.session = aiohttp.ClientSession(
                      connector=connector,
                      timeout=timeout
                  )
                  return self
              
              async def __aexit__(self, exc_type, exc_val, exc_tb):
                  if self.session:
                      await self.session.close()
              
              async def fetch_minute_bars_batch(self, symbols: List[str], start_date: datetime, end_date: datetime) -> dict:
                  """Fetch minute bars for multiple symbols in batch."""
                  logger.info(f"🔄 Tiingo: Fetching {len(symbols)} symbols from {start_date.date()} to {end_date.date()}")
                  
                  # Smaller chunks for Tiingo due to stricter rate limits
                  chunk_size = 5
                  results = {}
                  
                  for i in range(0, len(symbols), chunk_size):
                      chunk = symbols[i:i + chunk_size]
                      chunk_results = await self._fetch_chunk(chunk, start_date, end_date)
                      results.update(chunk_results)
                      
                      # Progress logging
                      if (i + chunk_size) % 50 == 0:
                          logger.info(f"   Tiingo: Processed {min(i + chunk_size, len(symbols))}/{len(symbols)} symbols")
                      
                      # Conservative rate limiting between chunks
                      await asyncio.sleep(2.0)
                  
                  return results
              
              async def _fetch_chunk(self, symbols: List[str], start_date: datetime, end_date: datetime) -> dict:
                  """Fetch chunk of symbols with conservative concurrency."""
                  # Sequential processing for Tiingo to respect rate limits
                  results = {}
                  
                  for symbol in symbols:
                      try:
                          bars = await self._fetch_symbol_with_retry(symbol, start_date, end_date)
                          results[symbol] = bars
                      except Exception as e:
                          logger.warning(f"Tiingo: Failed to fetch {symbol}: {e}")
                          results[symbol] = []
                      
                      await asyncio.sleep(self.rate_limit_delay)
                  
                  return results
              
              async def _fetch_symbol_with_retry(self, symbol: str, start_date: datetime, end_date: datetime) -> List[MinuteBar]:
                  """Fetch single symbol with retry logic."""
                  for attempt in range(self.max_retries):
                      try:
                          return await self._fetch_single_symbol(symbol, start_date, end_date)
                      except Exception as e:
                          if attempt == self.max_retries - 1:
                              logger.error(f"Tiingo: Failed {symbol} after {self.max_retries} attempts: {e}")
                              return []
                          else:
                              wait_time = 5 * (2 ** attempt)  # Longer backoff for Tiingo
                              await asyncio.sleep(wait_time)
                  
                  return []
              
              async def _fetch_single_symbol(self, symbol: str, start_date: datetime, end_date: datetime) -> List[MinuteBar]:
                  """Fetch minute bars for single symbol."""
                  if not self.session:
                      raise RuntimeError("Must use async context manager")
                  
                  self.request_count += 1
                  
                  start_str = start_date.strftime("%Y-%m-%d")
                  end_str = end_date.strftime("%Y-%m-%d")
                  
                  url = f"https://api.tiingo.com/iex/{symbol}/prices"
                  params = {
                      'startDate': start_str,
                      'endDate': end_str,
                      'resampleFreq': '1min',
                      'token': self.api_key
                  }
                  
                  await asyncio.sleep(self.rate_limit_delay)
                  
                  async with self.session.get(url, params=params) as response:
                      if response.status == 200:
                          data = await response.json()
                          bars = []
                          for item in data:
                              timestamp = datetime.fromisoformat(item['date'].replace('Z', '+00:00'))
                              if all(item.get(field) is not None for field in ['open', 'high', 'low', 'close']):
                                  bar = MinuteBar(
                                      symbol=symbol,
                                      timestamp=timestamp,
                                      open=float(item['open']),
                                      high=float(item['high']),
                                      low=float(item['low']),
                                      close=float(item['close']),
                                      volume=int(item.get('volume', 0)),
                                      vendor="tiingo",
                                      quality_score=0.7,
                                      data_source_flags={
                                          'source_vendor': 'tiingo',
                                          'api_version': 'v1',
                                          'data_source': 'iex'
                                      }
                                  )
                                  bars.append(bar)
                          
                          self.total_bars_fetched += len(bars)
                          return bars
                      elif response.status == 429:
                          logger.warning(f"Tiingo rate limited for {symbol}, adjusting delay...")
                          self.rate_limit_delay = min(self.rate_limit_delay * 1.5, 5.0)
                          await asyncio.sleep(15)
                          return []
                      else:
                          logger.warning(f"Tiingo API error for {symbol}: HTTP {response.status}")
                          return []
          EOF
          
          # Create Phase 1 massive-scale backfill script
          cat > /app/phase1_10k_instruments_backfill.py << 'EOF'
          import os
          import sys
          import asyncio
          import asyncpg
          import pandas as pd
          import logging
          import json
          from datetime import datetime, date, timedelta
          from typing import List, Dict, Any, Tuple
          from pathlib import Path
          from dataclasses import dataclass
          import numpy as np
          
          # Add src to path
          sys.path.insert(0, '/app/src')
          
          from polygon_adapter import EnterprisePolygonAdapter
          from tiingo_adapter import EnterpriseTiingoAdapter
          
          # Configure enterprise logging
          logging.basicConfig(
              level=logging.INFO,
              format='%(asctime)s - %(name)s - %(levelname)s - %(message)s'
          )
          logger = logging.getLogger("phase1_10k_instruments_backfill")
          
          class Phase1MassiveScaleBackfillJob:
              def __init__(self):
                  self.polygon_api_key = "wfrcZNX3ZJJt55Or_CmBXda8G8e8tABD"
                  self.tiingo_api_key = "5f40b4f36e171405746304ec0e5a6f3aa9ca77e5"
                  self.checkpoint_file = "/app/checkpoints/phase1_10k_checkpoint.json"
                  
                  # Target: Complete recent coverage (2020-2025)
                  self.target_start_date = date(2020, 1, 1)
                  self.target_end_date = date(2025, 8, 18)
                  
                  # Batch processing configuration
                  self.batch_size = 100  # Process 100 symbols at a time
                  self.chunk_months = 6  # Process 6 months at a time
                  
                  # Enhanced progress tracking
                  self.progress = {
                      'phase': 1,
                      'target_description': 'Complete recent coverage (2020-2025) for all 10k instruments',
                      'start_time': None,
                      'estimated_total_records': 5_000_000_000,  # 5 billion records
                      'instruments_processed': 0,
                      'instruments_total': 0,
                      'batches_processed': 0,
                      'batches_total': 0,
                      'vendor_stats': {
                          'polygon': {
                              'instruments_attempted': 0,
                              'instruments_successful': 0,
                              'api_calls': 0,
                              'bars_fetched': 0,
                              'bars_stored': 0,
                              'errors': 0
                          },
                          'tiingo': {
                              'instruments_attempted': 0,
                              'instruments_successful': 0,
                              'api_calls': 0,
                              'bars_fetched': 0,
                              'bars_stored': 0,
                              'errors': 0
                          }
                      },
                      'errors': [],
                      'completion_estimate': None
                  }
                  
                  self.load_checkpoint()
              
              def save_checkpoint(self):
                  try:
                      # Calculate completion estimate
                      if self.progress['instruments_processed'] > 0:
                          completion_rate = self.progress['instruments_processed'] / self.progress['instruments_total']
                          if completion_rate > 0:
                              start_time = datetime.fromisoformat(self.progress['start_time'])
                              elapsed = datetime.now() - start_time
                              estimated_total_time = elapsed / completion_rate
                              estimated_completion = start_time + estimated_total_time
                              self.progress['completion_estimate'] = estimated_completion.isoformat()
                      
                      checkpoint_data = {
                          'progress': self.progress,
                          'timestamp': datetime.now().isoformat(),
                          'phase1_summary': {
                              'completion_percentage': (self.progress['instruments_processed'] / self.progress['instruments_total'] * 100) if self.progress['instruments_total'] > 0 else 0,
                              'total_bars_stored': (
                                  self.progress['vendor_stats']['polygon']['bars_stored'] + 
                                  self.progress['vendor_stats']['tiingo']['bars_stored']
                              ),
                              'total_api_calls': (
                                  self.progress['vendor_stats']['polygon']['api_calls'] + 
                                  self.progress['vendor_stats']['tiingo']['api_calls']
                              )
                          }
                      }
                      with open(self.checkpoint_file, 'w') as f:
                          json.dump(checkpoint_data, f, indent=2, default=str)
                      
                      p_bars = self.progress['vendor_stats']['polygon']['bars_stored']
                      t_bars = self.progress['vendor_stats']['tiingo']['bars_stored']
                      instruments_done = self.progress['instruments_processed']
                      instruments_total = self.progress['instruments_total']
                      completion_pct = (instruments_done / instruments_total * 100) if instruments_total > 0 else 0
                      
                      logger.info(f"📊 PHASE 1 CHECKPOINT: {instruments_done}/{instruments_total} instruments ({completion_pct:.1f}%) | "
                                 f"P:{p_bars:,} T:{t_bars:,} bars stored")
                  except Exception as e:
                      logger.error(f"Failed to save checkpoint: {e}")
              
              def load_checkpoint(self):
                  try:
                      if Path(self.checkpoint_file).exists():
                          with open(self.checkpoint_file, 'r') as f:
                              data = json.load(f)
                          self.progress = data.get('progress', self.progress)
                          logger.info(f"📂 Phase 1 checkpoint loaded: {self.progress['instruments_processed']} instruments processed")
                  except Exception as e:
                      logger.error(f"Failed to load checkpoint: {e}")
              
              async def get_database_connection(self):
                  return await asyncpg.connect(
                      host=os.getenv('DB_HOST', 'postgres'),
                      port=int(os.getenv('DB_PORT', 5432)),
                      user=os.getenv('DB_USER', 'postgres'),
                      password=os.getenv('DB_PASSWORD', 'dev_password'),
                      database=os.getenv('DB_NAME', 'dev_db')
                  )
              
              async def get_all_active_instruments(self) -> List[Tuple[int, str]]:
                  """Get all active instruments from database."""
                  try:
                      conn = await self.get_database_connection()
                      try:
                          instruments = await conn.fetch("""
                              SELECT id, symbol 
                              FROM dev_instruments 
                              WHERE is_active = true 
                              ORDER BY symbol
                          """)
                          return [(row['id'], row['symbol']) for row in instruments]
                      finally:
                          await conn.close()
                  except Exception as e:
                      logger.error(f"Failed to get instruments: {e}")
                      return []
              
              async def run_phase1_backfill(self):
                  """Run Phase 1: Complete recent coverage for all 10k instruments."""
                  self.progress['start_time'] = datetime.now().isoformat()
                  
                  logger.info("🎯 STARTING PHASE 1: COMPLETE RECENT COVERAGE (2020-2025)")
                  logger.info("=" * 80)
                  logger.info(f"📊 Target: All active instruments")
                  logger.info(f"📅 Date range: {self.target_start_date} to {self.target_end_date}")
                  logger.info(f"🔄 Approach: Vendor-separated storage with enterprise-scale batching")
                  logger.info(f"💾 Estimated records: {self.progress['estimated_total_records']:,}")
                  
                  # Get all active instruments
                  logger.info("📋 Loading all active instruments...")
                  instruments = await self.get_all_active_instruments()
                  
                  if not instruments:
                      logger.error("❌ No active instruments found!")
                      return False
                  
                  self.progress['instruments_total'] = len(instruments)
                  logger.info(f"✅ Found {len(instruments):,} active instruments")
                  
                  # Calculate batches
                  batches = [instruments[i:i + self.batch_size] for i in range(0, len(instruments), self.batch_size)]
                  self.progress['batches_total'] = len(batches)
                  
                  logger.info(f"📦 Processing in {len(batches)} batches of {self.batch_size} instruments each")
                  logger.info("")
                  
                  # Process batches
                  for batch_idx, batch in enumerate(batches, 1):
                      try:
                          logger.info(f"🔄 Processing batch {batch_idx}/{len(batches)}: {len(batch)} instruments")
                          
                          # Extract symbols from batch
                          batch_symbols = [symbol for _, symbol in batch]
                          
                          # Process batch with both vendors
                          await self._process_batch(batch_symbols, batch_idx)
                          
                          self.progress['batches_processed'] += 1
                          self.progress['instruments_processed'] += len(batch)
                          
                          # Save checkpoint every 5 batches
                          if batch_idx % 5 == 0:
                              self.save_checkpoint()
                          
                          # Rate limiting between batches
                          await asyncio.sleep(10.0)
                          
                      except Exception as e:
                          error_msg = f"Error processing batch {batch_idx}: {e}"
                          logger.error(error_msg)
                          self.progress['errors'].append(error_msg)
                  
                  # Final checkpoint and report
                  self.save_checkpoint()
                  await self.generate_phase1_final_report()
                  
                  return True
              
              async def _process_batch(self, symbols: List[str], batch_idx: int):
                  """Process a batch of symbols with both vendors."""
                  
                  # Process in time chunks (6 months at a time)
                  current_start = self.target_start_date
                  chunk_number = 0
                  
                  while current_start <= self.target_end_date:
                      chunk_number += 1
                      current_end = min(
                          current_start.replace(month=current_start.month + self.chunk_months) if current_start.month <= 6 else current_start.replace(year=current_start.year + 1, month=current_start.month + self.chunk_months - 12),
                          self.target_end_date
                      )
                      
                      logger.info(f"   📅 Chunk {chunk_number}: {current_start} to {current_end} ({len(symbols)} symbols)")
                      
                      start_datetime = datetime.combine(current_start, datetime.min.time())
                      end_datetime = datetime.combine(current_end, datetime.min.time())
                      
                      try:
                          # Fetch data from both vendors in parallel
                          async with EnterprisePolygonAdapter(self.polygon_api_key) as polygon:
                              async with EnterpriseTiingoAdapter(self.tiingo_api_key) as tiingo:
                                  
                                  polygon_task = polygon.fetch_minute_bars_batch(symbols, start_datetime, end_datetime)
                                  tiingo_task = tiingo.fetch_minute_bars_batch(symbols, start_datetime, end_datetime)
                                  
                                  polygon_results, tiingo_results = await asyncio.gather(
                                      polygon_task, tiingo_task, return_exceptions=True
                                  )
                                  
                                  # Handle exceptions
                                  if isinstance(polygon_results, Exception):
                                      logger.warning(f"Polygon batch failed: {polygon_results}")
                                      polygon_results = {}
                                      self.progress['vendor_stats']['polygon']['errors'] += 1
                                  
                                  if isinstance(tiingo_results, Exception):
                                      logger.warning(f"Tiingo batch failed: {tiingo_results}")
                                      tiingo_results = {}
                                      self.progress['vendor_stats']['tiingo']['errors'] += 1
                                  
                                  # Store results for each symbol
                                  await self._store_batch_results(symbols, polygon_results, tiingo_results, batch_idx, chunk_number)
                      
                      except Exception as e:
                          logger.error(f"Error processing chunk {chunk_number} in batch {batch_idx}: {e}")
                      
                      current_start = current_end + timedelta(days=1)
              
              async def _store_batch_results(self, symbols: List[str], polygon_results: dict, tiingo_results: dict, batch_idx: int, chunk_number: int):
                  """Store batch results for all symbols."""
                  
                  total_polygon_bars = 0
                  total_tiingo_bars = 0
                  
                  for symbol in symbols:
                      polygon_bars = polygon_results.get(symbol, [])
                      tiingo_bars = tiingo_results.get(symbol, [])
                      
                      if polygon_bars or tiingo_bars:
                          try:
                              # Store vendor data separately
                              stored_counts = await self._store_vendor_data_separately(symbol, polygon_bars, tiingo_bars)
                              
                              total_polygon_bars += stored_counts['polygon_stored']
                              total_tiingo_bars += stored_counts['tiingo_stored']
                              
                              # Update vendor stats
                              if polygon_bars:
                                  self.progress['vendor_stats']['polygon']['instruments_successful'] += 1
                                  self.progress['vendor_stats']['polygon']['bars_fetched'] += len(polygon_bars)
                                  self.progress['vendor_stats']['polygon']['bars_stored'] += stored_counts['polygon_stored']
                              
                              if tiingo_bars:
                                  self.progress['vendor_stats']['tiingo']['instruments_successful'] += 1
                                  self.progress['vendor_stats']['tiingo']['bars_fetched'] += len(tiingo_bars)
                                  self.progress['vendor_stats']['tiingo']['bars_stored'] += stored_counts['tiingo_stored']
                              
                              logger.debug(f"     ✅ {symbol}: P:{len(polygon_bars)} T:{len(tiingo_bars)} bars stored")
                              
                          except Exception as e:
                              logger.error(f"Failed to store data for {symbol}: {e}")
                  
                  logger.info(f"   ✅ Batch {batch_idx} Chunk {chunk_number}: P:{total_polygon_bars:,} T:{total_tiingo_bars:,} bars stored")
              
              async def _store_vendor_data_separately(self, symbol: str, polygon_data: List, tiingo_data: List) -> Dict[str, int]:
                  """Store vendor data separately for Phase 1."""
                  results = {'polygon_stored': 0, 'tiingo_stored': 0}
                  
                  # Store Polygon data
                  if polygon_data:
                      results['polygon_stored'] = await self._store_vendor_database(symbol, polygon_data, "polygon")
                  
                  # Store Tiingo data  
                  if tiingo_data:
                      results['tiingo_stored'] = await self._store_vendor_database(symbol, tiingo_data, "tiingo")
                  
                  return results
              
              async def _store_vendor_database(self, symbol: str, bars: List, vendor: str) -> int:
                  """Store vendor-specific database records efficiently."""
                  if not bars:
                      return 0
                  
                  try:
                      conn = await self.get_database_connection()
                      try:
                          # Get instrument ID
                          instrument_id = await conn.fetchval(
                              "SELECT id FROM dev_instruments WHERE symbol = $1 AND is_active = true",
                              symbol
                          )
                          
                          if not instrument_id:
                              logger.debug(f"Instrument {symbol} not found in database")
                              return 0
                          
                          # Prepare records in batches for efficiency
                          records = []
                          for bar in bars:
                              records.append((
                                  bar.timestamp,
                                  instrument_id,
                                  bar.open,
                                  bar.high,
                                  bar.low,
                                  bar.close,
                                  bar.volume,
                                  vendor
                              ))
                          
                          # Batch insert with efficient conflict resolution
                          await conn.executemany("""
                              INSERT INTO dev_minute_data 
                              (timestamp, instrument_id, open, high, low, close, volume, vendor)
                              VALUES ($1, $2, $3, $4, $5, $6, $7, $8)
                              ON CONFLICT (timestamp, instrument_id, vendor) DO NOTHING
                          """, records)
                          
                          return len(records)
                      
                      finally:
                          await conn.close()
                  
                  except Exception as e:
                      logger.error(f"Failed to store {vendor} database data for {symbol}: {e}")
                      return 0
              
