apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: db-migrate
        image: dragonflyer762/ats-genai:dev-latest
        env:
        - name: PYTHONPATH
          value: src
        - name: LOG_LEVEL
          value: INFO
        - name: ENVIRONMENT
          value: dev
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: DB_HOST
          value: timescaledb.ats-dev.svc.cluster.local
        - name: DB_PORT
          value: "5432"
        - name: DB_CONNECTION_PARAMS
          value: sslmode=disable
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: DB_USER
              name: db-credentials-dev
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: db-credentials-dev
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              key: DB_NAME
              name: db-credentials-dev
        command:
        - python
        - -c
        - |
          import os, asyncio
          from src.db.migration_manager import MigrationManager
          params = os.getenv('DB_CONNECTION_PARAMS', '')
          q = ('?' + params) if params else ''
          db_url = f"postgresql://{os.getenv('DB_USER')}:{os.getenv('DB_PASSWORD')}@{os.getenv('DB_HOST')}:{os.getenv('DB_PORT')}/{os.getenv('DB_NAME')}{q}"
          print(f"[INFO] Using DB URL: postgresql://<user>:<redacted>@{os.getenv('DB_HOST')}:{os.getenv('DB_PORT')}/{os.getenv('DB_NAME')}{('?' + params) if params else ''}")
          asyncio.run(MigrationManager(db_url=db_url).migrate_to_latest())
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
      imagePullSecrets:
      - name: registry-credentials
      restartPolicy: Never
  backoffLimit: 2
