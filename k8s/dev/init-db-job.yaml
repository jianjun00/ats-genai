apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: db-init
        image: postgres:14
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -c "SELECT 1" > /dev/null 2>&1; do
            echo "PostgreSQL is not ready yet. Waiting..."
            sleep 2
          done
          
          echo "PostgreSQL is ready. Creating schema..."
          
          # Create the instruments table
          PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -c "
          CREATE TABLE IF NOT EXISTS dev_instruments (
            id SERIAL PRIMARY KEY,
            symbol VARCHAR(20) NOT NULL,
            name VARCHAR(255),
            exchange VARCHAR(20),
            is_active BOOLEAN DEFAULT TRUE,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
          );
          
          CREATE TABLE IF NOT EXISTS dev_instrument_aliases (
            id SERIAL PRIMARY KEY,
            instrument_id INTEGER NOT NULL REFERENCES dev_instruments(id),
            alias VARCHAR(20) NOT NULL,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            UNIQUE(instrument_id, alias)
          );
          
          CREATE TABLE IF NOT EXISTS dev_instrument_metadata (
            id SERIAL PRIMARY KEY,
            instrument_id INTEGER NOT NULL REFERENCES dev_instruments(id),
            key VARCHAR(50) NOT NULL,
            value TEXT,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            UNIQUE(instrument_id, key)
          );
          
          CREATE TABLE IF NOT EXISTS dev_vendors (
            id SERIAL PRIMARY KEY,
            name VARCHAR(50) NOT NULL UNIQUE,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
          );
          
          CREATE TABLE IF NOT EXISTS dev_instrument_xrefs (
            id SERIAL PRIMARY KEY,
            instrument_id INTEGER NOT NULL REFERENCES dev_instruments(id),
            vendor_id INTEGER NOT NULL REFERENCES dev_vendors(id),
            vendor_symbol VARCHAR(20) NOT NULL,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            UNIQUE(vendor_id, vendor_symbol)
          );
          
          -- Insert default vendors
          INSERT INTO dev_vendors (name) VALUES ('polygon'), ('tiingo')
          ON CONFLICT (name) DO NOTHING;
          "
          
          echo "Database schema created successfully!"
        env:
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_DB
          value: "ats_dev"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
      restartPolicy: OnFailure
