apiVersion: batch/v1
kind: Job
metadata:
  name: diagnostic-job
  namespace: ats-dev
  labels:
    app: ats-api
    component: diagnostic
    environment: dev
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - name: diagnostic
        image: dragonflyer762/ats-genai:dev-latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "=== DIAGNOSTIC REPORT ==="
          echo "1. Checking environment variables:"
          env | sort
          
          echo -e "\n2. Checking Python version:"
          python --version
          
          echo -e "\n3. Checking PYTHONPATH:"
          echo $PYTHONPATH
          
          echo -e "\n4. Listing /app directory:"
          ls -la /app
          
          echo -e "\n5. Checking Gin config files:"
          ls -la /app/config/
          
          echo -e "\n6. Checking if app_docker.gin exists:"
          if [ -f "/app/config/app_docker.gin" ]; then
            echo "app_docker.gin exists"
            cat /app/config/app_docker.gin
          else
            echo "app_docker.gin does not exist"
          fi
          
          echo -e "\n7. Testing module imports:"
          python -c "import sys; print(sys.path); import src.secmaster.populate_instrument_polygon; print('Import successful')" || echo "Import failed"
          
          echo -e "\n8. Checking command help:"
          python -m src.secmaster.populate_instrument_polygon --help
          
          echo -e "\n9. Checking available environments:"
          python -c "from src.secmaster.populate_instrument_polygon import main; print('Available environments:', main.get_parser().parse_args(['--help']).environment)" || echo "Failed to check environments"
        env:
        - name: PYTHONPATH
          value: "/app/src"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
      restartPolicy: Never
