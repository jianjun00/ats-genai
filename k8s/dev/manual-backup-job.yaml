apiVersion: batch/v1
kind: Job
metadata:
  name: ats-dev-manual-backup
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      containers:
      - name: postgres-backup
        image: postgres:16
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "🗄️ Starting IMMEDIATE database backup at $(date)"
          echo "Database: dev_db"
          echo "Host: postgres:5432"
          
          # Create backup filename with timestamp
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_FILE="/tmp/ats-dev-backup-${TIMESTAMP}.sql"
          
          echo "📦 Creating database backup..."
          
          # Create comprehensive backup with all data including our 10K instruments and prices
          PGPASSWORD=dev_password pg_dump \
            -h postgres \
            -p 5432 \
            -U postgres \
            -d dev_db \
            --verbose \
            --clean \
            --create \
            --format=plain \
            --file="${BACKUP_FILE}"
          
          # Check if backup was successful
          if [ $? -eq 0 ]; then
            echo "✅ Backup created successfully!"
            
            # Compress the backup
            gzip "${BACKUP_FILE}"
            COMPRESSED_FILE="${BACKUP_FILE}.gz"
            
            echo "📊 Backup statistics:"
            echo "   • File: ${COMPRESSED_FILE}"
            echo "   • Size: $(du -h ${COMPRESSED_FILE} | cut -f1)"
            echo "   • Created: $(date)"
            
            # Show first few lines to verify content
            echo "🔍 Backup file preview:"
            zcat "${COMPRESSED_FILE}" | head -20
            
            # Count important tables in backup
            echo "📋 Tables included in backup:"
            zcat "${COMPRESSED_FILE}" | grep -c "CREATE TABLE" || echo "Could not count tables"
            
            echo "✅ BACKUP COMPLETED SUCCESSFULLY!"
            echo "   To restore: gunzip ${COMPRESSED_FILE} && psql -h postgres -U postgres -d postgres -f ${BACKUP_FILE}"
            
          else
            echo "❌ Backup failed!"
            exit 1
          fi
        env:
        - name: PGPASSWORD
          value: "dev_password"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi" 
            cpu: "1000m"
      restartPolicy: OnFailure