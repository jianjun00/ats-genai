apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-monitor-config
  namespace: ats-dev
data:
  monitor.py: |
    #!/usr/bin/env python3
    import asyncio
    import asyncpg
    import aiohttp
    import json
    import os
    import logging
    from datetime import datetime

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    SLACK_WEBHOOK_URL = os.getenv('SLACK_WEBHOOK_URL')
    
    async def check_postgres():
        try:
            conn = await asyncpg.connect(
                host='postgres', port=5432, user='postgres', 
                password='dev_password', database='dev_db'
            )
            
            # Check basic health
            version = await conn.fetchval('SELECT version()')
            connections = await conn.fetchval("SELECT count(*) FROM pg_stat_activity")
            
            # Check for issues
            long_queries = await conn.fetch("""
                SELECT pid, query FROM pg_stat_activity 
                WHERE (now() - query_start) > interval '10 minutes' AND state = 'active'
            """)
            
            await conn.close()
            
            status = "healthy"
            issues = []
            
            if long_queries:
                issues.append(f"{len(long_queries)} long-running queries (>10min)")
                status = "warning"
            
            if connections > 80:
                issues.append(f"High connection count: {connections}")
                status = "warning"
            
            # Send alert if issues found
            if issues and SLACK_WEBHOOK_URL:
                message = f"PostgreSQL {status.upper()}: " + ", ".join(issues)
                payload = {
                    "text": f":warning: ATS Dev PostgreSQL Alert",
                    "attachments": [{
                        "color": "warning",
                        "fields": [
                            {"title": "Status", "value": status, "short": True},
                            {"title": "Issues", "value": "\\n".join(issues), "short": False},
                            {"title": "Connections", "value": str(connections), "short": True},
                            {"title": "Timestamp", "value": datetime.now().strftime('%Y-%m-%d %H:%M:%S'), "short": True}
                        ]
                    }]
                }
                
                async with aiohttp.ClientSession() as session:
                    await session.post(SLACK_WEBHOOK_URL, json=payload)
                    logger.info(f"Sent Slack alert: {message}")
            
            logger.info(f"PostgreSQL check: {status}, connections: {connections}")
            
        except Exception as e:
            logger.error(f"PostgreSQL check failed: {e}")
            if SLACK_WEBHOOK_URL:
                payload = {
                    "text": f":red_circle: ATS Dev PostgreSQL CRITICAL ERROR: {e}",
                    "channel": "#ats-dev-alerts"
                }
                async with aiohttp.ClientSession() as session:
                    await session.post(SLACK_WEBHOOK_URL, json=payload)

    async def main():
        logger.info("Starting PostgreSQL Slack monitoring")
        while True:
            await check_postgres()
            await asyncio.sleep(300)  # Check every 5 minutes

    if __name__ == "__main__":
        asyncio.run(main())
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-slack-alerts
  namespace: ats-dev
  labels:
    app: postgres-slack-alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-slack-alerts
  template:
    metadata:
      labels:
        app: postgres-slack-alerts
    spec:
      containers:
      - name: monitor
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          pip install asyncpg aiohttp
          python /config/monitor.py
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: slack-credentials
              key: webhook_url
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: postgres-monitor-config
      restartPolicy: Always