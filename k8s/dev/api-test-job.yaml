apiVersion: batch/v1
kind: Job
metadata:
  name: api-test-job
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: api-test
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Installing required packages..."
          pip install fastapi uvicorn asyncpg psycopg2-binary

          echo "Creating API test script..."
          cat > api_test.py << 'EOF'
          import asyncio
          import asyncpg
          from fastapi import FastAPI, HTTPException
          from fastapi.responses import JSONResponse
          import uvicorn
          import os
          import sys

          # Create FastAPI app
          app = FastAPI(
              title="ATS API Test",
              description="Test API for database connectivity",
              version="0.1.0"
          )

          # Database connection parameters
          DB_HOST = "postgres"
          DB_PORT = 5432
          DB_USER = "postgres"
          DB_PASS = "postgres"
          DB_NAME = "ats_dev"

          async def get_db_connection():
              """Get a database connection"""
              try:
                  conn = await asyncpg.connect(
                      host=DB_HOST,
                      port=DB_PORT,
                      user=DB_USER,
                      password=DB_PASS,
                      database=DB_NAME
                  )
                  return conn
              except Exception as e:
                  print(f"Error connecting to database: {e}")
                  return None

          @app.get("/")
          async def root():
              """Root endpoint"""
              return {
                  "message": "API Test is running",
                  "status": "healthy"
              }

          @app.get("/health")
          async def health_check():
              """Health check endpoint"""
              return {
                  "status": "healthy",
                  "service": "api-test"
              }

          @app.get("/api/v1/db-check")
          async def db_check():
              """Check database connectivity"""
              conn = await get_db_connection()
              if not conn:
                  raise HTTPException(status_code=500, detail="Database connection failed")
              
              try:
                  # Check if instrument tables exist
                  tables = await conn.fetch(
                      "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name LIKE 'dev\\_%' ORDER BY table_name"
                  )
                  
                  table_info = []
                  for table in tables:
                      table_name = table['table_name']
                      count = await conn.fetchval(f"SELECT COUNT(*) FROM {table_name}")
                      table_info.append({
                          "table_name": table_name,
                          "row_count": count
                      })
                  
                  await conn.close()
                  return {
                      "status": "success",
                      "message": "Database connection successful",
                      "tables": table_info
                  }
              except Exception as e:
                  if conn:
                      await conn.close()
                  raise HTTPException(status_code=500, detail=f"Database query failed: {str(e)}")

          @app.get("/api/v1/instruments")
          async def get_instruments():
              """Get all instruments"""
              conn = await get_db_connection()
              if not conn:
                  raise HTTPException(status_code=500, detail="Database connection failed")
              
              try:
                  instruments = await conn.fetch(
                      "SELECT id, symbol, name, exchange, is_active, created_at, updated_at FROM dev_instruments ORDER BY symbol"
                  )
                  
                  result = []
                  for instrument in instruments:
                      result.append({
                          "id": instrument['id'],
                          "symbol": instrument['symbol'],
                          "name": instrument['name'],
                          "exchange": instrument['exchange'],
                          "is_active": instrument['is_active'],
                          "created_at": str(instrument['created_at']),
                          "updated_at": str(instrument['updated_at'])
                      })
                  
                  await conn.close()
                  return {
                      "status": "success",
                      "count": len(result),
                      "instruments": result
                  }
              except Exception as e:
                  if conn:
                      await conn.close()
                  raise HTTPException(status_code=500, detail=f"Failed to fetch instruments: {str(e)}")

          @app.get("/api/v1/instrument/{symbol}")
          async def get_instrument(symbol: str):
              """Get instrument by symbol"""
              conn = await get_db_connection()
              if not conn:
                  raise HTTPException(status_code=500, detail="Database connection failed")
              
              try:
                  # Get instrument
                  instrument = await conn.fetchrow(
                      "SELECT id, symbol, name, exchange, is_active, created_at, updated_at FROM dev_instruments WHERE symbol = $1",
                      symbol
                  )
                  
                  if not instrument:
                      await conn.close()
                      raise HTTPException(status_code=404, detail=f"Instrument with symbol {symbol} not found")
                  
                  # Get xrefs
                  xrefs = await conn.fetch(
                      """
                      SELECT ix.id, v.name as vendor, ix.vendor_symbol 
                      FROM dev_instrument_xrefs ix 
                      JOIN dev_vendors v ON ix.vendor_id = v.id 
                      WHERE ix.instrument_id = $1
                      """,
                      instrument['id']
                  )
                  
                  xref_list = []
                  for xref in xrefs:
                      xref_list.append({
                          "id": xref['id'],
                          "vendor": xref['vendor'],
                          "vendor_symbol": xref['vendor_symbol']
                      })
                  
                  result = {
                      "id": instrument['id'],
                      "symbol": instrument['symbol'],
                      "name": instrument['name'],
                      "exchange": instrument['exchange'],
                      "is_active": instrument['is_active'],
                      "created_at": str(instrument['created_at']),
                      "updated_at": str(instrument['updated_at']),
                      "xrefs": xref_list
                  }
                  
                  await conn.close()
                  return {
                      "status": "success",
                      "instrument": result
                  }
              except Exception as e:
                  if isinstance(e, HTTPException):
                      raise e
                  if conn:
                      await conn.close()
                  raise HTTPException(status_code=500, detail=f"Failed to fetch instrument: {str(e)}")

          # Run the API server
          if __name__ == "__main__":
              print("Starting API server...")
              uvicorn.run(app, host="0.0.0.0", port=8080)
          EOF

          echo "Starting API server..."
          python api_test.py &
          API_PID=$!

          # Keep the container running for testing
          echo "API server started with PID: $API_PID"
          echo "Container will stay alive for 1 hour for testing"
          sleep 3600
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8080
      restartPolicy: OnFailure
