apiVersion: batch/v1
kind: Job
metadata:
  name: phase3-historical-1995-2018-backfill
  namespace: ats-dev
  labels:
    app: ats-backfill
    phase: "3"
    scope: "historical-daily"
    timeframe: "1995-2018"
spec:
  ttlSecondsAfterFinished: 604800  # Keep for 7 days
  template:
    spec:
      containers:
      - name: phase3-historical-backfill
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "🚀 PHASE 3: Historical Daily Data Backfill (1995-2018)"
          echo "Filling the 24-year gap before existing 2019-2025 coverage"
          echo "Target: All 10k instruments for comprehensive historical coverage"
          echo ""
          
          echo "Installing required packages..."
          pip install asyncpg requests pandas aiohttp python-dotenv yfinance alpha_vantage
          
          # Verify installation
          python -c "import asyncpg, requests, pandas, aiohttp, yfinance; print('✅ All packages installed successfully')"
          
          mkdir -p /app/src/adapters
          mkdir -p /app/checkpoints
          
          echo "Creating Phase 3 historical data backfill system..."
          
          # Create historical data models
          cat > /app/src/models.py << 'EOF'
          from dataclasses import dataclass
          from datetime import date
          from typing import Optional
          
          @dataclass
          class HistoricalDailyBar:
              symbol: str
              date: date
              open: float
              high: float
              low: float
              close: float
              volume: int
              adjusted_close: float
              vendor: str
              quality_score: float = 0.8
              data_source_flags: Optional[dict] = None
          EOF
          
          # Create Yahoo Finance adapter for historical data
          cat > /app/src/adapters/yahoo_finance_adapter.py << 'EOF'
          import asyncio
          import yfinance as yf
          import pandas as pd
          from datetime import date, datetime
          from typing import List, Dict
          import logging
          import sys
          sys.path.append('/app/src')
          from models import HistoricalDailyBar
          
          logger = logging.getLogger(__name__)
          
          class YahooFinanceHistoricalAdapter:
              def __init__(self):
                  self.request_count = 0
                  self.total_bars_fetched = 0
                  self.rate_limit_delay = 0.1  # Conservative delay
              
              async def fetch_historical_daily_batch(self, symbols: List[str], start_date: date, end_date: date) -> Dict[str, List[HistoricalDailyBar]]:
                  """Fetch historical daily data for multiple symbols."""
                  logger.info(f"🔄 Yahoo Finance: Fetching {len(symbols)} symbols from {start_date} to {end_date}")
                  
                  results = {}
                  
                  # Process symbols sequentially to respect rate limits
                  for i, symbol in enumerate(symbols):
                      try:
                          bars = await self._fetch_single_symbol(symbol, start_date, end_date)
                          results[symbol] = bars
                          
                          if (i + 1) % 100 == 0:
                              logger.info(f"   Yahoo Finance: Processed {i + 1}/{len(symbols)} symbols")
                          
                          # Rate limiting
                          await asyncio.sleep(self.rate_limit_delay)
                          
                      except Exception as e:
                          logger.warning(f"Yahoo Finance: Failed to fetch {symbol}: {e}")
                          results[symbol] = []
                  
                  return results
              
              async def _fetch_single_symbol(self, symbol: str, start_date: date, end_date: date) -> List[HistoricalDailyBar]:
                  """Fetch historical data for single symbol using yfinance."""
                  try:
                      self.request_count += 1
                      
                      # Use yfinance to fetch historical data
                      ticker = yf.Ticker(symbol)
                      hist_data = await asyncio.to_thread(
                          ticker.history,
                          start=start_date.strftime('%Y-%m-%d'),
                          end=end_date.strftime('%Y-%m-%d'),
                          auto_adjust=False,
                          prepost=False
                      )
                      
                      if hist_data.empty:
                          return []
                      
                      bars = []
                      for idx, row in hist_data.iterrows():
                          bar_date = idx.date() if hasattr(idx, 'date') else idx
                          
                          # Ensure we have valid data
                          if pd.isna(row['Open']) or pd.isna(row['Close']):
                              continue
                          
                          bar = HistoricalDailyBar(
                              symbol=symbol,
                              date=bar_date,
                              open=float(row['Open']),
                              high=float(row['High']),
                              low=float(row['Low']),
                              close=float(row['Close']),
                              volume=int(row['Volume']) if not pd.isna(row['Volume']) else 0,
                              adjusted_close=float(row['Adj Close']),
                              vendor="yahoo_finance",
                              quality_score=0.8,
                              data_source_flags={
                                  'source_vendor': 'yahoo_finance',
                                  'api_version': 'yfinance',
                                  'historical_range': f"{start_date}-{end_date}"
                              }
                          )
                          bars.append(bar)
                      
                      self.total_bars_fetched += len(bars)
                      return bars
                      
                  except Exception as e:
                      logger.error(f"Error fetching {symbol} from Yahoo Finance: {e}")
                      return []
          EOF
          
          # Create Alpha Vantage adapter as backup
          cat > /app/src/adapters/alpha_vantage_adapter.py << 'EOF'
          import asyncio
          import aiohttp
          import pandas as pd
          from datetime import date, datetime
          from typing import List, Dict
          import logging
          import sys
          sys.path.append('/app/src')
          from models import HistoricalDailyBar
          
          logger = logging.getLogger(__name__)
          
          class AlphaVantageHistoricalAdapter:
              def __init__(self, api_key: str):
                  self.api_key = api_key
                  self.session = None
                  self.request_count = 0
                  self.total_bars_fetched = 0
                  self.rate_limit_delay = 12.0  # Alpha Vantage free tier: 5 calls per minute
              
              async def __aenter__(self):
                  self.session = aiohttp.ClientSession()
                  return self
              
              async def __aexit__(self, exc_type, exc_val, exc_tb):
                  if self.session:
                      await self.session.close()
              
              async def fetch_historical_daily_batch(self, symbols: List[str], start_date: date, end_date: date) -> Dict[str, List[HistoricalDailyBar]]:
                  """Fetch historical daily data for multiple symbols."""
                  logger.info(f"🔄 Alpha Vantage: Fetching {len(symbols)} symbols from {start_date} to {end_date}")
                  
                  results = {}
                  
                  # Process symbols very slowly due to strict rate limits
                  for i, symbol in enumerate(symbols):
                      try:
                          bars = await self._fetch_single_symbol(symbol, start_date, end_date)
                          results[symbol] = bars
                          
                          if (i + 1) % 10 == 0:
                              logger.info(f"   Alpha Vantage: Processed {i + 1}/{len(symbols)} symbols")
                          
                          # Strict rate limiting for free tier
                          await asyncio.sleep(self.rate_limit_delay)
                          
                      except Exception as e:
                          logger.warning(f"Alpha Vantage: Failed to fetch {symbol}: {e}")
                          results[symbol] = []
                  
                  return results
              
              async def _fetch_single_symbol(self, symbol: str, start_date: date, end_date: date) -> List[HistoricalDailyBar]:
                  """Fetch historical data for single symbol using Alpha Vantage."""
                  try:
                      self.request_count += 1
                      
                      url = "https://www.alphavantage.co/query"
                      params = {
                          'function': 'TIME_SERIES_DAILY_ADJUSTED',
                          'symbol': symbol,
                          'outputsize': 'full',
                          'apikey': self.api_key
                      }
                      
                      async with self.session.get(url, params=params) as response:
                          if response.status == 200:
                              data = await response.json()
                              
                              if 'Time Series (Daily)' not in data:
                                  logger.warning(f"Alpha Vantage: No time series data for {symbol}")
                                  return []
                              
                              time_series = data['Time Series (Daily)']
                              bars = []
                              
                              for date_str, daily_data in time_series.items():
                                  bar_date = datetime.strptime(date_str, '%Y-%m-%d').date()
                                  
                                  # Filter by date range
                                  if start_date <= bar_date <= end_date:
                                      bar = HistoricalDailyBar(
                                          symbol=symbol,
                                          date=bar_date,
                                          open=float(daily_data['1. open']),
                                          high=float(daily_data['2. high']),
                                          low=float(daily_data['3. low']),
                                          close=float(daily_data['4. close']),
                                          volume=int(daily_data['6. volume']),
                                          adjusted_close=float(daily_data['5. adjusted close']),
                                          vendor="alpha_vantage",
                                          quality_score=0.9,  # Higher quality for Alpha Vantage
                                          data_source_flags={
                                              'source_vendor': 'alpha_vantage',
                                              'api_version': 'v1',
                                              'function': 'TIME_SERIES_DAILY_ADJUSTED'
                                          }
                                      )
                                      bars.append(bar)
                              
                              self.total_bars_fetched += len(bars)
                              return sorted(bars, key=lambda x: x.date)
                          else:
                              logger.warning(f"Alpha Vantage API error for {symbol}: HTTP {response.status}")
                              return []
                              
                  except Exception as e:
                      logger.error(f"Error fetching {symbol} from Alpha Vantage: {e}")
                      return []
          EOF
          
          # Create Phase 3 historical backfill script
          cat > /app/phase3_historical_backfill.py << 'EOF'
          import os
          import sys
          import asyncio
          import asyncpg
          import pandas as pd
          import logging
          import json
          from datetime import datetime, date, timedelta
          from typing import List, Dict, Any, Tuple
          from pathlib import Path
          
          # Add src to path
          sys.path.insert(0, '/app/src')
          
          from adapters.yahoo_finance_adapter import YahooFinanceHistoricalAdapter
          from adapters.alpha_vantage_adapter import AlphaVantageHistoricalAdapter
          
          # Configure logging
          logging.basicConfig(
              level=logging.INFO,
              format='%(asctime)s - %(name)s - %(levelname)s - %(message)s'
          )
          logger = logging.getLogger("phase3_historical_backfill")
          
          class Phase3HistoricalBackfillJob:
              def __init__(self):
                  self.alpha_vantage_api_key = "demo"  # Use demo key or set real key
                  self.checkpoint_file = "/app/checkpoints/phase3_historical_checkpoint.json"
                  
                  # Target: Fill the gap between 1995-2018
                  self.target_start_date = date(1995, 1, 1)
                  self.target_end_date = date(2018, 12, 31)
                  
                  # Batch configuration for historical data
                  self.batch_size = 50  # Smaller batches for historical data
                  self.year_chunks = 5   # Process 5 years at a time
                  
                  # Progress tracking
                  self.progress = {
                      'phase': 3,
                      'target_description': 'Historical daily data backfill (1995-2018)',
                      'start_time': None,
                      'instruments_processed': 0,
                      'instruments_total': 0,
                      'years_processed': 0,
                      'years_total': 24,  # 1995-2018
                      'vendor_stats': {
                          'yahoo_finance': {
                              'instruments_attempted': 0,
                              'instruments_successful': 0,
                              'bars_fetched': 0,
                              'bars_stored': 0,
                              'errors': 0
                          },
                          'alpha_vantage': {
                              'instruments_attempted': 0,
                              'instruments_successful': 0,
                              'bars_fetched': 0,
                              'bars_stored': 0,
                              'errors': 0
                          }
                      },
                      'errors': [],
                      'completion_estimate': None
                  }
                  
                  self.load_checkpoint()
              
              def save_checkpoint(self):
                  try:
                      checkpoint_data = {
                          'progress': self.progress,
                          'timestamp': datetime.now().isoformat(),
                          'phase3_summary': {
                              'completion_percentage': (self.progress['years_processed'] / self.progress['years_total'] * 100) if self.progress['years_total'] > 0 else 0,
                              'total_bars_stored': (
                                  self.progress['vendor_stats']['yahoo_finance']['bars_stored'] + 
                                  self.progress['vendor_stats']['alpha_vantage']['bars_stored']
                              )
                          }
                      }
                      with open(self.checkpoint_file, 'w') as f:
                          json.dump(checkpoint_data, f, indent=2, default=str)
                      
                      yf_bars = self.progress['vendor_stats']['yahoo_finance']['bars_stored']
                      av_bars = self.progress['vendor_stats']['alpha_vantage']['bars_stored']
                      years_done = self.progress['years_processed']
                      years_total = self.progress['years_total']
                      
                      logger.info(f"📊 PHASE 3 CHECKPOINT: {years_done}/{years_total} years processed | "
                                 f"YF:{yf_bars:,} AV:{av_bars:,} bars stored")
                  except Exception as e:
                      logger.error(f"Failed to save checkpoint: {e}")
              
              def load_checkpoint(self):
                  try:
                      if Path(self.checkpoint_file).exists():
                          with open(self.checkpoint_file, 'r') as f:
                              data = json.load(f)
                          self.progress = data.get('progress', self.progress)
                          logger.info(f"📂 Phase 3 checkpoint loaded: {self.progress['years_processed']} years processed")
                  except Exception as e:
                      logger.error(f"Failed to load checkpoint: {e}")
              
              async def get_database_connection(self):
                  return await asyncpg.connect(
                      host=os.getenv('DB_HOST', 'postgres'),
                      port=int(os.getenv('DB_PORT', 5432)),
                      user=os.getenv('DB_USER', 'postgres'),
                      password=os.getenv('DB_PASSWORD', 'dev_password'),
                      database=os.getenv('DB_NAME', 'dev_db')
                  )
              
              async def get_instruments_missing_historical_data(self) -> List[Tuple[int, str]]:
                  """Get instruments that need historical data for 1995-2018 period."""
                  try:
                      conn = await self.get_database_connection()
                      try:
                          # Find instruments that don't have data before 2019
                          instruments = await conn.fetch("""
                              SELECT DISTINCT i.id, i.symbol 
                              FROM dev_instruments i
                              WHERE i.is_active = true
                              AND NOT EXISTS (
                                  SELECT 1 FROM dev_daily_prices_tiingo dt 
                                  WHERE dt.instrument_id = i.id 
                                  AND dt.date < '2019-01-01'
                              )
                              ORDER BY i.symbol
                          """)
                          return [(row['id'], row['symbol']) for row in instruments]
                      finally:
                          await conn.close()
                  except Exception as e:
                      logger.error(f"Failed to get instruments needing historical data: {e}")
                      return []
              
              async def run_phase3_backfill(self):
                  """Run Phase 3: Historical daily data backfill (1995-2018)."""
                  self.progress['start_time'] = datetime.now().isoformat()
                  
                  logger.info("🎯 STARTING PHASE 3: HISTORICAL DAILY DATA BACKFILL (1995-2018)")
                  logger.info("=" * 80)
                  logger.info(f"📊 Target: Fill 24-year gap before existing 2019-2025 coverage")
                  logger.info(f"📅 Date range: {self.target_start_date} to {self.target_end_date}")
                  logger.info(f"🔄 Primary source: Yahoo Finance (free)")
                  logger.info(f"🔄 Backup source: Alpha Vantage (rate limited)")
                  
                  # Get instruments needing historical data
                  logger.info("📋 Finding instruments missing historical data...")
                  instruments = await self.get_instruments_missing_historical_data()
                  
                  if not instruments:
                      logger.info("✅ All instruments already have historical data!")
                      return True
                  
                  self.progress['instruments_total'] = len(instruments)
                  logger.info(f"✅ Found {len(instruments):,} instruments needing historical data")
                  
                  # Process in year chunks
                  current_start = self.target_start_date
                  year_chunk_number = 0
                  
                  while current_start <= self.target_end_date:
                      year_chunk_number += 1
                      current_end = min(
                          date(current_start.year + self.year_chunks - 1, 12, 31),
                          self.target_end_date
                      )
                      
                      logger.info(f"📅 Processing year chunk {year_chunk_number}: {current_start.year}-{current_end.year}")
                      
                      # Extract symbols from instruments
                      symbols = [symbol for _, symbol in instruments]
                      
                      try:
                          # Use Yahoo Finance as primary source
                          yahoo_adapter = YahooFinanceHistoricalAdapter()
                          yahoo_results = await yahoo_adapter.fetch_historical_daily_batch(
                              symbols, current_start, current_end
                          )
                          
                          # Store Yahoo Finance results
                          await self._store_historical_batch_results(yahoo_results, "yahoo_finance")
                          
                          # For critical symbols, also try Alpha Vantage as backup (sample only)
                          if len(symbols) > 100:
                              # Sample subset for Alpha Vantage due to rate limits
                              critical_symbols = symbols[:10]  # Top 10 symbols only
                              
                              try:
                                  async with AlphaVantageHistoricalAdapter(self.alpha_vantage_api_key) as alpha_adapter:
                                      alpha_results = await alpha_adapter.fetch_historical_daily_batch(
                                          critical_symbols, current_start, current_end
                                      )
                                      await self._store_historical_batch_results(alpha_results, "alpha_vantage")
                              except Exception as e:
                                  logger.warning(f"Alpha Vantage backup failed: {e}")
                          
                          self.progress['years_processed'] += self.year_chunks
                          
                          # Save checkpoint after each year chunk
                          self.save_checkpoint()
                          
                      except Exception as e:
                          error_msg = f"Error processing year chunk {current_start.year}-{current_end.year}: {e}"
                          logger.error(error_msg)
                          self.progress['errors'].append(error_msg)
                      
                      current_start = date(current_end.year + 1, 1, 1)
                  
                  # Final report
                  await self.generate_phase3_final_report()
                  return True
              
              async def _store_historical_batch_results(self, results: Dict[str, List], vendor: str):
                  """Store historical batch results for all symbols."""
                  
                  total_bars_stored = 0
                  successful_instruments = 0
                  
                  for symbol, bars in results.items():
                      if bars:
                          try:
                              stored_count = await self._store_historical_daily_data(symbol, bars, vendor)
                              total_bars_stored += stored_count
                              
                              if stored_count > 0:
                                  successful_instruments += 1
                              
                              logger.debug(f"     ✅ {symbol}: {len(bars)} {vendor} bars stored")
                              
                          except Exception as e:
                              logger.error(f"Failed to store historical data for {symbol}: {e}")
                              self.progress['vendor_stats'][vendor]['errors'] += 1
                  
                  # Update vendor stats
                  self.progress['vendor_stats'][vendor]['instruments_successful'] += successful_instruments
                  self.progress['vendor_stats'][vendor]['bars_stored'] += total_bars_stored
                  
                  logger.info(f"   ✅ {vendor}: {total_bars_stored:,} historical bars stored ({successful_instruments} instruments)")
              
              async def _store_historical_daily_data(self, symbol: str, bars: List, vendor: str) -> int:
                  """Store historical daily data in appropriate table."""
                  if not bars:
                      return 0
                  
                  try:
                      conn = await self.get_database_connection()
                      try:
                          # Get instrument ID
                          instrument_id = await conn.fetchval(
                              "SELECT id FROM dev_instruments WHERE symbol = $1 AND is_active = true",
                              symbol
                          )
                          
                          if not instrument_id:
                              logger.debug(f"Instrument {symbol} not found in database")
                              return 0
                          
                          # Determine target table based on vendor
                          if vendor == "yahoo_finance":
                              table_name = "dev_daily_prices_tiingo"  # Store Yahoo Finance data in Tiingo table for consolidation
                          elif vendor == "alpha_vantage":
                              table_name = "dev_daily_prices_polygon"  # Store Alpha Vantage data in Polygon table for consolidation
                          else:
                              table_name = "dev_daily_prices"  # Default table
                          
                          # Prepare records
                          records = []
                          for bar in bars:
                              records.append((
                                  bar.date,
                                  instrument_id,
                                  bar.open,
                                  bar.high,
                                  bar.low,
                                  bar.close,
                                  bar.volume,
                                  bar.adjusted_close
                              ))
                          
                          # Batch insert with conflict resolution
                          await conn.executemany(f"""
                              INSERT INTO {table_name}
                              (date, instrument_id, open, high, low, close, volume, adjusted_close)
                              VALUES ($1, $2, $3, $4, $5, $6, $7, $8)
                              ON CONFLICT (date, instrument_id) DO UPDATE SET
                                  open = EXCLUDED.open,
                                  high = EXCLUDED.high,
                                  low = EXCLUDED.low,
                                  close = EXCLUDED.close,
                                  volume = EXCLUDED.volume,
                                  adjusted_close = EXCLUDED.adjusted_close
                          """, records)
                          
                          return len(records)
                      
                      finally:
                          await conn.close()
                  
                  except Exception as e:
                      logger.error(f"Failed to store historical daily data for {symbol}: {e}")
                      return 0
              
              async def generate_phase3_final_report(self):
                  """Generate comprehensive Phase 3 final report."""
                  logger.info("🎉 PHASE 3 COMPLETE: HISTORICAL DAILY DATA BACKFILL (1995-2018)")
                  logger.info("=" * 80)
                  
                  # Execution summary
                  start_time = datetime.fromisoformat(self.progress['start_time'])
                  duration = datetime.now() - start_time
                  
                  logger.info(f"⏱️  PHASE 3 EXECUTION SUMMARY:")
                  logger.info(f"   Duration: {duration}")
                  logger.info(f"   Years processed: {self.progress['years_processed']}")
                  logger.info(f"   Years total: {self.progress['years_total']}")
                  
                  # Vendor statistics
                  yf_stats = self.progress['vendor_stats']['yahoo_finance']
                  av_stats = self.progress['vendor_stats']['alpha_vantage']
                  
                  logger.info(f"🔄 VENDOR PERFORMANCE SUMMARY:")
                  logger.info(f"   Yahoo Finance instruments: {yf_stats['instruments_successful']:,}")
                  logger.info(f"   Yahoo Finance bars stored: {yf_stats['bars_stored']:,}")
                  logger.info(f"   Yahoo Finance errors: {yf_stats['errors']}")
                  logger.info(f"")
                  logger.info(f"   Alpha Vantage instruments: {av_stats['instruments_successful']:,}")
                  logger.info(f"   Alpha Vantage bars stored: {av_stats['bars_stored']:,}")
                  logger.info(f"   Alpha Vantage errors: {av_stats['errors']}")
                  
                  # Historical coverage summary
                  total_bars = yf_stats['bars_stored'] + av_stats['bars_stored']
                  logger.info(f"📈 HISTORICAL COVERAGE SUMMARY:")
                  logger.info(f"   Total historical bars added: {total_bars:,}")
                  logger.info(f"   Coverage period: 1995-2018 (24 years)")
                  logger.info(f"   Combined with existing: 1995-2025 (30 years complete)")
                  
                  logger.info("=" * 80)
                  logger.info("🎯 PHASE 3 RESULT: 30-year daily coverage complete (1995-2025)")
                  logger.info("📋 READY FOR: Enhanced minute data strategies")
          
          async def main():
              logger.info("🚀 Starting Phase 3: Historical Daily Data Backfill (1995-2018)")
              
              job = Phase3HistoricalBackfillJob()
              success = await job.run_phase3_backfill()
              
              if success:
                  logger.info("✅ PHASE 3 COMPLETED SUCCESSFULLY!")
                  logger.info("🎯 30-year daily coverage now complete!")
              else:
                  logger.error("❌ PHASE 3 FAILED!")
                  exit(1)
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          cd /app
          python phase3_historical_backfill.py
          
          echo "Phase 3: Historical daily data backfill (1995-2018) completed!"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        resources:
          requests:
            memory: "8Gi"
            cpu: "4000m"
          limits:
            memory: "16Gi"
            cpu: "8000m"
        volumeMounts:
        - name: checkpoint-storage
          mountPath: /app/checkpoints
      volumes:
      - name: checkpoint-storage
        emptyDir: {}
      restartPolicy: OnFailure
  activeDeadlineSeconds: 172800  # 48 hours maximum