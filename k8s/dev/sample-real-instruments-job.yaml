apiVersion: batch/v1
kind: Job
metadata:
  name: sample-real-instruments
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 86400  # Keep job for 24 hours after completion
  template:
    spec:
      containers:
      - name: sample-real-instruments
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Installing required packages..."
          pip install asyncpg requests
          
          echo "Creating working directory..."
          mkdir -p /app
          
          echo "Creating real instrument sampling script..."
          cat > /app/sample_instruments.py << 'EOF'
          import os
          import asyncpg
          import asyncio
          import requests
          import json
          import logging
          from datetime import datetime, date
          from typing import List, Dict, Optional
          
          # Configure logging
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("sample_instruments")
          
          # API Configuration
          EODHD_API_KEY = "68aa0c7d2fe831.67386369"
          POLYGON_API_KEY = "wfrcZNX3ZJJt55Or_CmBXda8G8e8tABD"
          
          async def get_real_instrument_samples():
              """Sample 10 real instruments with diverse exchange histories"""
              
              # Connect to database
              conn = await asyncpg.connect(
                  host=os.getenv('DB_HOST', 'postgres'),
                  port=int(os.getenv('DB_PORT', 5432)),
                  user=os.getenv('DB_USER', 'postgres'),
                  password=os.getenv('DB_PASSWORD', 'dev_password'),
                  database=os.getenv('DB_NAME', 'dev_db')
              )
              
              logger.info("🔍 Sampling real instruments for test cases...")
              
              # Sample diverse instruments from existing data
              # Start with major NASDAQ stocks
              nasdaq_samples = await conn.fetch("""
                  SELECT code, name, exchange, type, is_delisted, 'major_nasdaq' as category
                  FROM dev_instrument_eodhd 
                  WHERE exchange = 'NASDAQ' 
                    AND type = 'Common Stock' 
                    AND is_delisted = false
                    AND code IN ('AAPL', 'MSFT', 'GOOGL', 'AMZN', 'TSLA')
                  LIMIT 3
              """)
              
              # Get major NYSE stocks
              nyse_samples = await conn.fetch("""
                  SELECT code, name, exchange, type, is_delisted, 'major_nyse' as category
                  FROM dev_instrument_eodhd 
                  WHERE exchange = 'NYSE' 
                    AND type = 'Common Stock' 
                    AND is_delisted = false
                    AND code IN ('JPM', 'JNJ', 'WMT', 'PG', 'HD')
                  LIMIT 2
              """)
              
              # Get delisted stocks
              delisted_samples = await conn.fetch("""
                  SELECT code, name, exchange, type, is_delisted, 'delisted' as category
                  FROM dev_instrument_eodhd 
                  WHERE is_delisted = true 
                    AND type = 'Common Stock'
                  ORDER BY RANDOM()
                  LIMIT 2
              """)
              
              # Get stocks with symbol changes
              symbol_change_samples = await conn.fetch("""
                  SELECT DISTINCT e.code, e.name, e.exchange, e.type, e.is_delisted, 'symbol_change' as category
                  FROM dev_instrument_eodhd e
                  JOIN dev_symbol_changes sc ON (e.code = sc.new_symbol OR e.code = sc.old_symbol)
                  WHERE e.type = 'Common Stock'
                  LIMIT 2
              """)
              
              # Get OTC stocks
              otc_samples = await conn.fetch("""
                  SELECT code, name, exchange, type, is_delisted, 'otc' as category
                  FROM dev_instrument_eodhd 
                  WHERE exchange IN ('OTC', 'OTCMKTS', 'PINK')
                    AND type = 'Common Stock'
                  ORDER BY RANDOM()
                  LIMIT 1
              """)
              
              # Combine all samples
              samples = list(nasdaq_samples) + list(nyse_samples) + list(delisted_samples) + list(symbol_change_samples) + list(otc_samples)
              
              logger.info(f"✅ Found {len(samples)} sample instruments")
              
              # Print samples for test case creation
              for sample in samples:
                  logger.info(f"📊 {sample['category'].upper()}: {sample['code']} - {sample['name'][:50]}... ({sample['exchange']}, delisted: {sample['is_delisted']})")
              
              # Now let's fetch additional data from APIs for these samples
              sample_codes = [s['code'] for s in samples]
              
              logger.info("\n🔍 Fetching additional data from APIs...")
              
              # Fetch from EODHD API for detailed data
              eodhd_details = {}
              for code in sample_codes[:5]:  # Sample first 5 to avoid rate limits
                  try:
                      # Get fundamental data from EODHD
                      url = f"https://eodhd.com/api/fundamentals/{code}.US"
                      params = {
                          'api_token': EODHD_API_KEY,
                          'fmt': 'json'
                      }
                      
                      response = requests.get(url, params=params, timeout=10)
                      if response.status_code == 200:
                          data = response.json()
                          eodhd_details[code] = {
                              'general': data.get('General', {}),
                              'exchange': data.get('General', {}).get('Exchange'),
                              'isin': data.get('General', {}).get('ISIN'),
                              'cusip': data.get('General', {}).get('CUSIP'),
                              'listing_date': data.get('General', {}).get('IPODate'),
                              'delisting_date': data.get('General', {}).get('DelistingDate'),
                          }
                          logger.info(f"✅ EODHD data for {code}: ISIN={data.get('General', {}).get('ISIN')}, CUSIP={data.get('General', {}).get('CUSIP')}")
                      else:
                          logger.warning(f"⚠️  No EODHD fundamental data for {code}")
                          
                  except Exception as e:
                      logger.warning(f"⚠️  Error fetching EODHD data for {code}: {e}")
              
              # Fetch from Polygon for comparison
              polygon_details = {}
              for code in sample_codes[:3]:  # Even fewer for Polygon to avoid limits
                  try:
                      # Get ticker details from Polygon
                      url = f"https://api.polygon.io/v3/reference/tickers/{code}"
                      params = {'apikey': POLYGON_API_KEY}
                      
                      response = requests.get(url, params=params, timeout=10)
                      if response.status_code == 200:
                          data = response.json()
                          results = data.get('results', {})
                          polygon_details[code] = {
                              'name': results.get('name'),
                              'market': results.get('market'),
                              'primary_exchange': results.get('primary_exchange'),
                              'type': results.get('type'),
                              'active': results.get('active'),
                              'currency_name': results.get('currency_name'),
                              'list_date': results.get('list_date'),
                              'delisted_utc': results.get('delisted_utc'),
                          }
                          logger.info(f"✅ Polygon data for {code}: Exchange={results.get('primary_exchange')}, Active={results.get('active')}")
                      else:
                          logger.warning(f"⚠️  No Polygon data for {code}")
                          
                  except Exception as e:
                      logger.warning(f"⚠️  Error fetching Polygon data for {code}: {e}")
              
              # Create detailed test cases
              logger.info("\n📋 CREATING TEST CASE DATA...")
              
              test_cases = []
              for sample in samples:
                  code = sample['code']
                  
                  test_case = {
                      'symbol': code,
                      'name': sample['name'],
                      'category': sample['category'],
                      'eodhd_exchange': sample['exchange'],
                      'is_delisted': sample['is_delisted'],
                      'eodhd_details': eodhd_details.get(code, {}),
                      'polygon_details': polygon_details.get(code, {}),
                      'expected_scenarios': []
                  }
                  
                  # Add expected scenarios based on category
                  if sample['category'] == 'major_nasdaq':
                      test_case['expected_scenarios'] = [
                          'single_exchange_listing',
                          'long_term_stability',
                          'has_fundamentals',
                          'cusip_isin_available'
                      ]
                  elif sample['category'] == 'major_nyse':
                      test_case['expected_scenarios'] = [
                          'single_exchange_listing',
                          'nyse_primary_listing',
                          'institutional_grade',
                          'full_reference_data'
                      ]
                  elif sample['category'] == 'delisted':
                      test_case['expected_scenarios'] = [
                          'delisting_lifecycle',
                          'end_date_populated',
                          'historical_trading_only',
                          'bankruptcy_or_acquisition'
                      ]
                  elif sample['category'] == 'symbol_change':
                      test_case['expected_scenarios'] = [
                          'symbol_migration',
                          'corporate_action',
                          'reference_data_update',
                          'historical_continuity'
                      ]
                  elif sample['category'] == 'otc':
                      test_case['expected_scenarios'] = [
                          'exchange_downgrade',
                          'otc_trading',
                          'limited_liquidity',
                          'potential_delisting_risk'
                      ]
                  
                  test_cases.append(test_case)
              
              # Save test cases to database for later use
              logger.info("\n💾 Saving test cases to database...")
              
              await conn.execute("""
                  CREATE TABLE IF NOT EXISTS dev_test_instrument_samples (
                      id SERIAL PRIMARY KEY,
                      symbol VARCHAR(50) NOT NULL,
                      name TEXT,
                      category VARCHAR(50),
                      eodhd_exchange VARCHAR(20),
                      is_delisted BOOLEAN,
                      eodhd_details JSONB,
                      polygon_details JSONB,
                      expected_scenarios JSONB,
                      created_at TIMESTAMP DEFAULT now()
                  )
              """)
              
              # Clear existing test cases
              await conn.execute("DELETE FROM dev_test_instrument_samples")
              
              # Insert new test cases
              for case in test_cases:
                  await conn.execute("""
                      INSERT INTO dev_test_instrument_samples
                      (symbol, name, category, eodhd_exchange, is_delisted, 
                       eodhd_details, polygon_details, expected_scenarios)
                      VALUES ($1, $2, $3, $4, $5, $6, $7, $8)
                  """, 
                  case['symbol'], case['name'], case['category'], 
                  case['eodhd_exchange'], case['is_delisted'],
                  json.dumps(case['eodhd_details']),
                  json.dumps(case['polygon_details']),
                  json.dumps(case['expected_scenarios']))
              
              logger.info(f"✅ Saved {len(test_cases)} test cases to database")
              
              # Display comprehensive summary
              logger.info("\n" + "="*80)
              logger.info("🎯 REAL INSTRUMENT TEST CASE SAMPLING COMPLETED!")
              logger.info("="*80)
              
              for case in test_cases:
                  logger.info(f"\n📊 TEST CASE: {case['symbol']} ({case['category'].upper()})")
                  logger.info(f"   Name: {case['name']}")
                  logger.info(f"   EODHD Exchange: {case['eodhd_exchange']}")
                  logger.info(f"   Is Delisted: {case['is_delisted']}")
                  
                  if case['eodhd_details']:
                      logger.info(f"   EODHD ISIN: {case['eodhd_details'].get('isin', 'N/A')}")
                      logger.info(f"   EODHD CUSIP: {case['eodhd_details'].get('cusip', 'N/A')}")
                      logger.info(f"   Listing Date: {case['eodhd_details'].get('listing_date', 'N/A')}")
                  
                  if case['polygon_details']:
                      logger.info(f"   Polygon Exchange: {case['polygon_details'].get('primary_exchange', 'N/A')}")
                      logger.info(f"   Polygon Active: {case['polygon_details'].get('active', 'N/A')}")
                  
                  logger.info(f"   Expected Scenarios: {', '.join(case['expected_scenarios'])}")
              
              logger.info("\n✅ Ready for comprehensive multi-vendor instrument population testing!")
              
              await conn.close()
          
          if __name__ == "__main__":
              asyncio.run(get_real_instrument_samples())
          EOF
          
          echo "Running real instrument sampling..."
          mkdir -p /app
          cd /app
          python sample_instruments.py
          
          echo "Real instrument sampling completed!"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"  
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      restartPolicy: OnFailure