apiVersion: batch/v1
kind: Job
metadata:
  name: instrument-polygon-backfill
  namespace: ats-dev
  labels:
    app: ats-api
    component: secmaster
    environment: dev
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 7200  # 2 hours timeout for full backfill
  template:
    spec:
      imagePullSecrets:
      - name: registry-credentials
      containers:
      - name: instrument-polygon-updater
        image: dragonflyer762/ats-genai:dev-latest
        command: ["python", "-m", "src.secmaster.populate_instrument_polygon", "--environment", "dev"]
        env:
        - name: PYTHONPATH
          value: "/app/src"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      restartPolicy: Never
