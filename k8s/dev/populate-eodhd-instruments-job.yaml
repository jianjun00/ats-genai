apiVersion: batch/v1
kind: Job
metadata:
  name: populate-eodhd-instruments
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 86400  # Keep job for 24 hours after completion
  template:
    spec:
      containers:
      - name: populate-eodhd-instruments
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Installing required packages..."
          pip install asyncpg pandas requests
          
          echo "Creating working directory..."
          mkdir -p /app
          
          echo "Creating EODHD instrument population script..."
          cat > /app/populate_eodhd_instruments.py << 'EOF'
          import os
          import asyncpg
          import asyncio
          import logging
          import requests
          import json
          from datetime import datetime, date
          from typing import Set, Dict, List, Tuple, Optional
          
          # Configure logging
          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(name)s - %(levelname)s - %(message)s')
          logger = logging.getLogger("populate_eodhd_instruments")
          
          # EODHD API Configuration
          EODHD_API_KEY = "68aa0c7d2fe831.67386369"
          EODHD_BASE_URL = "https://eodhd.com/api"
          
          # Filter criteria for quality instruments
          EXCLUDED_TYPES = {'FUND', 'ETF', 'TRUST'}  # Focus on stocks only
          EXCLUDED_EXCHANGES = {'PINK', 'OTCGREY', 'OTCCE'}  # Exclude low-quality OTC
          
          def json_serializer(obj):
              """JSON serializer for datetime objects"""
              if isinstance(obj, (datetime, date)):
                  return obj.isoformat()
              raise TypeError(f"Object of type {type(obj)} is not JSON serializable")
          
          async def create_eodhd_instruments_table(conn: asyncpg.Connection):
              """Create table to store EODHD instrument data"""
              logger.info("Creating dev_instrument_eodhd table...")
              
              create_table_sql = """
                  CREATE TABLE IF NOT EXISTS dev_instrument_eodhd (
                      id SERIAL PRIMARY KEY,
                      code VARCHAR(50) NOT NULL,
                      name TEXT,
                      country VARCHAR(10),
                      exchange VARCHAR(20),
                      currency VARCHAR(10),
                      type VARCHAR(20),
                      isin VARCHAR(50),
                      is_delisted BOOLEAN DEFAULT false,
                      raw_data JSONB,
                      created_at TIMESTAMP DEFAULT now(),
                      updated_at TIMESTAMP DEFAULT now(),
                      UNIQUE(code, exchange)
                  );
                  
                  CREATE INDEX IF NOT EXISTS idx_eodhd_code ON dev_instrument_eodhd(code);
                  CREATE INDEX IF NOT EXISTS idx_eodhd_exchange ON dev_instrument_eodhd(exchange);
                  CREATE INDEX IF NOT EXISTS idx_eodhd_type ON dev_instrument_eodhd(type);
                  CREATE INDEX IF NOT EXISTS idx_eodhd_delisted ON dev_instrument_eodhd(is_delisted);
              """
              
              await conn.execute(create_table_sql)
              logger.info("✅ dev_instrument_eodhd table created successfully")
          
          async def fetch_us_instruments():
              """Fetch all US instruments from EODHD including delisted"""
              logger.info("Fetching US instruments from EODHD...")
              
              url = f"{EODHD_BASE_URL}/exchange-symbol-list/US"
              params = {
                  'api_token': EODHD_API_KEY,
                  'fmt': 'json'
              }
              
              try:
                  response = requests.get(url, params=params, timeout=60)
                  response.raise_for_status()
                  
                  instruments = response.json()
                  logger.info(f"✅ Retrieved {len(instruments)} US instruments from EODHD")
                  
                  return instruments
                  
              except requests.exceptions.RequestException as e:
                  logger.error(f"❌ Failed to fetch US instruments: {e}")
                  raise
          
          async def fetch_symbol_changes():
              """Fetch symbol change history from EODHD"""
              logger.info("Fetching symbol change history from EODHD...")
              
              url = f"{EODHD_BASE_URL}/symbol-change-history"
              params = {
                  'api_token': EODHD_API_KEY,
                  'fmt': 'json'
              }
              
              try:
                  response = requests.get(url, params=params, timeout=30)
                  response.raise_for_status()
                  
                  changes = response.json()
                  logger.info(f"✅ Retrieved {len(changes)} symbol changes from EODHD")
                  
                  return changes
                  
              except requests.exceptions.RequestException as e:
                  logger.error(f"❌ Failed to fetch symbol changes: {e}")
                  return []
          
          async def populate_eodhd_instruments(conn: asyncpg.Connection, instruments: List[dict]):
              """Populate EODHD instruments table with filtering"""
              logger.info("Processing and filtering EODHD instruments...")
              
              # Filter instruments
              filtered_instruments = []
              stats = {
                  'total': len(instruments),
                  'stocks': 0,
                  'funds_excluded': 0,
                  'otc_excluded': 0,
                  'valid': 0
              }
              
              for instrument in instruments:
                  code = instrument.get('Code', '').strip()
                  name = instrument.get('Name', '').strip()
                  country = instrument.get('Country', '').strip()
                  exchange = instrument.get('Exchange', '').strip()
                  currency = instrument.get('Currency', '').strip()
                  inst_type = instrument.get('Type', '').strip()
                  isin = instrument.get('Isin')
                  
                  if not code or not name:
                      continue
                  
                  # Filter by type - focus on stocks
                  if inst_type in EXCLUDED_TYPES:
                      stats['funds_excluded'] += 1
                      continue
                  
                  # Filter by exchange - exclude low-quality OTC
                  if exchange in EXCLUDED_EXCHANGES:
                      stats['otc_excluded'] += 1
                      continue
                  
                  if inst_type == 'Common Stock':
                      stats['stocks'] += 1
                  
                  # Check if likely delisted (common patterns)
                  is_delisted = (
                      code.endswith('Q') or  # Bankruptcy
                      '.PK' in code or       # Pink sheets
                      'DEFUNCT' in name.upper() or
                      'LIQUIDAT' in name.upper() or
                      'BANKRUPT' in name.upper()
                  )
                  
                  filtered_instruments.append({
                      'code': code,
                      'name': name,
                      'country': country,
                      'exchange': exchange,
                      'currency': currency,
                      'type': inst_type,
                      'isin': isin,
                      'is_delisted': is_delisted,
                      'raw_data': json.dumps(instrument, default=json_serializer)
                  })
                  
                  stats['valid'] += 1
              
              logger.info(f"📊 FILTERING RESULTS:")
              logger.info(f"   Total instruments: {stats['total']:,}")
              logger.info(f"   Valid stocks: {stats['stocks']:,}")
              logger.info(f"   Funds/ETFs excluded: {stats['funds_excluded']:,}")
              logger.info(f"   Low-quality OTC excluded: {stats['otc_excluded']:,}")
              logger.info(f"   Final valid instruments: {stats['valid']:,}")
              
              if not filtered_instruments:
                  logger.warning("No valid instruments to insert!")
                  return 0
              
              # Insert in batches
              batch_size = 1000
              total_inserted = 0
              
              logger.info(f"Inserting {len(filtered_instruments)} instruments in batches of {batch_size}...")
              
              for i in range(0, len(filtered_instruments), batch_size):
                  batch = filtered_instruments[i:i + batch_size]
                  batch_num = i // batch_size + 1
                  
                  try:
                      # Prepare batch data for insertion
                      batch_data = [(
                          inst['code'],
                          inst['name'],
                          inst['country'],
                          inst['exchange'],
                          inst['currency'],
                          inst['type'],
                          inst['isin'],
                          inst['is_delisted'],
                          inst['raw_data']
                      ) for inst in batch]
                      
                      await conn.executemany("""
                          INSERT INTO dev_instrument_eodhd 
                          (code, name, country, exchange, currency, type, isin, is_delisted, raw_data, updated_at)
                          VALUES ($1, $2, $3, $4, $5, $6, $7, $8, $9, now())
                          ON CONFLICT (code, exchange) DO UPDATE SET
                              name = EXCLUDED.name,
                              country = EXCLUDED.country,
                              currency = EXCLUDED.currency,
                              type = EXCLUDED.type,
                              isin = EXCLUDED.isin,
                              is_delisted = EXCLUDED.is_delisted,
                              raw_data = EXCLUDED.raw_data,
                              updated_at = now()
                      """, batch_data)
                      
                      total_inserted += len(batch)
                      logger.info(f"✅ Batch {batch_num}: Processed {len(batch)} instruments. Total: {total_inserted}")
                      
                  except Exception as e:
                      logger.error(f"❌ Error processing batch {batch_num}: {e}")
                      continue
              
              return total_inserted
          
          async def create_symbol_changes_table(conn: asyncpg.Connection):
              """Create table for symbol changes"""
              logger.info("Creating dev_symbol_changes table...")
              
              create_table_sql = """
                  CREATE TABLE IF NOT EXISTS dev_symbol_changes (
                      id SERIAL PRIMARY KEY,
                      exchange VARCHAR(20),
                      old_symbol VARCHAR(50),
                      new_symbol VARCHAR(50),
                      company_name TEXT,
                      effective_date DATE,
                      raw_data JSONB,
                      created_at TIMESTAMP DEFAULT now(),
                      UNIQUE(old_symbol, new_symbol, effective_date)
                  );
                  
                  CREATE INDEX IF NOT EXISTS idx_symbol_changes_old ON dev_symbol_changes(old_symbol);
                  CREATE INDEX IF NOT EXISTS idx_symbol_changes_new ON dev_symbol_changes(new_symbol);
                  CREATE INDEX IF NOT EXISTS idx_symbol_changes_date ON dev_symbol_changes(effective_date);
              """
              
              await conn.execute(create_table_sql)
              logger.info("✅ dev_symbol_changes table created successfully")
          
          async def populate_symbol_changes(conn: asyncpg.Connection, changes: List[dict]):
              """Populate symbol changes table"""
              if not changes:
                  logger.info("No symbol changes to populate")
                  return 0
              
              logger.info(f"Populating {len(changes)} symbol changes...")
              
              change_data = []
              for change in changes:
                  try:
                      # Parse effective date
                      effective_str = change.get('effective', '')
                      effective_date = None
                      if effective_str:
                          effective_date = datetime.strptime(effective_str, '%Y-%m-%d').date()
                      
                      change_data.append((
                          change.get('exchange', ''),
                          change.get('old_symbol', ''),
                          change.get('new_symbol', ''),
                          change.get('company_name', ''),
                          effective_date,
                          json.dumps(change, default=json_serializer)
                      ))
                  except Exception as e:
                      logger.warning(f"Skipping invalid change record: {e}")
                      continue
              
              if not change_data:
                  logger.warning("No valid change records to insert")
                  return 0
              
              try:
                  await conn.executemany("""
                      INSERT INTO dev_symbol_changes 
                      (exchange, old_symbol, new_symbol, company_name, effective_date, raw_data)
                      VALUES ($1, $2, $3, $4, $5, $6)
                      ON CONFLICT (old_symbol, new_symbol, effective_date) DO UPDATE SET
                          exchange = EXCLUDED.exchange,
                          company_name = EXCLUDED.company_name,
                          raw_data = EXCLUDED.raw_data
                  """, change_data)
                  
                  logger.info(f"✅ Populated {len(change_data)} symbol changes")
                  return len(change_data)
                  
              except Exception as e:
                  logger.error(f"❌ Error populating symbol changes: {e}")
                  return 0
          
          async def generate_summary_statistics(conn: asyncpg.Connection):
              """Generate summary statistics for populated data"""
              logger.info("\n📊 GENERATING SUMMARY STATISTICS...")
              
              # EODHD instruments stats
              total_eodhd = await conn.fetchval("SELECT COUNT(*) FROM dev_instrument_eodhd")
              stocks_count = await conn.fetchval("SELECT COUNT(*) FROM dev_instrument_eodhd WHERE type = 'Common Stock'")
              delisted_count = await conn.fetchval("SELECT COUNT(*) FROM dev_instrument_eodhd WHERE is_delisted = true")
              
              # Exchange distribution
              exchange_stats = await conn.fetch("""
                  SELECT exchange, COUNT(*) as count, 
                         COUNT(CASE WHEN is_delisted THEN 1 END) as delisted_count
                  FROM dev_instrument_eodhd 
                  GROUP BY exchange 
                  ORDER BY count DESC 
                  LIMIT 10
              """)
              
              # Type distribution
              type_stats = await conn.fetch("""
                  SELECT type, COUNT(*) as count
                  FROM dev_instrument_eodhd 
                  GROUP BY type 
                  ORDER BY count DESC 
                  LIMIT 10
              """)
              
              # Symbol changes
              changes_count = await conn.fetchval("SELECT COUNT(*) FROM dev_symbol_changes")
              recent_changes = await conn.fetchval("SELECT COUNT(*) FROM dev_symbol_changes WHERE effective_date > '2024-01-01'")
              
              logger.info("="*70)
              logger.info("🎉 EODHD INSTRUMENT POPULATION COMPLETED!")
              logger.info("="*70)
              logger.info(f"📊 Total EODHD instruments: {total_eodhd:,}")
              logger.info(f"📈 Common stocks: {stocks_count:,}")
              logger.info(f"📉 Likely delisted: {delisted_count:,}")
              logger.info(f"🔄 Symbol changes: {changes_count:,}")
              logger.info(f"🆕 Recent changes (2024+): {recent_changes:,}")
              
              logger.info("\n📋 TOP EXCHANGES:")
              for row in exchange_stats:
                  logger.info(f"   {row['exchange']}: {row['count']:,} (delisted: {row['delisted_count']:,})")
              
              logger.info("\n📋 INSTRUMENT TYPES:")
              for row in type_stats:
                  logger.info(f"   {row['type']}: {row['count']:,}")
          
          async def populate_eodhd_instruments_main():
              """Main function to populate EODHD instrument history"""
              try:
                  # Database connection
                  conn = await asyncpg.connect(
                      host=os.getenv('DB_HOST', 'postgres'),
                      port=int(os.getenv('DB_PORT', 5432)),
                      user=os.getenv('DB_USER', 'postgres'),
                      password=os.getenv('DB_PASSWORD', 'dev_password'),
                      database=os.getenv('DB_NAME', 'dev_db')
                  )
                  logger.info("Connected to database successfully")
                  
                  logger.info("🚀 STARTING EODHD INSTRUMENT HISTORY POPULATION")
                  logger.info(f"🔑 API Key: {EODHD_API_KEY[:10]}...{EODHD_API_KEY[-4:]}")
                  
                  # Create tables
                  await create_eodhd_instruments_table(conn)
                  await create_symbol_changes_table(conn)
                  
                  # Fetch data from EODHD
                  instruments = await fetch_us_instruments()
                  symbol_changes = await fetch_symbol_changes()
                  
                  # Populate tables
                  instruments_populated = await populate_eodhd_instruments(conn, instruments)
                  changes_populated = await populate_symbol_changes(conn, symbol_changes)
                  
                  # Generate summary
                  await generate_summary_statistics(conn)
                  
                  logger.info("\n✅ EODHD INSTRUMENT HISTORY POPULATION COMPLETED!")
                  logger.info("🎯 Ready for historical NYSE/NASDAQ → OTC migration analysis")
                  
                  await conn.close()
                  
              except Exception as e:
                  logger.error(f"Error in EODHD instrument population: {e}")
                  raise
          
          if __name__ == "__main__":
              asyncio.run(populate_eodhd_instruments_main())
          EOF
          
          echo "Running EODHD instrument population..."
          cd /app
          python populate_eodhd_instruments.py
          
          echo "EODHD instrument population completed!"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"  
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      restartPolicy: OnFailure