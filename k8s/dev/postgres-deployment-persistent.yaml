apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ats-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  volumeName: postgres-pv
  storageClassName: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ats-dev
data:
  POSTGRES_DB: "dev_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "dev_password"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ats-dev
  labels:
    app: postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ats-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: timescale/timescaledb:latest-pg14
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgres-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: ats-dev
data:
  01-init-databases.sql: |
    -- Create dev_db database
    CREATE DATABASE dev_db;
    CREATE DATABASE intg_db;
    
    -- Switch to dev_db and create sample dev_ tables
    \c dev_db;
    
    -- Create dev_users table
    CREATE TABLE dev_users (
        id SERIAL PRIMARY KEY,
        username VARCHAR(50) NOT NULL,
        email VARCHAR(100),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Create dev_products table  
    CREATE TABLE dev_products (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        price DECIMAL(10,2),
        category_id INTEGER,
        description TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Create dev_orders table
    CREATE TABLE dev_orders (
        id SERIAL PRIMARY KEY,
        user_id INTEGER REFERENCES dev_users(id),
        product_id INTEGER REFERENCES dev_products(id),
        quantity INTEGER DEFAULT 1,
        total_amount DECIMAL(12,2),
        order_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        status VARCHAR(20) DEFAULT 'pending'
    );
    
    -- Create dev_daily_prices table (ATS-specific)
    CREATE TABLE dev_daily_prices (
        id SERIAL PRIMARY KEY,
        symbol VARCHAR(10) NOT NULL,
        price_date DATE NOT NULL,
        open_price DECIMAL(12,4),
        high_price DECIMAL(12,4),
        low_price DECIMAL(12,4),
        close_price DECIMAL(12,4),
        volume BIGINT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(symbol, price_date)
    );
    
    -- Create dev_training_dataset table (ATS-specific)
    CREATE TABLE dev_training_dataset (
        id SERIAL PRIMARY KEY,
        dataset_name VARCHAR(100) NOT NULL,
        symbol VARCHAR(10),
        file_size_mb DECIMAL(10,2),
        record_count INTEGER,
        creation_timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        status VARCHAR(20) DEFAULT 'active'
    );
    
    -- Insert sample data
    INSERT INTO dev_users (username, email) VALUES
        ('john_doe', 'john@example.com'),
        ('jane_smith', 'jane@example.com'),
        ('bob_wilson', 'bob@example.com');
    
    INSERT INTO dev_products (name, price, category_id, description) VALUES
        ('Laptop Pro', 1299.99, 1, 'High-performance laptop'),
