        ('Mechanical Keyboard', 149.99, 2, 'RGB mechanical keyboard');
    
    INSERT INTO dev_orders (user_id, product_id, quantity, total_amount, status) VALUES
        (1, 1, 1, 1299.99, 'completed'),
