apiVersion: batch/v1
kind: Job
metadata:
  name: enhanced-minute-backfill
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  template:
    spec:
      containers:
      - name: enhanced-minute-backfill
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Installing required packages for enhanced minute backfill..."
          pip install asyncpg requests pandas aiohttp python-dotenv
          
          # Verify installation
          python -c "import asyncpg, requests, pandas, aiohttp; print('✅ All packages installed successfully')"
          
          mkdir -p /app/src
          mkdir -p /app/checkpoints
          
          echo "Creating enhanced minute backfill implementation..."
          
          # Create base adapter
          cat > /app/src/base_adapter.py << 'EOF'
          from abc import ABC, abstractmethod
          from typing import List, Dict, Any, Optional
          
          class VendorAdapter(ABC):
              """Base adapter for market data vendors."""
              vendor_name: str = "base"
              
              @abstractmethod
              async def fetch_minute_bars_async(self, symbol: str, start_date, end_date) -> List[Dict[str, Any]]:
                  pass
          EOF
          
          # Create models
          cat > /app/src/models.py << 'EOF'
          from dataclasses import dataclass
          from datetime import datetime
          from typing import Optional
          
          @dataclass
          class InstrumentMetadata:
              symbol: str
              name: Optional[str] = None
              asset_class: Optional[str] = "STK"
              exchange: Optional[str] = None
          
          @dataclass
          class MinuteBar:
              symbol: str
              timestamp: datetime
              open: float
              high: float
              low: float
              close: float
              volume: int
              vwap: Optional[float] = None
              trade_count: Optional[int] = None
              vendor: str = "polygon"
          EOF
          
          # Create Polygon adapter
          cat > /app/src/polygon_adapter.py << 'EOF'
          import asyncio
          import aiohttp
          from datetime import datetime
          from typing import List, Dict, Any
          from base_adapter import VendorAdapter
          from models import MinuteBar
          import logging
          
          logger = logging.getLogger(__name__)
          
          class PolygonMinuteAdapter(VendorAdapter):
              vendor_name = "polygon"
              
              def __init__(self, api_key: str):
                  self.api_key = api_key
                  self.session = None
              
              async def __aenter__(self):
                  self.session = aiohttp.ClientSession()
                  return self
              
              async def __aexit__(self, exc_type, exc_val, exc_tb):
                  if self.session:
                      await self.session.close()
              
              async def fetch_minute_bars_async(self, symbol: str, start_date: datetime, end_date: datetime) -> List[MinuteBar]:
                  if not self.session:
                      raise RuntimeError("Must use async context manager")
                  
                  start_str = start_date.strftime("%Y-%m-%d")
                  end_str = end_date.strftime("%Y-%m-%d")
                  
                  url = f"https://api.polygon.io/v2/aggs/ticker/{symbol}/range/1/minute/{start_str}/{end_str}"
                  params = {
                      'adjusted': 'true',
                      'sort': 'asc',
                      'limit': 50000,
                      'apikey': self.api_key
                  }
                  
                  try:
                      await asyncio.sleep(0.1)  # Rate limiting
                      async with self.session.get(url, params=params, timeout=30) as response:
                          if response.status == 200:
                              data = await response.json()
                              if 'results' in data and data['results']:
                                  bars = []
                                  for result in data['results']:
                                      timestamp = datetime.utcfromtimestamp(result['t']/1000)
                                      bar = MinuteBar(
                                          symbol=symbol,
                                          timestamp=timestamp,
                                          open=float(result['o']),
                                          high=float(result['h']),
                                          low=float(result['l']),
                                          close=float(result['c']),
                                          volume=int(result['v']),
                                          vwap=float(result.get('vw', 0)),
                                          trade_count=int(result.get('n', 0)),
                                          vendor="polygon"
                                      )
                                      bars.append(bar)
                                  return bars
                          elif response.status == 429:
                              logger.warning(f"Rate limited for {symbol}, waiting...")
                              await asyncio.sleep(5)
                              return []
                          else:
                              logger.warning(f"API error for {symbol}: HTTP {response.status}")
                              return []
                  except Exception as e:
                      logger.error(f"Error fetching {symbol}: {e}")
                      return []
          EOF
          
          # Create Tiingo adapter
          cat > /app/src/tiingo_adapter.py << 'EOF'
          import asyncio
          import aiohttp
          from datetime import datetime
          from typing import List, Dict, Any
          from base_adapter import VendorAdapter
          from models import MinuteBar
          import logging
          
          logger = logging.getLogger(__name__)
          
          class TiingoIntradayAdapter(VendorAdapter):
              vendor_name = "tiingo"
              
              def __init__(self, api_key: str):
                  self.api_key = api_key
                  self.session = None
              
              async def __aenter__(self):
                  self.session = aiohttp.ClientSession()
                  return self
              
              async def __aexit__(self, exc_type, exc_val, exc_tb):
                  if self.session:
                      await self.session.close()
              
              async def fetch_minute_bars_async(self, symbol: str, start_date: datetime, end_date: datetime) -> List[MinuteBar]:
                  if not self.session:
                      raise RuntimeError("Must use async context manager")
                  
                  start_str = start_date.strftime("%Y-%m-%d")
                  end_str = end_date.strftime("%Y-%m-%d")
                  
                  url = f"https://api.tiingo.com/iex/{symbol}/prices"
                  params = {
                      'startDate': start_str,
                      'endDate': end_str,
                      'resampleFreq': '1min',
                      'token': self.api_key
                  }
                  
                  try:
                      await asyncio.sleep(0.2)  # Slower rate for Tiingo
                      async with self.session.get(url, params=params, timeout=60) as response:
                          if response.status == 200:
                              data = await response.json()
                              bars = []
                              for item in data:
                                  timestamp = datetime.fromisoformat(item['date'].replace('Z', '+00:00'))
                                  if all(item.get(field) is not None for field in ['open', 'high', 'low', 'close']):
                                      bar = MinuteBar(
                                          symbol=symbol,
                                          timestamp=timestamp,
                                          open=float(item['open']),
                                          high=float(item['high']),
                                          low=float(item['low']),
                                          close=float(item['close']),
                                          volume=int(item.get('volume', 0)),
                                          vendor="tiingo"
                                      )
                                      bars.append(bar)
                              return bars
                          elif response.status == 429:
                              logger.warning(f"Tiingo rate limited for {symbol}")
                              await asyncio.sleep(10)
                              return []
                          else:
                              logger.warning(f"Tiingo API error for {symbol}: HTTP {response.status}")
                              return []
                  except Exception as e:
                      logger.error(f"Error fetching Tiingo data for {symbol}: {e}")
                      return []
          EOF
          
          # Create simple reconciler
          cat > /app/src/reconciler.py << 'EOF'
          from typing import List, Dict, Any
          from models import MinuteBar
          import logging
          
          logger = logging.getLogger(__name__)
          
          class SimpleReconciler:
              def __init__(self):
                  pass
              
              async def reconcile_minute_data(self, polygon_data: List[MinuteBar], tiingo_data: List[MinuteBar], symbol: str) -> List[MinuteBar]:
                  # Simple reconciliation: prefer Polygon, fallback to Tiingo
                  if polygon_data:
                      logger.debug(f"Using Polygon data for {symbol}: {len(polygon_data)} bars")
                      return polygon_data
                  elif tiingo_data:
                      logger.debug(f"Using Tiingo data for {symbol}: {len(tiingo_data)} bars")
                      return tiingo_data
                  else:
                      logger.warning(f"No data from either vendor for {symbol}")
                      return []
              
              def close(self):
                  pass
          EOF
          
          # Create main backfill script
          cat > /app/enhanced_minute_backfill.py << 'EOF'
          import os
          import sys
          import asyncio
          import asyncpg
          import logging
          import json
          from datetime import datetime, timedelta
          from typing import List, Dict, Any
          from pathlib import Path
          
          # Add src to path
          sys.path.insert(0, '/app/src')
          
          from polygon_adapter import PolygonMinuteAdapter
          from tiingo_adapter import TiingoIntradayAdapter
          from reconciler import SimpleReconciler
          
          # Configure logging
          logging.basicConfig(
              level=logging.INFO,
              format='%(asctime)s - %(name)s - %(levelname)s - %(message)s'
          )
          logger = logging.getLogger("enhanced_minute_backfill")
          
          class MinuteBackfillJob:
              def __init__(self, symbols: List[str], days: int = 7):
                  self.symbols = symbols
                  self.days = days
                  self.polygon_api_key = "wfrcZNX3ZJJt55Or_CmBXda8G8e8tABD"
                  self.tiingo_api_key = "5f40b4f36e171405746304ec0e5a6f3aa9ca77e5"
                  self.checkpoint_file = "/app/checkpoints/minute_backfill_checkpoint.json"
                  
                  # Progress tracking
                  self.progress = {
                      'start_time': None,
                      'symbols_completed': 0,
                      'symbols_failed': 0,
                      'total_bars_polygon': 0,
                      'total_bars_tiingo': 0,
                      'total_bars_stored': 0,
                      'errors': []
                  }
                  
                  self.load_checkpoint()
              
              def save_checkpoint(self):
                  try:
                      checkpoint_data = {
                          'progress': self.progress,
                          'symbols': self.symbols,
                          'days': self.days,
                          'timestamp': datetime.now().isoformat()
                      }
                      with open(self.checkpoint_file, 'w') as f:
                          json.dump(checkpoint_data, f, indent=2, default=str)
                      logger.info(f"Checkpoint saved: {self.progress['symbols_completed']}/{len(self.symbols)} symbols completed")
                  except Exception as e:
                      logger.error(f"Failed to save checkpoint: {e}")
              
              def load_checkpoint(self):
                  try:
                      if Path(self.checkpoint_file).exists():
                          with open(self.checkpoint_file, 'r') as f:
                              data = json.load(f)
                          self.progress = data.get('progress', self.progress)
                          logger.info(f"Checkpoint loaded: {self.progress['symbols_completed']} symbols already completed")
                  except Exception as e:
                      logger.error(f"Failed to load checkpoint: {e}")
              
              async def get_database_connection(self):
                  return await asyncpg.connect(
                      host=os.getenv('DB_HOST', 'postgres'),
                      port=int(os.getenv('DB_PORT', 5432)),
                      user=os.getenv('DB_USER', 'postgres'),
                      password=os.getenv('DB_PASSWORD', 'dev_password'),
                      database=os.getenv('DB_NAME', 'dev_db')
                  )
              
              async def get_instrument_mapping(self, conn, symbols):
                  query = """
                      SELECT symbol, id as instrument_id 
                      FROM dev_instruments 
                      WHERE symbol = ANY($1) AND is_active = true
                  """
                  rows = await conn.fetch(query, symbols)
                  return {row['symbol']: row['instrument_id'] for row in rows}
              
              async def store_minute_data(self, conn, symbol: str, instrument_id: int, bars: List, vendor: str):
                  if not bars:
                      return 0
                  
                  # Prepare data for insertion
                  records = []
                  for bar in bars:
                      records.append((
                          bar.timestamp,
                          instrument_id,
                          bar.open,
                          bar.high,
                          bar.low,
                          bar.close,
                          bar.volume,
                          vendor
                      ))
                  
                  # Use a simple minute_data table (create if not exists)
                  await conn.execute("""
                      CREATE TABLE IF NOT EXISTS dev_minute_data (
                          timestamp TIMESTAMPTZ NOT NULL,
                          instrument_id INTEGER NOT NULL,
                          open NUMERIC,
                          high NUMERIC,
                          low NUMERIC,
                          close NUMERIC,
                          volume BIGINT,
                          vendor TEXT,
                          PRIMARY KEY (timestamp, instrument_id, vendor)
                      )
                  """)
                  
                  # Insert data
                  inserted = await conn.executemany("""
                      INSERT INTO dev_minute_data 
                      (timestamp, instrument_id, open, high, low, close, volume, vendor)
                      VALUES ($1, $2, $3, $4, $5, $6, $7, $8)
                      ON CONFLICT (timestamp, instrument_id, vendor) DO UPDATE SET
                          open = EXCLUDED.open,
                          high = EXCLUDED.high,
                          low = EXCLUDED.low,
                          close = EXCLUDED.close,
                          volume = EXCLUDED.volume
                  """, records)
                  
                  return len(records)
              
              async def process_symbol(self, symbol: str, instrument_id: int, start_date: datetime, end_date: datetime):
                  try:
                      logger.info(f"Processing {symbol} from {start_date.date()} to {end_date.date()}")
                      
                      # Fetch data from both vendors
                      async with PolygonMinuteAdapter(self.polygon_api_key) as polygon:
                          async with TiingoIntradayAdapter(self.tiingo_api_key) as tiingo:
                              polygon_data, tiingo_data = await asyncio.gather(
                                  polygon.fetch_minute_bars_async(symbol, start_date, end_date),
                                  tiingo.fetch_minute_bars_async(symbol, start_date, end_date),
                                  return_exceptions=True
                              )
                      
                      # Handle exceptions
                      if isinstance(polygon_data, Exception):
                          logger.warning(f"Polygon fetch failed for {symbol}: {polygon_data}")
                          polygon_data = []
                      
                      if isinstance(tiingo_data, Exception):
                          logger.warning(f"Tiingo fetch failed for {symbol}: {tiingo_data}")
                          tiingo_data = []
                      
                      # Reconcile data
                      reconciler = SimpleReconciler()
                      reconciled_data = await reconciler.reconcile_minute_data(polygon_data, tiingo_data, symbol)
                      
                      # Store data
                      conn = await self.get_database_connection()
                      try:
                          stored_count = 0
                          if reconciled_data:
                              stored_count = await self.store_minute_data(
                                  conn, symbol, instrument_id, reconciled_data, "unified"
                              )
                          
                          # Update progress
                          self.progress['symbols_completed'] += 1
                          self.progress['total_bars_polygon'] += len(polygon_data)
                          self.progress['total_bars_tiingo'] += len(tiingo_data)
                          self.progress['total_bars_stored'] += stored_count
                          
                          logger.info(f"✅ {symbol}: {len(polygon_data)} polygon, {len(tiingo_data)} tiingo, {stored_count} stored")
                          
                      finally:
                          await conn.close()
                      
                      return True
                      
                  except Exception as e:
                      error_msg = f"Error processing {symbol}: {e}"
                      logger.error(error_msg)
                      self.progress['symbols_failed'] += 1
                      self.progress['errors'].append(error_msg)
                      return False
              
              async def run_backfill(self):
                  self.progress['start_time'] = datetime.now().isoformat()
                  
                  logger.info(f"🚀 Starting enhanced minute backfill")
                  logger.info(f"Symbols: {self.symbols}")
                  logger.info(f"Days: {self.days}")
                  
                  # Calculate date range
                  end_date = datetime.now().replace(hour=0, minute=0, second=0, microsecond=0)
                  start_date = end_date - timedelta(days=self.days)
                  
                  logger.info(f"Date range: {start_date} to {end_date}")
                  
                  # Get instrument mapping
                  conn = await self.get_database_connection()
                  try:
                      instrument_map = await self.get_instrument_mapping(conn, self.symbols)
                      logger.info(f"Found {len(instrument_map)} instruments in database")
                  finally:
                      await conn.close()
                  
                  # Process symbols
                  for symbol in self.symbols:
                      if symbol not in instrument_map:
                          logger.warning(f"Symbol {symbol} not found in database, skipping")
                          continue
                      
                      instrument_id = instrument_map[symbol]
                      success = await self.process_symbol(symbol, instrument_id, start_date, end_date)
                      
                      # Save checkpoint every few symbols
                      if (self.progress['symbols_completed'] + self.progress['symbols_failed']) % 5 == 0:
                          self.save_checkpoint()
                      
                      # Small delay between symbols
                      await asyncio.sleep(1)
                  
                  # Final checkpoint and summary
                  self.save_checkpoint()
                  
                  logger.info("🎉 Enhanced minute backfill completed!")
                  logger.info(f"Results:")
                  logger.info(f"  Symbols completed: {self.progress['symbols_completed']}")
                  logger.info(f"  Symbols failed: {self.progress['symbols_failed']}")
                  logger.info(f"  Total bars stored: {self.progress['total_bars_stored']}")
                  logger.info(f"  Polygon bars: {self.progress['total_bars_polygon']}")
                  logger.info(f"  Tiingo bars: {self.progress['total_bars_tiingo']}")
                  
                  if self.progress['errors']:
                      logger.warning(f"Errors encountered: {len(self.progress['errors'])}")
                      for error in self.progress['errors'][-5:]:  # Show last 5 errors
                          logger.warning(f"  {error}")
                  
                  return self.progress['symbols_completed'] > 0
          
          async def main():
              # Sample symbols for testing
              symbols = ['AAPL', 'MSFT', 'GOOGL', 'AMZN', 'TSLA', 'NVDA', 'META', 'NFLX', 'CRM', 'ORCL']
              days = int(os.getenv('BACKFILL_DAYS', '7'))
              
              logger.info(f"Starting enhanced minute backfill for {len(symbols)} symbols over {days} days")
              
              job = MinuteBackfillJob(symbols, days)
              success = await job.run_backfill()
              
              if success:
                  logger.info("✅ Enhanced minute backfill SUCCESSFUL!")
              else:
                  logger.error("❌ Enhanced minute backfill FAILED!")
                  exit(1)
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          cd /app
          python enhanced_minute_backfill.py
          
          echo "Enhanced minute backfill completed!"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: BACKFILL_DAYS
          value: "7"  # 7 days of minute data
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: checkpoint-storage
          mountPath: /app/checkpoints
      volumes:
      - name: checkpoint-storage
        emptyDir: {}
      restartPolicy: OnFailure