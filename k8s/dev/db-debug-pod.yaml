apiVersion: v1
kind: Pod
metadata:
  name: db-debug-pod
  namespace: ats-dev
spec:
  containers:
  - name: db-debug
    image: dragonflyer762/ats-genai:dev-latest
    command: ["sleep", "3600"]
    env:
    - name: PYTHONPATH
      value: "/app/src"
    - name: LOG_LEVEL
      value: "DEBUG"
    - name: ENVIRONMENT
      value: "dev"
    - name: DB_USER
      value: "postgres"
    - name: DB_PASSWORD
      value: "postgres"
    - name: DB_NAME
      value: "dev_db"
  restartPolicy: Never
