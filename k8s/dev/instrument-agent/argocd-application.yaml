apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: instrument-agent-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: instrument-agent
    environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/jianjun00/ats-genai.git
    targetRevision: main
    path: k8s/dev/instrument-agent
    # Use kustomize for deployment
    kustomize:
      # Add any kustomize options if needed
      commonLabels:
        managed-by: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: ats-dev
  syncPolicy:
    automated:
      prune: true      # Automatically delete resources that are no longer defined in Git
      selfHeal: true   # Automatically sync resources when they drift from Git definition
      allowEmpty: false # Don't allow sync to an empty directory
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5         # Number of retries
      backoff:
        duration: 5s   # Initial backoff duration
        factor: 2      # Factor to multiply duration for each retry
        maxDuration: 3m # Maximum backoff duration
