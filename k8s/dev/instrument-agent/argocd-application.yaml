apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: instrument-agent-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jianjun00/ats-genai.git  # Update this to your actual Git repository URL
    targetRevision: main
    path: k8s/dev/instrument-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: ats-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
