apiVersion: batch/v1
kind: Job
metadata:
  name: instrument-agent-backfill
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 86400  # 24 hours
  activeDeadlineSeconds: 7200  # 2 hours timeout for the entire backfill job
  template:
    spec:
      containers:
      - name: instrument-agent-backfill
        image: ats-registry.dev/instrument-data-agent:dev
        command: ["python", "-m", "src.market_data.agent.instrument_data_agent", "backfill", "--environment", "dev"]
        envFrom:
        - configMapRef:
            name: instrument-agent-config
        - secretRef:
            name: instrument-agent-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1"
        volumeMounts:
        - name: logs
          mountPath: /var/log/instrument-agent
        - name: reports
          mountPath: /app/reports
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: instrument-agent-logs
      - name: reports
        persistentVolumeClaim:
          claimName: instrument-agent-reports
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 60  # 60 seconds to gracefully terminate
