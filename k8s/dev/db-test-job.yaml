apiVersion: batch/v1
kind: Job
metadata:
  name: db-test-job
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: db-test
        image: postgres:14
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Testing database connection..."
          PGPASSWORD=postgres psql -h postgres -U postgres -d dev_db -c "
            SELECT table_name FROM information_schema.tables 
            WHERE table_schema = 'public' AND table_name LIKE 'dev\\_%'
            ORDER BY table_name;
          "
          
          echo "Testing table contents..."
          PGPASSWORD=postgres psql -h postgres -U postgres -d dev_db -c "
            SELECT COUNT(*) FROM dev_vendors;
          "
          
          echo "Database test completed."
      restartPolicy: Never
  backoffLimit: 2
