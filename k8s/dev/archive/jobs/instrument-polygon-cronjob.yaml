apiVersion: batch/v1
kind: CronJob
metadata:
  name: instrument-polygon-daily
  namespace: ats-dev
  labels:
    app: ats-api
    component: secmaster
    environment: dev
spec:
  schedule: "0 1 * * *"  # Run at 1:00 AM UTC daily (6:00 PM PST previous day)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600  # 10 minutes deadline to start the job
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800  # 30 minutes timeout for the entire job
      template:
        spec:
          imagePullSecrets:
          - name: registry-credentials
          containers:
          - name: instrument-polygon-updater
            image: dragonflyer762/ats-genai:dev-latest
            command: ["python", "-m", "src.secmaster.populate_instrument_polygon", "--environment", "dev"]
            env:
            - name: PYTHONPATH
              value: "/app/src"
            - name: LOG_LEVEL
              value: "INFO"
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30  # 30 seconds to gracefully terminate
