apiVersion: v1
kind: ConfigMap
metadata:
  name: automated-daily-price-script
  namespace: ats-dev
# Script extracted to /scripts/environment.py
# Original ConfigMap data removed for cleanup---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: automated-daily-price-unification
  namespace: ats-dev
spec:
  schedule: "0 18 * * 1-5"  # Run at 6 PM EST, Monday-Friday (after market close)
  timeZone: "America/New_York"  # Eastern Time
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: daily-unifier
            image: python:3.12-slim
            command: ["/bin/bash"]
            args:
        - "-c"
        - "/scripts/automated_daily_price_runs_1.py"---
# Manual trigger Job for testing/manual runs
apiVersion: batch/v1
kind: Job
metadata:
  name: manual-daily-price-unification
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: manual-daily-unifier
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/automated_daily_price_runs_2.py"