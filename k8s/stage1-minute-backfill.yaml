apiVersion: v1
kind: ConfigMap
metadata:
  name: stage1-minute-backfill-script
  namespace: ats-dev
# Script extracted to /scripts/backfill_script.py
# Original ConfigMap data removed for cleanup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stage1-minute-backfill-job
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 7200  # 2 hours
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: stage1-container
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            
            echo "=== STAGE 1 MINUTE DATA BACKFILL ==="
            echo "Mode: Conservative testing with real database"
            echo "Target: 500 instruments × 3 days"
            echo "Memory limit: 1GB"
            echo "CPU limit: 500m (0.5 cores)"
            
            # Install dependencies
            pip install psutil asyncpg
            
            # Run Stage 1 backfill
            python3 /scripts/backfill_script.py
        env:
        - name: DB_HOST
          value: "postgres-simple.ats-dev.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"      # Double the pilot test
            cpu: "500m"        # 0.5 cores
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: stage1-minute-backfill-script
          defaultMode: 0755