apiVersion: v1
kind: ConfigMap
metadata:
  name: extend-10year-minute-backfill-script
  namespace: ats-dev
data:
  backfill_script.py: |
    #!/usr/bin/env python3
    import os
    import sys
    import asyncio
    import logging
    from datetime import datetime, date, timedelta
    
    # Add src to Python path
    sys.path.insert(0, '/app/src')
    
    from config.environment import Environment
    
    async def main():
        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)
        
        # Environment setup
        env = Environment()
        
        # Target date range for 10-year coverage (minute data)
        # Start with a smaller chunk for minute data due to volume
        start_date = date(2019, 1, 1)  # Start with most recent missing year
        end_date = date(2019, 12, 31)
        
        logger.info(f"Starting 10-year minute data backfill from {start_date} to {end_date}")
        logger.info(f"Note: This is a subset - minute data is extremely large")
        
        # Get instrument count
        import asyncpg
        conn = await asyncpg.connect(env.get_database_url())
        instrument_count = await conn.fetchval("SELECT COUNT(*) FROM dev_instruments LIMIT 100")  # Limit for testing
        await conn.close()
        
        logger.info(f"Backfilling minute data for {instrument_count} instruments")
        
        # For now, focus on daily data expansion first
        # Minute data requires much more careful resource management
        logger.info("Minute data backfill framework prepared")
        logger.info("Recommend starting with daily data extension first")
        
        # Future implementation would use:
        # - Chunked processing by date ranges
        # - Reduced instrument sets
        # - Streaming/batch insertion patterns
        # - TimescaleDB compression
        
    if __name__ == "__main__":
        asyncio.run(main())

---
apiVersion: batch/v1
kind: Job
metadata:
  name: extend-10year-minute-backfill-job
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 86400  # 24 hours
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: backfill-container
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Minute data backfill job prepared"
            echo "This job is designed for future large-scale minute data expansion"
            echo "Current focus: Daily data 10-year extension"
            
            # Install system dependencies
            apt-get update && apt-get install -y git curl build-essential
            
            # Install uv for faster package management
            curl -LsSf https://astral.sh/uv/install.sh | sh
            source $HOME/.cargo/env
            
            # Clone repository
            git clone https://github.com/jianjungit/ats-genai.git /app
            cd /app
            
            # Install Python dependencies
            uv pip install --system -r requirements.txt
            
            # Set environment variables
            export PYTHONPATH=/app/src
            export ENVIRONMENT=dev
            export DB_CONNECTION_PARAMS=sslmode=disable
            
            # Ray configuration for Kubernetes
            export RAY_SCHEDULER_EVENTS=0
            export RAY_DISABLE_AUTOMATIC_AUTOSCALING=1
            export RAY_DISABLE_DASHBOARD=1
            export RAY_USAGE_STATS_ENABLED=0
            export RAY_ADDRESS=""
            
            # Run the backfill script
            python3 /scripts/backfill_script.py
        env:
        - name: DB_HOST
          value: "postgres-simple.ats-dev.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi" 
            cpu: "2000m"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: extend-10year-minute-backfill-script
          defaultMode: 0755