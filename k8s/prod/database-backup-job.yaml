apiVersion: batch/v1
kind: CronJob
metadata:
  name: ats-prod-database-backup
  namespace: ats-prod
spec:
  schedule: "0 1 * * *"  # Daily at 1 AM (before dev and intg)
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: postgres-backup
            image: postgres:16
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -e  # Exit on any error
              
              # Function to send Slack notification
              send_slack_notification() {
                local message="$1"
                if [ -n "$SLACK_WEBHOOK_URL" ]; then
                  curl -X POST -H 'Content-type: application/json' \
                    --data "{\"text\":\"$message\"}" \
                    "$SLACK_WEBHOOK_URL" || echo "Failed to send Slack notification"
                else
                  echo "SLACK_WEBHOOK_URL not configured - skipping Slack notification"
                fi
              }
              
              # Trap errors and send failure notification
              trap 'send_slack_notification "🚨 **CRITICAL: ATS Production Database Backup Failed** \n💥 **URGENT ACTION REQUIRED:**\n• Database: \`prod_db\`\n• Environment: PRODUCTION 🔴\n• Timestamp: $(date)\n• Status: FAILED\n• Error: Backup job terminated unexpectedly\n\n⚠️ <!channel> Production backup failure - immediate attention required!"' ERR
              
              echo "Starting PRODUCTION database backup at $(date)"
              
              # Install curl for Slack notifications
              echo "Installing curl..."
              apt-get update && apt-get install -y curl
              
              # Create backup directory
              mkdir -p /backup
              
              # Generate backup filename with timestamp
              BACKUP_FILE="/backup/ats-prod-backup-$(date +%Y%m%d-%H%M%S).sql"
              
              # Test database connection first
              echo "Testing database connection..."
              PGPASSWORD=prod_password psql \
                -h postgres \
                -p 5432 \
                -U postgres \
                -d prod_db \
                -c "SELECT 'Database connection successful', version();" || {
                  send_slack_notification "🚨 **CRITICAL: ATS Production Database Backup Failed** \n💥 **URGENT ACTION REQUIRED:**\n• Database: \`prod_db\`\n• Environment: PRODUCTION 🔴\n• Timestamp: $(date)\n• Status: FAILED\n• Error: Cannot connect to database\n\n⚠️ <!channel> Production database connectivity issue!"
                  exit 1
                }
              
              # Create database backup
              echo "Creating custom format backup..."
              PGPASSWORD=prod_password pg_dump \
                -h postgres \
                -p 5432 \
                -U postgres \
                -d prod_db \
                --verbose \
                --clean \
                --create \
                --format=custom \
                --file="${BACKUP_FILE}.custom" || {
                  send_slack_notification "🚨 **CRITICAL: ATS Production Database Backup Failed** \n💥 **URGENT ACTION REQUIRED:**\n• Database: \`prod_db\`\n• Environment: PRODUCTION 🔴\n• Timestamp: $(date)\n• Status: FAILED\n• Error: pg_dump failed (custom format)\n\n⚠️ <!channel> Production backup creation failed!"
                  exit 1
                }
              
              # Also create a plain SQL backup for readability
              echo "Creating plain SQL backup..."
              PGPASSWORD=prod_password pg_dump \
                -h postgres \
                -p 5432 \
                -U postgres \
                -d prod_db \
                --verbose \
                --clean \
                --create \
                --format=plain \
                --file="${BACKUP_FILE}" || {
                  send_slack_notification "🚨 **CRITICAL: ATS Production Database Backup Failed** \n💥 **URGENT ACTION REQUIRED:**\n• Database: \`prod_db\`\n• Environment: PRODUCTION 🔴\n• Timestamp: $(date)\n• Status: FAILED\n• Error: pg_dump failed (plain format)\n\n⚠️ <!channel> Production backup creation failed!"
                  exit 1
                }
              
              # Compress the plain SQL backup
              echo "Compressing SQL backup..."
              gzip "${BACKUP_FILE}"
              
              echo "Backup completed successfully:"
              echo "Custom format: ${BACKUP_FILE}.custom"
              echo "Compressed SQL: ${BACKUP_FILE}.gz"
              
              # List backup files
              ls -la /backup/
              
              # Show backup file sizes
              du -h /backup/*
              
              # Verify backup integrity
              echo "Verifying backup integrity..."
              PGPASSWORD=prod_password pg_restore --list "${BACKUP_FILE}.custom" > /tmp/backup_verify.txt
              OBJECT_COUNT=$(grep -c ';' /tmp/backup_verify.txt)
              echo "Backup contains $OBJECT_COUNT objects"
              
              echo "PRODUCTION database backup completed at $(date)"
              
              # Send Slack notification on backup completion
              BACKUP_SIZE=$(du -h "${BACKUP_FILE}.custom" | cut -f1)
              COMPRESSED_SIZE=$(du -h "${BACKUP_FILE}.gz" | cut -f1)
              
              send_slack_notification "✅ **ATS Production Database Backup Completed** \n🏭 **PRODUCTION BACKUP SUCCESS**\n• Database: \`prod_db\`\n• Environment: PRODUCTION 🔴\n• Custom Format: ${BACKUP_SIZE} (${OBJECT_COUNT} objects)\n• Compressed SQL: ${COMPRESSED_SIZE}\n• Timestamp: $(date)\n• Status: SUCCESS ✅\n\n📁 Production backup stored securely.\n🔒 Data integrity verified and protected."
            env:
            - name: PGPASSWORD
              value: "prod_password"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-webhook-secret
                  key: webhook-url
                  optional: true
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
          volumes:
          - name: backup-storage
            hostPath:
              path: /host-data/backups/ats-prod
              type: DirectoryOrCreate
          restartPolicy: OnFailure