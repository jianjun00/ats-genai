apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-prod-pv
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /home/jianjun/ats-data/postgres-prod
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ats-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Ti
  volumeName: postgres-prod-pv
  storageClassName: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ats-prod
data:
  POSTGRES_DB: "prod_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "prod_password"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ats-prod
  labels:
    app: postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ats-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: timescale/timescaledb:latest-pg14
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgres-config
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U postgres -d prod_db
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U postgres -d prod_db
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: ats-prod
data:
  01-init-databases.sql: |
    -- Create prod_db database if not exists
    SELECT 'CREATE DATABASE prod_db'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'prod_db')\gexec