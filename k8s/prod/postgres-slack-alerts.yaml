apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-monitor-config
  namespace: ats-prod
data:
  monitor.py: |
    #!/usr/bin/env python3
    import asyncio
    import asyncpg
    import aiohttp
    import json
    import os
    import logging
    from datetime import datetime

    logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
    logger = logging.getLogger(__name__)

    SLACK_WEBHOOK_URL = os.getenv('SLACK_WEBHOOK_URL')
    ENVIRONMENT = os.getenv('ENVIRONMENT', 'production')
    
    async def check_postgres():
        try:
            conn = await asyncpg.connect(
                host='postgres', port=5432, user='postgres', 
                password='prod_password', database='prod_db'
            )
            
            # Comprehensive production health checks
            version = await conn.fetchval('SELECT version()')
            connections = await conn.fetchval("SELECT count(*) FROM pg_stat_activity")
            max_connections = await conn.fetchval('SHOW max_connections')
            
            # Production-specific metrics
            prod_tables = await conn.fetchval(
                "SELECT count(*) FROM information_schema.tables WHERE table_name LIKE 'prod_%'"
            )
            
            # Cache hit ratio (critical for production)
            cache_hit_ratio = await conn.fetchval("""
                SELECT round(
                    sum(blks_hit) * 100.0 / (sum(blks_hit) + sum(blks_read)), 2
                ) FROM pg_stat_database WHERE datname = current_database()
            """)
            
            # Long running queries (stricter for production)
            long_queries = await conn.fetch("""
                SELECT pid, query, now() - query_start as duration FROM pg_stat_activity 
                WHERE (now() - query_start) > interval '5 minutes' AND state = 'active'
            """)
            
            # Blocked queries
            blocked_queries = await conn.fetchval("""
                SELECT count(*) FROM pg_stat_activity 
                WHERE wait_event_type = 'Lock' AND state = 'active'
            """)
            
            # Database size and growth
            db_size = await conn.fetchval("SELECT pg_size_pretty(pg_database_size(current_database()))")
            
            await conn.close()
            
            # Determine status with production-grade thresholds
            status = "healthy"
            issues = []
            critical_issues = []
            
            connection_pct = (connections / int(max_connections)) * 100
            
            # Critical issues (immediate alert)
            if connection_pct > 90:
                critical_issues.append(f"CRITICAL: Connection usage {connection_pct:.1f}% (>{connections}/{max_connections})")
                status = "critical"
            
            if blocked_queries > 5:
                critical_issues.append(f"CRITICAL: {blocked_queries} blocked queries waiting for locks")
                status = "critical"
            
            # Warning issues
            if connection_pct > 70:
                issues.append(f"High connection usage: {connection_pct:.1f}%")
                if status != "critical":
                    status = "warning"
            
            if long_queries:
                issues.append(f"{len(long_queries)} long-running queries (>5min)")
                if status != "critical":
                    status = "warning"
            
            if cache_hit_ratio and float(cache_hit_ratio) < 95:
                issues.append(f"Low cache hit ratio: {cache_hit_ratio}%")
                if status != "critical":
                    status = "warning"
            
            # Send alerts based on severity
            if (critical_issues or issues) and SLACK_WEBHOOK_URL:
                color = "danger" if status == "critical" else "warning"
                alert_text = ":rotating_light: *CRITICAL PRODUCTION ALERT*" if status == "critical" else ":warning: Production PostgreSQL Warning"
                
                all_issues = critical_issues + issues
                
                payload = {
                    "channel": "#ats-prod-alerts",
                    "username": "ATS Production Monitor",
                    "icon_emoji": ":rotating_light:" if status == "critical" else ":warning:",
                    "text": alert_text,
                    "attachments": [{
                        "color": color,
                        "title": f"PostgreSQL {status.upper()} - PRODUCTION Environment",
                        "fields": [
                            {"title": "Environment", "value": "ats-prod :fire:", "short": True},
                            {"title": "Database", "value": "prod_db", "short": True},
                            {"title": "Severity", "value": status.upper(), "short": True},
                            {"title": "Connection Usage", "value": f"{connection_pct:.1f}% ({connections}/{max_connections})", "short": True},
                            {"title": "Cache Hit Ratio", "value": f"{cache_hit_ratio}%", "short": True},
                            {"title": "DB Size", "value": db_size, "short": True},
                            {"title": "PROD Tables", "value": str(prod_tables), "short": True},
                            {"title": "Blocked Queries", "value": str(blocked_queries), "short": True},
                            {"title": "Issues", "value": "\\n".join(all_issues), "short": False},
                            {"title": "Timestamp", "value": datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC'), "short": True}
                        ],
                        "footer": "ATS PRODUCTION PostgreSQL Monitoring - IMMEDIATE ACTION REQUIRED" if status == "critical" else "ATS Production PostgreSQL Monitoring"
                    }]
                }
                
                async with aiohttp.ClientSession() as session:
                    await session.post(SLACK_WEBHOOK_URL, json=payload)
                    logger.info(f"Sent PRODUCTION Slack alert: {status}")
            
            # Log regular status with production metrics
            logger.info(f"PRODUCTION PostgreSQL: {status}, connections: {connections}/{max_connections} ({connection_pct:.1f}%), cache_hit: {cache_hit_ratio}%, prod_tables: {prod_tables}")
            
        except Exception as e:
            logger.error(f"PRODUCTION PostgreSQL check FAILED: {e}")
            if SLACK_WEBHOOK_URL:
                payload = {
                    "channel": "#ats-prod-alerts",
                    "username": "ATS Production Monitor",
                    "icon_emoji": ":red_circle:",
                    "text": f":red_circle: *CRITICAL PRODUCTION DATABASE FAILURE*",
                    "attachments": [{
                        "color": "danger",
                        "title": "PRODUCTION Database Connection FAILED",
                        "fields": [
                            {"title": "Environment", "value": "ats-prod :fire:", "short": True},
                            {"title": "Severity", "value": "CRITICAL", "short": True},
                            {"title": "Error", "value": str(e), "short": False},
                            {"title": "Action Required", "value": "IMMEDIATE INVESTIGATION REQUIRED", "short": False},
                            {"title": "Timestamp", "value": datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC'), "short": True}
                        ],
                        "footer": "ATS PRODUCTION MONITORING - CRITICAL ALERT"
                    }]
                }
                async with aiohttp.ClientSession() as session:
                    await session.post(SLACK_WEBHOOK_URL, json=payload)

    async def send_startup_notification():
        """Send notification when production monitoring starts"""
        if SLACK_WEBHOOK_URL:
            payload = {
                "channel": "#ats-prod-alerts",
                "username": "ATS Production Monitor",
                "icon_emoji": ":shield:",
                "text": f":shield: Production PostgreSQL monitoring activated",
                "attachments": [{
                    "color": "good",
                    "title": "PRODUCTION Monitoring Service Started",
                    "fields": [
                        {"title": "Environment", "value": "ats-prod :fire:", "short": True},
                        {"title": "Database", "value": "prod_db", "short": True},
                        {"title": "Check Interval", "value": "3 minutes", "short": True},
                        {"title": "Alert Channel", "value": "#ats-prod-alerts", "short": True},
                        {"title": "Monitoring Level", "value": "PRODUCTION - Enhanced", "short": False}
                    ],
                    "footer": "ATS Production PostgreSQL Monitoring"
                }]
            }
            async with aiohttp.ClientSession() as session:
                await session.post(SLACK_WEBHOOK_URL, json=payload)

    async def main():
        logger.info("Starting PRODUCTION PostgreSQL Slack monitoring")
        await send_startup_notification()
        
        while True:
            await check_postgres()
            await asyncio.sleep(180)  # Check every 3 minutes for production

    if __name__ == "__main__":
        asyncio.run(main())
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-slack-alerts
  namespace: ats-prod
  labels:
    app: postgres-slack-alerts
    environment: production
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-slack-alerts
  template:
    metadata:
      labels:
        app: postgres-slack-alerts
        environment: production
        tier: monitoring
    spec:
      containers:
      - name: monitor
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          pip install asyncpg aiohttp
          python /config/monitor.py
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: slack-credentials
              key: webhook_url
        - name: ENVIRONMENT
          value: "production"
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
        livenessProbe:
          exec:
            command: ["pgrep", "-f", "monitor.py"]
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["pgrep", "-f", "monitor.py"]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: postgres-monitor-config
      restartPolicy: Always
      # Production settings
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: amd64