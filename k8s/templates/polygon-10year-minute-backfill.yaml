apiVersion: batch/v1
kind: Job
metadata:
  name: polygon-10year-minute-backfill
  namespace: ats-dev
  labels:
    app: ats-genai
    component: minute-backfill
    vendor: polygon
    period: 2010-2020
spec:
  ttlSecondsAfterFinished: 14400  # 4 hours
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: polygon-minute-backfiller
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "📦 Installing dependencies for Polygon 10-year minute backfill..."
          pip install --no-cache-dir asyncpg aiohttp
          
          mkdir -p /app/scripts/backfill
          cd /app
          
          # Create the backfill script
          cat > /app/scripts/backfill/run_10year_minute_backfill.py << 'EOF'
          $(cat /dev/stdin)
          EOF
          
          echo "🚀 Starting Polygon 10-year minute backfill (2010-2020)..."
          echo "⏰ Start time: $(date)"
          echo "📊 Target: 5,000 instruments × 10 years × ~252 trading days × 390 minutes"
          echo "📈 Estimated total: ~4.9 billion minute data points"
          
          cd /app && python scripts/backfill/run_10year_minute_backfill.py
          
          echo "✅ Polygon 10-year minute backfill completed!"
          echo "⏰ End time: $(date)"
        stdin: true
        env:
        - name: VENDOR
          value: "polygon"
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: POLYGON_API_KEY
          value: "wfrcZNX3ZJJt55Or_CmBXda8G8e8tABD"
        - name: PYTHONPATH
          value: "/app"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: polygon-10year-backfill-script
  namespace: ats-dev
data:
  script.py: |
    # The script content will be injected via stdin
    pass