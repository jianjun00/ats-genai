apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ATS Integration Environment - ArgoCD Managed
metadata:
  name: ats-intg
  annotations:
    argocd.argoproj.io/sync-wave: "2"

namespace: ats-intg

resources:
  # Base ATS application
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml

images:
  # Main application image
  - name: ats-genai
    newTag: intg-latest
    
  # Monitoring images
  - name: alpine/k8s
    newTag: "1.28.6"

commonLabels:
  environment: intg
  managed-by: argocd
  platform: ats
  
commonAnnotations:
  argocd.argoproj.io/sync-wave: "2"
  environment: integration
  auto-sync: "true"
