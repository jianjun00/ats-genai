apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-api
spec:
  replicas: 2  # Two replicas for intg testing
  template:
    spec:
      containers:
      - name: ats-api
        env:
        - name: ENVIRONMENT
          value: "intg"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
