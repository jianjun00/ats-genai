apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ATS Production Environment - ArgoCD Managed (Manual Sync)
metadata:
  name: ats-prod
  annotations:
    argocd.argoproj.io/sync-wave: "3"

namespace: ats-prod

resources:
  # Base ATS application
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml

images:
  # Main application image
  - name: ats-genai
    newTag: prod-latest
    
  # Monitoring images
  - name: alpine/k8s
    newTag: "1.28.6"

commonLabels:
  environment: prod
  managed-by: argocd
  platform: ats
  
commonAnnotations:
  argocd.argoproj.io/sync-wave: "3"
  environment: production
  auto-sync: "false"
