apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ATS Development Environment - ArgoCD Managed
metadata:
  name: ats-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"

namespace: ats-dev

resources:
  # Base ATS application
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml
  - deployment-override.yaml

images:
  # Main application image
  - name: ats-genai
    newTag: dev-latest
    
  # Monitoring images
  - name: alpine/k8s
    newTag: "1.28.6"

commonLabels:
  environment: dev
  managed-by: argocd
  platform: ats
  
commonAnnotations:
  argocd.argoproj.io/sync-wave: "1"
  environment: development
  auto-sync: "true"
