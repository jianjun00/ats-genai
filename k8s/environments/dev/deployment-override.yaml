apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-api
  labels:
    app: ats-api
    component: api
spec:
  template:
    spec:
      containers:
      - name: ats-api
        # Use our simple FastAPI app for testing
        command: ["uvicorn", "src.simple_main:app", "--host", "0.0.0.0", "--port", "8080"]
        args: []
        # Use Docker Hub image
        image: jianjun00/ats-genai:dev-latest
        imagePullPolicy: Always  # Pull from Docker Hub
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PYTHONPATH
          value: "src"
        - name: ENVIRONMENT
          value: "dev"
        - name: LOG_LEVEL
          value: "DEBUG"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
