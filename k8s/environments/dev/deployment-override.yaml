apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-api
spec:
  template:
    spec:
      containers:
      - name: ats-api
        # Override the default command to skip DB setup for local dev
        command: ["python"]
        args: ["-m", "uvicorn", "src.simple_main:app", "--host", "0.0.0.0", "--port", "8080"]
        # Use local image
        image: ats-genai:dev-latest
        imagePullPolicy: Never  # Don't try to pull from registry
