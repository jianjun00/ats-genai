apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-api
spec:
  replicas: 1  # Single replica for dev
  template:
    spec:
      containers:
      - name: ats-api
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: LOG_LEVEL
          value: "DEBUG"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
