apiVersion: batch/v1
kind: Job
metadata:
  name: fmp-daily-prices
  namespace: ats-dev
  labels:
    app: ats-genai
    component: fmp-price-ingestion
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: fmp-ingestion
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Installing dependencies..."
          pip install --no-cache-dir asyncpg aiohttp pandas gin-config
          
          echo "Setting up source code..."
          mkdir -p /app/src/market_data/eod
          cd /app
          
          # Create the FMP ingestion script
          cat > /app/src/market_data/eod/daily_price_fmp.py << 'EOF'
          #!/usr/bin/env python3
          """
          Financial Modeling Prep Daily Price Ingestion
          Fetches daily stock prices from Financial Modeling Prep API and stores in database.
          """
          
          import os
          import asyncio
          import aiohttp
          import asyncpg
          import datetime as dt
          import logging
          from typing import List, Dict, Any, Optional
          
          # Simple environment and DAO implementations
          class SimpleEnvironment:
              def get_table_name(self, base_name):
                  return f"dev_{base_name}"
              
              def get_database_url(self):
                  host = os.environ.get('DB_HOST', 'postgres-simple')
                  port = os.environ.get('DB_PORT', '5432')
                  user = os.environ.get('DB_USER', 'postgres')
                  password = os.environ.get('DB_PASSWORD', 'dev_password')
                  database = os.environ.get('DB_NAME', 'dev_db')
                  return f"postgresql://{user}:{password}@{host}:{port}/{database}"
          
          class SimpleFmpDAO:
              def __init__(self, env):
                  self.env = env
                  self.table_name = env.get_table_name('daily_prices_fmp')
                  self.db_url = env.get_database_url()
              
              async def batch_insert_prices(self, prices):
                  if not prices:
                      return
                  pool = await asyncpg.create_pool(self.db_url, min_size=1, max_size=3)
                  try:
                      async with pool.acquire() as conn:
                          await conn.executemany(f"""
                              INSERT INTO {self.table_name} (date, instrument_id, open_price, high_price, low_price, close, adj_close, volume)
                              VALUES ($1, $2, $3, $4, $5, $6, $7, $8)
                              ON CONFLICT (date, instrument_id) DO UPDATE SET
                                  open_price=EXCLUDED.open_price,
                                  high_price=EXCLUDED.high_price,
                                  low_price=EXCLUDED.low_price,
                                  close=EXCLUDED.close,
                                  adj_close=EXCLUDED.adj_close,
                                  volume=EXCLUDED.volume,
                                  updated_at=NOW()
                          """,
                          [
                              (
                                  p['date'],
                                  p['instrument_id'],
                                  p.get('open_price'),
                                  p.get('high_price'),
                                  p.get('low_price'),
                                  p.get('close'),
                                  p.get('adj_close'),
                                  p.get('volume'),
                              ) for p in prices
                          ])
                          print(f"✅ Inserted {len(prices)} FMP price records")
                  finally:
                      await pool.close()
          
          class SimpleXrefsDAO:
              def __init__(self, env):
                  self.env = env
                  self.db_url = env.get_database_url()
              
              async def resolve_instrument_id(self, symbol):
                  pool = await asyncpg.create_pool(self.db_url, min_size=1, max_size=3)
                  try:
                      async with pool.acquire() as conn:
                          row = await conn.fetchrow("""
                              SELECT instrument_id 
                              FROM dev_instrument_xrefs 
                              WHERE vendor_symbol = $1 
                                AND vendor_id = (SELECT id FROM dev_vendors WHERE name = 'polygon')
                              LIMIT 1
                          """, symbol)
                          return row['instrument_id'] if row else None
                  finally:
                      await pool.close()
          
          # FMP API configuration
          FMP_API_KEY = os.getenv("FMP_API_KEY")
          FMP_BASE_URL = "https://financialmodelingprep.com/api/v3"
          
          logger = logging.getLogger(__name__)
          
          async def fetch_fmp_historical_prices(session: aiohttp.ClientSession, symbol: str, 
                                              start_date: dt.date, end_date: dt.date) -> List[Dict[str, Any]]:
              """Fetch historical stock prices from Financial Modeling Prep API."""
              if not FMP_API_KEY:
                  logger.error("FMP_API_KEY not available")
                  return []
              
              url = f"{FMP_BASE_URL}/historical-price-full/{symbol}"
              params = {
                  'from': start_date.strftime('%Y-%m-%d'),
                  'to': end_date.strftime('%Y-%m-%d'),
                  'apikey': FMP_API_KEY
              }
              
              try:
                  async with session.get(url, params=params) as response:
                      if response.status == 429:
                          logger.warning(f"Rate limit exceeded for {symbol}")
                          await asyncio.sleep(60)
                          return []
                      
                      if response.status != 200:
                          error_text = await response.text()
                          logger.error(f"FMP API error for {symbol}: {response.status} - {error_text}")
                          return []
                      
                      data = await response.json()
                      
                      if "Error Message" in data:
                          logger.error(f"FMP error for {symbol}: {data['Error Message']}")
                          return []
                      
                      if 'historical' not in data:
                          logger.error(f"No historical data found for {symbol}")
                          return []
                      
                      historical_data = data['historical']
                      prices = []
                      
                      for price_data in historical_data:
                          try:
                              date_obj = dt.datetime.strptime(price_data['date'], "%Y-%m-%d").date()
                              
                              price_record = {
                                  'date': date_obj,
                                  'open_price': float(price_data.get('open', 0)),
                                  'high_price': float(price_data.get('high', 0)),
                                  'low_price': float(price_data.get('low', 0)),
                                  'close': float(price_data.get('close', 0)),
                                  'adj_close': float(price_data.get('adjClose', price_data.get('close', 0))),
                                  'volume': int(price_data.get('volume', 0))
                              }
                              
                              prices.append(price_record)
                              
                          except (ValueError, KeyError) as e:
                              logger.warning(f"Error parsing price data for {symbol}: {e}")
                              continue
                      
                      logger.info(f"Fetched {len(prices)} price records for {symbol}")
                      return prices
                      
              except aiohttp.ClientError as e:
                  logger.error(f"Connection error fetching {symbol} from FMP: {e}")
                  return []
          
          async def main():
              logging.basicConfig(level=logging.INFO)
              
              if not FMP_API_KEY:
                  print("❌ FMP_API_KEY environment variable not set")
                  return
              
              print("🚀 Starting Financial Modeling Prep daily price ingestion...")
              
              env = SimpleEnvironment()
              dao = SimpleFmpDAO(env)
              xrefs_dao = SimpleXrefsDAO(env)
              
              # Test with major stocks
              test_symbols = ['AAPL', 'MSFT', 'GOOGL']
              start_date = dt.date(2025, 8, 1)
              end_date = dt.date(2025, 8, 19)
              
              timeout = aiohttp.ClientTimeout(total=30)
              async with aiohttp.ClientSession(timeout=timeout) as session:
                  for symbol in test_symbols:
                      print(f"\nProcessing {symbol}...")
                      
                      instrument_id = await xrefs_dao.resolve_instrument_id(symbol)
                      if not instrument_id:
                          print(f"❌ Could not resolve instrument_id for {symbol}")
                          continue
                      
                      prices = await fetch_fmp_historical_prices(session, symbol, start_date, end_date)
                      if not prices:
                          print(f"❌ No price data received for {symbol}")
                          continue
                      
                      # Add instrument_id to all price records
                      for price in prices:
                          price['instrument_id'] = instrument_id
                      
                      if prices:
                          await dao.batch_insert_prices(prices)
                          print(f"✅ Stored {len(prices)} price records for {symbol}")
                      else:
                          print(f"⚠️  No price data for {symbol}")
                      
                      # Rate limiting: 250 calls per minute = ~0.25 seconds between calls
                      await asyncio.sleep(0.3)
              
              print(f"\n🎉 FMP ingestion completed!")
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          echo "Running Financial Modeling Prep daily price ingestion..."
          cd /app && python src/market_data/eod/daily_price_fmp.py
        env:
        - name: FMP_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: FMP_API_KEY
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: PYTHONPATH
          value: "/app/src"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"