apiVersion: batch/v1
kind: Job
metadata:
  name: analyze-price-coverage
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      containers:
      - name: coverage-analyzer
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "🚀 Installing dependencies..."
          pip install asyncpg tabulate
          
          echo "📊 Creating price coverage analysis..."
          mkdir -p /app
          cat > /app/analyze_coverage.py << 'EOF'
          import asyncio
          import asyncpg
          import logging
          from datetime import datetime, date, timedelta
          from typing import Dict, List, Optional
          from tabulate import tabulate
          
          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
          logger = logging.getLogger("coverage_analyzer")
          
          class CoverageAnalyzer:
              def __init__(self, db_connection: asyncpg.Connection):
                  self.conn = db_connection
                  
              async def get_table_info(self, table_name: str) -> Optional[Dict]:
                  """Get comprehensive information about a price table"""
                  try:
                      # Check if table exists
                      exists = await self.conn.fetchval("""
                          SELECT EXISTS (
                              SELECT FROM information_schema.tables 
                              WHERE table_schema = 'public' AND table_name = $1
                          )
                      """, table_name)
                      
                      if not exists:
                          return None
                      
                      # Get basic statistics
                      stats = await self.conn.fetchrow(f"""
                          SELECT 
                              COUNT(*) as total_records,
                              COUNT(DISTINCT symbol) as unique_symbols,
                              MIN(price_date) as earliest_date,
                              MAX(price_date) as latest_date,
                              COUNT(DISTINCT price_date) as unique_dates,
                              pg_size_pretty(pg_total_relation_size($1)) as table_size,
                              pg_size_pretty(pg_relation_size($1)) as data_size
                          FROM {table_name}
                      """, table_name)
                      
                      return {
                          'table_name': table_name,
                          'exists': True,
                          'total_records': stats['total_records'],
                          'unique_symbols': stats['unique_symbols'],
                          'earliest_date': stats['earliest_date'],
                          'latest_date': stats['latest_date'],
                          'unique_dates': stats['unique_dates'],
                          'table_size': stats['table_size'],
                          'data_size': stats['data_size']
                      }
                      
                  except Exception as e:
                      logger.error(f"Error analyzing {table_name}: {e}")
                      return {
                          'table_name': table_name,
                          'exists': False,
                          'error': str(e)
                      }
                      
              async def get_symbol_coverage_stats(self) -> Dict:
                  """Get symbol coverage statistics across all sources"""
                  try:
                      # Get unique symbols from instruments table
                      total_instruments = await self.conn.fetchval("""
                          SELECT COUNT(DISTINCT symbol) FROM dev_instruments
                          WHERE symbol IS NOT NULL AND symbol != ''
                      """)
                      
                      # Check coverage by each vendor
                      coverage_stats = {}
                      
                      for vendor in ['tiingo', 'fmp', 'alphavantage']:
                          table_name = f'dev_{vendor}_prices'
                          
                          try:
                              covered_symbols = await self.conn.fetchval(f"""
                                  SELECT COUNT(DISTINCT symbol) FROM {table_name}
                              """)
                              
                              coverage_pct = (covered_symbols / total_instruments * 100) if total_instruments > 0 else 0
                              
                              coverage_stats[vendor] = {
                                  'covered_symbols': covered_symbols,
                                  'total_instruments': total_instruments,
                                  'coverage_percentage': coverage_pct
                              }
                          except:
                              coverage_stats[vendor] = {
                                  'covered_symbols': 0,
                                  'total_instruments': total_instruments,
                                  'coverage_percentage': 0.0
                              }
                      
                      return coverage_stats
                      
                  except Exception as e:
                      logger.error(f"Error getting symbol coverage: {e}")
                      return {}
                      
              async def get_recent_data_quality(self) -> Dict:
                  """Analyze recent data quality and completeness"""
                  results = {}
                  recent_date = date.today() - timedelta(days=30)  # Last 30 days
                  
                  for vendor in ['tiingo', 'fmp', 'alphavantage']:
                      table_name = f'dev_{vendor}_prices'
                      
                      try:
                          # Get recent data statistics
                          recent_stats = await self.conn.fetchrow(f"""
                              SELECT 
                                  COUNT(*) as recent_records,
                                  COUNT(DISTINCT symbol) as recent_symbols,
                                  COUNT(DISTINCT price_date) as recent_dates,
                                  MAX(price_date) as latest_date
                              FROM {table_name}
                              WHERE price_date >= $1
                          """, recent_date)
                          
                          results[vendor] = {
                              'recent_records': recent_stats['recent_records'] if recent_stats else 0,
                              'recent_symbols': recent_stats['recent_symbols'] if recent_stats else 0,
                              'recent_dates': recent_stats['recent_dates'] if recent_stats else 0,
                              'latest_date': recent_stats['latest_date'] if recent_stats else None
                          }
                          
                      except Exception as e:
                          results[vendor] = {
                              'recent_records': 0,
                              'recent_symbols': 0,
                              'recent_dates': 0,
                              'latest_date': None,
                              'error': str(e)
                          }
                  
                  return results
                  
              async def get_checkpoint_progress(self) -> Dict:
                  """Get current checkpoint job progress"""
                  try:
                      progress = await self.conn.fetch("""
                          SELECT 
                              vendor,
                              COUNT(*) as total_assigned,
                              COUNT(CASE WHEN status = 'completed' THEN 1 END) as completed,
                              COUNT(CASE WHEN status = 'failed' THEN 1 END) as failed,
                              COUNT(CASE WHEN status = 'processing' THEN 1 END) as processing,
                              COUNT(CASE WHEN status = 'pending' THEN 1 END) as pending,
                              SUM(records_collected) as total_records_collected
                          FROM vendor_job_progress 
                          WHERE job_id LIKE '%30year%'
                          GROUP BY vendor
                      """)
                      
                      results = {}
                      for row in progress:
                          results[row['vendor']] = dict(row)
                      
                      return results
                      
                  except Exception as e:
                      logger.error(f"Error getting checkpoint progress: {e}")
                      return {}
                      
              async def analyze_comprehensive_coverage(self):
                  """Perform comprehensive coverage analysis"""
                  logger.info("="*80)
                  logger.info("📊 ATS-DEV DAILY PRICE COVERAGE ANALYSIS")
                  logger.info("="*80)
                  
                  # 1. Table-by-table analysis
                  tables_to_check = [
                      'dev_daily_prices_polygon',
                      'dev_daily_prices_tiingo', 
                      'dev_daily_prices',
                      'dev_tiingo_prices',
                      'dev_fmp_prices',
                      'dev_alphavantage_prices'
                  ]
                  
                  table_data = []
                  total_records_all = 0
                  total_symbols_all = set()
                  
                  print("\n🗃️  DATABASE TABLES ANALYSIS")
                  print("="*60)
                  
                  for table in tables_to_check:
                      info = await self.get_table_info(table)
                      
                      if info and info.get('exists'):
                          table_data.append([
                              table,
                              f"{info['total_records']:,}",
                              f"{info['unique_symbols']:,}",
                              info['earliest_date'].strftime('%Y-%m-%d') if info['earliest_date'] else 'N/A',
                              info['latest_date'].strftime('%Y-%m-%d') if info['latest_date'] else 'N/A',
                              f"{info['unique_dates']:,}",
                              info['table_size'],
                              info['data_size']
                          ])
                          
                          total_records_all += info['total_records']
                          
                          # Get symbols for this table
                          if info['total_records'] > 0:
                              try:
                                  symbols = await self.conn.fetch(f"SELECT DISTINCT symbol FROM {table}")
                                  total_symbols_all.update([row['symbol'] for row in symbols])
                              except:
                                  pass
                      else:
                          table_data.append([
                              table,
                              "0",
                              "0", 
                              "N/A",
                              "N/A",
                              "0",
                              "N/A",
                              "N/A"
                          ])
                  
                  headers = ["Table Name", "Records", "Symbols", "Earliest", "Latest", "Dates", "Total Size", "Data Size"]
                  print(tabulate(table_data, headers=headers, tablefmt="grid"))
                  
                  # 2. Symbol coverage analysis
                  print(f"\n📈 SYMBOL COVERAGE ANALYSIS")
                  print("="*60)
                  
                  coverage_stats = await self.get_symbol_coverage_stats()
                  coverage_data = []
                  
                  for vendor, stats in coverage_stats.items():
                      coverage_data.append([
                          vendor.upper(),
                          f"{stats['covered_symbols']:,}",
                          f"{stats['total_instruments']:,}",
                          f"{stats['coverage_percentage']:.1f}%"
                      ])
                  
                  coverage_headers = ["Vendor", "Symbols Covered", "Total Instruments", "Coverage %"]
                  print(tabulate(coverage_data, headers=coverage_headers, tablefmt="grid"))
                  
                  # 3. Recent data quality
                  print(f"\n📅 RECENT DATA QUALITY (Last 30 Days)")
                  print("="*60)
                  
                  recent_quality = await self.get_recent_data_quality()
                  quality_data = []
                  
                  for vendor, stats in recent_quality.items():
                      quality_data.append([
                          vendor.upper(),
                          f"{stats['recent_records']:,}",
                          f"{stats['recent_symbols']:,}",
                          f"{stats['recent_dates']:,}",
                          stats['latest_date'].strftime('%Y-%m-%d') if stats['latest_date'] else 'N/A'
                      ])
                  
                  quality_headers = ["Vendor", "Recent Records", "Recent Symbols", "Recent Dates", "Latest Date"]
                  print(tabulate(quality_data, headers=quality_headers, tablefmt="grid"))
                  
                  # 4. Current checkpoint job progress
                  print(f"\n🔄 ACTIVE CHECKPOINT JOB PROGRESS")
                  print("="*60)
                  
                  checkpoint_progress = await self.get_checkpoint_progress()
                  checkpoint_data = []
                  
                  for vendor, progress in checkpoint_progress.items():
                      progress_pct = (progress['completed'] / progress['total_assigned'] * 100) if progress['total_assigned'] > 0 else 0
                      
                      checkpoint_data.append([
                          vendor.upper(),
                          f"{progress['completed']:,}/{progress['total_assigned']:,}",
                          f"{progress_pct:.1f}%",
                          f"{progress['total_records_collected']:,}",
                          f"{progress['failed']:,}",
                          f"{progress['pending']:,}"
                      ])
                  
                  checkpoint_headers = ["Vendor", "Progress", "% Complete", "Records Collected", "Failed", "Pending"]
                  print(tabulate(checkpoint_data, headers=checkpoint_headers, tablefmt="grid"))
                  
                  # 5. Summary statistics
                  print(f"\n📊 OVERALL COVERAGE SUMMARY")
                  print("="*60)
                  print(f"📈 Total Records Across All Tables: {total_records_all:,}")
                  print(f"🎯 Unique Symbols with Data: {len(total_symbols_all):,}")
                  print(f"📅 Analysis Date: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}")
                  
                  # Calculate estimated completion for checkpoint jobs
                  print(f"\n🚀 CHECKPOINT JOB PROJECTIONS")
                  print("="*60)
                  
                  for vendor, progress in checkpoint_progress.items():
                      if progress['total_assigned'] > 0 and progress['completed'] > 0:
                          # Assume current processing rate continues
                          remaining = progress['pending']
                          if remaining > 0:
                              # Estimate based on average records per symbol
                              avg_records = progress['total_records_collected'] / progress['completed'] if progress['completed'] > 0 else 0
                              estimated_records = remaining * avg_records
                              
                              print(f"  {vendor.upper()}:")
                              print(f"    Remaining symbols: {remaining:,}")
                              print(f"    Estimated additional records: {estimated_records:,.0f}")
                              print(f"    Current avg records per symbol: {avg_records:.0f}")
                  
                  logger.info("="*80)
          
          async def main():
              """Main analysis function"""
              try:
                  # Database connection
                  conn = await asyncpg.connect(
                      host='postgres',
                      port=5432,
                      user='postgres',
                      password='dev_password',
                      database='dev_db'
                  )
                  logger.info("✅ Connected to database")
                  
                  # Perform comprehensive analysis
                  analyzer = CoverageAnalyzer(conn)
                  await analyzer.analyze_comprehensive_coverage()
                  
                  await conn.close()
                  logger.info("🎉 Coverage analysis completed!")
                  
              except Exception as e:
                  logger.error(f"💥 Analysis failed: {e}")
                  raise
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          cd /app && python analyze_coverage.py
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
      restartPolicy: OnFailure