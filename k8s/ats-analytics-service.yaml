            }
            
            async function loadDatasets() {
                try {
                    const sortBy = document.getElementById('datasetSortBy').value;
                    const sortDir = document.getElementById('datasetSortDir').value;
                    
                    const datasets = await fetch(`/api/v1/datasets?limit=20&sort_by=${sortBy}&sort_dir=${sortDir}`).then(r => r.json());
                    
                    // Update stats
                    document.getElementById('dataset-stats').innerHTML = `
                        <div class="stat-card">
