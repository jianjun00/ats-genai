    # NEW COVERAGE API ENDPOINTS
    @app.get("/api/v1/coverage/summary")
    async def get_coverage_summary(
        symbol: Optional[str] = Query(None, description="Filter by symbol"),
        vendor: Optional[str] = Query(None, description="Filter by vendor")
    ):
        """Get comprehensive coverage summary data"""
        summary = await manager.coverage_manager.get_coverage_summary(symbol, vendor)
        
        # Calculate aggregate statistics
        total_combinations = len(summary)
        active_count = len([s for s in summary if s['current_status'] == 'active'])
        avg_coverage_24h = sum(s['coverage_24h'] for s in summary) / max(1, total_combinations)
        avg_quality_24h = sum(s['quality_24h'] for s in summary) / max(1, total_combinations)
        
        return {
            "summary": summary,
            "total_combinations": total_combinations,
            "active_combinations": active_count,
            "average_coverage_24h": round(avg_coverage_24h, 2),
            "average_quality_24h": round(avg_quality_24h, 3),
            "filters": {"symbol": symbol, "vendor": vendor}
        }

    @app.get("/api/v1/coverage/gaps")
    async def get_coverage_gaps(
        symbol: Optional[str] = Query(None, description="Filter by symbol"),
        vendor: Optional[str] = Query(None, description="Filter by vendor"),
        severity: Optional[str] = Query(None, description="Filter by severity: low, medium, high"),
        resolved: Optional[bool] = Query(None, description="Filter by resolution status")
    ):
        """Get coverage gaps with optional filtering"""
        gaps = await manager.coverage_manager.get_coverage_gaps(symbol, vendor, severity, resolved)
        
        # Calculate gap statistics
        total_gaps = len(gaps)
        unresolved_gaps = len([g for g in gaps if not g['is_resolved']])
        high_severity = len([g for g in gaps if g['severity'] == 'high'])
        avg_duration = sum(g['gap_duration_minutes'] for g in gaps) / max(1, total_gaps)
        
        return {
            "gaps": gaps,
            "total_gaps": total_gaps,
            "unresolved_gaps": unresolved_gaps,
            "high_severity_gaps": high_severity,
            "average_gap_duration_minutes": round(avg_duration, 1),
            "filters": {
                "symbol": symbol,
                "vendor": vendor, 
                "severity": severity,
                "resolved": resolved
            }
        }

    @app.get("/api/v1/coverage/trends/{symbol}/{vendor}")
    async def get_coverage_trends(
        symbol: str,
        vendor: str,
        days_back: int = Query(30, ge=1, le=90, description="Number of days to look back")
    ):
        """Get coverage trends for a specific symbol/vendor"""
        trends = await manager.coverage_manager.get_coverage_trends(symbol, vendor, days_back)
        
        # Calculate trend statistics
        if trends:
            latest_coverage = trends[-1]['coverage_percentage']
            earliest_coverage = trends[0]['coverage_percentage']
            coverage_change = latest_coverage - earliest_coverage
            avg_coverage = sum(t['coverage_percentage'] for t in trends) / len(trends)
            avg_quality = sum(t['quality_score'] for t in trends if t['quality_score']) / max(1, len([t for t in trends if t['quality_score']]))
        else:
            latest_coverage = earliest_coverage = coverage_change = avg_coverage = avg_quality = 0
        
        return {
            "symbol": symbol,
            "vendor": vendor,
            "days_back": days_back,
            "trends": trends,
            "total_data_points": len(trends),
            "latest_coverage": round(latest_coverage, 2) if trends else 0,
            "coverage_change": round(coverage_change, 2) if trends else 0,
            "average_coverage": round(avg_coverage, 2) if trends else 0,
            "average_quality": round(avg_quality, 3) if trends else 0
        }

    @app.get("/api/v1/coverage/comparison/{symbol}")
    async def get_vendor_comparison(
        symbol: str,
        days_back: int = Query(7, ge=1, le=30, description="Number of days for comparison")
    ):
        """Compare coverage across vendors for a specific symbol"""
        return await manager.coverage_manager.get_vendor_comparison(symbol, days_back)

