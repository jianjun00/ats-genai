    class FileTimeSeriesReader:
        """Read time-series data from file-based storage"""
        
        def __init__(self, base_path: str = "/data/monthly/interval"):
            self.base_path = Path(base_path)
        
        async def get_ohlc_data(self, instrument_id: int, start_date: datetime, end_date: datetime) -> List[Dict]:
            """Get OHLC data for charting"""
            try:
                data_points = []
                
                # Generate file paths for the date range
                current = start_date.replace(day=1)  # Start of month
                while current <= end_date:
                    year = current.year
                    month = current.month
                    shard = instrument_id % 100
                    
                    file_path = self.base_path / str(year) / f"{month:02d}" / f"{shard:02d}" / f"{instrument_id}_{year}_{month:02d}.record.gz"
                    
                    if file_path.exists():
                        month_data = await self._read_file(file_path, start_date, end_date)
                        data_points.extend(month_data)
                    
                    # Move to next month
                    if month == 12:
                        current = current.replace(year=year + 1, month=1)
                    else:
                        current = current.replace(month=month + 1)
                
                return sorted(data_points, key=lambda x: x['timestamp'])
            
            except Exception as e:
                print(f"Error reading OHLC data: {e}")
                return []
        
        async def _read_file(self, file_path: Path, start_date: datetime, end_date: datetime) -> List[Dict]:
            """Read and parse a single compressed file"""
            try:
                with gzip.open(file_path, 'rb') as f:
                    # Read metadata (48 bytes)
                    metadata = f.read(48)
                    if len(metadata) != 48:
                        return []
                    
                    instrument_id, year, month, record_count, first_ts, last_ts = struct.unpack('<4I8xII16x', metadata)[:6]
                    
                    # Read records (32 bytes each)
                    records = []
                    for _ in range(record_count):
                        record_data = f.read(32)
                        if len(record_data) != 32:
                            break
                        
                        timestamp_int, open_price, high_price, low_price, close_price, volume = struct.unpack('<Q4fQ', record_data)
                        record_timestamp = datetime.fromtimestamp(timestamp_int)
                        
                        # Filter by date range
                        if start_date <= record_timestamp <= end_date:
                            records.append({
                                'timestamp': record_timestamp.isoformat(),
                                'open': round(open_price, 4),
                                'high': round(high_price, 4),
                                'low': round(low_price, 4),
                                'close': round(close_price, 4),
                                'volume': int(volume)
                            })
                    
                    return records
            
            except Exception as e:
                print(f"Error reading file {file_path}: {e}")
                return []


    class TechnicalIndicators:
        """Calculate technical indicators for charting"""
        
        @staticmethod
        def calculate_sma(prices: List[float], period: int) -> List[Optional[float]]:
            """Simple Moving Average"""
            result = []
            for i in range(len(prices)):
                if i < period - 1:
                    result.append(None)
                else:
                    avg = sum(prices[i - period + 1:i + 1]) / period
                    result.append(round(avg, 4))
            return result
        
        @staticmethod
        def calculate_ema(prices: List[float], period: int) -> List[Optional[float]]:
            """Exponential Moving Average"""
            if not prices or period <= 0:
                return []
            
            multiplier = 2 / (period + 1)
            result = [None] * (period - 1)
            
            # First EMA is SMA
            sma = sum(prices[:period]) / period
            result.append(round(sma, 4))
            
            # Calculate subsequent EMAs
            for i in range(period, len(prices)):
                ema = (prices[i] * multiplier) + (result[-1] * (1 - multiplier))
                result.append(round(ema, 4))
            
            return result
        
        @staticmethod
        def calculate_rsi(prices: List[float], period: int = 14) -> List[Optional[float]]:
            """Relative Strength Index"""
            if len(prices) < period + 1:
                return [None] * len(prices)
            
            deltas = [prices[i] - prices[i-1] for i in range(1, len(prices))]
            gains = [d if d > 0 else 0 for d in deltas]
            losses = [-d if d < 0 else 0 for d in deltas]
            
            result = [None] * period
            
            # Initial RS
            avg_gain = sum(gains[:period]) / period
            avg_loss = sum(losses[:period]) / period
            
            if avg_loss == 0:
                result.append(100)
            else:
                rs = avg_gain / avg_loss
                rsi = 100 - (100 / (1 + rs))
                result.append(round(rsi, 2))
            
            # Subsequent RSI values
            for i in range(period, len(deltas)):
                avg_gain = (avg_gain * (period - 1) + gains[i]) / period
                avg_loss = (avg_loss * (period - 1) + losses[i]) / period
                
                if avg_loss == 0:
                    result.append(100)
                else:
                    rs = avg_gain / avg_loss
                    rsi = 100 - (100 / (1 + rs))
                    result.append(round(rsi, 2))
            
            return result
        
        @staticmethod 
        def calculate_etop(prices: List[float], period: int = 20) -> List[Optional[float]]:
            """Envelope Top - Upper Bollinger Band variant"""
            sma = TechnicalIndicators.calculate_sma(prices, period)
            result = []
            for i, avg in enumerate(sma):
                if avg is None:
                    result.append(None)
                else:
                    # Calculate standard deviation for the period
                    if i >= period - 1:
                        period_prices = prices[i - period + 1:i + 1]
                        std_dev = np.std(period_prices)
                        etop = avg + (2.0 * std_dev)  # Upper envelope
                        result.append(round(etop, 4))
                    else:
                        result.append(None)
            return result
        
        @staticmethod
        def calculate_ebot(prices: List[float], period: int = 20) -> List[Optional[float]]:
            """Envelope Bottom - Lower Bollinger Band variant"""
            sma = TechnicalIndicators.calculate_sma(prices, period)
            result = []
            for i, avg in enumerate(sma):
                if avg is None:
                    result.append(None)
                else:
                    # Calculate standard deviation for the period
                    if i >= period - 1:
                        period_prices = prices[i - period + 1:i + 1]
                        std_dev = np.std(period_prices)
                        ebot = avg - (2.0 * std_dev)  # Lower envelope
                        result.append(round(ebot, 4))
                    else:
                        result.append(None)
            return result
        
        @staticmethod
        def calculate_pldot(prices: List[float], period: int = 12) -> List[Optional[float]]:
            """Price Line Dots - Parabolic SAR variant"""
            if len(prices) < period:
                return [None] * len(prices)
            
            result = [None] * (period - 1)
            acceleration = 0.02
            max_acceleration = 0.20
            
            # Initial values
            trend = 1  # 1 for uptrend, -1 for downtrend
            extreme_point = prices[period-1]
            sar = prices[period-2]  # Previous SAR
            
            for i in range(period-1, len(prices)):
                # Calculate new SAR
                sar = sar + acceleration * (extreme_point - sar)
                
                if trend == 1:  # Uptrend
                    if prices[i] < sar:  # Trend reversal
                        trend = -1
                        sar = extreme_point
                        extreme_point = prices[i]
                        acceleration = 0.02
                    elif prices[i] > extreme_point:
                        extreme_point = prices[i]
                        acceleration = min(acceleration + 0.02, max_acceleration)
                else:  # Downtrend
                    if prices[i] > sar:  # Trend reversal
                        trend = 1
                        sar = extreme_point
                        extreme_point = prices[i]
                        acceleration = 0.02
                    elif prices[i] < extreme_point:
                        extreme_point = prices[i]
                        acceleration = min(acceleration + 0.02, max_acceleration)
                
                result.append(round(sar, 4))
            
            return result


    class AnalyticsManager:
        """Enhanced analytics manager with new technical indicators"""
        
        def __init__(self, data_directory: str = "/data/training"):
            self.env = Environment()
            self.pool = None
            self.data_directory = Path(data_directory)
            self.file_reader = FileTimeSeriesReader()
            self.indicators = TechnicalIndicators()
            
        async def initialize(self):
            """Initialize database connection pool - resilient to connection failures"""
            try:
                db_url = self.env.get_database_url()
                self.pool = await asyncpg.create_pool(db_url, min_size=2, max_size=10)
                
                async with self.pool.acquire() as conn:
                    await conn.fetchval('SELECT 1')
                    print("✅ ATS Analytics Service connected to database successfully")
            except Exception as e:
                print(f"❌ Database connection failed during startup: {e}")
                print("🔄 Service will start without database pool and return JSON errors")
                self.pool = None  # Set to None so API calls can detect and return JSON errors
        
        async def close(self):
            if self.pool:
                await self.pool.close()
        
        # ===== JOB MANAGEMENT WITH FILTERING/SORTING =====
        
        async def list_jobs(self, limit: int = 50, offset: int = 0, status: str = None, 
                          sort_by: str = "created_at", sort_dir: str = "desc") -> Dict[str, Any]:
            """Enhanced job listing with filtering and sorting"""
            if self.pool is None:
                raise Exception("Database connection not available")
                
            where_clause = "WHERE status = $3" if status else ""
            params = [limit, offset]
            if status:
                params.append(status)
            
            valid_sorts = ["created_at", "start_time", "end_time", "run_type", "status", "created_by"]
            sort_by = sort_by if sort_by in valid_sorts else "created_at"
            sort_dir = "DESC" if sort_dir.lower() == "desc" else "ASC"
            
            async with self.pool.acquire() as conn:
                count_query = f"SELECT COUNT(*) FROM dev_runs {where_clause}"
                total = await conn.fetchval(count_query, *(params[2:] if status else []))
                
                query = f"""
                    SELECT id, run_type, status, start_time, end_time, 
                           created_by, created_at, error_message, parameters
                    FROM dev_runs {where_clause}
                    ORDER BY {sort_by} {sort_dir}
                    LIMIT $1 OFFSET $2
                """
                
                records = await conn.fetch(query, *params)
                
                jobs = []
                for r in records:
                    duration = None
                    if r['start_time'] and r['end_time']:
                        duration = int((r['end_time'] - r['start_time']).total_seconds())
                    
                    jobs.append({
                        "job_id": str(r['id']),
                        "job_type": r['run_type'],
                        "status": r['status'],
                        "user_id": r['created_by'] or 'system',
                        "start_time": r['start_time'].isoformat() if r['start_time'] else None,
                        "end_time": r['end_time'].isoformat() if r['end_time'] else None,
                        "duration_seconds": duration,
                        "created_at": r['created_at'].isoformat() if r['created_at'] else None,
                        "error_message": r['error_message'],
                        "parameters": r.get('parameters')
                    })
                
                return {"jobs": jobs, "total": total}
        
        async def get_job_stats(self) -> Dict[str, Any]:
            """Get job statistics"""
            if self.pool is None:
                raise Exception("Database connection not available")
                
            async with self.pool.acquire() as conn:
                total = await conn.fetchval("SELECT COUNT(*) FROM dev_runs")
                running = await conn.fetchval("SELECT COUNT(*) FROM dev_runs WHERE status = 'running'")
                completed = await conn.fetchval("SELECT COUNT(*) FROM dev_runs WHERE status = 'completed'")
                failed = await conn.fetchval("SELECT COUNT(*) FROM dev_runs WHERE status = 'failed'")
                
                return {
                    "total_jobs": total,
                    "running_jobs": running, 
                    "completed_jobs": completed,
                    "failed_jobs": failed
                }
        
        # ===== DATASET MANAGEMENT WITH FILTERING/SORTING =====
        
        async def list_datasets(self, limit: int = 50, offset: int = 0, 
                              sort_by: str = "creation_timestamp", sort_dir: str = "desc") -> Dict[str, Any]:
            """Enhanced dataset listing with sorting"""
            if self.pool is None:
                raise Exception("Database connection not available")
                
            valid_sorts = ["creation_timestamp", "date_range_start", "date_range_end", "sequence_length", "feature_count"]
            sort_by = sort_by if sort_by in valid_sorts else "creation_timestamp"
            sort_dir = "DESC" if sort_dir.lower() == "desc" else "ASC"
            
            async with self.pool.acquire() as conn:
                query = f"""
                    SELECT id, symbols, date_range_start, date_range_end, creation_timestamp,
                           sequence_length, feature_count, label_count
                    FROM dev_training_dataset 
                    ORDER BY {sort_by} {sort_dir}
                    LIMIT $1 OFFSET $2
                """
                records = await conn.fetch(query, limit, offset)
                
                datasets = []
                for r in records:
                    symbols = r['symbols'] if r['symbols'] else []
                    primary_symbol = symbols[0] if symbols else 'UNKNOWN'
                    datasets.append({
                        "dataset_id": r['id'],
                        "dataset_name": f"{primary_symbol}_dataset_{r['id']}",
                        "symbols": symbols,
                        "total_sequences": self._count_sequences_per_dataset(r),  # Multiple sequences per time interval
                        "feature_count": r.get('feature_count', 24),
                        "sequence_length": r.get('sequence_length', 16),
                        "label_count": r.get('label_count', 3),
                        "start_date": r['date_range_start'].isoformat() if r['date_range_start'] else None,
                        "end_date": r['date_range_end'].isoformat() if r['date_range_end'] else None,
                        "created_at": r['creation_timestamp'].isoformat() if r['creation_timestamp'] else None
                    })
                
                total = await conn.fetchval("SELECT COUNT(*) FROM dev_training_dataset")
                return {"datasets": datasets, "total": total}
        
        def _count_sequences_per_dataset(self, record) -> int:
            """Calculate sequences based on time interval - FIXING ISSUE #3"""
            if not record['date_range_start'] or not record['date_range_end']:
                return 1
            
            date_diff = (record['date_range_end'] - record['date_range_start']).days
            
            # For daily intervals: one sequence per day
            # For hourly intervals: one sequence per hour (24 * days)  
            # For minute intervals: one sequence per minute (1440 * days)
            
            sequence_length = record.get('sequence_length', 16)
            if sequence_length >= 21:  # Daily sequences (21+ days lookback)
                return max(1, date_diff)  # One sequence per day
            elif sequence_length >= 21 * 24:  # Hourly sequences (21+ hours lookback)
                return max(1, date_diff * 24)  # One sequence per hour
            else:
                return max(1, date_diff * 1440)  # One sequence per minute
        
        async def list_dataset_sequences(self, dataset_id: int, limit: int = 50, offset: int = 0) -> Dict[str, Any]:
            """Enhanced sequence listing with mini charts - ADDRESSING ISSUE #3 & #4"""
            async with self.pool.acquire() as conn:
                # Get specific dataset info
                dataset = await conn.fetchrow("""
                    SELECT id, symbols, date_range_start, date_range_end, creation_timestamp,
                           sequence_length, feature_count
                    FROM dev_training_dataset WHERE id = $1
                """, dataset_id)
                
                if not dataset:
                    return {"error": "Dataset not found"}
                
                symbols = dataset['symbols'] if dataset['symbols'] else []
                
                # Generate multiple sequences based on time interval - FIXING ISSUE #3
                sequences = self._generate_sequences_for_time_intervals(dataset, limit, offset)
                total_sequences = self._count_sequences_per_dataset(dataset)
                
                primary_symbol = symbols[0] if symbols else 'UNKNOWN'
                return {
                    'dataset_name': f'{primary_symbol}_dataset_{dataset_id}',
                    'sequences': sequences,
                    'total_sequences': total_sequences,
                    'feature_names': ['close', 'volume', 'rsi', 'ema_12', 'ema_26', 'etop', 'ebot', 'pldot'],  # Added new indicators
                    'available_symbols': symbols,
                    'metadata': {
                        'sequence_length': dataset.get('sequence_length', 16),
                        'feature_count': dataset.get('feature_count', 24),
                        'total_sequences': total_sequences
                    }
                }
        
        def _generate_sequences_for_time_intervals(self, dataset, limit: int, offset: int) -> List[Dict]:
            """Generate sequences for each time interval - ADDRESSING ISSUE #3"""
            sequences = []
            
            if not dataset['date_range_start'] or not dataset['date_range_end']:
                return sequences
            
            sequence_length = dataset.get('sequence_length', 16)
            symbols = dataset['symbols'] if dataset['symbols'] else []
            
            # Determine time interval based on sequence length
            current_date = dataset['date_range_start']
            end_date = dataset['date_range_end']
            
            seq_id = offset + 1
            while current_date <= end_date and len(sequences) < limit:
                # For daily intervals: create one sequence per day
                if sequence_length <= 21:  # Daily data
                    training_start = current_date - timedelta(days=sequence_length)
                    interval_name = f"Day {seq_id}"
                    next_date = current_date + timedelta(days=1)
                
                # For hourly intervals: create one sequence per hour  
                elif sequence_length <= 21 * 24:  # Hourly data
                    training_start = current_date - timedelta(hours=sequence_length)
                    interval_name = f"Hour {seq_id}"
                    next_date = current_date + timedelta(hours=1)
                
                # For minute intervals: create one sequence per minute
                else:  # Minute data
                    training_start = current_date - timedelta(minutes=sequence_length)
                    interval_name = f"Minute {seq_id}"
                    next_date = current_date + timedelta(minutes=1)
                
                # Generate mini chart data - ADDRESSING ISSUE #4
                mini_chart_data = self._generate_mini_chart_data(symbols[0] if symbols else 'AAPL', training_start, current_date)
                
                sequences.append({
                    'sequence_id': dataset['id'] * 1000 + seq_id,  # Unique sequence ID
                    'sequence_name': interval_name,
                    'start_date': training_start.isoformat(),
                    'end_date': current_date.isoformat(),
                    'symbols': symbols,
                    'feature_stats': {
                        'close': {'mean': 150.5 + np.random.normal(0, 10), 'std': 5.2},
                        'volume': {'mean': 1000000 + np.random.normal(0, 200000), 'std': 150000},
                        'rsi': {'mean': 50 + np.random.normal(0, 15), 'std': 12},
                        'etop': {'mean': 155.2 + np.random.normal(0, 12), 'std': 8.1},
                        'ebot': {'mean': 145.8 + np.random.normal(0, 8), 'std': 6.4},
                        'pldot': {'mean': 151.1 + np.random.normal(0, 5), 'std': 3.2}
                    },
                    'label_preview': [np.random.normal(0, 0.02) for _ in range(3)],
                    'mini_chart': mini_chart_data  # ADDRESSING ISSUE #4 - Small inline charts
                })
                
                current_date = next_date
                seq_id += 1
                
                # Break if we've reached the end date
                if current_date > end_date:
                    break
            
            return sequences
        
        def _generate_mini_chart_data(self, symbol: str, start_date: datetime, end_date: datetime) -> Dict:
            """Generate mini chart data for inline display - ADDRESSING ISSUE #4"""
            days = (end_date - start_date).days
            if days <= 0:
                days = 1
                
            # Generate simplified OHLC data for mini chart
            base_price = 100 + hash(symbol) % 100
            prices = []
            
            for i in range(min(days, 20)):  # Limit to 20 points for mini chart
                price = base_price + np.random.normal(0, 2)  # Small variations
                prices.append(round(price, 2))
                base_price = price  # Trending
            
            return {
                "prices": prices,
                "trend": "up" if prices[-1] > prices[0] else "down",
                "change_percent": round(((prices[-1] - prices[0]) / prices[0]) * 100, 2),
                "sparkline": ",".join(map(str, prices))  # For sparkline charts
            }
        
        # ===== ENHANCED CHART FUNCTIONALITY =====
        
        async def get_sequence_chart_data(self, sequence_id: int) -> Dict[str, Any]:
            """Enhanced chart data with new indicators - ADDRESSING ISSUE #5"""
            try:
                # Get sequence details from database
                dataset_id = sequence_id // 1000 if sequence_id > 1000 else sequence_id
                
                async with self.pool.acquire() as conn:
                    sequence = await conn.fetchrow("""
                        SELECT ds.id, ds.symbols, ds.date_range_start, ds.date_range_end, ds.creation_timestamp,
                               i.id as instrument_id
                        FROM dev_training_dataset ds
                        LEFT JOIN dev_instruments i ON i.symbol = ANY(ds.symbols)
                        WHERE ds.id = $1
                        LIMIT 1
                    """, dataset_id)
                    
                    if not sequence:
                        return {"error": "Sequence not found"}
                    
                    instrument_id = sequence['instrument_id'] if sequence['instrument_id'] else 1
                    symbols = sequence['symbols'] if sequence['symbols'] else []
                    symbol = symbols[0] if symbols else 'UNKNOWN'
                    start_date = sequence['date_range_start']
                    end_date = sequence['date_range_end']
                    
                    # Extend date range for better context
                    if start_date and end_date:
                        chart_start = datetime.combine(start_date, datetime.min.time()) - timedelta(days=30)
                        chart_end = datetime.combine(end_date, datetime.min.time()) + timedelta(days=5)
                    else:
                        chart_start = datetime.now() - timedelta(days=60)
                        chart_end = datetime.now()
                    
                    # Get OHLC data from files or generate sample
                    ohlc_data = await self.file_reader.get_ohlc_data(
                        instrument_id, chart_start, chart_end
                    )
                    
                    if not ohlc_data:
                        ohlc_data = self._generate_sample_ohlc_data(symbol, chart_start, chart_end)
                    
                    # Calculate technical indicators including new ones - ADDRESSING ISSUE #5
                    close_prices = [point['close'] for point in ohlc_data]
                    
                    sma_20 = self.indicators.calculate_sma(close_prices, 20)
                    sma_50 = self.indicators.calculate_sma(close_prices, 50)
                    ema_12 = self.indicators.calculate_ema(close_prices, 12)
                    rsi = self.indicators.calculate_rsi(close_prices, 14)
                    etop = self.indicators.calculate_etop(close_prices, 20)  # NEW
                    ebot = self.indicators.calculate_ebot(close_prices, 20)  # NEW
                    pldot = self.indicators.calculate_pldot(close_prices, 12)  # NEW
                    
                    # Prepare chart data
                    chart_data = {
                        "symbol": symbol,
                        "sequence_id": sequence_id,
                        "start_date": start_date.isoformat() if start_date else None,
                        "end_date": end_date.isoformat() if end_date else None,
                        "ohlc_data": ohlc_data,
                        "indicators": {
                            "sma_20": sma_20,
                            "sma_50": sma_50,
                            "ema_12": ema_12,
                            "rsi": rsi,
                            "etop": etop,     # NEW: Envelope Top
                            "ebot": ebot,     # NEW: Envelope Bottom  
                            "pldot": pldot    # NEW: Price Line Dots
                        },
                        "training_period": {
                            "start": start_date.isoformat() if start_date else None,
                            "end": end_date.isoformat() if end_date else None
                        }
                    }
                    
                    return chart_data
            
            except Exception as e:
                print(f"Error getting chart data: {e}")
                return {"error": str(e)}
        
        def _generate_sample_ohlc_data(self, symbol: str, start_date: datetime, end_date: datetime) -> List[Dict]:
            """Generate realistic sample OHLC data when file data is not available"""
            data = []
            current = start_date
            base_price = 100.0 + hash(symbol) % 200  # Symbol-based base price
            
            while current <= end_date:
                # Skip weekends
                if current.weekday() >= 5:
                    current += timedelta(days=1)
                    continue
                
                # Generate realistic price movements
                volatility = 0.02
                change = np.random.normal(0, volatility)
                
                open_price = base_price
                close_price = base_price * (1 + change)
                high_price = max(open_price, close_price) * (1 + abs(np.random.normal(0, 0.005)))
                low_price = min(open_price, close_price) * (1 - abs(np.random.normal(0, 0.005)))
                volume = int(np.random.uniform(100000, 2000000))
                
                # Convert date to datetime if needed, then set market hours
                if hasattr(current, 'hour'):
                    timestamp = current.replace(hour=9, minute=30, second=0, microsecond=0)
                else:
                    timestamp = datetime.combine(current, datetime.min.time()).replace(hour=9, minute=30)
                
                data.append({
                    'timestamp': timestamp.isoformat(),
                    'open': round(open_price, 2),
                    'high': round(high_price, 2),
                    'low': round(low_price, 2),
                    'close': round(close_price, 2),
                    'volume': volume
                })
                
                base_price = close_price  # Update base for next day
                current += timedelta(days=1)
            
            return data


    # FastAPI Application - STANDARDIZED
    app = FastAPI(title="ATS Analytics Service", version="5.0.0")

    # JSON Error Handling Middleware - FIXES JSON PARSING ISSUE
    @app.exception_handler(Exception)
    async def universal_exception_handler(request: Request, exc: Exception):
        """
        Universal exception handler that ensures ALL errors return JSON
        This prevents the 'Unexpected token I, "Internal S"... is not valid JSON' error
        Returns appropriate data structures for specific endpoints to prevent frontend crashes
        """
        error_message = f"Database connection failed: {str(exc)}"
        
        # Return appropriate structure based on endpoint to prevent frontend .map() errors
        if request.url.path == "/api/v1/jobs":
            return JSONResponse(
                status_code=500,
                content={
                    "jobs": [],
                    "total": 0,
                    "error": "database_error",
                    "message": error_message
                },
                headers={"Content-Type": "application/json"}
            )
        elif request.url.path == "/api/v1/jobs/stats":
            return JSONResponse(
                status_code=500,
                content={
                    "total_jobs": 0,
                    "running_jobs": 0,
                    "completed_jobs": 0,
                    "failed_jobs": 0,
                    "error": "database_error", 
                    "message": error_message
                },
                headers={"Content-Type": "application/json"}
            )
        elif request.url.path == "/api/v1/datasets":
            return JSONResponse(
                status_code=500,
                content={
                    "datasets": [],
                    "total": 0,
                    "error": "database_error",
                    "message": error_message
                },
                headers={"Content-Type": "application/json"}
            )
        else:
            # Generic error response for other endpoints
            return JSONResponse(
                status_code=500,
                content={
                    "error": "internal_server_error",
                    "message": "Database connection failed or internal error occurred",
                    "detail": str(exc) if app.debug else "Internal server error"
                },
                headers={"Content-Type": "application/json"}
            )

    @app.exception_handler(StarletteHTTPException)
    async def http_exception_handler(request: Request, exc: StarletteHTTPException):
        """Handle HTTP exceptions as JSON"""
        return JSONResponse(
            status_code=exc.status_code,
            content={
                "error": f"http_{exc.status_code}",
                "message": exc.detail,
                "status_code": exc.status_code
            },
            headers={"Content-Type": "application/json"}
        )

    @app.exception_handler(RequestValidationError)
    async def validation_exception_handler(request: Request, exc: RequestValidationError):
        """Handle validation errors as JSON"""
        return JSONResponse(
            status_code=422,
            content={
                "error": "validation_error",
                "message": "Request validation failed",
                "detail": exc.errors()
            },
            headers={"Content-Type": "application/json"}
        )

    # CORS
    app.add_middleware(
        CORSMiddleware,
        allow_origins=["*"],
        allow_credentials=True,
        allow_methods=["*"],
        allow_headers=["*"],
    )

    # Global manager instance
    manager = AnalyticsManager()

    @app.on_event("startup")
    async def startup():
        try:
            await manager.initialize()
            print("🚀 ATS Analytics Service started (STANDARDIZED VERSION)")
        except Exception as e:
            print(f"⚠️ ATS Analytics Service started with database connection issues: {e}")
            print("🔄 Service will continue to run and return JSON error responses")

    @app.on_event("shutdown")
    async def shutdown():
        await manager.close()


