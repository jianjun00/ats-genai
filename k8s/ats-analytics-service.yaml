    <script>function showTab(t){document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.querySelectorAll('.tab').forEach(c=>c.classList.remove('active'));document.getElementById(t).classList.add('active');event.target.classList.add('active');t==='jobs'?loadJobs():t==='datasets'?loadDatasets():loadCoverage()}async function loadJobs(){try{const s=await fetch('/api/v1/jobs/stats'),stats=await s.json();document.getElementById('jobs-stats').innerHTML=`<div class="stat-card"><div class="stat-number">${stats.total_jobs}</div><div class="stat-label">Total</div></div><div class="stat-card"><div class="stat-number">${stats.running_jobs}</div><div class="stat-label">Running</div></div><div class="stat-card"><div class="stat-number">${stats.completed_jobs}</div><div class="stat-label">Completed</div></div><div class="stat-card"><div class="stat-number">${stats.failed_jobs}</div><div class="stat-label">Failed</div></div>`;const j=await fetch('/api/v1/jobs'),jobs=await j.json();document.getElementById('jobs-list').innerHTML=jobs.jobs?.length?jobs.jobs.map(job=>`<div class="list-item"><div style="display:flex;justify-content:space-between"><div><h4>${job.job_type}</h4><p>ID: ${job.id}</p></div><span class="status ${job.status}">${job.status}</span></div></div>`).join(''):'<div class="loading">No jobs found.</div>'}catch(e){document.getElementById('jobs-stats').innerHTML='<div class="error">Error loading jobs</div>'}}async function loadDatasets(){try{const r=await fetch('/api/v1/datasets'),data=await r.json();document.getElementById('datasets-list').innerHTML=data.datasets?.length?data.datasets.map(d=>`<div class="list-item" onclick="showDatasetDetail(${d.dataset_id})" style="cursor:pointer"><div><h4>${d.dataset_name}</h4><p>Symbol: ${d.symbols?.join(', ')} | Size: ${d.file_size_mb}MB | Sequences: ${d.total_sequences}</p><span class="status ${d.status}">${d.status}</span></div></div>`).join(''):'<div class="loading">No datasets found.</div>'}catch(e){document.getElementById('datasets-list').innerHTML='<div class="error">Error loading datasets</div>'}}async function loadCoverage(){try{const s=await fetch('/api/v1/coverage/summary'),summary=await s.json();document.getElementById('coverage-stats').innerHTML=`<div class="stat-card"><div class="stat-number">${summary.total_combinations}</div><div class="stat-label">Combinations</div></div><div class="stat-card"><div class="stat-number">${summary.active_combinations}</div><div class="stat-label">Active</div></div><div class="stat-card"><div class="stat-number">${summary.average_coverage_24h}%</div><div class="stat-label">Avg Coverage</div></div><div class="stat-card"><div class="stat-number">${(summary.average_quality_24h*100).toFixed(1)}%</div><div class="stat-label">Avg Quality</div></div>`;document.getElementById('coverage-summary').innerHTML=summary.summary?.slice(0,12).map(item=>`<div class="coverage-card"><div><strong>${item.symbol} - ${item.vendor}</strong></div><p>24h: ${item.coverage_24h}% | 7d: ${item.coverage_7d}%</p><p>Quality: ${(item.quality_24h*100).toFixed(1)}%</p><span class="status ${item.current_status}">${item.current_status}</span></div>`).join('')||'<div class="loading">No coverage data</div>';const g=await fetch('/api/v1/coverage/gaps'),gaps=await g.json();document.getElementById('coverage-gaps').innerHTML=gaps.gaps?.slice(0,10).map(gap=>`<div class="list-item"><div><h4>${gap.symbol} - ${gap.vendor}</h4><p>Duration: ${gap.gap_duration_minutes} min | ${gap.severity}</p></div></div>`).join('')||'<div class="loading">No gaps found</div>'}catch(e){document.getElementById('coverage-stats').innerHTML='<div class="error">Error loading coverage</div>'}}async function showDatasetDetail(datasetId){document.getElementById('datasets-list').style.display='none';document.getElementById('dataset-detail').style.display='block';try{const r=await fetch(`/api/v1/datasets/${datasetId}`),data=await r.json();const s=await fetch(`/api/v1/datasets/${datasetId}/sequences?limit=5`),sequences=await s.json();document.getElementById('dataset-detail-content').innerHTML=`<h3>${data.dataset_name} Details</h3><div class="stats-grid"><div class="stat-card"><div class="stat-number">${data.total_sequences}</div><div class="stat-label">Sequences</div></div><div class="stat-card"><div class="stat-number">${data.feature_count}</div><div class="stat-label">Features</div></div><div class="stat-card"><div class="stat-number">${data.sequence_length}</div><div class="stat-label">Length</div></div><div class="stat-card"><div class="stat-number">${data.file_size_mb}MB</div><div class="stat-label">Size</div></div></div><h4>Sample Sequences:</h4><div class="list-container">${sequences.sequences?.slice(0,3).map(seq=>`<div class="list-item" onclick="showSequenceDetail(${datasetId},${seq.sequence_id})" style="cursor:pointer"><div><h5>${seq.sequence_name}</h5><p>${seq.start_date} - ${seq.end_date}</p></div></div>`).join('')||'No sequences'}</div>`}catch(e){document.getElementById('dataset-detail-content').innerHTML='<div class="error">Error loading dataset details</div>'}}function showDatasetsList(){document.getElementById('dataset-detail').style.display='none';document.getElementById('datasets-list').style.display='block'}async function showSequenceDetail(datasetId,sequenceId){document.getElementById('dataset-detail-content').style.display='none';document.getElementById('multi-timeframe-charts').style.display='grid';try{const r=await fetch(`/api/v1/datasets/${datasetId}/sequences/${sequenceId}/ohlc`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const ohlc=await r.json();console.log('OHLC Data:',ohlc);await renderMultiTimeframeCharts(ohlc)}catch(e){console.error('Chart Error:',e);document.getElementById('multi-timeframe-charts').innerHTML=`<div class="error">Error loading OHLC visualization: ${e.message}</div>`}}async function renderMultiTimeframeCharts(ohlcData){const timeframes=[{id:'monthly',label:'Monthly',intervals:12,data:generateTimeframeData(ohlcData.ohlc_data,12)},{id:'weekly',label:'Weekly',intervals:52,data:generateTimeframeData(ohlcData.ohlc_data,52)},{id:'daily',label:'Daily',intervals:252,data:ohlcData.ohlc_data?.slice(0,252)||[]},{id:'1hour',label:'1-Hour',intervals:720,data:generateTimeframeData(ohlcData.ohlc_data,720)},{id:'15min',label:'15-Minute',intervals:960,data:generateTimeframeData(ohlcData.ohlc_data,960)},{id:'5min',label:'5-Minute',intervals:1440,data:ohlcData.ohlc_data||[]}];for(const tf of timeframes){await renderTimeframeChart(tf)}}function generateTimeframeData(baseData,intervals){if(!baseData||baseData.length===0)return[];const step=Math.max(1,Math.floor(baseData.length/intervals));return baseData.filter((_, index)=>index%step===0).slice(0,intervals)}async function renderTimeframeChart(timeframe){const canvas=document.querySelector(`#${timeframe.id}-chart canvas`);if(!canvas)return;const ctx=canvas.getContext('2d');if(canvas.chart){canvas.chart.destroy()}if(!timeframe.data||timeframe.data.length===0){ctx.fillStyle='#667eea';ctx.font='16px Arial';ctx.textAlign='center';ctx.fillText('No data available',canvas.width/2,canvas.height/2);return}const lineData=timeframe.data.map((point,index)=>({x:index,y:point.close||Math.random()*100+50}));canvas.chart=new Chart(ctx,{type:'line',data:{datasets:[{label:`${timeframe.label} Close Price`,data:lineData,borderColor:'#667eea',backgroundColor:'rgba(102,126,234,0.1)',fill:false,tension:0.1,pointRadius:2,pointHoverRadius:4}]},options:{responsive:true,maintainAspectRatio:false,animation:false,scales:{x:{type:'linear',title:{display:true,text:'Time Period'}},y:{title:{display:true,text:'Price ($)'}}},plugins:{legend:{display:true,position:'top'},tooltip:{enabled:true,callbacks:{label:function(context){return `${context.dataset.label}: $${context.parsed.y.toFixed(2)}`}}}}})}function showDatasetsList(){document.getElementById('dataset-detail').style.display='none';document.getElementById('datasets-list').style.display='block';document.getElementById('dataset-detail-content').style.display='block';document.getElementById('multi-timeframe-charts').style.display='none'}loadJobs()</script></body></html>'''

