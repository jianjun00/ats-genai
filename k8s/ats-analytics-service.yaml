                const highs = chartData.ohlc_data.map(d => d.high);
                const lows = chartData.ohlc_data.map(d => d.low);
                const closes = chartData.ohlc_data.map(d => d.close);
                const volumes = chartData.ohlc_data.map(d => d.volume);

                // Main OHLC candlestick trace
                const ohlcTrace = {{
                    x: timestamps,
                    open: opens,
                    high: highs,
                    low: lows,
                    close: closes,
                    type: 'candlestick',
