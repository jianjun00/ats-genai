            async function loadChartData() {{
                try {{
                    const response = await fetch(`/api/sequence/{sequence_id}/chart-data`);
                    chartData = await response.json();
                    
                    if (chartData.error) {{
                        document.getElementById('loadingMessage').innerHTML = 
                            `<div style="color: #ff4444;">Error: ${{chartData.error}}</div>`;
                        return;
                    }}
                    
                    // Update info panel
