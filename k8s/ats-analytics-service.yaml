---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-analytics-service
  namespace: ats-dev
  labels:
    app: ats-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats-analytics
  template:
    metadata:
      labels:
        app: ats-analytics
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - -c
        - |
          pip install fastapi uvicorn asyncpg numpy &&
          cd /app &&
          python app.py
        ports:
        - containerPort: 3000
        env:
        - name: PYTHONPATH
          value: "/app"
        volumeMounts:
        - name: app-code
          mountPath: /app
        - name: timeseries-data
          mountPath: /data
        - name: training-data
          mountPath: /data/training
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi" 
            cpu: "2000m"
      volumes:
      - name: app-code
        configMap:
          name: ats-analytics-config
      - name: timeseries-data
        persistentVolumeClaim:
          claimName: timeseries-storage-100tb-pvc
      - name: training-data
        persistentVolumeClaim:
          claimName: data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ats-analytics-service
  namespace: ats-dev
  labels:
    app: ats-analytics
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30001
    name: http
  selector:
    app: ats-analytics
