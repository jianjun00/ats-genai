    <body>
        <div class="header">
            <h1>🚀 ATS Analytics Service</h1>
            <p>STANDARDIZED Version - Consistent Naming & Port 3000</p>
        </div>
        
        <div class="standardized-notice">
            <strong>✅ STANDARDIZATION COMPLETE:</strong>
            <br>• Service Name: <code>ats-analytics-service</code> (CONSISTENT)
