apiVersion: v1
kind: ConfigMap
metadata:
  name: ats-analytics-config
  namespace: ats-dev
# Script extracted to /scripts/main.py
# Original ConfigMap data removed for cleanup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-analytics-service
  namespace: ats-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats-analytics-service
  template:
    metadata:
      labels:
        app: ats-analytics-service
    spec:
      containers:
      - name: analytics
        image: ats-genai:latest
        ports:
        - containerPort: 3000
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-credentials
              key: token
        command: ["/bin/bash"]
        args:
        - "-c"
        - |
          echo "📦 Installing git and dependencies..."
          apt-get update && apt-get install -y git
          pip install fastapi uvicorn asyncpg
          
          echo "📦 Cloning source code from Git with credentials..."
          git clone -b feature/k8s-yaml-simplification https://${GITHUB_TOKEN}:x-oauth-basic@github.com/AkoloTechnologies/ats-genai.git /app/src-repo
          cd /app/src-repo
          
          echo "🚀 Starting simple analytics service..."
          python /app/src-repo/scripts/k8s-extracted/simple_analytics.py
---
apiVersion: v1
kind: Service
metadata:
  name: ats-analytics-service
  namespace: ats-dev
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30001
  selector:
    app: ats-analytics-service