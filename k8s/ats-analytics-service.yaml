        <script>
            let currentTab = 'jobs';
            
            function showTab(tabName) {
                // Hide all tabs
                document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
                document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
                
                // Show selected tab
                document.getElementById(tabName + '-tab').classList.add('active');
                document.getElementById(tabName + '-tab-btn').classList.add('active');
                
                currentTab = tabName;
                
                // Load data for the selected tab
                if (tabName === 'jobs') {
                    loadJobs();
                } else if (tabName === 'datasets') {
                    loadDatasets();
                }
            }
            
            async function loadJobs() {
                try {
                    const statusFilter = document.getElementById('jobStatusFilter').value;
                    const sortBy = document.getElementById('jobSortBy').value;
                    const sortDir = document.getElementById('jobSortDir').value;
                    
                    let url = `/api/v1/jobs?limit=20&sort_by=${sortBy}&sort_dir=${sortDir}`;
                    if (statusFilter) {
                        url += `&status=${statusFilter}`;
                    }
                    
                    const [stats, jobs] = await Promise.all([
                        fetch('/api/v1/jobs/stats').then(r => r.json()),
                        fetch(url).then(r => r.json())
                    ]);
                    
                    // Update stats
                    if (stats.error) {
                        document.getElementById('job-stats').innerHTML = `<div style="color: red; text-align: center; padding: 20px;">Error loading stats: ${stats.message || stats.error}</div>`;
                    } else {
                        document.getElementById('job-stats').innerHTML = `
                            <div class="stat-card">
