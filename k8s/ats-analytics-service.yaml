                            <div>Storage Capacity</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">Enhanced</div>
                            <div>OHLC + Indicators</div>
                        </div>
                    `;
                    
                    // Update dataset list
                    const datasetsList = document.getElementById('datasets-list');
                    datasetsList.innerHTML = datasets.datasets.map(d => `
                        <div class="dataset">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <strong>${d.dataset_name}</strong>
                                    <div style="font-size: 0.9em; color: #666;">
                                        ${d.symbols.join(', ')} | ${d.total_sequences} sequences | ${d.feature_count} features + NEW indicators
