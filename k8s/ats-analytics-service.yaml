                    `).join('');
                    
                    if (datasets.datasets.length === 0) {
                        datasetsList.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">No datasets found.</div>';
                    }
                    
                } catch (error) {
                    document.getElementById('datasets-list').innerHTML = `<div style="color: red;">Error loading datasets: ${error.message}</div>`;
                }
            }
            
            // Load initial data
            loadJobs();
        </script>
    </body>
    </html>
