apiVersion: v1
kind: ConfigMap
metadata:
  name: ats-analytics-config
  namespace: ats-dev
# Script extracted to /scripts/main.py
# Original ConfigMap data removed for cleanup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-analytics-service
  namespace: ats-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats-analytics-service
  template:
    metadata:
      labels:
        app: ats-analytics-service
    spec:
      containers:
      - name: analytics
        image: python:3.9-slim
        ports:
        - containerPort: 3000
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        command: ["/bin/bash"]
        args:
        - "-c"
        - |
          python /scripts/ats_analytics_service_script_1.py
---
apiVersion: v1
kind: Service
metadata:
  name: ats-analytics-service
  namespace: ats-dev
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30001
  selector:
    app: ats-analytics-service