                                <div>Running</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${stats.completed_jobs || 0}</div>
                                <div>Completed</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${stats.failed_jobs || 0}</div>
                                <div>Failed</div>
                            </div>
                        `;
                    }
                    
                    // Update job list
                    const jobsList = document.getElementById('jobs-list');
                    
                    // Check if this is an error response
                    if (jobs.error) {
                        jobsList.innerHTML = `<div style="color: red; text-align: center; padding: 20px;">Error loading jobs: ${jobs.message || jobs.error}</div>`;
                        return;
                    }
                    
                    // Check if jobs array exists and handle normally
                    if (jobs.jobs && Array.isArray(jobs.jobs)) {
                        jobsList.innerHTML = jobs.jobs.map(j => `
                            <div class="job">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong>Job ${j.job_id}</strong> - ${j.job_type}
                                        <div style="font-size: 0.9em; color: #666;">
                                            Created: ${j.created_at ? new Date(j.created_at).toLocaleString() : 'N/A'}
                                            ${j.user_id ? ` by ${j.user_id}` : ''}
                                        </div>
                                        ${j.duration_seconds ? `<div style="font-size: 0.8em; color: #888;">Duration: ${j.duration_seconds}s</div>` : ''}
                                    </div>
                                    <span class="status ${j.status}">${j.status}</span>
                                </div>
                                ${j.error_message ? `<div style="color: #dc3545; font-size: 0.9em; margin-top: 10px;">${j.error_message}</div>` : ''}
                            </div>
                        `).join('');
                        
                        if (jobs.jobs.length === 0) {
                            jobsList.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">No jobs found matching the current filters.</div>';
                        }
                    } else {
                        // Fallback for unexpected response structure
                        jobsList.innerHTML = '<div style="color: orange; text-align: center; padding: 20px;">Unexpected response format from server</div>';
                    }
                    
                } catch (error) {
                    document.getElementById('jobs-list').innerHTML = `<div style="color: red;">Error loading jobs: ${error.message}</div>`;
