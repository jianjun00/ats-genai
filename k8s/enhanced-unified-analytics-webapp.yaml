                                        </td>
                                    </tr>
                                    <tr>
                                        <td><strong>Enhanced Training Dataset TSLA 002</strong></td>
                                        <td>TSLA</td>
                                        <td>1,200</td>
                                        <td>12</td>
                                        <td>97.8%</td>
                                        <td>
                                            <button class="btn" onclick="viewDataset('demo-2')">Visualize</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <div id="jobs" class="tab-content">
                            <h3>Job Management</h3>
                            <p>Job management features available here...</p>
                        </div>
                        
                        <div id="comparison" class="tab-content">
                            <h3>Dataset Comparison</h3>
                            <p>Dataset comparison tools available here...</p>
                        </div>
                    </div>
                </div>

                <script>
                    function showTab(tabName) {
                        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
                        document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
                        
                        document.getElementById(tabName).classList.add('active');
                        event.target.classList.add('active');
                    }
                    
                    function viewDataset(datasetId) {
                        // Open enhanced visualization in new tab/window
                        window.open(`/api/v1/training-data/${datasetId}/visualization`, '_blank');
                    }
                </script>
            </body>
            </html>
            '''

        return app

    if __name__ == "__main__":
        import uvicorn
        
        logging.basicConfig(level=logging.INFO)
        logging.info("🚀 Starting Enhanced ATS Unified Analytics Platform")
        logging.info("📊 Features: Enhanced Dataset Visualization, Job Management, Comparison Engine")
        logging.info("🌐 Dashboard: http://0.0.0.0:5000/")
        
        app = create_unified_analytics_app()
        uvicorn.run(app, host="0.0.0.0", port=5000)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-unified-analytics-webapp
  namespace: ats-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhanced-unified-analytics-webapp
  template:
    metadata:
      labels:
        app: enhanced-unified-analytics-webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        ports:
        - containerPort: 5000
        env:
        - name: PYTHONPATH
          value: /app
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_HOST
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PORT
        command: ["bash", "-c"]
        args:
        - |
          set -e
          echo "📦 Installing dependencies..."
          pip install fastapi uvicorn asyncpg numpy pandas scipy pydantic
          echo "🚀 Starting Enhanced Unified Analytics Platform..."
          cd /app && python unified_analytics_platform.py
        volumeMounts:
        - name: webapp-code
          mountPath: /app
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: webapp-code
        configMap:
          name: enhanced-unified-analytics-webapp-config
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: enhanced-unified-analytics-webapp-service
  namespace: ats-dev
spec:
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30000
  selector:
    app: enhanced-unified-analytics-webapp