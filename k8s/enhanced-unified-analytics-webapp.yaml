    # ===== Database Engine for Real Data Integration =====
    class AnalyticsEngine:
        """Analytics engine with real database integration"""
        
        def __init__(self, env: Environment):
            self.env = env
            self.db_pool = None
            
        async def initialize(self):
            """Initialize database connection pool"""
            self.db_pool = await asyncpg.create_pool(
                self.env.get_database_url(),
                min_size=1,
                max_size=10,
                command_timeout=60
            )
            
        async def close(self):
            """Close database connections"""
            if self.db_pool:
                await self.db_pool.close()
                
        async def get_job_runs(self, status_filter: Optional[str] = None, 
                             job_type_filter: Optional[str] = None,
                             limit: int = 100, offset: int = 0) -> Dict[str, Any]:
            """Get job runs with filtering and pagination"""
            
            # Build WHERE clause based on filters
            where_conditions = []
            params = []
            param_count = 0
            
            if status_filter and status_filter != 'all':
                param_count += 1
                where_conditions.append(f"status = ${param_count}")
                params.append(status_filter)
                
            if job_type_filter and job_type_filter != 'all':
                param_count += 1
                where_conditions.append(f"job_type = ${param_count}")
                params.append(job_type_filter)
            
            where_clause = "WHERE " + " AND ".join(where_conditions) if where_conditions else ""
            
            # Add pagination parameters
            param_count += 1
            limit_param = f"${param_count}"
            params.append(limit)
            
            param_count += 1
            offset_param = f"${param_count}"
            params.append(offset)
            
            query = f"""
                SELECT job_id, job_name, job_type, user_id, flyte_execution_id, 
                       status, parameters, start_time, end_time, duration_seconds,
                       error_message, created_at
                FROM dev_job_runs 
                {where_clause}
                ORDER BY created_at DESC 
                LIMIT {limit_param} OFFSET {offset_param}
            """
            
            count_query = f"""
                SELECT COUNT(*) as total 
                FROM dev_job_runs 
                {where_clause}
            """
            
            async with self.db_pool.acquire() as conn:
                try:
                    # Get jobs and total count
                    jobs = await conn.fetch(query, *params)
                    total_result = await conn.fetchrow(count_query, *params[:-2])  # Exclude limit/offset
                    total = total_result['total'] if total_result else 0
                    
                    # Convert to dict format
                    job_list = []
                    for job in jobs:
                        job_dict = dict(job)
                        # Convert datetime to string for JSON serialization
                        for key, value in job_dict.items():
                            if isinstance(value, datetime):
                                job_dict[key] = value.isoformat()
                        job_list.append(job_dict)
                    
                    return {
                        "jobs": job_list,
                        "total": total,
                        "limit": limit,
                        "offset": offset,
                        "has_more": offset + limit < total
                    }
                    
                except Exception as e:
                    # Return empty result if table doesn't exist or other errors
                    return {
                        "jobs": [],
                        "total": 0,
                        "limit": limit,
                        "offset": offset,
                        "has_more": False,
                        "error": f"Database error: {str(e)}"
                    }
                    
        async def get_job_details(self, job_id: str) -> Optional[Dict[str, Any]]:
            """Get detailed information about a specific job"""
            
            query = """
                SELECT job_id, job_name, job_type, user_id, flyte_execution_id, 
                       status, parameters, start_time, end_time, duration_seconds,
                       error_message, resource_usage, created_at, updated_at
                FROM dev_job_runs 
                WHERE job_id = $1
            """
            
            async with self.db_pool.acquire() as conn:
                try:
                    job = await conn.fetchrow(query, job_id)
                    if not job:
                        return None
                        
                    job_dict = dict(job)
                    # Convert datetime to string for JSON serialization
                    for key, value in job_dict.items():
                        if isinstance(value, datetime):
                            job_dict[key] = value.isoformat()
                    
                    return job_dict
                    
                except Exception as e:
                    return None
                    
        async def get_training_datasets(self, limit: int = 50) -> Dict[str, Any]:
            """Get training datasets from database"""
            
            query = """
                SELECT dataset_name, symbols, total_sequences, feature_count, 
                       technical_indicators, creation_timestamp, file_size_mb
                FROM dev_training_dataset 
                ORDER BY creation_timestamp DESC 
                LIMIT $1
            """
            
            async with self.db_pool.acquire() as conn:
                try:
                    datasets = await conn.fetch(query, limit)
                    
                    dataset_list = []
                    for dataset in datasets:
                        dataset_dict = dict(dataset)
                        # Convert datetime to string for JSON serialization
                        for key, value in dataset_dict.items():
                            if isinstance(value, datetime):
                                dataset_dict[key] = value.isoformat()
                        
                        # Generate dataset ID from name for consistency
                        dataset_dict['dataset_id'] = dataset_dict['dataset_name'].lower().replace(' ', '-')
                        
                        dataset_list.append(dataset_dict)
                    
                    return {
                        "datasets": dataset_list,
                        "total": len(dataset_list)
                    }
                    
                except Exception as e:
                    # Return demo data if database not available
                    return {
                        "datasets": [
                            {
                                "dataset_id": "demo-1",
                                "dataset_name": "Enhanced Training Dataset AAPL 001",
                                "symbols": ["AAPL"],
                                "total_sequences": 1500,
                                "feature_count": 12,
                                "technical_indicators": ["etop", "ebot", "sma_20", "rsi"],
                                "creation_timestamp": "2024-08-21T10:00:00",
                                "file_size_mb": 25.4,
                                "quality_metrics": {"completeness": 98.5}
                            }
                        ],
                        "total": 1,
                        "error": f"Database error: {str(e)}"
                    }

    def create_unified_analytics_app() -> FastAPI:
        """Create enhanced unified analytics web application."""
        
        app = FastAPI(
            title="Enhanced ATS Unified Analytics Platform",
            description="Comprehensive ML workflow analytics with advanced dataset visualization and job management",
            version="3.0.0",
            docs_url="/api/docs",
            redoc_url="/api/redoc"
        )
        
        app.add_middleware(
            CORSMiddleware,
            allow_origins=["*"],
            allow_credentials=True,
            allow_methods=["*"],
            allow_headers=["*"],
        )
        
        # Initialize analytics engine
        env = Environment()
        analytics_engine = AnalyticsEngine(env)
        
        @app.on_event("startup")
        async def startup():
            await analytics_engine.initialize()
            
        @app.on_event("shutdown")
        async def shutdown():
            await analytics_engine.close()
            
        # ===== Job Management API Endpoints =====
        
        @app.get("/api/v1/jobs")
        async def get_jobs(
            status: Optional[str] = Query(None, description="Filter by job status"),
            job_type: Optional[str] = Query(None, description="Filter by job type"), 
            limit: int = Query(100, ge=1, le=1000, description="Number of jobs to return"),
            offset: int = Query(0, ge=0, description="Offset for pagination")
        ):
            """Get job runs with filtering and pagination"""
            return await analytics_engine.get_job_runs(status, job_type, limit, offset)
            
        @app.get("/api/v1/jobs/stats")
        async def get_job_stats():
            """Get job statistics for dashboard"""
            # Get basic stats
            all_jobs = await analytics_engine.get_job_runs(limit=1000)
            jobs = all_jobs.get("jobs", [])
            
            stats = {
                "total_jobs": len(jobs),
                "by_status": {},
                "by_type": {},
                "recent_failures": 0
            }
            
            for job in jobs:
                # Count by status
                status = job.get("status", "unknown")
                stats["by_status"][status] = stats["by_status"].get(status, 0) + 1
                
                # Count by type
                job_type = job.get("job_type", "unknown")
                stats["by_type"][job_type] = stats["by_type"].get(job_type, 0) + 1
                
                # Count recent failures (last 24 hours)
                if status == "failed":
                    created_at = job.get("created_at")
                    if created_at:
                        try:
                            created_time = datetime.fromisoformat(created_at.replace('Z', '+00:00'))
                            if (datetime.now() - created_time).days < 1:
                                stats["recent_failures"] += 1
                        except:
                            pass
            
            return stats
            
        @app.get("/api/v1/jobs/{job_id}")
        async def get_job_details(job_id: str):
            """Get detailed information about a specific job"""
            job = await analytics_engine.get_job_details(job_id)
            if not job:
                raise HTTPException(status_code=404, detail="Job not found")
            return job
        
