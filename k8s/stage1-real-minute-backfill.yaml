    import asyncio
    import json
    import aiohttp
    import os
    import logging
    from datetime import datetime
    from enum import Enum

    class AlertLevel(Enum):
        INFO = "info"
        SUCCESS = "success"
        WARNING = "warning"
        ERROR = "error"
        CRITICAL = "critical"

    class SlackAlerter:
        def __init__(self, webhook_url=None):
            self.webhook_url = webhook_url or os.getenv('SLACK_WEBHOOK_URL')
            self.logger = logging.getLogger(__name__)
            
            if not self.webhook_url:
                self.logger.warning("No Slack webhook URL provided - alerts will be logged only")
        
        def _get_color_for_level(self, level: AlertLevel):
            colors = {
                AlertLevel.INFO: "#36a64f",
                AlertLevel.SUCCESS: "#2eb886",
                AlertLevel.WARNING: "#ff9500",
                AlertLevel.ERROR: "#ff4444",
                AlertLevel.CRITICAL: "#8b0000"
            }
            return colors.get(level, "#36a64f")
        
        def _get_emoji_for_level(self, level: AlertLevel):
            emojis = {
                AlertLevel.INFO: "ℹ️",
                AlertLevel.SUCCESS: "✅",
                AlertLevel.WARNING: "⚠️",
                AlertLevel.ERROR: "❌",
                AlertLevel.CRITICAL: "🚨"
            }
            return emojis.get(level, "ℹ️")
        
        async def send_alert(self, title, message, level=AlertLevel.INFO, fields=None):
            if not self.webhook_url:
                self.logger.info(f"[{level.value.upper()}] {title}: {message}")
                return
            
            emoji = self._get_emoji_for_level(level)
            color = self._get_color_for_level(level)
            
            payload = {
                "username": "Real Minute Backfill Monitor",
                "icon_emoji": ":chart_with_upwards_trend:",
                "attachments": [
                    {
                        "color": color,
                        "title": f"{emoji} {title}",
                        "text": message,
                        "ts": int(datetime.now().timestamp()),
                        "footer": "ATS Real Minute Data Backfill"
                    }
                ]
            }
            
            if fields:
                payload["attachments"][0]["fields"] = [
                    {"title": k, "value": v, "short": True} for k, v in fields.items()
                ]
            
            try:
                async with aiohttp.ClientSession() as session:
                    async with session.post(self.webhook_url, json=payload) as response:
                        if response.status == 200:
                            self.logger.info(f"Slack alert sent: {title}")
                        else:
                            self.logger.error(f"Failed to send Slack alert: {response.status}")
            except Exception as e:
                self.logger.error(f"Error sending Slack alert: {e}")
        
        async def alert_job_started(self, job_name, stage, instruments_count, date_range):
            await self.send_alert(
                title=f"Real Minute Backfill Started - {stage}",
                message=f"Job `{job_name}` has started processing REAL minute data backfill from Polygon API",
                level=AlertLevel.INFO,
                fields={
                    "Stage": stage,
                    "Instruments": f"{instruments_count:,}",
                    "Date Range": date_range,
                    "Data Source": "Polygon API",
                    "Status": "Running"
                }
            )
        
        async def alert_job_completed(self, job_name, stage, duration, records_inserted):
            await self.send_alert(
                title=f"Real Minute Backfill Completed - {stage}",
                message=f"Job `{job_name}` completed successfully! 🎉 Real minute data inserted into database",
                level=AlertLevel.SUCCESS,
                fields={
                    "Stage": stage,
                    "Duration": duration,
                    "Real Records Inserted": f"{records_inserted:,}",
                    "Status": "Success"
                }
            )
        
        async def alert_resource_pressure(self, memory_percent, cpu_percent, action_taken):
            level = AlertLevel.CRITICAL if action_taken == "Emergency stop" else AlertLevel.WARNING
            
            await self.send_alert(
                title="Resource Pressure Detected",
                message=f"System resources are under pressure during real minute data backfill",
                level=level,
                fields={
                    "Memory Usage": f"{memory_percent:.1f}%",
                    "CPU Usage": f"{cpu_percent:.1f}%",
                    "Action Taken": action_taken
                }
            )
        
        async def alert_batch_progress(self, batch_num, total_batches, stage, records_inserted):
            if batch_num % 5 == 0 or batch_num == total_batches:
                progress_percent = (batch_num / total_batches) * 100
                
                await self.send_alert(
                    title=f"Real Data Batch Progress - {stage}",
                    message=f"Processing batch {batch_num}/{total_batches} ({progress_percent:.1f}% complete)",
                    level=AlertLevel.INFO,
                    fields={
                        "Batch": f"{batch_num}/{total_batches}",
                        "Progress": f"{progress_percent:.1f}%",
                        "Real Records": f"{records_inserted:,}"
                    }
                )

        async def alert_api_error(self, symbol, error_message, retry_count):
            await self.send_alert(
                title="API Error During Backfill",
                message=f"Error fetching minute data for {symbol}",
                level=AlertLevel.WARNING,
                fields={
                    "Symbol": symbol,
                    "Error": error_message,
                    "Retry Count": str(retry_count),
                    "Action": "Continuing with next symbol"
                }
            )

  real_backfill_script.py: |
    #!/usr/bin/env python3
    import time
    import psutil
    import asyncio
    import asyncpg
    import aiohttp
    import os
    from datetime import datetime, date, timedelta
    from slack_alerter import SlackAlerter, AlertLevel

    class Stage1RealMinuteBackfill:
        def __init__(self):
            self.memory_threshold = 60
            self.cpu_threshold = 50
            self.alerter = SlackAlerter()
            self.start_time = datetime.now()
            self.polygon_api_key = os.getenv('POLYGON_API_KEY')
            
        def check_resources(self):
            memory = psutil.virtual_memory()
            cpu_percent = psutil.cpu_percent(interval=1)
            
            print(f"Resources - Memory: {memory.percent:.1f}%, CPU: {cpu_percent:.1f}%")
            
            if memory.percent > self.memory_threshold:
                print(f"⚠️  Memory pressure: {memory.percent:.1f}% > {self.memory_threshold}%")
                return False, memory.percent, cpu_percent
                
            if cpu_percent > self.cpu_threshold:
                print(f"⚠️  CPU pressure: {cpu_percent:.1f}% > {self.cpu_threshold}%")
                return False, memory.percent, cpu_percent
            
            return True, memory.percent, cpu_percent
        
        async def get_database_connection(self):
            db_host = "postgres-simple.ats-dev.svc.cluster.local"
            db_port = "5432"
            db_name = "dev_db"
            db_user = "postgres"
            db_password = "dev_password"
            
            connection_string = f"postgresql://{db_user}:{db_password}@{db_host}:{db_port}/{db_name}"
            
            try:
                conn = await asyncpg.connect(connection_string)
                print("✅ Database connection successful")
                return conn
            except Exception as e:
                print(f"❌ Database connection failed: {e}")
                raise
        
        async def get_instruments_for_backfill(self, conn, limit=100):
            instruments = await conn.fetch("""
                SELECT DISTINCT i.id, i.symbol 
                FROM dev_instruments i
                JOIN dev_daily_prices_polygon p ON i.id = p.instrument_id
                WHERE p.date >= '2025-08-01'
                AND i.symbol ~ '^[A-Z]{1,5}$'
                ORDER BY i.symbol
                LIMIT $1
            """, limit)
            
            print(f"Selected {len(instruments)} instruments for real minute data backfill")
            return instruments
        
        async def fetch_polygon_minute_data(self, symbol, start_date, end_date):
            if not self.polygon_api_key:
                print(f"❌ No Polygon API key found for {symbol}")
                return []
            
            url = f"https://api.polygon.io/v2/aggs/ticker/{symbol}/range/1/minute/{start_date}/{end_date}"
            params = {
                'adjusted': 'true',
                'sort': 'asc',
                'limit': 50000,
                'apikey': self.polygon_api_key
            }
            
            try:
                async with aiohttp.ClientSession() as session:
                    async with session.get(url, params=params) as response:
                        if response.status == 200:
                            data = await response.json()
                            if data.get('status') == 'OK' and 'results' in data:
                                results = data['results']
                                print(f"✅ Fetched {len(results)} minute bars for {symbol}")
                                return results
                            else:
                                print(f"⚠️  No data for {symbol}: {data.get('status', 'Unknown')}")
                                return []
                        else:
                            print(f"❌ API error for {symbol}: {response.status}")
                            return []
            except Exception as e:
                print(f"❌ Error fetching {symbol}: {e}")
                await self.alerter.alert_api_error(symbol, str(e), 1)
                return []
        
        async def insert_minute_data(self, conn, instrument_id, symbol, minute_data):
            if not minute_data:
                return 0
            
            records_to_insert = []
            for bar in minute_data:
                # Convert timestamp to datetime
                dt = datetime.fromtimestamp(bar['t'] / 1000)
                
                record = (
                    instrument_id,
                    dt,
                    float(bar['o']),  # open
                    float(bar['h']),  # high
                    float(bar['l']),  # low
                    float(bar['c']),  # close
                    int(bar['v']),    # volume
                    float(bar.get('vw', bar['c'])),  # vwap (use close if not available)
                    int(bar.get('n', 0))  # transactions
                )
                records_to_insert.append(record)
            
            # Insert into Polygon table (note: column is 'timestamp', not 'datetime')
            insert_query = """
                INSERT INTO dev_minute_prices_polygon 
                (instrument_id, timestamp, open_price, high_price, low_price, close_price, volume, vwap, transactions)
                VALUES ($1, $2, $3, $4, $5, $6, $7, $8, $9)
                ON CONFLICT (instrument_id, timestamp) DO NOTHING
            """
            
            try:
                result = await conn.executemany(insert_query, records_to_insert)
                inserted_count = len(records_to_insert)
                print(f"✅ Inserted {inserted_count} minute records for {symbol}")
                return inserted_count
            except Exception as e:
                print(f"❌ Error inserting data for {symbol}: {e}")
                return 0
        
        async def run_stage1_real_backfill(self):
            job_name = "stage1-real-minute-backfill"
            stage = "Stage 1 Real Conservative"
            
            print("=== STAGE 1: REAL MINUTE DATA BACKFILL ===")
            print("🔥 Fetching REAL minute data from Polygon API!")
            
            # Send job start alert
            await self.alerter.alert_job_started(
                job_name=job_name,
                stage=stage,
                instruments_count=100,
                date_range="2019-12-30 to 2019-12-31"
            )
            
            # Initial resource check
            resources_ok, memory_pct, cpu_pct = self.check_resources()
            if not resources_ok:
                await self.alerter.alert_resource_pressure(memory_pct, cpu_pct, "Job aborted")
                return False
            
            try:
                conn = await self.get_database_connection()
                instruments = await self.get_instruments_for_backfill(conn, limit=100)
                
                if not instruments:
                    await self.alerter.send_alert(
                        title="No Instruments Found",
                        message="No instruments available for real minute data backfill",
                        level=AlertLevel.ERROR
                    )
                    return False
                
                # Ultra-conservative: just 2 days of recent data
                end_date = date(2019, 12, 31)
                start_date = date(2019, 12, 30)
                
                print(f"\nReal data period: {start_date} to {end_date}")
                
                batch_size = 25  # Even smaller batches for real API calls
                total_batches = (len(instruments) + batch_size - 1) // batch_size
                total_records_inserted = 0
                
                for i in range(0, len(instruments), batch_size):
                    batch_num = i // batch_size + 1
                    batch = instruments[i:i + batch_size]
                    
                    print(f"\n=== Real Data Batch {batch_num}/{total_batches} ===")
                    
                    resources_ok, memory_pct, cpu_pct = self.check_resources()
                    if not resources_ok:
                        await self.alerter.alert_resource_pressure(
                            memory_pct, cpu_pct, "Backfill paused"
                        )
                        print("❌ Resource pressure - stopping backfill")
                        break
                    
                    batch_records = 0
                    for instrument in batch:
                        instrument_id, symbol = instrument
                        print(f"Fetching real minute data for {symbol}...")
                        
                        minute_data = await self.fetch_polygon_minute_data(
                            symbol, start_date, end_date
                        )
                        
                        if minute_data:
                            inserted = await self.insert_minute_data(
                                conn, instrument_id, symbol, minute_data
                            )
                            batch_records += inserted
                        
                        # Brief pause between API calls
                        await asyncio.sleep(0.5)
                    
                    total_records_inserted += batch_records
                    
                    print(f"✅ Batch {batch_num} completed - {batch_records} real records inserted")
                    
                    # Send progress alert
                    await self.alerter.alert_batch_progress(
                        batch_num=batch_num,
                        total_batches=total_batches,
                        stage=stage,
                        records_inserted=batch_records
                    )
                    
                    print("⏸️  API cooling down 10s...")
                    await asyncio.sleep(10)
                
                await conn.close()
                
                duration = str(datetime.now() - self.start_time).split('.')[0]
                
                # Send completion alert
                await self.alerter.alert_job_completed(
                    job_name=job_name,
                    stage=stage,
                    duration=duration,
                    records_inserted=total_records_inserted
                )
                
                print("\n=== STAGE 1 REAL DATA COMPLETED ===")
                print(f"✅ Real minute data backfill successful - {total_records_inserted} records inserted!")
                
                return True
                
            except Exception as e:
                error_msg = str(e)
                print(f"❌ Stage 1 real backfill failed: {error_msg}")
                
                await self.alerter.send_alert(
                    title="Real Backfill Job Failed",
                    message=f"Job failed with error: {error_msg}",
                    level=AlertLevel.ERROR
                )
                
                return False
    
    async def main():
        print("Installing required packages...")
        import subprocess
        subprocess.run(["pip", "install", "aiohttp"], check=True)
        
        backfiller = Stage1RealMinuteBackfill()
        success = await backfiller.run_stage1_real_backfill()
        
        if success:
            print("\n🎉 STAGE 1 REAL MINUTE DATA BACKFILL SUCCESS!")
        else:
            print("\n❌ STAGE 1 REAL BACKFILL FAILED")
    
    if __name__ == "__main__":
        asyncio.run(main())

