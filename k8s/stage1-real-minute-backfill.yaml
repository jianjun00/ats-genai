apiVersion: batch/v1
kind: Job
metadata:
  name: stage1-real-minute-backfill-job
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: stage1-real-container
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            
            echo "=== STAGE 1 REAL MINUTE DATA BACKFILL ==="
            echo "🔥 Fetching REAL minute data from Polygon API!"
            
            pip install psutil asyncpg aiohttp
            
            cp /scripts/slack_alerter.py .
            cp /scripts/real_backfill_script.py .
            
            python3 real_backfill_script.py
        env:
        - name: SLACK_WEBHOOK_URL
          value: "https://hooks.slack.com/services/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"
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: POLYGON_API_KEY
        - name: DB_HOST
          value: "postgres-simple.ats-dev.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: stage1-real-minute-backfill-script
          defaultMode: 0755