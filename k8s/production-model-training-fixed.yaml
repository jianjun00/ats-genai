apiVersion: batch/v1
kind: Job
metadata:
  name: production-model-training-fixed
  namespace: ats-dev
  labels:
    app: ml-training
    job-type: production-model
    dataset: all-instruments-2020-2023
spec:
  # Allow job to run for up to 12 hours
  activeDeadlineSeconds: 43200
  # Retry twice if failed
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ml-training
        job-type: production-model
    spec:
      restartPolicy: Never
      containers:
      - name: model-trainer
        image: python:3.12-slim
        resources:
          requests:
            memory: "12Gi"
            cpu: "6"
          limits:
            memory: "20Gi"
            cpu: "8"
        env:
        - name: PYTHONPATH
          value: "src"
        - name: ENVIRONMENT
          value: "dev"
        # Use service name for database connection
        - name: DB_HOST
          value: "postgres-simple"  # Use the correct service name
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        # Ray configuration for distributed processing
        - name: RAY_DISABLE_DASHBOARD
          value: "1"
        - name: RAY_USAGE_STATS_ENABLED
          value: "0"
        - name: RAY_ADDRESS
          value: ""
        # Memory optimizations
        - name: PYTHONHASHSEED
          value: "0"
        - name: OMP_NUM_THREADS
          value: "6"
        - name: NUMBA_NUM_THREADS
          value: "6"
        workingDir: /app
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/production_model_training_fixed_1.py"---
apiVersion: v1
kind: ConfigMap
metadata:
  name: production-training-code
  namespace: ats-dev
