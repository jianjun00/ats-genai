apiVersion: batch/v1
kind: Job
metadata:
  name: enhanced-multimodal-news-collection
  namespace: ats-dev
  labels:
    app: ats-genai
    component: multimodal-news-collector
    project: news-multimodal-prediction
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: news-collector
        image: dragonflyer762/ats-genai:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Starting Enhanced Multi-Modal News Collection..."
          
          # Install additional dependencies if needed
          pip install --no-cache-dir aiohttp asyncpg pandas transformers nltk textblob scikit-learn feedparser beautifulsoup4
          
          cd /app
          
          # Run database migration first
          echo "🔄 Running database migration for multimodal news tables..."
          PYTHONPATH=/app/src python -c "
          import asyncio
          import asyncpg
          import os
          
          async def run_migration():
              conn = await asyncpg.connect(
                  host=os.getenv('DB_HOST', 'postgres'),
                  port=int(os.getenv('DB_PORT', '5432')),
                  user=os.getenv('DB_USER', 'postgres'),
                  password=os.getenv('DB_PASSWORD', 'dev_password'),
                  database=os.getenv('DB_NAME', 'dev_db')
              )
              
              # Read and execute migration
              with open('/app/src/db/migrations/040_create_multimodal_news_tables.sql', 'r') as f:
                  migration_sql = f.read()
              
              try:
                  await conn.execute(migration_sql)
                  print('✅ Migration completed successfully')
              except Exception as e:
                  print(f'⚠️ Migration error (might already exist): {e}')
              finally:
                  await conn.close()
          
          asyncio.run(run_migration())
          "
          
          # Run enhanced news collection
          echo "📰 Starting enhanced news collection..."
          PYTHONPATH=/app/src python /app/src/market_data/news/enhanced_multimodal_news_collector.py \
            --mode realtime \
            --hours_back 168 \
            --limit 10000 \
            --symbols AAPL MSFT GOOGL AMZN TSLA META NVDA BRK.B JPM JNJ V PG HD MA UNH \
                     DIS BAC ADBE CRM NFLX XOM CVX PFE KO PEP ABBV MRK WMT COST \
                     TMO ACN MDT DHR NEE VZ T CMCSA NKE HON \
                     SPY QQQ IWM GLD USO TLT VTI VXUS BND
          
          echo "🎉 Enhanced multimodal news collection completed!"
        env:
        # API Keys for news sources
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: POLYGON_API_KEY
        - name: TIINGO_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: TIINGO_API_KEY
        - name: ALPHA_VANTAGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: ALPHA_VANTAGE_API_KEY
              optional: true
        - name: FMP_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: FMP_API_KEY
              optional: true
        - name: BENZINGA_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: BENZINGA_API_KEY
              optional: true
        
        # Database connection
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        
        # Python path
        - name: PYTHONPATH
          value: "/app/src"
        
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: realtime-multimodal-news-collection
  namespace: ats-dev
  labels:
    app: ats-genai
    component: multimodal-news-realtime
    project: news-multimodal-prediction
spec:
  schedule: "*/30 * * * *"  # Every 30 minutes
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: realtime-news-collector
            image: dragonflyer762/ats-genai:latest
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -e
              echo "🔄 Realtime multimodal news collection - $(date)"
              
              cd /app
              
              # Run realtime collection (last 1 hour)
              PYTHONPATH=/app/src python /app/src/market_data/news/enhanced_multimodal_news_collector.py \
                --mode realtime \
                --hours_back 1 \
                --limit 1000
              
              echo "✅ Realtime collection completed - $(date)"
            env:
            # API Keys
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-credentials-dev
                  key: POLYGON_API_KEY
            - name: TIINGO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-credentials-dev
                  key: TIINGO_API_KEY
            - name: ALPHA_VANTAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-credentials-dev
                  key: ALPHA_VANTAGE_API_KEY
                  optional: true
            - name: FMP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-credentials-dev
                  key: FMP_API_KEY
                  optional: true
            
            # Database connection
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "dev_password"
            - name: DB_NAME
              value: "dev_db"
            - name: PYTHONPATH
              value: "/app/src"
            
            resources:
              requests:
                memory: "1Gi"
                cpu: "250m"
              limits:
                memory: "2Gi"
                cpu: "1000m"

---
apiVersion: v1
kind: Secret
metadata:
  name: multimodal-news-api-keys
  namespace: ats-dev
type: Opaque
stringData:
  # Add your API keys here (example format)
  ALPHA_VANTAGE_API_KEY: "demo"  # Replace with real key
  FMP_API_KEY: "demo"            # Replace with real key  
  BENZINGA_API_KEY: "demo"       # Replace with real key
  FRED_API_KEY: "demo"           # Replace with real key for economic data

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multimodal-news-config
  namespace: ats-dev
data:
  collection_config.yaml: |
    # Enhanced multimodal news collection configuration
    
    news_sources:
      polygon:
        enabled: true
        priority: 1
        rate_limit_per_minute: 500
        max_concurrent: 50
        cost_per_request: 0.002
        
      tiingo:
        enabled: true
        priority: 2
        rate_limit_per_minute: 1000
        max_concurrent: 30
        cost_per_request: 0.001
        
      alpha_vantage:
        enabled: true
        priority: 3
        rate_limit_per_minute: 500
        max_concurrent: 25
        cost_per_request: 0.003
        
      fmp:
        enabled: true
        priority: 4
        rate_limit_per_minute: 300
        max_concurrent: 20
        cost_per_request: 0.004
    
    economic_events:
      enable_detection: true
      confidence_threshold: 0.3
      severity_threshold: 3
      
      categories:
        - earnings
        - fed
        - employment
        - inflation
        - growth
        - corporate
        - macro
    
    symbols:
      # Top market cap stocks
      large_cap:
        - AAPL
        - MSFT
        - GOOGL
        - AMZN
        - TSLA
        - META
        - NVDA
        - BRK.B
        - JPM
        - JNJ
        - V
        - PG
        - HD
        - MA
        - UNH
      
      # Key ETFs for market factors
      etfs:
        - SPY   # S&P 500
        - QQQ   # Nasdaq 100
        - IWM   # Russell 2000
        - GLD   # Gold
        - USO   # Oil
        - TLT   # 20+ Year Treasury
        - VTI   # Total Stock Market
        - VXUS  # Total International Stock
        - BND   # Total Bond Market
    
    processing:
      batch_size: 1000
      max_articles_per_run: 10000
      deduplication_threshold: 0.8
      sentiment_analysis: true
      
    storage:
      retention_days: 2555  # ~7 years
      cleanup_old_articles: false  # Keep all for training
      index_optimization: true

---
# Service to monitor news collection health
apiVersion: v1
kind: Service
metadata:
  name: multimodal-news-monitoring
  namespace: ats-dev
spec:
  selector:
    app: multimodal-news-monitor
  ports:
  - port: 8080
    targetPort: 8080
    name: metrics
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multimodal-news-monitor
  namespace: ats-dev
  labels:
    app: multimodal-news-monitor
    component: monitoring
    project: news-multimodal-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multimodal-news-monitor
  template:
    metadata:
      labels:
        app: multimodal-news-monitor
    spec:
      containers:
      - name: monitor
        image: dragonflyer762/ats-genai:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          cd /app
          # Simple monitoring service
          python -c "
          import asyncio
          import aiohttp
          from aiohttp import web
          import asyncpg
          import json
          import os
          
          async def health_check(request):
              return web.json_response({'status': 'healthy', 'service': 'multimodal-news-monitor'})
          
          async def news_stats(request):
              try:
                  conn = await asyncpg.connect(
                      host=os.getenv('DB_HOST', 'postgres'),
                      port=int(os.getenv('DB_PORT', '5432')),
                      user=os.getenv('DB_USER', 'postgres'),
                      password=os.getenv('DB_PASSWORD', 'dev_password'),
                      database=os.getenv('DB_NAME', 'dev_db')
                  )
                  
                  stats = {}
                  
                  # Count articles by source
                  for table in ['news_polygon', 'news_tiingo', 'news_alpha_vantage', 'news_fmp']:
                      try:
                          count = await conn.fetchval(f'SELECT COUNT(*) FROM dev_{table}')
                          stats[table] = count
                      except:
                          stats[table] = 0
                  
                  # Count economic events
                  try:
                      events_count = await conn.fetchval('SELECT COUNT(*) FROM dev_economic_events')
                      stats['economic_events'] = events_count
                  except:
                      stats['economic_events'] = 0
                  
                  await conn.close()
                  return web.json_response(stats)
              except Exception as e:
                  return web.json_response({'error': str(e)}, status=500)
          
          app = web.Application()
          app.router.add_get('/health', health_check)
          app.router.add_get('/news-stats', news_stats)
          
          print('🔍 Starting multimodal news monitoring service on port 8080...')
          web.run_app(app, host='0.0.0.0', port=8080)
          "
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"