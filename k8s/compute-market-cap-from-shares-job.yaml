apiVersion: batch/v1
kind: Job
metadata:
  name: compute-market-cap-from-shares
  namespace: ats-dev
  labels:
    app: ats-genai
    component: market-cap-computation
    version: v1.0
spec:
  ttlSecondsAfterFinished: 3600  # Clean up after 1 hour
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ats-genai
        component: market-cap-computation
    spec:
      restartPolicy: Never
      containers:
      - name: compute-market-cap
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Installing dependencies..."
          pip install --no-cache-dir asyncpg aiohttp
          
          echo "Starting market cap computation from shares outstanding..."
          python /scripts/compute_market_cap_from_shares.py \
            --environment dev \
            --symbols "AAPL,MSFT,GOOGL,GOOG,AMZN,TSLA,META,NVDA,AVGO,JPM,UNH,JNJ,V,PG,MA,HD,CVX,LLY,ABBV,PFE,KO,PEP,COST,WMT,DIS,ADBE,NFLX,CRM,INTC,CSCO,VZ,T,XOM,AMD,QCOM,TXN,HON,UPS,IBM,GE,CAT,BA,MMM,WFC,GS,MS,C,BAC,ORCL,CL" \
            --days_back 30 \
            --batch_size 50 \
            --debug \
            --db_host postgres \
            --db_port 5432 \
            --db_user postgres \
            --db_password dev_password \
            --db_name dev_db
        env:
        - name: PYTHONPATH
          value: "/scripts"
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: ats-api-keys
              key: polygon-api-key
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi" 
            cpu: "500m"
      volumes:
      - name: script-volume
        configMap:
          name: market-cap-computation-scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-cap-computation-scripts
  namespace: ats-dev
