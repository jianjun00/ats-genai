apiVersion: batch/v1
kind: Job
metadata:
  name: direct-polygon-api-test
  namespace: ats-dev
  labels:
    app: ats-genai
    component: polygon-api-testing
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: polygon-api-test
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Installing dependencies..."
          pip install --no-cache-dir aiohttp
          
          echo "Testing direct Polygon API calls..."
          cat > /tmp/test_polygon_direct.py << 'EOF'
          import asyncio
          import aiohttp
          import json
          import os
          from datetime import date, timedelta
          
          async def test_polygon_api_direct():
              """Test direct Polygon API calls for AAPL price data"""
              
              polygon_api_key = os.environ.get("POLYGON_API_KEY")
              if not polygon_api_key:
                  print("❌ POLYGON_API_KEY not available")
                  return
              
              print(f"✅ Using Polygon API key: {polygon_api_key[:8]}...")
              
              # Test different Polygon API endpoints for AAPL
              test_date = "2025-08-18"
              symbol = "AAPL"
              
              print(f"\n=== TESTING POLYGON API ENDPOINTS FOR {symbol} on {test_date} ===")
              
              async with aiohttp.ClientSession() as session:
                  
                  # Test 1: Daily open/close endpoint (what we might be using)
                  print(f"\n1. DAILY OPEN/CLOSE ENDPOINT:")
                  print(f"   URL: https://api.polygon.io/v1/open-close/{symbol}/{test_date}")
                  
                  url1 = f"https://api.polygon.io/v1/open-close/{symbol}/{test_date}"
                  params1 = {"apikey": polygon_api_key}
                  
                  try:
                      async with session.get(url1, params=params1) as response:
                          print(f"   Status: {response.status}")
                          if response.status == 200:
                              data1 = await response.json()
                              print(f"   Raw response: {json.dumps(data1, indent=2)}")
                              
                              close_price = data1.get('close', 'N/A')
                              open_price = data1.get('open', 'N/A') 
                              adjusted = data1.get('adjusted', 'N/A')
                              
                              print(f"   📊 Open: ${open_price}")
                              print(f"   📊 Close: ${close_price}")
                              print(f"   📊 Adjusted flag: {adjusted}")
                          else:
                              error_text = await response.text()
                              print(f"   ❌ Error: {error_text}")
                  except Exception as e:
                      print(f"   ❌ Exception: {e}")
                  
                  await asyncio.sleep(0.3)
                  
                  # Test 2: Daily open/close with explicit adjusted=true
                  print(f"\n2. DAILY OPEN/CLOSE WITH adjusted=true:")
                  
                  params2 = {"apikey": polygon_api_key, "adjusted": "true"}
                  
                  try:
                      async with session.get(url1, params=params2) as response:
                          print(f"   Status: {response.status}")
                          if response.status == 200:
                              data2 = await response.json()
                              close_price = data2.get('close', 'N/A')
                              print(f"   📊 Close (adjusted=true): ${close_price}")
                          else:
                              error_text = await response.text()
                              print(f"   ❌ Error: {error_text}")
                  except Exception as e:
                      print(f"   ❌ Exception: {e}")
                  
                  await asyncio.sleep(0.3)
                  
                  # Test 3: Daily open/close with explicit adjusted=false  
                  print(f"\n3. DAILY OPEN/CLOSE WITH adjusted=false:")
                  
                  params3 = {"apikey": polygon_api_key, "adjusted": "false"}
                  
                  try:
                      async with session.get(url1, params=params3) as response:
                          print(f"   Status: {response.status}")
                          if response.status == 200:
                              data3 = await response.json()
                              close_price = data3.get('close', 'N/A')
                              print(f"   📊 Close (adjusted=false): ${close_price}")
                          else:
                              error_text = await response.text()
                              print(f"   ❌ Error: {error_text}")
                  except Exception as e:
                      print(f"   ❌ Exception: {e}")
                  
                  await asyncio.sleep(0.3)
                  
                  # Test 4: Aggregates endpoint (another common source)
                  print(f"\n4. AGGREGATES ENDPOINT (single day):")
                  print(f"   URL: https://api.polygon.io/v2/aggs/ticker/{symbol}/range/1/day/{test_date}/{test_date}")
                  
                  url4 = f"https://api.polygon.io/v2/aggs/ticker/{symbol}/range/1/day/{test_date}/{test_date}"
                  params4 = {"apikey": polygon_api_key, "adjusted": "true"}
                  
                  try:
                      async with session.get(url4, params=params4) as response:
                          print(f"   Status: {response.status}")
                          if response.status == 200:
                              data4 = await response.json()
                              print(f"   Raw response: {json.dumps(data4, indent=2)}")
                              
                              results = data4.get('results', [])
                              if results:
                                  bar = results[0]
                                  close_price = bar.get('c', 'N/A')
                                  open_price = bar.get('o', 'N/A')
                                  high_price = bar.get('h', 'N/A')
                                  low_price = bar.get('l', 'N/A')
                                  volume = bar.get('v', 'N/A')
                                  
                                  print(f"   📊 Open: ${open_price}")
                                  print(f"   📊 High: ${high_price}")
                                  print(f"   📊 Low: ${low_price}")
                                  print(f"   📊 Close: ${close_price}")
                                  print(f"   📊 Volume: {volume}")
                          else:
                              error_text = await response.text()
                              print(f"   ❌ Error: {error_text}")
                  except Exception as e:
                      print(f"   ❌ Exception: {e}")
                  
                  await asyncio.sleep(0.3)
                  
                  # Test 5: Aggregates with adjusted=false
                  print(f"\n5. AGGREGATES ENDPOINT WITH adjusted=false:")
                  
                  params5 = {"apikey": polygon_api_key, "adjusted": "false"}
                  
                  try:
                      async with session.get(url4, params=params5) as response:
                          print(f"   Status: {response.status}")
                          if response.status == 200:
                              data5 = await response.json()
                              results = data5.get('results', [])
                              if results:
                                  bar = results[0]
                                  close_price = bar.get('c', 'N/A')
                                  print(f"   📊 Close (adjusted=false): ${close_price}")
                          else:
                              error_text = await response.text()
                              print(f"   ❌ Error: {error_text}")
                  except Exception as e:
                      print(f"   ❌ Exception: {e}")
                  
                  await asyncio.sleep(0.3)
                  
                  # Test 6: Check what our ingestion pipeline might be using
                  print(f"\n6. REFERENCE TICKER INFO (shares outstanding source):")
                  print(f"   URL: https://api.polygon.io/v3/reference/tickers/{symbol}")
                  
                  url6 = f"https://api.polygon.io/v3/reference/tickers/{symbol}"
                  params6 = {"apikey": polygon_api_key}
                  
                  try:
                      async with session.get(url6, params=params6) as response:
                          print(f"   Status: {response.status}")
                          if response.status == 200:
                              data6 = await response.json()
                              results = data6.get('results', {})
                              
                              market_cap = results.get('market_cap', 'N/A')
                              shares_outstanding = results.get('share_class_shares_outstanding', 'N/A')
                              
                              print(f"   📊 Market Cap (from API): ${market_cap/1000000000:.1f}B" if market_cap != 'N/A' else f"   📊 Market Cap: {market_cap}")
                              print(f"   📊 Shares Outstanding: {shares_outstanding:,}" if shares_outstanding != 'N/A' else f"   📊 Shares: {shares_outstanding}")
                              
                              if market_cap != 'N/A' and shares_outstanding != 'N/A':
                                  implied_price = market_cap / shares_outstanding
                                  print(f"   📊 Implied Price: ${implied_price:.2f}")
                                  print(f"   📊 This should match current/recent trading price")
                          else:
                              error_text = await response.text()
                              print(f"   ❌ Error: {error_text}")
                  except Exception as e:
                      print(f"   ❌ Exception: {e}")
              
              print(f"\n=== ANALYSIS ===")
              print("Compare the prices from different endpoints:")
              print("- If all endpoints show ~$80, then Polygon consistently provides unadjusted prices")
              print("- If some show ~$80 and others ~$250, then we're using the wrong endpoint")
              print("- If adjusted=true vs adjusted=false shows different values, that's the issue")
              print("- The reference ticker market cap should align with ~$250 price range")
          
          if __name__ == "__main__":
              asyncio.run(test_polygon_api_direct())
          EOF
          
          python /tmp/test_polygon_direct.py
        env:
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: POLYGON_API_KEY
        - name: PYTHONPATH
          value: "/tmp"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"