    import asyncio
    import json
    import aiohttp
    import os
    import logging
    from datetime import datetime
    from enum import Enum

    class AlertLevel(Enum):
        INFO = "info"
        SUCCESS = "success"
        WARNING = "warning"
        ERROR = "error"
        CRITICAL = "critical"

    class SlackAlerter:
        def __init__(self, webhook_url=None):
            self.webhook_url = webhook_url or os.getenv('SLACK_WEBHOOK_URL')
            self.logger = logging.getLogger(__name__)
            
            if not self.webhook_url:
                self.logger.warning("No Slack webhook URL provided - alerts will be logged only")
        
        def _get_color_for_level(self, level: AlertLevel):
            colors = {
                AlertLevel.INFO: "#36a64f",
                AlertLevel.SUCCESS: "#2eb886",
                AlertLevel.WARNING: "#ff9500",
                AlertLevel.ERROR: "#ff4444",
                AlertLevel.CRITICAL: "#8b0000"
            }
            return colors.get(level, "#36a64f")
        
        def _get_emoji_for_level(self, level: AlertLevel):
            emojis = {
                AlertLevel.INFO: "ℹ️",
                AlertLevel.SUCCESS: "✅",
                AlertLevel.WARNING: "⚠️",
                AlertLevel.ERROR: "❌",
                AlertLevel.CRITICAL: "🚨"
            }
            return emojis.get(level, "ℹ️")
        
        async def send_alert(self, title, message, level=AlertLevel.INFO, fields=None):
            if not self.webhook_url:
                self.logger.info(f"[{level.value.upper()}] {title}: {message}")
                return
            
            emoji = self._get_emoji_for_level(level)
            color = self._get_color_for_level(level)
            
            payload = {
                "username": "Minute Backfill Monitor",
                "icon_emoji": ":chart_with_upwards_trend:",
                "attachments": [
                    {
                        "color": color,
                        "title": f"{emoji} {title}",
                        "text": message,
                        "ts": int(datetime.now().timestamp()),
                        "footer": "ATS Minute Data Backfill"
                    }
                ]
            }
            
            if fields:
                payload["attachments"][0]["fields"] = [
                    {"title": k, "value": v, "short": True} for k, v in fields.items()
                ]
            
            try:
                async with aiohttp.ClientSession() as session:
                    async with session.post(self.webhook_url, json=payload) as response:
                        if response.status == 200:
                            self.logger.info(f"Slack alert sent: {title}")
                        else:
                            self.logger.error(f"Failed to send Slack alert: {response.status}")
            except Exception as e:
                self.logger.error(f"Error sending Slack alert: {e}")
        
        async def alert_job_started(self, job_name, stage, instruments_count, date_range):
            await self.send_alert(
                title=f"Minute Backfill Started - {stage}",
                message=f"Job `{job_name}` has started processing minute data backfill",
                level=AlertLevel.INFO,
                fields={
                    "Stage": stage,
                    "Instruments": f"{instruments_count:,}",
                    "Date Range": date_range,
                    "Status": "Running"
                }
            )
        
        async def alert_job_completed(self, job_name, stage, duration, records_processed):
            await self.send_alert(
                title=f"Minute Backfill Completed - {stage}",
                message=f"Job `{job_name}` completed successfully! 🎉",
                level=AlertLevel.SUCCESS,
                fields={
                    "Stage": stage,
                    "Duration": duration,
                    "Records Processed": f"{records_processed:,}",
                    "Status": "Success"
                }
            )
        
        async def alert_resource_pressure(self, memory_percent, cpu_percent, action_taken):
            level = AlertLevel.CRITICAL if action_taken == "Emergency stop" else AlertLevel.WARNING
            
            await self.send_alert(
                title="Resource Pressure Detected",
                message=f"System resources are under pressure during minute data backfill",
                level=level,
                fields={
                    "Memory Usage": f"{memory_percent:.1f}%",
                    "CPU Usage": f"{cpu_percent:.1f}%",
                    "Action Taken": action_taken
                }
            )
        
        async def alert_batch_progress(self, batch_num, total_batches, stage, records_in_batch):
            if batch_num % 5 == 0 or batch_num == total_batches:
                progress_percent = (batch_num / total_batches) * 100
                
                await self.send_alert(
                    title=f"Batch Progress - {stage}",
                    message=f"Processing batch {batch_num}/{total_batches} ({progress_percent:.1f}% complete)",
                    level=AlertLevel.INFO,
                    fields={
                        "Batch": f"{batch_num}/{total_batches}",
                        "Progress": f"{progress_percent:.1f}%",
                        "Records": f"{records_in_batch:,}"
                    }
                )

  backfill_script.py: |
    #!/usr/bin/env python3
    import time
    import psutil
    import asyncio
    import asyncpg
    import aiohttp
    from datetime import datetime, date, timedelta
    from slack_alerter import SlackAlerter, AlertLevel

    class Stage1MinuteBackfillWithSlack:
        def __init__(self):
            self.memory_threshold = 60
            self.cpu_threshold = 50
            self.alerter = SlackAlerter()
            self.start_time = datetime.now()
            
        def check_resources(self):
            memory = psutil.virtual_memory()
            cpu_percent = psutil.cpu_percent(interval=1)
            
            print(f"Resources - Memory: {memory.percent:.1f}%, CPU: {cpu_percent:.1f}%")
            
            if memory.percent > self.memory_threshold:
                print(f"⚠️  Memory pressure: {memory.percent:.1f}% > {self.memory_threshold}%")
                return False, memory.percent, cpu_percent
                
            if cpu_percent > self.cpu_threshold:
                print(f"⚠️  CPU pressure: {cpu_percent:.1f}% > {self.cpu_threshold}%")
                return False, memory.percent, cpu_percent
            
            return True, memory.percent, cpu_percent
        
        async def get_database_connection(self):
            db_host = "postgres-simple.ats-dev.svc.cluster.local"
            db_port = "5432"
            db_name = "dev_db"
            db_user = "postgres"
            db_password = "dev_password"
            
            connection_string = f"postgresql://{db_user}:{db_password}@{db_host}:{db_port}/{db_name}"
            
            try:
                conn = await asyncpg.connect(connection_string)
                print("✅ Database connection successful")
                return conn
            except Exception as e:
                print(f"❌ Database connection failed: {e}")
                raise
        
        async def get_instruments_for_backfill(self, conn, limit=500):
            instruments = await conn.fetch("""
                SELECT DISTINCT i.id, i.symbol 
                FROM dev_instruments i
                JOIN dev_daily_prices_polygon p ON i.id = p.instrument_id
                WHERE p.date >= '2025-08-01'
                ORDER BY i.symbol
                LIMIT $1
            """, limit)
            
            print(f"Selected {len(instruments)} instruments for backfill")
            return instruments
        
        async def simulate_minute_data_insertion(self, conn, instruments, start_date, end_date):
            print(f"Simulating minute data for {len(instruments)} instruments")
            print(f"Period: {start_date} to {end_date}")
            
            days = (end_date - start_date).days
            trading_days = max(1, days * 0.7)
            minutes_per_day = 390
            total_records = len(instruments) * trading_days * minutes_per_day
            
            print(f"Expected records: {total_records:,.0f}")
            
            polygon_table_exists = await conn.fetchval("""
                SELECT EXISTS (
                    SELECT FROM information_schema.tables 
                    WHERE table_name = 'dev_minute_prices_polygon'
                );
            """)
            
            tiingo_table_exists = await conn.fetchval("""
                SELECT EXISTS (
                    SELECT FROM information_schema.tables 
                    WHERE table_name = 'dev_minute_prices_tiingo'
                );
            """)
            
            print(f"✅ Table verification complete")
            return True, total_records
        
        async def run_stage1_backfill(self):
            job_name = "stage1-minute-backfill-slack-fixed"
            stage = "Stage 1 Conservative"
            
            print("=== STAGE 1: CONSERVATIVE MINUTE DATA BACKFILL WITH SLACK ALERTS ===")
            
            # Send job start alert
            await self.alerter.alert_job_started(
                job_name=job_name,
                stage=stage,
                instruments_count=500,
                date_range="2019-12-28 to 2019-12-31"
            )
            
            # Initial resource check
            resources_ok, memory_pct, cpu_pct = self.check_resources()
            if not resources_ok:
                await self.alerter.alert_resource_pressure(memory_pct, cpu_pct, "Job aborted")
                return False
            
            try:
                conn = await self.get_database_connection()
                instruments = await self.get_instruments_for_backfill(conn, limit=500)
                
                if not instruments:
                    await self.alerter.send_alert(
                        title="No Instruments Found",
                        message="No instruments available for backfill",
                        level=AlertLevel.ERROR
                    )
                    return False
                
                end_date = date(2019, 12, 31)
                start_date = end_date - timedelta(days=3)
                
                print(f"\nTarget period: {start_date} to {end_date}")
                
                batch_size = 50
                total_batches = (len(instruments) + batch_size - 1) // batch_size
                total_records_processed = 0
                
                for i in range(0, len(instruments), batch_size):
                    batch_num = i // batch_size + 1
                    batch = instruments[i:i + batch_size]
                    
                    print(f"\n=== Batch {batch_num}/{total_batches} ===")
                    
                    resources_ok, memory_pct, cpu_pct = self.check_resources()
                    if not resources_ok:
                        await self.alerter.alert_resource_pressure(
                            memory_pct, cpu_pct, "Backfill paused"
                        )
                        print("❌ Resource pressure - stopping backfill")
                        break
                    
                    success, records_in_batch = await self.simulate_minute_data_insertion(
                        conn, batch, start_date, end_date
                    )
                    
                    if not success:
                        await self.alerter.send_alert(
                            title=f"Batch {batch_num} Failed",
                            message="Batch processing failed",
                            level=AlertLevel.ERROR
                        )
                        break
                    
                    total_records_processed += records_in_batch
                    
                    print(f"✅ Batch {batch_num} completed")
                    
                    # Send progress alert
                    await self.alerter.alert_batch_progress(
                        batch_num=batch_num,
                        total_batches=total_batches,
                        stage=stage,
                        records_in_batch=records_in_batch
                    )
                    
                    print("⏸️  Cooling down 5s...")
                    await asyncio.sleep(5)
                
                await conn.close()
                
                duration = str(datetime.now() - self.start_time).split('.')[0]
                
                # Send completion alert
                await self.alerter.alert_job_completed(
                    job_name=job_name,
                    stage=stage,
                    duration=duration,
                    records_processed=total_records_processed
                )
                
                print("\n=== STAGE 1 COMPLETED ===")
                print("✅ Conservative backfill with Slack alerts successful")
                
                return True
                
            except Exception as e:
                error_msg = str(e)
                print(f"❌ Stage 1 failed: {error_msg}")
                
                await self.alerter.send_alert(
                    title="Backfill Job Failed",
                    message=f"Job failed with error: {error_msg}",
                    level=AlertLevel.ERROR
                )
                
                return False
    
    async def main():
        print("Installing required packages...")
        import subprocess
        subprocess.run(["pip", "install", "aiohttp"], check=True)
        
        backfiller = Stage1MinuteBackfillWithSlack()
        success = await backfiller.run_stage1_backfill()
        
        if success:
            print("\n🎉 STAGE 1 WITH SLACK ALERTS SUCCESS!")
        else:
            print("\n❌ STAGE 1 FAILED")
    
    if __name__ == "__main__":
        asyncio.run(main())

