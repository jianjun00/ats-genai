apiVersion: v1
kind: ConfigMap
metadata:
  name: fix-dashboards-script
  namespace: monitoring
data:
  fix_dashboards.py: |
    #!/usr/bin/env python3
    import requests
    import json
    import time
    import sys
    
    grafana_url = "http://grafana:3000"
    auth = ("admin", "admin123")
    
    print("🔧 Fixing dashboard visibility...")
    
    # Wait for Grafana
    for i in range(10):
        try:
            response = requests.get(f"{grafana_url}/api/health", timeout=5)
            if response.status_code == 200:
                break
        except:
            pass
        time.sleep(2)
    
    # Delete existing dashboards to recreate them in root
    print("🗑️ Cleaning up existing dashboards...")
    try:
        # Delete all existing dashboards
        dashboards_to_delete = [
            "k8s-cluster-monitoring-v2",
            "e1c5154f-c2bb-4252-90dc-b9742871a7aa", 
            "postgres-db-monitoring-v2",
            "ed5c502c-13d4-4ea9-b84b-efd231ab586a"
        ]
        
        for uid in dashboards_to_delete:
            requests.delete(f"{grafana_url}/api/dashboards/uid/{uid}", auth=auth)
            print(f"Deleted dashboard {uid}")
    except Exception as e:
        print(f"Cleanup error: {e}")
    
    # Create simple, working dashboards in root folder
    print("📊 Creating visible dashboards...")
    
    # Simple Kubernetes Dashboard
    k8s_simple = {
        "dashboard": {
            "id": None,
            "title": "Kubernetes Monitoring", 
            "uid": "k8s-simple",
            "tags": ["kubernetes"],
            "timezone": "",
            "panels": [
                {
                    "id": 1,
                    "title": "Cluster Nodes",
                    "type": "stat",
                    "targets": [{"expr": "count(kube_node_info)", "refId": "A"}],
                    "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "short",
                            "color": {"mode": "value"}
                        }
                    }
                },
                {
                    "id": 2,
                    "title": "Running Pods",
                    "type": "stat", 
                    "targets": [{"expr": "count(kube_pod_info{phase=\"Running\"})", "refId": "A"}],
                    "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "short",
                            "color": {"mode": "value"}
                        }
                    }
                },
                {
                    "id": 3,
                    "title": "CPU Usage",
                    "type": "timeseries",
                    "targets": [{"expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "refId": "A"}],
                    "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "percent"
                        }
                    }
                }
            ],
            "time": {"from": "now-1h", "to": "now"},
            "refresh": "30s"
        },
        "folderId": 0,
        "overwrite": True
    }
    
    # Simple PostgreSQL Dashboard  
    pg_simple = {
        "dashboard": {
            "id": None,
            "title": "PostgreSQL Monitoring",
            "uid": "postgres-simple", 
            "tags": ["postgresql"],
            "timezone": "",
            "panels": [
                {
                    "id": 1,
                    "title": "Database Up",
                    "type": "stat",
                    "targets": [{"expr": "pg_up", "refId": "A"}],
                    "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "short",
                            "mappings": [
                                {"options": {"0": {"text": "DOWN", "color": "red"}}, "type": "value"},
                                {"options": {"1": {"text": "UP", "color": "green"}}, "type": "value"}
                            ]
                        }
                    }
                },
                {
                    "id": 2,
                    "title": "Connections",
                    "type": "stat",
                    "targets": [{"expr": "sum(pg_stat_database_numbackends)", "refId": "A"}],
                    "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "short"
                        }
                    }
                },
                {
                    "id": 3,
                    "title": "Connection Count",
                    "type": "timeseries",
                    "targets": [{"expr": "pg_stat_database_numbackends", "refId": "A", "legendFormat": "{{datname}}"}],
                    "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
                    "fieldConfig": {
                        "defaults": {
                            "unit": "short"
                        }
                    }
                }
            ],
            "time": {"from": "now-1h", "to": "now"},
            "refresh": "10s"
        },
        "folderId": 0,
        "overwrite": True
    }
    
    # Create dashboards
    for dashboard_name, dashboard_data in [("Kubernetes", k8s_simple), ("PostgreSQL", pg_simple)]:
        try:
            response = requests.post(f"{grafana_url}/api/dashboards/db", 
                                   auth=auth, json=dashboard_data)
            if response.status_code == 200:
                print(f"✅ {dashboard_name} dashboard created")
            else:
                print(f"⚠️ {dashboard_name} error: {response.status_code}")
                print(response.text)
        except Exception as e:
            print(f"⚠️ {dashboard_name} exception: {e}")
    
    # List all dashboards in root
    print("📋 Available dashboards:")
    try:
        response = requests.get(f"{grafana_url}/api/search?folderIds=0", auth=auth)
        if response.status_code == 200:
            dashboards = response.json()
            for dash in dashboards:
                if dash['type'] == 'dash-db':
                    print(f"  📊 {dash['title']} - http://localhost:3000{dash['url']}")
        else:
            print(f"Could not list dashboards: {response.status_code}")
    except Exception as e:
        print(f"Error listing dashboards: {e}")
    
    print("🎉 Dashboard fix completed!")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fix-dashboards-job
  namespace: monitoring
spec:
  template:
    spec:
      containers:
      - name: dashboard-fixer
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
          - -c
          - |
            pip install requests
            python3 /scripts/fix_dashboards.py
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: fix-dashboards-script
      restartPolicy: Never
  backoffLimit: 2