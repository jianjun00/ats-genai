apiVersion: v1
kind: ConfigMap
metadata:
  name: enhanced-dataset-visualization-real-data-config
  namespace: ats-dev
# Script extracted to /scripts/webapp.py
# Original ConfigMap data removed for cleanup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-dataset-visualization-real-data
  namespace: ats-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhanced-dataset-visualization-real-data
  template:
    metadata:
      labels:
        app: enhanced-dataset-visualization-real-data
    spec:
      containers:
      - name: webapp
        image: python:3.11-slim
        command: ["/bin/sh"]
        args:
        - "-c"
        - "/scripts/enhanced_dataset_visualization_real_data_webapp_1.py"
---
apiVersion: v1
kind: Service
metadata:
  name: enhanced-dataset-visualization-real-data-service
  namespace: ats-dev
spec:
  selector:
    app: enhanced-dataset-visualization-real-data
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 32097
  type: NodePort