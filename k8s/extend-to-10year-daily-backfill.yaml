apiVersion: v1
kind: ConfigMap
metadata:
  name: extend-10year-daily-backfill-script
  namespace: ats-dev
data:
  backfill_script.py: |
    #!/usr/bin/env python3
    import os
    import sys
    import asyncio
    import logging
    from datetime import datetime, date, timedelta
    
    # Add src to Python path
    sys.path.insert(0, '/app/src')
    
    from config.environment import Environment
    from market_data.eod.daily_price_polygon import DailyPricePolygonBackfiller
    from market_data.eod.daily_price_tiingo import DailyPriceTiingoBackfiller
    
    async def main():
        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)
        
        # Environment setup
        env = Environment()
        
        # Target date range for 10-year coverage
        start_date = date(2015, 8, 18)
        end_date = date(2019, 12, 31)
        
        logger.info(f"Starting 10-year extension backfill from {start_date} to {end_date}")
        logger.info(f"This covers approximately 4.4 years of historical data")
        
        # Get instrument count
        import asyncpg
        conn = await asyncpg.connect(env.get_database_url())
        instrument_count = await conn.fetchval("SELECT COUNT(*) FROM dev_instruments")
        await conn.close()
        
        logger.info(f"Backfilling {instrument_count} instruments")
        
        # Initialize backfillers
        polygon_backfiller = DailyPricePolygonBackfiller(env=env)
        tiingo_backfiller = DailyPriceTiingoBackfiller(env=env)
        
        try:
            # Run Polygon backfill
            logger.info("Starting Polygon daily prices backfill...")
            await polygon_backfiller.run_backfill(
                start_date=start_date,
                end_date=end_date,
                batch_size=500,
                max_concurrent=10
            )
            
            # Run Tiingo backfill
            logger.info("Starting Tiingo daily prices backfill...")
            await tiingo_backfiller.run_backfill(
                start_date=start_date,
                end_date=end_date,
                batch_size=500,
                max_concurrent=10
            )
            
            logger.info("10-year coverage extension completed successfully!")
            
        except Exception as e:
            logger.error(f"Backfill failed: {e}")
            raise
    
    if __name__ == "__main__":
        asyncio.run(main())

---
apiVersion: batch/v1
kind: Job
metadata:
  name: extend-10year-daily-backfill-job
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 86400  # 24 hours
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: backfill-container
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            
            # Install system dependencies
            apt-get update && apt-get install -y git curl build-essential
            
            # Install uv for faster package management
            curl -LsSf https://astral.sh/uv/install.sh | sh
            source $HOME/.cargo/env
            
            # Clone repository
            git clone https://github.com/jianjungit/ats-genai.git /app
            cd /app
            
            # Install Python dependencies
            uv pip install --system -r requirements.txt
            
            # Set environment variables
            export PYTHONPATH=/app/src
            export ENVIRONMENT=dev
            export DB_CONNECTION_PARAMS=sslmode=disable
            
            # Ray configuration for Kubernetes
            export RAY_SCHEDULER_EVENTS=0
            export RAY_DISABLE_AUTOMATIC_AUTOSCALING=1
            export RAY_DISABLE_DASHBOARD=1
            export RAY_USAGE_STATS_ENABLED=0
            export RAY_ADDRESS=""
            
            # Run the backfill script
            python3 /scripts/backfill_script.py
        env:
        - name: DB_HOST
          value: "postgres-simple.ats-dev.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: POLYGON_API_KEY
          value: "placeholder"  # Will be configured via API calls
        - name: TIINGO_API_KEY
          value: "placeholder"  # Will be configured via API calls
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi" 
            cpu: "4000m"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: extend-10year-daily-backfill-script
          defaultMode: 0755