apiVersion: batch/v1
kind: Job
metadata:
  name: corrected-schema-training
  namespace: ats-dev
  labels:
    app: ml-training
    job-type: real-production-model
    version: schema-corrected
spec:
  activeDeadlineSeconds: 14400  # 4 hours
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: ml-training
        job-type: real-production-model
    spec:
      restartPolicy: Never
      containers:
      - name: real-model-trainer
        image: python:3.12-slim
        resources:
          requests:
            memory: "8Gi"
            cpu: "4"
          limits:
            memory: "12Gi"
            cpu: "6"
        env:
        - name: PYTHONPATH
          value: "src"
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        workingDir: /app
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/corrected_schema_training_1.py"---
apiVersion: v1
kind: ConfigMap
metadata:
  name: corrected-training-script
  namespace: ats-dev
# Script extracted to /scripts/train_corrected.py
