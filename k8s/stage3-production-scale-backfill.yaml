apiVersion: batch/v1
kind: Job
metadata:
  name: stage3-production-scale-backfill-job
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 10800  # 3 hours for production job
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: stage3-production-container
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            
            echo "=== 🏭 STAGE 3 PRODUCTION SCALE BACKFILL ==="
            echo "🚀 Enterprise-grade massive data processing!"
            echo "📊 Advanced monitoring, auto-throttling, and circuit breakers"
            echo "🎯 Processing multiple years of comprehensive market data"
            
            pip install psutil asyncpg aiohttp
            
            cp /scripts/slack_alerter.py .
            cp /scripts/production_backfill_script.py .
            
            python3 production_backfill_script.py
        env:
        - name: SLACK_WEBHOOK_URL
          value: "https://hooks.slack.com/services/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"
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: POLYGON_API_KEY
        - name: DB_HOST
          value: "postgres-simple.ats-dev.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: stage3-production-scale-backfill-script
          defaultMode: 0755