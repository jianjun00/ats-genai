apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-analytics
  namespace: ats-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats-analytics
  template:
    metadata:
      labels:
        app: ats-analytics
    spec:
      containers:
      - name: analytics
        image: dragonflyer762/ats-genai:latest
        command: ["python3"]
        args: ["/app/unified_analytics_platform.py"]
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONPATH
          value: "src"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ats-analytics
  namespace: ats-dev
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30003
  selector:
    app: ats-analytics