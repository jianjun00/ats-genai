  name: etf-population-job
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 3600  # Keep for 1 hour
  template:
    spec:
      containers:
      - name: etf-populator
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
