apiVersion: batch/v1
kind: Job
metadata:
  name: comprehensive-market-cap-population
  namespace: ats-dev
  labels:
    app: ats-genai
    component: market-cap-population
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: market-cap-populator
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Starting comprehensive market cap population for 10k instruments..."
          pip install --no-cache-dir asyncpg aiohttp gin-config
          
          mkdir -p /app/src/secmaster
          mkdir -p /app/src/config
          cd /app
          
          # Create comprehensive market cap population script
          cat > /app/src/secmaster/comprehensive_market_cap_population.py << 'EOF'
          #!/usr/bin/env python3
          """
          Comprehensive Market Cap Population for All 10k Instruments
          
          Populates market cap data for all instruments using:
          1. Polygon shares outstanding API
          2. Current price data from existing database
          3. Calculated market cap = shares * price
          """
          
          import asyncio
          import asyncpg
          import aiohttp
          import logging
          import os
          import json
          from datetime import date, datetime, timedelta
          from typing import List, Dict, Optional
          from dataclasses import dataclass
          
          @dataclass
          class MarketCapResult:
              symbol: str
              instrument_id: int
              shares_outstanding: int
              price: float
              market_cap: float
              date: date
              source: str = "polygon"
          
          class SimpleEnvironment:
              def get_table_name(self, base_name):
                  return f"dev_{base_name}"
              
              def get_database_url(self):
                  host = os.environ.get('DB_HOST', 'postgres-simple')
                  port = os.environ.get('DB_PORT', '5432')
                  user = os.environ.get('DB_USER', 'postgres')
                  password = os.environ.get('DB_PASSWORD', 'dev_password')
                  database = os.environ.get('DB_NAME', 'dev_db')
                  return f"postgresql://{user}:{password}@{host}:{port}/{database}"
          
          class ComprehensiveMarketCapPopulator:
              def __init__(self, env):
                  self.env = env
                  self.db_url = env.get_database_url()
                  self.polygon_api_key = os.getenv('POLYGON_API_KEY')
                  self.logger = logging.getLogger(__name__)
                  
                  if not self.polygon_api_key:
                      raise ValueError("POLYGON_API_KEY environment variable required")
              
              async def get_all_instruments(self) -> List[tuple]:
                  """Get all instruments that need market cap data"""
                  
                  pool = await asyncpg.create_pool(self.db_url, min_size=2, max_size=5)
                  
                  try:
                      async with pool.acquire() as conn:
                          # Get instruments missing market cap data or with old data
                          cutoff_date = date.today() - timedelta(days=7)
                          
                          rows = await conn.fetch("""
                              SELECT DISTINCT i.id, i.symbol
                              FROM dev_instruments i
                              LEFT JOIN dev_daily_market_cap mc ON i.id = mc.instrument_id 
                                  AND mc.date >= $1
                              WHERE mc.instrument_id IS NULL
                                AND i.symbol IS NOT NULL
                              ORDER BY i.symbol
                          """, cutoff_date)
                          
                          instruments = [(row['id'], row['symbol']) for row in rows]
                          self.logger.info(f"Found {len(instruments)} instruments needing market cap data")
                          
                          return instruments
                  
                  finally:
                      await pool.close()
              
              async def fetch_shares_outstanding(self, symbol: str, session: aiohttp.ClientSession) -> Optional[int]:
                  """Fetch shares outstanding from Polygon API"""
                  
                  url = f"https://api.polygon.io/v3/reference/tickers/{symbol}"
                  headers = {"Authorization": f"Bearer {self.polygon_api_key}"}
                  
                  try:
                      await asyncio.sleep(0.2)  # Rate limiting: 5 calls/min = 12 seconds between calls
                      
                      async with session.get(url, headers=headers) as response:
                          if response.status == 429:
                              self.logger.warning(f"Rate limit hit for {symbol}, waiting...")
                              await asyncio.sleep(60)
                              return None
                          
                          if response.status != 200:
                              self.logger.warning(f"HTTP {response.status} for {symbol}")
                              return None
                          
                          data = await response.json()
                          
                          if 'results' in data:
                              results = data['results']
                              shares = results.get('share_class_shares_outstanding')
                              
                              if shares and shares > 0:
                                  return int(shares)
                              else:
                                  # Try weighted shares outstanding as fallback
                                  weighted_shares = results.get('weighted_shares_outstanding')
                                  if weighted_shares and weighted_shares > 0:
                                      return int(weighted_shares)
                          
                          self.logger.warning(f"No shares outstanding data for {symbol}")
                          return None
                  
                  except Exception as e:
                      self.logger.error(f"Error fetching shares for {symbol}: {e}")
                      return None
              
              async def get_recent_price(self, instrument_id: int, symbol: str) -> Optional[float]:
                  """Get recent price for instrument from database"""
                  
                  pool = await asyncpg.create_pool(self.db_url, min_size=1, max_size=2)
                  
                  try:
                      async with pool.acquire() as conn:
                          # Try to get recent price from any vendor (prefer Polygon, then Tiingo, then FMP)
                          for table in ['dev_daily_prices_polygon', 'dev_daily_prices_tiingo', 'dev_daily_prices_fmp']:
                              try:
                                  price = await conn.fetchval(f"""
                                      SELECT close
                                      FROM {table}
                                      WHERE instrument_id = $1
                                        AND close IS NOT NULL
                                        AND close > 0
                                      ORDER BY date DESC
                                      LIMIT 1
                                  """, instrument_id)
                                  
                                  if price:
                                      self.logger.debug(f"Found price ${price:.2f} for {symbol} in {table}")
                                      return float(price)
                              
                              except Exception as e:
                                  self.logger.debug(f"No price in {table} for {symbol}: {e}")
                                  continue
                          
                          self.logger.warning(f"No recent price found for {symbol}")
                          return None
                  
                  finally:
                      await pool.close()
              
              async def save_market_cap(self, result: MarketCapResult) -> bool:
                  """Save market cap result to database"""
                  
                  pool = await asyncpg.create_pool(self.db_url, min_size=1, max_size=2)
                  
                  try:
                      async with pool.acquire() as conn:
                          await conn.execute("""
                              INSERT INTO dev_daily_market_cap 
                              (instrument_id, date, market_cap, shares_outstanding, price_used, source, created_at, updated_at)
                              VALUES ($1, $2, $3, $4, $5, $6, NOW(), NOW())
                              ON CONFLICT (instrument_id, date) 
                              DO UPDATE SET 
                                  market_cap = EXCLUDED.market_cap,
                                  shares_outstanding = EXCLUDED.shares_outstanding,
                                  price_used = EXCLUDED.price_used,
                                  source = EXCLUDED.source,
                                  updated_at = NOW()
                          """, 
                          result.instrument_id,
                          result.date,
                          int(result.market_cap),
                          result.shares_outstanding,
                          result.price,
                          result.source
                          )
                          
                          self.logger.info(f"✅ Saved market cap for {result.symbol}: ${result.market_cap/1e9:.2f}B")
                          return True
                  
                  except Exception as e:
                      self.logger.error(f"Error saving market cap for {result.symbol}: {e}")
                      return False
                  
                  finally:
                      await pool.close()
              
              async def process_instrument_batch(self, instruments: List[tuple], session: aiohttp.ClientSession) -> List[MarketCapResult]:
                  """Process a batch of instruments"""
                  
                  results = []
                  today = date.today()
                  
                  for instrument_id, symbol in instruments:
                      self.logger.info(f"📊 Processing {symbol} (ID: {instrument_id})")
                      
                      try:
                          # 1. Get shares outstanding from Polygon
                          shares = await self.fetch_shares_outstanding(symbol, session)
                          if not shares:
                              self.logger.warning(f"⚠️  No shares data for {symbol}")
                              continue
                          
                          # 2. Get recent price from database
                          price = await self.get_recent_price(instrument_id, symbol)
                          if not price:
                              self.logger.warning(f"⚠️  No price data for {symbol}")
                              continue
                          
                          # 3. Calculate market cap
                          market_cap = shares * price
                          
                          # Sanity check: market cap should be reasonable (> $1M, < $10T)
                          if market_cap < 1_000_000 or market_cap > 10_000_000_000_000:
                              self.logger.warning(f"⚠️  Unreasonable market cap for {symbol}: ${market_cap/1e9:.2f}B")
                              continue
                          
                          result = MarketCapResult(
                              symbol=symbol,
                              instrument_id=instrument_id,
                              shares_outstanding=shares,
                              price=price,
                              market_cap=market_cap,
                              date=today
                          )
                          
                          # 4. Save to database
                          if await self.save_market_cap(result):
                              results.append(result)
                      
                      except Exception as e:
                          self.logger.error(f"Error processing {symbol}: {e}")
                          continue
                  
                  return results
              
              async def run_comprehensive_population(self, batch_size: int = 20, max_instruments: int = None) -> Dict:
                  """Run comprehensive market cap population for all instruments"""
                  
                  start_time = datetime.now()
                  self.logger.info("🚀 Starting comprehensive market cap population")
                  
                  # Get all instruments needing market cap
                  all_instruments = await self.get_all_instruments()
                  
                  if max_instruments:
                      all_instruments = all_instruments[:max_instruments]
                  
                  total_instruments = len(all_instruments)
                  self.logger.info(f"📊 Processing {total_instruments} instruments in batches of {batch_size}")
                  
                  all_results = []
                  failed_symbols = []
                  
                  # Process in batches
                  timeout = aiohttp.ClientTimeout(total=60)
                  async with aiohttp.ClientSession(timeout=timeout) as session:
                      
                      for i in range(0, total_instruments, batch_size):
                          batch = all_instruments[i:i + batch_size]
                          batch_num = (i // batch_size) + 1
                          total_batches = (total_instruments + batch_size - 1) // batch_size
                          
                          self.logger.info(f"🔄 Processing batch {batch_num}/{total_batches}")
                          
                          try:
                              batch_results = await self.process_instrument_batch(batch, session)
                              all_results.extend(batch_results)
                              
                              # Track failed symbols
                              batch_symbols = {symbol for _, symbol in batch}
                              result_symbols = {r.symbol for r in batch_results}
                              failed_batch = batch_symbols - result_symbols
                              failed_symbols.extend(failed_batch)
                              
                              # Progress update
                              processed = min(i + batch_size, total_instruments)
                              success_rate = (len(all_results) / processed) * 100
                              self.logger.info(f"  Progress: {processed}/{total_instruments} ({processed/total_instruments*100:.1f}%)")
                              self.logger.info(f"  Success rate: {success_rate:.1f}% ({len(all_results)} successful)")
                              
                              # Brief delay between batches
                              await asyncio.sleep(1)
                          
                          except Exception as e:
                              self.logger.error(f"Error processing batch {batch_num}: {e}")
                              continue
                  
                  # Final summary
                  end_time = datetime.now()
                  duration = end_time - start_time
                  
                  summary = {
                      'total_instruments_processed': total_instruments,
                      'successful_calculations': len(all_results),
                      'failed_symbols': len(failed_symbols),
                      'success_rate': (len(all_results) / total_instruments * 100) if total_instruments > 0 else 0,
                      'processing_time': str(duration),
                      'average_market_cap': sum(r.market_cap for r in all_results) / len(all_results) if all_results else 0
                  }
                  
                  self.logger.info(f"🎉 Market cap population completed!")
                  self.logger.info(f"📊 Successful: {len(all_results)}/{total_instruments} ({summary['success_rate']:.1f}%)")
                  self.logger.info(f"⏱️  Duration: {duration}")
                  
                  if all_results:
                      avg_market_cap_b = summary['average_market_cap'] / 1e9
                      self.logger.info(f"💰 Average market cap: ${avg_market_cap_b:.2f}B")
                      
                      # Show largest market caps
                      top_5 = sorted(all_results, key=lambda x: x.market_cap, reverse=True)[:5]
                      self.logger.info("🏆 Top 5 largest market caps:")
                      for result in top_5:
                          self.logger.info(f"  • {result.symbol}: ${result.market_cap/1e9:.2f}B")
                  
                  if failed_symbols:
                      self.logger.warning(f"❌ Failed symbols ({len(failed_symbols)}):")
                      for symbol in failed_symbols[:10]:  # Show first 10
                          self.logger.warning(f"  • {symbol}")
                      if len(failed_symbols) > 10:
                          self.logger.warning(f"  ... and {len(failed_symbols) - 10} more")
                  
                  return summary
          
          async def main():
              logging.basicConfig(
                  level=logging.INFO,
                  format='%(asctime)s - %(levelname)s - %(message)s'
              )
              
              env = SimpleEnvironment()
              populator = ComprehensiveMarketCapPopulator(env)
              
              # Process all instruments, but limit for initial run
              summary = await populator.run_comprehensive_population(
                  batch_size=10,        # Small batches for rate limiting
                  max_instruments=500   # Start with 500 instruments
              )
              
              print(f"\n📋 FINAL SUMMARY")
              print("=" * 60)
              for key, value in summary.items():
                  print(f"{key}: {value}")
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          echo "🔄 Running comprehensive market cap population..."
          cd /app && python src/secmaster/comprehensive_market_cap_population.py
        env:
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: POLYGON_API_KEY
          value: "wfrcZNX3ZJJt55Or_CmBXda8G8e8tABD"
        - name: PYTHONPATH
          value: "/app/src"
        resources:
          requests:
            memory: "1Gi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "500m"