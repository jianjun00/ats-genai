apiVersion: batch/v1
kind: Job
metadata:
  name: dynamic-modeling-universe-update
  namespace: ats-dev
  labels:
    app: dynamic-modeling-universe
    job-type: daily-update
spec:
  template:
    metadata:
      labels:
        app: dynamic-modeling-universe
    spec:
      restartPolicy: Never
      containers:
      - name: universe-updater
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/dynamic_modeling_universe_job_1.py"
---
# ConfigMap for the application code
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-universe-code
  namespace: ats-dev
data:
  # This will be populated by kubectl create configmap command
  # See deployment instructions below

---
# CronJob for daily execution
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dynamic-modeling-universe-daily
  namespace: ats-dev
  labels:
    app: dynamic-modeling-universe
    schedule-type: daily
spec:
  # Run daily at 6 AM UTC (after market close)
  schedule: "0 6 * * *"
  jobTemplate:
    metadata:
      labels:
        app: dynamic-modeling-universe
        job-type: scheduled-update
    spec:
      template:
        metadata:
          labels:
            app: dynamic-modeling-universe
        spec:
          restartPolicy: Never
          containers:
          - name: universe-updater
            image: python:3.12-slim
            command: ["/bin/bash"]
            args:
        - "-c"
        - "/scripts/dynamic_modeling_universe_job_2.py"
