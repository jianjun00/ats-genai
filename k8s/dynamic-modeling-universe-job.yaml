apiVersion: batch/v1
kind: Job
metadata:
  name: dynamic-modeling-universe-update
  namespace: ats-dev
  labels:
    app: dynamic-modeling-universe
    job-type: daily-update
spec:
  template:
    metadata:
      labels:
        app: dynamic-modeling-universe
    spec:
      restartPolicy: Never
      containers:
      - name: universe-updater
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "Installing dependencies..."
          pip install --no-cache-dir asyncpg
          
          echo "Running dynamic universe update..."
          cd /app
          python src/universe/dynamic_modeling_universe.py --update-daily --debug
          
          echo "Generating universe report..."
          python src/universe/dynamic_modeling_universe.py --report
          
          echo "Universe update completed successfully"
        
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: DB_NAME
          value: "dev_db"
        - name: PYTHONPATH
          value: "src"
        
        volumeMounts:
        - name: app-code
          mountPath: /app
        - name: config
          mountPath: /app/config
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      
      volumes:
      - name: app-code
        configMap:
          name: dynamic-universe-code
      - name: config
        configMap:
          name: app-config

---
# ConfigMap for the application code
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-universe-code
  namespace: ats-dev
data:
  # This will be populated by kubectl create configmap command
  # See deployment instructions below

---
# CronJob for daily execution
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dynamic-modeling-universe-daily
  namespace: ats-dev
  labels:
    app: dynamic-modeling-universe
    schedule-type: daily
spec:
  # Run daily at 6 AM UTC (after market close)
  schedule: "0 6 * * *"
  jobTemplate:
    metadata:
      labels:
        app: dynamic-modeling-universe
        job-type: scheduled-update
    spec:
      template:
        metadata:
          labels:
            app: dynamic-modeling-universe
        spec:
          restartPolicy: Never
          containers:
          - name: universe-updater
            image: python:3.12-slim
            command: ["/bin/bash"]
            args:
            - -c
            - |
              set -e
              echo "=== Daily Dynamic Universe Update ==="
              echo "Date: $(date)"
              echo "Environment: $ENVIRONMENT"
              
              echo "Installing dependencies..."
              pip install --no-cache-dir asyncpg
              
              echo "Running universe update..."
              cd /app
              python src/universe/dynamic_modeling_universe.py --update-daily --debug
              
              echo "Generating status report..."
              python src/universe/dynamic_modeling_universe.py --report
              
              echo "=== Update completed successfully ==="
              echo "Summary files generated:"
              ls -la universe_*.json universe_*.md 2>/dev/null || echo "No summary files found"
            
            env:
            - name: ENVIRONMENT
              value: "dev"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: DB_NAME
              value: "dev_db"
            - name: PYTHONPATH
              value: "src"
            
            volumeMounts:
            - name: app-code
              mountPath: /app
            - name: config
              mountPath: /app/config
            
            resources:
              requests:
                memory: "256Mi"
                cpu: "250m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          
          volumes:
          - name: app-code
            configMap:
              name: dynamic-universe-code
          - name: config
            configMap:
              name: app-config
  
  # Keep last 7 job executions
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3

