apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-pilot
  namespace: ats-dev
  labels:
    app: deepseek-pilot
    component: llm-inference
    version: pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepseek-pilot
  template:
    metadata:
      labels:
        app: deepseek-pilot
        component: llm-inference
    spec:
      containers:
      - name: deepseek-r1
        image: vllm/vllm-openai:v0.3.2
        command: 
        - python
        - -m
        - vllm.entrypoints.openai.api_server
        args:
        - --model=deepseek-ai/DeepSeek-R1
        - --served-model-name=deepseek-r1
        - --max-model-len=8192
        - --gpu-memory-utilization=0.85
        - --tensor-parallel-size=1
        - --host=0.0.0.0
        - --port=8000
        - --disable-log-stats
        resources:
          requests:
            nvidia.com/gpu: 1
            memory: "32Gi"
            cpu: "8"
          limits:
            nvidia.com/gpu: 1
            memory: "64Gi"
            cpu: "16"
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: NCCL_DEBUG
          value: "ERROR"
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: "spawn"
        ports:
        - containerPort: 8000
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 2
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: deepseek-model-cache
      - name: tmp
        emptyDir:
          sizeLimit: "10Gi"
      nodeSelector:
        accelerator: nvidia-h100
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

---

apiVersion: v1
kind: Service
metadata:
  name: deepseek-pilot-service
  namespace: ats-dev
  labels:
    app: deepseek-pilot
spec:
  selector:
    app: deepseek-pilot
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: deepseek-pilot-external
  namespace: ats-dev
  labels:
    app: deepseek-pilot
spec:
  selector:
    app: deepseek-pilot
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30800
    protocol: TCP
    name: http
  type: NodePort

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deepseek-model-cache
  namespace: ats-dev
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: deepseek-pilot-config
  namespace: ats-dev
data:
  model_config.json: |
    {
      "model_name": "deepseek-r1",
      "max_tokens": 2048,
      "temperature": 0.1,
      "top_p": 0.95,
      "frequency_penalty": 0.0,
      "presence_penalty": 0.0,
      "stop_sequences": ["</analysis>"],
      "timeout": 30
    }
  
  financial_prompt_template.txt: |
    Analyze this financial news article and provide structured output in JSON format:
    
    Title: {title}
    Content: {content}
    Symbol: {symbol}
    Source: {source}
    Published: {published_date}
    
    Provide analysis in this exact JSON format:
    {
      "sentiment_score": <number between -1.0 and 1.0>,
      "confidence": <number between 0.0 and 1.0>,
      "event_type": "<earnings|guidance|merger|regulatory|clinical|bankruptcy|other>",
      "impact_timeline": "<immediate|1week|1month|1quarter>",
      "quantified_impact": "<specific percentage, dollar amount, or 'not specified'>",
      "risk_factors": ["<list of 1-3 key risk factors>"],
      "key_points": ["<3-5 most important factual points>"],
      "reasoning": "<brief 2-3 sentence explanation of the analysis>"
    }
    
    Focus on factual financial analysis. Be conservative with confidence scores.

---

apiVersion: batch/v1
kind: Job
metadata:
  name: deepseek-pilot-test
  namespace: ats-dev
  labels:
    app: deepseek-pilot-test
spec:
  template:
    metadata:
      labels:
        app: deepseek-pilot-test
    spec:
      containers:
      - name: test-client
        image: dragonflyer762/ats-genai:latest
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "Testing DeepSeek pilot deployment..."
          
          # Wait for service to be ready
          echo "Waiting for DeepSeek service..."
          until curl -f http://deepseek-pilot-service:8000/health; do
            echo "Service not ready, waiting..."
            sleep 10
          done
          
          # Test basic inference
          echo "Testing inference..."
          curl -X POST http://deepseek-pilot-service:8000/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "deepseek-r1",
              "messages": [
                {
                  "role": "user",
                  "content": "Analyze this financial news: Apple reports Q4 earnings beat with revenue of $95B, up 5% YoY. iPhone sales exceeded expectations. Company raises guidance for next quarter."
                }
              ],
              "max_tokens": 1000,
              "temperature": 0.1
            }' | python -m json.tool
          
          echo "Pilot deployment test completed successfully!"
      restartPolicy: Never
  backoffLimit: 3

---

apiVersion: v1
kind: Secret
metadata:
  name: deepseek-pilot-secrets
  namespace: ats-dev
type: Opaque
stringData:
  # Add any API keys or secrets needed for model access
  huggingface_token: ""
  deepseek_api_key: ""
  monitoring_token: ""

---

# Monitoring and logging configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: deepseek-monitoring-config
  namespace: ats-dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
    - job_name: 'deepseek-pilot'
      static_configs:
      - targets: ['deepseek-pilot-service:8000']
      metrics_path: /metrics
      scrape_interval: 30s
  
  grafana-dashboard.json: |
    {
      "dashboard": {
        "title": "DeepSeek Pilot Metrics",
        "panels": [
          {
            "title": "Request Rate",
            "type": "graph",
            "targets": [{"expr": "rate(vllm_requests_total[5m])"}]
          },
          {
            "title": "Request Latency",
            "type": "graph", 
            "targets": [{"expr": "vllm_request_duration_seconds"}]
          },
          {
            "title": "GPU Utilization",
            "type": "graph",
            "targets": [{"expr": "nvidia_gpu_utilization"}]
          },
          {
            "title": "Memory Usage",
            "type": "graph",
            "targets": [{"expr": "nvidia_gpu_memory_used_bytes"}]
          }
        ]
      }
    }

---

# Network policy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deepseek-pilot-netpol
  namespace: ats-dev
spec:
  podSelector:
    matchLabels:
      app: deepseek-pilot
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ats-dev
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 443  # HTTPS for model downloads
    - protocol: TCP
      port: 80   # HTTP for health checks