---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-training-visualization-webapp
  namespace: ats-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhanced-training-visualization-webapp
  template:
    metadata:
      labels:
        app: enhanced-training-visualization-webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
          - -c
          - |
            echo "📦 Installing dependencies..."
            pip install fastapi uvicorn asyncpg numpy pandas pydantic
            
            echo "🚀 Starting Enhanced Training Data Visualization Webapp..."
            python /config/webapp.py
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: config-volume
          mountPath: /config
        env:
        - name: ENVIRONMENT
          value: "dev"
      volumes:
      - name: config-volume
        configMap:
          name: enhanced-training-visualization-config
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: enhanced-training-visualization-service
  namespace: ats-dev
spec:
  selector:
    app: enhanced-training-visualization-webapp
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30003
  type: NodePort