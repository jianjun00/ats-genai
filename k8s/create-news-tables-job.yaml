apiVersion: batch/v1
kind: Job
metadata:
  name: create-news-tables
  namespace: ats-dev
  labels:
    app: create-news-tables
    component: database-setup
    tier: migration
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: create-news-tables
        component: database-setup
        tier: migration
    spec:
      restartPolicy: Never
      containers:
      - name: create-tables
        image: dragonflyer762/ats-genai:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          
          echo "🚀 Creating News Database Tables"
          echo "⏰ Start time: $(date)"
          
          # Create table creation script
          cat > /tmp/create_news_tables.py << 'SCRIPT_EOF'
          #!/usr/bin/env python3
          """Create news tables if they don't exist"""
          
          import asyncio
          import os
          import logging
          
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)
          
          async def create_news_tables():
              """Create news tables for Polygon and Tiingo"""
              
              try:
                  import asyncpg
                  
                  db_config = {
                      'host': os.getenv("DB_HOST", "postgres"),
                      'port': int(os.getenv("DB_PORT", "5432")),
                      'user': os.getenv("DB_USER", "postgres"),
                      'password': os.getenv("DB_PASSWORD", "dev_password"),
                      'database': os.getenv("DB_NAME", "dev_db")
                  }
                  
                  logger.info(f"Connecting to {db_config['host']}:{db_config['port']}/{db_config['database']}")
                  
                  conn = await asyncpg.connect(**db_config)
                  
                  # Create Polygon news table
                  await conn.execute("""
                      CREATE TABLE IF NOT EXISTS news_polygon (
                          id BIGSERIAL PRIMARY KEY,
                          polygon_id VARCHAR(255) UNIQUE NOT NULL,
                          title TEXT NOT NULL,
                          description TEXT,
                          author VARCHAR(255),
                          published_utc TIMESTAMP WITH TIME ZONE NOT NULL,
                          article_url TEXT,
                          image_url TEXT,
                          publisher_name VARCHAR(255),
                          publisher_homepage_url TEXT,
                          publisher_logo_url TEXT,
                          publisher_favicon_url TEXT,
                          keywords TEXT[],
                          tickers TEXT[],
                          insights JSONB,
                          data JSONB NOT NULL,
                          created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
                          updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
                      )
                  """)
                  logger.info("✅ Created/verified news_polygon table")
                  
                  # Create Tiingo news table  
                  await conn.execute("""
                      CREATE TABLE IF NOT EXISTS news_tiingo (
                          id BIGSERIAL PRIMARY KEY,
                          tiingo_id INTEGER UNIQUE NOT NULL,
                          title TEXT NOT NULL,
                          description TEXT,
                          published_date TIMESTAMP WITH TIME ZONE NOT NULL,
                          crawl_date TIMESTAMP WITH TIME ZONE NOT NULL,
                          url TEXT,
                          source VARCHAR(255),
                          tags TEXT[],
                          tickers TEXT[],
                          data JSONB NOT NULL,
                          created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
                          updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
                      )
                  """)
                  logger.info("✅ Created/verified news_tiingo table")
                  
                  # Create indexes
                  await conn.execute("""
                      CREATE INDEX IF NOT EXISTS idx_news_polygon_published_utc 
                      ON news_polygon(published_utc DESC)
                  """)
                  await conn.execute("""
                      CREATE INDEX IF NOT EXISTS idx_news_polygon_tickers 
                      ON news_polygon USING GIN(tickers)
                  """)
                  await conn.execute("""
                      CREATE INDEX IF NOT EXISTS idx_news_tiingo_published_date 
                      ON news_tiingo(published_date DESC)
                  """)
                  await conn.execute("""
                      CREATE INDEX IF NOT EXISTS idx_news_tiingo_tickers 
                      ON news_tiingo USING GIN(tickers)
                  """)
                  logger.info("✅ Created indexes")
                  
                  # Check table counts
                  polygon_count = await conn.fetchval("SELECT COUNT(*) FROM news_polygon")
                  tiingo_count = await conn.fetchval("SELECT COUNT(*) FROM news_tiingo")
                  
                  logger.info(f"📊 Current data: {polygon_count} Polygon, {tiingo_count} Tiingo articles")
                  
                  await conn.close()
                  
                  logger.info("🎉 News tables setup completed successfully!")
                  return True
                  
              except Exception as e:
                  logger.error(f"❌ Table creation failed: {e}")
                  import traceback
                  traceback.print_exc()
                  return False
          
          if __name__ == "__main__":
              result = asyncio.run(create_news_tables())
              exit(0 if result else 1)
          SCRIPT_EOF
          
          # Run the table creation
          python3 /tmp/create_news_tables.py
          
          echo "✅ News tables creation completed at $(date)"
          
        env:
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: ENVIRONMENT
          value: "dev"
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"