apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-data-quality-exporter
  namespace: ats-dev
  labels:
    app: ats-data-quality-exporter
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats-data-quality-exporter
  template:
    metadata:
      labels:
        app: ats-data-quality-exporter
    spec:
      containers:
        - name: data-quality-exporter
          image: dragonflyer762/ats-genai:latest
          command: ["python3", "/app/src/monitoring/data_quality_exporter.py"]
          ports:
            - containerPort: 8080
          env:
            - name: ATS_ENVIRONMENT
              value: "dev"
            - name: METRICS_PORT
              value: "8080"
            - name: SCRAPE_INTERVAL
              value: "30"
            - name: PYTHONPATH
              value: "/app/src"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ats-data-quality-exporter
  namespace: ats-dev
  labels:
    app: ats-data-quality-exporter
spec:
  selector:
    app: ats-data-quality-exporter
  ports:
    - port: 8080
      targetPort: 8080
      name: metrics

