apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alerts@ats-platform.com'

    route:
      group_by: ['alertname', 'component', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'
      routes:
      - match:
          severity: critical
        receiver: 'critical-slack-alerts'
        group_wait: 5s
        repeat_interval: 1h
      - match:
          severity: warning
        receiver: 'warning-slack-alerts'
        group_wait: 30s
        repeat_interval: 2h
      - match:
          component: ats-services
        receiver: 'ats-service-alerts'
        group_wait: 10s
        repeat_interval: 30m
      - match:
          component: database
        receiver: 'database-alerts'
      - match:
          component: kubernetes
        receiver: 'infrastructure-alerts'
      - match:
          component: market_data
        receiver: 'data-pipeline-alerts'

    receivers:
    - name: 'default-receiver'
      webhook_configs:
      - url: 'http://webhook-service:8080/alerts'
        send_resolved: true

    # Slack notification receivers
    - name: 'critical-slack-alerts'
      webhook_configs:
      - url: 'http://slack-webhook-proxy:8080/critical'
        send_resolved: true
        title: '🚨 CRITICAL ATS Alert'
        text: |
          **CRITICAL ALERT**
          {{ range .Alerts }}
          Service: {{ .Labels.service | default "Unknown" }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
          {{ end }}

    - name: 'warning-slack-alerts'  
      webhook_configs:
      - url: 'http://slack-webhook-proxy:8080/warning'
        send_resolved: true
        title: '⚠️ ATS Warning Alert'
        text: |
          {{ range .Alerts }}
          Service: {{ .Labels.service | default "Unknown" }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
          {{ end }}

    - name: 'ats-service-alerts'
      webhook_configs:
      - url: 'http://slack-webhook-proxy:8080/services'
        send_resolved: true
        title: '🔧 ATS Service Alert'
        text: |
          {{ range .Alerts }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Alert: {{ .Annotations.summary }}
          Current Value: {{ .Annotations.current_value | default "N/A" }}
          Threshold: {{ .Annotations.threshold | default "N/A" }}
          {{ end }}

    - name: 'database-alerts'
      webhook_configs:
      - url: 'http://webhook-service:8080/database'
        send_resolved: true

    - name: 'infrastructure-alerts'
      webhook_configs:
      - url: 'http://webhook-service:8080/infrastructure'
        send_resolved: true

    - name: 'data-pipeline-alerts'
      webhook_configs:
      - url: 'http://webhook-service:8080/data-pipeline'
        send_resolved: true

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'service', 'instance']