apiVersion: v1
kind: Secret
metadata:
  name: slack-webhook
  namespace: monitoring
type: Opaque
stringData:
  url: "REPLACE_WITH_ACTUAL_SLACK_WEBHOOK_URL"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alerts@ats-platform.com'
      slack_api_url_file: '/etc/alertmanager/slack-webhook/url'

    templates:
    - '/etc/alertmanager/templates/*.tmpl'

    route:
      group_by: ['alertname', 'severity', 'component']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'
      routes:
      - match:
          severity: critical
        receiver: 'critical-slack-alerts'
        group_wait: 5s
        repeat_interval: 1h
      - match:
          severity: warning
        receiver: 'warning-slack-alerts'
        group_wait: 30s
        repeat_interval: 2h
      - match:
          component: ats-services
        receiver: 'ats-service-alerts'
        group_wait: 10s
        repeat_interval: 30m
      - match:
          alertname: DeploymentFailed
        receiver: 'deployment-alerts'
        group_wait: 0s
        repeat_interval: 15m

    receivers:
    - name: 'default-receiver'
      slack_configs:
      - api_url_file: '/etc/alertmanager/slack-webhook/url'
        channel: '#ats-alerts'
        username: 'ATS-AlertManager'
        icon_emoji: ':warning:'
        title: 'ATS Platform Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Component:* {{ .Labels.component }}
          {{ end }}

    - name: 'critical-slack-alerts'
      slack_configs:
      - api_url_file: '/etc/alertmanager/slack-webhook/url'
        channel: '#ats-critical'
        username: 'ATS-CRITICAL'
        icon_emoji: ':rotating_light:'
        color: 'danger'
        title: '🚨 CRITICAL ATS Alert'
        text: |
          <!channel> **CRITICAL ALERT**
          {{ range .Alerts }}
          *Service:* {{ .Labels.service | default "Unknown" }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
          *Runbook:* {{ .Annotations.runbook_url | default "N/A" }}
          {{ end }}

    - name: 'warning-slack-alerts'  
      slack_configs:
      - api_url_file: '/etc/alertmanager/slack-webhook/url'
        channel: '#ats-warnings'
        username: 'ATS-Warning'
        icon_emoji: ':warning:'
        color: 'warning'
        title: '⚠️ ATS Warning Alert'
        text: |
          {{ range .Alerts }}
          *Service:* {{ .Labels.service | default "Unknown" }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
          {{ end }}

    - name: 'ats-service-alerts'
      slack_configs:
      - api_url_file: '/etc/alertmanager/slack-webhook/url'
        channel: '#ats-services'
        username: 'ATS-Services'
        icon_emoji: ':gear:'
        color: 'warning'
        title: '🔧 ATS Service Alert'
        text: |
          {{ range .Alerts }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          *Alert:* {{ .Annotations.summary }}
          *Current Value:* {{ .Annotations.current_value | default "N/A" }}
          *Threshold:* {{ .Annotations.threshold | default "N/A" }}
          {{ end }}

    - name: 'deployment-alerts'
      slack_configs:
      - api_url_file: '/etc/alertmanager/slack-webhook/url'
        channel: '#ats-deployments'
        username: 'ATS-Deployment'
        icon_emoji: ':rocket:'
        color: 'danger'
        title: '🚀 ATS Deployment Alert'
        text: |
          {{ range .Alerts }}
          *Deployment:* {{ .Labels.deployment | default "Unknown" }}
          *Namespace:* {{ .Labels.namespace }}
          *Status:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          *Action Required:* Check deployment status and logs
          {{ end }}

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'service', 'instance']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: slack-notification-templates
  namespace: monitoring
data:
  slack.tmpl: |
    {{ define "slack.default.title" }}
    {{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }} - {{ .GroupLabels.alertname }}
    {{ end }}

    {{ define "slack.default.text" }}
    {{ range .Alerts }}
    {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} *{{ .Annotations.summary }}*
    {{ if .Annotations.description }}
    {{ .Annotations.description }}
    {{ end }}
    *Labels:*
    {{ range .Labels.SortedPairs }}• {{ .Name }}: `{{ .Value }}`
    {{ end }}
    {{ if .Annotations.runbook_url }}*Runbook:* <{{ .Annotations.runbook_url }}|View Runbook>{{ end }}
    {{ end }}
    {{ end }}

    {{ define "slack.critical.text" }}
    <!channel> **CRITICAL ALERT**
    {{ range .Alerts }}
    🚨 *{{ .Annotations.summary }}*
    {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
    
    *Service Impact:* HIGH
    *Response Required:* IMMEDIATE
    *Time:* {{ .StartsAt.Format "15:04:05 UTC" }}
    {{ end }}
    {{ end }}