apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: ats-dev
data:
  ats-data-quality-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "ATS Data Quality Dashboard - DEV",
        "tags": ["ats", "data-quality", "dev"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Instrument Counts by Vendor",
            "type": "stat",
            "targets": [
              {
                "expr": "ats_instruments_count{environment=\"dev\"}",
                "legendFormat": "{{vendor}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "displayMode": "list",
                  "orientation": "horizontal"
                },
                "mappings": [],
                "thresholds": {
                  "steps": [
                    {
                      "color": "red",
                      "value": 0
                    },
                    {
                      "color": "yellow",
                      "value": 1000
                    },
                    {
                      "color": "green",
                      "value": 5000
                    }
                  ]
                }
              }
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 0
            }
          },
          {
            "id": 2,
            "title": "Daily Price Counts by Vendor",
            "type": "stat",
            "targets": [
              {
                "expr": "ats_daily_prices_count{environment=\"dev\"}",
                "legendFormat": "{{vendor}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "displayMode": "list",
                  "orientation": "horizontal"
                },
                "mappings": [],
                "thresholds": {
                  "steps": [
                    {
                      "color": "red",
                      "value": 0
                    },
                    {
                      "color": "yellow",
                      "value": 10000
                    },
                    {
                      "color": "green",
                      "value": 50000
                    }
                  ]
                }
              }
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 0
            }
          },
          {
            "id": 3,
            "title": "Data Quality Scores",
            "type": "gauge",
            "targets": [
              {
                "expr": "ats_data_quality_score{environment=\"dev\"}",
                "legendFormat": "{{vendor}} - {{metric}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [],
                "thresholds": {
                  "steps": [
                    {
                      "color": "red",
                      "value": 0
                    },
                    {
                      "color": "yellow",
                      "value": 0.7
                    },
                    {
                      "color": "green",
                      "value": 0.9
                    }
                  ]
                },
                "unit": "percentunit",
                "min": 0,
                "max": 1
              }
            },
            "gridPos": {
              "h": 8,
              "w": 24,
              "x": 0,
              "y": 8
            }
          },
          {
            "id": 4,
            "title": "Instrument Count Trend (24h)",
            "type": "timeseries",
            "targets": [
              {
                "expr": "ats_instruments_count{environment=\"dev\"}",
                "legendFormat": "{{vendor}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "drawStyle": "line",
                  "lineInterpolation": "linear",
                  "lineWidth": 1,
                  "fillOpacity": 10,
                  "gradientMode": "none",
                  "spanNulls": false,
                  "insertNulls": false,
                  "showPoints": "never",
                  "pointSize": 5
                }
              }
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 16
            }
          },
          {
            "id": 5,
            "title": "Daily Price Data Freshness",
            "type": "stat",
            "targets": [
              {
                "expr": "(time() - ats_daily_prices_last_update{environment=\"dev\"}) / 3600",
                "legendFormat": "{{vendor}} (hours ago)"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "mappings": [],
                "thresholds": {
                  "steps": [
                    {
                      "color": "green",
                      "value": 0
                    },
                    {
                      "color": "yellow",
                      "value": 24
                    },
                    {
                      "color": "red",
                      "value": 48
                    }
                  ]
                },
                "unit": "h"
              }
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 16
            }
          }
        ],
        "time": {
          "from": "now-24h",
          "to": "now"
        },
        "timepicker": {},
        "templating": {
          "list": []
        },
        "annotations": {
          "list": []
        },
        "refresh": "30s",
        "schemaVersion": 30,
        "version": 1,
        "links": []
      }
    }

---
