apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ats-dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "alert_rules.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'ats-data-quality-exporter'
        static_configs:
          - targets: ['ats-data-quality-exporter:8080']
        scrape_interval: 30s
        metrics_path: /metrics

      - job_name: 'postgres-exporter'
        static_configs:
          - targets: ['postgres-exporter:9187']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']

  alert_rules.yml: |
    groups:
      - name: ats-data-quality
        rules:
          - alert: InstrumentCountLow
            expr: ats_instruments_count < 1000
            for: 5m
            labels:
              severity: warning
              service: data-quality
            annotations:
              summary: "Low instrument count detected"
              description: "Instrument count for {{ $labels.vendor }} is {{ $value }}, below threshold of 1000"

          - alert: DailyPricesStale
            expr: (time() - ats_daily_prices_last_update) > 86400
            for: 10m
            labels:
              severity: critical
              service: data-quality
            annotations:
              summary: "Daily prices data is stale"
              description: "Daily prices for {{ $labels.vendor }} haven't been updated in {{ $value }} seconds"

          - alert: InstrumentCountDrop
            expr: (ats_instruments_count - ats_instruments_count offset 1h) / ats_instruments_count offset 1h < -0.05
            for: 5m
            labels:
              severity: critical
              service: data-quality
            annotations:
              summary: "Significant drop in instrument count"
              description: "Instrument count for {{ $labels.vendor }} dropped by {{ $value | humanizePercentage }}"

          - alert: DatabaseConnectionDown
            expr: up{job="postgres-exporter"} == 0
            for: 1m
            labels:
              severity: critical
              service: database
            annotations:
              summary: "Database connection down"
              description: "PostgreSQL database is not accessible"

      - name: ats-system-health
        rules:
          - alert: HighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
            for: 5m
            labels:
              severity: warning
              service: system
            annotations:
              summary: "High memory usage"
              description: "Memory usage is above 85%"

          - alert: HighDiskUsage
            expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) > 0.85
            for: 5m
            labels:
              severity: warning
              service: system
            annotations:
              summary: "High disk usage"
              description: "Disk usage is above 85% on {{ $labels.mountpoint }}"

