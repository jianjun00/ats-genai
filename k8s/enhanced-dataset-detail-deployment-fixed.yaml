apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-dataset-detail-webapp
  namespace: ats-dev
  labels:
    app: enhanced-dataset-detail-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhanced-dataset-detail-webapp
  template:
    metadata:
      labels:
        app: enhanced-dataset-detail-webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        workingDir: /app
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "📦 Installing dependencies..."
            pip install fastapi uvicorn asyncpg numpy
            echo "🚀 Starting Enhanced Dataset Detail Webapp..."
            cd /config
            mkdir -p training_data_output
            python unified_analytics_fixed.py
        ports:
        - containerPort: 5000
        env:
        - name: PYTHONPATH
          value: "/config"
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        volumeMounts:
        - name: config-volume
          mountPath: /config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config-volume
        configMap:
          name: enhanced-dataset-detail-webapp-config