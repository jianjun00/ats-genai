apiVersion: batch/v1
kind: Job
metadata:
  name: sr-training-data-aapl-tsla
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: sr-training-generator
        image: python:3.12-slim
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: PYTHONPATH
          value: "/app/src"
        workingDir: /app
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🔧 Installing dependencies..."
          pip install --no-cache-dir asyncpg pandas numpy python-dateutil gin-config
          
          echo "📦 Copying source code..."
          # The source code will be mounted or copied
          
          echo "🚀 Generating S/R training data for AAPL and TSLA..."
          python scripts/ml/generate_unbiased_sr_training_data.py \
            --universe-size 2 \
            --sample-year 2020 \
            --training-start 2020-01-01 \
            --training-end 2024-12-31 \
            --output-dir /tmp/sr_training_output \
            --min-examples 50 \
            --validate \
            --debug \
            --env dev
          
          echo "📊 Training data generation completed!"
          echo "Files generated:"
          ls -la /tmp/sr_training_output/
          
          echo "📈 Data summary:"
          if [ -f "/tmp/sr_training_output/features.csv" ]; then
            echo "Features file exists:"
            head -5 /tmp/sr_training_output/features.csv
            echo "..."
            wc -l /tmp/sr_training_output/features.csv
          fi
          
          if [ -f "/tmp/sr_training_output/data_quality_report.md" ]; then
            echo "Quality report:"
            head -20 /tmp/sr_training_output/data_quality_report.md
          fi
          
        volumeMounts:
        - name: source-code
          mountPath: /app
          readOnly: true
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: source-code
        configMap:
          name: source-code-sr-training
      restartPolicy: Never
  backoffLimit: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: source-code-sr-training
  namespace: ats-dev
data:
  # Note: In a real deployment, you would populate this with the actual source code
  # For now, we'll need to populate it with the required source files
  placeholder: "Source code would be here"