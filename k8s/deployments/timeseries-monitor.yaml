apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeseries-monitor
  namespace: ats-dev
  labels:
    app: timeseries-monitor
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timeseries-monitor
      component: monitoring
  template:
    metadata:
      labels:
        app: timeseries-monitor
        component: monitoring
    spec:
      containers:
      - name: monitor
        image: python:3.11-slim
        command: ["/bin/sh"]
        args:
        - -c
        - |
          pip install --no-cache-dir asyncio aiofiles psutil prometheus_client &&
          python -u /app/scripts/monitoring/storage_monitor.py
        env:
        - name: STORAGE_BASE_PATH
          value: "/data/monthly/interval"
        - name: MONITORING_INTERVAL
          value: "30"
        - name: ENABLE_PROMETHEUS
          value: "true"
        - name: LOG_LEVEL
          value: "INFO"
        volumeMounts:
        - name: timeseries-data
          mountPath: /data
          readOnly: true
        - name: app-source
          mountPath: /app
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - name: metrics
          containerPort: 8000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 60
      volumes:
      - name: timeseries-data
        persistentVolumeClaim:
          claimName: timeseries-storage-pvc
      - name: app-source
        hostPath:
          path: /home/jianjun/ats-genai-model
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: timeseries-monitor
  namespace: ats-dev
  labels:
    app: timeseries-monitor
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: timeseries-monitor
    component: monitoring
  ports:
  - name: metrics
    port: 8000
    targetPort: 8000
  type: ClusterIP