apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeseries-storage-service
  namespace: ats-dev
  labels:
    app: timeseries-storage
    component: file-service
spec:
  replicas: 2  # Multiple replicas for high availability
  selector:
    matchLabels:
      app: timeseries-storage
      component: file-service
  template:
    metadata:
      labels:
        app: timeseries-storage
        component: file-service
    spec:
      containers:
      - name: storage-service
        image: python:3.11-slim
        command: ["/bin/sh"]
        args:
        - -c
        - |
          pip install asyncio asyncpg aiofiles numpy && 
          python -c "
          import asyncio
          import logging
          from datetime import datetime
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)
          logger.info('✅ Time-series storage service started')
          
          async def health_check():
              while True:
                  logger.info(f'📊 Storage service healthy at {datetime.now()}')
                  await asyncio.sleep(30)
          
          asyncio.run(health_check())
          "
        env:
        - name: STORAGE_BASE_PATH
          valueFrom:
            configMapKeyRef:
              name: timeseries-storage-config
              key: storage_base_path
        - name: COMPRESSION_LEVEL
          valueFrom:
            configMapKeyRef:
              name: timeseries-storage-config
              key: compression_level
        - name: ENABLE_METRICS
          valueFrom:
            configMapKeyRef:
              name: timeseries-storage-config
              key: enable_metrics
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials-dev
              key: password
        - name: DB_NAME
          value: "dev_db"
        volumeMounts:
        - name: timeseries-data
          mountPath: /data
        - name: app-source
          mountPath: /app
          readOnly: true
        workingDirectory: /app
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "test -d /data/monthly"]
          initialDelaySeconds: 10
          periodSeconds: 30
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "ps aux | grep python"]
          initialDelaySeconds: 30
          periodSeconds: 60
      volumes:
      - name: timeseries-data
        persistentVolumeClaim:
          claimName: timeseries-storage-pvc
      - name: app-source
        configMap:
          name: app-source-config
          defaultMode: 0755
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: timeseries-storage-service
  namespace: ats-dev
  labels:
    app: timeseries-storage
spec:
  selector:
    app: timeseries-storage
    component: file-service
  ports:
  - name: api
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090
  type: ClusterIP