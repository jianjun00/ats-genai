---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrated-analytics
  namespace: ats-dev
  labels:
    app: integrated-analytics
    component: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integrated-analytics
  template:
    metadata:
      labels:
        app: integrated-analytics
        component: webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        ports:
        - containerPort: 5000
          name: http
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Installing dependencies..."
          pip install --no-cache-dir \
            fastapi==0.104.1 \
            uvicorn[standard]==0.24.0 \
            asyncpg==0.29.0 \
            pydantic==2.5.0 \
            requests==2.31.0
          
          echo "📂 Setting up application..."
          cp /config/app.py /app.py
          
          echo "📊 Starting Integrated Analytics WebApp..."
          python /app.py
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: webapp-config
          mountPath: /config
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: webapp-config
        configMap:
          name: integrated-analytics-config

---
apiVersion: v1
kind: Service
metadata:
  name: integrated-analytics-service
  namespace: ats-dev
  labels:
    app: integrated-analytics
spec:
  type: NodePort
  selector:
    app: integrated-analytics
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30100