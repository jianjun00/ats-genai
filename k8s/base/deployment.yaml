apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-api
  labels:
    app: ats-api
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ats-api
  template:
    metadata:
      labels:
        app: ats-api
        component: api
    spec:
      containers:
      - name: ats-api
        image: ats-genai:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PYTHONPATH
          value: "src"
        - name: ENVIRONMENT
          value: "dev"  # Will be overridden per environment
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ats-secrets
              key: database-url
        - name: TIINGO_API_KEY
          valueFrom:
            secretKeyRef:
              name: ats-secrets
              key: tiingo-api-key
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: ats-secrets
              key: polygon-api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
