apiVersion: batch/v1
kind: Job
metadata:
  name: fixed-test-market-cap-accuracy
  namespace: ats-dev
  labels:
    app: ats-genai
    component: market-cap-testing
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: accuracy-test
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Installing dependencies..."
          pip install --no-cache-dir asyncpg aiohttp
          
          echo "Running market cap accuracy investigation..."
          cat > /tmp/test_accuracy_fixed.py << 'EOF'
          import asyncio
          import asyncpg
          import aiohttp
          import os
          from datetime import date, timedelta
          
          async def investigate_price_accuracy():
              """Investigate why our prices are wrong compared to market cap"""
              
              pool = await asyncpg.create_pool(
                  host="postgres-simple",
                  port=5432,
                  user="postgres",
                  password="dev_password",
                  database="dev_db",
                  min_size=1,
                  max_size=3
              )
              
              polygon_api_key = os.environ.get("POLYGON_API_KEY")
              assert polygon_api_key, "POLYGON_API_KEY required for this test"
              
              try:
                  async with pool.acquire() as conn:
                      print("\n=== PRICE DATA INVESTIGATION ===")
                      
                      # Test AAPL specifically
                      aapl_data = await conn.fetchrow("""
                          SELECT 
                              mc.market_cap/1000000000 as our_market_cap_billions,
                              mc.shares_outstanding,
                              p.close as our_price,
                              p.date
                          FROM dev_daily_market_cap mc
                          JOIN dev_instruments i ON mc.instrument_id = i.id
                          JOIN dev_daily_prices_polygon p ON mc.instrument_id = p.instrument_id AND mc.date = p.date
                          WHERE i.symbol = 'AAPL'
                            AND mc.date = (SELECT MAX(date) FROM dev_daily_market_cap WHERE instrument_id = mc.instrument_id)
                      """)
                      
                      print(f"AAPL Our Data:")
                      print(f"  Market Cap: ${float(aapl_data['our_market_cap_billions']):.1f}B") 
                      print(f"  Shares: {aapl_data['shares_outstanding']:,}")
                      print(f"  Price: ${float(aapl_data['our_price']):.2f}")
                      print(f"  Date: {aapl_data['date']}")
                      
                      # Get fresh Polygon data for AAPL
                      url = "https://api.polygon.io/v3/reference/tickers/AAPL"
                      params = {"apikey": polygon_api_key}
                      
                      async with aiohttp.ClientSession() as session:
                          async with session.get(url, params=params) as response:
                              assert response.status == 200
                              data = await response.json()
                              results = data.get('results', {})
                              
                              api_market_cap = results.get('market_cap', 0) / 1000000000
                              api_shares = results.get('share_class_shares_outstanding', 0)
                              
                              print(f"\nAAPL Polygon API Data:")
                              print(f"  Market Cap: ${api_market_cap:.1f}B")
                              print(f"  Shares: {api_shares:,}")
                              
                              # Calculate what the price should be
                              correct_price = api_market_cap * 1000000000 / api_shares
                              our_price_float = float(aapl_data['our_price'])
                              
                              print(f"  Implied Price: ${correct_price:.2f}")
                              
                              print(f"\nPrice Comparison:")
                              print(f"  Our price: ${our_price_float:.2f}")
                              print(f"  Should be: ${correct_price:.2f}")
                              print(f"  Ratio: {our_price_float/correct_price:.3f} (our price / correct price)")
                              
                              # The issue might be stock splits or adjustment factors
                              split_ratio = correct_price / our_price_float
                              print(f"  Adjustment needed: {split_ratio:.3f}x")
                              
                              # Test if this could be a common split ratio
                              if abs(split_ratio - 4.0) < 0.1:
                                  print("  🔍 PATTERN: Looks like missing 4:1 stock split adjustment!")
                              elif abs(split_ratio - 2.0) < 0.1:
                                  print("  🔍 PATTERN: Looks like missing 2:1 stock split adjustment!")
                              elif abs(split_ratio - 3.0) < 0.1:
                                  print("  🔍 PATTERN: Looks like missing 3:1 stock split adjustment!")
                              else:
                                  print(f"  🔍 PATTERN: Unusual adjustment factor of {split_ratio:.2f}x")
                      
                      # Also test getting daily price directly from Polygon
                      print(f"\n=== DIRECT POLYGON PRICE CHECK ===")
                      daily_url = f"https://api.polygon.io/v1/open-close/AAPL/{aapl_data['date']}"
                      daily_params = {"apikey": polygon_api_key, "adjusted": "true"}
                      
                      async with aiohttp.ClientSession() as session:
                          async with session.get(daily_url, params=daily_params) as response:
                              if response.status == 200:
                                  daily_data = await response.json()
                                  polygon_close = daily_data.get('close', 0)
                                  
                                  print(f"  Polygon daily close (adjusted=true): ${polygon_close:.2f}")
                                  print(f"  Our stored close: ${our_price_float:.2f}")
                                  print(f"  Match: {'✅' if abs(polygon_close - our_price_float) < 0.01 else '❌'}")
                                  
                                  if abs(polygon_close - our_price_float) > 0.01:
                                      print(f"  🚨 MISMATCH: Our price differs from Polygon's adjusted price!")
                                      print(f"  🚨 This suggests our price ingestion has an issue")
                                  else:
                                      print(f"  ✅ Our price matches Polygon's adjusted price")
                                      print(f"  🤔 But Polygon's adjusted price doesn't match their market cap...")
                              else:
                                  print(f"  ❌ Failed to get daily price: HTTP {response.status}")
                                  
                      await asyncio.sleep(0.3)
                      
                      # Check a few more stocks for the same pattern
                      print(f"\n=== CHECKING PATTERN ACROSS STOCKS ===")
                      
                      major_stocks = ['MSFT', 'GOOGL']
                      for symbol in major_stocks:
                          stock_data = await conn.fetchrow("""
                              SELECT 
                                  mc.market_cap/1000000000 as our_market_cap_billions,
                                  p.close as our_price
                              FROM dev_daily_market_cap mc
                              JOIN dev_instruments i ON mc.instrument_id = i.id
                              JOIN dev_daily_prices_polygon p ON mc.instrument_id = p.instrument_id AND mc.date = p.date
                              WHERE i.symbol = $1
                                AND mc.date = (SELECT MAX(date) FROM dev_daily_market_cap WHERE instrument_id = mc.instrument_id)
                          """, symbol)
                          
                          if stock_data:
                              url = f"https://api.polygon.io/v3/reference/tickers/{symbol}"
                              async with aiohttp.ClientSession() as session:
                                  async with session.get(url, params=params) as response:
                                      if response.status == 200:
                                          data = await response.json()
                                          results = data.get('results', {})
                                          api_market_cap = results.get('market_cap', 0) / 1000000000
                                          
                                          our_cap = float(stock_data['our_market_cap_billions'])
                                          accuracy = (our_cap / api_market_cap) * 100
                                          ratio = api_market_cap / our_cap
                                          
                                          print(f"  {symbol}: Our=${our_cap:,.0f}B, API=${api_market_cap:,.0f}B")
                                          print(f"         Accuracy={accuracy:.1f}%, Needs {ratio:.2f}x adjustment")
                              
                              await asyncio.sleep(0.3)
                      
                      print(f"\n=== CONCLUSION ===")
                      print("Key findings:")
                      print("1. Polygon provides split-adjusted prices by default ✅")
                      print("2. Our market cap calculations are significantly lower than Polygon's ❌")
                      print("3. Need to investigate if:")
                      print("   - Our price ingestion is getting unadjusted prices somehow")
                      print("   - There's a data lag or stale price issue") 
                      print("   - We're using the wrong Polygon API endpoints")
                      print("   - There's a calculation error in our market cap logic")
                      
              finally:
                  await pool.close()
          
          if __name__ == "__main__":
              asyncio.run(investigate_price_accuracy())
          EOF
          
          python /tmp/test_accuracy_fixed.py
        env:
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: POLYGON_API_KEY
        - name: PYTHONPATH
          value: "/tmp"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"