apiVersion: v1
kind: ConfigMap
metadata:
  name: fixed-dataset-detail-config
  namespace: ats-dev
# Script extracted to /scripts/app.py
# Original ConfigMap data removed for cleanup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixed-dataset-detail-webapp
  namespace: ats-dev
  labels:
    app: fixed-dataset-detail-webapp
    component: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixed-dataset-detail-webapp
  template:
    metadata:
      labels:
        app: fixed-dataset-detail-webapp
        component: webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        ports:
        - containerPort: 5000
          name: http
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Installing dependencies..."
          pip install --no-cache-dir fastapi==0.104.1 uvicorn[standard]==0.24.0 asyncpg==0.29.0 pydantic==2.5.0 pandas numpy
          
          echo "📂 Setting up application..."
          cp /config/app.py /app.py
          
          echo "🔧 Starting FIXED Dataset Detail WebApp..."
          python /app.py
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        volumeMounts:
        - name: webapp-config
          mountPath: /config
        - name: training-data
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: webapp-config
        configMap:
          name: fixed-dataset-detail-config
      - name: training-data
        persistentVolumeClaim:
          claimName: data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: fixed-dataset-detail-service
  namespace: ats-dev
  labels:
    app: fixed-dataset-detail-webapp
spec:
  type: NodePort
  selector:
    app: fixed-dataset-detail-webapp
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30100