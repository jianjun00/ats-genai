apiVersion: v1
kind: ConfigMap
metadata:
  name: enhanced-fmp-backfill-script
  namespace: ats-dev
# Script extracted to /scripts/enhanced_fmp_backfill_with_retry.py
# Original ConfigMap data removed for cleanup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enhanced-fmp-backfill
  namespace: ats-dev
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  template:
    metadata:
      labels:
        app: enhanced-fmp-backfill
    spec:
      restartPolicy: Never
      containers:
      - name: fmp-backfill
        image: python:3.12-slim
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_HOST
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: FMP_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: FMP_API_KEY
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/enhanced_fmp_backfill_job_1.py"