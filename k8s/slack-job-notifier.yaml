apiVersion: v1
kind: ConfigMap
metadata:
  name: slack-job-notifier-script
  namespace: ats-dev
# Script extracted to /scripts/slack_notifier.py
# Original ConfigMap data removed for cleanup---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-job-notifier
  namespace: ats-dev
  labels:
    app: slack-job-notifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slack-job-notifier
  template:
    metadata:
      labels:
        app: slack-job-notifier
    spec:
      serviceAccountName: slack-job-notifier
      containers:
      - name: notifier
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - "-c"
        - "/scripts/slack_job_notifier_1.py"---
# Service Account for accessing Kubernetes API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slack-job-notifier
  namespace: ats-dev
---
# ClusterRole for reading jobs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slack-job-notifier
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slack-job-notifier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slack-job-notifier
subjects:
- kind: ServiceAccount
  name: slack-job-notifier
  namespace: ats-dev