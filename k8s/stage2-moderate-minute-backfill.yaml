apiVersion: v1
kind: ConfigMap
metadata:
  name: stage2-moderate-minute-backfill-script
  namespace: ats-dev
# Script extracted to /scripts/slack_alerter.py
# Original ConfigMap data removed for cleanup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stage2-moderate-minute-backfill-job
  namespace: ats-dev
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: stage2-moderate-container
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            
            echo "=== STAGE 2 MODERATE SCALE MINUTE DATA BACKFILL ==="
            echo "🚀 Scaling up with 500 instruments and 1 week of data!"
            
            pip install psutil asyncpg aiohttp
            
            cp /scripts/slack_alerter.py .
            cp /scripts/stage2_backfill_script.py .
            
            python3 stage2_backfill_script.py
        env:
        - name: SLACK_WEBHOOK_URL
          value: "https://hooks.slack.com/services/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"
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-credentials-dev
              key: POLYGON_API_KEY
        - name: DB_HOST
          value: "postgres-simple.ats-dev.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: stage2-moderate-minute-backfill-script
          defaultMode: 0755