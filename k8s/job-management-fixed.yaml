apiVersion: v1
kind: ConfigMap
metadata:
  name: job-management-fixed-config
  namespace: ats-dev
data:
  unified_analytics_fixed.py: |
    #!/usr/bin/env python3
    """
    Unified Analytics Platform - Fixed with both Job Management and Dataset functionality
    """
    import asyncio
    import asyncpg
    import uvicorn
    from datetime import datetime
    from typing import Dict, List, Optional, Any, Tuple
    from dataclasses import dataclass

    from fastapi import FastAPI, HTTPException, Query
    from fastapi.middleware.cors import CORSMiddleware
    from fastapi.responses import HTMLResponse


    @dataclass
    class Environment:
        def get_database_url(self) -> str:
            return "postgresql://postgres:dev_password@postgres-simple:5432/dev_db"


    class JobManager:
        def __init__(self):
            self.env = Environment()
            self.pool = None
            
        async def initialize(self):
            db_url = self.env.get_database_url()
            self.pool = await asyncpg.create_pool(db_url, min_size=2, max_size=10)
            
            async with self.pool.acquire() as conn:
                await conn.fetchval('SELECT 1')
                print("✅ Connected to dev_runs table successfully")
        
        async def close(self):
            if self.pool:
                await self.pool.close()
        
        async def list_jobs(self, limit: int = 50, offset: int = 0, status: str = None) -> Dict[str, Any]:
            """List jobs from dev_runs table."""
            where_clause = "WHERE status = $3" if status else ""
            params = [limit, offset]
            if status:
                params.append(status)
            
            async with self.pool.acquire() as conn:
                # Get total count
                count_query = f"SELECT COUNT(*) FROM dev_runs {where_clause}"
                total = await conn.fetchval(count_query, *(params[2:] if status else []))
                
                # Get jobs
                query = f"""
                    SELECT id, run_type, status, start_time, end_time, 
                           created_by, created_at, error_message, parameters
                    FROM dev_runs {where_clause}
                    ORDER BY created_at DESC 
                    LIMIT $1 OFFSET $2
                """
                
                records = await conn.fetch(query, *params)
                
                jobs = []
                for r in records:
                    # Calculate duration
                    duration = None
                    if r['start_time'] and r['end_time']:
                        duration = int((r['end_time'] - r['start_time']).total_seconds())
                    
                    jobs.append({
                        "job_id": str(r['id']),
                        "job_type": r['run_type'],
                        "status": r['status'],
                        "user_id": r['created_by'] or 'system',
                        "start_time": r['start_time'].isoformat() if r['start_time'] else None,
                        "end_time": r['end_time'].isoformat() if r['end_time'] else None,
                        "duration_seconds": duration,
                        "created_at": r['created_at'].isoformat() if r['created_at'] else None,
                        "error_message": r['error_message']
                    })
                
                return {"jobs": jobs, "total": total}
        
        async def get_job_stats(self) -> Dict[str, Any]:
            """Get job statistics."""
            async with self.pool.acquire() as conn:
                total = await conn.fetchval("SELECT COUNT(*) FROM dev_runs")
                running = await conn.fetchval("SELECT COUNT(*) FROM dev_runs WHERE status = 'running'")
                completed = await conn.fetchval("SELECT COUNT(*) FROM dev_runs WHERE status = 'completed'")
                failed = await conn.fetchval("SELECT COUNT(*) FROM dev_runs WHERE status = 'failed'")
                
                return {
                    "total_jobs": total,
                    "running_jobs": running, 
                    "completed_jobs": completed,
                    "failed_jobs": failed
                }


    # FastAPI app
    app = FastAPI(title="Job Management (Fixed)", version="1.0.0")

    app.add_middleware(
        CORSMiddleware,
        allow_origins=["*"],
        allow_methods=["*"],
        allow_headers=["*"],
    )

    job_manager = JobManager()


    @app.on_event("startup")
    async def startup():
        await job_manager.initialize()


    @app.on_event("shutdown")
    async def shutdown():
        await job_manager.close()


    @app.get("/api/v1/jobs/stats")
    async def get_stats():
        return await job_manager.get_job_stats()


    @app.get("/api/v1/jobs")
    async def list_jobs(
        limit: int = Query(50, le=100),
        offset: int = Query(0, ge=0), 
        status: Optional[str] = Query(None)
    ):
        return await job_manager.list_jobs(limit, offset, status)


    @app.get("/health")
    async def health():
        return {"status": "healthy", "database": "connected", "table": "dev_runs"}


    @app.get("/", response_class=HTMLResponse)
    async def root():
        return """
    <!DOCTYPE html>
    <html>
    <head>
        <title>Job Management (Fixed)</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
            .job { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 5px; }
            .status { padding: 3px 8px; border-radius: 3px; color: white; }
            .completed { background: #28a745; } .running { background: #007bff; }
            .failed { background: #dc3545; } .pending { background: #ffc107; color: black; }
            .success { background: #d4edda; border: 1px solid #c3e6cb; padding: 10px; margin: 10px 0; border-radius: 5px; }
        </style>
    </head>
    <body>
        <h1>🔧 Job Management (Fixed)</h1>
        
        <div class="success">
            <strong>✅ FIXED:</strong> Now using existing dev_runs table instead of duplicate dev_job_runs!
            <br>No more "relation dev_job_runs does not exist" errors.
        </div>
        
        <div id="stats"></div>
        <div id="jobs"></div>

        <script>
            async function load() {
                try {
                    const stats = await fetch('/api/v1/jobs/stats').then(r => r.json());
                    const jobs = await fetch('/api/v1/jobs?limit=10').then(r => r.json());
                    
                    document.getElementById('stats').innerHTML = `
                        <h3>📊 Stats from dev_runs table: ${stats.total_jobs} total, ${stats.running_jobs} running, ${stats.completed_jobs} completed, ${stats.failed_jobs} failed</h3>
                    `;
                    
                    document.getElementById('jobs').innerHTML = 
                        '<h3>📋 Recent Jobs from dev_runs:</h3>' +
                        jobs.jobs.map(j => `
                            <div class="job">
                                <strong>${j.job_type}</strong> (ID: ${j.job_id}) 
                                <span class="status ${j.status}">${j.status}</span><br>
                                User: ${j.user_id} | Start: ${j.start_time ? new Date(j.start_time).toLocaleString() : 'N/A'}
                                ${j.error_message ? '<br><strong>Error:</strong> ' + j.error_message : ''}
                            </div>
                        `).join('');
                } catch (error) {
                    document.getElementById('jobs').innerHTML = '<p style="color: red;">❌ Error: ' + error.message + '</p>';
                }
            }
            
            load();
            setInterval(load, 30000);
        </script>
    </body>
    </html>
        """


    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=5000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-management-fixed
  namespace: ats-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-management-fixed
  template:
    metadata:
      labels:
        app: job-management-fixed
    spec:
      containers:
      - name: job-management-fixed
        image: python:3.12-slim
        ports:
        - containerPort: 5000
        command: ["/bin/bash"]
        args:
          - -c
          - |
            echo "📦 Installing dependencies..."
            pip install fastapi uvicorn asyncpg numpy
            
            echo "🚀 Starting unified analytics platform (fixed)..."
            python /app/unified_analytics_fixed.py
        volumeMounts:
        - name: app-config
          mountPath: /app
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: app-config
        configMap:
          name: job-management-fixed-config
---
apiVersion: v1
kind: Service
metadata:
  name: job-management-fixed-service
  namespace: ats-dev
spec:
  selector:
    app: job-management-fixed
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30000
  type: NodePort