apiVersion: batch/v1
kind: Job
metadata:
  name: check-market-cap-coverage
  namespace: ats-dev
  labels:
    app: ats-genai
    component: market-cap-analysis
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: market-cap-checker
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🔍 Analyzing current market cap coverage..."
          pip install --no-cache-dir asyncpg
          
          mkdir -p /app
          cd /app
          
          # Create market cap coverage analysis script
          cat > /app/analyze_market_cap_coverage.py << 'EOF'
          import asyncio
          import asyncpg
          import os
          from datetime import date, timedelta
          
          class SimpleEnvironment:
              def get_table_name(self, base_name):
                  return f"dev_{base_name}"
              
              def get_database_url(self):
                  host = os.environ.get('DB_HOST', 'postgres-simple')
                  port = os.environ.get('DB_PORT', '5432')
                  user = os.environ.get('DB_USER', 'postgres')
                  password = os.environ.get('DB_PASSWORD', 'dev_password')
                  database = os.environ.get('DB_NAME', 'dev_db')
                  return f"postgresql://{user}:{password}@{host}:{port}/{database}"
          
          async def analyze_market_cap_coverage():
              """Analyze current market cap coverage across all instruments"""
              
              env = SimpleEnvironment()
              db_url = env.get_database_url()
              
              pool = await asyncpg.create_pool(db_url, min_size=2, max_size=5)
              
              try:
                  async with pool.acquire() as conn:
                      print("📊 MARKET CAP COVERAGE ANALYSIS")
                      print("=" * 60)
                      
                      # 1. Total instruments
                      total_instruments = await conn.fetchval("""
                          SELECT COUNT(*) FROM dev_instruments
                      """)
                      print(f"🎯 Total instruments in database: {total_instruments:,}")
                      
                      # 2. Instruments with market cap data
                      instruments_with_market_cap = await conn.fetchval("""
                          SELECT COUNT(DISTINCT instrument_id) FROM dev_daily_market_cap
                      """)
                      print(f"💰 Instruments with market cap data: {instruments_with_market_cap:,}")
                      
                      # 3. Coverage percentage
                      coverage_pct = (instruments_with_market_cap / total_instruments) * 100
                      print(f"📈 Market cap coverage: {coverage_pct:.1f}%")
                      
                      # 4. Recent market cap entries
                      recent_date = date.today() - timedelta(days=7)
                      recent_market_cap_count = await conn.fetchval("""
                          SELECT COUNT(*) FROM dev_daily_market_cap
                          WHERE date >= $1
                      """, recent_date)
                      print(f"🔄 Recent market cap entries (last 7 days): {recent_market_cap_count:,}")
                      
                      # 5. Sample of missing instruments
                      missing_instruments = await conn.fetch("""
                          SELECT i.symbol, i.id
                          FROM dev_instruments i
                          LEFT JOIN dev_daily_market_cap mc ON i.id = mc.instrument_id
                          WHERE mc.instrument_id IS NULL
                          ORDER BY i.symbol
                          LIMIT 20
                      """)
                      
                      if missing_instruments:
                          print(f"\n📋 Sample instruments WITHOUT market cap data:")
                          for row in missing_instruments[:10]:
                              print(f"   • {row['symbol']} (ID: {row['id']})")
                          if len(missing_instruments) > 10:
                              print(f"   ... and {len(missing_instruments) - 10} more shown")
                      
                      # 6. Instruments with shares outstanding data
                      instruments_with_shares = await conn.fetchval("""
                          SELECT COUNT(DISTINCT instrument_id) FROM dev_shares_outstanding_polygon
                      """)
                      print(f"\n📊 Instruments with shares outstanding data: {instruments_with_shares:,}")
                      
                      # 7. Sample of largest market caps
                      largest_market_caps = await conn.fetch("""
                          SELECT i.symbol, mc.market_cap, mc.date
                          FROM dev_daily_market_cap mc
                          JOIN dev_instruments i ON mc.instrument_id = i.id
                          WHERE mc.date >= $1
                          ORDER BY mc.market_cap DESC
                          LIMIT 10
                      """, recent_date)
                      
                      if largest_market_caps:
                          print(f"\n🏆 Top 10 largest market caps (recent):")
                          for row in largest_market_caps:
                              market_cap_b = row['market_cap'] / 1e9
                              print(f"   • {row['symbol']}: ${market_cap_b:.1f}B ({row['date']})")
                      
                      # 8. Gaps analysis
                      print(f"\n📈 GAPS ANALYSIS")
                      print("=" * 60)
                      
                      missing_count = total_instruments - instruments_with_market_cap
                      print(f"❌ Missing market cap data: {missing_count:,} instruments")
                      print(f"✅ Have market cap data: {instruments_with_market_cap:,} instruments")
                      
                      if missing_count > 0:
                          # Get breakdown by symbol type
                          missing_by_length = await conn.fetch("""
                              SELECT LENGTH(i.symbol) as symbol_length, COUNT(*) as count
                              FROM dev_instruments i
                              LEFT JOIN dev_daily_market_cap mc ON i.id = mc.instrument_id
                              WHERE mc.instrument_id IS NULL
                              GROUP BY LENGTH(i.symbol)
                              ORDER BY symbol_length
                          """)
                          
                          print(f"\n📊 Missing instruments by symbol length:")
                          for row in missing_by_length:
                              print(f"   • {row['symbol_length']} chars: {row['count']:,} symbols")
                          
                          # Sample missing symbols
                          sample_missing = await conn.fetch("""
                              SELECT i.symbol
                              FROM dev_instruments i
                              LEFT JOIN dev_daily_market_cap mc ON i.id = mc.instrument_id
                              WHERE mc.instrument_id IS NULL
                              ORDER BY RANDOM()
                              LIMIT 50
                          """)
                          
                          print(f"\n🎲 Random sample of missing symbols:")
                          sample_symbols = [row['symbol'] for row in sample_missing]
                          for i in range(0, min(50, len(sample_symbols)), 10):
                              batch = sample_symbols[i:i+10]
                              print(f"   {', '.join(batch)}")
                      
                      # 9. Recommended action
                      print(f"\n💡 RECOMMENDED ACTION")
                      print("=" * 60)
                      
                      if coverage_pct < 50:
                          print("🚨 LOW COVERAGE: Immediate market cap population needed")
                          print(f"   Target: Populate {missing_count:,} missing instruments")
                          print("   Priority: High - needed for universe creation")
                      elif coverage_pct < 80:
                          print("⚡ MODERATE COVERAGE: Market cap expansion recommended")
                          print(f"   Target: Populate {missing_count:,} remaining instruments")
                          print("   Priority: Medium - improves universe quality")
                      else:
                          print("✅ GOOD COVERAGE: Minor gaps to fill")
                          print(f"   Target: Populate final {missing_count:,} instruments")
                          print("   Priority: Low - optimization")
                      
                      print(f"\n🎯 NEXT STEPS:")
                      print("   1. Create comprehensive market cap population job")
                      print("   2. Use Polygon shares outstanding + current prices")
                      print("   3. Batch process all missing instruments")
                      print("   4. Validate results against external sources")
              
              finally:
                  await pool.close()
          
          if __name__ == "__main__":
              asyncio.run(analyze_market_cap_coverage())
          EOF
          
          echo "🔄 Running market cap coverage analysis..."
          python /app/analyze_market_cap_coverage.py
        env:
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"