apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-scripts
  namespace: ats-dev
data:
  database_migration.py: |
    #!/usr/bin/env python3
    """Simple database-to-file migration for testing"""
    import asyncio
    import asyncpg
    import logging
    import os
    import gzip
    import struct
    from datetime import datetime
    from pathlib import Path

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    async def migrate_data():
        """Migrate data from database to files"""
        
        # Database connection
        db_url = f"postgresql://postgres:{os.getenv('DB_PASSWORD')}@{os.getenv('DB_HOST', 'postgres-simple')}:5432/{os.getenv('DB_NAME', 'dev_db')}"
        storage_path = Path(os.getenv('STORAGE_BASE_PATH', '/data/monthly/interval'))
        
        try:
            pool = await asyncpg.create_pool(db_url, min_size=1, max_size=3)
            logger.info("✅ Connected to database")
            
            # Create storage directories
            storage_path.mkdir(parents=True, exist_ok=True)
            logger.info(f"✅ Created storage directory: {storage_path}")
            
            async with pool.acquire() as conn:
                # Get data to migrate
                rows = await conn.fetch("""
                    SELECT instrument_id, timestamp, open_price, high_price, 
                           low_price, close_price, volume
                    FROM dev_minute_prices_fmp
                    ORDER BY instrument_id, timestamp
                """)
                
                if not rows:
                    logger.warning("⚠️  No data found to migrate")
                    return
                
                logger.info(f"📊 Found {len(rows)} records to migrate")
                
                # Group by instrument and month
                monthly_data = {}
                
                for row in rows:
                    instrument_id = row['instrument_id']
                    timestamp = row['timestamp']
                    year = timestamp.year
                    month = timestamp.month
                    
                    key = (instrument_id, year, month)
                    if key not in monthly_data:
                        monthly_data[key] = []
                    
                    monthly_data[key].append(row)
                
                logger.info(f"📁 Grouped into {len(monthly_data)} monthly files")
                
                # Create files
                total_written = 0
                for (instrument_id, year, month), records in monthly_data.items():
                    
                    # Create directory structure
                    shard = instrument_id % 100
                    file_dir = storage_path / str(year) / f"{month:02d}" / f"{shard:02d}"
                    file_dir.mkdir(parents=True, exist_ok=True)
                    
                    # Create file path
                    filename = f"{instrument_id}_{year}_{month:02d}.record.gz"
                    file_path = file_dir / filename
                    
                    # Write metadata + data
                    with gzip.open(file_path, 'wb') as f:
                        # Metadata (48 bytes)
                        record_count = len(records)
                        first_timestamp = int(records[0]['timestamp'].timestamp())
                        last_timestamp = int(records[-1]['timestamp'].timestamp())
                        
                        metadata = struct.pack('<4I8xII16x', 
                                             instrument_id, year, month, record_count,
                                             first_timestamp, last_timestamp)
                        f.write(metadata)
                        
                        # Records (32 bytes each)
                        for record in records:
                            timestamp_int = int(record['timestamp'].timestamp())
                            record_bytes = struct.pack('<Q4fQ',
                                timestamp_int,
                                float(record['open_price'] or 0),
                                float(record['high_price'] or 0),
                                float(record['low_price'] or 0),
                                float(record['close_price'] or 0),
                                int(record['volume'] or 0)
                            )
                            f.write(record_bytes)
                    
                    total_written += record_count
                    logger.info(f"✅ Created {file_path} with {record_count} records")
                
                logger.info(f"🎉 Migration completed! {total_written} records written to {len(monthly_data)} files")
                
                # Verify some files
                verification_count = 0
                for file_path in storage_path.rglob("*.record.gz"):
                    with gzip.open(file_path, 'rb') as f:
                        metadata = f.read(48)
                        if len(metadata) == 48:
                            instrument_id, year, month, record_count = struct.unpack('<4I8xII16x', metadata)[:4]
                            verification_count += record_count
                            logger.info(f"✅ Verified {file_path}: {record_count} records")
                        
                        if verification_count >= 1000:  # Sample verification
                            break
                
                logger.info(f"📊 Verification: {verification_count} records verified")
            
            await pool.close()
            
        except Exception as e:
            logger.error(f"❌ Migration failed: {e}")
            raise

    if __name__ == "__main__":
        asyncio.run(migrate_data())
---
apiVersion: batch/v1
kind: Job
metadata:
  name: database-to-file-migration-v2
  namespace: ats-dev
  labels:
    app: timeseries-migration
    phase: database-to-file
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: timeseries-migration
        phase: database-to-file
    spec:
      restartPolicy: Never
      containers:
      - name: migration
        image: python:3.11-slim
        command: ["/bin/sh"]
        args:
        - -c
        - |
          echo "🚀 Installing dependencies..."
          pip install --no-cache-dir asyncpg &&
          echo "🔄 Starting database-to-file migration..." &&
          python /scripts/database_migration.py
        env:
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          value: "dev_db"
        - name: DB_USER
          value: "postgres"
        - name: STORAGE_BASE_PATH
          value: "/data/monthly/interval"
        volumeMounts:
        - name: timeseries-data
          mountPath: /data
        - name: script-volume
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
      volumes:
      - name: timeseries-data
        persistentVolumeClaim:
          claimName: timeseries-storage-pvc
      - name: script-volume
        configMap:
          name: migration-scripts
          defaultMode: 0755