apiVersion: v1
kind: ConfigMap
metadata:
  name: validation-scripts
  namespace: ats-dev
data:
  validation.py: |
    #!/usr/bin/env python3
    """Validate the migrated file-based storage"""
    import asyncio
    import asyncpg
    import logging
    import os
    import gzip
    import struct
    from datetime import datetime
    from pathlib import Path

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    async def validate_migration():
        """Validate the migration was successful"""
        
        # Database connection
        db_url = f"postgresql://postgres:{os.getenv('DB_PASSWORD')}@{os.getenv('DB_HOST', 'postgres-simple')}:5432/{os.getenv('DB_NAME', 'dev_db')}"
        storage_path = Path(os.getenv('STORAGE_BASE_PATH', '/data/monthly/interval'))
        
        try:
            pool = await asyncpg.create_pool(db_url, min_size=1, max_size=3)
            logger.info("✅ Connected to database")
            
            # Count database records
            async with pool.acquire() as conn:
                db_count = await conn.fetchval("SELECT COUNT(*) FROM dev_minute_prices_fmp")
                logger.info(f"📊 Database records: {db_count}")
            
            # Count file records
            file_count = 0
            file_list = []
            
            for file_path in storage_path.rglob("*.record.gz"):
                file_list.append(str(file_path))
                try:
                    with gzip.open(file_path, 'rb') as f:
                        metadata = f.read(48)
                        if len(metadata) == 48:
                            instrument_id, year, month, record_count = struct.unpack('<4I8xII16x', metadata)[:4]
                            file_count += record_count
                            logger.info(f"📁 {file_path.name}: {record_count} records (instrument {instrument_id})")
                except Exception as e:
                    logger.error(f"❌ Error reading {file_path}: {e}")
            
            logger.info(f"📊 File records: {file_count}")
            logger.info(f"📁 Total files: {len(file_list)}")
            
            # Validate counts match
            if db_count == file_count:
                logger.info("✅ VALIDATION PASSED: Database and file record counts match!")
            else:
                logger.error(f"❌ VALIDATION FAILED: DB={db_count}, Files={file_count}")
            
            # Test reading a sample file
            if file_list:
                sample_file = Path(file_list[0])
                logger.info(f"🔍 Testing sample file: {sample_file.name}")
                
                with gzip.open(sample_file, 'rb') as f:
                    # Read metadata
                    metadata = f.read(48)
                    instrument_id, year, month, record_count, first_ts, last_ts = struct.unpack('<4I8xII16x', metadata)[:6]
                    
                    logger.info(f"   Instrument: {instrument_id}")
                    logger.info(f"   Period: {year}-{month:02d}")
                    logger.info(f"   Records: {record_count}")
                    logger.info(f"   First: {datetime.fromtimestamp(first_ts)}")
                    logger.info(f"   Last: {datetime.fromtimestamp(last_ts)}")
                    
                    # Read first few records
                    for i in range(min(3, record_count)):
                        record_data = f.read(32)
                        if len(record_data) == 32:
                            ts, o, h, l, c, v = struct.unpack('<Q4fQ', record_data)
                            dt = datetime.fromtimestamp(ts)
                            logger.info(f"   Record {i+1}: {dt} OHLC=({o:.2f},{h:.2f},{l:.2f},{c:.2f}) V={v}")
                
                logger.info("✅ Sample file read successfully!")
            
            # Performance test
            logger.info("⚡ Performance test: Reading all files...")
            start_time = datetime.now()
            total_records_read = 0
            
            for file_path in storage_path.rglob("*.record.gz"):
                with gzip.open(file_path, 'rb') as f:
                    metadata = f.read(48)
                    if len(metadata) == 48:
                        record_count = struct.unpack('<4I8xII16x', metadata)[3]
                        # Skip actual record data for speed test
                        total_records_read += record_count
            
            duration = (datetime.now() - start_time).total_seconds()
            records_per_sec = total_records_read / max(duration, 0.001)
            
            logger.info(f"⚡ Performance: {total_records_read} records in {duration:.2f}s = {records_per_sec:,.0f} records/sec")
            
            await pool.close()
            
            logger.info("🎉 VALIDATION COMPLETED SUCCESSFULLY!")
            
        except Exception as e:
            logger.error(f"❌ Validation failed: {e}")
            raise

    if __name__ == "__main__":
        asyncio.run(validate_migration())
---
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-validation
  namespace: ats-dev
  labels:
    app: storage-validation
    phase: validation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: storage-validation
        phase: validation
    spec:
      restartPolicy: Never
      containers:
      - name: validator
        image: python:3.11-slim
        command: ["/bin/sh"]
        args:
        - -c
        - |
          echo "🚀 Installing dependencies..."
          pip install --no-cache-dir asyncpg &&
          echo "🔍 Starting storage validation..." &&
          python /scripts/validation.py
        env:
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          value: "dev_db"
        - name: DB_USER
          value: "postgres"
        - name: STORAGE_BASE_PATH
          value: "/data/monthly/interval"
        volumeMounts:
        - name: timeseries-data
          mountPath: /data
          readOnly: true
        - name: script-volume
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: timeseries-data
        persistentVolumeClaim:
          claimName: timeseries-storage-pvc
      - name: script-volume
        configMap:
          name: validation-scripts
          defaultMode: 0755