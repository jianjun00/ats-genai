apiVersion: v1
kind: ConfigMap
metadata:
  name: job-runs-migration-script
  namespace: ats-dev
data:
  create_job_runs_table.py: |
    """
    Create dev_job_runs table for job management functionality
    This fixes the "relation dev_job_runs does not exist" error
    """
    import asyncio
    import asyncpg
    import logging

    async def main():
        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)
        
        db_url = "postgresql://postgres:dev_password@postgres-simple:5432/dev_db"
        
        # Wait for database
        max_retries = 10
        for attempt in range(max_retries):
            try:
                conn = await asyncpg.connect(db_url)
                logger.info("✅ Connected to database")
                break
            except Exception as e:
                if attempt < max_retries - 1:
                    await asyncio.sleep(2)
                else:
                    raise Exception(f"Could not connect after {max_retries} attempts: {e}")
        
        try:
            logger.info("🔧 Creating job_runs table and related components...")
            
            # Create enums for job types and statuses
            await conn.execute("""
                DO $$ BEGIN
                    CREATE TYPE job_type_enum AS ENUM (
                        'training_data_gen',
                        'training', 
                        'backtest',
                        'model_evaluation',
                        'data_ingestion',
                        'universe_update'
                    );
                EXCEPTION
                    WHEN duplicate_object THEN null;
                END $$;
            """)
            logger.info("✅ Created job_type_enum")

            await conn.execute("""
                DO $$ BEGIN
                    CREATE TYPE job_status_enum AS ENUM (
                        'pending',
                        'running', 
                        'succeeded',
                        'failed',
                        'cancelled',
                        'timeout'
                    );
                EXCEPTION
                    WHEN duplicate_object THEN null;
                END $$;
            """)
            logger.info("✅ Created job_status_enum")

            # Create the job_runs table (will be prefixed as dev_job_runs)
            await conn.execute("""
                CREATE TABLE IF NOT EXISTS dev_job_runs (
                    job_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                    job_name VARCHAR(255) NOT NULL,
                    job_type job_type_enum NOT NULL,
                    user_id VARCHAR(100) NOT NULL,
                    flyte_execution_id VARCHAR(255) UNIQUE,
                    status job_status_enum NOT NULL DEFAULT 'pending',
                    parameters JSONB NOT NULL DEFAULT '{}',
                    start_time TIMESTAMPTZ,
                    end_time TIMESTAMPTZ,
                    duration_seconds INTEGER,
                    error_message TEXT,
                    resource_usage JSONB DEFAULT '{}',
                    created_at TIMESTAMPTZ DEFAULT NOW(),
                    updated_at TIMESTAMPTZ DEFAULT NOW()
                );
            """)
            logger.info("✅ Created dev_job_runs table")

            # Create indexes for performance
            await conn.execute("CREATE INDEX IF NOT EXISTS idx_job_runs_status ON dev_job_runs(status);")
            await conn.execute("CREATE INDEX IF NOT EXISTS idx_job_runs_type ON dev_job_runs(job_type);")
            await conn.execute("CREATE INDEX IF NOT EXISTS idx_job_runs_user_id ON dev_job_runs(user_id);")
            await conn.execute("CREATE INDEX IF NOT EXISTS idx_job_runs_created_at ON dev_job_runs(created_at DESC);")
            await conn.execute("CREATE INDEX IF NOT EXISTS idx_job_runs_flyte_execution_id ON dev_job_runs(flyte_execution_id) WHERE flyte_execution_id IS NOT NULL;")
            logger.info("✅ Created indexes")

            # Create trigger function for updated_at
            await conn.execute("""
                CREATE OR REPLACE FUNCTION update_job_runs_updated_at()
                RETURNS TRIGGER AS $$
                BEGIN
                    NEW.updated_at = NOW();
                    RETURN NEW;
                END;
                $$ LANGUAGE plpgsql;
            """)

            # Create trigger
            await conn.execute("""
                DROP TRIGGER IF EXISTS trigger_job_runs_updated_at ON dev_job_runs;
                CREATE TRIGGER trigger_job_runs_updated_at
                    BEFORE UPDATE ON dev_job_runs
                    FOR EACH ROW
                    EXECUTE FUNCTION update_job_runs_updated_at();
            """)
            logger.info("✅ Created updated_at trigger")

            # Insert sample data for testing
            await conn.execute("""
                INSERT INTO dev_job_runs (job_name, job_type, user_id, status, parameters, start_time, end_time, duration_seconds) VALUES
                ('Sample Training Data Generation', 'training_data_gen', 'system', 'succeeded', '{"symbols": ["AAPL", "MSFT"], "date_range": "2024-01-01 to 2024-08-21"}', NOW() - INTERVAL '3 hours', NOW() - INTERVAL '1 hour', 7200),
                ('Model Training Job', 'training', 'system', 'succeeded', '{"model_type": "TFT", "dataset": "enhanced_dataset_001"}', NOW() - INTERVAL '2 hours', NOW() - INTERVAL '30 minutes', 5400),
                ('Portfolio Backtest', 'backtest', 'system', 'running', '{"strategy": "mean_reversion", "universe": "sp500_large_cap"}', NOW() - INTERVAL '1 hour', NULL, NULL),
                ('Universe Update Job', 'universe_update', 'scheduler', 'failed', '{"universe": "modeling_universe", "criteria": "market_cap > 400M"}', NOW() - INTERVAL '30 minutes', NOW() - INTERVAL '25 minutes', 300)
                ON CONFLICT (job_id) DO NOTHING;
            """)
            logger.info("✅ Inserted sample job data")

            # Verify the table was created correctly
            table_info = await conn.fetch("""
                SELECT column_name, data_type, is_nullable
                FROM information_schema.columns 
                WHERE table_name = 'dev_job_runs' 
                ORDER BY ordinal_position;
            """)
            
            logger.info("📋 Table schema verification:")
            for column in table_info:
                logger.info(f"  ✓ {column['column_name']}: {column['data_type']} ({'NULL' if column['is_nullable'] == 'YES' else 'NOT NULL'})")

            # Check sample data
            job_count = await conn.fetchval("SELECT COUNT(*) FROM dev_job_runs")
            logger.info(f"📊 Sample data: {job_count} jobs created")

            # Test a sample query that the job management API uses
            sample_jobs = await conn.fetch("""
                SELECT job_id, job_name, job_type, status, created_at 
                FROM dev_job_runs 
                ORDER BY created_at DESC 
                LIMIT 3
            """)
            
            logger.info("🧪 Sample query test:")
            for job in sample_jobs:
                logger.info(f"  ✓ {job['job_name']} ({job['job_type']}) - {job['status']}")

            print("🎉 JOB RUNS TABLE CREATION COMPLETED SUCCESSFULLY!")
            print("✅ dev_job_runs table created with proper schema")
            print("✅ Sample data inserted for testing")
            print("✅ All indexes and triggers created")
            print("🚀 Job management functionality is now ready!")
            
        finally:
            await conn.close()

    if __name__ == "__main__":
        asyncio.run(main())
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-job-runs-table-job
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: create-job-runs-table
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
          - -c
          - |
            echo "📦 Installing dependencies..."
            pip install asyncpg
            
            echo "🔧 Creating job_runs table..."
            python /scripts/create_job_runs_table.py
            
            echo "✅ Job runs table creation completed!"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: job-runs-migration-script
      restartPolicy: Never
  backoffLimit: 3