apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-dev-to-prod
  namespace: ats-dev
spec:
  template:
    spec:
      containers:
      - name: migrator
        image: python:3.11-slim
        command: ["/bin/bash"]
        args:
        - -c
        - |
          # Install required packages
          pip install asyncpg
          
          # Run migration with production configuration
          python3 << 'PYTHON_EOF'
          import asyncio
          import asyncpg
          import sys
          import logging
          from typing import List, Tuple
          
          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
          logger = logging.getLogger(__name__)
          
          # Database configs for dev to prod migration
          DEV_CONFIG = {
              'host': 'postgres.ats-dev.svc.cluster.local',
              'port': 5432,
              'user': 'postgres', 
              'password': 'dev_password',
              'database': 'dev_db'
          }
          
          PROD_CONFIG = {
              'host': 'postgres.ats-prod.svc.cluster.local',
              'port': 5432,
              'user': 'postgres',
              'password': 'prod_password',
              'database': 'prod_db'
          }
          
          async def migrate_table(dev_conn, prod_conn, dev_table):
              prod_table = dev_table.replace('dev_', 'prod_', 1)
              logger.info(f"🔄 Migrating {dev_table} → {prod_table}")
              
              # Get table structure
              columns_query = """
              SELECT column_name, data_type, character_maximum_length, 
                     numeric_precision, numeric_scale, is_nullable, column_default
              FROM information_schema.columns 
              WHERE table_name = $1 AND table_schema = 'public'
              ORDER BY ordinal_position
              """
              columns = await dev_conn.fetch(columns_query, dev_table)
              
              # Build CREATE TABLE with prod_ prefix
              col_defs = []
              for col in columns:
                  col_def = f"{col['column_name']} {col['data_type']}"
                  
                  if col['character_maximum_length']:
                      col_def += f"({col['character_maximum_length']})"
                  elif col['numeric_precision'] and col['data_type'] in ('numeric', 'decimal'):
                      if col['numeric_scale']:
                          col_def += f"({col['numeric_precision']},{col['numeric_scale']})"
                      else:
                          col_def += f"({col['numeric_precision']})"
                  
                  if col['is_nullable'] == 'NO':
                      col_def += " NOT NULL"
                  
                  if col['column_default']:
                      default_val = col['column_default']
                      if 'dev_' in default_val:
                          default_val = default_val.replace('dev_', 'prod_')
                      col_def += f" DEFAULT {default_val}"
                  
                  col_defs.append(col_def)
              
              # Handle foreign key references - update to prod_ tables
              fk_query = """
              SELECT 
                  kcu.column_name,
                  ccu.table_name AS foreign_table_name,
                  ccu.column_name AS foreign_column_name
              FROM information_schema.table_constraints AS tc
              JOIN information_schema.key_column_usage AS kcu
                  ON tc.constraint_name = kcu.constraint_name
              JOIN information_schema.constraint_column_usage AS ccu
                  ON ccu.constraint_name = tc.constraint_name
              WHERE tc.constraint_type = 'FOREIGN KEY'
                  AND tc.table_name = $1
              """
              foreign_keys = await dev_conn.fetch(fk_query, dev_table)
              
              # Drop and create table
              await prod_conn.execute(f"DROP TABLE IF EXISTS {prod_table} CASCADE")
              create_sql = f"CREATE TABLE {prod_table} (\n  " + ",\n  ".join(col_defs) + "\n)"
              await prod_conn.execute(create_sql)
              
              # Add foreign key constraints with prod_ references
              for fk in foreign_keys:
                  ref_table = fk['foreign_table_name']
                  if ref_table.startswith('dev_'):
                      ref_table = ref_table.replace('dev_', 'prod_', 1)
                  
                  fk_sql = f"""
                  ALTER TABLE {prod_table} 
                  ADD CONSTRAINT {prod_table}_{fk['column_name']}_fkey 
                  FOREIGN KEY ({fk['column_name']}) 
                  REFERENCES {ref_table}({fk['foreign_column_name']})
                  """
                  try:
                      await prod_conn.execute(fk_sql)
                  except Exception as e:
                      logger.warning(f"⚠️  Could not add FK constraint: {e}")
              
              logger.info(f"✅ Created table {prod_table}")
              
              # Copy data
              count = await dev_conn.fetchval(f"SELECT COUNT(*) FROM {dev_table}")
              if count > 0:
                  rows = await dev_conn.fetch(f"SELECT * FROM {dev_table}")
                  if rows:
                      column_names = list(rows[0].keys())
                      placeholders = ", ".join(f"${i+1}" for i in range(len(column_names)))
                      insert_sql = f"INSERT INTO {prod_table} ({', '.join(column_names)}) VALUES ({placeholders})"
                      batch_values = [list(row.values()) for row in rows]
                      await prod_conn.executemany(insert_sql, batch_values)
                      logger.info(f"📊 Copied {count} rows")
              
              # Handle sequences
              seq_query = """
              SELECT s.sequence_name, c.column_name
              FROM information_schema.sequences s
              JOIN pg_class seq_class ON seq_class.relname = s.sequence_name
              JOIN pg_depend d ON d.objid = seq_class.oid AND d.deptype = 'a'
              JOIN pg_class table_class ON d.refobjid = table_class.oid
              JOIN pg_attribute a ON a.attrelid = table_class.oid AND a.attnum = d.refobjsubid
              JOIN information_schema.columns c ON c.table_name = table_class.relname AND c.column_name = a.attname
              WHERE table_class.relname = $1
              """
              sequences = await dev_conn.fetch(seq_query, dev_table)
              
              for seq_row in sequences:
                  dev_seq = seq_row['sequence_name']
                  prod_seq = dev_seq.replace('dev_', 'prod_', 1)
                  column = seq_row['column_name']
                  
                  # Get current sequence value
                  current_val = await dev_conn.fetchval(f"SELECT last_value FROM {dev_seq}")
                  
                  # Create prod sequence
                  await prod_conn.execute(f"DROP SEQUENCE IF EXISTS {prod_seq} CASCADE")
                  await prod_conn.execute(f"CREATE SEQUENCE {prod_seq} START WITH {current_val}")
                  await prod_conn.execute(f"ALTER TABLE {prod_table} ALTER COLUMN {column} SET DEFAULT nextval('{prod_seq}')")
                  
                  # Update to max value from copied data
                  max_val = await prod_conn.fetchval(f"SELECT COALESCE(MAX({column}), 0) FROM {prod_table}")
                  if max_val > 0:
                      await prod_conn.execute(f"SELECT setval('{prod_seq}', {max_val})")
                  
                  logger.info(f"🔢 Created sequence {prod_seq} with value {max_val or current_val}")
          
          async def main():
              try:
                  logger.info("🚀 Starting dev_db → prod_db migration...")
                  
                  # Connect to databases
                  logger.info("Connecting to dev database...")
                  dev_conn = await asyncpg.connect(**DEV_CONFIG)
                  logger.info("✅ Connected to dev database")
                  
                  logger.info("Connecting to prod database...")
                  prod_conn = await asyncpg.connect(**PROD_CONFIG)
                  logger.info("✅ Connected to prod database")
                  
                  # Get dev_ tables
                  tables_query = """
                  SELECT tablename FROM pg_tables 
                  WHERE schemaname = 'public' AND tablename LIKE 'dev_%'
                  ORDER BY tablename
                  """
                  dev_tables = await dev_conn.fetch(tables_query)
                  table_names = [row['tablename'] for row in dev_tables]
                  
                  logger.info(f"Found {len(table_names)} dev_ tables: {', '.join(table_names)}")
                  
                  if not table_names:
                      logger.error("❌ No dev_ tables found")
                      return False
                  
                  # Migrate tables in dependency order (users/products first, then orders)
                  priority_tables = ['dev_users', 'dev_products', 'dev_daily_prices', 'dev_training_dataset']
                  ordered_tables = []
                  
                  # Add priority tables first
                  for table in priority_tables:
                      if table in table_names:
                          ordered_tables.append(table)
                  
                  # Add remaining tables
                  for table in table_names:
                      if table not in ordered_tables:
                          ordered_tables.append(table)
                  
                  # Migrate each table
                  success_count = 0
                  for table_name in ordered_tables:
                      try:
                          await migrate_table(dev_conn, prod_conn, table_name)
                          success_count += 1
                      except Exception as e:
                          logger.error(f"❌ Failed to migrate {table_name}: {e}")
                          import traceback
                          traceback.print_exc()
                  
                  # Verify results
                  logger.info("🔍 Verifying migration...")
                  for table_name in table_names:
                      prod_table = table_name.replace('dev_', 'prod_', 1)
                      try:
                          dev_count = await dev_conn.fetchval(f"SELECT COUNT(*) FROM {table_name}")
                          prod_count = await prod_conn.fetchval(f"SELECT COUNT(*) FROM {prod_table}")
                          
                          if dev_count == prod_count:
                              logger.info(f"✅ {table_name} → {prod_table}: {dev_count} rows")
                          else:
                              logger.error(f"❌ {table_name} → {prod_table}: {dev_count} vs {prod_count} rows")
                      except Exception as e:
                          logger.error(f"❌ Verification failed for {table_name}: {e}")
                  
                  await dev_conn.close()
                  await prod_conn.close()
                  
                  logger.info(f"🎉 Migration completed! {success_count}/{len(table_names)} tables successful")
                  return success_count == len(table_names)
                  
              except Exception as e:
                  logger.error(f"💥 Migration failed: {e}")
                  import traceback
                  traceback.print_exc()
                  return False
          
          success = asyncio.run(main())
          sys.exit(0 if success else 1)
          PYTHON_EOF
        workingDir: /tmp
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Never
  backoffLimit: 2