apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-prod
  namespace: ats-prod
spec:
  backoffLimit: 2
  template:
    spec:
      containers:
      - name: migration-prod
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "🚀 Installing dependencies..."
          pip install --no-cache-dir asyncpg
          
          echo "🔄 Running database migration for ATS-PROD..."
          mkdir -p /app
          cat > /app/migrate_prod.py << 'EOF'
          import asyncio
          import asyncpg
          import logging
          from datetime import datetime
          
          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
          logger = logging.getLogger(__name__)
          
          async def run_prod_migration():
              """Run database migration for ATS-PROD environment"""
              try:
                  # Connect to ats-prod database
                  conn = await asyncpg.connect(
                      host='postgres',
                      port=5432,
                      user='postgres',
                      password='prod_password',
                      database='prod_db'
                  )
                  logger.info("✅ Connected to ATS-PROD database")
                  
                  # Check current schema state
                  tables = await conn.fetch("""
                      SELECT tablename, schemaname
                      FROM pg_tables 
                      WHERE schemaname = 'public' 
                      ORDER BY tablename
                  """)
                  
                  logger.info(f"📋 Found {len(tables)} existing tables in prod_db")
                  
                  # Create migration tracking table
                  await conn.execute("""
                      CREATE TABLE IF NOT EXISTS prod_db_version (
                          id SERIAL PRIMARY KEY,
                          version INTEGER NOT NULL UNIQUE,
                          description TEXT NOT NULL,
                          applied_at TIMESTAMPTZ DEFAULT now(),
                          checksum TEXT,
                          migration_file TEXT
                      );
                  """)
                  
                  # Get current migration version
                  current_version = await conn.fetchval("""
                      SELECT COALESCE(MAX(version), -1) FROM prod_db_version
                  """)
                  logger.info(f"📊 Current migration version: {current_version}")
                  
                  # Production-ready schema
                  migration_steps = [
                      {
                          'version': 100,
                          'description': 'Create production environment schema',
                          'sql': """
                              -- Production instruments table
                              CREATE TABLE IF NOT EXISTS prod_instruments (
                                  id SERIAL PRIMARY KEY,
                                  symbol VARCHAR(50) UNIQUE NOT NULL,
                                  name TEXT NOT NULL,
                                  exchange VARCHAR(20),
                                  instrument_type VARCHAR(50),
                                  currency VARCHAR(10) DEFAULT 'USD',
                                  cusip VARCHAR(20),
                                  isin VARCHAR(20),
                                  figi VARCHAR(50),
                                  listing_date DATE,
                                  delisting_date DATE,
                                  is_active BOOLEAN DEFAULT true,
                                  lifecycle_stage VARCHAR(20),
                                  quality_score INTEGER,
                                  data_sources TEXT[],
                                  reconciliation_notes TEXT[],
                                  last_validated_at TIMESTAMP,
                                  eodhd_raw JSONB,
                                  polygon_raw JSONB,
                                  tiingo_raw JSONB,
                                  created_at TIMESTAMP DEFAULT now(),
                                  updated_at TIMESTAMP DEFAULT now()
                              );
                              
                              -- Production daily prices
                              CREATE TABLE IF NOT EXISTS prod_daily_prices (
                                  id SERIAL PRIMARY KEY,
                                  symbol VARCHAR(10) NOT NULL,
                                  price_date DATE NOT NULL,
                                  open_price DECIMAL(12,4),
                                  high_price DECIMAL(12,4),
                                  low_price DECIMAL(12,4),
                                  close_price DECIMAL(12,4),
                                  volume BIGINT,
                                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                                  UNIQUE(symbol, price_date)
                              );
                              
                              -- Production training datasets
                              CREATE TABLE IF NOT EXISTS prod_training_dataset (
                                  id SERIAL PRIMARY KEY,
                                  dataset_name VARCHAR(100) NOT NULL,
                                  symbol VARCHAR(10),
                                  file_size_mb DECIMAL(10,2),
                                  record_count INTEGER,
                                  creation_timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                                  status VARCHAR(20) DEFAULT 'active'
                              );
                              
                              -- Model predictions table
                              CREATE TABLE IF NOT EXISTS prod_model_predictions (
                                  id SERIAL PRIMARY KEY,
                                  symbol VARCHAR(10) NOT NULL,
                                  prediction_date DATE NOT NULL,
                                  model_version VARCHAR(50) NOT NULL,
                                  predicted_price DECIMAL(12,4),
                                  confidence_score DECIMAL(5,4),
                                  actual_price DECIMAL(12,4),
                                  prediction_error DECIMAL(12,4),
                                  created_at TIMESTAMP DEFAULT now(),
                                  updated_at TIMESTAMP DEFAULT now(),
                                  UNIQUE(symbol, prediction_date, model_version)
                              );
                              
                              -- Trading positions table
                              CREATE TABLE IF NOT EXISTS prod_positions (
                                  id SERIAL PRIMARY KEY,
                                  symbol VARCHAR(10) NOT NULL,
                                  position_type VARCHAR(10) NOT NULL CHECK (position_type IN ('long', 'short')),
                                  quantity INTEGER NOT NULL,
                                  entry_price DECIMAL(12,4) NOT NULL,
                                  entry_date DATE NOT NULL,
                                  exit_price DECIMAL(12,4),
                                  exit_date DATE,
                                  realized_pnl DECIMAL(15,4),
                                  status VARCHAR(20) DEFAULT 'open',
                                  created_at TIMESTAMP DEFAULT now(),
                                  updated_at TIMESTAMP DEFAULT now()
                              );
                              
                              -- Vendors table (shared)
                              CREATE TABLE IF NOT EXISTS vendors (
                                  vendor_id SERIAL PRIMARY KEY,
                                  vendor_name VARCHAR(50) UNIQUE NOT NULL,
                                  vendor_description TEXT,
                                  is_active BOOLEAN DEFAULT true,
                                  created_at TIMESTAMP DEFAULT now(),
                                  updated_at TIMESTAMP DEFAULT now()
                              );
                              
                              -- System performance metrics
                              CREATE TABLE IF NOT EXISTS prod_system_metrics (
                                  id SERIAL PRIMARY KEY,
                                  metric_name VARCHAR(100) NOT NULL,
                                  metric_value DECIMAL(15,4),
                                  metric_unit VARCHAR(20),
                                  recorded_at TIMESTAMP DEFAULT now()
                              );
                              
                              -- Create production indexes
                              CREATE INDEX IF NOT EXISTS idx_prod_instruments_symbol ON prod_instruments(symbol);
                              CREATE INDEX IF NOT EXISTS idx_prod_instruments_exchange ON prod_instruments(exchange);
                              CREATE INDEX IF NOT EXISTS idx_prod_instruments_active ON prod_instruments(is_active);
                              CREATE INDEX IF NOT EXISTS idx_prod_daily_prices_symbol_date ON prod_daily_prices(symbol, price_date);
                              CREATE INDEX IF NOT EXISTS idx_prod_daily_prices_date ON prod_daily_prices(price_date);
                              CREATE INDEX IF NOT EXISTS idx_prod_predictions_symbol_date ON prod_model_predictions(symbol, prediction_date);
                              CREATE INDEX IF NOT EXISTS idx_prod_predictions_model ON prod_model_predictions(model_version);
                              CREATE INDEX IF NOT EXISTS idx_prod_positions_symbol ON prod_positions(symbol);
                              CREATE INDEX IF NOT EXISTS idx_prod_positions_status ON prod_positions(status);
                              CREATE INDEX IF NOT EXISTS idx_prod_metrics_name_time ON prod_system_metrics(metric_name, recorded_at);
                          """
                      }
                  ]
                  
                  # Apply migrations
                  for migration in migration_steps:
                      if migration['version'] > current_version:
                          logger.info(f"🔄 Applying migration {migration['version']}: {migration['description']}")
                          
                          try:
                              await conn.execute(migration['sql'])
                              
                              # Record migration
                              await conn.execute("""
                                  INSERT INTO prod_db_version (version, description, applied_at, migration_file)
                                  VALUES ($1, $2, NOW(), $3)
                                  ON CONFLICT (version) DO NOTHING
                              """, migration['version'], migration['description'], 'prod_schema_setup')
                              
                              logger.info(f"✅ Migration {migration['version']} applied successfully")
                              
                          except Exception as e:
                              logger.warning(f"⚠️ Migration {migration['version']} had issues (may be expected): {e}")
                  
                  # Final status check
                  final_version = await conn.fetchval("SELECT COALESCE(MAX(version), -1) FROM prod_db_version")
                  final_tables = await conn.fetch("SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename")
                  
                  logger.info("📊 ATS-PROD Migration Summary:")
                  logger.info(f"  📋 Database version: {current_version} → {final_version}")
                  logger.info(f"  📊 Total tables: {len(final_tables)}")
                  logger.info(f"  🎯 Production environment ready for live trading")
                  
                  await conn.close()
                  logger.info("🎉 ATS-PROD migration completed successfully!")
                  return True
                  
              except Exception as e:
                  logger.error(f"❌ ATS-PROD migration failed: {e}")
                  return False
          
          if __name__ == "__main__":
              import sys
              success = asyncio.run(run_prod_migration())
              sys.exit(0 if success else 1)
          EOF
          
          mkdir -p /app
          cd /app
          python migrate_prod.py
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      restartPolicy: Never