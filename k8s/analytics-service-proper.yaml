apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-analytics-service
  namespace: ats-dev
  labels:
    app: ats-analytics
    component: web-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats-analytics
  template:
    metadata:
      labels:
        app: ats-analytics
        component: web-service
    spec:
      containers:
      - name: analytics
        image: dragonflyer762/ats-genai:latest
        command: ["/bin/bash"]
        args:
        - "-c"
        - |
          echo "📦 Installing git (dependencies already in Docker image)..."
          apt-get update && apt-get install -y git
          
          echo "📦 Cloning source code from Git with credentials..."
          git clone -b feature/analytics-service-deployment https://${GITHUB_TOKEN}:x-oauth-basic@github.com/AkoloTechnologies/ats-genai.git /tmp/src-repo
          cd /tmp/src-repo
          
          echo "🚀 Starting ATS Analytics Service..."
          PYTHONPATH=src python3 src/services/analytics_service.py
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
        - name: ENVIRONMENT
          value: "development"
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-credentials
              key: token
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health  
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ats-analytics-service
  namespace: ats-dev
  labels:
    app: ats-analytics
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
    name: http
  selector:
    app: ats-analytics