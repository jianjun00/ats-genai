apiVersion: batch/v1
kind: Job
metadata:
  name: tiingo-10year-minute-backfill
  namespace: ats-dev
  labels:
    app: ats-genai
    component: minute-backfill
    vendor: tiingo
    period: 2010-2020
spec:
  ttlSecondsAfterFinished: 14400  # 4 hours
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: tiingo-minute-backfiller
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "📦 Installing dependencies for Tiingo 10-year minute backfill..."
          pip install --no-cache-dir asyncpg aiohttp
          
          mkdir -p /app/scripts/backfill
          cd /app
          
          # Create the backfill script inline
          python /scripts/run_10year_minute_backfill.py
          
          echo "✅ Tiingo 10-year minute backfill completed!"
          echo "⏰ End time: $(date)"
        env:
        - name: VENDOR
          value: "tiingo"
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        - name: TIINGO_API_KEY
          value: "9f7df748b42f4888de0ba4f6eff5e0dc44c85b12"
        - name: PYTHONPATH
          value: "/app"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
      volumes:
      - name: script-volume
        configMap:
          name: tiingo-10year-backfill-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tiingo-10year-backfill-script
  namespace: ats-dev
data:
  run_10year_minute_backfill.py: |