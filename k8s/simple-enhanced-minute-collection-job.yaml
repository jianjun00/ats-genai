apiVersion: batch/v1
kind: Job
metadata:
  name: simple-enhanced-minute-collection
  namespace: ats-dev
  labels:
    app: ats-genai
    component: minute-data-collection
    type: simple-enhanced
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: ats-genai
        component: minute-data-collection
    spec:
      restartPolicy: Never
      containers:
      - name: collector
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Simple Enhanced Multi-Vendor 1-Minute Collection"
          echo "=" * 50
          echo "📊 Testing vendor-separated file storage"
          echo "🏪 Simulated vendors: Polygon, Tiingo, EODHD"
          echo "📁 Storage: Vendor-specific directories"
          echo "⏰ Started at: $(date)"
          echo ""
          
          # Install dependencies
          echo "📦 Installing dependencies..."
          pip install --no-cache-dir \
            pandas \
            pyarrow \
            requests \
            pytz \
            aiohttp
          
          # Create vendor-separated data directory
          mkdir -p /data/minute-files/polygon
          mkdir -p /data/minute-files/tiingo
          mkdir -p /data/minute-files/eodhd
          
          # Create sample Python script
          cat > /tmp/demo_collection.py << 'EOF'
          import pandas as pd
          import numpy as np
          from datetime import datetime, timedelta
          import pytz
          from pathlib import Path
          import random
          
          # Create sample data for each vendor
          symbols = ["AAPL", "MSFT", "GOOGL"]
          vendors = ["polygon", "tiingo", "eodhd"]
          
          base_path = Path("/data/minute-files")
          eastern = pytz.timezone('US/Eastern')
          
          for vendor in vendors:
              print(f"📊 Generating sample data for {vendor.upper()}")
              
              for symbol in symbols:
                  # Generate sample minute bars
                  data = []
                  start_time = datetime.now() - timedelta(days=1)
                  
                  for i in range(390):  # Market hours: 390 minutes
                      timestamp = start_time + timedelta(minutes=i)
                      # Convert to UTC
                      timestamp_utc = eastern.localize(timestamp).astimezone(pytz.UTC)
                      
                      # Generate realistic OHLCV data
                      base_price = 150.0 + random.uniform(-20, 20)
                      data.append({
                          'timestamp': timestamp_utc,
                          'open': base_price + random.uniform(-1, 1),
                          'high': base_price + random.uniform(0, 2),
                          'low': base_price - random.uniform(0, 2),
                          'close': base_price + random.uniform(-1, 1),
                          'volume': random.randint(1000, 50000),
                          'vendor': vendor
                      })
                  
                  # Create vendor-specific directory
                  vendor_dir = base_path / vendor / symbol / "2025" / "08"
                  vendor_dir.mkdir(parents=True, exist_ok=True)
                  
                  # Save to Parquet
                  df = pd.DataFrame(data)
                  file_path = vendor_dir / f"{symbol}_2025_08.parquet"
                  df.to_parquet(file_path, index=False)
                  
                  print(f"  ✅ Saved {len(data)} bars for {symbol} to {file_path}")
          
          print(f"\n📁 File structure created:")
          for vendor_dir in sorted(base_path.iterdir()):
              print(f"📂 {vendor_dir.name}/")
              for symbol_dir in sorted(vendor_dir.iterdir()):
                  if symbol_dir.is_dir():
                      file_count = sum(1 for _ in symbol_dir.rglob("*.parquet"))
                      print(f"  📂 {symbol_dir.name}/ ({file_count} files)")
          
          print(f"\n✅ Enhanced vendor-separated collection demo completed!")
          EOF
          
          # Run the demo script
          echo "🔄 Running vendor-separated collection demo..."
          python /tmp/demo_collection.py
          
          # Show final results
          echo ""
          echo "📊 Final Summary:"
          echo "  • Vendor-separated directory structure created"
          echo "  • Timezone-aware data generation"
          echo "  • Parquet file storage implemented"
          echo "  • Sample data for 3 symbols across 3 vendors"
          
          # List all generated files
          echo ""
          echo "📁 Generated files:"
          find /data/minute-files -name "*.parquet" | sort
          
          echo ""
          echo "✅ Simple enhanced minute collection job completed"

        volumeMounts:
        - name: data-storage
          mountPath: /data
          
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

      volumes:
      - name: data-storage
        hostPath:
          path: /home/jianjun/ats-data
          type: DirectoryOrCreate

      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"

  backoffLimit: 1