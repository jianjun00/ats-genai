apiVersion: batch/v1
kind: Job
metadata:
  name: verify-horizon-breakdown
  namespace: ats-dev
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: verify
        image: postgres:13
        env:
        - name: PGPASSWORD
          value: "dev_password"
        command: ["psql"]
        args: ["-h", "postgres", "-p", "5432", "-U", "postgres", "-d", "dev_db", "-c", "SELECT prediction_horizon, COUNT(*) as samples, AVG(news_volume_7d)::DECIMAL(6,1) as avg_news_volume, AVG(sample_quality_score)::DECIMAL(5,3) as avg_quality FROM dev_multimodal_training_samples GROUP BY prediction_horizon ORDER BY prediction_horizon;"]