apiVersion: batch/v1
kind: Job
metadata:
  name: identify-price-vendors
  namespace: ats-dev
  labels:
    app: ats-genai
    component: vendor-identification
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: vendor-identifier
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Installing dependencies..."
          pip install --no-cache-dir asyncpg
          
          echo "Identifying available price data vendors..."
          cat > /tmp/identify_vendors.py << 'EOF'
          import asyncio
          import asyncpg
          
          async def identify_price_vendors():
              """Identify all available price data vendors and their coverage"""
              
              pool = await asyncpg.create_pool(
                  host="postgres-simple",
                  port=5432,
                  user="postgres",
                  password="dev_password",
                  database="dev_db",
                  min_size=1,
                  max_size=3
              )
              
              try:
                  async with pool.acquire() as conn:
                      print("\n=== AVAILABLE PRICE DATA SOURCES ===")
                      
                      # Check all price-related tables
                      price_tables = await conn.fetch("""
                          SELECT table_name 
                          FROM information_schema.tables 
                          WHERE table_schema = 'public' 
                            AND table_name LIKE '%price%'
                          ORDER BY table_name
                      """)
                      
                      print("Price-related tables:")
                      for table in price_tables:
                          print(f"  - {table['table_name']}")
                      
                      # Check vendors table
                      print(f"\n=== CONFIGURED VENDORS ===")
                      vendors = await conn.fetch("""
                          SELECT id, name, description 
                          FROM dev_vendors 
                          ORDER BY name
                      """)
                      
                      print("Available vendors:")
                      for vendor in vendors:
                          print(f"  - {vendor['name']}: {vendor['description']}")
                      
                      # Check coverage for each daily price source
                      print(f"\n=== DAILY PRICE DATA COVERAGE ===")
                      
                      # Polygon coverage
                      polygon_stats = await conn.fetchrow("""
                          SELECT 
                              COUNT(DISTINCT instrument_id) as instruments,
                              COUNT(*) as total_records,
                              MIN(date) as earliest_date,
                              MAX(date) as latest_date,
                              ROUND(AVG(close), 2) as avg_price
                          FROM dev_daily_prices_polygon
                      """)
                      
                      print(f"1. Polygon Daily Prices:")
                      print(f"   Instruments: {polygon_stats['instruments']}")
                      print(f"   Records: {polygon_stats['total_records']:,}")
                      print(f"   Date range: {polygon_stats['earliest_date']} to {polygon_stats['latest_date']}")
                      print(f"   Average price: ${polygon_stats['avg_price']}")
                      
                      # Tiingo coverage
                      tiingo_stats = await conn.fetchrow("""
                          SELECT 
                              COUNT(DISTINCT instrument_id) as instruments,
                              COUNT(*) as total_records,
                              MIN(date) as earliest_date,
                              MAX(date) as latest_date,
                              ROUND(AVG(close), 2) as avg_price
                          FROM dev_daily_prices_tiingo
                      """)
                      
                      print(f"\n2. Tiingo Daily Prices:")
                      print(f"   Instruments: {tiingo_stats['instruments']}")
                      print(f"   Records: {tiingo_stats['total_records']:,}")
                      print(f"   Date range: {tiingo_stats['earliest_date']} to {tiingo_stats['latest_date']}")
                      print(f"   Average price: ${tiingo_stats['avg_price']}")
                      
                      # Check if there are other daily price tables
                      other_daily_tables = []
                      for table in price_tables:
                          table_name = table['table_name']
                          if 'daily' in table_name and table_name not in ['dev_daily_prices_polygon', 'dev_daily_prices_tiingo']:
                              other_daily_tables.append(table_name)
                      
                      if other_daily_tables:
                          print(f"\n3. Other Daily Price Tables:")
                          for table_name in other_daily_tables:
                              try:
                                  stats = await conn.fetchrow(f"""
                                      SELECT 
                                          COUNT(DISTINCT instrument_id) as instruments,
                                          COUNT(*) as total_records,
                                          MIN(date) as earliest_date,
                                          MAX(date) as latest_date
                                      FROM {table_name}
                                  """)
                                  print(f"   {table_name}:")
                                  print(f"     Instruments: {stats['instruments']}")
                                  print(f"     Records: {stats['total_records']:,}")
                                  print(f"     Date range: {stats['earliest_date']} to {stats['latest_date']}")
                              except Exception as e:
                                  print(f"   {table_name}: Error reading - {e}")
                      
                      # Check source code for other potential vendors
                      print(f"\n=== POTENTIAL ADDITIONAL VENDORS ===")
                      
                      # Look for API configuration patterns
                      api_keys = await conn.fetch("""
                          SELECT column_name
                          FROM information_schema.columns
                          WHERE table_schema = 'public'
                            AND column_name ILIKE '%api%key%'
                          ORDER BY column_name
                      """)
                      
                      if api_keys:
                          print("API key columns found (indicating potential vendors):")
                          for key in api_keys:
                              print(f"  - {key['column_name']}")
                      
                      # Check for common financial data vendor patterns
                      common_vendors = [
                          'alphavantage', 'yahoo', 'quandl', 'iex', 'finnhub', 
                          'marketstack', 'twelvedata', 'fmp', 'eod'
                      ]
                      
                      found_vendors = []
                      for vendor in common_vendors:
                          # Check if there are tables with vendor names
                          vendor_tables = await conn.fetch(f"""
                              SELECT table_name 
                              FROM information_schema.tables 
                              WHERE table_schema = 'public' 
                                AND table_name ILIKE '%{vendor}%'
                          """)
                          if vendor_tables:
                              found_vendors.append((vendor, [t['table_name'] for t in vendor_tables]))
                      
                      if found_vendors:
                          print(f"\nFound tables for additional vendors:")
                          for vendor, tables in found_vendors:
                              print(f"  {vendor.upper()}: {', '.join(tables)}")
                      
                      # Sample AAPL prices from each source for comparison
                      print(f"\n=== AAPL PRICE COMPARISON (latest available) ===")
                      
                      aapl_polygon = await conn.fetchrow("""
                          SELECT date, close
                          FROM dev_daily_prices_polygon p
                          JOIN dev_instruments i ON p.instrument_id = i.id
                          WHERE i.symbol = 'AAPL'
                          ORDER BY date DESC
                          LIMIT 1
                      """)
                      
                      aapl_tiingo = await conn.fetchrow("""
                          SELECT date, close  
                          FROM dev_daily_prices_tiingo p
                          JOIN dev_instruments i ON p.instrument_id = i.id
                          WHERE i.symbol = 'AAPL'
                          ORDER BY date DESC
                          LIMIT 1
                      """)
                      
                      if aapl_polygon:
                          print(f"Polygon: ${float(aapl_polygon['close']):.2f} on {aapl_polygon['date']}")
                      if aapl_tiingo:
                          print(f"Tiingo:  ${float(aapl_tiingo['close']):.2f} on {aapl_tiingo['date']}")
                      
                      print(f"\n=== RECOMMENDATIONS ===")
                      print("For majority voting, we need at least 3 data sources. Options:")
                      print("1. ✅ Tiingo (already working, correct prices)")
                      print("2. 🔧 Polygon (needs repopulation, but API works)")
                      print("3. 🆕 Add IEX Cloud (reliable, free tier available)")
                      print("4. 🆕 Add Alpha Vantage (popular, free tier)")
                      print("5. 🆕 Add Yahoo Finance (free, but may have rate limits)")
                      print("6. 🆕 Add Financial Modeling Prep (comprehensive)")
                      
                      print(f"\nNext steps:")
                      print("1. Fix and repopulate Polygon data")
                      print("2. Add 1-2 additional vendors for redundancy")
                      print("3. Implement majority voting logic")
                      
              finally:
                  await pool.close()
          
          if __name__ == "__main__":
              asyncio.run(identify_price_vendors())
          EOF
          
          python /tmp/identify_vendors.py
        env:
        - name: PYTHONPATH
          value: "/tmp"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"