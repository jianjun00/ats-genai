        @app.get("/api/v1/coverage/historical")
        async def get_historical_coverage():
            """Get historical coverage evolution data"""
            try:
                async with db_pool.acquire() as conn:
                    results = await conn.fetch("""
                        SELECT EXTRACT(YEAR FROM date)::INTEGER as year, 
                               COUNT(DISTINCT instrument_id) as symbols,
                               COUNT(*) as records
                        FROM dev_daily_prices 
                        GROUP BY EXTRACT(YEAR FROM date) 
                        ORDER BY year
                    """)
                    
                    # Build 30-year timeline
                    current_year = datetime.now().year
                    years = list(range(1995, current_year + 1))
                    symbol_counts = []
                    record_counts = []
                    
                    # Map actual data
                    data_map = {int(row['year']): (row['symbols'], row['records']) for row in results}
                    
                    for year in years:
                        if year in data_map:
                            symbols, records = data_map[year]
                            symbol_counts.append(symbols)
                            record_counts.append(records)
                        else:
                            symbol_counts.append(0)
                            record_counts.append(0)
                    
                    return {
                        "years": years,
                        "symbol_counts": symbol_counts,
                        "record_counts": record_counts,
                        "insight": "Shows dramatic scale-up from ~50 symbols (2020-2022) to 10K symbols (2024-2025)"
                    }
            except Exception as e:
                raise HTTPException(status_code=500, detail=str(e))
        
