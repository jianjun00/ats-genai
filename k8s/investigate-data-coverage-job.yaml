apiVersion: batch/v1
kind: Job
metadata:
  name: investigate-data-coverage
  namespace: ats-dev
  labels:
    app: ats-genai
    component: data-investigation
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: data-investigator
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Installing dependencies..."
          pip install --no-cache-dir asyncpg aiohttp
          
          echo "Investigating data coverage and quality..."
          cat > /tmp/investigate_coverage.py << 'EOF'
          import asyncio
          import asyncpg
          import logging
          from datetime import date, timedelta
          
          async def investigate_data_coverage():
              """Investigate our data coverage vs expected universe size"""
              
              logging.basicConfig(level=logging.INFO)
              logger = logging.getLogger(__name__)
              
              try:
                  # Connect to database
                  pool = await asyncpg.create_pool(
                      host="postgres-simple",
                      port=5432,
                      user="postgres", 
                      password="dev_password",
                      database="dev_db",
                      min_size=1,
                      max_size=3
                  )
                  logger.info("✅ Connected to database successfully")
                  
                  async with pool.acquire() as conn:
                      
                      # Investigation 1: Total instruments in our database
                      logger.info("\n=== INVESTIGATION 1: Total Universe Size ===")
                      total_instruments = await conn.fetchrow("""
                          SELECT 
                              COUNT(*) as total_instruments,
                              COUNT(DISTINCT symbol) as unique_symbols
                          FROM dev_instruments
                      """)
                      logger.info(f"  Total instruments in database: {total_instruments['total_instruments']}")
                      logger.info(f"  Unique symbols: {total_instruments['unique_symbols']}")
                      
                      # Investigation 2: Instruments with recent price data
                      logger.info("\n=== INVESTIGATION 2: Price Data Coverage ===")
                      price_coverage = await conn.fetchrow("""
                          SELECT 
                              COUNT(DISTINCT p.instrument_id) as instruments_with_prices,
                              COUNT(DISTINCT i.symbol) as symbols_with_prices,
                              MIN(p.date) as earliest_price,
                              MAX(p.date) as latest_price,
                              COUNT(*) as total_price_records
                          FROM dev_daily_prices_polygon p
                          JOIN dev_instruments i ON p.instrument_id = i.id
                          WHERE p.date >= $1
                      """, date.today() - timedelta(days=30))
                      
                      logger.info(f"  Instruments with recent price data: {price_coverage['instruments_with_prices']}")
                      logger.info(f"  Symbols with recent price data: {price_coverage['symbols_with_prices']}")
                      logger.info(f"  Price data date range: {price_coverage['earliest_price']} to {price_coverage['latest_price']}")
                      logger.info(f"  Total recent price records: {price_coverage['total_price_records']:,}")
                      
                      # Investigation 3: Market cap data coverage  
                      logger.info("\n=== INVESTIGATION 3: Market Cap Data Coverage ===")
                      mc_coverage = await conn.fetchrow("""
                          SELECT 
                              COUNT(DISTINCT instrument_id) as instruments_with_market_cap,
                              COUNT(*) as total_market_cap_records,
                              MIN(market_cap/1000000) as min_cap_millions,
                              MAX(market_cap/1000000) as max_cap_millions,
                              ROUND(AVG(market_cap/1000000), 2) as avg_cap_millions
                          FROM dev_daily_market_cap
                      """)
                      logger.info(f"  Instruments with market cap: {mc_coverage['instruments_with_market_cap']}")
                      logger.info(f"  Total market cap records: {mc_coverage['total_market_cap_records']}")
                      logger.info(f"  Market cap range: ${mc_coverage['min_cap_millions']:.0f}M to ${mc_coverage['max_cap_millions']:.0f}M")
                      logger.info(f"  Average market cap: ${mc_coverage['avg_cap_millions']:.0f}M")
                      
                      # Investigation 4: Gap Analysis - Instruments with prices but NO market cap
                      logger.info("\n=== INVESTIGATION 4: Coverage Gaps ===")
                      missing_market_cap = await conn.fetch("""
                          SELECT 
                              i.symbol,
                              COUNT(p.date) as recent_price_days,
                              ROUND(AVG(p.close), 2) as avg_price,
                              ROUND(AVG(p.volume * p.close)/1000000, 2) as avg_dollar_volume_millions
                          FROM dev_daily_prices_polygon p
                          JOIN dev_instruments i ON p.instrument_id = i.id
                          LEFT JOIN dev_daily_market_cap mc ON p.instrument_id = mc.instrument_id AND p.date = mc.date
                          WHERE p.date >= $1
                            AND mc.instrument_id IS NULL  -- No market cap data
                            AND p.volume IS NOT NULL
                            AND p.close IS NOT NULL
                            AND p.volume > 0
                            AND p.close > 0
                          GROUP BY i.id, i.symbol
                          HAVING COUNT(p.date) >= 10  -- At least 10 days of price data
                            AND AVG(p.volume * p.close) >= 100000000  -- Average >$100M volume
                          ORDER BY AVG(p.volume * p.close) DESC
                          LIMIT 50
                      """, date.today() - timedelta(days=30))
                      
                      logger.info(f"  Instruments with good price/volume data but MISSING market cap: {len(missing_market_cap)}")
                      
                      if missing_market_cap:
                          logger.info("\\n  Top missing market cap candidates (by volume):")
                          for i, stock in enumerate(missing_market_cap[:20]):
                              logger.info(f"    {i+1:2d}. {stock['symbol']:6s}: ${stock['avg_price']:6.2f}, Vol=${stock['avg_dollar_volume_millions']:,.0f}M, {stock['recent_price_days']} days")
                      
                      # Investigation 5: Volume distribution analysis
                      logger.info("\\n=== INVESTIGATION 5: Volume Distribution ===")
                      volume_buckets = await conn.fetch("""
                          WITH daily_volumes AS (
                              SELECT 
                                  i.symbol,
                                  p.date,
                                  p.volume * p.close as dollar_volume
                              FROM dev_daily_prices_polygon p
                              JOIN dev_instruments i ON p.instrument_id = i.id
                              WHERE p.date >= $1
                                AND p.volume IS NOT NULL
                                AND p.close IS NOT NULL
                                AND p.volume > 0
                                AND p.close > 0
                          ),
                          avg_volumes AS (
                              SELECT 
                                  symbol,
                                  AVG(dollar_volume) as avg_dollar_volume
                              FROM daily_volumes
                              GROUP BY symbol
                          )
                          SELECT 
                              CASE 
                                  WHEN avg_dollar_volume >= 1000000000 THEN 'High Volume (≥$1B)'
                                  WHEN avg_dollar_volume >= 500000000 THEN 'Med-High Volume (≥$500M)'  
                                  WHEN avg_dollar_volume >= 100000000 THEN 'Medium Volume (≥$100M)'
                                  WHEN avg_dollar_volume >= 10000000 THEN 'Low-Med Volume (≥$10M)'
                                  ELSE 'Low Volume (<$10M)'
                              END as volume_category,
                              COUNT(*) as stock_count,
                              ROUND(MIN(avg_dollar_volume/1000000), 2) as min_volume_millions,
                              ROUND(MAX(avg_dollar_volume/1000000), 2) as max_volume_millions
                          FROM avg_volumes
                          GROUP BY volume_category
                          ORDER BY MIN(avg_dollar_volume) DESC
                      """, date.today() - timedelta(days=30))
                      
                      total_stocks_with_volume = sum(row['stock_count'] for row in volume_buckets)
                      stocks_over_100m_volume = sum(row['stock_count'] for row in volume_buckets 
                                                   if 'Volume (≥$100M)' in row['volume_category'] or 'Volume (≥$500M)' in row['volume_category'] or 'Volume (≥$1B)' in row['volume_category'])
                      
                      logger.info(f"  Total stocks with volume data: {total_stocks_with_volume}")
                      logger.info(f"  Stocks with ≥$100M average volume: {stocks_over_100m_volume}")
                      
                      for row in volume_buckets:
                          logger.info(f"    {row['volume_category']:25s}: {row['stock_count']:4d} stocks ({row['min_volume_millions']:6.0f}M - {row['max_volume_millions']:6.0f}M)")
                      
                      # Investigation 6: External data quality check  
                      logger.info("\\n=== INVESTIGATION 6: Sample Market Cap Verification ===")
                      sample_verification = await conn.fetch("""
                          SELECT 
                              i.symbol,
                              ROUND(mc.market_cap/1000000000, 2) as our_market_cap_billions,
                              mc.shares_outstanding/1000000 as shares_millions,
                              ROUND(mc.market_cap / mc.shares_outstanding, 2) as implied_price,
                              p.close as actual_price
                          FROM dev_daily_market_cap mc
                          JOIN dev_instruments i ON mc.instrument_id = i.id
                          JOIN dev_daily_prices_polygon p ON mc.instrument_id = p.instrument_id AND mc.date = p.date
                          WHERE mc.date = (SELECT MAX(date) FROM dev_daily_market_cap)
                          ORDER BY mc.market_cap DESC
                          LIMIT 10
                      """)
                      
                      logger.info("  Top 10 stocks - Market cap verification:")
                      logger.info("    Symbol | Our Cap | Shares(M) | Calc Price | Actual Price | Match?")
                      for stock in sample_verification:
                          price_match = abs(stock['implied_price'] - stock['actual_price']) < 0.01
                          match_status = "✅" if price_match else "❌"
                          logger.info(f"    {stock['symbol']:6s} | ${stock['our_market_cap_billions']:6.1f}T | {stock['shares_millions']:8.0f} | ${stock['implied_price']:8.2f} | ${stock['actual_price']:10.2f} | {match_status}")
                      
                      # Summary and recommendations
                      logger.info("\\n=== SUMMARY & RECOMMENDATIONS ===")
                      logger.info(f"❌ PROBLEM IDENTIFIED: We only have market cap for {mc_coverage['instruments_with_market_cap']} stocks")
                      logger.info(f"📊 AVAILABLE DATA: {price_coverage['instruments_with_prices']} stocks have recent price data")
                      logger.info(f"🎯 POTENTIAL UNIVERSE: {stocks_over_100m_volume} stocks meet ≥$100M volume criteria")
                      
                      if len(missing_market_cap) > 0:
                          logger.info(f"🚨 ACTION REQUIRED: Compute market cap for {len(missing_market_cap)} high-volume stocks missing data")
                          logger.info("📝 RECOMMENDATION: Expand market cap computation to full universe, not just 46 hand-picked stocks")
                      
                      logger.info("\\n✅ Data investigation completed")
                  
                  await pool.close()
                  return True
                  
              except Exception as e:
                  logger.error(f"❌ Investigation failed: {e}")
                  import traceback
                  traceback.print_exc()
                  return False
          
          if __name__ == "__main__":
              success = asyncio.run(investigate_data_coverage())
              exit(0 if success else 1)
          EOF
          
          python /tmp/investigate_coverage.py
        env:
        - name: PYTHONPATH
          value: "/tmp"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"