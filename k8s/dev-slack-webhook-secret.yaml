apiVersion: v1
kind: Secret
metadata:
  name: slack-webhook-secret
  namespace: ats-dev
type: Opaque
stringData:
  # Replace with your actual Slack webhook URL
  # Get this from: Slack App Settings -> Incoming Webhooks
  # Format: https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX
  webhook-url: "https://hooks.slack.com/services/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"
---
# Instructions for setup:
# 1. Go to https://api.slack.com/apps
# 2. Create a new app or use existing app
# 3. Navigate to "Incoming Webhooks" 
# 4. Activate incoming webhooks
# 5. Create webhook for your desired channel (e.g., #ats-dev-alerts)
# 6. Copy the webhook URL and replace REPLACE_WITH_YOUR_SLACK_WEBHOOK_URL above
# 7. Apply this secret: kubectl apply -f k8s/dev/slack-webhook-secret.yaml
#
# Example webhook URL format:
# https://hooks.slack.com/services/T1234567890/B1234567890/abcdefghijklmnopqrstuvwx