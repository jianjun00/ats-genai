apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrated-analytics
  namespace: ats-dev
  labels:
    app: integrated-analytics
    component: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integrated-analytics
  template:
    metadata:
      labels:
        app: integrated-analytics
        component: webapp
    spec:
      containers:
      - name: webapp
        image: python:3.12-slim
        ports:
        - containerPort: 5000
          name: http
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "🚀 Installing dependencies..."
          pip install --no-cache-dir \
            fastapi==0.104.1 \
            uvicorn[standard]==0.24.0 \
            asyncpg==0.29.0 \
            pydantic==2.5.0 \
            requests==2.31.0 \
            pandas \
            numpy
          
          echo "📂 Setting up application..."
          cp /config/app.py /app.py
          
          echo "📊 Starting Comprehensive Analytics WebApp..."
          python /app.py
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: webapp-config
          mountPath: /config
        - name: training-data
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: webapp-config
        configMap:
          name: integrated-analytics-config
      - name: training-data
        persistentVolumeClaim:
          claimName: data-pvc