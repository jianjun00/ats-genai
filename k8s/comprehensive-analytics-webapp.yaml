    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)
    
    # Database connection
    DATABASE_URL = "postgresql://postgres:dev_password@postgres-simple:5432/dev_db"
    
    # Slack webhook URL for coverage alerts
    SLACK_WEBHOOK_URL = "https://hooks.slack.com/services/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"
    
    # Coverage models
    class CoverageOverview(BaseModel):
        vendor: str
        data_type: str
        total_symbols: int
        avg_coverage: float
        active_symbols: int
        stale_symbols: int
        missing_symbols: int
    
    class CoverageSummary(BaseModel):
        symbol: str
        vendor: str
        data_type: str
        current_status: str
        coverage_24h: float
        quality_24h: Optional[float] = None
        records_24h: int
        coverage_7d: Optional[float] = None
        coverage_30d: Optional[float] = None
        latest_data_time: Optional[datetime] = None
        hours_since_update: Optional[float] = None
        coverage_trend: Optional[str] = None
        quality_trend: Optional[str] = None
    
    def create_app() -> FastAPI:
        app = FastAPI(
            title="Comprehensive Analytics Dashboard",
            description="Job Management + Dataset Analysis + Dataset Detail Pages + Coverage Dashboard",
            version="5.0.0"
        )
        
        app.add_middleware(
            CORSMiddleware,
            allow_origins=["*"],
            allow_credentials=True,
            allow_methods=["*"],
            allow_headers=["*"],
        )
        
        db_pool = None
        
        @app.on_event("startup")
        async def startup():
            nonlocal db_pool
            try:
                db_pool = await asyncpg.create_pool(DATABASE_URL, min_size=1, max_size=5)
                logger.info("✅ Database pool created successfully")
            except Exception as e:
                logger.error(f"❌ Failed to create database pool: {e}")
        
        @app.on_event("shutdown")
        async def shutdown():
            if db_pool:
                await db_pool.close()
                logger.info("🔄 Database pool closed")
        
