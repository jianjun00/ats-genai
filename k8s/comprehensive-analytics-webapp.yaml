                        SELECT id, dataset_name, symbols, total_sequences, feature_count, 
                               creation_timestamp, file_size_mb
                        FROM dev_training_dataset WHERE id = $1
                    """, dataset_id)
                    
                    if not dataset:
                        raise HTTPException(status_code=404, detail="Dataset not found")
                    
                    return dict(dataset)
            except HTTPException:
                raise
            except Exception as e:
                raise HTTPException(status_code=500, detail=str(e))
        
        def load_real_training_data(dataset_name: str, symbols: List[str], total_sequences: int, feature_count: int, limit: int, offset: int) -> Dict[str, Any]:
            """Load actual training data from files"""
            import numpy as np
            import pandas as pd
            
            training_dir = Path("/data/training")
            sequences = []
            
            # Look for training files for this dataset
            dataset_files = []
            if training_dir.exists():
                # Look for files related to this dataset
                pattern_variations = [
                    dataset_name,
                    dataset_name.replace('_', '-'),
                    dataset_name.split('_')[0] if '_' in dataset_name else dataset_name
                ]
                
                for pattern in pattern_variations:
                    dataset_files.extend(training_dir.glob(f"*{pattern}*"))
                    dataset_files.extend(training_dir.glob(f"**/*{pattern}*"))
                
                # Also look for symbol-specific files
                for symbol in symbols:
                    dataset_files.extend(training_dir.glob(f"*{symbol}*"))
                    dataset_files.extend(training_dir.glob(f"**/*{symbol}*"))
            
            if not dataset_files:
                # No files found, return error instead of mock data
                return {
                    "sequences": [],
                    "total_sequences": 0,
                    "available_symbols": symbols,
                    "feature_names": [],
                    "error": f"No training files found for dataset '{dataset_name}' in /data/training/",
                    "searched_patterns": [dataset_name] + symbols,
                    "training_dir_exists": training_dir.exists(),
                    "note": "REAL DATA ONLY - No mock data fallback"
                }
            
            # Try to load and analyze the first few files
            loaded_sequences = 0
            feature_names = set()
            
            try:
                for file_path in dataset_files[:3]:  # Analyze first few files
                    try:
                        if file_path.suffix in ['.csv', '.parquet', '.feather']:
                            if file_path.suffix == '.csv':
                                df = pd.read_csv(file_path, nrows=100)
                            elif file_path.suffix == '.parquet':
                                df = pd.read_parquet(file_path)
                            elif file_path.suffix == '.feather':
                                df = pd.read_feather(file_path)
                            
                            # Extract feature information from real data
                            numeric_columns = df.select_dtypes(include=[np.number]).columns
                            feature_names.update(numeric_columns)
                            
                            # Create sequence info from real file
                            sequences.append({
                                "sequence_id": loaded_sequences + 1,
                                "start_date": str(df.index.min()) if hasattr(df.index, 'min') else "N/A",
                                "end_date": str(df.index.max()) if hasattr(df.index, 'max') else "N/A", 
                                "symbols": symbols,
                                "file_path": str(file_path.name),
                                "file_size": file_path.stat().st_size,
                                "records": len(df),
                                "features": list(numeric_columns),
                                "feature_stats": {
                                    col: {
                                        "mean": float(df[col].mean()) if col in df.columns and df[col].dtype in [np.float64, np.int64] else None,
                                        "std": float(df[col].std()) if col in df.columns and df[col].dtype in [np.float64, np.int64] else None,
                                        "min": float(df[col].min()) if col in df.columns and df[col].dtype in [np.float64, np.int64] else None,
                                        "max": float(df[col].max()) if col in df.columns and df[col].dtype in [np.float64, np.int64] else None
                                    } for col in numeric_columns[:10]  # Limit to first 10 features
                                },
                                "sample_data": df.head(3).to_dict('records') if len(df) > 0 else []
                            })
                            
                            loaded_sequences += 1
                            if loaded_sequences >= limit:
                                break
                                
                    except Exception as file_error:
                        logger.warning(f"Could not process file {file_path}: {file_error}")
                        continue
                        
            except Exception as e:
                logger.error(f"Error loading training data: {e}")
                return {
                    "sequences": [],
                    "total_sequences": 0,
                    "available_symbols": symbols,
                    "feature_names": [],
                    "error": f"Error loading training data: {str(e)}",
                    "files_found": len(dataset_files),
                    "note": "REAL DATA ONLY - Error occurred while processing files"
                }
            
            return {
                "sequences": sequences,
                "total_sequences": len(sequences),
                "available_symbols": symbols,
                "feature_names": list(feature_names),
                "files_analyzed": len(dataset_files),
                "note": f"REAL training data loaded from {loaded_sequences} files"
            }
        
        @app.get("/api/v1/datasets/{dataset_id}/sequences")
        async def get_dataset_sequences(
            dataset_id: int,
            limit: int = Query(20, ge=1, le=100),
            offset: int = Query(0, ge=0)
        ):
            try:
                async with db_pool.acquire() as conn:
                    dataset = await conn.fetchrow("""
                        SELECT dataset_name, symbols, total_sequences, feature_count
                        FROM dev_training_dataset WHERE id = $1
                    """, dataset_id)
                    
                    if not dataset:
                        raise HTTPException(status_code=404, detail="Dataset not found")
                
                # Load REAL training data from files
                return load_real_training_data(
                    dataset['dataset_name'],
                    dataset['symbols'],
                    dataset['total_sequences'],
                    dataset['feature_count'],
                    limit,
                    offset
                )
                
            except HTTPException:
                raise
            except Exception as e:
                logger.error(f"Error in get_dataset_sequences: {e}")
                raise HTTPException(status_code=500, detail=str(e))
        
        # Coverage Dashboard
        @app.get("/coverage", response_class=HTMLResponse)
        async def coverage_dashboard():
            return """
