apiVersion: batch/v1
kind: Job
metadata:
  name: setup-fmp-vendor-and-table
  namespace: ats-dev
  labels:
    app: ats-genai
    component: fmp-setup
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: fmp-setup
        image: postgres:15
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Setting up Financial Modeling Prep vendor and table..."
          
          # Connect to database and run setup
          PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME << 'EOF'
          
          -- Fix vendor sequence if needed
          SELECT setval('dev_vendors_id_seq', (SELECT MAX(id) FROM dev_vendors));
          
          -- Add Financial Modeling Prep vendor
          INSERT INTO dev_vendors (name, description) 
          VALUES ('financial_modeling_prep', 'Financial Modeling Prep API')
          ON CONFLICT (name) DO NOTHING;
          
          -- Create FMP daily prices table
          CREATE TABLE IF NOT EXISTS dev_daily_prices_fmp (
              id SERIAL PRIMARY KEY,
              instrument_id INTEGER NOT NULL REFERENCES dev_instruments(id),
              date DATE NOT NULL,
              close NUMERIC NOT NULL,
              volume BIGINT NOT NULL,
              dollar_volume BIGINT GENERATED ALWAYS AS (ROUND(close * volume::numeric)) STORED,
              open_price NUMERIC,
              high_price NUMERIC,
              low_price NUMERIC,
              adj_close NUMERIC,
              created_at TIMESTAMP WITHOUT TIME ZONE DEFAULT NOW(),
              updated_at TIMESTAMP WITHOUT TIME ZONE DEFAULT NOW(),
              UNIQUE(instrument_id, date)
          );
          
          -- Create indexes
          CREATE INDEX IF NOT EXISTS idx_daily_prices_fmp_date ON dev_daily_prices_fmp(date);
          CREATE INDEX IF NOT EXISTS idx_daily_prices_fmp_instrument_date ON dev_daily_prices_fmp(instrument_id, date);
          
          -- Verify setup
          SELECT 'Vendors:' as info;
          SELECT id, name, description FROM dev_vendors ORDER BY id;
          
          SELECT 'FMP Table created:' as info;
          SELECT table_name FROM information_schema.tables 
          WHERE table_name = 'dev_daily_prices_fmp';
          
          EOF
          
          echo "✅ Financial Modeling Prep setup completed!"
        env:
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"