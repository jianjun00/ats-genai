apiVersion: batch/v1
kind: Job
metadata:
  name: verify-fmp-data
  namespace: ats-dev
  labels:
    app: ats-genai
    component: fmp-verification
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: fmp-verification
        image: postgres:15
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Verifying Financial Modeling Prep data..."
          
          PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME << 'EOF'
          
          SELECT 'FMP Data Verification:' as info;
          
          SELECT 
              i.symbol,
              p.date,
              p.close,
              p.adj_close,
              p.volume,
              p.dollar_volume / 1000000 as dollar_volume_millions
          FROM dev_daily_prices_fmp p
          JOIN dev_instruments i ON p.instrument_id = i.id
          WHERE i.symbol IN ('AAPL', 'MSFT', 'GOOGL')
          ORDER BY i.symbol, p.date DESC
          LIMIT 15;
          
          SELECT 'Record Counts by Symbol:' as info;
          
          SELECT 
              i.symbol,
              COUNT(*) as record_count,
              MIN(p.date) as earliest_date,
              MAX(p.date) as latest_date
          FROM dev_daily_prices_fmp p
          JOIN dev_instruments i ON p.instrument_id = i.id
          WHERE i.symbol IN ('AAPL', 'MSFT', 'GOOGL')
          GROUP BY i.symbol
          ORDER BY i.symbol;
          
          EOF
          
          echo "✅ FMP data verification completed!"
        env:
        - name: DB_HOST
          value: "postgres-simple"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "dev_password"
        - name: DB_NAME
          value: "dev_db"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"