apiVersion: batch/v1
kind: CronJob
metadata:
  name: ats-intg-database-backup
  namespace: ats-intg
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM (1 hour after dev)
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: postgres-backup
            image: postgres:16
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -e  # Exit on any error
              
              # Function to send Slack notification
              send_slack_notification() {
                local message="$1"
                if [ -n "$SLACK_WEBHOOK_URL" ]; then
                  curl -X POST -H 'Content-type: application/json' \
                    --data "{\"text\":\"$message\"}" \
                    "$SLACK_WEBHOOK_URL" || echo "Failed to send Slack notification"
                else
                  echo "SLACK_WEBHOOK_URL not configured - skipping Slack notification"
                fi
              }
              
              # Trap errors and send failure notification
              trap 'send_slack_notification "❌ **ATS Integration Database Backup Failed** \n🚨 **Error Details:**\n• Database: \`intg_db\`\n• Environment: Integration\n• Timestamp: $(date)\n• Status: Failed\n• Error: Backup job terminated unexpectedly\n\n⚠️ Please check Kubernetes logs for details."' ERR
              
              echo "Starting database backup at $(date)"
              
              # Install curl for Slack notifications
              echo "Installing curl..."
              apt-get update && apt-get install -y curl
              
              # Create backup directory
              mkdir -p /backup
              
              # Generate backup filename with timestamp
              BACKUP_FILE="/backup/ats-intg-backup-$(date +%Y%m%d-%H%M%S).sql"
              
              # Test database connection first
              echo "Testing database connection..."
              PGPASSWORD=postgres psql \
                -h postgres \
                -p 5432 \
                -U postgres \
                -d intg_db \
                -c "SELECT 'Database connection successful', version();" || {
                  send_slack_notification "❌ **ATS Integration Database Backup Failed** \n🚨 **Error Details:**\n• Database: \`intg_db\`\n• Environment: Integration\n• Timestamp: $(date)\n• Status: Failed\n• Error: Cannot connect to database\n\n⚠️ Please check database status."
                  exit 1
                }
              
              # Create database backup
              echo "Creating custom format backup..."
              PGPASSWORD=postgres pg_dump \
                -h postgres \
                -p 5432 \
                -U postgres \
                -d intg_db \
                --verbose \
                --clean \
                --create \
                --format=custom \
                --file="${BACKUP_FILE}.custom" || {
                  send_slack_notification "❌ **ATS Integration Database Backup Failed** \n🚨 **Error Details:**\n• Database: \`intg_db\`\n• Environment: Integration\n• Timestamp: $(date)\n• Status: Failed\n• Error: pg_dump failed (custom format)\n\n⚠️ Please check database integrity."
                  exit 1
                }
              
              # Also create a plain SQL backup for readability
              echo "Creating plain SQL backup..."
              PGPASSWORD=postgres pg_dump \
                -h postgres \
                -p 5432 \
                -U postgres \
                -d intg_db \
                --verbose \
                --clean \
                --create \
                --format=plain \
                --file="${BACKUP_FILE}" || {
                  send_slack_notification "❌ **ATS Integration Database Backup Failed** \n🚨 **Error Details:**\n• Database: \`intg_db\`\n• Environment: Integration\n• Timestamp: $(date)\n• Status: Failed\n• Error: pg_dump failed (plain format)\n\n⚠️ Please check database integrity."
                  exit 1
                }
              
              # Compress the plain SQL backup
              echo "Compressing SQL backup..."
              gzip "${BACKUP_FILE}"
              
              echo "Backup completed successfully:"
              echo "Custom format: ${BACKUP_FILE}.custom"
              echo "Compressed SQL: ${BACKUP_FILE}.gz"
              
              # List backup files
              ls -la /backup/
              
              # Show backup file sizes
              du -h /backup/*
              
              # Verify backup integrity
              echo "Verifying backup integrity..."
              PGPASSWORD=postgres pg_restore --list "${BACKUP_FILE}.custom" > /tmp/backup_verify.txt
              OBJECT_COUNT=$(grep -c ';' /tmp/backup_verify.txt)
              echo "Backup contains $OBJECT_COUNT objects"
              
              echo "Database backup completed at $(date)"
              
              # Send Slack notification on backup completion
              BACKUP_SIZE=$(du -h "${BACKUP_FILE}.custom" | cut -f1)
              COMPRESSED_SIZE=$(du -h "${BACKUP_FILE}.gz" | cut -f1)
              
              send_slack_notification "✅ **ATS Integration Database Backup Completed** \n📊 **Backup Details:**\n• Database: \`intg_db\`\n• Environment: Integration 🧪\n• Custom Format: ${BACKUP_SIZE} (${OBJECT_COUNT} objects)\n• Compressed SQL: ${COMPRESSED_SIZE}\n• Timestamp: $(date)\n• Status: Success ✅\n\n📁 Backup files stored in persistent volume.\n🔍 Backup integrity verified."
            env:
            - name: PGPASSWORD
              value: "postgres"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-webhook-secret
                  key: webhook-url
                  optional: true
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
          volumes:
          - name: backup-storage
            hostPath:
              path: /host-data/backups/ats-intg
              type: DirectoryOrCreate
          restartPolicy: OnFailure