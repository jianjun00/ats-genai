apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-intg-pv
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /home/jianjun/ats-data/postgres-intg
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ats-intg
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Ti
  volumeName: postgres-intg-pv
  storageClassName: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ats-intg
data:
  POSTGRES_DB: "intg_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: ats-intg
data:
  init-db.sql: |
    -- Initialize database for integration environment
    CREATE EXTENSION IF NOT EXISTS timescaledb;
    
    -- Core tables for universe management
    CREATE TABLE IF NOT EXISTS intg_universe (
        id SERIAL PRIMARY KEY,
        name TEXT UNIQUE NOT NULL,
        description TEXT,
        created_at TIMESTAMP DEFAULT NOW()
    );
    
    CREATE TABLE IF NOT EXISTS intg_universe_membership (
        id SERIAL PRIMARY KEY,
        universe_id INTEGER NOT NULL REFERENCES intg_universe(id),
        symbol TEXT NOT NULL,
        start_at DATE NOT NULL,
        end_at DATE,
        UNIQUE(universe_id, symbol, start_at)
    );
    
    -- Instrument and pricing tables
    CREATE TABLE IF NOT EXISTS intg_instruments (
        id SERIAL PRIMARY KEY,
        symbol TEXT UNIQUE NOT NULL
    );
    
    CREATE TABLE IF NOT EXISTS intg_instrument_xrefs (
        id SERIAL PRIMARY KEY,
        instrument_id INTEGER NOT NULL REFERENCES intg_instruments(id),
        vendor_id INTEGER NOT NULL,
        vendor_symbol TEXT NOT NULL,
        UNIQUE(instrument_id, vendor_id)
    );
    
    CREATE TABLE IF NOT EXISTS intg_daily_prices_polygon (
        id SERIAL PRIMARY KEY,
        instrument_id INTEGER NOT NULL REFERENCES intg_instruments(id),
        date DATE NOT NULL,
        close DECIMAL NOT NULL,
        volume BIGINT NOT NULL,
        dollar_volume BIGINT GENERATED ALWAYS AS (ROUND(close * volume)) STORED,
        UNIQUE(instrument_id, date)
    );
    
    -- Convert to hypertable for time-series optimization
    SELECT create_hypertable('intg_daily_prices_polygon', 'date', if_not_exists => TRUE);
    
    -- Create default universe for integration testing
    INSERT INTO intg_universe (id, name, description) VALUES 
    (1, 'integration_test', 'Integration testing universe')
    ON CONFLICT (name) DO NOTHING;
    
    -- Grant permissions
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO postgres;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO postgres;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ats-intg
  labels:
    app: postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ats-intg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: timescale/timescaledb:latest-pg14
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgres-config
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: postgres
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U postgres -d intg_db
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U postgres -d intg_db
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
