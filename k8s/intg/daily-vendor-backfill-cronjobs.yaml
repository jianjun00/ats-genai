  polygon-api-key: d2ZyY1pOWDNaSkp0NTVPcl9DbUJYZGE4RzhlOHRBQkQ=  # wfrcZNX3ZJJt55Or_CmBXda8G8e8tABD
  eodhd-api-key: Njc1YjVhMzNiMzZmNDMuNjc4MjU3NjM=  # 675b5a33b36f43.67825763

---
# Secret for Slack notifications (optional)
