apiVersion: batch/v1
kind: Job
metadata:
  name: test-analytics-connectivity
  namespace: ats-dev
  labels:
    app: ats-analytics
    component: connectivity-test
    environment: dev
spec:
  ttlSecondsAfterFinished: 1800
  activeDeadlineSeconds: 300
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: test-analytics
        image: dragonflyer762/ats-genai:dev-latest
        command: ["python", "-c"]
        args:
        - |
          import sys
          sys.path.insert(0, 'src')
          
          print("🧪 Testing Analytics Connectivity in ats-dev k8s")
          
          # Test database connection
          try:
              from config.environment import Environment
              env = Environment()
              db_url = env.get_database_url()
              print(f"✅ Database URL configured: {db_url}")
              
              # Test analytics engine
              from analytics.portfolio_analytics import PortfolioAnalyticsEngine
              import asyncio
              
              async def test():
                  engine = PortfolioAnalyticsEngine(env=env)
                  await engine.initialize()
                  print("✅ Analytics engine initialized successfully with real database")
                  await engine.close()
                  
              asyncio.run(test())
              print("🎉 All analytics connectivity tests passed!")
              
          except Exception as e:
              print(f"❌ Analytics test failed: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
        env:
        - name: PYTHONPATH
          value: src
        - name: ENVIRONMENT
          value: dev
        - name: DB_CONNECTION_PARAMS
          value: sslmode=disable
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials-dev
              key: DB_NAME
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"