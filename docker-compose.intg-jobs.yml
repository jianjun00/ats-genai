version: '3.8'

services:
  # ATS Integration Environment Scheduled Jobs
  ats-intg-scheduler:
    image: dragonflyer762/ats-genai:latest
    container_name: ats-intg-scheduler
    restart: unless-stopped
    privileged: true
    
    environment:
      - PYTHONPATH=/workspace/src
      - ATS_DATA_PATH=/data
      - ATS_BACKUP_PATH=/backup
      - ATS_LOGS_PATH=/logs
      - ENVIRONMENT=intg
      - DB_HOST=ats-intg-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=intg_password
      - DB_NAME=intg_db
      
      # API Keys for all vendors
      - POLYGON_API_KEY=wfrcZNX3ZJJt55Or_CmBXda8G8e8tABD
      - FMP_API_KEY=Qf5MGG5HrOnEaWTumhVJzx3Onb3kw7Rr
      - TIINGO_API_KEY=5f40b4f36e171405746304ec0e5a6f3aa9ca77e5
      - ALPHA_VANTAGE_API_KEY=9GI0NZ3V4VNFX271
      
      # Migration and Job configuration
      - AUTO_MIGRATION_ENABLED=true
      - DEV_DB_HOST=172.17.0.1
      - DEV_DB_PORT=3434  # Updated to reference ATS-DEV on 300x range
      - DEV_DB_USER=postgres
      - DEV_DB_PASSWORD=postgres
      - DEV_DB_NAME=dev_db
      - CRON_ENABLED=true
      - LOG_LEVEL=INFO
      - RATE_LIMIT_ENABLED=true
      - CHECKPOINT_ENABLED=true
    
    volumes:
      - ./:/workspace
      - /mnt/d/ats-data/intg:/data
      - /mnt/d/ats-backup/intg:/backup
      - /mnt/d/ats-logs/intg:/logs
      - /etc/localtime:/etc/localtime:ro
    
    working_dir: /workspace
    
    # Setup migration and cron jobs for daily data refresh
    command: ["python3", "scripts/intg_startup_manager.py"]
    
    # Note: Depends on ats-intg-postgres managed by run_intg.py
    
    networks:
      - ats-intg-network
    
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "cron"]
      interval: 300s
      timeout: 10s
      retries: 3

  # Note: Using ats-intg-postgres managed by run_intg.py on port 5433

  # Analytics Service (Real Analytics Dashboard)
  ats-intg-analytics:
    image: dragonflyer762/ats-genai:latest
    container_name: ats-intg-analytics
    restart: unless-stopped
    
    environment:
      - PYTHONPATH=/workspace/src
      - ENVIRONMENT=intg
      - PORT=4000
      - DB_HOST=172.17.0.1  # Connect to ats-intg-postgres with data
      - DB_PORT=5433        # Port where ats-intg-postgres runs
      - DB_USER=postgres
      - DB_PASSWORD=intg_password
      - DB_NAME=intg_db
    
    ports:
      - "4000:4000"  # ATS-INTG Analytics Service
    
    volumes:
      - ./:/workspace
      - /mnt/d/ats-logs/intg:/logs
    
    working_dir: /workspace
    
    command: >
      bash -c "
        echo '🚀 Starting ATS-INTG Analytics Service on port 4000...' &&
        python src/services/analytics_service.py
      "
    
    depends_on:
      - ats-intg-scheduler
    
    networks:
      - ats-intg-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ats-intg-network:
    driver: bridge
    name: ats-intg-network

# Note: Database volumes managed by run_intg.py