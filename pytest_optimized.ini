[tool:pytest]
# Optimized pytest configuration for ATS Platform
# Based on analysis of 300+ test files and performance optimization

# Test collection and execution
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting optimizations
addopts = 
    -ra
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
    --durations=10
    --maxfail=3
    --no-header
    --no-summary

# Performance optimizations
# Use: pytest -n auto for parallel execution
# Use: pytest --lf for last-failed tests only
# Use: pytest --ff for failed-first execution order

# Custom markers for test organization and filtering
markers = 
    unit: Unit tests (fast, isolated, mocked dependencies)
    integration: Integration tests (slower, real dependencies)
    slow: Slow running tests (>5 seconds)
    database: Tests requiring database connection
    api: Tests calling external APIs (require API keys)
    regression: Regression tests for bug prevention
    smoke: Smoke tests for basic functionality
    comprehensive: Comprehensive test suites with full coverage

# Warning filters to reduce noise
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::RuntimeWarning:gin.*
    ignore::UserWarning:matplotlib.*
    ignore::FutureWarning:pandas.*
    
# Test discovery optimizations
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    node_modules
    venv
    env

# Timeout settings for long-running tests
timeout = 300
timeout_method = thread

# Log configuration for debugging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# JUnit XML for CI/CD integration
junit_suite_name = ATS_Platform_Tests
junit_logging = all
junit_log_passing_tests = false

# Coverage integration (when using pytest-cov)
# Use: pytest --cov=src --cov-report=html --cov-report=term-missing
addopts = 
    --cov-config=.coveragerc
    --cov-fail-under=80

# Test environment variables
env = 
    ENVIRONMENT = test
    TESTING = true
    DB_DISABLE_CONNECT_TIMEOUT = true
    USE_MOCK_DATA = true
    DISABLE_METRICS = true
    DISABLE_CACHING = true