apiVersion: v1
kind: Service
metadata:
  name: data-agent-service
  namespace: market-data
  labels:
    app: data-agent
spec:
  selector:
    app: data-agent
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 8080
    targetPort: 8080
    name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: market-data
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: market-data-ingress
  namespace: market-data
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - http:
      paths:
      - path: /data-agent(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: data-agent-service
            port:
              number: 8080
      - path: /grafana(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: data-agent-service
            port:
              number: 8080
