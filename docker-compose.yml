version: '3.9'
services:
  db:
    image: timescale/timescaledb:latest-pg14
    container_name: timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: market-forecast-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TSDB_URL: postgresql://postgres:dev_password@db:5432/dev_db
      GIN_CONFIG: /app/config/app_docker.gin
    ports:
      - "8090:8090"
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8090"]
    volumes:
      - .:/app

volumes:
  pgdata:
