global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager-intg:9093

scrape_configs:
  - job_name: 'prometheus-intg'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ats-data-quality-exporter-intg'
    static_configs:
      - targets: ['ats-data-quality-exporter-intg:8080']
    scrape_interval: 30s
    metrics_path: /metrics

  - job_name: 'node-exporter-intg'
    static_configs:
      - targets: ['node-exporter-intg:9100']

  - job_name: 'ats-intg-metrics'
    static_configs:
      - targets: ['ats-intg-prometheus-metrics:8080']
    scrape_interval: 30s
    metrics_path: /metrics