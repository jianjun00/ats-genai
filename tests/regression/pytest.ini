[tool:pytest]
# Pytest configuration for regression tests

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test types
markers =
    integration: Integration tests (may require database connection)
    slow: Slow tests that may take longer to run
    security: Security-related regression tests
    schema: Database schema compatibility tests

# Test output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum version requirements
minversion = 6.0