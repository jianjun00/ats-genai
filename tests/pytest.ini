[tool:pytest]
# Pytest configuration for Real-time Collection System Tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = 
    tests/market_data/realtime
    tests/integration
    tests/performance  
    tests/quality
    tests/e2e

# Minimum version requirements
minversion = 6.0

# Add options for test execution
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --ignore=tests/archive
    
# Async test timeout (30 seconds)
asyncio_timeout = 30

# Test markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests with database and services
    performance: Performance and load testing
    quality: Data quality validation tests  
    e2e: End-to-end workflow tests
    slow: Tests that take longer than 10 seconds
    requires_db: Tests that require database connection
    requires_api: Tests that require external API access

# Filtering options
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:gin.*

# Coverage reporting (if pytest-cov is installed)
coverage_report_term_missing = true
coverage_report_html = true
coverage_html_dir = tests/reports/coverage
coverage_fail_under = 80