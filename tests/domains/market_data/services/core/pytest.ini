[tool:pytest]
# Configuration for UnifiedMarketDataManager Golden Tests

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async testing
asyncio_mode = auto

# Markers
markers =
    golden: Golden file regression tests
    integration: Integration tests with real data
    slow: Slow-running tests

# Output formatting
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
# Timeout for long-running tests
timeout = 300

# Async timeout
asyncio_default_fixture_loop_scope = function