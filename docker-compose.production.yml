version: '3.8'

networks:
  ats-network:
    external: true

volumes:
  postgres_data_prod:
  ats_logs_prod:

services:
  ats-prod-postgres:
    image: timescale/timescaledb:latest-pg13
    container_name: ats-prod-postgres
    networks:
      - ats-network
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-prod_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-YOUR_PRODUCTION_PASSWORD_HERE}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-prod_db}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ats-prod-analytics:
    image: dragonflyer762/ats-genai:latest
    container_name: ats-prod-analytics
    networks:
      - ats-network
    ports:
      - "4000:3000"
    environment:
      # Database Configuration
      DB_HOST: ats-prod-postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-YOUR_PRODUCTION_PASSWORD_HERE}
      DB_NAME: ${DB_NAME:-prod_db}
      
      # Agent Configuration
      AGENT_ENVIRONMENT: production
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_MONITORING_INTERVAL: ${AGENT_MONITORING_INTERVAL:-300}
      AGENT_MAX_CONCURRENT_WORKFLOWS: ${AGENT_MAX_CONCURRENT_WORKFLOWS:-20}
      
      # API Keys
      POLYGON_API_KEY: ${POLYGON_API_KEY:-YOUR_POLYGON_API_KEY_HERE}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-YOUR_TIINGO_API_KEY_HERE}
      EODHD_API_KEY: ${EODHD_API_KEY:-YOUR_EODHD_API_KEY_HERE}
      
      # Alert Configuration
      ENABLE_EMAIL_NOTIFICATIONS: ${ENABLE_EMAIL_NOTIFICATIONS:-true}
      ENABLE_SLACK_NOTIFICATIONS: ${ENABLE_SLACK_NOTIFICATIONS:-true}
      EMAIL_SMTP_SERVER: ${EMAIL_SMTP_SERVER:-smtp.your-company.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-alerts@your-company.com}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-YOUR_EMAIL_PASSWORD_HERE}
      EMAIL_RECIPIENTS: ${EMAIL_RECIPIENTS:-team@your-company.com,ops@your-company.com}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-#data-quality-alerts}
      
      # Monitoring Thresholds
      CPU_WARNING_THRESHOLD: ${CPU_WARNING_THRESHOLD:-70}
      CPU_CRITICAL_THRESHOLD: ${CPU_CRITICAL_THRESHOLD:-85}
      MEMORY_WARNING_THRESHOLD: ${MEMORY_WARNING_THRESHOLD:-80}
      MEMORY_CRITICAL_THRESHOLD: ${MEMORY_CRITICAL_THRESHOLD:-90}
      DISK_WARNING_THRESHOLD: ${DISK_WARNING_THRESHOLD:-85}
      DISK_CRITICAL_THRESHOLD: ${DISK_CRITICAL_THRESHOLD:-95}
      
      # Performance Configuration
      MAX_NOTIFICATIONS_PER_HOUR: ${MAX_NOTIFICATIONS_PER_HOUR:-20}
      ALERT_COOLDOWN_MINUTES: ${ALERT_COOLDOWN_MINUTES:-30}
      STALL_THRESHOLD_MINUTES: ${STALL_THRESHOLD_MINUTES:-60}
      
      # Logging Configuration
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      STRUCTURED_LOGGING: ${STRUCTURED_LOGGING:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Security Configuration
      ENABLE_API_AUTH: ${ENABLE_API_AUTH:-false}
      API_SECRET_KEY: ${API_SECRET_KEY:-YOUR_SECRET_KEY_HERE}
      
      # Python Configuration
      PYTHONPATH: /workspace/src
      ENVIRONMENT: production
      
    volumes:
      - /home/jianjun/ats-genai-data:/workspace
      - /mnt/d/ats-data:/data
      - /mnt/d/ats-backup:/backup
      - ats_logs_prod:/workspace/logs
    depends_on:
      ats-prod-postgres:
        condition: service_healthy
    command: ["python", "src/services/data_quality_analytics_service.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  ats-prod-agent:
    image: dragonflyer762/ats-genai:latest
    container_name: ats-prod-agent
    networks:
      - ats-network
    environment:
      # Database Configuration
      DB_HOST: ats-prod-postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-YOUR_PRODUCTION_PASSWORD_HERE}
      DB_NAME: ${DB_NAME:-prod_db}
      
      # Agent Configuration
      AGENT_ENVIRONMENT: production
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_MONITORING_INTERVAL: ${AGENT_MONITORING_INTERVAL:-300}
      AGENT_MAX_CONCURRENT_WORKFLOWS: ${AGENT_MAX_CONCURRENT_WORKFLOWS:-20}
      
      # API Keys
      POLYGON_API_KEY: ${POLYGON_API_KEY:-YOUR_POLYGON_API_KEY_HERE}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-YOUR_TIINGO_API_KEY_HERE}
      EODHD_API_KEY: ${EODHD_API_KEY:-YOUR_EODHD_API_KEY_HERE}
      
      # Alert Configuration
      ENABLE_EMAIL_NOTIFICATIONS: ${ENABLE_EMAIL_NOTIFICATIONS:-true}
      ENABLE_SLACK_NOTIFICATIONS: ${ENABLE_SLACK_NOTIFICATIONS:-true}
      EMAIL_SMTP_SERVER: ${EMAIL_SMTP_SERVER:-smtp.your-company.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-alerts@your-company.com}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-YOUR_EMAIL_PASSWORD_HERE}
      EMAIL_RECIPIENTS: ${EMAIL_RECIPIENTS:-team@your-company.com,ops@your-company.com}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-#data-quality-alerts}
      
      # Python Configuration
      PYTHONPATH: /workspace/src
      ENVIRONMENT: production
      
    volumes:
      - /home/jianjun/ats-genai-data:/workspace
      - /mnt/d/ats-data:/data
      - /mnt/d/ats-backup:/backup
      - ats_logs_prod:/workspace/logs
    depends_on:
      ats-prod-postgres:
        condition: service_healthy
      ats-prod-analytics:
        condition: service_healthy
    command: ["python", "src/agents/data_quality_agent.py", "--mode", "continuous"]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://ats-prod-analytics:3000/agent/status').raise_for_status()"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M