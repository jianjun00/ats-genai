version: '3.8'

# Production ATS Platform Configuration
# Optimized for security, performance, and reliability

name: ats-platform-prod

services:
  ats-postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ats-postgres-prod
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/data/pgdata
      
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      
    secrets:
      - db_password
      
    networks:
      - ats-backend
      
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '2.0'
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
        
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  ats-analytics:
    image: dragonflyer762/ats-genai:latest
    container_name: ats-analytics-prod
    restart: unless-stopped
    
    environment:
      PYTHONPATH: /workspace/src
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DB_HOST: ats-postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      
    env_file:
      - .env.prod
      
    secrets:
      - db_password
      - polygon_api_key
      - tiingo_api_key
      
    volumes:
      - ./:/workspace:ro
      - ats-logs:/logs
      - ats-data:/data
      
    ports:
      - "3000:3000"
      
    networks:
      - ats-backend
      - ats-frontend
      
    depends_on:
      ats-postgres:
        condition: service_healthy
        
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
          
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      
  ats-nginx:
    image: nginx:alpine
    container_name: ats-nginx-prod
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
      
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      
    networks:
      - ats-frontend
      
    depends_on:
      - ats-analytics
      
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ats-backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
  
  ats-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16

volumes:
  postgres-data:
    driver: local
  ats-data:
    external: true
  ats-logs:
    external: true

secrets:
  db_password:
    file: ./secrets/db_password.txt
  polygon_api_key:
    file: ./secrets/polygon_api_key.txt
  tiingo_api_key:
    file: ./secrets/tiingo_api_key.txt
